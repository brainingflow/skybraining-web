<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>簡易報名名單 — 強腦力 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;--mute:#8a8ea6;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:clamp(24px,2.8vw,28px);line-height:1.08;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:16px;font-size:14.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,input{padding:9px 12px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);}
  select:focus,input:focus{outline:none;border-color:var(--orange);}
  .btn{font-family:var(--round);font-weight:700;font-size:14px;padding:9px 16px;border-radius:24px;border:none;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);}
  .btn-sm{font-size:12.5px;padding:6px 12px;border-radius:18px;}
  .msg{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px;}
  th,td{border-bottom:1px solid var(--hair);padding:10px 12px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;background:#fff;}
  td.t{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;}
  td .note{width:100%;min-width:160px;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .demo{background:#FFF6DC;color:#8a6d1a;text-align:center;font-size:13px;padding:8px 14px;border-bottom:1px solid #f0dfa8;}
</style>
</head>
<body>
<nav><div class="nav-in"><span class="brand"><span class="b"></span>強腦力 後台</span><a href="member.html">← 會員中心</a></div></nav>
<div class="tabs"><div class="tabs-in">
  <a href="admin.html">總覽・銷售</a>
  <a href="admin-courses.html">課程管理</a>
  <a href="admin-contacts.html">名單管理</a>
  <a href="admin-funv.html">婦女再就業報名</a>
  <a href="admin-broadcast.html">群發信</a>
  <a href="admin-landings.html">廣告頁</a>
  <a href="admin-admins.html">管理員</a>
</div></div>
<div id="content"><div class="state"><div class="spin"></div>確認管理員權限中…</div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const DEMO=/(^|[#&])demo=1([&]|$)/.test(location.hash);
  /* key 存進資料庫，name 是畫面與 CSV 顯示的字，要改名只改 name */
  const TAGS=[
    { key:'',       name:'未標記' },
    { key:'yellow', name:'待確認' },
    { key:'green',  name:'已確認' },
    { key:'gray',   name:'不參加' }
  ];
  const DEMO_ROWS=[
    { id:'d1', event:'心智圖講師班 11/7 全天', name:'示範一', phone:'0912000001', address:'高雄市左營區示範路 1 號', created_at:'2026-10-22T10:05:00+08:00', note:'', tag:'' },
    { id:'d2', event:'心智圖講師班 11/7 全天', name:'示範二', phone:'07-0000002', address:'高雄市鼓山區示範路 2 號', created_at:'2026-10-22T11:20:00+08:00', note:'已打電話', tag:'green' }
  ];
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=(s)=>{ if(!s) return ''; const d=new Date(s); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
  const tagName=(k)=>(TAGS.find(t=>t.key===(k||''))||TAGS[0]).name;

  (async ()=>{
    if(DEMO){
      document.body.insertAdjacentHTML('afterbegin','<div class="demo">示範模式：下面是假資料，改動不會存進資料庫</div>');
    }else{
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
      const { data:isAdm } = await supabase.rpc('is_admin');
      if(isAdm!==true){
        $('content').innerHTML=`<div class="gate"><h2>非管理員帳號</h2><p>這個頁面僅限管理員使用。你目前登入的是 ${esc(session.user.email)}。</p><p><a href="member.html">← 回會員中心</a></p></div>`;
        return;
      }
    }

    $('content').innerHTML=`
      <div class="wrap">
        <div class="h">簡易報名名單</div>
        <div class="sub">只收姓名、電話、地址的活動報名頁都寫進這裡（例如心智圖講師班 11/7）。標記與備註改完按該列的「儲存」。匯出 CSV 匯的是目前篩選的結果。</div>
        <div class="card">
          <div class="row-top">
            <div class="filters">
              <select id="fEvent"><option value="">全部活動</option></select>
              <span id="cnt" style="font-size:14px;color:var(--ink-soft);"></span>
            </div>
            <div class="filters">
              <button class="btn btn-ghost" id="btnReload">重新整理</button>
              <button class="btn btn-ghost" id="btnExport">⬇ 匯出 CSV</button>
            </div>
          </div>
          <div id="listWrap"><div class="state"><div class="spin"></div>載入名單中…</div></div>
          <div class="msg" id="msg"></div>
        </div>
      </div>`;

    let rows=[];
    const msg=(t,type)=>{ const m=$('msg'); m.className='msg show '+type; m.textContent=t; };
    const view=()=>{ const ev=$('fEvent').value; return ev ? rows.filter(r=>r.event===ev) : rows; };

    function fillEvents(){
      const sel=$('fEvent'), cur=sel.value;
      const evs=[...new Set(rows.map(r=>r.event))];
      sel.innerHTML='<option value="">全部活動</option>'+evs.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
      if(evs.includes(cur)) sel.value=cur;
    }

    function render(){
      const v=view();
      $('cnt').textContent='共 '+v.length+' 筆';
      if(!v.length){ $('listWrap').innerHTML='<div class="empty">目前沒有報名資料。</div>'; return; }
      $('listWrap').innerHTML=`<div class="tbl-scroll"><table><thead><tr><th>報名時間</th><th>活動</th><th>姓名</th><th>電話</th><th>地址</th><th>標記</th><th>備註</th><th></th></tr></thead><tbody>${v.map(r=>`
        <tr data-id="${esc(r.id)}">
          <td class="t">${esc(fmt(r.created_at))}</td>
          <td>${esc(r.event)}</td>
          <td><b>${esc(r.name)}</b></td>
          <td><a href="tel:${esc(String(r.phone).replace(/[^\d+]/g,''))}">${esc(r.phone)}</a></td>
          <td>${esc(r.address)}</td>
          <td><select class="tag">${TAGS.map(t=>`<option value="${t.key}"${(r.tag||'')===t.key?' selected':''}>${esc(t.name)}</option>`).join('')}</select></td>
          <td><input class="note" type="text" value="${esc(r.note||'')}" placeholder="打過電話、確認地點…"></td>
          <td><button class="btn btn-primary btn-sm save">儲存</button></td>
        </tr>`).join('')}</tbody></table></div>`;
      $('listWrap').querySelectorAll('.save').forEach(b=>b.addEventListener('click',()=>save(b.closest('tr'),b)));
    }

    async function save(tr,b){
      const id=tr.getAttribute('data-id');
      const patch={ tag:tr.querySelector('.tag').value||null, note:tr.querySelector('.note').value.trim()||null };
      b.disabled=true;
      if(DEMO){
        Object.assign(rows.find(r=>r.id===id),patch);
        b.disabled=false; msg('已儲存（示範模式，沒有寫進資料庫）。','ok'); return;
      }
      const { error }=await supabase.from('simple_signups').update(patch).eq('id',id);
      b.disabled=false;
      if(error){ msg('儲存失敗：'+error.message,'error'); return; }
      Object.assign(rows.find(r=>r.id===id),patch);
      msg('已儲存。','ok');
    }

    async function load(){
      $('listWrap').innerHTML='<div class="state"><div class="spin"></div>載入名單中…</div>';
      if(DEMO){ rows=DEMO_ROWS.slice(); }
      else{
        const { data, error }=await supabase.from('simple_signups').select('id,event,name,phone,address,created_at,note,tag').order('created_at',{ ascending:false }).limit(5000);
        if(error){
          const hint=/simple_signups/.test(error.message||'') ? '（資料表還沒建立：請先在 Supabase SQL Editor 貼上 supabase/sql/2026-10-22_simple_signups.sql）' : '';
          $('listWrap').innerHTML=`<div class="empty">載入失敗：${esc(error.message)}${esc(hint)}</div>`; return;
        }
        rows=data||[];
      }
      fillEvents(); render();
    }

    function exportCsv(){
      const v=view();
      const cell=(s)=>{ s=String(s==null?'':s); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
      const lines=[['報名時間','活動','姓名','電話','地址','標記','備註'].join(',')]
        .concat(v.map(r=>[fmt(r.created_at),r.event,r.name,r.phone,r.address,tagName(r.tag),r.note||''].map(cell).join(',')));
      // 開頭 BOM 讓 Excel 用 UTF-8 開，中文才不會亂碼
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{ type:'text/csv;charset=utf-8;' }));
      const ev=$('fEvent').value;
      a.download='強腦力-簡易報名'+(ev?'-'+ev.replace(/[\\/:*?"<>|]/g,'-'):'')+'.csv';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
      msg('已匯出 '+v.length+' 筆。','ok');
    }

    $('fEvent').addEventListener('change',render);
    $('btnReload').addEventListener('click',load);
    $('btnExport').addEventListener('click',exportCsv);
    load();
  })();
</script>
</body>
</html>
