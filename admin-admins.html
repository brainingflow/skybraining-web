<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>管理員 — 強腦力 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;--mute:#8a8ea6;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--violet:#7C6CF0;--violet2:#4B37D8;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:clamp(24px,2.8vw,28px);line-height:1.08;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:16px;font-size:14.5px;}
  .how{background:linear-gradient(135deg,#fff8ec,#fdeede);border:1px solid rgba(255,176,32,.32);border-radius:14px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:22px;}
  .how b{color:var(--indigo);}
  .how code{background:rgba(21,23,49,.07);padding:1px 6px;border-radius:6px;font-size:12.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .card h2{font-size:17px;color:var(--indigo);display:flex;align-items:center;gap:9px;}
  .card h2 .bar{width:5px;height:19px;border-radius:3px;background:linear-gradient(var(--amber),var(--orange));}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .fld{flex:1;min-width:210px;}
  input{width:100%;padding:11px 13px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  input:focus{outline:none;border-color:var(--orange);}
  label{display:block;font-weight:700;font-size:13px;color:var(--indigo);margin:0 0 6px;font-family:var(--round);}
  .btn{font-family:var(--round);font-weight:700;font-size:14px;padding:10px 18px;border-radius:24px;border:none;cursor:pointer;transition:transform .15s;white-space:nowrap;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 10px 24px rgba(22,176,168,.3);}
  .btn-orange{color:#fff;background:linear-gradient(135deg,#FF8A3D,#FFB020);}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);}
  .btn-violet{color:#fff;background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .btn-sm{font-size:12.5px;padding:6px 12px;border-radius:18px;}
  .btn-del{color:var(--err);background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.22);}
  .msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:13.5px;display:none;white-space:pre-wrap;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);border:1px solid rgba(22,176,168,.28);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:700px;}
  th,td{border-bottom:1px solid var(--hair);padding:11px 12px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;background:#fff;}
  tbody tr:hover{background:var(--paper);}
  .em{font-family:var(--round);font-weight:700;color:var(--indigo);word-break:break-all;}
  .sm{color:var(--ink-soft);font-size:12px;}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap;}
  .st.on{background:rgba(22,176,168,.14);color:#0d8a83;}
  .st.wait{background:rgba(255,176,32,.16);color:#a35f00;}
  .st.owner{background:rgba(124,108,240,.14);color:#4B37D8;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<nav><div class="nav-in"><span class="brand"><span class="b"></span>強腦力 後台</span><a href="member.html">← 會員中心</a></div></nav>
<div class="tabs"><div class="tabs-in">
  <a href="admin.html">總覽・銷售</a>
  <a href="admin-courses.html">課程管理</a>
  <a href="admin-contacts.html">名單管理</a>
  <a href="admin-broadcast.html">群發信</a>
  <a href="admin-landings.html">廣告頁</a>
  <a href="admin-admins.html" class="active">管理員</a>
</div></div>
<div id="content"><div class="state"><div class="spin"></div>確認管理員權限中…</div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate=(s)=> s ? String(s).slice(0,10) : '';

  (async ()=>{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
    const { data:isAdm } = await supabase.rpc('is_admin');
    if(isAdm!==true){
      $('content').innerHTML=`<div class="gate"><h2>非管理員帳號</h2><p>這個頁面僅限管理員使用。你目前登入的是 ${esc(session.user.email)}。</p><p><a href="member.html">← 回會員中心</a></p></div>`;
      return;
    }

    $('content').innerHTML=`
      <div class="wrap">
        <div class="h">管理員</div>
        <div class="sub">誰可以進這個後台，由這一頁決定。用 Email 新增，對方拿那個 Email 登入強腦力就會看到後台。</div>
        <div class="how">
          <b>怎麼運作：</b>新增後，對方只要用<b>同一個 Email</b> 註冊或登入 skybraining.com，會員中心就會出現「後台管理」入口。
          先新增再叫他註冊也可以——狀態會顯示<b>「等待對方註冊」</b>，等他註冊完就自動生效，不用你再回來按一次。
          站長帳號 <code>brainingflow@gmail.com</code> 是系統保留，永遠有權限、不能被移除。
        </div>

        <div class="card">
          <h2><span class="bar"></span>新增管理員</h2>
          <div class="form-row" style="margin-top:14px;">
            <div class="fld"><label>對方的 Email</label><input id="inEmail" type="email" placeholder="someone@example.com" autocomplete="off"></div>
            <div class="fld"><label>備註（選填，只有你看得到）</label><input id="inNote" type="text" placeholder="例如：助教小美"></div>
            <div><button class="btn btn-orange" id="btnAdd">＋ 新增管理員</button></div>
          </div>
          <div class="msg" id="addMsg"></div>
        </div>

        <div class="card">
          <div class="row-top">
            <h2><span class="bar"></span>目前的管理員（<span id="cnt">0</span>）</h2>
            <button class="btn btn-ghost btn-sm" id="btnReload">重新整理</button>
          </div>
          <div id="listWrap"><div class="state"><div class="spin"></div>載入中…</div></div>
        </div>

        <div class="card">
          <div class="row-top">
            <h2><span class="bar"></span>重複帳號檢查</h2>
            <button class="btn btn-ghost btn-sm" id="btnDup">檢查</button>
          </div>
          <div class="sub" style="margin-bottom:12px;">
            同一個 Email 如果不小心產生了兩個帳號（例如先用 Email 註冊、後來又用 Google 登入），會列在這裡。
            按「合併」會把兩邊的課程權限補齊成一樣——<b>只會補、不會刪任何資料</b>。
            一般情況下會員登入時系統就會自動合併，這裡只是給你檢查用。
          </div>
          <div id="dupWrap"><div class="empty">按「檢查」看有沒有重複帳號。</div></div>
        </div>
      </div>`;

    let admins=[];
    const msg=(t,type)=>{ const m=$('addMsg'); m.className='msg show '+type; m.textContent=t; };

    const render=()=>{
      $('cnt').textContent=admins.length;
      const box=$('listWrap');
      if(!admins.length){ box.innerHTML='<div class="empty">還沒有資料。請先在 Supabase 執行 admins.sql。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>Email</th><th>狀態</th><th>備註</th><th>新增者 / 日期</th><th>操作</th></tr></thead>
        <tbody>${admins.map(a=>`<tr>
          <td><div class="em">${esc(a.email)}</div></td>
          <td>${a.is_owner?'<span class="st owner">站長</span>':(a.has_account?'<span class="st on">已註冊・生效中</span>':'<span class="st wait">等待對方註冊</span>')}</td>
          <td class="sm">${esc(a.note||'')}</td>
          <td class="sm">${esc(a.added_by||'')}<br>${esc(fmtDate(a.created_at))}</td>
          <td>${(a.is_owner||a.is_me)?'<span class="sm">—</span>':`<button class="btn btn-sm btn-del" data-rm="${esc(a.email)}">移除</button>`}</td>
        </tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>remove(b.getAttribute('data-rm'), b));
    };

    const load=async ()=>{
      $('listWrap').innerHTML='<div class="state"><div class="spin"></div>載入中…</div>';
      const { data, error } = await supabase.rpc('admin_admins_list');
      if(error){ $('listWrap').innerHTML='<div class="empty" style="color:var(--err);">讀取失敗：'+esc(error.message)+'<br><span class="sm">如果訊息是找不到函式，代表 admins.sql 還沒在 Supabase 執行。</span></div>'; return; }
      admins=data||[]; render();
    };

    const remove=async (email, btn)=>{
      if(btn.getAttribute('data-armed')!=='1'){
        btn.setAttribute('data-armed','1'); btn.textContent='確認移除';
        setTimeout(()=>{ if(btn.isConnected){ btn.setAttribute('data-armed','0'); btn.textContent='移除'; } },3500);
        return;
      }
      btn.disabled=true;
      const { error } = await supabase.rpc('admin_admin_remove',{ p_email:email });
      if(error){ btn.disabled=false; msg('移除失敗：'+error.message,'error'); return; }
      msg('已移除管理員：'+email,'ok');
      await load();
    };

    $('btnAdd').onclick=async ()=>{
      const email=$('inEmail').value.trim().toLowerCase(), note=$('inNote').value.trim();
      if(!email || email.indexOf('@')<1){ msg('請輸入正確的 Email。','error'); return; }
      $('btnAdd').disabled=true; msg('新增中…','ok');
      const { data, error } = await supabase.rpc('admin_admin_add',{ p_email:email, p_note:note||null });
      $('btnAdd').disabled=false;
      if(error){ msg('新增失敗：'+error.message,'error'); return; }
      msg(data && data.has_account
          ? `✓ 已新增：${email}\n這個 Email 已經有強腦力帳號，他下次登入（或重新整理會員中心）就會看到後台。`
          : `✓ 已新增：${email}\n這個 Email 還沒註冊過強腦力。請他到 skybraining.com/login.html 用這個 Email 註冊，註冊完就自動有後台權限。`,
        'ok');
      $('inEmail').value=''; $('inNote').value='';
      await load();
    };
    $('btnReload').onclick=()=>load();

    // ── 重複帳號檢查 ─────────────────────────────
    const renderDup=(rows)=>{
      const box=$('dupWrap');
      if(!rows.length){ box.innerHTML='<div class="empty">✓ 沒有重複帳號，很乾淨。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>Email</th><th>帳號數</th><th>登入方式</th><th>課程權限筆數</th><th>操作</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td><div class="em">${esc(r.email)}</div></td>
          <td>${r.account_count}</td>
          <td class="sm">${esc(r.providers||'')}</td>
          <td>${r.total_courses}</td>
          <td><button class="btn btn-sm btn-violet" data-mg="${esc(r.email)}">合併</button></td>
        </tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('[data-mg]').forEach(b=>b.onclick=async ()=>{
        b.disabled=true; b.textContent='合併中…';
        const { data, error } = await supabase.rpc('admin_merge_email',{ p_email:b.getAttribute('data-mg') });
        if(error){ b.disabled=false; b.textContent='合併'; alert('合併失敗：'+error.message); return; }
        b.textContent='✓ 已合併';
        alert('已合併完成。\n涉及帳號：'+(data.accounts||0)+' 個\n補上的課程權限：'+(data.merged||0)+' 筆\n（沒有刪除任何資料）');
      });
    };
    $('btnDup').onclick=async ()=>{
      $('dupWrap').innerHTML='<div class="state"><div class="spin"></div>檢查中…</div>';
      const { data, error } = await supabase.rpc('admin_duplicate_accounts');
      if(error){ $('dupWrap').innerHTML='<div class="empty" style="color:var(--err);">檢查失敗：'+esc(error.message)+'<br><span class="sm">如果訊息是找不到函式，代表 account_merge.sql 還沒在 Supabase 執行。</span></div>'; return; }
      renderDup(data||[]);
    };

    load();
  })();
</script>
<div style="text-align:center;padding:26px 14px 30px;font-size:12.5px;color:#8b90a5;">© 2021 強腦力 SkyBraining LLC・skybraining.com・Sky強腦力media</div>
</body>
</html>
