<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員中心・我的課程 — 強腦力 SkyBraining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;
    --line-brand:#06C755;--hair:rgba(21,23,49,.1);
    --sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);--shadow-md:0 18px 44px rgba(21,23,49,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  .wrap{max-width:1160px;margin:0 auto;padding:0 clamp(20px,5vw,40px);}
  nav{background:rgba(250,249,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(20px,5vw,40px);max-width:1100px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:20px;color:var(--indigo);}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:var(--indigo);display:grid;place-items:center;box-shadow:var(--shadow-sm);}
  .logo-mark svg{width:22px;height:22px;}
  .wordmark{letter-spacing:1px;font-weight:800;}
  .wm-accent{background:linear-gradient(120deg,#FFB020,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav-right{display:flex;align-items:center;gap:14px;font-size:14px;}
  .user-menu{position:relative;}
  .user-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--round);font-weight:700;font-size:14px;color:var(--indigo);border:1.5px solid var(--hair);background:#fff;padding:7px 14px;border-radius:30px;cursor:pointer;transition:border-color .2s,box-shadow .2s;}
  .user-btn:hover,.user-menu.open .user-btn{border-color:var(--indigo);}
  .user-btn .uico{width:17px;height:17px;color:var(--ink-soft);flex:none;}
  .user-btn .caret{font-size:11px;color:var(--ink-soft);transition:transform .2s;}
  .user-menu.open .user-btn .caret{transform:rotate(180deg);}
  .user-dd{position:absolute;top:calc(100% + 8px);right:0;min-width:184px;background:#fff;border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow-md);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s;z-index:40;}
  .user-menu.open .user-dd{opacity:1;visibility:visible;transform:translateY(0);}
  .dd-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink);background:none;border:none;padding:11px 13px;border-radius:9px;cursor:pointer;transition:background .15s;text-decoration:none;}
  .dd-item:hover{background:var(--paper-2);}
  .dd-item.admin{color:var(--orange);font-weight:700;}
  .dd-item.danger{color:#d64545;}
  .dd-sep{height:1px;background:var(--hair);margin:5px 8px;border:none;}
  .acct-email{font-size:14px;color:var(--ink);background:var(--paper-2);border-radius:12px;padding:12px 15px;margin-bottom:12px;}
  .acct-email b{font-family:var(--round);color:var(--indigo);word-break:break-all;}
  .head{padding:48px 0 10px;}
  .hi{font-family:var(--round);font-weight:800;font-size:clamp(26px,4vw,38px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-top:6px;}
  .section-t{font-family:var(--round);font-weight:800;font-size:20px;color:var(--indigo);margin:40px 0 18px;display:flex;align-items:center;gap:10px;}
  .section-t .bar{width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--amber),var(--orange));}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:60px;}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:680px){.grid{grid-template-columns:1fr;}}
  .course{background:#fff;border:1px solid var(--hair);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
  .course:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
  .course-top{padding:22px 22px;color:#fff;position:relative;overflow:hidden;min-height:150px;box-sizing:border-box;}
  .course-top.amber{background:linear-gradient(135deg,#FFB020,#FF8A3D);}
  .course-top.teal{background:linear-gradient(135deg,#16B0A8,#0d8a83);}
  .course-top.violet{background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .course-top.indigo{background:linear-gradient(135deg,#22264f,#141330);}
  .course-top.rose{background:linear-gradient(135deg,#FF6B8B,#E23A63);}
  .course-top.gold{background:linear-gradient(135deg,#F5A623,#E0761B);}
  .course-top.grape{background:linear-gradient(135deg,#8E5BEE,#5B2AC6);}
  .course-top::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);}
  .course-lv{font-family:var(--round);font-weight:700;font-size:12px;background:rgba(255,255,255,.22);padding:4px 11px;border-radius:20px;position:relative;z-index:1;}
  .course-name{font-family:var(--round);font-weight:800;font-size:21px;line-height:1.35;margin-top:10px;position:relative;z-index:1;}
  .course-sub{font-size:13px;opacity:.9;position:relative;z-index:1;}
  .course-name.sm{font-size:17px;}
  .course-body{padding:20px 22px;display:flex;flex-direction:column;gap:13px;flex:1;}
  .status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;}
  .status.owned{color:var(--teal-deep);}
  .status.locked{color:var(--ink-soft);}
  .status .dot{width:8px;height:8px;border-radius:50%;}
  .status.owned .dot{background:var(--teal);}
  .status.locked .dot{background:#c9ccd8;}
  .course-actions{margin-top:auto;}
  .course-actions .btn{width:100%;justify-content:center;text-align:center;}
  .btn{font-family:var(--round);font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:30px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:none;transition:transform .2s,filter .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-watch{color:#fff;}
  .btn-watch.amber{background:linear-gradient(135deg,#FFB020,#FF8A3D);}
  .btn-watch.teal{background:linear-gradient(135deg,#16B0A8,#0d8a83);}
  .btn-watch.violet{background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .btn-watch.indigo{background:linear-gradient(135deg,#22264f,#141330);}
  .btn-watch.rose{background:linear-gradient(135deg,#FF6B8B,#E23A63);}
  .btn-watch.gold{background:linear-gradient(135deg,#F5A623,#E0761B);}
  .btn-watch.grape{background:linear-gradient(135deg,#8E5BEE,#5B2AC6);}
  .btn-buy{color:var(--indigo);background:var(--paper-2);}
  .btn-buy:hover{background:#e8e5da;}
  .state{padding:70px 0;text-align:center;color:var(--ink-soft);}
  .state .spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .foot-note{color:var(--ink-soft);font-size:13px;padding:0 0 50px;}
  .links-card{background:#fff;border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow-sm);padding:20px 26px;margin-bottom:44px;}
  .links-lead{font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;}
  .link-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--hair);}
  .link-row:first-of-type{border-top:none;}
  .link-info{display:flex;align-items:center;gap:11px;}
  .link-name{font-weight:700;font-family:var(--round);color:var(--indigo);font-size:15px;}
  .link-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .link-badge.on{color:var(--teal-deep);background:rgba(22,176,168,.12);}
  .link-badge.off{color:var(--ink-soft);background:var(--paper-2);}
  .link-btn{font-family:var(--round);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#FFB020,#FF8A3D);border:none;padding:9px 18px;border-radius:24px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .link-btn:hover{filter:brightness(1.03);}
  .link-btn.line{background:var(--line-brand);}
  .link-btn:disabled{opacity:.6;cursor:not-allowed;}
  .link-soon{font-size:12.5px;color:var(--ink-soft);}
  .link-msg{font-size:13px;padding-top:10px;display:none;}
  .link-msg.show{display:block;}
  .link-msg.err{color:#d64545;}
  .link-msg.ok{color:var(--teal-deep);}
  .merge-note{margin-top:26px;background:rgba(22,176,168,.1);border:1px solid rgba(22,176,168,.28);color:var(--teal-deep);border-radius:14px;padding:13px 17px;font-size:14px;}
  .mno{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--indigo);color:#fff;font-family:var(--round);font-weight:700;font-size:14px;padding:6px 15px;border-radius:24px;letter-spacing:.5px;}
  .mno .lb{font-size:11.5px;opacity:.7;font-weight:600;letter-spacing:0;}
  .id-card{background:linear-gradient(135deg,#22264f,#141330);color:#fff;border-radius:20px;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .id-card .k{font-size:12.5px;opacity:.65;letter-spacing:.5px;}
  .id-card .v{font-family:var(--round);font-weight:800;font-size:26px;letter-spacing:1.5px;}
  .id-card .r{text-align:right;font-size:13px;opacity:.8;line-height:1.6;}
  .link-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--paper-2);}
  .link-sub{font-size:12.5px;color:var(--ink-soft);}
  .link-btn.ghost{background:var(--paper-2);color:var(--ink-soft);}
  .link-actions{display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="brand" href="index.html"><span class="wordmark">強<span class="wm-accent">腦</span>力</span></a>
    <div class="nav-right">
      <a href="index.html" style="color:var(--ink-soft);font-weight:500;">← 回首頁</a>
      <div class="user-menu" id="userMenu">
        <button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false">
          <svg class="uico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20.5c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5" fill="currentColor"/></svg>
          使用者 <span class="caret">▾</span>
        </button>
        <div class="user-dd" id="userDd" role="menu">
          <a class="dd-item" href="#account" id="ddAccount" role="menuitem">使用者帳號</a>
          <a class="dd-item" href="account.html" role="menuitem">修改密碼</a>
          <span id="ddAdmin"></span>
          <hr class="dd-sep">
          <button class="dd-item danger" id="logout" role="menuitem">登出</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <div class="hi" id="hi">會員中心</div>
    <div class="sub">管理你的帳號、觀看已購買的課程。</div>
  </div>

  <div id="content">
    <div class="state"><div class="spin"></div>載入中…</div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL  = 'https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const LOGIN_PAGE = 'login.html';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = (id)=>document.getElementById(id);

  $('logout').onclick = async ()=>{ await supabase.auth.signOut(); location.href = LOGIN_PAGE; };
  const esc = (s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // 使用者下拉選單：點按鈕才展開，點外面或按 Esc 收起
  (function(){
    const menu=$('userMenu'), btn=$('userBtn');
    if(!menu||!btn) return;
    const close=()=>{ menu.classList.remove('open'); btn.setAttribute('aria-expanded','false'); };
    btn.onclick=(e)=>{ e.stopPropagation(); const o=menu.classList.toggle('open'); btn.setAttribute('aria-expanded',o?'true':'false'); };
    document.addEventListener('click',(e)=>{ if(!menu.contains(e.target)) close(); });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') close(); });
    const acc=$('ddAccount');
    if(acc) acc.onclick=(e)=>{ e.preventDefault(); close(); const t=$('account'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); };
  })();

  (async ()=>{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href = LOGIN_PAGE; return; }
    const user = session.user;

    // 讀 profile（家長暱稱）
    let name = user.email;
    const { data:prof } = await supabase.from('profiles').select('display_name,child_nickname').eq('id', user.id).maybeSingle();
    if(prof && prof.display_name) name = prof.display_name;
    // 管理員入口：改由資料庫的 admins 名單決定（後台「管理員」分頁可新增）
    try{
      const { data:isAdm } = await supabase.rpc('is_admin');
      if(isAdm===true){
        document.getElementById('ddAdmin').innerHTML='<a class="dd-item admin" href="admin.html" role="menuitem">後台管理</a>';
      }
    }catch(e){ /* 舊資料庫尚未部署 admins.sql 時靜默略過 */ }
    $('hi').textContent = `嗨，${name}！`;

    // 同一個 Email 的 Google／Email 帳號自動合併（只補課程權限、不刪任何資料）
    let mergedNow = 0;
    try{
      const { data:mg } = await supabase.rpc('account_merge_self');
      if(mg && mg.merged) mergedNow = mg.merged;
    }catch(e){ /* account_merge.sql 尚未部署時靜默略過 */ }

    // 會員編號：同一個人不管用 Email／Google／LINE 登入都是同一個編號
    let me = null;
    try{
      const { data:m } = await supabase.rpc('member_me');
      if(m && m.ok) me = m;
    }catch(e){ /* member_ids.sql 尚未部署時靜默略過 */ }
    if(me && me.member_no){
      const s = document.querySelector('.head .sub');
      if(s) s.insertAdjacentHTML('afterend',
        `<div class="mno"><span class="lb">會員編號</span>${esc(me.member_no)}</div>`);
    }

    // 讀所有課程 + 這個「會員編號」底下所有帳號的購買紀錄
    // （用 member_course_ids()，範圍跟上面的會員編號一致；
    //   直接查 enrollments 會受 RLS 影響，管理員會看到別人的課）
    const [{ data:courses, error:cErr }, { data:ownedIds }] = await Promise.all([
      supabase.from('courses').select('*').eq('is_published',true).order('sort_order'),
      supabase.rpc('member_course_ids')
    ]);
    if(cErr){ $('content').innerHTML = errBox('讀取課程時發生問題：'+cErr.message); return; }
    let owned;
    if(Array.isArray(ownedIds)){
      owned = new Set(ownedIds.map(x => (x && typeof x === 'object') ? x.member_course_ids : x));
    }else{
      // member_scope.sql 尚未部署時的退路：至少不要當掉
      const { data:enroll } = await supabase.from('enrollments').select('course_id,user_id');
      const uid = user.id;
      owned = new Set((enroll||[]).filter(e=>e.user_id===uid).map(e=>e.course_id));
    }

    const ownedCourses = (courses||[]).filter(c=>owned.has(c.id));
    const otherCourses = (courses||[]).filter(c=>!owned.has(c.id));

    let html = '';
    if(mergedNow > 0){
      html += `<div class="merge-note">✓ 你有多種登入方式使用同一個 Email，系統已自動整合成同一個帳號，並補上 ${mergedNow} 筆課程權限。以後用 Email 或 Google 登入，看到的都會一樣。</div>`;
    }
    html += `<div class="section-t"><span class="bar"></span>我的課程（${ownedCourses.length}）</div>`;
    if(ownedCourses.length){
      html += '<div class="grid">' + ownedCourses.map(c=>card(c,true)).join('') + '</div>';
    }else{
      html += `<div class="foot-note">你目前還沒有已開通的課程。下方是可選購的課程，或先加 LINE 免費試看。</div>`;
    }
    if(otherCourses.length){
      html += `<div class="section-t"><span class="bar"></span>探索更多課程</div>`;
      html += '<div class="grid">' + otherCourses.map(c=>card(c,false)).join('') + '</div>';
    }
    html += `<div id="acctLinks"></div>`;
    $('content').innerHTML = html;
    renderAccountLinks(user.email, me);
  })();

  // ── 帳號綁定：Email／Google／LINE 綁在同一個會員編號 ──
  const LINE_FN = SUPABASE_URL + '/functions/v1/line-auth';

  async function renderAccountLinks(email, me){
    const box = $('acctLinks');
    if(!box) return;

    // 這個 auth 帳號自己的登入方式
    let ids = [];
    try{
      const { data } = await supabase.auth.getUserIdentities();
      ids = (data && data.identities) ? data.identities : [];
    }catch(e){ /* 舊 session 可能不支援，靜默略過 */ }
    // 加上同一個會員編號底下、其他帳號的登入方式
    const provs = new Set(ids.map(i=>i.provider));
    if(me && Array.isArray(me.providers)) me.providers.forEach(p=>provs.add(p));
    const has = (p)=> provs.has(p);
    const line = me && me.line ? me.line : null;

    const row = (name, connected, sub, actionHtml)=>`
      <div class="link-row">
        <div class="link-info">
          <span class="link-name">${name}</span>
          <span class="link-badge ${connected?'on':'off'}">${connected?'已綁定':'未綁定'}</span>
          ${sub?`<span class="link-sub">${sub}</span>`:''}
        </div>
        <div class="link-actions">${actionHtml}</div>
      </div>`;

    let rows = '';
    rows += row('Email ／ 密碼登入', has('email'), has('email')? esc(email||'') : '',
      has('email') ? `<a class="link-btn ghost" href="account.html">改密碼</a>`
                   : `<a class="link-btn" href="account.html">設定密碼 →</a>`);
    rows += row('Google 登入', has('google'), '',
      has('google') ? '' : `<button class="link-btn" id="linkGoogle">連結 Google →</button>`);
    rows += row('LINE 登入', !!line,
      line ? `${line.picture_url?`<img class="link-avatar" src="${esc(line.picture_url)}" alt="">`:''}${esc(line.display_name||'')}` : '',
      line ? `<button class="link-btn ghost" id="unlinkLine">解除綁定</button>`
           : `<button class="link-btn line" id="linkLine">連結 LINE →</button>`);

    const idCard = (me && me.member_no) ? `
      <div class="id-card">
        <div><div class="k">會員編號 MEMBER NO.</div><div class="v">${esc(me.member_no)}</div></div>
        <div class="r">已綁定 ${provs.size + (line?1:0)} 種登入方式<br>已開通 ${me.courses||0} 門課程</div>
      </div>` : '';

    box.innerHTML = `
      <div class="section-t" id="account"><span class="bar"></span>使用者帳號</div>
      <div class="links-card">
        ${idCard}
        <div class="acct-email">目前登入帳號：<b>${esc(email||'（此帳號無 Email）')}</b></div>
        <p class="links-lead">下面三種登入方式，<b>綁定之後都會對應到上面同一個會員編號</b>——不管你今天用哪一個登入，看到的課程、紀錄都完全一樣。</p>
        ${rows}
        <div class="link-msg" id="linkMsg"></div>
      </div>`;

    const lmsg = (t,type)=>{ const m=$('linkMsg'); if(!m) return; m.className='link-msg show '+type; m.innerHTML=t; };

    // 剛從 LINE 綁定回來
    if(new URLSearchParams(location.search).get('line')==='ok'){
      lmsg('✓ LINE 已經綁到你的會員編號了，以後可以直接用 LINE 登入。','ok');
    }

    // Google：Supabase 原生 linkIdentity，會直接掛到同一個 auth 帳號
    const g = $('linkGoogle');
    if(g) g.onclick = async ()=>{
      g.disabled = true; g.textContent = '前往 Google…';
      const { error } = await supabase.auth.linkIdentity({ provider:'google' });
      if(error){ g.disabled=false; g.textContent='連結 Google →'; lmsg('連結失敗：'+esc(error.message),'err'); }
    };

    // LINE：走自己的 Edge Function（LINE 不是 Supabase 原生登入方式）
    const l = $('linkLine');
    if(l) l.onclick = async ()=>{
      l.disabled = true; l.textContent = '前往 LINE…';
      try{
        const redirect = location.origin + '/line-callback.html';
        const res = await fetch(`${LINE_FN}?action=start&mode=bind&redirect_uri=${encodeURIComponent(redirect)}`,
                                { headers:{ apikey: SUPABASE_ANON } });
        const j = await res.json();
        if(j && j.ok && j.url){ location.href = j.url; return; }
        l.disabled=false; l.textContent='連結 LINE →';
        lmsg(j && j.reason==='not_configured'
          ? 'LINE 登入還在設定中（頻道資訊尚未填入），目前請先用 Email 或 Google 登入。'
          : 'LINE 連結暫時無法使用，請稍後再試。','err');
      }catch(e){
        l.disabled=false; l.textContent='連結 LINE →';
        lmsg('LINE 登入還在設定中，目前請先用 Email 或 Google 登入。','err');
      }
    };

    const ul = $('unlinkLine');
    if(ul) ul.onclick = async ()=>{
      if(ul.dataset.sure!=='1'){ ul.dataset.sure='1'; ul.textContent='再按一次確認'; setTimeout(()=>{ if(ul.dataset.sure==='1'){ ul.dataset.sure=''; ul.textContent='解除綁定'; } },4000); return; }
      ul.disabled=true; ul.textContent='處理中…';
      const { error } = await supabase.rpc('member_unbind_line');
      if(error){ ul.disabled=false; ul.textContent='解除綁定'; lmsg('解除失敗：'+esc(error.message),'err'); return; }
      lmsg('已解除 LINE 綁定。','ok');
      setTimeout(()=>location.reload(), 800);
    };
  }

  function card(c, owned){
    const ACCENTS = ['amber','teal','violet','indigo','free','rose','gold','grape'];
    const color = ACCENTS.includes(c.accent) ? (c.accent==='free'?'violet':c.accent) : 'amber';
    const intro = c.id==='super-memory' ? '課程介紹-過目不忘' : (c.id==='super-thinking' ? '課程介紹-瘋狂心智圖' : '');
    const INTRO_MAP = {'super-memory':'course-memory.html','super-thinking':'course-thinking.html','strong-thinking-basic':'course-strong-thinking.html','onsite-basic':'course-onsite-basic.html','onsite-advanced':'course-onsite-advanced.html','bundle-all':'course-bundle.html'};
    const introHref = INTRO_MAP[c.id] || 'courses.html';
    const isFree = (c.price||0)===0;
    const action = owned
      ? `<a class="btn btn-watch ${color}" href="watch.html?course=${encodeURIComponent(c.id)}">▶ 開始觀看</a>`
      : (isFree
          ? `<a class="btn btn-watch ${color}" href="watch.html?course=${encodeURIComponent(c.id)}">免費開通・立即觀看 →</a>`
          : `<a class="btn btn-buy" href="${introHref}">了解課程 · NT$${c.price.toLocaleString()} →</a>`);
    const status = owned
      ? `<span class="status owned"><span class="dot"></span>已開通・永久觀看</span>`
      : (isFree
          ? `<span class="status owned"><span class="dot"></span>免費・登入就能看</span>`
          : `<span class="status locked"><span class="dot"></span>尚未購買</span>`);
    return `<div class="course">
      <div class="course-top ${color}">
        <span class="course-lv">Level ${c.level}</span>
        <div class="course-name ${(c.name||'').length>=9?'sm':''}">${c.name}</div>
        <div class="course-sub">${c.subtitle||''}</div>
      </div>
      <div class="course-body">
        ${status}
        <div style="font-size:14px;color:var(--ink-soft);">${c.description||''}</div>
        <div class="course-actions">${action}</div>
      </div>
    </div>`;
  }
  function errBox(t){ return `<div class="foot-note" style="color:#d64545;">${t}</div>`; }
</script>
