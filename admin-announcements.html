<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>網站公告 — 強腦力 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;--mute:#8a8ea6;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:clamp(24px,2.8vw,28px);line-height:1.08;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:16px;font-size:14.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,input{padding:9px 12px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);}
  select:focus,input:focus{outline:none;border-color:var(--orange);}
  .btn{font-family:var(--round);font-weight:700;font-size:14px;padding:9px 16px;border-radius:24px;border:none;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);}
  .btn-sm{font-size:12.5px;padding:6px 12px;border-radius:18px;}
  .msg{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px;}
  th,td{border-bottom:1px solid var(--hair);padding:10px 12px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;background:#fff;}
  td.t{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;}
  td .note{width:100%;min-width:160px;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .demo{background:#FFF6DC;color:#8a6d1a;text-align:center;font-size:13px;padding:8px 14px;border-bottom:1px solid #f0dfa8;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .f label{display:block;font-family:var(--round);font-weight:700;font-size:13.5px;color:var(--indigo);margin:12px 0 6px;}
  .f input[type=text],.f input[type=datetime-local],.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  .f textarea{min-height:64px;resize:vertical;}
  .f textarea:focus{outline:none;border-color:var(--orange);}
  .f .hint{font-size:12.5px;color:var(--mute);margin-top:4px;}
  .f .chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px;}
  .f .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .chip.on{background:rgba(22,176,168,.14);color:var(--teal-deep);}
  .chip.wait{background:rgba(255,176,32,.16);color:#8a5c00;}
  .chip.end{background:var(--paper-2);color:var(--mute);}
  .chip.off{background:rgba(214,69,69,.1);color:var(--err);}
  td .tt{font-weight:700;color:var(--indigo);}
  td .sm{font-size:12.5px;color:var(--ink-soft);}
  .acts-cell{white-space:nowrap;display:flex;gap:6px;}
</style>
</head>
<body>
<nav><div class="nav-in"><span class="brand"><span class="b"></span>強腦力 後台</span><a href="member.html">← 會員中心</a></div></nav>
<div class="tabs"><div class="tabs-in">
  <a href="admin.html">總覽・銷售</a>
  <a href="admin-courses.html">課程管理</a>
  <a href="admin-contacts.html">名單管理</a>
  <a href="admin-funv.html">婦女再就業報名</a>
  <a href="admin-broadcast.html">群發信</a>
  <a href="admin-landings.html">廣告頁</a>
  <a href="admin-announcements.html" class="active">公告</a>
  <a href="admin-admins.html">管理員</a>
</div></div>
<div id="content"><div class="state"><div class="spin"></div>確認管理員權限中…</div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const DEMO=/(^|[#&])demo=1([&]|$)/.test(location.hash);
  const PLACES={ both:'進站＋登入後', site:'進站（公開頁）', login:'登入後（會員頁）' };
  const DEMO_ROWS=[
    { id:'d1', title:'10/31（六）高雄 3 小時體驗場 限時免費', body:'3 小時實體實戰，現場帶你練圖像記憶與心智圖。', btn_text:'免費報名', link:'ad-live.html', starts_at:'2026-10-25T00:00:00+08:00', ends_at:'2026-10-28T23:59:00+08:00', placement:'both', active:true },
    { id:'d2', title:'示範：已停用的公告', body:'', btn_text:'', link:'', starts_at:'2026-10-01T00:00:00+08:00', ends_at:'2026-10-10T23:59:00+08:00', placement:'site', active:false }
  ];
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 時間一律用台灣時間顯示與輸入，存進資料庫是帶時區的時間
  const twParts=(s)=>{ const d=new Date(s); const o={}; new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value); return o; };
  const toInput=(s)=>{ if(!s) return ''; const o=twParts(s); return o.year+'-'+o.month+'-'+o.day+'T'+o.hour+':'+o.minute; };
  const fmt=(s)=>{ if(!s) return ''; const o=twParts(s); return o.year+'-'+o.month+'-'+o.day+' '+o.hour+':'+o.minute; };
  const fromInput=(v)=>v ? new Date(v+':00+08:00').toISOString() : null;
  const statusOf=(r)=>{ const now=Date.now(); if(!r.active) return ['off','已停用']; if(Date.parse(r.starts_at)>now) return ['wait','還沒開始']; if(Date.parse(r.ends_at)<now) return ['end','已結束']; return ['on','顯示中']; };
  const linkOk=(u)=>{ u=(u||'').trim(); return !u || /^https:\/\/[^\s"'<>]+$/i.test(u) || (/^[A-Za-z0-9_\-\/.#?=&%]+$/.test(u) && u.indexOf('//')!==0); };

  (async ()=>{
    if(DEMO){
      document.body.insertAdjacentHTML('afterbegin','<div class="demo">示範模式：下面是假資料，改動不會存進資料庫</div>');
    }else{
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
      const { data:isAdm } = await supabase.rpc('is_admin');
      if(isAdm!==true){
        $('content').innerHTML=`<div class="gate"><h2>非管理員帳號</h2><p>這個頁面僅限管理員使用。你目前登入的是 ${esc(session.user.email)}。</p><p><a href="member.html">← 回會員中心</a></p></div>`;
        return;
      }
    }

    $('content').innerHTML=`
      <div class="wrap">
        <div class="h">網站公告</div>
        <div class="sub">「進站」會在公開頁面跳出，「登入後」會在會員中心、教室跳出；同一位訪客一天最多看到一次。從 Google 搜尋進來的手機訪客會改成畫面底部的小橫幅。過了結束時間就自動不顯示。</div>
        <div class="card f" id="formCard">
          <div class="row-top" style="margin-bottom:0"><b class="round" style="font-size:17px;color:var(--indigo)" id="formH">新增公告</b></div>
          <label for="fTitle">標題（大字，40 字內）</label>
          <input type="text" id="fTitle" maxlength="40" placeholder="10/31（六）高雄 3 小時體驗場 限時免費">
          <label for="fBody">內文（一句話，120 字內，可空白）</label>
          <textarea id="fBody" maxlength="120"></textarea>
          <div class="grid2">
            <div><label for="fBtn">按鈕文字（16 字內）</label><input type="text" id="fBtn" maxlength="16" placeholder="免費報名"></div>
            <div><label for="fLink">按鈕連結</label><input type="text" id="fLink" maxlength="300" placeholder="ad-live.html"><div class="hint">站內頁直接寫檔名（例 ad-live.html），站外要 https:// 開頭。空白就不放按鈕。</div></div>
          </div>
          <div class="grid2">
            <div><label for="fStart">開始（台灣時間）</label><input type="datetime-local" id="fStart"></div>
            <div><label for="fEnd">結束（台灣時間）</label><input type="datetime-local" id="fEnd"></div>
          </div>
          <label for="fPlace">在哪裡跳</label>
          <select id="fPlace">${Object.entries(PLACES).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
          <label class="chk"><input type="checkbox" id="fActive" checked> 啟用</label>
          <div class="acts">
            <button class="btn btn-primary" id="btnSave">儲存</button>
            <button class="btn btn-ghost" id="btnNew">清空，改成新增</button>
          </div>
          <div class="msg" id="msg"></div>
        </div>
        <div class="card">
          <div class="row-top"><b class="round" style="font-size:17px;color:var(--indigo)">所有公告</b><button class="btn btn-ghost" id="btnReload">重新整理</button></div>
          <div id="listWrap"><div class="state"><div class="spin"></div>載入中…</div></div>
        </div>
      </div>`;

    let rows=[], editingId=null;
    const msg=(t,type)=>{ const m=$('msg'); m.className='msg show '+type; m.textContent=t; };
    const clearMsg=()=>{ $('msg').className='msg'; };

    function fill(r){
      editingId=r?r.id:null;
      $('formH').textContent=r?'編輯公告':'新增公告';
      $('fTitle').value=r?r.title:''; $('fBody').value=r?(r.body||''):''; $('fBtn').value=r?(r.btn_text||''):''; $('fLink').value=r?(r.link||''):'';
      $('fStart').value=r?toInput(r.starts_at):toInput(new Date().toISOString());
      $('fEnd').value=r?toInput(r.ends_at):'';
      $('fPlace').value=r?r.placement:'both'; $('fActive').checked=r?!!r.active:true;
    }

    function render(){
      if(!rows.length){ $('listWrap').innerHTML='<div class="empty">還沒有公告。用上面的表單新增第一則。</div>'; return; }
      $('listWrap').innerHTML=`<div class="tbl-scroll"><table><thead><tr><th>狀態</th><th>公告</th><th>在哪裡跳</th><th>開始</th><th>結束</th><th></th></tr></thead><tbody>${rows.map(r=>{ const [k,t]=statusOf(r); return `
        <tr data-id="${esc(r.id)}">
          <td><span class="chip ${k}">${t}</span></td>
          <td><div class="tt">${esc(r.title)}</div><div class="sm">${esc(r.body||'')}${r.link?` ｜ 按鈕「${esc(r.btn_text||'看看')}」→ ${esc(r.link)}`:''}</div></td>
          <td class="t">${esc(PLACES[r.placement]||r.placement)}</td>
          <td class="t">${esc(fmt(r.starts_at))}</td>
          <td class="t">${esc(fmt(r.ends_at))}</td>
          <td><div class="acts-cell"><button class="btn btn-ghost btn-sm" data-edit>編輯</button><button class="btn btn-ghost btn-sm" data-tog>${r.active?'停用':'啟用'}</button></div></td>
        </tr>`; }).join('')}</tbody></table></div>`;
      $('listWrap').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ fill(rows.find(r=>r.id===b.closest('tr').dataset.id)); clearMsg(); $('formCard').scrollIntoView({behavior:'smooth',block:'start'}); });
      $('listWrap').querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>toggle(b.closest('tr').dataset.id,b));
    }

    async function load(){
      $('listWrap').innerHTML='<div class="state"><div class="spin"></div>載入中…</div>';
      if(DEMO){ if(!rows.length) rows=DEMO_ROWS.map(r=>({...r})); render(); return; }
      const { data, error }=await supabase.from('announcements').select('id,title,body,btn_text,link,starts_at,ends_at,placement,active,updated_at').order('ends_at',{ ascending:false }).limit(200);
      if(error){
        const hint=/announcements/.test(error.message||'') ? '（資料表還沒建立：請先在 Supabase SQL Editor 貼上 supabase/sql/2026-10-25_announcements.sql）' : '';
        $('listWrap').innerHTML=`<div class="empty">載入失敗：${esc(error.message)}${esc(hint)}</div>`; return;
      }
      rows=data||[]; render();
    }

    async function save(){
      clearMsg();
      const rec={ title:$('fTitle').value.trim(), body:$('fBody').value.trim()||null, btn_text:$('fBtn').value.trim()||null, link:$('fLink').value.trim()||null,
        starts_at:fromInput($('fStart').value), ends_at:fromInput($('fEnd').value), placement:$('fPlace').value, active:$('fActive').checked };
      if(!rec.title){ msg('請填標題。','error'); return; }
      if(!rec.starts_at||!rec.ends_at){ msg('請填開始與結束時間。','error'); return; }
      if(Date.parse(rec.ends_at)<=Date.parse(rec.starts_at)){ msg('結束時間要晚於開始時間。','error'); return; }
      if(!linkOk(rec.link)){ msg('連結格式不對：站內頁寫檔名（例 ad-live.html），站外要 https:// 開頭。','error'); return; }
      if(rec.link && !rec.btn_text) rec.btn_text='看看';
      $('btnSave').disabled=true;
      if(DEMO){
        if(editingId) Object.assign(rows.find(r=>r.id===editingId),rec); else rows.unshift({ id:'d'+Date.now(), ...rec });
        $('btnSave').disabled=false; fill(null); render(); msg('已儲存（示範模式，沒有寫進資料庫）。','ok'); return;
      }
      const q = editingId ? supabase.from('announcements').update(rec).eq('id',editingId).select('id') : supabase.from('announcements').insert(rec).select('id');
      const { data, error }=await q;
      $('btnSave').disabled=false;
      if(error){ msg('儲存失敗：'+error.message,'error'); return; }
      if(!data||!data.length){ msg('沒有存進去（可能不是管理員，或這則已被刪除）。','error'); return; }
      msg(editingId?'已更新。':'已新增。','ok'); fill(null); load();
    }

    async function toggle(id,b){
      const r=rows.find(x=>x.id===id); if(!r) return;
      b.disabled=true;
      if(DEMO){ r.active=!r.active; render(); msg((r.active?'已啟用':'已停用')+'（示範模式）。','ok'); return; }
      const { data, error }=await supabase.from('announcements').update({ active:!r.active }).eq('id',id).select('id');
      b.disabled=false;
      if(error||!data||!data.length){ msg('切換失敗：'+(error?error.message:'沒有權限'),'error'); return; }
      msg(r.active?'已停用。':'已啟用。','ok'); load();
    }

    $('btnSave').addEventListener('click',save);
    $('btnNew').addEventListener('click',()=>{ fill(null); clearMsg(); });
    $('btnReload').addEventListener('click',load);
    fill(null); load();
  })();
</script>
</body>
</html>
