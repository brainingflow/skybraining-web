<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程觀看 — 強腦力 SkyBraining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;
    --line-brand:#06C755;--line-deep:#05A648;--hair:rgba(21,23,49,.1);
    --sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);--shadow-md:0 18px 44px rgba(21,23,49,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  .wrap{max-width:960px;margin:0 auto;padding:0 clamp(20px,5vw,40px);}
  nav{background:rgba(250,249,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(20px,5vw,40px);max-width:1060px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:clamp(27px,3.6vw,33px);line-height:1.08;color:var(--indigo);}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:var(--indigo);display:grid;place-items:center;box-shadow:var(--shadow-sm);}
  .logo-mark svg{width:22px;height:22px;}
  .wordmark{letter-spacing:1px;font-weight:800;}
  .wm-accent{background:linear-gradient(120deg,#FFB020,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav-right{display:flex;align-items:center;gap:14px;font-size:14px;}
  .nav-right a{color:var(--ink-soft);font-weight:500;}
  .nav-right a:hover{color:var(--indigo);}
  .crumb{padding:26px 0 4px;font-size:13.5px;color:var(--ink-soft);}
  .crumb a:hover{color:var(--teal-deep);}
  .state{padding:90px 0;text-align:center;color:var(--ink-soft);}
  .state .spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .player-head{padding:8px 0 22px;}
  .lv{display:inline-block;font-family:var(--round);font-weight:700;font-size:12.5px;color:#fff;padding:5px 13px;border-radius:20px;margin-bottom:12px;}
  .lv.amber{background:linear-gradient(135deg,#FFB020,#FF8A3D);}
  .lv.teal{background:linear-gradient(135deg,#16B0A8,#0d8a83);}
.lv.violet{background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
.lv.indigo{background:linear-gradient(135deg,#22264f,#141330);}
.lv.rose{background:linear-gradient(135deg,#FF6B8B,#E23A63);}
.lv.gold{background:linear-gradient(135deg,#F5A623,#E0761B);}
.lv.grape{background:linear-gradient(135deg,#8E5BEE,#5B2AC6);}
.lv.crimson{background:linear-gradient(135deg,#A6763A,#6B471B);}
.lv.plum{background:linear-gradient(135deg,#C2668A,#8A3E5C);}
.lv.techblue{background:linear-gradient(135deg,#347585,#184851);}
.lv.jade{background:linear-gradient(135deg,#437E64,#244B39);}
.lv.ember{background:linear-gradient(135deg,#B0573B,#6E2E1C);}
  h1{font-weight:800;font-size:clamp(24px,3.6vw,34px);color:var(--indigo);}
  .h-sub{color:var(--ink-soft);margin-top:6px;font-size:15px;}
  .video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#0d0f22;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);}
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .video-frame.v916{aspect-ratio:9/16;max-width:min(400px,86vw);margin:0 auto;}
  .ep .dur{margin-left:auto;font-size:11px;color:var(--ink-soft);flex:none;}
  .ep.locked{color:var(--ink-soft);cursor:default;}
  .ep.locked:hover{background:none;}
  .ep.locked .no{background:#e5e3da;color:var(--ink-soft);}
  .try-note{margin-top:18px;padding:14px 18px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.3);border-radius:14px;color:#8a5c00;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .try-note a{font-family:var(--round);font-weight:700;color:#fff;background:linear-gradient(135deg,#FFB020,#FF8A3D);padding:8px 18px;border-radius:24px;margin-left:auto;white-space:nowrap;}
  .video-ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.8);padding:24px;}
  .video-ph .ic{font-size:40px;margin-bottom:12px;}
  .video-ph .big{font-family:var(--round);font-weight:700;font-size:20px;color:#fff;margin-bottom:8px;}
  .video-ph .small{font-size:13.5px;color:rgba(255,255,255,.6);max-width:44ch;}
  .owned-note{margin-top:18px;padding:14px 18px;background:rgba(22,176,168,.1);border:1px solid rgba(22,176,168,.25);border-radius:14px;color:var(--teal-deep);font-size:14px;display:flex;align-items:center;gap:9px;}
  /* 分集播放器 */
  .course-layout{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start;margin-bottom:10px;}
  @media(max-width:860px){.course-layout{grid-template-columns:1fr;}}
  .now-playing{margin-top:12px;font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--indigo);}
  .ep-list{background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;max-height:70vh;overflow-y:auto;}
  @media(max-width:860px){.ep-list{max-height:none;}}
  .ep-list-h{font-family:var(--round);font-weight:800;font-size:15px;color:var(--indigo);padding:16px 18px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff;z-index:1;}
  .ep-group{padding:14px 18px 8px;font-family:var(--round);font-weight:800;font-size:13.5px;color:var(--indigo);background:var(--paper-2);border-bottom:1px solid var(--hair);}
  .ep{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--hair);cursor:pointer;font-size:14px;color:var(--ink);transition:background .15s;}
  .ep:last-child{border-bottom:none;}
  .ep:hover{background:var(--paper-2);}
  .ep.active{background:rgba(22,176,168,.12);}
  .ep.active .et{color:var(--teal-deep);font-weight:700;}
  .ep .no{font-family:var(--round);font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);border-radius:8px;min-width:34px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .ep .et{flex:1;}
  .ep.part{padding-left:26px;}
  .ep.part .no{background:var(--paper-2);color:var(--teal-deep);}
  .ep.soon{color:var(--ink-soft);cursor:default;}
  .ep.soon:hover{background:none;}
  .ep.soon .no{background:#e5e3da;color:var(--ink-soft);}
  .ep .tag{margin-left:auto;font-size:11px;color:var(--ink-soft);background:var(--paper-2);padding:2px 8px;border-radius:10px;flex:none;}
  /* locked */
  .lock{max-width:560px;margin:30px auto 70px;background:#fff;border:1px solid var(--hair);border-radius:24px;box-shadow:var(--shadow-md);padding:44px 36px;text-align:center;}
  .lock .lk-ic{width:70px;height:70px;border-radius:20px;background:var(--paper-2);display:grid;place-items:center;font-size:32px;margin:0 auto 20px;}
  .lock h2{font-family:var(--round);font-weight:800;font-size:24px;color:var(--indigo);margin-bottom:10px;}
  .lock p{color:var(--ink-soft);font-size:15px;margin-bottom:26px;}
  .lock .price{font-family:var(--round);font-weight:800;font-size:30px;color:var(--indigo);margin-bottom:22px;}
  .lock .price small{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:var(--round);font-weight:700;font-size:15px;padding:13px 26px;border-radius:40px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:none;transition:transform .2s,box-shadow .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-buy{color:#fff;}
  .btn-buy.amber{background:linear-gradient(135deg,#FFB020,#FF8A3D);box-shadow:0 12px 28px rgba(255,138,61,.32);}
  .btn-buy.teal{background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 12px 28px rgba(22,176,168,.32);}
.btn-buy.violet{background:linear-gradient(135deg,#7C6CF0,#4B37D8);box-shadow:0 12px 28px rgba(75,55,216,.32);}
.btn-buy.indigo{background:linear-gradient(135deg,#22264f,#141330);box-shadow:0 12px 28px rgba(20,19,48,.32);}
.btn-buy.rose{background:linear-gradient(135deg,#FF6B8B,#E23A63);box-shadow:0 12px 28px rgba(226,58,99,.32);}
.btn-buy.gold{background:linear-gradient(135deg,#F5A623,#E0761B);box-shadow:0 12px 28px rgba(224,118,27,.32);}
.btn-buy.grape{background:linear-gradient(135deg,#8E5BEE,#5B2AC6);box-shadow:0 12px 28px rgba(91,42,198,.32);}
.btn-buy.crimson{background:linear-gradient(135deg,#A6763A,#6B471B);box-shadow:0 12px 28px rgba(107,71,27,.32);}
.btn-buy.plum{background:linear-gradient(135deg,#C2668A,#8A3E5C);box-shadow:0 12px 28px rgba(138,62,92,.32);}
.btn-buy.techblue{background:linear-gradient(135deg,#347585,#184851);box-shadow:0 12px 28px rgba(24,72,81,.32);}
.btn-buy.jade{background:linear-gradient(135deg,#437E64,#244B39);box-shadow:0 12px 28px rgba(36,75,57,.32);}
.btn-buy.ember{background:linear-gradient(135deg,#B0573B,#6E2E1C);box-shadow:0 12px 28px rgba(110,46,28,.32);}
  .btn-ghost{background:var(--paper-2);color:var(--indigo);}
  .btn-line{background:var(--line-brand);color:#fff;}
  .back-dash{display:inline-block;margin-top:8px;padding-bottom:60px;font-size:14px;color:var(--ink-soft);}

  /* ── 社群追蹤按鈕（頁尾）── */
  .sb-social{width:100%;flex-basis:100%;max-width:1180px;margin:0 auto 26px;padding:0 22px 22px;box-sizing:border-box;border-bottom:1px solid rgba(140,140,155,.28);text-align:center;}
  .sb-social.sb-alone{border-bottom:0;border-top:1px solid rgba(140,140,155,.25);margin:34px auto 0;padding:26px 22px 4px;}
  .sb-social-h{font-weight:800;font-size:15px;letter-spacing:.3px;margin-bottom:13px;opacity:.94;}
  .sb-social-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;}
  .sb-so{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:30px;color:#fff !important;font-weight:800;font-size:14.5px;line-height:1;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .18s,filter .18s,box-shadow .18s;}
  .sb-so:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .sb-so svg{width:19px;height:19px;flex:none;}
  .sb-yt{background:#FF0000;}
  .sb-line{background:#06C755;}
  .sb-ig{background:linear-gradient(45deg,#F9CE34 0%,#EE2A7B 48%,#6228D7 100%);}
  .sb-tt{background:#111;box-shadow:0 4px 14px rgba(0,0,0,.16),inset 0 0 0 1.5px rgba(255,255,255,.3);}
  .sb-tt:hover{box-shadow:0 8px 20px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(255,255,255,.45);}
  @media(max-width:520px){.sb-so{padding:10px 14px;font-size:13.5px;}.sb-so svg{width:17px;height:17px;}.sb-social{padding:0 14px 20px;}}
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="brand" href="index.html"><span class="wordmark">強<span class="wm-accent">腦</span>力</span></a>
    <div class="nav-right">
      <a href="member.html">我的課程</a>
      <a href="#" id="logout">登出</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="crumb"><a href="member.html">我的課程</a> ／ <span id="crumbName">課程觀看</span></div>
  <div id="content">
    <div class="state"><div class="spin"></div>確認觀看權限中…</div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL  = 'https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const LOGIN_PAGE = 'login.html';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = (id)=>document.getElementById(id);

  $('logout').onclick = async (e)=>{ e.preventDefault(); await supabase.auth.signOut(); location.href = LOGIN_PAGE; };

  const courseId = new URLSearchParams(location.search).get('course');

  (async ()=>{
    if(!courseId){ $('content').innerHTML = msg('缺少課程參數','請從「我的課程」點選要觀看的課程。'); return; }

    // 必須登入
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href = LOGIN_PAGE + '?next=' + encodeURIComponent(location.href); return; }

    // 讀課程資料
    const { data:course, error:cErr } = await supabase.from('courses').select('*').eq('id',courseId).maybeSingle();
    if(cErr || !course){ $('content').innerHTML = msg('找不到這門課程', cErr?cErr.message:'請確認課程是否存在。'); return; }
    $('crumbName').textContent = course.name;

    // === 購買比對：以「會員編號」為單位，同一個人的 Email／Google／LINE 帳號共用課程 ===
    let owned = false;
    const { data:ownRes, error:ownErr } = await supabase.rpc('member_owns_course', { p_course_id: courseId });
    if(ownErr){
      // member_scope.sql 尚未部署時的退路
      const { data:enroll } = await supabase.from('enrollments')
        .select('id').eq('course_id',courseId).eq('user_id',session.user.id).maybeSingle();
      owned = !!enroll;
    }else{
      owned = ownRes === true;
    }

    const color = ['amber','teal','violet','indigo','rose','gold','grape','crimson','plum','techblue','jade','ember'].includes(course.accent) ? course.accent : (course.accent==='free' ? 'violet' : 'amber');

    // 就業力／洽詢制課程：不在這裡看，導去介紹與 LINE
    if(course.category==='career'){
      $('content').innerHTML = `
        <div class="lock">
          <div class="lk-ic">🎓</div>
          <h2>${course.name}</h2>
          <p>這是實體／洽詢制課程，採 LINE 報名。先看課程介紹，或直接加 LINE 詢問最近梯次。</p>
          <div class="btns">
            <a class="btn btn-buy amber" href="${course.intro_url||'courses.html#pro'}">看課程介紹 →</a>
            <a class="btn btn-line" href="https://lin.ee/9EGO8IT" target="_blank" rel="noopener">LINE 諮詢</a>
          </div>
        </div>`;
      return;
    }

    const headHtml = `
      <div class="player-head">
        <span class="lv ${color}">Level ${course.level}・${course.subtitle||''}</span>
        <h1>${course.name}</h1>
        <div class="h-sub">${course.description||''}</div>
      </div>`;
    const phHtml = (txt)=>`<div class="video-ph"><div><div class="ic">🎬</div><div class="big">影片即將上線</div><div class="small">${txt}</div></div></div>`;
    const iframeHtml = (vid)=>`<iframe src="https://player.vimeo.com/video/${encodeURIComponent(vid)}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    const buyHref = course.intro_url
      || (courseId==='super-memory' ? 'course-memory.html'
        : courseId==='super-thinking' ? 'course-thinking.html'
        : 'courses.html#brain');

    // v2 章節格式：episodes = { v:2, chapters:[{title,lessons:[{title,vimeo_id,ratio,preview,duration}]}] }
    const chapters = (course.episodes && !Array.isArray(course.episodes)
      && course.episodes.v===2 && Array.isArray(course.episodes.chapters))
      ? course.episodes.chapters : null;

    const renderChapters = (mode)=>{   // mode: 'full'（已購）| 'preview'（免費試看）
      const items=[];
      let listHtml = '<div class="ep-list-h">課程單元</div>';
      chapters.forEach((ch,ci)=>{
        listHtml += `<div class="ep-group">${ch.title||('第'+(ci+1)+'章')}</div>`;
        (ch.lessons||[]).forEach((ls,li)=>{
          const no=(ci+1)+'-'+(li+1);
          const t=ls.title||('單元 '+no);
          const vid=(ls.vimeo_id||'').trim();
          const dur=ls.duration?`<span class="dur">${ls.duration}</span>`:'';
          if(!vid){ listHtml+=`<div class="ep soon"><span class="no">${no}</span><span class="et">${t}</span><span class="tag">即將上線</span></div>`; return; }
          if(mode==='preview' && !ls.preview){ listHtml+=`<div class="ep locked"><span class="no">${no}</span><span class="et">${t}</span><span class="tag">🔒 購買解鎖</span></div>`; return; }
          const idx=items.length;
          items.push({vid, label:no+'・'+t, ratio:(ls.ratio==='9:16'?'9:16':'16:9')});
          const right = mode==='preview'
            ? '<span class="tag" style="background:rgba(22,176,168,.14);color:var(--teal-deep);">免費試看</span>' : dur;
          listHtml+=`<div class="ep" data-idx="${idx}"><span class="no">${no}</span><span class="et">${t}</span>${right}</div>`;
        });
      });
      const note = mode==='full'
        ? '<div class="owned-note">✅ 你已開通本課程，買斷永久觀看，隨時都能回來複習。</div>'
        : `<div class="try-note">🎬 你正在免費試看本課程的開放單元。喜歡的話，解鎖之後一次看到底<a href="${buyHref}">解鎖完整課程 →</a></div>`;
      $('content').innerHTML = `
        ${headHtml}
        <div class="course-layout">
          <div class="player-col">
            <div class="video-frame" id="player"></div>
            <div class="now-playing" id="nowPlaying"></div>
            ${note}
          </div>
          <aside class="ep-list">${listHtml}</aside>
        </div>
        <a class="back-dash" href="member.html">← 回我的課程</a>`;
      const setPlayer=(it,el)=>{
        const p=$('player');
        p.classList.toggle('v916', it.ratio==='9:16');
        p.innerHTML = iframeHtml(it.vid);
        $('nowPlaying').textContent='▶ 正在播放：'+it.label;
        document.querySelectorAll('.ep').forEach(x=>x.classList.remove('active'));
        if(el) el.classList.add('active');
      };
      document.querySelectorAll('.ep[data-idx]').forEach(el=>{
        el.onclick=()=>{ setPlayer(items[+el.dataset.idx],el); window.scrollTo({top:0,behavior:'smooth'}); };
      });
      if(items.length){ setPlayer(items[0], document.querySelector('.ep[data-idx]')); }
      else { $('player').innerHTML = phHtml('單元都排好了，影片上線就會自動出現。'); }
    };

    if(owned){
      const eps = Array.isArray(course.episodes) ? course.episodes : [];

      if(chapters){
        renderChapters('full');
      } else if(eps.length){
        // ===== 分集播放器（v1 舊格式，維持原樣）=====
        const items = [];
        let listHtml = '<div class="ep-list-h">課程單元</div>';
        eps.forEach(ep=>{
          if(Array.isArray(ep.parts) && ep.parts.length){
            listHtml += `<div class="ep-group">第${ep.no}課${ep.title?'・'+ep.title:''}</div>`;
            ep.parts.forEach((pt,i)=>{
              const ptitle = pt.title || ('第'+(i+1)+'部分');
              if(pt.vimeo_id){ const idx=items.length; items.push({vid:pt.vimeo_id,label:`第${ep.no}課-${i+1}・${ptitle}`});
                listHtml += `<div class="ep part" data-idx="${idx}"><span class="no">${ep.no}-${i+1}</span><span class="et">${ptitle}</span></div>`;
              } else {
                listHtml += `<div class="ep part soon"><span class="no">${ep.no}-${i+1}</span><span class="et">${ptitle}</span><span class="tag">即將上線</span></div>`;
              }
            });
          } else {
            const t = ep.title || '';
            if(ep.vimeo_id){ const idx=items.length; items.push({vid:ep.vimeo_id,label:`第${ep.no}課・${t}`});
              listHtml += `<div class="ep" data-idx="${idx}"><span class="no">${ep.no}</span><span class="et">${t}</span></div>`;
            } else {
              listHtml += `<div class="ep soon"><span class="no">${ep.no}</span><span class="et">${t}</span><span class="tag">即將上線</span></div>`;
            }
          }
        });
        $('content').innerHTML = `
          ${headHtml}
          <div class="course-layout">
            <div class="player-col">
              <div class="video-frame" id="player"></div>
              <div class="now-playing" id="nowPlaying"></div>
              <div class="owned-note">✅ 你已開通本課程，買斷永久觀看，隨時都能回來複習。</div>
            </div>
            <aside class="ep-list">${listHtml}</aside>
          </div>
          <a class="back-dash" href="member.html">← 回我的課程</a>`;
        const setPlayer=(vid,label,el)=>{
          $('player').innerHTML = iframeHtml(vid);
          $('nowPlaying').textContent = label ? ('▶ 正在播放：'+label) : '';
          document.querySelectorAll('.ep').forEach(x=>x.classList.remove('active'));
          if(el) el.classList.add('active');
        };
        document.querySelectorAll('.ep[data-idx]').forEach(el=>{
          el.onclick=()=>{ const it=items[+el.dataset.idx]; setPlayer(it.vid,it.label,el); window.scrollTo({top:0,behavior:'smooth'}); };
        });
        if(items.length){ const first=document.querySelector('.ep[data-idx]'); setPlayer(items[0].vid,items[0].label,first); }
        else { $('player').innerHTML = phHtml('單元都排好了，等你把各集的 Vimeo 連結補上就會自動播放。'); }
      } else {
        // ===== 單一影片（沒有分集）=====
        const vimeo = (course.vimeo_id||'').trim();
        const v916 = course.default_ratio==='9:16' ? ' v916' : '';
        $('content').innerHTML = `
          ${headHtml}
          <div class="video-frame${v916}">${vimeo ? iframeHtml(vimeo) : phHtml('此課程尚未設定影片。之後把 Vimeo 連結補上就會自動播放。')}</div>
          <div class="owned-note">✅ 你已開通本課程，買斷永久觀看，隨時都能回來複習。</div>
          <a class="back-dash" href="member.html">← 回我的課程</a>`;
      }
    }else if((course.price||0)===0){
      // 免費課・尚未開通 → NT$0 自助開通
      $('content').innerHTML = `
        <div class="lock">
          <div class="lk-ic">🎁</div>
          <h2>免費課程・登入就能看</h2>
          <p>「${course.name}」是免費體驗課。按下方按鈕以 NT$0 開通，開通後就會出現在你的「我的課程」，隨時都能回來看。</p>
          <div class="price">NT$0<small> ・免費・永久觀看</small></div>
          <div class="btns">
            <button class="btn btn-buy teal" id="freeUnlock">✓ NT$0 免費開通・立即觀看</button>
          </div>
          <div id="freeErr" style="color:#d64545;font-size:13.5px;margin-top:14px;display:none;"></div>
          <div style="margin-top:22px;"><a class="btn btn-ghost" href="member.html">← 回我的課程</a></div>
        </div>`;
      $('freeUnlock').onclick = async ()=>{
        const btn=$('freeUnlock'); btn.disabled=true; btn.textContent='開通中…';
        const { error } = await supabase.from('enrollments')
          .insert({ user_id: session.user.id, course_id: courseId, source: 'free' });
        if(error && !/duplicate|unique|conflict/i.test(error.message)){
          btn.disabled=false; btn.textContent='再試一次';
          const e=$('freeErr'); e.style.display='block'; e.textContent='開通失敗：'+error.message; return;
        }
        location.reload();
      };
    }else{
      // 付費課・未購買：有開放試看單元 → 試看模式；否則鎖定畫面
      const canPreview = chapters && chapters.some(ch=>(ch.lessons||[]).some(l=>l.preview && (l.vimeo_id||'').trim()));
      if(canPreview){
        renderChapters('preview');
      }else{
        $('content').innerHTML = `
          <div class="lock">
            <div class="lk-ic">🔒</div>
            <h2>這門課還沒開通</h2>
            <p>「${course.name}」目前不在你的已購買清單中。完成購買後即可永久觀看。</p>
            <div class="price">NT$${(course.price||0).toLocaleString()}<small> ・買斷永久觀看</small></div>
            <div class="btns">
              <a class="btn btn-buy ${color}" href="${buyHref}">前往購買 →</a>
              <a class="btn btn-line" href="login.html">先免費試看</a>
            </div>
            <div style="margin-top:22px;"><a class="btn btn-ghost" href="member.html">← 回我的課程</a></div>
          </div>`;
      }
    }
  })();

  function msg(title, desc){
    return `<div class="lock"><div class="lk-ic">⚠️</div><h2>${title}</h2><p>${desc}</p>
      <div class="btns"><a class="btn btn-ghost" href="member.html">← 回我的課程</a></div></div>`;
  }
</script>
