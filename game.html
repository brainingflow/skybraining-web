  /* header */
  .top{max-width:1000px;margin:0 auto;padding:clamp(22px,4vw,38px) clamp(16px,4vw,28px) 6px;text-align:center;}
  .kick{display:inline-block;font-family:var(--round);font-weight:700;font-size:12.5px;letter-spacing:2px;color:var(--orange);background:rgba(255,138,61,.1);padding:5px 14px;border-radius:20px;margin-bottom:14px;}

  .controls{max-width:1000px;margin:20px auto 0;padding:0 clamp(16px,4vw,28px);display:flex;flex-direction:column;align-items:center;gap:14px;}

  .stat .k{font-size:12px;color:var(--mute);font-weight:500;}
  .stat .v{font-family:var(--round);font-weight:800;font-size:22px;color:var(--indigo);line-height:1.15;font-variant-numeric:tabular-nums;}
  .stat.time .v{color:var(--orange);}

  .btn-restart{font-family:var(--round);font-weight:700;font-size:14px;padding:9px 20px;border-radius:22px;border:none;cursor:pointer;color:var(--indigo);background:var(--paper2);transition:transform .15s;}
  .btn-restart:hover{transform:translateY(-2px);}
  /* board */
  .board-wrap{max-width:1000px;margin:24px auto 0;padding:0 clamp(12px,4vw,28px);}
  .board{display:grid;gap:clamp(7px,1.6vw,13px);justify-content:center;margin:0 auto;}
  .cell{perspective:800px;aspect-ratio:3/4;cursor:pointer;}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.3,1.2);}
  .cell.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:clamp(9px,1.6vw,15px);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(20px,5.5vw,34px);user-select:none;}
  .back{background:linear-gradient(150deg,#22264f,#141631);box-shadow:var(--sh1);border:1px solid rgba(255,255,255,.06);}
  .back::after{content:"";position:absolute;width:36%;height:36%;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.9),rgba(255,138,61,.5) 60%,transparent 72%);filter:blur(.3px);}
  .front{background:#fff;box-shadow:var(--sh1);border:1.5px solid var(--hair);transform:rotateY(180deg);}
  .cell.matched .inner{transform:rotateY(180deg);}
  .cell.matched .front{background:linear-gradient(150deg,#eafaf7,#d6f3ee);border-color:rgba(22,176,168,.4);animation:pop .4s ease;}
  .cell.matched{cursor:default;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.09);}100%{transform:scale(1);}}
  .cell.shake .front{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-5px);}75%{transform:rotateY(180deg) translateX(5px);}}
  /* win modal */
  .overlay{position:fixed;inset:0;background:rgba(20,22,49,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
  .overlay.show{display:flex;animation:fade .3s;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{background:#fff;border-radius:26px;box-shadow:var(--sh3);max-width:440px;width:100%;padding:34px 28px 28px;text-align:center;animation:rise .4s cubic-bezier(.2,.8,.3,1.1);}
  @keyframes rise{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal .emoji{font-size:52px;line-height:1;}
  .modal h2{font-family:var(--round);font-weight:800;font-size:26px;color:var(--indigo);margin:8px 0 4px;}
  .modal .res{display:flex;gap:10px;justify-content:center;margin:18px 0;}

  .res .box .v{font-family:var(--round);font-weight:800;font-size:22px;color:var(--indigo);font-variant-numeric:tabular-nums;}
  .newbest{display:inline-block;font-family:var(--round);font-weight:700;font-size:12.5px;color:#fff;background:var(--teal);padding:3px 12px;border-radius:20px;margin-bottom:6px;}
  .pitch{background:linear-gradient(135deg,#fff8ec,#fdeede);border:1px solid rgba(255,176,32,.3);border-radius:16px;padding:16px 18px;margin:14px 0 18px;font-size:14.5px;color:var(--ink);}
  .pitch b{color:var(--indigo);}
  .m-btns{display:flex;flex-direction:column;gap:10px;}

  .m-primary{color:#fff;background:var(--spark);box-shadow:0 12px 26px rgba(255,138,61,.32);}

  footer{max-width:1000px;margin:40px auto 0;padding:24px clamp(16px,4vw,28px) 40px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--hair);}
  footer a{color:var(--soft);}

  </div>

<script>
(function(){
  var LEVELS={
    easy:{pairs:6,cols:4},
    normal:{pairs:8,cols:4},
    hard:{pairs:10,cols:5},
    master:{pairs:18,cols:6}
  };
  var SYMBOLS=['🧠','💡','🦉','🐘','📚','✏️','🎯','🔑','🧩','🏆','🔬','🚀','⭐','🎨','🎵','🍀','🌈','🔥','🎈','🌟'];
  var board=document.getElementById('board');
  var timeV=document.getElementById('timeV'), moveV=document.getElementById('moveV'), bestV=document.getElementById('bestV');
  var overlay=document.getElementById('overlay');
  var level='normal', first=null, lock=false, moves=0, matched=0, total=0;
  var startT=0, timer=null, running=false;

  function bestKey(l){return 'sky_mem_best_'+l;}
  function getBest(l){ try{var v=localStorage.getItem(bestKey(l)); return v?parseFloat(v):null;}catch(e){return null;} }
  function setBest(l,v){ try{localStorage.setItem(bestKey(l),String(v));}catch(e){} }
  function fmt(s){return s.toFixed(1);}

  function showBest(){ var b=getBest(level); bestV.textContent = b!=null ? (fmt(b)+'秒') : '—'; }

  function stopTimer(){ if(timer){clearInterval(timer);timer=null;} running=false; }
  function tick(){ var s=(Date.now()-startT)/1000; timeV.innerHTML=fmt(s)+'<span style="font-size:13px;">秒</span>'; }
  function startTimer(){ if(running)return; running=true; startT=Date.now(); timer=setInterval(tick,100); }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function build(){
    stopTimer(); running=false; first=null; lock=false; moves=0; matched=0;
    var cfg=LEVELS[level]; total=cfg.pairs;
    moveV.textContent='0'; timeV.innerHTML='0.0<span style="font-size:13px;">秒</span>'; showBest();
    var syms=SYMBOLS.slice(0,cfg.pairs);
    var deck=shuffle(syms.concat(syms.slice()));
    board.style.gridTemplateColumns='repeat('+cfg.cols+',minmax(0,1fr))';
    board.style.maxWidth=(cfg.cols*84)+'px';
    board.innerHTML='';
    deck.forEach(function(sym){
      var cell=document.createElement('div'); cell.className='cell'; cell.dataset.sym=sym;
      cell.innerHTML='<div class="inner"><div class="face back"></div><div class="face front">'+sym+'</div></div>';
      cell.addEventListener('click',function(){onFlip(cell);});
      board.appendChild(cell);
    });
  }

  function onFlip(cell){
    if(lock||cell.classList.contains('flip')||cell.classList.contains('matched'))return;
    startTimer();
    cell.classList.add('flip');
    if(!first){ first=cell; return; }
    // second card
    moves++; moveV.textContent=moves;
    var a=first, b=cell; first=null;
    if(a.dataset.sym===b.dataset.sym){
      lock=true;
      setTimeout(function(){
        a.classList.add('matched'); b.classList.add('matched');
        a.classList.remove('flip'); b.classList.remove('flip');
        matched++; lock=false;
        if(matched===total) win();
      },320);
    } else {
      lock=true;
      a.classList.add('shake'); b.classList.add('shake');
      setTimeout(function(){
        a.classList.remove('flip','shake'); b.classList.remove('flip','shake'); lock=false;
      },780);
    }
  }

  function win(){
    stopTimer();
    var s=(Date.now()-startT)/1000;
    var prev=getBest(level); var isBest = (prev==null || s<prev);
    if(isBest) setBest(level,s);
    showBest();
    document.getElementById('rTime').textContent=fmt(s)+'秒';
    document.getElementById('rMove').textContent=moves;
    document.getElementById('bestTag').innerHTML = isBest ? '<span class="newbest">🏅 新紀錄！</span>' : '';
    document.getElementById('winEmoji').textContent = isBest ? '🏆' : '🎉';
    var lvName={easy:'簡單',normal:'普通',hard:'挑戰',master:'高手'}[level];
    document.getElementById('winTitle').textContent = lvName+'關破關！';
    var msg;
    if(s<15) msg='<b>驚人的速度！</b>你的大腦天生就會「把畫面記起來」。這正是強腦力教孩子的方法——把課本變成畫面，記一次就忘不掉。';
    else if(s<40) msg='<b>很不錯！</b>記憶力就像肌肉，越練越強。想知道孩子的記憶力練到哪了嗎？花 3 分鐘免費檢測看看。';
    else msg='<b>配對成功！</b>記不住其實不是笨，是還沒用對方法。強腦力用圖像記憶，讓孩子背東西也能這麼快。';
    document.getElementById('pitch').innerHTML=msg;
    try{ if(window.gtag) gtag('event','memory_game_win',{level:level,seconds:Math.round(s),moves:moves}); }catch(e){}
    overlay.classList.add('show');
  }

  // level buttons
  document.getElementById('levels').addEventListener('click',function(e){
    var b=e.target.closest('.lv'); if(!b)return;
    document.querySelectorAll('.lv').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); level=b.dataset.lv; overlay.classList.remove('show'); build();
  });
  document.getElementById('restart').addEventListener('click',build);
  document.getElementById('again').addEventListener('click',function(){overlay.classList.remove('show');build();});
  overlay.addEventListener('click',function(e){ if(e.target===overlay) overlay.classList.remove('show'); });

  build();
})();
</script>
