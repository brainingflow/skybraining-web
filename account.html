  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  (async ()=>{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
    // LINE 註冊時 LINE 沒給 Email，系統代填 line_…@members.skybraining.com，不秀給本人看
    const em = session.user.email || '';
    const who = em.toLowerCase().endsWith('@members.skybraining.com') ? 'LINE（還沒有設定 Email）' : (em || '（此帳號無 email）');
    $('card').innerHTML=`
      <h1>設定 / 修改密碼</h1>
      <p class="lead">設定密碼後，你也可以用「Email ＋ 密碼」登入（原本的 Google／LINE 登入仍然可用）。</p>

      <label for="pw">新密碼</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="至少 8 碼">
      <label for="pw2">再輸入一次新密碼</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="再打一次確認">
      <button class="btn" id="btnSave">儲存新密碼</button>
      <div class="msg" id="msg"></div>`;
    const msg=(t,type)=>{ const m=$('msg'); m.className='msg show '+type; m.textContent=t; };
    $('btnSave').onclick=async ()=>{
      const pw=$('pw').value, pw2=$('pw2').value;
      if(pw.length<8){ msg('密碼至少需要 8 碼。','error'); return; }
      if(pw!==pw2){ msg('兩次輸入的密碼不一樣，請再確認。','error'); return; }
      $('btnSave').disabled=true; msg('儲存中…','ok');
      const { error } = await supabase.auth.updateUser({ password: pw });
      $('btnSave').disabled=false;
      if(error){ msg('❌ '+error.message,'error'); return; }
      $('pw').value=''; $('pw2').value='';
      msg('✅ 密碼已更新！之後可以用這個 Email ＋ 新密碼登入。','ok');
    };
  })();
</script>

    if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){run([{id:'local-preview-ann',title:'10/31（六）高雄 3 小時體驗場 限時免費',body:'3 小時實體實戰，現場帶你練圖像記憶與心智圖。',btn_text:'免費報名',link:'ad-live.html',starts_at:'2026-10-24T00:00:00+08:00',ends_at:'2026-10-28T23:59:00+08:00',placement:'both',active:true}]);return}
    /* PREVIEW-MOCK:END */
    try{var c=JSON.parse(sessionStorage.getItem(SS)||'null');if(c&&Date.now()-c.t<6e5){run(c.list);return}}catch(e){}
    if(!window.fetch)return;
    fetch(SB+'/rest/v1/announcements?select=id,title,body,btn_text,link,starts_at,ends_at,placement,active&active=eq.true&order=starts_at.desc&limit=10',{headers:{apikey:KEY}})
      .then(function(r){return r.ok?r.json():[]})
      .then(function(list){
        if(!(list instanceof Array))list=[];
        try{sessionStorage.setItem(SS,JSON.stringify({t:Date.now(),list:list}))}catch(e){}
        run(list);
      })
      .catch(function(){});
  }
  // 等頁面畫好再讀，不跟主要內容搶
  if(document.readyState==='complete')setTimeout(start,800);
  else window.addEventListener('load',function(){setTimeout(start,800)});
})();
</script>
