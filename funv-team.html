<script>
  /* ?t= 開通碼：在 GA 之前收進 storage 並從網址拿掉，GA 與網址列才不會留下它 */
  (function(){try{var q=new URLSearchParams(location.search),t=(q.get('t')||'').trim().slice(0,200);if(!t)return;
  try{sessionStorage.setItem('funv_team_t',t);}catch(e){}
  try{localStorage.setItem('funv_team_t',JSON.stringify({t:t,ts:Date.now()}));}catch(e){}
  q.delete('t');q=q.toString();history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash);}catch(e){}})();
</script>

<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;
    --line-brand:#06C755;--hair:rgba(21,23,49,.1);--err:#d64545;
    --sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:rgba(250,249,245,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;max-width:760px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:26px;line-height:1.08;color:var(--indigo);letter-spacing:1px;}
  .wm-accent{background:linear-gradient(120deg,#FFB020,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .out{font-family:var(--round);font-weight:700;font-size:13.5px;color:var(--ink-soft);background:#fff;border:1.5px solid var(--hair);border-radius:30px;padding:6px 14px;cursor:pointer;}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 70px;}
  h1{font-weight:800;font-size:clamp(24px,6vw,32px);color:var(--indigo);line-height:1.3;}
  .sub{color:var(--ink-soft);font-size:14.5px;margin-top:4px;}
  .state{padding:60px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px 18px;margin-top:20px;}
  .gate{text-align:center;padding:30px 20px;}
  .gate p{color:var(--ink-soft);font-size:15px;margin-top:8px;word-break:keep-all;overflow-wrap:anywhere;}
  .btn-line{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:320px;margin-top:22px;font-family:var(--round);font-weight:800;font-size:17px;color:#fff;background:var(--line-brand);border:none;border-radius:30px;padding:14px 20px;cursor:pointer;box-shadow:0 10px 24px rgba(6,199,85,.28);}
  .btn-line:disabled{opacity:.6;cursor:wait;}
  .btn-line svg{width:22px;height:22px;flex:none;}
  .alt{display:inline-block;margin-top:14px;font-size:13.5px;}
  .mno{display:inline-block;font-family:var(--round);font-weight:800;font-size:20px;line-height:1.4;color:var(--indigo);background:var(--paper-2);border-radius:10px;padding:0 10px;margin:2px 0;letter-spacing:1px;}
  .msg-err{color:var(--err);background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.22);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:20px;}
  .adm{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:linear-gradient(135deg,#fff8ec,#fdeede);border:1px solid rgba(255,176,32,.32);border-radius:14px;padding:12px 14px;margin-top:18px;}
  .adm label{display:block;font-family:var(--round);font-weight:700;font-size:13px;color:var(--indigo);margin-bottom:4px;}
  .adm select,.adm input{font-family:var(--sans);font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:10px;padding:8px 10px;min-width:170px;}
  .adm .go{font-family:var(--round);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);border:none;border-radius:22px;padding:9px 18px;cursor:pointer;}
  .team{margin-top:26px;}
  .team-h{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;font-size:20px;color:var(--indigo);}
  .team-h .bar{width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--amber),var(--orange));flex:none;}
  .team-h .n{font-size:13px;font-weight:700;color:var(--teal-deep);background:rgba(22,176,168,.12);border-radius:20px;padding:2px 11px;white-space:nowrap;}
  .sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-soft);margin:8px 0 0 16px;}
  .list{list-style:none;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-sm);margin-top:12px;overflow:hidden;}
  .list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--hair);}
  .list li:first-child{border-top:none;}
  .nm{font-weight:700;font-size:16px;color:var(--ink);word-break:break-all;}
  .dt{font-size:12.5px;color:var(--ink-soft);text-align:right;white-space:nowrap;align-self:center;}
  .ref{font-size:12.5px;color:var(--ink-soft);word-break:break-all;}
  .tg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;justify-self:end;}
  .tdot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;}
  .tg.none{color:var(--ink-soft);font-weight:500;}
  .empty{padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .foot{text-align:center;padding:26px 14px 30px;font-size:12.5px;color:#8b90a5;}
  .hush{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .msg-ok{color:var(--teal-deep);background:rgba(22,176,168,.1);border:1px solid rgba(22,176,168,.28);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;margin-top:20px;}
  .msg-ok small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .ph{font-size:13.5px;color:var(--ink-soft);}
  .tel{font-weight:700;color:var(--teal-deep);white-space:nowrap;}
  @media (max-width:600px){ .tel{display:inline-block;padding:2px 12px;border-radius:16px;background:rgba(22,176,168,.12);} }
</style>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL  = 'https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const SELF = 'funv-team.html';
  const LOGIN_PAGE = 'login.html?next=' + encodeURIComponent(SELF);
  const LINE_FN = SUPABASE_URL + '/functions/v1/line-auth';
  /* 跟 admin-funv.html 的 TAGS 同一套；那邊改名或改色，這裡要跟著改 */
  const TAGS=[
    { key:'red',    name:'不符資格',     color:'#E5484D' },
    { key:'orange', name:'待補件',       color:'#FF8A3D' },
    { key:'yellow', name:'待確認',       color:'#FFB020' },
    { key:'green',  name:'合格・可送件', color:'#2FA84F' },
    { key:'blue',   name:'已請款',       color:'#3B82F6' },
    { key:'gray',   name:'退出／不聯絡', color:'#9CA3AF' }
  ];
  const NO_TAG = { key:'none', name:'未標記', color:'#D1D5DB' };
  const TEAMS = ['蘇姐團隊','珠珠姐','羅總團隊','龎芸芸','林慧雯','美莉記者團隊','蕙禎團隊','君蓉','亭儀'];

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tagOf = (k)=>TAGS.find(t=>t.key===k) || NO_TAG;
  const ymd = new Intl.DateTimeFormat('en-CA',{ timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit' });
  const fmtDay = (s)=>{ const d = new Date(s); return isNaN(d) ? '' : ymd.format(d); };

  /* #demo=1（負責人畫面）、#demo=admin（管理員畫面）、#demo=none（沒開通畫面）：不登入、不打 Supabase，資料全是假的。
     用 hash 是因為本機 npx serve 會把 .html?query 301 掉並丟掉 query */
  const DEMO = (location.hash.match(/(?:^#|&)demo=(1|admin|none)(?:&|$)/) || [])[1] || '';
  const DEMO_ROWS = [
    ['示範一','蘇姐團隊','green','2026-10-02T03:00:00Z','0900-000-001'], ['示範二','蘇姐團隊','none','2026-10-05T09:30:00Z',''],
    ['示範三','蘇姐團隊','orange','2026-10-08T01:10:00Z','0900000003'], ['示範四','蘇姐團隊','red','2026-10-11T12:40:00Z','0900-000-004'],
    ['示範五','珠珠姐','yellow','2026-10-03T05:20:00Z','0900-000-005'], ['示範六','珠珠姐','blue','2026-10-09T07:00:00Z','0900-000-006'],
    ['示範七','羅總團隊','gray','2026-10-04T02:00:00Z','0900-000-007']
  ].map(d=>({ name:d[0], phone:d[4], referrer:d[1], team:d[1], tag:d[2], status:'new', created_at:d[3] })).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  /* 示範的「我綁定的團隊」；網址帶 ?t=demo-1～demo-8 會模擬開通 TEAMS 第 1～8 團，其他碼模擬失效 */
  const demoBound = DEMO === 'none' ? [] : ['蘇姐團隊','珠珠姐','林慧雯'];
  const demoRoster = (team)=> team ? DEMO_ROWS.filter(r=>r.team===team)
    : demoBound.flatMap(t=>{ const rs = DEMO_ROWS.filter(r=>r.team===t); return rs.length ? rs : [{ name:null, phone:null, referrer:null, tag:null, status:null, created_at:null, team:t }]; });

  $('logout').onclick = async ()=>{ if(!DEMO) await supabase.auth.signOut(); location.href = SELF; };

  const lineIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>';

  function showLogin(hasToken){
    $('content').innerHTML = `<div class="card gate">
      <div class="round" style="font-weight:800;font-size:19px;color:var(--indigo);">請先登入</div>
      <p>用你的 LINE 登入，就能看到你團隊的報名名單。</p>
      ${hasToken ? '<p>這是你團隊的專屬連結，登入後會自動開通。</p>' : ''}
      <button class="btn-line" id="btnLine">${lineIcon}用 LINE 登入</button>
      <div><a class="alt" href="${esc(LOGIN_PAGE)}">用 Email 或 Google 登入</a></div>
      <div id="loginMsg"></div>
    </div>`;
    $('btnLine').onclick = startLine;
  }

  /* 照 login.html 的 LINE 流程：先記住登入後要回本頁（line-callback.html 讀 sb_after_login），再去 LINE 授權；
     LINE 還沒就緒或連不上就退回 login.html（一樣帶 next 回來） */
  async function startLine(){
    const b = $('btnLine'); b.disabled = true;
    try{
      const redirect = location.origin + '/line-callback.html';
      const res = await fetch(`${LINE_FN}?action=start&mode=login&redirect_uri=${encodeURIComponent(redirect)}`,
                              { headers:{ apikey: SUPABASE_ANON } });
      const j = await res.json();
      if(j && j.ok && j.url){
        try{ sessionStorage.setItem('sb_after_login', SELF); }catch(e){}
        try{ localStorage.setItem('sb_after_login', JSON.stringify({ u: SELF, t: Date.now() })); }catch(e){}
        location.href = j.url; return;
      }
    }catch(e){}
    location.href = LOGIN_PAGE;
  }

  const telLink = (p)=>{
    const s = String(p==null ? '' : p).trim(), n = s.replace(/[^\d+]/g, '').replace(/(?!^)\+/g, '');
    return n ? `<a class="tel" href="tel:${esc(n)}">${esc(s)}</a>` : (s ? esc(s) : '—');
  };

  function teamBlock(team, rows){
    const people = rows.filter(r=>r.created_at);
    const counts = {};
    people.forEach(r=>{ const k = tagOf(r.tag).key; counts[k] = (counts[k]||0) + 1; });
    const sum = TAGS.concat([NO_TAG]).filter(t=>counts[t.key])
      .map(t=>`<span><span class="tdot" style="background:${t.color}"></span> ${esc(t.name)} ${counts[t.key]}</span>`).join('');
    const list = people.length ? `<ul class="list">${people.map(r=>{
      const t = tagOf(r.tag);
      return `<li>
        <div class="nm">${esc(r.name || '（沒填名字）')}</div>
        <div class="dt">${esc(fmtDay(r.created_at))}</div>
        <div class="ph">電話：${telLink(r.phone)}</div>
        <div class="tg${t.key==='none'?' none':''}"><span class="tdot" style="background:${t.color}"></span>${esc(t.name)}</div>
        <div class="ref">推薦人：${esc(String(r.referrer||'').trim() || '—')}</div>
      </li>`;
    }).join('')}</ul>` : `<div class="list"><div class="empty">這個團隊目前還沒有人報名。</div></div>`;
    return `<section class="team">
      <h2 class="team-h"><span class="bar"></span>${esc(team)}<span class="n">${people.length} 人</span></h2>
      ${sum ? `<div class="sum">${sum}</div>` : ''}
      ${list}
    </section>`;
  }

  function renderRoster(rows){
    const order = [], byTeam = {};
    (rows||[]).forEach(r=>{ if(!byTeam[r.team]){ byTeam[r.team] = []; order.push(r.team); } byTeam[r.team].push(r); });
    return order.map(t=>teamBlock(t, byTeam[t])).join('');
  }

  async function roster(team){
    if(DEMO) return { data: demoRoster(team), error: null };
    return team ? supabase.rpc('funv_team_roster', { p_team: team }) : supabase.rpc('funv_team_roster');
  }

  /* 開通碼由 <head> 那段從網址收進來：sessionStorage 撐過同分頁的 LINE 登入來回；
     localStorage 那份給「LINE App 授權完開新分頁回來」用，跟 sb_after_login 一樣只認 10 分鐘 */
  const T_KEY = 'funv_team_t';
  function peekToken(){
    let t = '';
    try{ t = sessionStorage.getItem(T_KEY) || ''; }catch(e){}
    if(!t){
      try{
        const o = JSON.parse(localStorage.getItem(T_KEY) || 'null'), age = o ? Date.now() - o.ts : -1;
        if(o && typeof o.t === 'string' && age >= 0 && age <= 10*60*1000) t = o.t;
        else if(o) localStorage.removeItem(T_KEY);
      }catch(e){}
    }
    return t;
  }
  function dropToken(){
    try{ sessionStorage.removeItem(T_KEY); }catch(e){}
    try{ localStorage.removeItem(T_KEY); }catch(e){}
  }
  async function claim(t){
    if(DEMO){
      const m = /^demo-([1-8])$/.exec(t), team = m ? TEAMS[m[1]-1] : '';
      if(!team) return { data:null, error:{ message:'這個連結已經失效或不完整，請向 Sky 老師要新的連結' } };
      if(DEMO !== 'admin' && !demoBound.includes(team)) demoBound.push(team);
      return { data:team, error:null };
    }
    return supabase.rpc('funv_team_claim', { p_token: t });
  }

  function adminBar(){
    return `<div class="adm">
      <div><label for="selTeam">管理員：看任一團隊</label>
        <select id="selTeam"><option value="">我綁定的團隊</option>${TEAMS.map(t=>`<option>${esc(t)}</option>`).join('')}<option value="__other">其他（自填）</option></select></div>
      <div id="otherWrap" style="display:none;"><label for="inTeam">團隊名（跟報名表邀請人一字不差）</label><input id="inTeam" type="text"></div>
      <button class="go" id="btnTeam">查看</button>
    </div><div id="rosterBox"></div>`;
  }

  async function loadInto(box, team, isAdmin, memberNo){
    box.innerHTML = '<div class="state"><div class="spin"></div>讀取名單中…</div>';
    const { data, error } = await roster(team);
    if(error){
      box.innerHTML = `<div class="msg-err">讀取名單失敗：${esc(error.message)}<br><span style="font-size:12.5px;">請把這段訊息截圖給 Sky 老師。</span></div>`;
      return;
    }
    if(!data || !data.length){
      if(team){ box.innerHTML = teamBlock(team, []); return; }
      box.innerHTML = isAdmin
        ? '<div class="card gate"><p>你的帳號沒有綁定團隊。用上面的選單挑一個團隊來看。</p></div>'
        : `<div class="card gate">
            <div class="round" style="font-weight:800;font-size:19px;color:var(--indigo);">還沒開通</div>
            <p>你的 LINE 帳號還沒開通團隊名單，請把你的會員編號 ${memberNo ? `<span class="mno">${esc(memberNo)}</span>` : '（在會員中心最上面）'} 給 <span style="white-space:nowrap;">Sky 老師</span>開通。</p>
            ${memberNo ? '' : '<p><a href="member.html">→ 到會員中心看會員編號</a></p>'}
          </div>`;
      return;
    }
    box.innerHTML = renderRoster(data);
  }

  (async ()=>{
    let isAdmin = false, memberNo = '';
    const pendingT = peekToken();
    if(DEMO){
      isAdmin = DEMO === 'admin';
      memberNo = 'SB00000';
    }else{
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session){ showLogin(!!pendingT); return; }
      try{ const { data } = await supabase.rpc('is_admin'); isAdmin = data === true; }catch(e){}
      try{ const { data:m } = await supabase.rpc('member_me'); if(m && m.ok) memberNo = m.member_no || ''; }catch(e){}
    }
    $('logout').style.display = '';

    let note = '', claimed = '';
    if(pendingT){
      dropToken();
      let res;
      try{ res = await claim(pendingT); }catch(e){ res = { data:null, error:e }; }
      if(res.error || !res.data){
        const m = res.error && res.error.message ? res.error.message : '沒有回應';
        note = `<div class="msg-err">開通失敗：${esc(m).split('Sky 老師').join('<span style="white-space:nowrap;">Sky 老師</span>')}${/失效|登入/.test(m) ? '' : '<br><span style="font-size:12.5px;">請把這段訊息截圖給 Sky 老師。</span>'}</div>`;
      }else{
        claimed = String(res.data);
        note = `<div class="msg-ok">已開通：${esc(claimed)} 名單${isAdmin ? '<small>你是管理員，不會被綁進負責人清單；下面直接顯示這個團隊。</small>' : ''}</div>`;
      }
    }

    if(!isAdmin){
      $('content').innerHTML = note + '<div id="rosterBox"></div>';
      await loadInto($('rosterBox'), '', false, memberNo);
      return;
    }
    $('content').innerHTML = note + adminBar();
    const sel = $('selTeam');
    sel.onchange = ()=>{ $('otherWrap').style.display = sel.value === '__other' ? '' : 'none'; };
    $('btnTeam').onclick = ()=>{
      const team = sel.value === '__other' ? $('inTeam').value.trim() : sel.value;
      if(sel.value === '__other' && !team){ $('inTeam').focus(); return; }
      loadInto($('rosterBox'), team, true, memberNo);
    };
    if(claimed){
      if(TEAMS.includes(claimed)) sel.value = claimed;
      else { sel.value = '__other'; $('otherWrap').style.display = ''; $('inTeam').value = claimed; }
    }
    await loadInto($('rosterBox'), claimed, true, memberNo);
  })();
</script>
</body>
</html>
