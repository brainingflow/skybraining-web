<style>

    --line-brand:#06C755;--hair:rgba(21,23,49,.1);--err:#d64545;

  *{margin:0;padding:0;box-sizing:border-box;}

  a{color:var(--teal-deep);text-decoration:none;}

  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;max-width:1180px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:26px;line-height:1.08;color:var(--indigo);letter-spacing:1px;}

  .sub{color:var(--ink-soft);font-size:14.5px;margin-top:4px;}
  .state{padding:60px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}

  .mno{display:inline-block;font-family:var(--round);font-weight:800;font-size:20px;line-height:1.4;color:var(--indigo);background:var(--paper-2);border-radius:10px;padding:0 10px;margin:2px 0;letter-spacing:1px;}

  .adm label{display:block;font-family:var(--round);font-weight:700;font-size:13px;color:var(--indigo);margin-bottom:4px;}
  .adm select,.adm input{font-family:var(--sans);font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:10px;padding:8px 10px;min-width:170px;}
  .adm .go{font-family:var(--round);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);border:none;border-radius:22px;padding:9px 18px;cursor:pointer;}

  .stb-tb td.c-ln{min-width:16em;}
  .stb-tb textarea.e-ln{min-height:38px;height:38px;resize:vertical;overflow:hidden;}
  .stb-tb input.e-cd:focus,.stb-tb textarea.e-ln:focus{outline:none;border-color:var(--orange);}
  .stb-tb tr.dirty input.e-cd,.stb-tb tr.dirty textarea.e-ln{border-color:rgba(255,138,61,.6);}
  .e-msg{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;}
  .e-msg:empty{display:none;}
  .e-msg.ok{color:var(--teal-deep);}
  .e-msg.err{color:var(--err);font-weight:500;}
  .stb-tb .c-pd{width:5em;text-align:center;}
  .paid{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1.5px solid var(--hair);border-radius:12px;background:#fff;cursor:pointer;}

  .p-msg{display:block;font-size:12px;font-weight:700;color:var(--teal-deep);margin-top:2px;}
  .p-msg:empty{display:none;}
  .p-msg.err{color:var(--err);font-weight:500;min-width:8em;text-align:left;}
  .swipe{display:none;}
  @media (max-width:600px){ .stb-tb{font-size:13.5px;} .swipe{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:10px;text-align:right;} }

  const demoBound = DEMO === 'none' ? [] : ['蘇姐團隊','珠珠姐','小可（牛角筋絡）','緹林（泰式高床）'];

  $('logout').onclick = async ()=>{ if(!DEMO) await supabase.auth.signOut(); location.href = SELF; };

  function showLogin(hasToken){

  /* 照 login.html 的 LINE 流程：先記住登入後要回本頁（line-callback.html 讀 sb_after_login），再去 LINE 授權；

  async function startLine(){

  const telLink = (p)=>{

  const kwOfRows = (team, rows)=>{ const r = rows.find(x=>x.course_kw); return r ? r.course_kw : courseKwOf(team); };

  /* 上課日期、備註、已收款：資料庫還沒跑 2026-11-10 那份 SQL 時名單不會帶 id／leader_paid，這幾欄就不顯示 */
  async function saveInfo(id, cd, ln){
    if(DEMO){
      await new Promise(ok=>setTimeout(ok, 350));
      if(ln.indexOf('測試失敗') >= 0) return { data:null, error:{ message:'（示範）模擬存檔失敗：網路斷線' } };
      const d = DEMO_ROWS.find(x=>x.id===id);

      return { data:[{ id, class_date:d.class_date, leader_note:d.leader_note, leader_note_updated_at:d.leader_note_updated_at }], error:null };
    }
    return supabase.rpc('funv_team_set_class_info', { p_id:id, p_class_date:cd, p_leader_note:ln });
  }
  async function setPaid(id, paid, tr){
    if(DEMO){
      await new Promise(ok=>setTimeout(ok, 350));
      const t = tr && tr.querySelector('.e-ln');
      if(t && t.value.indexOf('測試失敗') >= 0) return { data:null, error:{ message:'（示範）模擬存檔失敗：網路斷線' } };
      const d = DEMO_ROWS.find(x=>x.id===id);
      if(!d) return { data:null, error:{ message:'沒有權限：這位學員不在你的名單裡' } };
      d.leader_paid = paid;
      return { data:[{ id, leader_paid:paid, leader_paid_at:new Date().toISOString() }], error:null };
    }
    return supabase.rpc('funv_team_set_paid', { p_id:id, p_paid:paid });
  }
  const friendly = (e)=>{
    const m = String((e && e.message) || e || '');
    if(/funv_team_set_class_info|funv_team_set_paid|schema cache|Could not find the function/i.test(m)) return '這個功能還沒開通，請告訴 Sky 老師';
    if(/JWT|session/i.test(m)) return '登入過期了，請重新整理頁面再登入';
    if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return '網路不穩，請再改一次';
    return m || '沒有回應，請再改一次';
  };
  const setMsg = (el, txt, cls)=>{ if(!el) return; el.className = 'e-msg' + (cls ? ' ' + cls : ''); el.textContent = txt; };
  const sameRows = (id)=>[...document.querySelectorAll('tr.st')].filter(x=>x.getAttribute('data-id') === id);
  const rowOf = (tr)=>{ const id = tr.getAttribute('data-id'); return { id, cd:tr.querySelector('.e-cd'), ln:tr.querySelector('.e-ln'), msg:tr.querySelector('.e-msg') }; };

  /* 上課日期、備註：離開欄位（失焦）且內容有變就自動存 */
  async function saveInfoRow(tr){
    const r = rowOf(tr); if(!r.cd || !r.ln) return;
    const cd = r.cd.value.trim(), ln = r.ln.value.trim();
    if(cd === (r.cd.getAttribute('data-saved')||'') && ln === (r.ln.getAttribute('data-saved')||'')){ tr.classList.remove('dirty'); setMsg(r.msg, '', ''); return; }
    setMsg(r.msg, '儲存中…', '');
    let res;
    try{ res = await saveInfo(r.id, cd, ln); }catch(e){ res = { data:null, error:e }; }
    const row = res && !res.error ? (Array.isArray(res.data) ? res.data[0] : res.data) : null;
    if(!row){ setMsg(r.msg, '存不起來：' + friendly(res && res.error), 'err'); return; }
    /* 同一位學員可能同時在團隊與課程兩個分頁，兩邊一起更新 */
    sameRows(r.id).forEach(x=>{
      const o = rowOf(x);
      /* 存的期間使用者可能已經在這列打別的字，正在打的那列不覆蓋 */
      if(x !== tr){ o.cd.value = row.class_date || ''; o.ln.value = row.leader_note || ''; }
      o.cd.setAttribute('data-saved', row.class_date || ''); o.ln.setAttribute('data-saved', row.leader_note || '');
      const still = o.cd.value.trim() !== (row.class_date || '') || o.ln.value.trim() !== (row.leader_note || '');
      x.classList.toggle('dirty', still);
      setMsg(o.msg, still ? '還沒存（離開欄位就存）' : (DEMO ? '✓ 已存（示範）' : '✓ 已存'), still ? '' : 'ok');
    });
  }
  /* 已收款：勾／取消就存 */
  async function savePaid(cb){
    const tr = cb.closest('tr.st'), id = tr.getAttribute('data-id'), want = cb.checked, msg = tr.querySelector('.p-msg');
    cb.disabled = true; msg.className = 'p-msg'; msg.textContent = '儲存中…';
    let res;
    try{ res = await setPaid(id, want, tr); }catch(e){ res = { data:null, error:e }; }
    cb.disabled = false;
    const row = res && !res.error ? (Array.isArray(res.data) ? res.data[0] : res.data) : null;
    if(!row){ cb.checked = !want; msg.className = 'p-msg err'; msg.textContent = '存不起來：' + friendly(res && res.error); return; }
    sameRows(id).forEach(x=>{
      const c = x.querySelector('.e-paid'); c.checked = !!row.leader_paid;
      x.querySelector('.paid').classList.toggle('on', !!row.leader_paid);
      const m = x.querySelector('.p-msg'); m.className = 'p-msg'; m.textContent = '✓';
    });
  }
  function bindEditors(box){
    box.onclick = (e)=>{
      const rf = e.target.closest('.rf');
      if(rf){ rf.classList.toggle('full'); return; }
      const cr = e.target.closest('.crs');
      if(cr){ const full = cr.getAttribute('title'); const sh = cr.getAttribute('data-short') || cr.textContent;
        if(cr.classList.toggle('full')){ cr.setAttribute('data-short', sh); cr.textContent = full; } else cr.textContent = cr.getAttribute('data-short');
        return; }
      const tb = e.target.closest('.ttab'); if(!tb) return;
      const k = tb.getAttribute('data-k');
      box.querySelectorAll('.ttab').forEach(b=>{ const on = b === tb; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
      box.querySelectorAll('.tpanel').forEach(p=>{ p.hidden = p.getAttribute('data-k') !== k; });
      fitNotes(box);
    };
    box.onchange = (e)=>{ if(e.target.classList.contains('e-paid')) savePaid(e.target); };
    box.oninput = (e)=>{
      const tr = e.target.closest('tr.st'); if(!tr || e.target.classList.contains('e-paid')) return;

      if(e.target.classList.contains('e-ln')) fitNote(e.target);
    };
    /* 管理員每按一次「查看」都會再進來一次，focusout 只能用 addEventListener，所以記號擋重複綁 */
    if(box.getAttribute('data-bound')) return;
    box.setAttribute('data-bound', '1');
    box.addEventListener('focusout', (e)=>{
      if(!e.target.classList || !(e.target.classList.contains('e-cd') || e.target.classList.contains('e-ln'))) return;
      saveInfoRow(e.target.closest('tr.st'));
    });
  }
  /* 備註依內容自動長高，長備註整段看得到 */
  const fitNote = (t)=>{ if(!t.offsetParent) return; t.style.height = 'auto'; t.style.height = Math.max(38, t.scrollHeight + 3) + 'px'; };
  const fitNotes = (root)=>root.querySelectorAll('textarea.e-ln').forEach(fitNote);
  window.addEventListener('beforeunload', (e)=>{ if(document.querySelector('tr.st.dirty')){ e.preventDefault(); e.returnValue = ''; } });

  const ST_NAME = { 'new':'新報名' };
  /* 課名短名：取【】裡的課名，去掉「實戰班／培訓班／調理」這類尾巴；【】裡只剩班別就改用【】前面那段。全名放 title，滑過或長按看 */
  const SUFFIX = /(實戰班|技能培訓班|培訓班|技巧班|實作班|講師班|講座|班)$/;
  function courseShort(full){
    const m = /^(.*?)【([^】]*)】/.exec(full);
    if(!m) return full;
    let t = m[2].replace(SUFFIX, '').replace(/調理$/, '').trim();
    if(!t) t = m[1].trim();
    return t || full;
  }
  const courseChips = (c)=>{
    if(typeof c !== 'string' || !c.trim()) return '';
    return c.split(/[、,，]/).map(x=>x.trim()).filter(Boolean)
      .map(x=>`<span class="crs" title="${esc(x)}" tabindex="0">${esc(courseShort(x))}</span>`).join('');

  const stBadge = (s)=>{ const v = s || 'new'; return `<span class="stb${v==='new'?' new':''}">${esc(ST_NAME[v] || v)}</span>`; };
  function stuRow(r, i){
    const t = tagOf(r.tag), edit = !!r.id, paidOk = edit && typeof r.leader_paid === 'boolean';
    /* 跟學生管理系統一樣：每 5 人一組交替淡灰，不符資格／退出整列淡紅 */

  function teamPanel(team, rows, k, active){

    const edit = people.some(r=>r.id), paidOk = people.some(r=>typeof r.leader_paid === 'boolean');

  /* 一次只看一個團隊（或一門課）；管好幾團的人用上面的分頁切換 */
  function renderRoster(rows, isAdmin){
    const order = [], byTeam = {};
    (rows||[]).forEach(r=>{ if(!byTeam[r.team]){ byTeam[r.team] = []; order.push(r.team); } byTeam[r.team].push(r); });

      `<button type="button" class="ttab${i ? '' : ' on'}" role="tab" aria-selected="${i ? 'false' : 'true'}" data-k="${i}">${esc(t)}<span class="n">${byTeam[t].filter(r=>r.created_at).length}</span></button>`).join('')}</div>` : '';
    return tabs
      + (canEdit ? '<div class="hush" style="margin-top:12px;">上課日期、備註填完離開欄位就自動存；已收款勾了就存。Sky 老師和看得到這位學員的負責人都看得到。</div>' : '')
      + order.map((t,i)=>teamPanel(t, byTeam[t], i, i === 0)).join('');
  }

  async function roster(team){
    if(DEMO) return { data: demoRoster(team), error: null };
    return team ? supabase.rpc('funv_team_roster', { p_team: team }) : supabase.rpc('funv_team_roster');

  /* 開通碼由 <head> 那段從網址收進來：sessionStorage 撐過同分頁的 LINE 登入來回；
     localStorage 那份給「LINE App 授權完開新分頁回來」用，跟 sb_after_login 一樣只認 10 分鐘 */
  const T_KEY = 'funv_team_t';
  function peekToken(){
    let t = '';
    try{ t = sessionStorage.getItem(T_KEY) || ''; }catch(e){}
    if(!t){
      try{
        const o = JSON.parse(localStorage.getItem(T_KEY) || 'null'), age = o ? Date.now() - o.ts : -1;
        if(o && typeof o.t === 'string' && age >= 0 && age <= 10*60*1000) t = o.t;
        else if(o) localStorage.removeItem(T_KEY);
      }catch(e){}
    }
    return t;
  }
  function dropToken(){
    try{ sessionStorage.removeItem(T_KEY); }catch(e){}
    try{ localStorage.removeItem(T_KEY); }catch(e){}
  }
  async function claim(t){
    if(DEMO){
      const m = /^demo-([1-9]|1[0-3])$/.exec(t), n = m ? +m[1] : 0;
      const team = n >= 9 ? COURSE_TEAMS[n-9].team : n ? TEAMS[n-1] : '';
      if(!team) return { data:null, error:{ message:'這個連結已經失效或不完整，請向 Sky 老師要新的連結' } };
      /* 帶專屬連結進來＝只管這一團的團隊長，示範時只綁這一團 */
      if(DEMO !== 'admin') demoBound.splice(0, demoBound.length, team);
      return { data:team, error:null };
    }
    return supabase.rpc('funv_team_claim', { p_token: t });
  }

  async function loadInto(box, team, isAdmin, memberNo){

  (async ()=>{

    }else{
      const { data:{ session } } = await supabase.auth.getSession();
      if(!session){ showLogin(!!pendingT); return; }
      try{ const { data } = await supabase.rpc('is_admin'); isAdmin = data === true; }catch(e){}
      try{ const { data:m } = await supabase.rpc('member_me'); if(m && m.ok) memberNo = m.member_no || ''; }catch(e){}
    }
    $('logout').style.display = '';

    let note = '', claimed = '';
    if(pendingT){
      dropToken();
      let res;
      try{ res = await claim(pendingT); }catch(e){ res = { data:null, error:e }; }
      if(res.error || !res.data){
        const m = res.error && res.error.message ? res.error.message : '沒有回應';
        note = `<div class="msg-err">開通失敗：${esc(m).split('Sky 老師').join('<span style="white-space:nowrap;">Sky 老師</span>')}${/失效|登入/.test(m) ? '' : '<br><span style="font-size:12.5px;">請把這段訊息截圖給 Sky 老師。</span>'}</div>`;
      }else{
        claimed = String(res.data);
        note = `<div class="msg-ok">已開通：${esc(claimed)} 名單${isAdmin ? '<small>你是管理員，不會被綁進負責人清單；下面直接顯示這個團隊。</small>' : ''}</div>`;
      }
    }

    if(!isAdmin){
      $('content').innerHTML = note + '<div id="rosterBox"></div>';
      await loadInto($('rosterBox'), '', false, memberNo);
      return;
    }
    $('content').innerHTML = note + adminBar();
    const sel = $('selTeam');
    sel.onchange = ()=>{ $('otherWrap').style.display = sel.value === '__other' ? '' : 'none'; };
    $('btnTeam').onclick = ()=>{
      const team = sel.value === '__other' ? $('inTeam').value.trim() : sel.value;
      if(sel.value === '__other' && !team){ $('inTeam').focus(); return; }
      loadInto($('rosterBox'), team, true, memberNo);
    };
    if(claimed){
      if(TEAMS.includes(claimed) || courseKwOf(claimed)) sel.value = claimed;
      else { sel.value = '__other'; $('otherWrap').style.display = ''; $('inTeam').value = claimed; }
    }
    await loadInto($('rosterBox'), claimed, true, memberNo);
  })();
</script>
</body>
</html>
