<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--violet:#7C6CF0;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --accent:linear-gradient(120deg,var(--amber),var(--orange));--shadow-md:0 18px 44px rgba(21,23,49,.12);--shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:clamp(24px,2.8vw,28px);line-height:1.08;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  /* tab bar */
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  /* 課程分頁列：每個課程一個實體頁，目前頁高亮 */
  .ctabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px;}
  .ctabs a{font-family:var(--round);font-weight:700;font-size:13.5px;line-height:1;color:var(--ink-soft);background:#fff;border:1.5px solid var(--hair);border-radius:24px;padding:10px 15px;white-space:nowrap;}
  .ctabs a:hover{border-color:var(--orange);color:var(--indigo);}
  .ctabs a.on{background:var(--accent);border-color:transparent;color:#fff;}
  /* 老闆 2026-11-18 加四個確認格後列表多 4 欄，外框放寬 80px 讓桌機不用橫捲 */
  .wrap{max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:22px;font-size:14.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .card h2{font-size:17px;color:var(--indigo);margin-bottom:4px;display:flex;align-items:center;gap:9px;}
  .card h2 .bar{width:5px;height:19px;border-radius:3px;background:linear-gradient(var(--amber),var(--orange));}
  .card-note{color:var(--ink-soft);font-size:13px;margin:2px 0 14px;}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-sm);padding:15px;}
  .tile .k{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-bottom:5px;}
  .tile .v{font-family:var(--round);font-weight:800;font-size:24px;color:var(--indigo);line-height:1.1;}
  input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
  textarea{min-height:90px;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
  label{display:block;font-weight:700;font-size:13px;color:var(--indigo);margin:10px 0 6px;font-family:var(--round);}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:var(--round);font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:28px;border:none;cursor:pointer;transition:transform .2s,filter .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 10px 24px rgba(22,176,168,.3);}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);font-size:13.5px;padding:9px 16px;}
  .btn-violet{color:#fff;background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .filters input,.filters select{width:auto;min-width:140px;flex:0 1 auto;padding:9px 12px;font-size:13.5px;}
  .filters input.search{flex:1 1 240px;min-width:180px;}
  .shint{font-size:12px;color:var(--ink-soft);margin:-4px 0 8px 2px;}
  .msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:13.5px;display:none;white-space:pre-wrap;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);border:1px solid rgba(22,176,168,.28);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .tbl-scroll{overflow-x:auto;margin-top:4px;max-height:560px;overflow-y:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px;}
  thead th{position:sticky;top:0;background:#fff;z-index:1;}
  th,td{border-bottom:1px solid var(--hair);padding:9px 10px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;}
  tbody tr:hover{background:var(--paper);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin:1px;white-space:nowrap;}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin:1px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap;}
  .chip.course{background:rgba(255,138,61,.13);color:#c85f1a;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  /* 頂端提醒 + 展開明細 */
  .demobar{background:linear-gradient(135deg,var(--amber),var(--orange));color:#3b2600;font-family:var(--round);font-weight:700;font-size:15px;text-align:center;padding:12px 16px;letter-spacing:.4px;box-shadow:0 6px 20px rgba(255,138,61,.35);}
  .warnbar{background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.42);color:#8a5a00;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;margin-bottom:20px;}
  .badge.st-new{background:rgba(255,176,32,.16);color:#b7791a;}
  .badge.st-go{background:rgba(124,108,240,.14);color:#4B37D8;}
  .badge.st-sent{background:rgba(22,176,168,.14);color:#0d8a83;}
  .badge.st-done{background:rgba(22,176,168,.3);color:#0a6b66;}
  .badge.st-no{background:var(--paper-2);color:var(--ink-soft);}
  /* 展開的明細會被 admin-contacts 那條 max-height:560px 切掉，這頁改成不限高 */
  .tbl-scroll{max-height:none;}
  tbody tr.rw{cursor:pointer;}
  tbody tr.rw.open{background:var(--paper-2);}
  .caret{color:var(--ink-soft);font-size:12px;white-space:nowrap;}
  tr.dt{display:none;}
  tr.dt.on{display:table-row;}
  tr.dt td{background:var(--paper);padding:16px 14px 18px;}
  .dhead{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;word-break:break-all;}
  .qa{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:4px 18px;border-top:1px solid var(--hair);padding:7px 0;}
  .qa .qn{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .qa .an{font-size:14px;color:var(--ink);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .qa .an.none{color:#c9ccd8;}
  /* 表格為了 12 欄有 min-width:720px，手機上明細會被推到畫面外，所以把明細內容收在看得到的寬度內 */
  @media(max-width:720px){.qa{grid-template-columns:1fr;}tr.dt td>*{max-width:calc(100vw - 96px);}}
  .idbtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .idbtns .path{font-size:11.5px;color:#a7abc2;word-break:break-all;}
  /* 老闆要一打開明細就看到標記與備註，所以這組放在 30 題上面，用底線跟題目隔開 */
  .etop{margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--hair);}
  .edit{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
  .edit .fld{flex:1 1 200px;min-width:180px;}
  .edit .wide{flex:2 1 320px;}
  .edit .sv{flex:0 0 auto;min-width:0;align-self:flex-end;}
  .edit textarea{min-height:76px;font-family:var(--sans);font-size:14px;}
  /* 顏色標記 */
  .tagwarn{background:#FFF4D6;border-bottom:1px solid rgba(255,176,32,.55);color:#8a5a00;font-weight:700;font-size:14px;text-align:center;padding:11px 16px;}
  tbody tr.rw td.c0,thead th:first-child{padding-left:20px;}
  .tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;}
  .taglegend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12.5px;color:var(--ink-soft);margin:4px 0 10px;}
  .taglegend .lg{display:inline-flex;align-items:center;white-space:nowrap;}
  /* 顏色篩選鈕列（T884）：跟 #fTag 下拉同一個狀態 */
  .tagfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px;}
  .tfbtn{--c:#5b5f7a;display:inline-flex;align-items:center;min-height:38px;font-family:var(--sans);font-size:13.5px;font-weight:500;line-height:1.2;color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:999px;padding:7px 14px;cursor:pointer;}
  .tfbtn .n{color:var(--ink-soft);font-weight:inherit;}
  .tfbtn:hover{border-color:var(--c);}
  .tfbtn.on{border:2px solid var(--c);padding:6.5px 13.5px;background:color-mix(in srgb,var(--c) 14%,#fff);font-weight:700;}
  .tfbtn.on .n{color:var(--ink);}
  .taghint{font-size:12.5px;color:var(--ink-soft);margin:2px 0 10px;}
  .edit .tagfld{flex:2 1 360px;}
  .tagbtns{display:flex;gap:7px;flex-wrap:wrap;}
  .tagbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;font-weight:500;line-height:1.2;color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:10px;padding:8px 11px;cursor:pointer;}
  .tagbtn .sw{width:15px;height:15px;border-radius:4px;background:var(--c);color:#fff;font-size:11px;line-height:15px;text-align:center;font-weight:700;}
  .tagbtn:hover{border-color:var(--c);}
  .tagbtn.on{border:2px solid var(--c);padding:7.5px 10.5px;background:color-mix(in srgb,var(--c) 14%,#fff);font-weight:700;}
  .tagbtn:disabled{opacity:.55;cursor:wait;}
  /* 老闆 2026-11-12：列表要跟老師名單頁一樣一格一格、每列一樣矮，長的字截成「…」，全文看滑鼠提示或點開明細 */
  #tblWrap th,#tblWrap td{border-right:1px solid var(--hair);padding-left:5px;padding-right:5px;}
  #tblWrap th:last-child,#tblWrap td:last-child{border-right:none;}
  #tblWrap tr.rw>td.c0,#tblWrap thead th:first-child{padding-left:16px;}
  #tblWrap thead th{background:#F4F3FA;}
  #tblWrap tr.rw>td{white-space:nowrap;height:40px;line-height:20px;padding-top:6px;padding-bottom:6px;}
  #tblWrap tr.rw.zb>td{background:#F6F7F9;}
  #tblWrap tr.rw.rd>td{background:#FDECEC;}
  #tblWrap tr.rw:hover>td{background:var(--paper);}
  #tblWrap tr.rw.rd:hover>td{background:#F9DFDF;}
  #tblWrap tr.rw.open>td{background:var(--paper-2);}
  .cut{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notew{width:120px;}
  .ln-cell .notew{width:90px;}
  .cdw.cut{max-width:4.5em;}
  .rf-cell .cut{max-width:4.5em;}
  td .chip.course{max-width:8.5em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
  @media(max-width:600px){.notew{width:84px;}.ln-cell .notew{width:84px;}}
  .tgc{max-width:4.6em;}
  /* 表格比容器寬時，展開的明細（含儲存鈕）釘在看得到的範圍內，不用橫捲找按鈕 */
  @media(min-width:721px){tr.dt td>*{position:sticky;left:14px;max-width:min(1092px,calc(100vw - 125px));}}
  .cdw{white-space:nowrap;font-weight:700;color:var(--teal-deep);}
  /* 四個確認格（老闆 2026-11-18）：表頭字由程式在固定位置折兩行（CJK 自動折會折成一字一行），格子只放一個勾選框，整格都點得到 */
  #tblWrap th.ck-h{white-space:nowrap;text-align:center;line-height:1.25;width:3.2em;min-width:3.2em;padding-left:3px;padding-right:3px;}
  .ck-h .ckn{display:block;font-weight:500;font-size:11px;color:#8b90a5;white-space:nowrap;}
  .ck-h .ckn.off{color:#b45309;font-weight:700;}
  #tblWrap tr.rw>td.ck-cell{text-align:center;cursor:pointer;padding-left:3px;padding-right:3px;}
  #tblWrap tr.rw>td.ck-cell.on{background:#E3F5E8;}
  #tblWrap tr.rw>td.ck-cell.off{cursor:not-allowed;}
  td.ck-cell input{width:17px;height:17px;margin:0;vertical-align:middle;accent-color:#2FA84F;cursor:pointer;}
  td.ck-cell input:disabled{cursor:not-allowed;}
  td.ck-cell.saving input{opacity:.45;}
  .cktoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;max-width:min(560px,calc(100vw - 32px));padding:11px 16px;border-radius:12px;font-size:13.5px;line-height:1.5;box-shadow:var(--shadow-md);display:none;white-space:pre-wrap;}
  .cktoast.show{display:block;}
  .cktoast.ok{background:#E8F7EF;color:#1d6b3c;border:1px solid rgba(47,168,79,.35);}
  .cktoast.error{background:#FDECEC;color:#a12c2c;border:1px solid rgba(214,69,69,.35);}
  .lnote{background:rgba(22,176,168,.06);border:1px dashed rgba(22,176,168,.4);border-radius:12px;padding:4px 12px 10px;}
  .lnote .stamp{font-size:12px;color:var(--ink-soft);margin-top:4px;}
</style>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  /* ── 顏色標記：老闆要改名稱或顏色，只改這裡 ──
     name＝畫面上與匯出 Excel／CSV 顯示的中文，color＝色塊顏色，兩個都可以隨時改；
     key 是存進資料庫的值，不要改。要「多加一種顏色」才需要同步改 supabase/sql/funv_tag.sql 的 check。 */
  const TAGS=[
    { key:'red',    name:'不符資格',     color:'#E5484D' },
    { key:'orange', name:'待補件',       color:'#FF8A3D' },
    { key:'yellow', name:'待確認',       color:'#FFB020' },
    { key:'green',  name:'合格・可送件', color:'#2FA84F' },
    { key:'blue',   name:'已請款',       color:'#3B82F6' },
    { key:'gray',   name:'退出／不聯絡', color:'#9CA3AF' }
  ];
  /* ── 四個確認格：表頭字（name）與滑鼠提示（tip）只改這裡，表頭、篩選、匯出全部跟著改 ──
     col 是資料庫欄名，不要改；exp 是匯出 Excel／CSV 的欄名，沒寫就用 name。
     收款匯出要叫「已收款」：桌面學生管理系統匯入線上匯出檔時照欄名認欄位，只認「已收款」，改了線上收款就匯不進去。
     「收款」沿用老師名單頁也看得到、也能勾的 leader_paid，不另開欄位；
     其他三格只有後台看得到，欄位由 supabase/sql/2026-11-18_funv_add_confirm_checks.sql 建立。 */
  const CHECKS=[
    { col:'apply_sent',       name:'申請表寄出', tip:'申請表已寄出' },
    { col:'receipt_sent',     name:'領據寄出',   tip:'領據已寄出' },
    { col:'leader_paid',      name:'收款',       tip:'已收款', exp:'已收款' },
    { col:'passbook_checked', name:'存摺',       tip:'已看過帳簿封面、確認無誤才勾' }
  ];
  const ckExp=(c)=>c.exp||c.name;
  const CK_SQL='supabase/sql/2026-11-18_funv_add_confirm_checks.sql';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* created_at 是 UTC，直接切字串會差 8 小時，所以轉成瀏覽器所在時區再顯示 */
  const fmtDT=(s)=>{
    if(!s) return '';
    const d=new Date(s); if(isNaN(d.getTime())) return String(s).slice(0,16).replace('T',' ');
    const p=(n)=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  };
  /* 匯出的檔會寄給別人看，不能跟著開檔那台電腦的時區跑，固定用台北時間；
     台灣 1979 年後沒有日光節約，直接 +8 小時比 Intl 在各瀏覽器上穩定 */
  const fmtTPE=(s)=>{
    if(!s) return '';

          <div class="filters">
            <input class="search" id="fSearch" type="text" placeholder="關鍵字搜尋：名字、手機、備註、任何欄位…" aria-describedby="fSearchHint">

          </div>

          <div class="taghint">點顏色就只看那一種，再點一次取消。（點一列展開，按色塊就存；再按同色＝清除）</div>
          <div id="tblWrap"><div class="state"><div class="spin"></div>載入報名表中…</div></div>
        </div>
      </div>`;

    $('fStatus').innerHTML='<option value="">全部狀態</option>'+STATUS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');

    let rows=[], view=[];
    let HAS_TAG=true, HAS_CLS=true, HAS_CK=true;

    const badge=(st)=>{
      const s=st||'new';
      return `<span class="badge ${ST_CLASS[s]||'st-no'}">${esc(s)}</span>`;
    };
    const answer=(r,qq)=>{
      if(qq.bool) return r[qq.k]===true?'是':'否';
      const v=r[qq.k];
      if(qq.multi) return (v&&v.length)?v.join('\n'):'';
      return v==null?'':String(v);
    };
    const show=(el,txt,type)=>{ el.className='msg e-msg show '+type; el.textContent=txt; };

    /* 身分證在私有 bucket，只能發簽名網址：匯出給別人看的給 7 天，站內下載 60 秒就夠 */
    const IDCOLS=[{k:'id_front_path',side:'正面',t:'身分證正面連結'},{k:'id_back_path',side:'背面',t:'身分證背面連結'},{k:'passbook_path',side:'匯款帳簿封面',t:'匯款帳簿封面',emptyText:''}];
    const extOf=(p)=>{ const m=/\.[a-zA-Z0-9]+$/.exec(String(p||'')); return m?m[0].toLowerCase():'.jpg'; };
    const safeName=(v)=>{ const t=String(v==null?'':v).replace(/[\\/:*?"<>|]/g,'_').trim(); return t||'未填'; };
    const signOne=async (path,sec)=>{
      const { data, error } = await supabase.storage.from('funv-ids').createSignedUrl(path,sec);
      if(error||!data||!data.signedUrl) throw new Error((error&&error.message)||'沒拿到網址');
      return data.signedUrl;
    };
    const idPaths=(rs)=>{ const out=[]; rs.forEach(r=>IDCOLS.forEach(c=>{ if(r[c.k]) out.push(r[c.k]); })); return out; };
    const signMany=async (paths,msgEl,label)=>{
      const map={};
      for(let i=0;i<paths.length;i++){
        msgEl.className='msg show'; msgEl.textContent=label+' '+(i+1)+'/'+paths.length+'…';
        try{ map[paths[i]]=await signOne(paths[i],604800); }catch(e){ map[paths[i]]=''; }
      }
      return map;
    };
    const idCell=(map,r,c)=>{ const p=r[c.k]; if(!p) return c.emptyText!=null?c.emptyText:'（沒有檔案）'; if(DEMO) return '示範模式無圖'; return map[p]||'（連結產生失敗）'; };

    const qaRow=(r,qq)=>{
      let an;
      if(qq.side){
        const p=r[qq.k];
        an = p
          ? `<div class="idbtns"><button class="btn btn-ghost idbtn" data-path="${esc(p)}" data-side="${esc(qq.side)}">${DEMO?'示範模式無圖':'看身分證'+esc(qq.side)}</button><button class="btn btn-ghost iddl" data-path="${esc(p)}" data-side="${esc(qq.side)}">⬇ 下載</button><span class="path">${esc(p)}</span></div>`
          : '<div class="an none">（沒有檔案）</div>';
      }else{
        const t=answer(r,qq);
        an = t ? `<div class="an">${esc(t)}</div>` : '<div class="an none">（未填）</div>';
      }
      return `<div class="qa"><div class="qn">${qq.n}. ${esc(qq.q)}</div><div>${an}</div></div>`;
    };
    /* 匯款帳簿封面：身分證正反面（第 5、6 題）之後多一格，選填，不算在 30 題編號裡；
       匯出時另外接在 IDCOLS 尾巴（見 idPaths/idCell），不影響前面 30 欄的順序 */
    const pbRow=(r)=>{
      const p=r.passbook_path;
      let an;
      if(!p){ an='<div class="an none">未上傳</div>'; }
      else if(DEMO){ an='<div class="an">（示範）已上傳</div>'; }
      else{ an=`<div class="idbtns"><button class="btn btn-ghost pbopen" data-path="${esc(p)}">看匯款帳簿封面</button><button class="btn btn-ghost pbdl" data-path="${esc(p)}">⬇ 下載</button><span class="path">${esc(p)}</span></div>`; }
      return `<div class="qa"><div class="qn">匯款帳簿封面照片（有的話請一起上傳，沒有可以先送出）</div><div>${an}</div></div>`;
    };
    const tagBtnHtml=(t,on)=>`<button type="button" class="tagbtn${on?' on':''}" data-tag="${t.key}" style="--c:${t.color}" aria-pressed="${on}"><span class="sw">${on?'✓':''}</span>${esc(t.name)}</button>`;
    const barCss=(r)=>{ const t=tagOf(r.tag); return t?'box-shadow:inset 10px 0 0 '+t.color+';':''; };
    const dotHtml=(r)=>{ const t=tagOf(r.tag); return t?`<span class="tdot" style="background:${t.color}" title="${esc(t.name)}" aria-label="標記：${esc(t.name)}"></span>`:''; };
    const NIL='<span style="color:#c9ccd8;">—</span>';
    const tagCell=(r)=>{ const t=tagOf(r.tag); return t?`<span class="cut tgc" title="${esc(t.name)}">${dotHtml(r)}${esc(t.name)}</span>`:NIL; };
    /* 表格只顯示月日時分，滑鼠提示有完整年份 */
    const dtShort=(s)=>fmtDT(s).replace(/^\d{4}-/,'');
    const noteHtml=(r)=>r.note?`<div class="notew cut" title="${esc(r.note)}">${esc(r.note)}</div>`:NIL;
    const cdHtml=(r)=>r.class_date?`<span class="cdw cut" title="${esc(r.class_date)}">${esc(r.class_date)}</span>`:NIL;
    const lnHtml=(r)=>r.leader_note?`<div class="notew cut" title="${esc(r.leader_note)}">${esc(r.leader_note)}</div>`:NIL;
    /* 跟老師名單頁同一套：每 5 列一組交替淡灰，不符資格／退出整列淡紅 */
    const isRd=(r)=>r.tag==='red'||r.tag==='gray';
    /* 收款跟著 2026-11-10 那支 SQL（HAS_CLS），其他三格跟著 2026-11-18 這支（HAS_CK）；沒建的格子停用、表頭寫待開通 */
    const ckReady=(c)=>c.col==='leader_paid'?HAS_CLS:HAS_CK;
    const ckSqlOf=(c)=>c.col==='leader_paid'?'supabase/sql/2026-11-10_funv_class_date_leader_note.sql':CK_SQL;
    const ckOn=(r,c)=>r[c.col]===true;
    const ckCellHtml=(r,c)=>{
      const ok=ckReady(c), on=ok&&ckOn(r,c);
      const tip=ok?c.tip+'：'+(on?'已勾，點一下取消':'還沒勾，點一下打勾'):c.name+'待開通：請先在 Supabase 執行 '+ckSqlOf(c);
      return `<td class="ck-cell${on?' on':''}${ok?'':' off'}" data-col="${c.col}" title="${esc(tip)}"><input type="checkbox" class="ck" data-col="${c.col}" aria-label="${esc(c.tip)}"${on?' checked':''}${ok?'':' disabled'}></td>`;
    };
    /* 表頭四個字以上折成兩行（申請表／寄出），格子才窄得下 */
    const ckHeadHtml=(c)=>`<th class="ck-h" data-col="${c.col}" title="${esc(c.tip)}">${c.name.length>3?esc(c.name.slice(0,-2))+'<br>'+esc(c.name.slice(-2)):esc(c.name)}<span class="ckn${ckReady(c)?'':' off'}" id="ckn-${c.col}"></span></th>`;
    const paintCkHead=()=>{
      CHECKS.forEach(c=>{
        const el=$('ckn-'+c.col); if(!el) return;
        if(!ckReady(c)){ el.textContent='待開通'; el.title=c.name+'待開通：請先在 Supabase 執行 '+ckSqlOf(c); return; }
        const n=view.filter(r=>ckOn(r,c)).length;
        el.textContent=n+'/'+view.length; el.title='目前列出的 '+view.length+' 人中，'+c.tip+' '+n+' 人';
      });
    };
    let toastTimer=null;
    const toast=(txt,type)=>{
      let el=$('ckToast');
      if(!el){ el=document.createElement('div'); el.id='ckToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
      el.className='cktoast show '+type; el.textContent=txt;
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.className='cktoast'; },type==='error'?9000:2600);
    };
    const paintNote=(r)=>{
      const tr=document.querySelector('tr.rw[data-id="'+r.id+'"]'); if(!tr) return;
      tr.querySelector('.note-cell').innerHTML=noteHtml(r);
      tr.querySelector('.cd-cell').innerHTML=cdHtml(r);
      tr.querySelector('.ln-cell').innerHTML=lnHtml(r);
    };
    const stampText=(r)=>r.leader_note_updated_at?'上課日期／老師備註最後更新：'+fmtDT(r.leader_note_updated_at):'';
    const detailHtml=(r)=>{
      const qa=QS.slice(0,6).map(qq=>qaRow(r,qq)).join('')+pbRow(r)+QS.slice(6).map(qq=>qaRow(r,qq)).join('');
      const cur=r.status||'new';
      const opts=STATUS.includes(cur)?STATUS:STATUS.concat([cur]);
      return `<div class="etop"><div class="edit">
          <div class="fld"><label>狀態</label><select class="e-st">${opts.map(s=>`<option value="${esc(s)}"${s===cur?' selected':''}>${esc(s)}</option>`).join('')}</select></div>
          <div class="fld tagfld"><label>標記（點了就存，再點同色清除）</label><div class="tagbtns">${TAGS.map(t=>tagBtnHtml(t,tagKey(r)===t.key)).join('')}</div></div>
          <div class="fld wide"><label>備註（只有後台看得到）</label><textarea class="e-note" placeholder="打過電話沒接、缺哪份資料、寄件日期…">${esc(r.note||'')}</textarea></div>
        </div>
        <div class="edit lnote" style="margin-top:12px;">
          <div class="fld"><label>上課日期（老師名單頁也看得到）</label><input class="e-cd" type="text" maxlength="100" placeholder="例：12/12、11/21-22" value="${esc(r.class_date||'')}"></div>
          <div class="fld wide"><label>老師備註（老師看得到、也能改，別寫敏感資料）</label><textarea class="e-ln" maxlength="500" placeholder="老師寫的聯絡狀況、上課提醒…">${esc(r.leader_note||'')}</textarea><div class="stamp">${esc(stampText(r))}</div></div>
          <div class="fld sv"><button class="btn btn-primary e-save">儲存</button></div>
        </div>
        <div class="msg e-msg"></div></div>
        <div class="dhead">申請編號（＝Supabase Storage → funv-ids 裡的資料夾名稱）：${esc(r.id)}　｜　申請時間：${esc(fmtDT(r.created_at))}</div>
        ${qa}`;
    };

    /* 身分證在私有 bucket，前端拿不到直接網址，只能要一張 5 分鐘的簽名網址 */
    const openId=async (btn,msgEl)=>{
      const path=btn.getAttribute('data-path');
      if(DEMO){ show(msgEl,'示範模式無圖：這批是假資料，沒有真的身分證檔案。正式登入後這顆按鈕才會開圖。','error'); return; }
      btn.disabled=true;
      const { data, error } = await supabase.storage.from('funv-ids').createSignedUrl(path,300);
      btn.disabled=false;
      if(error||!data||!data.signedUrl){
        show(msgEl,'開不了身分證照片：'+((error&&error.message)||'沒拿到網址')+'\n如果寫的是 not authorized 之類的，請到 Supabase SQL Editor 重跑 supabase/sql/funv_applications.sql 的「5) Storage policy：管理員可讀 funv-ids」那一段。','error');
        return;
      }
      const w=window.open(data.signedUrl,'_blank','noopener');
      if(!w){
        msgEl.className='msg e-msg show error';
        msgEl.innerHTML=`瀏覽器擋住新分頁，<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">點這裡開啟身分證${esc(btn.getAttribute('data-side'))}</a>（連結 5 分鐘內有效）。`;
      }else{
        msgEl.className='msg e-msg'; msgEl.textContent='';
      }
    };

    /* 直接開簽名網址瀏覽器只會另開分頁，抓成 blob 才能指定檔名 */
    const dlId=async (btn,r,msgEl)=>{
      const path=btn.getAttribute('data-path'), side=btn.getAttribute('data-side');
      if(DEMO){ show(msgEl,'示範模式無圖：這批是假資料，沒有真的身分證檔案。正式登入後這顆按鈕才會下載。','error'); return; }
      const old=btn.textContent; btn.disabled=true; btn.textContent='下載中…';
      try{
        const res=await fetch(await signOne(path,60));
        if(!res.ok) throw new Error('HTTP '+res.status);
        const a=document.createElement('a');
        a.href=URL.createObjectURL(await res.blob());
        a.download=safeName(r.name)+'_身分證'+side+extOf(path);
        document.body.appendChild(a); a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
        msgEl.className='msg e-msg'; msgEl.textContent='';
      }catch(e){ show(msgEl,'下載失敗：'+(e.message||e),'error'); }
      btn.disabled=false; btn.textContent=old;
    };

    /* 匯款帳簿封面的看/下載，跟身分證共用同一顆 funv-ids bucket，只是欄位與檔名不同，
       獨立寫一份而不是把 openId/dlId 改成通用參數，避免動到已經在跑的身分證邏輯 */
    const openPassbook=async (btn,msgEl)=>{
      const path=btn.getAttribute('data-path');
      if(DEMO){ show(msgEl,'示範模式無圖：這批是假資料，沒有真的匯款帳簿封面檔案。正式登入後這顆按鈕才會開圖。','error'); return; }
      btn.disabled=true;
      const { data, error } = await supabase.storage.from('funv-ids').createSignedUrl(path,300);
      btn.disabled=false;
      if(error||!data||!data.signedUrl){
        show(msgEl,'開不了匯款帳簿封面照片：'+((error&&error.message)||'沒拿到網址')+'\n如果寫的是 not authorized 之類的，請到 Supabase SQL Editor 重跑 supabase/sql/funv_applications.sql 的「5) Storage policy：管理員可讀 funv-ids」那一段。','error');
        return;
      }
      const w=window.open(data.signedUrl,'_blank','noopener');
      if(!w){
        msgEl.className='msg e-msg show error';
        msgEl.innerHTML=`瀏覽器擋住新分頁，<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">點這裡開啟匯款帳簿封面</a>（連結 5 分鐘內有效）。`;
      }else{
        msgEl.className='msg e-msg'; msgEl.textContent='';
      }
    };
    const dlPassbook=async (btn,r,msgEl)=>{
      const path=btn.getAttribute('data-path');
      if(DEMO){ show(msgEl,'示範模式無圖：這批是假資料，沒有真的匯款帳簿封面檔案。正式登入後這顆按鈕才會下載。','error'); return; }
      const old=btn.textContent; btn.disabled=true; btn.textContent='下載中…';
      try{
        const res=await fetch(await signOne(path,60));
        if(!res.ok) throw new Error('HTTP '+res.status);
        const a=document.createElement('a');
        a.href=URL.createObjectURL(await res.blob());
        a.download=safeName(r.name)+'_匯款帳簿封面'+extOf(path);
        document.body.appendChild(a); a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
        msgEl.className='msg e-msg'; msgEl.textContent='';
      }catch(e){ show(msgEl,'下載失敗：'+(e.message||e),'error'); }
      btn.disabled=false; btn.textContent=old;
    };

    const save=async (r,td)=>{
      const st=td.querySelector('.e-st').value;
      const note=td.querySelector('.e-note').value.trim();
      const cd=td.querySelector('.e-cd').value.trim();
      const ln=td.querySelector('.e-ln').value.trim();
      const msgEl=td.querySelector('.e-msg');
      const btn=td.querySelector('.e-save');
      const clsChanged=cd!==(r.class_date||'')||ln!==(r.leader_note||'');
      const after=()=>{
        hayDrop(r);
        const cell=document.querySelector('tr.rw[data-id="'+r.id+'"] .st-cell');
        if(cell) cell.innerHTML=badge(r.status);
        paintNote(r);
        td.querySelector('.stamp').textContent=stampText(r);
        refreshClassSel(); refreshCkSel();
      };
      if(DEMO){
        r.status=st; r.note=note||null;
        if(clsChanged){ r.class_date=cd||null; r.leader_note=ln||null; r.leader_note_updated_at=new Date().toISOString(); }
        after();
        show(msgEl,'示範模式不會存：畫面上已經改成「'+st+'」'+(clsChanged?'、上課日期「'+(cd||'未填')+'」':'')+'，但沒有寫進資料庫。','ok');
        return;
      }
      if(clsChanged&&!HAS_CLS){ show(msgEl,'後台還沒加上課日期、老師備註欄位，請先在 Supabase 執行 supabase/sql/2026-11-10_funv_class_date_leader_note.sql；狀態與備註請先把這兩格改回原樣再存。','error'); return; }
      btn.disabled=true; show(msgEl,'儲存中…','ok');
      const patch={ status:st, note:note||null };
      if(clsChanged){ patch.class_date=cd||null; patch.leader_note=ln||null; }
      /* 被 RLS 擋掉的 update 在 PostgREST 不會報錯，只是零列生效，
         所以一律用 .select() 把真的被改到的列要回來數，數不到就照實說。 */
      const { data, error } = await supabase.from('funv_applications')
        .update(patch).eq('id',r.id).select(clsChanged?'id,leader_note_updated_at':'id');
      btn.disabled=false;
      if(error){
        const m=error.message||'';
        show(msgEl,'存不起來：'+m+(m.indexOf('note')>=0&&m.indexOf('leader_note')<0?'\n（備註欄位還沒建：請到 Supabase SQL Editor 重跑 supabase/sql/funv_applications.sql）':'')
          +(/class_date|leader_note|leader_paid/.test(m)?'\n（上課日期／老師備註／已收款欄位還沒建或超過字數：請到 Supabase SQL Editor 執行 supabase/sql/2026-11-10_funv_class_date_leader_note.sql；上課日期最多 100 字、老師備註最多 500 字）':''),'error');
        return;
      }
      if(!(data||[]).length){
        show(msgEl,'沒有存到任何一列。多半是資料庫政策（RLS）擋掉了，這種情況 PostgREST 不會報錯。確認一下登入的帳號 is_admin 是不是 true。','error');
        return;
      }
      r.status=st; r.note=note||null;
      if(clsChanged){ r.class_date=cd||null; r.leader_note=ln||null; r.leader_note_updated_at=data[0].leader_note_updated_at||null; }
      after();
      show(msgEl,'已儲存。','ok');
    };

    /* 確認格點了就存：先把勾還原、轉半透明，資料庫回來真的改到一列才打勾變色；失敗維持原樣並跳提示 */
    const setCk=async (r,cb)=>{
      const c=CHECKS.find(x=>x.col===cb.getAttribute('data-col')); if(!c) return;
      const cell=cb.closest('td'), want=cb.checked, before=ckOn(r,c);
      const paint=(on)=>{ cb.checked=on; cell.classList.toggle('on',on); };
      paint(before);
      if(!ckReady(c)){ toast(c.name+'待開通：請先在 Supabase 執行 '+ckSqlOf(c),'error'); return; }
      const done=(on)=>{ r[c.col]=on; hayDrop(r); paint(on); paintCkHead(); refreshCkSel(); };
      const label=(r.name||'')+'「'+c.name+'」'+(want?'已打勾':'已取消');
      if(DEMO){ done(want); toast('示範模式不會存：畫面上'+label+'，但沒有寫進資料庫。重新整理會回到原本的示範資料。','ok'); return; }
      cb.disabled=true; cell.classList.add('saving');
      let data=null, error=null;
      try{ ({ data, error }=await supabase.from('funv_applications').update({ [c.col]:want }).eq('id',r.id).select('id,'+c.col)); }
      catch(e){ error={ message:(e&&e.message)||String(e) }; }
      cb.disabled=false; cell.classList.remove('saving');
      if(error){
        const m=error.message||'';
        console.error('[確認格存檔失敗]',c.col,r.id,error);
        toast(m.indexOf(c.col)>=0?(r.name||'')+'「'+c.name+'」還沒開通，已維持原樣：請先在 Supabase 執行 '+ckSqlOf(c):(r.name||'')+'「'+c.name+'」沒有存成功，已維持原樣。請重新整理後再試；還是不行請跟阿強說。','error');
        return;
      }
      if(!(data||[]).length){ console.error('[確認格存檔失敗] 0 列生效（多半是 RLS 擋掉，確認登入帳號 is_admin）',c.col,r.id); toast((r.name||'')+'「'+c.name+'」沒有存成功，已維持原樣。請重新整理後再試；還是不行請跟阿強說。','error'); return; }
      done(data[0][c.col]===true);
      toast(label+'。','ok');
    };

    const paintTag=(r,td)=>{
      hayDrop(r);
      const tr=document.querySelector('tr.rw[data-id="'+r.id+'"]');
      if(tr){
        const t=tagOf(r.tag), c0=tr.querySelector('.c0');
        c0.style.boxShadow=t?'inset 10px 0 0 '+t.color:'';
        c0.innerHTML=tagCell(r);
        tr.classList.toggle('rd',isRd(r));
      }
      if(td) td.querySelectorAll('.tagbtn').forEach(b=>{
        const on=b.getAttribute('data-tag')===tagKey(r);
        b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
        b.querySelector('.sw').textContent=on?'✓':'';
      });
      fillTagSel(tagBaseRows());
    };
    const setTag=async (r,td,key)=>{
      const next=tagKey(r)===key?'none':key;
      const msgEl=td.querySelector('.e-msg');
      const label=next==='none'?'已清除標記':'已標記「'+tagOf(next).name+'」';
      if(DEMO){
        r.tag=next; paintTag(r,td);
        show(msgEl,'示範模式不會存：畫面上'+label+'，但沒有寫進資料庫。','ok');
        return;
      }
      if(!HAS_TAG){ show(msgEl,'後台還沒加標記欄位，請先在 Supabase 執行 supabase/sql/funv_tag.sql','error'); return; }
      const btns=td.querySelectorAll('.tagbtn');
      btns.forEach(b=>b.disabled=true); show(msgEl,'標記儲存中…','ok');
      /* 跟 save() 同一個理由：RLS 擋掉不會報錯，要數真的改到幾列 */
      const { data, error } = await supabase.from('funv_applications')
        .update({ tag:next }).eq('id',r.id).select('id');
      btns.forEach(b=>b.disabled=false);
      if(error){
        const m=error.message||'';
        show(msgEl,'標記存不起來：'+m+(m.indexOf('tag')>=0?'\n（標記欄位還沒建：請到 Supabase SQL Editor 執行 supabase/sql/funv_tag.sql）':''),'error');
        return;
      }
      if(!(data||[]).length){
        show(msgEl,'沒有存到任何一列。多半是資料庫政策（RLS）擋掉了，這種情況 PostgREST 不會報錯。確認一下登入的帳號 is_admin 是不是 true。','error');
        return;
      }
      r.tag=next; paintTag(r,td);
      show(msgEl,label+'。','ok');
    };

    const toggle=(id)=>{
      const tr=document.querySelector('tr.rw[data-id="'+id+'"]');
      const dt=document.querySelector('tr.dt[data-id="'+id+'"]');
      if(!tr||!dt) return;
      if(dt.classList.contains('on')){
        dt.classList.remove('on'); tr.classList.remove('open');
        tr.querySelector('.caret').textContent='看明細 ▾';
        return;
      }
      if(!dt.getAttribute('data-built')){
        const r=rows.find(x=>x.id===id); if(!r) return;
        const td=dt.querySelector('td');
        td.innerHTML=detailHtml(r);
        dt.setAttribute('data-built','1');
        const msgEl=td.querySelector('.e-msg');
        td.querySelectorAll('.idbtn').forEach(b=>b.onclick=()=>openId(b,msgEl));
        td.querySelectorAll('.iddl').forEach(b=>b.onclick=()=>dlId(b,r,msgEl));
        td.querySelectorAll('.pbopen').forEach(b=>b.onclick=()=>openPassbook(b,msgEl));
        td.querySelectorAll('.pbdl').forEach(b=>b.onclick=()=>dlPassbook(b,r,msgEl));
        td.querySelector('.e-save').onclick=()=>save(r,td);
        td.querySelectorAll('.tagbtn').forEach(b=>b.onclick=()=>setTag(r,td,b.getAttribute('data-tag')));
      }
      dt.classList.add('on'); tr.classList.add('open');
      tr.querySelector('.caret').textContent='收起 ▴';
    };

    const renderTable=()=>{
      $('cnt').textContent=view.length;
      const box=$('tblWrap');
      if(!view.length){ box.innerHTML='<div class="empty">沒有符合的報名表。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>標記</th><th>備註</th><th>名字</th>${CHECKS.map(ckHeadHtml).join('')}<th>上課日期</th><th>老師備註</th><th>申請時間</th><th>手機</th><th>選課</th><th>狀態</th><th>邀請人</th><th></th></tr></thead>
        <tbody>${view.map((r,i)=>`<tr class="rw${Math.floor(i/5)%2?' zb':''}${isRd(r)?' rd':''}" data-id="${esc(r.id)}">
          <td class="c0" style="white-space:nowrap;${barCss(r)}">${tagCell(r)}</td>
          <td class="note-cell">${noteHtml(r)}</td>
          <td style="font-weight:500;color:var(--indigo);white-space:nowrap;">${esc(r.name||'')}</td>
          ${CHECKS.map(c=>ckCellHtml(r,c)).join('')}
          <td class="cd-cell">${cdHtml(r)}</td>
          <td class="ln-cell">${lnHtml(r)}</td>
          <td class="dtc" style="white-space:nowrap;color:var(--ink-soft);" title="${esc(fmtDT(r.created_at))}">${esc(dtShort(r.created_at))}</td>
          <td style="white-space:nowrap;">${esc(r.mobile||'')}</td>
          <td>${r.course_choice?`<span class="chip course" title="${esc(r.course_choice)}">${esc(r.course_choice)}</span>`:'<span style="color:#c9ccd8;">—</span>'}</td>
          <td class="st-cell">${badge(r.status)}</td>
          <td class="rf-cell">${r.referrer?`<span class="cut" title="${esc(r.referrer)}">${esc(r.referrer)}</span>`:''}</td>
          <td class="caret">看明細 ▾</td>
        </tr>
        <tr class="dt" data-id="${esc(r.id)}"><td colspan="${11+CHECKS.length}"></td></tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('tr.rw').forEach(tr=>tr.onclick=()=>toggle(tr.getAttribute('data-id')));
      /* 勾選格不能順便展開明細；點到格子空白處也算點勾選框，比較好點 */
      box.querySelectorAll('td.ck-cell').forEach(td=>td.onclick=(e)=>{
        e.stopPropagation();
        const cb=td.querySelector('input.ck');
        if(e.target===td&&cb&&!cb.disabled) cb.click();
        else if(e.target===td&&cb&&cb.disabled){ const c=CHECKS.find(x=>x.col===td.getAttribute('data-col')); if(c&&!ckReady(c)) toast(c.name+'待開通：請先在 Supabase 執行 '+ckSqlOf(c),'error'); }
      });
      box.querySelectorAll('input.ck').forEach(cb=>cb.onchange=()=>{ const r=rows.find(x=>x.id===cb.closest('tr').getAttribute('data-id')); if(r) setCk(r,cb); });
      paintCkHead();
    };

    /* 老闆 2026-11-19：搜尋欄要當關鍵字搜全部學員資料。每筆把所有欄位串成一條字串，第一次用到才建、存在 HAY，
       那一筆被改（狀態、備註、標記、確認格）就丟掉重建；不然幾百筆每打一個字都要重串一次。
       不搜的只有系統欄位：申請編號、各種 *_at 時間戳、*_by 操作人、IP、瀏覽器資訊、身分證與帳簿在 Storage 的路徑（路徑是亂碼，打數字會亂中）；
       申請時間例外，改放畫面上那種本地時間（2026-11-01 10:00，表格顯示的 11-01 是它的一段）；tag 存的是英文代碼，改搜畫面上的標記名稱。 */
    const HAY_SKIP=/^(id|ip|user_agent|tag)$|_(at|by|path)$/;
    const DASH=/[-‐‑‒–—―−－/]/g;
    const normQ=(s)=>String(s).normalize('NFKC').toLowerCase();
    const hayVals=(v,out)=>{
      if(v==null||typeof v==='boolean') return;
      if(v instanceof Date){ if(!isNaN(v.getTime())) out.push(v.toISOString().slice(0,10)); return; }
      if(Array.isArray(v)){ v.forEach(x=>hayVals(x,out)); return; }
      if(typeof v==='object'){ Object.keys(v).forEach(k=>hayVals(v[k],out)); return; }
      const s=normQ(v); out.push(s);
      if(s.indexOf('/')>=0) out.push(s.replace(/\//g,'-'));
      /* 手機、日期有人寫 0912-345-678、有人寫 0912 345 678，另存一份去掉分隔的，打哪種寫法都對得到 */
      (s.match(/\d[\d\s\-‐‑‒–—―−－/]*\d/g)||[]).forEach(m=>{ const d=m.replace(/[\s\-‐‑‒–—―−－/]/g,''); if(d!==m&&d.length>=6) out.push(d); });
    };
    const HAY=new WeakMap();
    const hayOf=(r)=>{
      let h=HAY.get(r); if(h!=null) return h;
      const out=[];
      Object.keys(r).forEach(k=>{ if(!HAY_SKIP.test(k)) hayVals(r[k],out); });
      /* 日期與時間分開放：連在一起去掉分隔後時間的數字會接到日期後面，打 11/01 會誤中別天 */
      fmtDT(r.created_at).split(' ').forEach(p=>hayVals(p,out));
      out.push(r.status||'new', tagName(r));
      /* 布林欄位存的是 true/false，改放畫面上看得到的字：確認格用表頭、提示、篩選選單的字，第 30 題用明細的是／否。
         存摺的提示是一句操作說明（含「帳簿」），放進來打帳簿會搜到已勾存摺的人，所以存摺改放「已確認存摺」 */
      CHECKS.forEach(c=>{ if(r[c.col]===true) out.push(c.name, c.name+'已勾', c.col==='passbook_checked'?'已確認存摺':c.tip, ckExp(c)); });
      QS.forEach(qq=>{ if(qq.bool&&typeof r[qq.k]==='boolean') out.push(answer(r,qq)); });
      /* 用換行接，查詢字裡不會有空白，就不會前一欄的尾巴接下一欄的開頭被誤中 */
      h=normQ(out.join('\n')); HAY.set(r,h); return h;
    };
    const hayDrop=(r)=>HAY.delete(r);
    /* 去分隔只給 6 碼以上的數字用（手機、完整日期）；11/01 這種短日期去掉分隔只剩 4 碼，會亂中手機，改成把 / 換成 - 去比 */
    const qTokens=(raw)=>normQ(raw).split(/\s+/).filter(Boolean).map(t=>{
      const alts=[t], d=t.replace(DASH,''), sl=t.replace(/\//g,'-');
      if(d!==t&&(d.match(/\d/g)||[]).length>=6) alts.push(d);
      if(sl!==t) alts.push(sl);
      return alts;
    });
    const hayHit=(r,toks)=>{ if(!toks.length) return true; const h=hayOf(r); return toks.every(alts=>alts.some(a=>h.indexOf(a)>=0)); };
    const baseRows=()=>{
      const toks=qTokens($('fSearch').value);
      const st=$('fStatus').value;
      return rows.filter(r=>{
        if(!hayHit(r,toks)) return false;
        if(st && (r.status||'new')!==st) return false;
        return true;
      });
    };
    /* 人數跟著搜尋與狀態篩選走，選下去看到幾筆就是括號裡的數字 */
    const fillTagSel=(base)=>{
      const sel=$('fTag'), cur=sel.value, c={none:0};
      TAGS.forEach(t=>c[t.key]=0);
      base.forEach(r=>c[tagKey(r)]++);
      sel.innerHTML=`<option value="">全部標記（${base.length}）</option>`
        +TAGS.map(t=>`<option value="${t.key}" style="color:${t.color}">● ${esc(t.name)}（${c[t.key]}）</option>`).join('')
        +`<option value="none">沒標記（${c.none}）</option>`;
      sel.value=cur;
      const t=tagOf(cur); sel.style.borderColor=t?t.color:'';
      const tf=$('tagFilter'); if(!tf) return;
      const v=sel.value, b=(k,label,n,color,dot)=>`<button type="button" class="tfbtn${v===k?' on':''}" data-v="${k}" aria-pressed="${v===k}"${color?` style="--c:${color}"`:''}>${dot?`<span class="tdot" style="background:${color}"></span>`:''}${label}<span class="n">（${n}）</span></button>`;
      tf.innerHTML=b('','全部',base.length)+TAGS.map(t=>b(t.key,esc(t.name),c[t.key],t.color,true)).join('')+b('none','沒標記',c.none);
    };
    /* 團隊沒有獨立欄位，靠第 18 題邀請人：團隊專屬報名頁把它鎖成固定值；其他頁自由填的一律歸「未填／其他」 */
    const TEAMS=['蘇姐團隊','珠珠姐','羅總團隊','龎芸芸','林慧雯','美莉記者團隊','蕙禎團隊','君蓉','亭儀'];
    const TEAM_NONE='__none__';
    const teamKey=(r)=>TEAMS.indexOf(teamOf(r))>=0?teamOf(r):TEAM_NONE;
    const fillTeamSel=(base)=>{
      const sel=$('fTeam'), cur=sel.value, c={};
      base.forEach(r=>{ const t=teamKey(r); c[t]=(c[t]||0)+1; });
      sel.innerHTML=`<option value="">全部團隊（${base.length}）</option>`
        +TEAMS.map(t=>`<option value="${esc(t)}">${esc(t)}（${c[t]||0}）</option>`).join('')
        +`<option value="${TEAM_NONE}">未填／其他（${c[TEAM_NONE]||0}）</option>`;
      sel.value=cur;
      if(sel.value!==cur) sel.value='';
    };
    /* 上課日期是自由文字，照現有的值一字不差分組 */
    const CLS_NONE='__none__';
    const clsKey=(r)=>String(r.class_date||'').trim()||CLS_NONE;
    const fillClassSel=(base)=>{
      const sel=$('fClass'), cur=sel.value, c={};
      base.forEach(r=>{ const k=clsKey(r); c[k]=(c[k]||0)+1; });
      if(cur&&!(cur in c)) c[cur]=0;
      const keys=Object.keys(c).filter(k=>k!==CLS_NONE).sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
      sel.innerHTML=`<option value="">全部上課日期（${base.length}）</option>`
        +keys.map(k=>`<option value="${esc(k)}">${esc(k)}（${c[k]}）</option>`).join('')
        +`<option value="${CLS_NONE}">未填（${c[CLS_NONE]||0}）</option>`;
      sel.value=cur;
      if(sel.value!==cur) sel.value='';
    };
    const teamRows=()=>{ const all=baseRows(), tm=$('fTeam').value; return !tm?all:all.filter(r=>teamKey(r)===tm); };
    const refreshClassSel=()=>fillClassSel(teamRows());
    /* 確認格篩選：值是「欄名:no」＝只看還沒勾、「欄名:yes」＝只看已勾；待開通的格子不能選 */
    const ckMatch=(r,v)=>{ const p=String(v).split(':'), c=CHECKS.find(x=>x.col===p[0]); if(!c) return true; return p[1]==='yes'?ckOn(r,c):!ckOn(r,c); };
    const fillCkSel=(base)=>{
      const sel=$('fCk'), cur=sel.value;
      const opt=(c,yes)=>{ const ok=ckReady(c), n=ok?base.filter(r=>ckOn(r,c)===yes).length:0;
        return `<option value="${c.col}:${yes?'yes':'no'}"${ok?'':' disabled'}>${esc(c.name)}${yes?'已勾':'還沒勾'}（${ok?n:'待開通'}）</option>`; };
      sel.innerHTML=`<option value="">全部確認格（${base.length}）</option><optgroup label="只看還沒勾的">${CHECKS.map(c=>opt(c,false)).join('')}</optgroup><optgroup label="只看已勾的">${CHECKS.map(c=>opt(c,true)).join('')}</optgroup>`;
      sel.value=cur;
      if(sel.value!==cur) sel.value='';
    };
    const classRows=()=>{ const b=teamRows(), cl=$('fClass').value; return !cl?b:b.filter(r=>clsKey(r)===cl); };
    const refreshCkSel=()=>fillCkSel(classRows());
    const tagBaseRows=()=>{ const b=classRows(), ck=$('fCk').value; return !ck?b:b.filter(r=>ckMatch(r,ck)); };
    const applyFilters=()=>{
      const all=baseRows();
      fillTeamSel(all);
      const byTeam=teamRows();
      fillClassSel(byTeam);
      const byClass=classRows();
      fillCkSel(byClass);
      const base=tagBaseRows();
      fillTagSel(base);
      const tg=$('fTag').value;
      view=tg?base.filter(r=>tagKey(r)===tg):base;
      renderTable();
    };

    // ── 匯出目前篩選結果：標記、備註在最前，接著照 30 題 ──
    $('btnExport').onclick=async ()=>{
      const btn=$('btnExport'), msgEl=$('xlsxMsg'), old=btn.textContent;
      btn.disabled=true; msgEl.className='msg'; msgEl.textContent='';
      const map=DEMO?{}:await signMany(idPaths(view),msgEl,'產生連結中');
      const q=(v)=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; };
      const head=['標記','備註','上課日期','老師備註'].concat(CHECKS.map(ckExp)).concat(QS.map(qq=>qq.n+'. '+qq.q)).concat(IDCOLS.map(c=>c.t));
      const lines=[head.map(q).join(',')].concat(view.map(r=>[tagName(r),r.note==null?'':String(r.note),r.class_date==null?'':String(r.class_date),r.leader_note==null?'':String(r.leader_note)].concat(CHECKS.map(c=>typeof r[c.col]==='boolean'?(r[c.col]?'是':'否'):'')).concat(QS.map(qq=>{
        if(qq.bool) return r[qq.k]===true?'是':'否';
        const v=r[qq.k];
        if(qq.multi) return (v||[]).join(' / ');
        return v==null?'':String(v);
      })).concat(IDCOLS.map(c=>idCell(map,r,c))).map(q).join(',')));
      const csv='﻿'+lines.join('\r\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      a.download='強腦力-婦女再就業報名'+(COURSE?'-'+COURSE.name:'')+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
      msgEl.className='msg'; msgEl.textContent=''; btn.disabled=false; btn.textContent=old;
    };

    // ── 匯出 Excel：同一批篩選結果，標記、備註在最前（跟 CSV 一樣），30 題後面再接申請編號／申請時間／狀態 ──
    const xlsxRows=(map)=>{
      const head=['標記','備註','上課日期','老師備註'].concat(CHECKS.map(ckExp)).concat(QS.map(qq=>qq.n+'. '+qq.q)).concat(['申請編號','申請時間','狀態']).concat(IDCOLS.map(c=>c.t));
      return [head].concat(view.map(r=>[tagName(r),r.note==null?'':String(r.note),r.class_date==null?'':String(r.class_date),r.leader_note==null?'':String(r.leader_note)].concat(CHECKS.map(c=>typeof r[c.col]==='boolean'?(r[c.col]?'是':'否'):'')).concat(QS.map(qq=>{
        if(qq.bool) return r[qq.k]===true?'是':'否';
        const v=r[qq.k];
        if(qq.multi) return (v||[]).join('、');
        return v==null?'':String(v);
      })).concat([
        String(r.id==null?'':r.id),
        fmtTPE(r.created_at),
        String(r.status||'new')
      ]).concat(IDCOLS.map(c=>idCell(map,r,c)))));
    };
    $('btnExportXlsx').onclick=async ()=>{
      const btn=$('btnExportXlsx'), msgEl=$('xlsxMsg');
      btn.disabled=true; btn.textContent='產生中…'; msgEl.className='msg'; msgEl.textContent='';
      try{
        const XLSX=await loadXLSX();
        const map=DEMO?{}:await signMany(idPaths(view),msgEl,'產生連結中');
        const aoa=xlsxRows(map);
        const n=aoa[0].length;
        saveSheet(XLSX,aoa,'報名資料','婦女再就業報名'+(COURSE?'_'+COURSE.name:'')+'_'+today8()+'.xlsx',[n-3,n-2,n-1]);
        msgEl.className='msg'; msgEl.textContent='';
      }catch(e){
        msgEl.className='msg show error';
        msgEl.textContent='Excel 元件載入失敗（'+(e.message||e)+'）。請改按「匯出 CSV」，Excel 一樣打得開。';
      }
      btn.disabled=false; btn.textContent='⬇ 匯出 Excel';
    };

    // ── 下載全部身分證：目前篩選結果，一人一個資料夾 ──
    $('btnZip').onclick=async ()=>{
      const btn=$('btnZip'), msgEl=$('xlsxMsg'), old=btn.textContent;
      if(!view.length){ msgEl.className='msg show error'; msgEl.textContent='目前篩選結果是 0 筆，沒有東西可以打包。'; return; }
      btn.disabled=true; msgEl.className='msg show'; msgEl.textContent='準備中…';
      try{
        const JSZip=await loadJSZip();
        const zip=new JSZip();
        const fails=[];
        let done=0, okCount=0;
        if(DEMO){
          zip.file('說明.txt','示範模式：這是假資料，沒有真的身分證檔案。\r\n正式登入後這顆按鈕會把目前篩選到的每個人的身分證正反面打包，一人一個資料夾（名字_手機）。\r\n目前篩選到 '+view.length+' 筆。');
        }else{
          const total=view.reduce((n,r)=>n+IDCOLS.filter(c=>r[c.k]).length,0);
          for(const r of view){
            const folder=safeName(r.name)+'_'+safeName(r.mobile);
            for(const c of IDCOLS){
              const p=r[c.k]; if(!p) continue;
              const label=c.k==='passbook_path'?'匯款帳簿封面':('身分證'+c.side);
              const fname=c.k==='passbook_path'?(safeName(r.name)+'_匯款帳簿封面'+extOf(p)):(label+extOf(p));
              btn.textContent='打包中 '+(done+1)+'/'+total+'…';
              msgEl.textContent='打包中 '+(done+1)+'/'+total+'…';
              try{
                const res=await fetch(await signOne(p,60));
                if(!res.ok) throw new Error('HTTP '+res.status);
                zip.folder(folder).file(fname,await res.blob());
                okCount++;
              }catch(e){ fails.push(safeName(r.name)+' 的'+label+'：'+(e.message||e)); }
              done++;
            }
          }
          if(fails.length) zip.file('抓不到的檔案.txt',fails.join('\r\n'));
        }
        /* 身分證已經是 JPEG，再壓一次只是白燒 CPU，直接 STORE */
        const blob=await zip.generateAsync({type:'blob',compression:'STORE'},m=>{
          btn.textContent='壓縮中 '+Math.round(m.percent)+'%';
          msgEl.textContent='壓縮中 '+Math.round(m.percent)+'%';
        });
        const fn='婦女再就業_身分證_'+(COURSE?COURSE.name:'全部')+'_'+today8()+'.zip';
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn;
        document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
        if(DEMO){ msgEl.className='msg show'; msgEl.textContent='已下載 '+fn+'（示範模式，裡面只有一份說明.txt）。'; }
        else if(fails.length){ msgEl.className='msg show error'; msgEl.textContent='已下載 '+fn+'，成功 '+okCount+' 張，這幾張抓不到（也寫在 ZIP 裡的「抓不到的檔案.txt」）：\n'+fails.join('\n'); }
        else { msgEl.className='msg show'; msgEl.textContent='已下載 '+fn+'，共 '+okCount+' 張、'+view.length+' 個人。'; }
      }catch(e){
        msgEl.className='msg show error';
        msgEl.textContent='打包失敗（'+(e.message||e)+'）。如果寫的是連不到 cdn.jsdelivr.net，請檢查網路後再試一次。';
      }
      btn.disabled=false; btn.textContent=old;
    };

    ['fSearch','fStatus','fTag','fTeam','fClass','fCk'].forEach(id=>$(id).addEventListener('input',applyFilters));
    $('tagFilter').addEventListener('click',(e)=>{
      const btn=e.target.closest('.tfbtn'); if(!btn) return;
      const sel=$('fTag'), k=btn.getAttribute('data-v');
      sel.value=sel.value===k?'':k;
      applyFilters();
    });

    /* select('*') 遇到還沒建的 tag 欄不會報錯、只是少一欄，要單獨問 tag 才知道欄位在不在 */
    const checkTagCol=async ()=>{
      const { error, status } = await supabase.from('funv_applications').select('tag').limit(1);
      if(!error) return;
      if(status===400 || error.code==='42703' || /tag/.test(error.message||'')){
        HAS_TAG=false;
        document.body.insertAdjacentHTML('afterbegin','<div class="tagwarn">後台還沒加標記欄位，請先在 Supabase 執行 supabase/sql/funv_tag.sql</div>');
      }
    };
    const checkClsCol=async ()=>{
      const { error, status } = await supabase.from('funv_applications').select('class_date,leader_note,leader_paid').limit(1);
      if(!error) return;
      if(status===400 || error.code==='42703' || /class_date|leader_note|leader_paid/.test(error.message||'')){
        HAS_CLS=false;
        document.body.insertAdjacentHTML('afterbegin','<div class="tagwarn">後台還沒加上課日期、老師備註、已收款欄位，請先在 Supabase 執行 supabase/sql/2026-11-10_funv_class_date_leader_note.sql</div>');
      }
    };
    /* 三個新確認格的欄位要單獨問才知道在不在（select('*') 不會因為少欄位報錯） */
    const checkCkCol=async ()=>{
      const cols=CHECKS.filter(c=>c.col!=='leader_paid').map(c=>c.col);
      const { error, status } = await supabase.from('funv_applications').select(cols.join(',')).limit(1);
      if(!error) return;
      if(status===400 || error.code==='42703' || cols.some(c=>(error.message||'').indexOf(c)>=0)){
        HAS_CK=false;
        document.body.insertAdjacentHTML('afterbegin','<div class="tagwarn">'+esc(CHECKS.filter(c=>c.col!=='leader_paid').map(c=>c.name).join('、'))+'三格待開通：請先在 Supabase 執行 '+CK_SQL+'（其他功能照常可用）</div>');
      }
    };
    const load=async ()=>{
      $('tblWrap').innerHTML='<div class="state"><div class="spin"></div>載入報名表中…</div>';
      if(DEMO){ rows=DEMO_ROWS.filter(inCourse).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')); applyFilters(); return; }
      checkTagCol();
      let qy=supabase.from('funv_applications').select('*');
      if(COURSE) qy=qy.ilike('course_choice','%'+COURSE.kw+'%');
      /* 確認格要先知道欄位在不在才畫得出停用狀態，所以跟名單一起等 */
      const [ , , { data, error }] = await Promise.all([checkClsCol(), checkCkCol(), qy.order('created_at',{ascending:false})]);
      if(error){ $('tblWrap').innerHTML='<div class="empty" style="color:var(--err);">讀取失敗：'+esc(error.message)+'</div>'; return; }
      rows=data||[];
      applyFilters();
    };
    load();
  })();
</script>
