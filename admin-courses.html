<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>課程管理 — 強腦力 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;--mute:#8a8ea6;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--violet:#7C6CF0;--violet2:#4B37D8;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:19px;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:16px;font-size:14.5px;}
  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtab{font-family:var(--round);font-weight:700;font-size:14px;padding:9px 20px;border-radius:24px;border:1.5px solid var(--hair);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .subtab.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .card h2{font-size:17px;color:var(--indigo);display:flex;align-items:center;gap:9px;}
  .card h2 .bar{width:5px;height:19px;border-radius:3px;background:linear-gradient(var(--amber),var(--orange));}
  input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
  input:disabled{background:var(--paper-2);color:var(--mute);}
  textarea{min-height:90px;resize:vertical;}
  label{display:block;font-weight:700;font-size:13px;color:var(--indigo);margin:12px 0 6px;font-family:var(--round);}
  label small{font-weight:400;color:var(--mute);font-family:var(--sans);}
  .grid2{display:flex;gap:12px;flex-wrap:wrap;}
  .grid2>div{flex:1;min-width:160px;}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:var(--round);font-weight:700;font-size:14px;padding:10px 18px;border-radius:24px;border:none;cursor:pointer;transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 10px 24px rgba(22,176,168,.3);}
  .btn-orange{color:#fff;background:linear-gradient(135deg,#FF8A3D,#FFB020);}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);}
  .btn-violet{color:#fff;background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .btn-sm{font-size:12.5px;padding:6px 12px;border-radius:18px;}
  .msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:13.5px;display:none;white-space:pre-wrap;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);border:1px solid rgba(22,176,168,.28);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px;}
  th,td{border-bottom:1px solid var(--hair);padding:11px 12px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;background:#fff;}
  tbody tr:hover{background:var(--paper);}
  .cname{font-family:var(--round);font-weight:700;color:var(--indigo);}
  .cid{color:var(--ink-soft);font-size:12px;}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap;}
  .st.on{background:rgba(22,176,168,.14);color:#0d8a83;}
  .st.off{background:var(--paper-2);color:var(--ink-soft);}
  .st.career{background:rgba(142,91,238,.14);color:#5B2AC6;}
  .st.brain{background:rgba(255,176,32,.16);color:#a4690a;}
  .acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  #editorCard{display:none;}
  #editorCard.show{display:block;}
  /* 色票 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{width:40px;height:40px;border-radius:12px;cursor:pointer;border:3px solid transparent;transition:transform .15s;}
  .chip:hover{transform:scale(1.08);}
  .chip.sel{border-color:var(--indigo);box-shadow:0 0 0 2px #fff inset;}
  /* 章節編輯器 */
  .chp{border:1.5px solid var(--hair);border-radius:14px;margin-bottom:14px;overflow:hidden;}
  .chp-h{display:flex;gap:8px;align-items:center;background:var(--paper-2);padding:10px 12px;}
  .chp-h input{flex:1;background:#fff;}
  .lesson{display:flex;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--hair);flex-wrap:wrap;}
  .lesson .lt{flex:2;min-width:160px;}
  .lesson .lv-id{flex:1.2;min-width:130px;}
  .lesson select{width:auto;padding:8px 8px;}
  .lesson .ldur{width:64px;padding:8px 6px;text-align:center;}
  .lchk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .lchk input{width:16px;height:16px;padding:0;}
  .mini{font-family:var(--round);font-weight:800;border:none;background:var(--paper-2);color:var(--indigo);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;font-size:13px;}
  .mini:hover{background:#e8e5da;}
  .mini.del{color:var(--err);}
  .fetch-btn{font-family:var(--round);font-weight:700;font-size:12px;border:none;background:linear-gradient(135deg,#7C6CF0,#4B37D8);color:#fff;padding:8px 12px;border-radius:9px;cursor:pointer;flex:none;}
  /* 預覽 modal */
  #vmodal{position:fixed;inset:0;background:rgba(15,17,40,.8);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
  #vmodal.show{display:flex;}
  #vmodal .vbox{position:relative;width:min(860px,94vw);aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;}
  #vmodal .vbox.v916{width:min(360px,86vw);aspect-ratio:9/16;}
  #vmodal iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  #vmodal .vclose{position:absolute;top:14px;right:16px;z-index:81;font-family:var(--round);font-weight:800;background:#fff;border:none;border-radius:20px;padding:8px 16px;cursor:pointer;}
  /* 操作說明 */
  .sop{display:none;}
  .sop.show{display:block;}
  .step{display:flex;gap:14px;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .step .sn{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#FFB020,#FF8A3D);color:#fff;font-family:var(--round);font-weight:800;font-size:16px;display:grid;place-items:center;}
  .step b{color:var(--indigo);font-family:var(--round);font-size:15.5px;display:block;margin-bottom:3px;}
  .step p{font-size:13.5px;color:var(--ink-soft);line-height:1.8;}
  .step code{background:rgba(21,23,49,.07);padding:1px 7px;border-radius:6px;font-size:12.5px;}
  .warnbox{background:linear-gradient(135deg,#fff2f0,#fdeaea);border:1px solid rgba(214,69,69,.28);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:16px 0;}
  .warnbox b{color:var(--err);}
  .tipbox{background:linear-gradient(135deg,#fff8ec,#fdeede);border:1px solid rgba(255,176,32,.32);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:16px 0;}
  .tipbox b{color:var(--indigo);}
</style>
</head>
<body>
<nav><div class="nav-in"><span class="brand"><span class="b"></span>強腦力 後台</span><a href="member.html">← 會員中心</a></div></nav>
<div class="tabs"><div class="tabs-in">
  <a href="admin.html">總覽・銷售</a>
  <a href="admin-courses.html" class="active">課程管理</a>
  <a href="admin-contacts.html">名單管理</a>
  <a href="admin-broadcast.html">群發信</a>
  <a href="admin-landings.html">廣告頁</a>
  <a href="admin-admins.html">管理員</a>
</div></div>
<div id="content"><div class="state"><div class="spin"></div>確認管理員權限中…</div></div>

<div id="vmodal"><button class="vclose" onclick="document.getElementById('vmodal').classList.remove('show');document.getElementById('vbox').innerHTML='';">✕ 關閉</button><div class="vbox" id="vbox"></div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ACCENTS=[['amber','linear-gradient(135deg,#FFB020,#FF8A3D)'],['teal','linear-gradient(135deg,#16B0A8,#0d8a83)'],['violet','linear-gradient(135deg,#7C6CF0,#4B37D8)'],['indigo','linear-gradient(135deg,#22264f,#141330)'],['rose','linear-gradient(135deg,#FF6B8B,#E23A63)'],['gold','linear-gradient(135deg,#F5A623,#E0761B)'],['grape','linear-gradient(135deg,#8E5BEE,#5B2AC6)'],['free','linear-gradient(135deg,#7C6CF0,#4B37D8)'],['crimson','linear-gradient(135deg,#F5564A,#C81E3A)'],['plum','linear-gradient(135deg,#C154C1,#8E2D8E)'],['techblue','linear-gradient(135deg,#2BA8F0,#2456D8)']];
  const fmtDur=(sec)=>{ if(!sec&&sec!==0) return ''; const m=Math.floor(sec/60), s=Math.round(sec%60); return m+':'+String(s).padStart(2,'0'); };
  const vimeoId=(x)=>{ const m=String(x||'').match(/(\d{6,})/); return m?m[1]:''; };

  window.showVideo=(vid,ratio)=>{ const b=$('vbox'); b.className='vbox'+(ratio==='9:16'?' v916':''); b.innerHTML=`<iframe src="https://player.vimeo.com/video/${encodeURIComponent(vid)}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe>`; $('vmodal').classList.add('show'); };

  async function fetchVimeo(idOrUrl){
    const id=vimeoId(idOrUrl);
    if(!id) throw new Error('看不懂這個網址／ID，請貼 Vimeo 影片網址或純數字 ID');
    const r=await fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent('https://vimeo.com/'+id));
    if(!r.ok) throw new Error('Vimeo 抓不到這支影片（'+id+'）——九成是還沒開 Public＋Embed Anywhere，去 Vimeo 設定後再試');
    const j=await r.json();
    return { id, title:(j.title||''), duration:fmtDur(j.duration), ratio:(j.height>j.width)?'9:16':'16:9' };
  }

  (async ()=>{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
    const { data:isAdm } = await supabase.rpc('is_admin');
    if(isAdm!==true){
      $('content').innerHTML=`<div class="gate"><h2>非管理員帳號</h2><p>這個頁面僅限管理員使用。你目前登入的是 ${esc(session.user.email)}。</p><p><a href="member.html">← 回會員中心</a></p></div>`;
      return;
    }

    $('content').innerHTML=`
      <div class="wrap">
        <div class="h">課程管理</div>
        <div class="sub">新增、編輯、上下架課程與章節影片。<b>存檔即生效、不用部署</b>——前台 30 秒內就會反映。</div>
        <div class="subtabs">
          <button class="subtab active" id="tabList">📚 課程列表</button>
          <button class="subtab" id="tabSop">📖 操作說明</button>
        </div>

        <div id="paneList">
          <div class="card">
            <div class="row-top">
              <h2><span class="bar"></span>所有課程（<span id="cnt">0</span>）</h2>
              <div class="btns" style="margin:0;">
                <button class="btn btn-orange" id="btnNew">＋ 新增課程</button>
                <button class="btn btn-ghost" id="btnReload">重新整理</button>
              </div>
            </div>
            <div id="listWrap"><div class="state"><div class="spin"></div>載入課程中…</div></div>
          </div>

          <div class="card" id="editorCard">
            <h2><span class="bar"></span><span id="edTitle">編輯課程</span></h2>
            <div class="grid2">
              <div style="flex:1.2;"><label>課程代號 <small>（小寫英數與 -，建立後不可改）</small></label><input id="fId" type="text" placeholder="例如 super-focus"></div>
              <div style="flex:1.6;"><label>課程名稱</label><input id="fName" type="text" placeholder="例如 超級專注力"></div>
              <div><label>副標</label><input id="fSub" type="text" placeholder="一句話說明"></div>
            </div>
            <label>課程描述 <small>（會顯示在課程卡與觀看頁）</small></label>
            <textarea id="fDesc"></textarea>
            <div class="grid2">
              <div><label>分類</label><select id="fCat"><option value="brain">強腦力（線上課）</option><option value="career">就業力（洽詢制）</option></select></div>
              <div><label>價格 <small>（留空＝洽詢制不顯示價格；0＝免費課）</small></label><input id="fPrice" type="number" min="0" placeholder="4200"></div>
              <div><label>Level</label><input id="fLevel" type="number" min="1" value="1"></div>
              <div><label>排序 <small>（小的在前）</small></label><input id="fSort" type="number" value="50"></div>
            </div>
            <div class="grid2">
              <div><label>卡片小徽章 <small>（選填，如「限時優惠」）</small></label><input id="fNote" type="text"></div>
              <div><label>介紹頁網址 <small>（選填；空＝課程卡導 LINE 洽詢）</small></label><input id="fIntro" type="text" placeholder="course-xxx.html"></div>
            </div>
            <label>卡片顏色</label>
            <div class="chips" id="chips"></div>
            <label style="margin-top:18px;">單支影片 <small>（沒有章節時用；貼網址按「抓取」自動帶資料）</small></label>
            <div class="grid2">
              <div style="flex:2;display:flex;gap:8px;"><input id="fVid" type="text" placeholder="https://vimeo.com/123456789"><button class="fetch-btn" id="btnFetchSingle">抓取</button></div>
              <div style="flex:0 0 130px;"><select id="fRatio"><option value="16:9">橫式 16:9</option><option value="9:16">直式 9:16</option></select></div>
              <div style="flex:0 0 90px;"><button class="btn btn-ghost btn-sm" id="btnPrevSingle" style="width:100%;">▶ 預覽</button></div>
            </div>
            <label style="margin-top:20px;">章節與影片 <small>（有章節時，前台以章節為準、忽略上面的單支影片）</small></label>
            <div id="chapters"></div>
            <button class="btn btn-ghost btn-sm" id="btnAddCh">＋ 新增章節</button>
            <div class="btns" style="margin-top:22px;">
              <button class="btn btn-primary" id="btnSavePub">儲存並上架</button>
              <button class="btn btn-violet" id="btnSaveDraft">存成草稿（下架）</button>
              <button class="btn btn-ghost" id="btnCancel">取消</button>
            </div>
            <div class="msg" id="edMsg"></div>
          </div>
        </div>

        <div id="paneSop" class="sop">
          <div class="tipbox"><b>這一頁是你的說明書。</b>照著走，一門新課從 Vimeo 到上線大約 5 分鐘，全程不用找工程師、不用部署。</div>
          <div class="step"><div class="sn">1</div><div><b>影片先上 Vimeo，開兩個開關</b><p>影片上傳到 Vimeo 後，進 Manage video：右上隱私改成 <code>Public</code>；再到 Share → Embed → Where can this be embedded 選 <code>Anywhere</code>。<br>💡 忘記開也沒關係——在這裡貼網址按「抓取」時，抓不到就會直接提醒你。</p></div></div>
          <div class="step"><div class="sn">2</div><div><b>新增課程，填基本資料</b><p>課程列表 →「＋ 新增課程」。<b>課程代號</b>是網址與購課紀錄的身分證（例如 <code>super-focus</code>），建立後就不能改，取個簡短英文。價格留空＝洽詢制（就業力課）；填 0＝免費課；填數字＝付費課。</p></div></div>
          <div class="step"><div class="sn">3</div><div><b>加章節、貼影片</b><p>「＋ 新增章節」→ 章節裡「＋ 加影片」→ 貼 Vimeo 網址按「抓取」，標題、長度、<b>直式/橫式</b>會自動帶入（抓錯可手動改）。16:9 和 9:16 可以混在同一門課，前台播放器會自動切換比例。▲▼ 可調順序。</p></div></div>
          <div class="step"><div class="sn">4</div><div><b>勾「試看」做轉換</b><p>把你最有信心的 1～2 支影片勾成 <code>試看</code>——沒買課的會員也看得到這幾支，看完畫面上就有「解鎖完整課程」按鈕。這是免費流量變訂單的關鍵一步，建議每門課都開。</p></div></div>
          <div class="step"><div class="sn">5</div><div><b>存草稿 → 自己檢查 → 上架</b><p>先按「存成草稿」，用儲存成功後出現的<b>前台檢查連結</b>自己看一遍（草稿只有你看得到觀看頁、課程卡不會出現）。沒問題再按「儲存並上架」，30 秒內出現在前台精品課程頁，<b>不用部署</b>。</p></div></div>
          <div class="step"><div class="sn">6</div><div><b>要漏斗介紹頁？跟 Claude 說一聲</b><p>課程的銷售漏斗介紹頁（像過目不忘那種）是手工打磨的轉換頁。新課上架後跟 Claude 說「幫 ○○ 課做介紹頁」，10 分鐘生一頁部署好，再把網址填回這裡的「介紹頁網址」欄位即可。還沒有介紹頁時，課程卡的按鈕會自動導 LINE 洽詢，不會開天窗。</p></div></div>
          <div class="warnbox"><b>三個不要：</b>① 不要改已上架課程的「課程代號」（改不了是刻意設計，避免弄斷學員權限）② 不要期待「刪除」——課程只能下架（保護購課紀錄），下架後前台完全消失、隨時可重新上架 ③ 改價格時記得：課程介紹頁上的價格文字是寫死的，改完跟 Claude 說一聲同步介紹頁。</div>
          <div class="tipbox"><b>常見問題：</b><br>影片抓取失敗 → 去 Vimeo 開 Public＋Embed Anywhere（第 1 步）。<br>前台沒看到新課 → 確認已「儲存並上架」，再重新整理（手機瀏覽器有時要清快取）。<br>直式影片被拉寬 → 那支影片的比例選錯了，改成 9:16 再存一次。</div>
        </div>
      </div>`;

    let courses=[], editingId=null, chapters=[];

    const msg=(t,type)=>{ const m=$('edMsg'); m.className='msg show '+type; m.textContent=t; };
    const clearMsg=()=>{ $('edMsg').className='msg'; };

    // ── 子分頁切換 ──
    $('tabList').onclick=()=>{ $('tabList').classList.add('active'); $('tabSop').classList.remove('active'); $('paneList').style.display=''; $('paneSop').classList.remove('show'); };
    $('tabSop').onclick=()=>{ $('tabSop').classList.add('active'); $('tabList').classList.remove('active'); $('paneList').style.display='none'; $('paneSop').classList.add('show'); };

    // ── 色票 ──
    let selAccent='amber';
    const renderChips=()=>{ $('chips').innerHTML=ACCENTS.map(([k,g])=>`<div class="chip${k===selAccent?' sel':''}" title="${k}" data-k="${k}" style="background:${g}"></div>`).join('');
      $('chips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{ selAccent=el.dataset.k; renderChips(); }); };

    // ── 課程列表 ──
    const renderList=()=>{
      $('cnt').textContent=courses.length;
      const box=$('listWrap');
      if(!courses.length){ box.innerHTML='<div class="empty">目前沒有課程。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>排序</th><th>課程</th><th>分類</th><th>價格</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody>${courses.map((c,i)=>`<tr>
          <td><div class="acts"><button class="mini" data-mv="up" data-id="${esc(c.id)}" ${i===0?'disabled':''}>▲</button><button class="mini" data-mv="dn" data-id="${esc(c.id)}" ${i===courses.length-1?'disabled':''}>▼</button></div></td>
          <td><div class="cname">${esc(c.name)}</div><div class="cid">${esc(c.id)}${c.episodes&&c.episodes.v===2?'・'+(c.episodes.chapters||[]).reduce((n,ch)=>n+(ch.lessons||[]).length,0)+' 支影片':''}</div></td>
          <td><span class="st ${c.category==='career'?'career':'brain'}">${c.category==='career'?'就業力':'強腦力'}</span></td>
          <td>${c.price==null?'洽詢':(c.price===0?'免費':'NT$'+Number(c.price).toLocaleString())}</td>
          <td><span class="st ${c.is_published?'on':'off'}">${c.is_published?'上架中':'草稿'}</span></td>
          <td><div class="acts">
            <button class="btn btn-sm btn-ghost" data-act="edit" data-id="${esc(c.id)}">編輯</button>
            <button class="btn btn-sm ${c.is_published?'btn-violet':'btn-primary'}" data-act="pub" data-id="${esc(c.id)}">${c.is_published?'下架':'上架'}</button>
            <a class="btn btn-sm btn-ghost" href="watch.html?course=${encodeURIComponent(c.id)}" target="_blank">觀看頁↗</a>
          </div></td>
        </tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>rowAction(b.dataset.act,b.dataset.id));
      box.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>moveRow(b.dataset.id,b.dataset.mv));
    };

    const payloadOf=(c)=>({ id:c.id,name:c.name,subtitle:c.subtitle,description:c.description,price:c.price,level:c.level,accent:c.accent,note:c.note,vimeo_id:c.vimeo_id,episodes:c.episodes,is_published:c.is_published,sort_order:c.sort_order,intro_url:c.intro_url,default_ratio:c.default_ratio,category:c.category });

    const rowAction=async (act,id)=>{
      const c=courses.find(x=>x.id===id); if(!c) return;
      if(act==='edit'){ openEditor(c); return; }
      if(act==='pub'){
        const p=payloadOf(c); p.is_published=!c.is_published;
        const { error }=await supabase.rpc('admin_upsert_course',{ p });
        if(error){ alert((c.is_published?'下架':'上架')+'失敗：'+error.message); return; }
        await load();
      }
    };

    const moveRow=async (id,dir)=>{
      const i=courses.findIndex(x=>x.id===id); if(i<0) return;
      const j=dir==='up'?i-1:i+1; if(j<0||j>=courses.length) return;
      const a=payloadOf(courses[i]), b=payloadOf(courses[j]);
      let sa=a.sort_order, sb=b.sort_order;
      if(sa===sb){ sb=sb+(dir==='up'?1:-1); }
      a.sort_order=sb; b.sort_order=sa;
      const r1=await supabase.rpc('admin_upsert_course',{ p:a });
      const r2=await supabase.rpc('admin_upsert_course',{ p:b });
      if(r1.error||r2.error){ alert('排序失敗：'+(r1.error||r2.error).message); }
      await load();
    };

    // ── 章節編輯器 ──
    const renderChapters=()=>{
      const box=$('chapters');
      if(!chapters.length){ box.innerHTML='<div class="empty" style="padding:12px 0;">還沒有章節。單支影片課可以不加章節，直接用上面的「單支影片」。</div>'; return; }
      box.innerHTML=chapters.map((ch,ci)=>`
        <div class="chp">
          <div class="chp-h">
            <span style="font-family:var(--round);font-weight:800;font-size:13px;color:var(--ink-soft);flex:none;">第 ${ci+1} 章</span>
            <input type="text" value="${esc(ch.title)}" data-ch="${ci}" data-f="title" placeholder="章節名稱，例如：大腦暖身">
            <button class="mini" data-chmv="up" data-ch="${ci}" ${ci===0?'disabled':''}>▲</button>
            <button class="mini" data-chmv="dn" data-ch="${ci}" ${ci===chapters.length-1?'disabled':''}>▼</button>
            <button class="mini del" data-chdel="${ci}">✕</button>
          </div>
          ${(ch.lessons||[]).map((ls,li)=>`
            <div class="lesson">
              <span style="font-family:var(--round);font-weight:800;font-size:12px;color:var(--mute);flex:none;">${ci+1}-${li+1}</span>
              <input class="lt" type="text" value="${esc(ls.title)}" data-ch="${ci}" data-ls="${li}" data-f="title" placeholder="影片標題">
              <input class="lv-id" type="text" value="${esc(ls.vimeo_id)}" data-ch="${ci}" data-ls="${li}" data-f="vimeo_id" placeholder="Vimeo 網址或 ID">
              <button class="fetch-btn" data-fetch="${ci}-${li}">抓取</button>
              <select data-ch="${ci}" data-ls="${li}" data-f="ratio"><option value="16:9"${ls.ratio!=='9:16'?' selected':''}>16:9 橫</option><option value="9:16"${ls.ratio==='9:16'?' selected':''}>9:16 直</option></select>
              <input class="ldur" type="text" value="${esc(ls.duration||'')}" data-ch="${ci}" data-ls="${li}" data-f="duration" placeholder="長度">
              <label class="lchk"><input type="checkbox" ${ls.preview?'checked':''} data-ch="${ci}" data-ls="${li}" data-f="preview">試看</label>
              <button class="mini" data-prev="${ci}-${li}" title="預覽">▶</button>
              <button class="mini" data-lsmv="up" data-ch="${ci}" data-ls="${li}" ${li===0?'disabled':''}>▲</button>
              <button class="mini" data-lsmv="dn" data-ch="${ci}" data-ls="${li}" ${li===(ch.lessons.length-1)?'disabled':''}>▼</button>
              <button class="mini del" data-lsdel="${ci}-${li}">✕</button>
            </div>`).join('')}
          <div style="padding:9px 12px;border-top:1px solid var(--hair);"><button class="btn btn-ghost btn-sm" data-addls="${ci}">＋ 加影片</button></div>
        </div>`).join('');
      // 綁定
      box.querySelectorAll('input[data-f],select[data-f]').forEach(el=>{
        el.onchange=()=>{
          const ci=+el.dataset.ch, f=el.dataset.f;
          const tgt=(el.dataset.ls!=null && el.dataset.ls!=='')? chapters[ci].lessons[+el.dataset.ls] : chapters[ci];
          tgt[f] = (el.type==='checkbox') ? el.checked : el.value.trim();
          if(f==='vimeo_id'){ tgt.vimeo_id=vimeoId(el.value)||el.value.trim(); }
        };
      });
      box.querySelectorAll('[data-addls]').forEach(b=>b.onclick=()=>{ chapters[+b.dataset.addls].lessons.push({title:'',vimeo_id:'',ratio:'16:9',preview:false,duration:''}); renderChapters(); });
      box.querySelectorAll('[data-chdel]').forEach(b=>b.onclick=()=>{ if(confirm('刪除整個章節（含裡面的影片列）？')){ chapters.splice(+b.dataset.chdel,1); renderChapters(); } });
      box.querySelectorAll('[data-lsdel]').forEach(b=>b.onclick=()=>{ const [ci,li]=b.dataset.lsdel.split('-').map(Number); chapters[ci].lessons.splice(li,1); renderChapters(); });
      box.querySelectorAll('[data-chmv]').forEach(b=>b.onclick=()=>{ const ci=+b.dataset.ch, j=b.dataset.chmv==='up'?ci-1:ci+1; [chapters[ci],chapters[j]]=[chapters[j],chapters[ci]]; renderChapters(); });
      box.querySelectorAll('[data-lsmv]').forEach(b=>b.onclick=()=>{ const ci=+b.dataset.ch, li=+b.dataset.ls, j=b.dataset.lsmv==='up'?li-1:li+1; const L=chapters[ci].lessons; [L[li],L[j]]=[L[j],L[li]]; renderChapters(); });
      box.querySelectorAll('[data-fetch]').forEach(b=>b.onclick=async ()=>{
        const [ci,li]=b.dataset.fetch.split('-').map(Number); const ls=chapters[ci].lessons[li];
        const src=box.querySelector(`input[data-ch="${ci}"][data-ls="${li}"][data-f="vimeo_id"]`).value;
        b.textContent='…';
        try{ const v=await fetchVimeo(src); ls.vimeo_id=v.id; ls.ratio=v.ratio; ls.duration=v.duration; if(!ls.title) ls.title=v.title; renderChapters(); msg('✓ 已抓到影片：'+v.title+'（'+v.ratio+'・'+v.duration+'）','ok'); }
        catch(e){ b.textContent='抓取'; msg('✗ '+e.message,'error'); }
      });
      box.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{ const [ci,li]=b.dataset.prev.split('-').map(Number); const ls=chapters[ci].lessons[li]; if(!vimeoId(ls.vimeo_id)){ msg('這一列還沒有有效的 Vimeo ID','error'); return; } showVideo(vimeoId(ls.vimeo_id), ls.ratio); });
    };
    $('btnAddCh').onclick=()=>{ chapters.push({title:'',lessons:[]}); renderChapters(); };

    // ── 編輯器開關 ──
    const openEditor=(c)=>{
      clearMsg(); $('editorCard').classList.add('show'); $('editorCard').scrollIntoView({behavior:'smooth'});
      editingId = c ? c.id : null;
      $('edTitle').textContent = c ? ('編輯：'+c.name) : '新增課程';
      $('fId').value=c?c.id:''; $('fId').disabled=!!c;
      $('fName').value=c?.name||''; $('fSub').value=c?.subtitle||''; $('fDesc').value=c?.description||'';
      $('fCat').value=c?.category||'brain';
      $('fPrice').value=(c&&c.price!=null)?c.price:'';
      $('fLevel').value=c?.level||1; $('fSort').value=(c&&c.sort_order!=null)?c.sort_order:50;
      $('fNote').value=c?.note||''; $('fIntro').value=c?.intro_url||'';
      $('fVid').value=c?.vimeo_id||''; $('fRatio').value=c?.default_ratio==='9:16'?'9:16':'16:9';
      selAccent=c?.accent||'amber'; renderChips();
      chapters = (c && c.episodes && c.episodes.v===2 && Array.isArray(c.episodes.chapters))
        ? JSON.parse(JSON.stringify(c.episodes.chapters))
        : [];
      if(c && Array.isArray(c.episodes) && c.episodes.length){
        msg('提醒：這門課的分集是舊格式（能正常播放）。若在下方新增章節並儲存，會改用新章節格式取代舊分集。','ok');
      }
      renderChapters();
    };
    $('btnNew').onclick=()=>openEditor(null);
    $('btnCancel').onclick=()=>{ $('editorCard').classList.remove('show'); };
    $('btnReload').onclick=()=>load();
    $('btnFetchSingle').onclick=async ()=>{
      const b=$('btnFetchSingle'); b.textContent='…';
      try{ const v=await fetchVimeo($('fVid').value); $('fVid').value=v.id; $('fRatio').value=v.ratio; msg('✓ 已抓到：'+v.title+'（'+v.ratio+'・'+v.duration+'）','ok'); }
      catch(e){ msg('✗ '+e.message,'error'); }
      b.textContent='抓取';
    };
    $('btnPrevSingle').onclick=()=>{ const id=vimeoId($('fVid').value); if(!id){ msg('先貼影片網址','error'); return; } showVideo(id,$('fRatio').value); };

    const save=async (publish)=>{
      const id=($('fId').value||'').trim().toLowerCase();
      const name=($('fName').value||'').trim();
      if(!id){ msg('請填課程代號','error'); return; }
      if(!/^[a-z0-9][a-z0-9-]{1,48}$/.test(id)){ msg('課程代號只能用小寫英文、數字與 -（2~49 字）','error'); return; }
      if(!name){ msg('請填課程名稱','error'); return; }
      // 組章節，清掉全空的列
      const cleanCh = chapters.map(ch=>({ title:(ch.title||'').trim(), lessons:(ch.lessons||[]).filter(l=>(l.title||'').trim()||vimeoId(l.vimeo_id)).map(l=>({ title:(l.title||'').trim(), vimeo_id:vimeoId(l.vimeo_id)||'', ratio:l.ratio==='9:16'?'9:16':'16:9', preview:!!l.preview, duration:(l.duration||'').trim() })) })).filter(ch=>ch.title||ch.lessons.length);
      const priceRaw=($('fPrice').value||'').trim();
      const old=courses.find(x=>x.id===id);
      const p={
        id, name,
        subtitle:($('fSub').value||'').trim()||null,
        description:($('fDesc').value||'').trim()||null,
        price: priceRaw===''?null:Math.max(0,parseInt(priceRaw,10)||0),
        level: Math.max(1,parseInt($('fLevel').value,10)||1),
        accent: selAccent,
        note: ($('fNote').value||'').trim()||null,
        vimeo_id: vimeoId($('fVid').value)||null,
        episodes: cleanCh.length? {v:2,chapters:cleanCh} : (old && Array.isArray(old.episodes) ? old.episodes : null),
        is_published: publish,
        sort_order: parseInt($('fSort').value,10)||50,
        intro_url: ($('fIntro').value||'').trim()||null,
        default_ratio: $('fRatio').value==='9:16'?'9:16':'16:9',
        category: $('fCat').value==='career'?'career':'brain'
      };
      if(!editingId && courses.some(x=>x.id===id)){ msg('這個課程代號已存在，請換一個（或直接編輯那門課）','error'); return; }
      $('btnSavePub').disabled=true; $('btnSaveDraft').disabled=true; msg('儲存中…','ok');
      const { data, error } = await supabase.rpc('admin_upsert_course',{ p });
      $('btnSavePub').disabled=false; $('btnSaveDraft').disabled=false;
      if(error){ msg('儲存失敗：'+error.message,'error'); return; }
      msg('✓ 已儲存'+(publish?'並上架':'為草稿')+'！前台檢查：\n・課程卡 → '+location.origin+'/courses.html#'+(p.category==='career'?'pro':'brain')+'\n・觀看頁 → '+location.origin+'/watch.html?course='+id+(publish?'':'\n（草稿不會出現在前台課程卡，觀看頁只有你能測）'),'ok');
      editingId=id;
      await load(false);
    };
    $('btnSavePub').onclick=()=>save(true);
    $('btnSaveDraft').onclick=()=>save(false);

    const load=async (resetEditor=true)=>{
      $('listWrap').innerHTML='<div class="state"><div class="spin"></div>載入課程中…</div>';
      const { data, error } = await supabase.rpc('admin_list_courses');
      if(error){ $('listWrap').innerHTML='<div class="empty" style="color:var(--err);">讀取失敗：'+esc(error.message)+'</div>'; return; }
      courses=data||[];
      renderList();
      if(resetEditor) $('editorCard').classList.remove('show');
    };
    load();
  })();
</script>
<div style="text-align:center;padding:26px 14px 30px;font-size:12.5px;color:#8b90a5;">© 2021 強腦力 SkyBraining LLC・skybraining.com・Sky強腦力media</div>
