<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>廣告頁 — 強腦力 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;--mute:#8a8ea6;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--violet:#7C6CF0;--violet2:#4B37D8;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:19px;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:16px;font-size:14.5px;}
  .how{background:linear-gradient(135deg,#fff8ec,#fdeede);border:1px solid rgba(255,176,32,.32);border-radius:14px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:22px;}
  .how b{color:var(--indigo);}
  .how code{background:rgba(21,23,49,.07);padding:1px 6px;border-radius:6px;font-size:12.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .card h2{font-size:17px;color:var(--indigo);display:flex;align-items:center;gap:9px;}
  .card h2 .bar{width:5px;height:19px;border-radius:3px;background:linear-gradient(var(--amber),var(--orange));}
  input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
  textarea{min-height:260px;resize:vertical;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;}
  label{display:block;font-weight:700;font-size:13px;color:var(--indigo);margin:12px 0 6px;font-family:var(--round);}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:var(--round);font-weight:700;font-size:14px;padding:10px 18px;border-radius:24px;border:none;cursor:pointer;transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 10px 24px rgba(22,176,168,.3);}
  .btn-orange{color:#fff;background:linear-gradient(135deg,#FF8A3D,#FFB020);}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);}
  .btn-violet{color:#fff;background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .btn-sm{font-size:12.5px;padding:6px 12px;border-radius:18px;}
  .btn-del{color:var(--err);background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.22);}
  .msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:13.5px;display:none;white-space:pre-wrap;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);border:1px solid rgba(22,176,168,.28);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px;}
  th,td{border-bottom:1px solid var(--hair);padding:11px 12px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;background:#fff;}
  tbody tr:hover{background:var(--paper);}
  .pg-name{font-family:var(--round);font-weight:700;color:var(--indigo);}
  .pg-url{color:var(--ink-soft);font-size:12px;word-break:break-all;}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap;}
  .st.published{background:rgba(22,176,168,.14);color:#0d8a83;}
  .st.draft{background:var(--paper-2);color:var(--ink-soft);}
  .acts{display:flex;gap:5px;flex-wrap:wrap;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  #editorCard{display:none;}
  #editorCard.show{display:block;}
</style>
</head>
<body>
<nav><div class="nav-in"><span class="brand"><span class="b"></span>強腦力 後台</span><a href="member.html">← 會員中心</a></div></nav>
<div class="tabs"><div class="tabs-in">
  <a href="admin.html">總覽・銷售</a>
  <a href="admin-contacts.html">名單管理</a>
  <a href="admin-broadcast.html">群發信</a>
  <a href="admin-landings.html" class="active">廣告頁</a>
</div></div>
<div id="content"><div class="state"><div class="spin"></div>確認管理員權限中…</div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const ADMIN_EMAILS=['brainingflow@gmail.com'];
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate=(s)=> s ? String(s).slice(0,16).replace('T',' ') : '';
  const lpUrl=(slug)=> location.origin + '/lp.html?p=' + encodeURIComponent(slug);

  (async ()=>{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }
    const email=(session.user.email||'').toLowerCase();
    if(!ADMIN_EMAILS.includes(email)){
      $('content').innerHTML=`<div class="gate"><h2>非管理員帳號</h2><p>這個頁面僅限管理員使用。你目前登入的是 ${esc(session.user.email)}。</p><p><a href="member.html">← 回會員中心</a></p></div>`;
      return;
    }

    $('content').innerHTML=`
      <div class="wrap">
        <div class="h">廣告頁</div>
        <div class="sub">投廣告用的一頁式落地頁，全部存在這裡。可以複製一頁做成新的變體、隨時修改、隨時上下架。</div>
        <div class="how">
          <b>怎麼運作：</b>每一頁都有自己的獨立網址 <code>skybraining.com/lp.html?p=代號</code>。新增或複製後<b>馬上生效、不用部署</b>——投廣告時就把這個網址貼到廣告後台。做 A/B 測試時，複製一頁、改個標題、換個代號，就是一支新廣告頁。
        </div>

        <div class="card">
          <div class="row-top">
            <h2><span class="bar"></span>我的廣告頁（<span id="cnt">0</span>）</h2>
            <div class="btns" style="margin:0;">
              <button class="btn btn-orange" id="btnNew">＋ 新增空白頁</button>
              <button class="btn btn-ghost" id="btnReload">重新整理</button>
            </div>
          </div>
          <div id="listWrap"><div class="state"><div class="spin"></div>載入廣告頁中…</div></div>
        </div>

        <div class="card" id="editorCard">
          <h2><span class="bar"></span><span id="edTitle">編輯廣告頁</span></h2>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:2;min-width:200px;"><label>頁面名稱（只有你看得到）</label><input id="edName" type="text" placeholder="例如：免費課・媽媽版"></div>
            <div style="flex:1;min-width:150px;"><label>網址代號（英數與 -）</label><input id="edSlug" type="text" placeholder="free-mom"></div>
            <div style="flex:1;min-width:120px;"><label>狀態</label><select id="edStatus"><option value="published">已發布（上線）</option><option value="draft">草稿（不公開）</option></select></div>
          </div>
          <label>備註（選填）</label>
          <input id="edNote" type="text" placeholder="這支給哪個受眾/廣告用…">
          <label>頁面內容 HTML（進階；一般用「複製成新的」再改文字最快）</label>
          <textarea id="edHtml" placeholder="<style>…</style> + 內容 HTML"></textarea>
          <div class="btns">
            <button class="btn btn-primary" id="btnSave">儲存</button>
            <button class="btn btn-violet" id="btnPreview">預覽 ↗</button>
            <button class="btn btn-ghost" id="btnCopyHtml">複製整頁 HTML</button>
            <button class="btn btn-ghost" id="btnCancel">取消</button>
          </div>
          <div class="msg" id="edMsg"></div>
        </div>
      </div>`;

    let pages=[], editingSlug=null;

    const msg=(t,type)=>{ const m=$('edMsg'); m.className='msg show '+type; m.textContent=t; };
    const clearMsg=()=>{ $('edMsg').className='msg'; };

    const renderList=()=>{
      $('cnt').textContent=pages.length;
      const box=$('listWrap');
      if(!pages.length){ box.innerHTML='<div class="empty">還沒有廣告頁。系統會自動幫你匯入現有的免費課頁當第一支，稍等一下或按「重新整理」。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>名稱 / 網址</th><th>狀態</th><th>更新</th><th>操作</th></tr></thead>
        <tbody>${pages.map(p=>`<tr>
          <td><div class="pg-name">${esc(p.name||p.slug)}</div><div class="pg-url">/lp.html?p=${esc(p.slug)}</div>${p.note?'<div class="pg-url" style="color:var(--mute);">'+esc(p.note)+'</div>':''}</td>
          <td><span class="st ${p.status}">${p.status==='published'?'已發布':'草稿'}</span></td>
          <td class="pg-url">${esc(fmtDate(p.updated_at))}</td>
          <td><div class="acts">
            <a class="btn btn-sm btn-ghost" href="${esc(lpUrl(p.slug))}" target="_blank">開啟↗</a>
            <button class="btn btn-sm btn-primary" data-act="copyurl" data-slug="${esc(p.slug)}">複製網址</button>
            <button class="btn btn-sm btn-violet" data-act="dup" data-slug="${esc(p.slug)}">複製成新的</button>
            <button class="btn btn-sm btn-ghost" data-act="edit" data-slug="${esc(p.slug)}">編輯</button>
            <button class="btn btn-sm btn-del" data-act="del" data-slug="${esc(p.slug)}">刪除</button>
          </div></td>
        </tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>rowAction(b.getAttribute('data-act'), b.getAttribute('data-slug'), b));
    };

    const copy=async (text, okMsg)=>{
      try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove(); }
      alert(okMsg);
    };

    const rowAction=async (act, slug, btn)=>{
      const p=pages.find(x=>x.slug===slug);
      if(act==='copyurl'){ copy(lpUrl(slug), '已複製廣告頁網址：\n'+lpUrl(slug)+'\n\n貼到 Facebook / Google 廣告後台即可。'); return; }
      if(act==='dup'){
        const newName=prompt('新頁面的名稱：', (p?.name||slug)+'（複本）'); if(newName===null) return;
        let newSlug=prompt('新頁面的網址代號（英數與 -）：', slug+'-2'); if(newSlug===null) return;
        const { data, error } = await supabase.rpc('admin_lp_duplicate',{ p_src:slug, p_new_slug:newSlug, p_new_name:newName });
        if(error){ alert('複製失敗：'+error.message); return; }
        alert('已複製成新的草稿：'+data.slug+'\n它在下面清單裡，編輯改好文字後把狀態設成「已發布」就能投廣告。');
        await load();
        return;
      }
      if(act==='edit'){ openEditor(slug); return; }
      if(act==='del'){
        if(btn.getAttribute('data-armed')!=='1'){ btn.setAttribute('data-armed','1'); btn.textContent='確認刪除'; setTimeout(()=>{ if(btn.isConnected){btn.setAttribute('data-armed','0');btn.textContent='刪除';} },3500); return; }
        const { error } = await supabase.rpc('admin_lp_delete',{ p_slug:slug });
        if(error){ alert('刪除失敗：'+error.message); return; }
        await load();
        return;
      }
    };

    const openEditor=async (slug)=>{
      clearMsg();
      $('editorCard').classList.add('show');
      $('editorCard').scrollIntoView({behavior:'smooth'});
      if(!slug){ // new blank
        editingSlug=null; $('edTitle').textContent='新增廣告頁';
        $('edName').value=''; $('edSlug').value=''; $('edStatus').value='published'; $('edNote').value=''; $('edHtml').value='';
        return;
      }
      editingSlug=slug; $('edTitle').textContent='編輯：'+slug;
      msg('載入內容中…','ok');
      const { data, error } = await supabase.rpc('admin_lp_get',{ p_slug:slug });
      if(error || !data || !data.length){ msg('讀取失敗：'+(error?error.message:'找不到'),'error'); return; }
      const row=data[0];
      $('edName').value=row.name||''; $('edSlug').value=row.slug||''; $('edStatus').value=row.status||'published'; $('edNote').value=row.note||''; $('edHtml').value=row.html||'';
      clearMsg();
    };

    $('btnNew').onclick=()=>openEditor(null);
    $('btnCancel').onclick=()=>{ $('editorCard').classList.remove('show'); };
    $('btnReload').onclick=load;
    $('btnCopyHtml').onclick=()=>copy($('edHtml').value, '已複製整頁 HTML。');
    $('btnPreview').onclick=()=>{ const s=$('edSlug').value.trim(); if(!s){ msg('先填網址代號並儲存，才能預覽。','error'); return; } window.open(lpUrl(s),'_blank'); };

    $('btnSave').onclick=async ()=>{
      const name=$('edName').value.trim(), slug=$('edSlug').value.trim(), status=$('edStatus').value, note=$('edNote').value.trim(), html=$('edHtml').value;
      if(!slug){ msg('請填網址代號。','error'); return; }
      if(!html.trim()){ msg('頁面內容不能空白。可以先「複製成新的」再改。','error'); return; }
      $('btnSave').disabled=true; msg('儲存中…','ok');
      const { data, error } = await supabase.rpc('admin_lp_upsert',{ p_slug:slug, p_name:name, p_note:note||null, p_html:html, p_status:status });
      $('btnSave').disabled=false;
      if(error){ msg('儲存失敗：'+error.message,'error'); return; }
      msg('✓ 已儲存！網址：'+lpUrl(data.slug),'ok');
      editingSlug=data.slug;
      await load();
    };

    // fetch the current free.html and turn it into stored content (style + body, no scripts)
    const extractTemplate=async ()=>{
      const res=await fetch('/free.html',{cache:'no-store'}); const txt=await res.text();
      const doc=new DOMParser().parseFromString(txt,'text/html');
      const style=doc.querySelector('head style');
      const body=doc.body.cloneNode(true);
      body.querySelectorAll('script').forEach(s=>s.remove());
      return (style?style.outerHTML:'') + '\n' + body.innerHTML;
    };

    const load=async ()=>{
      $('listWrap').innerHTML='<div class="state"><div class="spin"></div>載入廣告頁中…</div>';
      let { data, error } = await supabase.rpc('admin_lp_list');
      if(error){ $('listWrap').innerHTML='<div class="empty" style="color:var(--err);">讀取失敗：'+esc(error.message)+'</div>'; return; }
      pages=data||[];
      // first-run seed: import the live free.html as the flagship ad page
      if(!pages.length){
        try{
          const html=await extractTemplate();
          const up=await supabase.rpc('admin_lp_upsert',{ p_slug:'free-course', p_name:'免費體驗課・廣告頁（範本）', p_note:'從 free.html 匯入，可直接複製成新的變體', p_html:html, p_status:'published' });
          if(!up.error){ const re=await supabase.rpc('admin_lp_list'); pages=re.data||[]; }
        }catch(e){ /* seeding is best-effort */ }
      }
      renderList();
    };
    load();
  })();
</script>
</body>
</html>
