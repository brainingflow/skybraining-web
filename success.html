<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--err:#d64545;
    --line-brand:#06C755;--hair:rgba(21,23,49,.1);
    --sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --sh-md:0 18px 44px rgba(21,23,49,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  nav{background:rgba(250,249,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(20px,5vw,40px);max-width:1060px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:20px;color:var(--indigo);}
  .wm-accent{background:linear-gradient(120deg,#FFB020,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .box{max-width:560px;margin:44px auto 70px;background:#fff;border:1px solid var(--hair);border-radius:24px;box-shadow:var(--sh-md);padding:46px 36px;text-align:center;}
  .big-ic{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;font-size:40px;margin:0 auto 20px;background:var(--paper-2);}
  .big-ic.ok{background:rgba(22,176,168,.13);}
  .big-ic.warn{background:rgba(255,176,32,.15);}
  .big-ic.err{background:rgba(214,69,69,.1);}
  h1{font-family:var(--round);font-weight:800;font-size:25px;color:var(--indigo);margin-bottom:10px;}
  p{color:var(--ink-soft);font-size:14.5px;margin-bottom:8px;}
  .oid{font-size:11.5px;color:#a7abc2;margin-top:6px;word-break:break-all;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .btn{font-family:var(--round);font-weight:700;font-size:15px;padding:13px 28px;border-radius:40px;display:inline-flex;align-items:center;gap:8px;transition:transform .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-main{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 12px 28px rgba(22,176,168,.32);}
  .btn-orange{color:#fff;background:linear-gradient(135deg,#FFB020,#FF8A3D);box-shadow:0 12px 28px rgba(255,138,61,.32);}
  .btn-ghost{background:var(--paper-2);color:var(--indigo);}
  .btn-line{background:var(--line-brand);color:#fff;}
  .spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.2);}

  /* ── 社群追蹤按鈕（頁尾）── */
  .sb-social{width:100%;flex-basis:100%;max-width:1180px;margin:0 auto 26px;padding:0 22px 22px;box-sizing:border-box;border-bottom:1px solid rgba(140,140,155,.28);text-align:center;}
  .sb-social.sb-alone{border-bottom:0;border-top:1px solid rgba(140,140,155,.25);margin:34px auto 0;padding:26px 22px 4px;}
  .sb-social-h{font-weight:800;font-size:15px;letter-spacing:.3px;margin-bottom:13px;opacity:.94;}
  .sb-social-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;}
  .sb-so{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:30px;color:#fff !important;font-weight:800;font-size:14.5px;line-height:1;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .18s,filter .18s,box-shadow .18s;}
  .sb-so:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .sb-so svg{width:19px;height:19px;flex:none;}
  .sb-yt{background:#FF0000;}
  .sb-line{background:#06C755;}
  .sb-ig{background:linear-gradient(45deg,#F9CE34 0%,#EE2A7B 48%,#6228D7 100%);}
  .sb-tt{background:#111;box-shadow:0 4px 14px rgba(0,0,0,.16),inset 0 0 0 1.5px rgba(255,255,255,.3);}
  .sb-tt:hover{box-shadow:0 8px 20px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(255,255,255,.45);}
  @media(max-width:520px){.sb-so{padding:10px 14px;font-size:13.5px;}.sb-so svg{width:17px;height:17px;}.sb-social{padding:0 14px 20px;}}

  <h1>確認付款狀態中…</h1>
  <p>請稍候幾秒，不要關閉頁面</p>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supabase=createClient('https://gfuqizxzihgydzyqywun.supabase.co','sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv');
  const box=document.getElementById('box');
  const orderId=new URLSearchParams(location.search).get('order');
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const view=(ic,cls,title,body,btns,oid)=>{
    box.innerHTML=`<div class="big-ic ${cls} pop">${ic}</div><h1>${title}</h1>${body}<div class="btns">${btns}</div>${oid?`<div class="oid">訂單編號：${esc(oid)}</div>`:''}`;
  };

  (async ()=>{
    if(!orderId){ view('⚠️','warn','找不到訂單','<p>網址缺少訂單參數。</p>','<a class="btn btn-ghost" href="member.html">← 我的課程</a>',''); return; }
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }

    let order=null;
    for(let i=0;i<12;i++){
      const { data } = await supabase.from('orders').select('*').eq('id',orderId).maybeSingle();
      order=data;
      if(order && order.status==='paid') break;
      if(order && order.status==='failed') break;
      await new Promise(r=>setTimeout(r,2500));
    }

    if(order && order.status==='paid'){
      const cid=order.course_id;
      view('🎉','ok','付款成功，課程已開通！',
        '<p>你的課程已經在「我的課程」裡了，現在就可以開始上課。電子發票將寄到你的 email</p>',
        `<a class="btn btn-main" href="watch.html?course=${encodeURIComponent(cid)}">▶ 立即上課</a><a class="btn btn-ghost" href="member.html">我的課程</a>`, order.id);
      return;
    }
    if(order && order.status==='failed'){
      view('😥','err','付款未完成',
        '<p>這筆訂單沒有完成付款。沒有扣款成功的話，可以回到結帳頁再試一次</p>',
        `<a class="btn btn-orange" href="checkout.html?course=${encodeURIComponent(order.course_id||'')}">再試一次 →</a><a class="btn btn-line" href="https://lin.ee/9EGO8IT" target="_blank" rel="noopener">LINE 真人協助</a>`, order.id);
      return;
    }
    // pending / 查不到：ATM・超商是入帳後才開通
    view('⏳','warn','付款處理中',
      '<p>如果你用的是 <b>ATM 轉帳或超商代碼</b>，繳費入帳後系統會<b>自動開通課程</b>（通常幾分鐘～數小時內），開通後就會出現在「我的課程」。</p><p>刷卡的話通常幾秒內完成，可以按下面重新整理看看</p>',
      `<a class="btn btn-main" href="javascript:location.reload()">🔄 重新整理</a><a class="btn btn-ghost" href="member.html">我的課程</a><a class="btn btn-line" href="https://lin.ee/9EGO8IT" target="_blank" rel="noopener">LINE 協助</a>`, orderId);
  })();
</script>

<script>
/* 社群按鈕點擊 → GA4（social_click 總覽 ＋ follow_xxx 分頻道，兩種都送，後台不用設定就看得到）*/
(function(){
  var els = document.querySelectorAll('a[data-so]');
  for (var i=0;i<els.length;i++){ (function(a){
    a.addEventListener('click', function(){
      try{
        if(!window.gtag) return;
        var n = a.getAttribute('data-so');
        var p = location.pathname.replace(/^\//,'') || 'index.html';
        gtag('event','social_click',{ network:n, page:p, link_url:a.href });
        gtag('event','follow_'+n,{ page:p });
      }catch(e){}
    });
  })(els[i]); }
})();
</script>
