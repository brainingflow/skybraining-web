  label:'國中數學',

  strands:[
    {key:'number',label:'數與量',color:'#FF8A5B',

/* ---------- 節點 ---------- */
const nodes = [];
const pickables = [];

function makeNode(o){
  const n = Object.assign({children:[], pos:new THREE.Vector3(), t:0, goal:0, wait:0, expanded:false, pulse:0}, o);
  const col = new THREE.Color(n.color);
  const group = new THREE.Group();
  let core;
  if (n.level === 0){
    core = new THREE.Mesh(new THREE.SphereGeometry(1.5, 40, 40), new THREE.MeshStandardMaterial({color:0xEEF2EA, emissive:0x3a4a44, roughness:.45, metalness:.1}));
    const ico = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.6, 1)), new THREE.LineBasicMaterial({color:0xEEF2EA, transparent:true, opacity:.35}));
    group.add(ico); n.spin = ico;
  } else if (n.level === 1){
    core = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), new THREE.MeshStandardMaterial({color:col, emissive:col.clone().multiplyScalar(.35), roughness:.4}));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.045, 8, 64), new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.75}));
    ring.rotation.x = Math.PI/2.6; group.add(ring); n.spin = ring;
  } else {
    core = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 0), new THREE.MeshStandardMaterial({color:col, emissive:col.clone().multiplyScalar(.3), roughness:.35, flatShading:true}));
    n.spin = core;
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:.55}));
  const gs = n.level === 0 ? 7 : n.level === 1 ? 4.2 : 2.2; glow.scale.set(gs, gs, 1);
  group.add(glow); group.add(core);
  core.userData.node = n; pickables.push(core);
  n.obj = group; n.core = core; n.radius = n.level === 0 ? 2.6 : n.level === 1 ? 1.5 : 0.6;
  scene.add(group);

  if (n.parent){
    const pts = new Float32Array(24*3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pts,3));
    n.line = new THREE.Line(g, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.75}));
    scene.add(n.line);
  }

  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'nl l' + n.level;
  el.style.setProperty('--c', n.color);
  el.innerHTML = `<span>${n.label}</span>` + (n.grade ? `<span class="g">${n.grade}</span>` : '') + (n.level < 2 ? '<span class="tog"></span>' : '');
  el.addEventListener('click', e => { e.stopPropagation(); activate(n); });
  labelLayer.appendChild(el);
  n.el = el; n.tog = el.querySelector('.tog');
  nodes.push(n);
  return n;
}

const root = makeNode({id:'root', level:0, label:DATA.label, color:'#EEF2EA', parent:null, target:new THREE.Vector3(), lead:DATA.lead});
root.t = 1; root.goal = 1;

const UP = new THREE.Vector3(0,1,0);
DATA.strands.forEach((s, i) => {
  const a = i / 6 * Math.PI * 2 + 0.3;
  const target = new THREE.Vector3(Math.cos(a)*10.5, (i % 2 ? 3.2 : -2.6), Math.sin(a)*10.5);
  const sn = makeNode({id:s.key, level:1, label:s.label, color:s.color, parent:root, target, q:s.q, one:s.one, index:i});
  root.children.push(sn);
  const dir = target.clone().normalize();
  const u = new THREE.Vector3().crossVectors(dir, UP).normalize();
  const v = new THREE.Vector3().crossVectors(u, dir).normalize();
  const base = target.clone().add(dir.clone().multiplyScalar(4.6));
  s.units.forEach((un, j) => {
    const b = j / 6 * Math.PI * 2 + Math.PI/6;
    const tp = base.clone().add(u.clone().multiplyScalar(Math.cos(b)*3.6)).add(v.clone().multiplyScalar(Math.sin(b)*3.0));
    const tn = makeNode({id:s.key+'-'+j, level:2, label:un[0], grade:un[1], learn:un[2], ex:un[3], color:s.color, parent:sn, target:tp, strand:sn});
    sn.children.push(tn);
  });
});

/* ---------- 展開 / 收合 ---------- */
function expand(n){
  n.expanded = true;
  n.children.forEach((c, j) => { if (c.goal !== 1){ c.goal = 1; c.wait = reduced ? 0 : j * 0.06; } });
}
function collapse(n){
  n.expanded = false;
  n.children.forEach(c => { c.goal = 0; c.wait = 0; if (c.children.length) collapse(c); });
}
function expandAll(){ expand(root); root.children.forEach(expand); }
function collapseAll(){ root.children.forEach(collapse); }

/* ---------- 相機（自製軌道控制） ---------- */
const orbit = {theta:0.9, phi:1.12, r:36, target:new THREE.Vector3()};
const goal  = {theta:0.9, phi:1.12, r:36, target:new THREE.Vector3()};
let lastInteract = performance.now();

function wrapTo(cur, ang){ let d = ang - cur; d = ((d + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; return cur + d; }
function focusOn(n){
  if (n.level === 0){ goal.target.set(0,0,0); goal.r = 36; goal.phi = 1.12; return; }
  const p = n.level === 1 ? n.target.clone().multiplyScalar(0.8).add(n.target.clone().normalize().multiplyScalar(2)) : n.target.clone().multiplyScalar(0.9);
  goal.target.copy(p);
  goal.r = n.level === 1 ? (phone.matches ? 28 : 20) : (phone.matches ? 24 : 15);
  goal.theta = wrapTo(goal.theta, Math.atan2(n.target.x, n.target.z));
  goal.phi = 1.18;
}
function resetView(){ goal.theta = wrapTo(goal.theta, 0.9); focusOn(root); }

// 拖曳、縮放
const pointers = new Map();
let downAt = null, moved = 0, pinch0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1){ downAt = {x:e.clientX, y:e.clientY}; moved = 0; }
  if (pointers.size === 2){ const [a,b] = [...pointers.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); }
  canvas.classList.add('dragging'); lastInteract = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1){
    goal.theta -= dx * 0.006; goal.phi = Math.min(2.5, Math.max(0.35, goal.phi - dy * 0.006));
    moved += Math.abs(dx) + Math.abs(dy);
  } else if (pointers.size === 2){
    const [a,b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinch0) goal.r = Math.min(70, Math.max(10, goal.r * pinch0 / d)); pinch0 = d; moved = 99;
  }
  lastInteract = performance.now();
});
function endPointer(e){
  if (pointers.size === 1 && moved < 6 && downAt) pick(e.clientX, e.clientY);
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => { e.preventDefault(); goal.r = Math.min(70, Math.max(10, goal.r * (1 + e.deltaY * 0.001))); lastInteract = performance.now(); }, {passive:false});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy){
  const r = canvas.getBoundingClientRect();
  ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables.filter(m => m.userData.node.obj.visible), false)[0];
  if (hit) activate(hit.object.userData.node);
}

/* ---------- 點選行為 ---------- */
let active = null;
function activate(n){
  lastInteract = performance.now();
  if (n.level === 0){
    if (root.children.some(c => c.expanded)) collapseAll();
    else if (root.expanded) collapse(root);
    else expand(root);
  } else if (n.level === 1){
    if (!root.expanded) expand(root);
    n.expanded ? collapse(n) : expand(n);
  } else {
    if (!n.strand.expanded) expand(n.strand);
  }
  n.pulse = 1;
  setActive(n); focusOn(n); showPanel(n);
}
function setActive(n){ if (active) active.el.classList.remove('active'); active = n; if (n) n.el.classList.add('active'); }

/* ---------- 動畫迴圈 ---------- */
function easeOutBack(t){ const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  frameSheet();
}
addEventListener('resize', resize); resize();

const tmp = new THREE.Vector3(), mid = new THREE.Vector3(), q0 = new THREE.Vector3();
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = reduced ? 20 : 1.6;

  if (!reduced && now - lastInteract > 5000 && !pointers.size) goal.theta += dt * 0.07;
  const k = 1 - Math.pow(0.001, dt);
  orbit.theta += (goal.theta - orbit.theta) * k;
  orbit.phi   += (goal.phi - orbit.phi) * k;
  orbit.r     += (goal.r - orbit.r) * k;
  orbit.target.lerp(goal.target, k);
  camera.position.set(
    orbit.target.x + orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    orbit.target.y + orbit.r * Math.cos(orbit.phi),
    orbit.target.z + orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
  camera.lookAt(orbit.target);

  const W = app.clientWidth, H = app.clientHeight;
  vy += (vyGoal - vy) * k;
  if (vy > 0.5) camera.setViewOffset(W, H, 0, vy, W, H);
  else if (camera.view && camera.view.enabled){ vy = 0; camera.clearViewOffset(); }
  const projScale = H / (2 * Math.tan(camera.fov * Math.PI / 360));

  for (const n of nodes){
    if (n.parent){
      if (n.wait > 0) n.wait -= dt;
      else n.t = n.goal ? Math.min(1, n.t + dt * speed) : Math.max(0, n.t - dt * speed * 1.4);
      const e = n.goal ? easeOutBack(n.t) : n.t * n.t;
      n.pos.lerpVectors(n.parent.pos, n.target, e);
    } else n.pos.copy(n.target);

    const vis = n.t > 0.003;
    n.obj.visible = vis;
    if (n.pulse > 0) n.pulse = Math.max(0, n.pulse - dt * 1.5);
    const s = Math.max(0.001, n.parent ? (n.goal ? easeOutBack(n.t) : n.t) : 1) * (1 + Math.sin((1 - n.pulse) * Math.PI) * n.pulse * 0.5);
    n.obj.position.copy(n.pos); n.obj.scale.setScalar(s);
    if (n.spin && !reduced){ n.spin.rotation.y += dt * (n.level === 0 ? 0.25 : n.level === 1 ? 0.8 : 1.2); if (n.level === 1) n.spin.rotation.z += dt * 0.3; }

    if (n.line){
      n.line.visible = vis;
      if (vis){
        const a = n.parent.pos, b = n.pos;
        mid.addVectors(a, b).multiplyScalar(0.5);
        q0.copy(mid).add(tmp.copy(mid).normalize().multiplyScalar(n.level === 1 ? 0.8 : 1.4)); q0.y += n.level === 1 ? 1.2 : 0.4;
        const arr = n.line.geometry.attributes.position.array;
        for (let i = 0; i < 24; i++){ const t = i / 23, it = 1 - t;
          arr[i*3]   = it*it*a.x + 2*it*t*q0.x + t*t*b.x;
          arr[i*3+1] = it*it*a.y + 2*it*t*q0.y + t*t*b.y;
          arr[i*3+2] = it*it*a.z + 2*it*t*q0.z + t*t*b.z; }
        n.line.geometry.attributes.position.needsUpdate = true;
        n.line.material.opacity = 0.75 * Math.min(1, n.t * 1.5);
      }
    }

    // HTML 標籤
    const el = n.el;
    if (!vis || n.t < 0.2){ el.style.opacity = 0; el.style.pointerEvents = 'none'; el.tabIndex = -1; continue; }
    tmp.copy(n.pos).project(camera);
    if (tmp.z > 1){ el.style.opacity = 0; el.style.pointerEvents = 'none'; continue; }
    const dist = camera.position.distanceTo(n.pos);
    const x = (tmp.x * 0.5 + 0.5) * W, y = (-tmp.y * 0.5 + 0.5) * H;
    const off = n.radius * s * projScale / dist + 4;
    const sc = Math.min(1.3, Math.max(0.72, 24 / dist));
    el.style.transform = `translate(${x.toFixed(1)}px,${(y + off).toFixed(1)}px) translateX(-50%) scale(${sc.toFixed(3)})`;
    el.style.opacity = (Math.min(1, (n.t - 0.2) * 2) * Math.min(1, Math.max(0.45, 1.25 - dist / 60))).toFixed(3);
    el.style.zIndex = String(Math.round(2000 - dist * 10));
    el.style.pointerEvents = 'auto'; el.tabIndex = 0;
    if (n.tog) n.tog.textContent = n.expanded ? '−' : '+';
  }

  pl.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
