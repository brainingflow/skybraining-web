<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--violet:#7C6CF0;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --accent:linear-gradient(120deg,var(--amber),var(--orange));--shadow-md:0 18px 44px rgba(21,23,49,.12);--shadow-sm:0 6px 20px rgba(21,23,49,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);text-decoration:none;}
  h1,h2,h3,.round{font-family:var(--round);}
  nav{background:var(--indigo);color:#fff;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,40px);max-width:1120px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:clamp(24px,2.8vw,28px);line-height:1.08;color:#fff;display:flex;align-items:center;gap:9px;}
  .brand .b{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .nav-in a{color:rgba(255,255,255,.85);font-size:14px;}
  /* tab bar */
  .tabs{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 clamp(12px,4vw,24px);overflow-x:auto;}
  .tabs a{font-family:var(--round);font-weight:700;font-size:14.5px;color:var(--ink-soft);padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--indigo);border-bottom-color:var(--orange);}
  .tabs a:hover{color:var(--indigo);}
  /* 課程分頁列：每個課程一個實體頁，目前頁高亮 */
  .ctabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px;}
  .ctabs a{font-family:var(--round);font-weight:700;font-size:13.5px;line-height:1;color:var(--ink-soft);background:#fff;border:1.5px solid var(--hair);border-radius:24px;padding:10px 15px;white-space:nowrap;}
  .ctabs a:hover{border-color:var(--orange);color:var(--indigo);}
  .ctabs a.on{background:var(--accent);border-color:transparent;color:#fff;}
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,34px) 16px 90px;}
  .h{margin-bottom:4px;font-family:var(--round);font-weight:800;font-size:clamp(22px,4vw,29px);color:var(--indigo);}
  .sub{color:var(--ink-soft);margin-bottom:22px;font-size:14.5px;}
  .card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px;}
  .card h2{font-size:17px;color:var(--indigo);margin-bottom:4px;display:flex;align-items:center;gap:9px;}
  .card h2 .bar{width:5px;height:19px;border-radius:3px;background:linear-gradient(var(--amber),var(--orange));}
  .card-note{color:var(--ink-soft);font-size:13px;margin:2px 0 14px;}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-sm);padding:15px;}
  .tile .k{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-bottom:5px;}
  .tile .v{font-family:var(--round);font-weight:800;font-size:24px;color:var(--indigo);line-height:1.1;}
  input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--hair);border-radius:11px;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--paper);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
  textarea{min-height:90px;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
  label{display:block;font-weight:700;font-size:13px;color:var(--indigo);margin:10px 0 6px;font-family:var(--round);}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:var(--round);font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:28px;border:none;cursor:pointer;transition:transform .2s,filter .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,#16B0A8,#0d8a83);box-shadow:0 10px 24px rgba(22,176,168,.3);}
  .btn-ghost{color:var(--indigo);background:var(--paper-2);font-size:13.5px;padding:9px 16px;}
  .btn-violet{color:#fff;background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
  .row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .filters input,.filters select{width:auto;min-width:140px;flex:0 1 auto;padding:9px 12px;font-size:13.5px;}
  .filters input.search{flex:1 1 240px;min-width:180px;}
  .msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:13.5px;display:none;white-space:pre-wrap;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(22,176,168,.12);color:var(--teal-deep);border:1px solid rgba(22,176,168,.28);}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .tbl-scroll{overflow-x:auto;margin-top:4px;max-height:560px;overflow-y:auto;border:1px solid var(--hair);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px;}
  thead th{position:sticky;top:0;background:#fff;z-index:1;}
  th,td{border-bottom:1px solid var(--hair);padding:9px 10px;text-align:left;vertical-align:middle;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap;}
  tbody tr:hover{background:var(--paper);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin:1px;white-space:nowrap;}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin:1px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap;}
  .chip.course{background:rgba(255,138,61,.13);color:#c85f1a;}
  .gate{max-width:460px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .gate h2{font-family:var(--round);font-weight:800;color:var(--indigo);font-size:22px;margin-bottom:10px;}
  .state{padding:44px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{padding:26px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  /* 頂端提醒 + 展開明細 */
  .demobar{background:linear-gradient(135deg,var(--amber),var(--orange));color:#3b2600;font-family:var(--round);font-weight:700;font-size:15px;text-align:center;padding:12px 16px;letter-spacing:.4px;box-shadow:0 6px 20px rgba(255,138,61,.35);}
  .warnbar{background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.42);color:#8a5a00;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;margin-bottom:20px;}
  .badge.st-new{background:rgba(255,176,32,.16);color:#b7791a;}
  .badge.st-go{background:rgba(124,108,240,.14);color:#4B37D8;}
  .badge.st-sent{background:rgba(22,176,168,.14);color:#0d8a83;}
  .badge.st-done{background:rgba(22,176,168,.3);color:#0a6b66;}
  .badge.st-no{background:var(--paper-2);color:var(--ink-soft);}
  /* 展開的明細會被 admin-contacts 那條 max-height:560px 切掉，這頁改成不限高 */
  .tbl-scroll{max-height:none;}
  tbody tr.rw{cursor:pointer;}
  tbody tr.rw.open{background:var(--paper-2);}
  .caret{color:var(--ink-soft);font-size:12px;white-space:nowrap;}
  tr.dt{display:none;}
  tr.dt.on{display:table-row;}
  tr.dt td{background:var(--paper);padding:16px 14px 18px;}
  .dhead{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;word-break:break-all;}
  .qa{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:4px 18px;border-top:1px solid var(--hair);padding:7px 0;}
  .qa .qn{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .qa .an{font-size:14px;color:var(--ink);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .qa .an.none{color:#c9ccd8;}
  /* 表格為了 7 欄有 min-width:720px，手機上明細會被推到畫面外，所以把明細內容收在看得到的寬度內 */
  @media(max-width:720px){.qa{grid-template-columns:1fr;}tr.dt td>*{max-width:calc(100vw - 96px);}}
  .idbtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .idbtns .path{font-size:11.5px;color:#a7abc2;word-break:break-all;}
  .edit{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-top:16px;padding-top:8px;border-top:2px solid var(--hair);}
  .edit .fld{flex:1 1 200px;min-width:180px;}
  .edit .wide{flex:2 1 320px;}
  .edit .sv{flex:0 0 auto;min-width:0;align-self:flex-end;}
  .edit textarea{min-height:76px;font-family:var(--sans);font-size:14px;}
</style>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* created_at 是 UTC，直接切字串會差 8 小時，所以轉成瀏覽器所在時區再顯示 */
  const fmtDT=(s)=>{
    if(!s) return '';
    const d=new Date(s); if(isNaN(d.getTime())) return String(s).slice(0,16).replace('T',' ');
    const p=(n)=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  };
  /* 匯出的檔會寄給別人看，不能跟著開檔那台電腦的時區跑，固定用台北時間；
     台灣 1979 年後沒有日光節約，直接 +8 小時比 Intl 在各瀏覽器上穩定 */
  const fmtTPE=(s)=>{
    if(!s) return '';
    const d=new Date(s); if(isNaN(d.getTime())) return String(s);
    const t=new Date(d.getTime()+8*3600*1000),p=(n)=>String(n).padStart(2,'0');
    return t.getUTCFullYear()+'-'+p(t.getUTCMonth()+1)+'-'+p(t.getUTCDate())+' '+p(t.getUTCHours())+':'+p(t.getUTCMinutes());
  };

  /* SheetJS 體積約 1MB，只有按下「匯出 Excel」才抓，平常開後台不多載 */
  let xlsxReady=null;
  const loadXLSX=()=>{
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(!xlsxReady) xlsxReady=new Promise((ok,bad)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload=()=>window.XLSX?ok(window.XLSX):bad(new Error('載進來了但沒有 XLSX'));
      s.onerror=()=>bad(new Error('連不到 cdn.jsdelivr.net'));
      document.head.appendChild(s);
    }).catch(e=>{ xlsxReady=null; throw e; });
    return xlsxReady;
  };
  /* JSZip 只有按「下載全部身分證」才抓，平常開後台不多載 */
  let zipReady=null;
  const loadJSZip=()=>{
    if(window.JSZip) return Promise.resolve(window.JSZip);
    if(!zipReady) zipReady=new Promise((ok,bad)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload=()=>window.JSZip?ok(window.JSZip):bad(new Error('載進來了但沒有 JSZip'));
      s.onerror=()=>bad(new Error('連不到 cdn.jsdelivr.net'));
      document.head.appendChild(s);
    }).catch(e=>{ zipReady=null; throw e; });
    return zipReady;
  };
  const today8=()=>{ const t=new Date(Date.now()+8*3600*1000),p=(n)=>String(n).padStart(2,'0');
    return ''+t.getUTCFullYear()+p(t.getUTCMonth()+1)+p(t.getUTCDate()); };
  const saveSheet=(XLSX,aoa,sheet,file,linkCols)=>{
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    (linkCols||[]).forEach(ci=>{ const tip=aoa[0][ci]==='匯款帳簿封面'?'點開匯款帳簿封面（7 天內有效）':'點開身分證影本（7 天內有效）';
      for(let ri=1;ri<aoa.length;ri++){
      const v=aoa[ri][ci];
      if(typeof v!=='string'||v.indexOf('http')!==0) continue;
      const ref=XLSX.utils.encode_cell({r:ri,c:ci});
      if(ws[ref]) ws[ref].l={Target:v,Tooltip:tip};
    }});
    /* !cols 的 wch 以半形為單位，中文一個字佔兩格；上限抓 18 個字，
       不然光題目那欄就會寬到整張表要橫捲 */
    const zi=(v)=>{ let n=0; for(const c of String(v==null?'':v)) n+=c.charCodeAt(0)<256?0.5:1; return n; };
    ws['!cols']=aoa[0].map((_,i)=>{ let m=0; for(const r of aoa){ const w=zi(r[i]); if(w>m) m=w; }
      return { wch:Math.round(Math.min(18,Math.max(6,m+1))*2) }; });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,sheet);
    XLSX.writeFile(wb,file);
  };

  // 30 題照 funv-apply.html 的順序，題目文字與表單上的一字不差
  const QS=[
    {n:1, k:'labor_insurance',  q:'「現在」有沒有保勞保?「哪個工會?電話多少?勞保開始時間?」'},
    {n:2, k:'name',             q:'名字'},
    {n:3, k:'line_id',          q:'line id（電話也可）'},
    {n:4, k:'id_number',        q:'身分證字號'},
    {n:5, k:'id_front_path',    q:'身分證正面（請拍很清楚）', side:'正面'},
    {n:6, k:'id_back_path',     q:'身分證背面（請拍很清楚）', side:'背面'},

    {n:14,k:'last_title',       q:'【最後工作】職稱、職位名稱'},
    {n:15,k:'leave_reason',     q:'退出職場背景（當初為什麼沒工作？）'},
    {n:16,k:'work_start',       q:'【最後工作時間】什麼時間「開始」這份工作?'},
    {n:17,k:'work_end',         q:'【最後工作時間】什麼時候離開工作?'},
    {n:18,k:'referrer',         q:'邀請人'},
    {n:19,k:'course_choice',    q:'【選擇課程】'},
    {n:20,k:'course_reason',    q:'選此課程原因'},
    {n:21,k:'target_job',       q:'未來想就業方向'},
    {n:22,k:'job_relevance',    q:'參加這門課對您未來就業的關聯性？'},
    {n:23,k:'after_training',   q:'結訓後您預計如何運用所學？（可多選）', multi:true},
    {n:24,k:'family_care',      q:'家庭照護需求如何解決？'},
    {n:25,k:'self_improvement', q:'在離開職場這段時間，您做過哪些自我提升？（可多選）', multi:true},
    {n:26,k:'job_search',       q:'最近是否有具體求職經驗'},
    {n:27,k:'commute_pref',     q:'理想工作條件（地點）'},
    {n:28,k:'work_hours',       q:'理想工時（選填）'},
    {n:29,k:'transport',        q:'交通工具（選填）'},
    {n:30,k:'confirmed',        q:'確認：1 先「送出表單」 2 加入Line，私信「名字+電話」 3 上課＋完成心得＋登入就業通 4 後續：有更多優質補助＋課程內容通知唷', bool:true}
  ];
  /* 這一頁只看哪一門課。七個課程頁與本頁共用同一份程式，只有 COURSE_KEY 這一行不同，'' = 全部 */
  const COURSE_KEY='style';
  const COURSE_LIST=[
    { key:'style',   kw:'整體造型設計',     name:'華君【整體造型設計】', file:'admin-funv-style.html' },
    { key:'massage', kw:'牛角筋絡調理',     name:'小可【牛角筋絡調理】',     file:'admin-funv-massage.html' },
    { key:'coffee',  kw:'手沖咖啡師',       name:'宏森【手沖咖啡師技巧班】', file:'admin-funv-coffee.html' },
    { key:'mindmap', kw:'心智圖講師班',     name:'Sky【心智圖講師班】',     file:'admin-funv-mindmap.html' },
    { key:'sales',   kw:'百億品牌成交技術', name:'信廷【百億品牌成交技術】', file:'admin-funv-sales.html' },
    { key:'aivideo', kw:'AI短影音實戰班',   name:'小語【AI短影音實戰班】', file:'admin-funv-aivideo.html' },
    { key:'rental',  kw:'包租代管實戰班',   name:'育誠【包租代管實戰班】', file:'admin-funv-rental.html' }
  ];
  const COURSE=COURSE_LIST.filter(c=>c.key===COURSE_KEY)[0]||null;
  const inCourse=(r)=>!COURSE||String(r.course_choice||'').indexOf(COURSE.kw)>=0;
  const STATUS=['new','聯絡中','已送件','完成','不符'];
  const ST_CLASS={'new':'st-new','聯絡中':'st-go','已送件':'st-sent','完成':'st-done','不符':'st-no'};

  /* ?demo=1：給老闆看版面用。不登入、不打 Supabase，資料全是假的。
     也吃 #demo=1，因為本機 npx serve 會把 /admin-funv.html 301 到 /admin-funv 並把 query 丟掉，hash 才留得住 */
  const DEMO=new URLSearchParams(location.search).get('demo')==='1' || /(^|[#&])demo=?1?([&]|$)/.test(location.hash);

    const badge=(st)=>{
      const s=st||'new';

    };
    const answer=(r,qq)=>{
      if(qq.bool) return r[qq.k]===true?'是':'否';
      const v=r[qq.k];
      if(qq.multi) return (v&&v.length)?v.join('\n'):'';
      return v==null?'':String(v);
    };
    const show=(el,txt,type)=>{ el.className='msg e-msg show '+type; el.textContent=txt; };

    /* 身分證在私有 bucket，只能發簽名網址：匯出給別人看的給 7 天，站內下載 60 秒就夠 */
    const IDCOLS=[{k:'id_front_path',side:'正面',t:'身分證正面連結'},{k:'id_back_path',side:'背面',t:'身分證背面連結'},{k:'passbook_path',side:'匯款帳簿封面',t:'匯款帳簿封面',emptyText:''}];
    const extOf=(p)=>{ const m=/\.[a-zA-Z0-9]+$/.exec(String(p||'')); return m?m[0].toLowerCase():'.jpg'; };
    const safeName=(v)=>{ const t=String(v==null?'':v).replace(/[\\/:*?"<>|]/g,'_').trim(); return t||'未填'; };
    const signOne=async (path,sec)=>{
      const { data, error } = await supabase.storage.from('funv-ids').createSignedUrl(path,sec);
      if(error||!data||!data.signedUrl) throw new Error((error&&error.message)||'沒拿到網址');
      return data.signedUrl;
    };
    const idPaths=(rs)=>{ const out=[]; rs.forEach(r=>IDCOLS.forEach(c=>{ if(r[c.k]) out.push(r[c.k]); })); return out; };
    const signMany=async (paths,msgEl,label)=>{
      const map={};
      for(let i=0;i<paths.length;i++){
        msgEl.className='msg show'; msgEl.textContent=label+' '+(i+1)+'/'+paths.length+'…';
        try{ map[paths[i]]=await signOne(paths[i],604800); }catch(e){ map[paths[i]]=''; }
      }
      return map;
    };
    const idCell=(map,r,c)=>{ const p=r[c.k]; if(!p) return c.emptyText!=null?c.emptyText:'（沒有檔案）'; if(DEMO) return '示範模式無圖'; return map[p]||'（連結產生失敗）'; };

    const qaRow=(r,qq)=>{

        const t=answer(r,qq);
        an = t ? `<div class="an">${esc(t)}</div>` : '<div class="an none">（未填）</div>';
      }
      return `<div class="qa"><div class="qn">${qq.n}. ${esc(qq.q)}</div><div>${an}</div></div>`;

    /* 匯款帳簿封面：身分證正反面（第 5、6 題）之後多一格，選填，不算在 30 題編號裡；

    /* 身分證在私有 bucket，前端拿不到直接網址，只能要一張 5 分鐘的簽名網址 */
    const openId=async (btn,msgEl)=>{

      btn.disabled=true;

      if(error||!data||!data.signedUrl){

        msgEl.className='msg e-msg show error';
        msgEl.innerHTML=`瀏覽器擋住新分頁，<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">點這裡開啟身分證${esc(btn.getAttribute('data-side'))}</a>（連結 5 分鐘內有效）。`;

      const old=btn.textContent; btn.disabled=true; btn.textContent='下載中…';

        const res=await fetch(await signOne(path,60));

    const save=async (r,td)=>{
      const st=td.querySelector('.e-st').value;

      const msgEl=td.querySelector('.e-msg');
      const btn=td.querySelector('.e-save');

        return;
      }
      btn.disabled=true; show(msgEl,'儲存中…','ok');
      /* 被 RLS 擋掉的 update 在 PostgREST 不會報錯，只是零列生效，
         所以一律用 .select() 把真的被改到的列要回來數，數不到就照實說。 */
      const { data, error } = await supabase.from('funv_applications')
        .update({ status:st, note:note||null }).eq('id',r.id).select('id');
      btn.disabled=false;
      if(error){
        const m=error.message||'';
        show(msgEl,'存不起來：'+m+(m.indexOf('note')>=0?'\n（備註欄位還沒建：請到 Supabase SQL Editor 重跑 supabase/sql/funv_applications.sql）':''),'error');
        return;
      }
      if(!(data||[]).length){
        show(msgEl,'沒有存到任何一列。多半是資料庫政策（RLS）擋掉了，這種情況 PostgREST 不會報錯。確認一下登入的帳號 is_admin 是不是 true。','error');
        return;

    };

    const toggle=(id)=>{
      const tr=document.querySelector('tr.rw[data-id="'+id+'"]');
      const dt=document.querySelector('tr.dt[data-id="'+id+'"]');
      if(!tr||!dt) return;
      if(dt.classList.contains('on')){
        dt.classList.remove('on'); tr.classList.remove('open');
        tr.querySelector('.caret').textContent='看明細 ▾';
        return;
      }
      if(!dt.getAttribute('data-built')){
        const r=rows.find(x=>x.id===id); if(!r) return;
        const td=dt.querySelector('td');
        td.innerHTML=detailHtml(r);
        dt.setAttribute('data-built','1');
        const msgEl=td.querySelector('.e-msg');
        td.querySelectorAll('.idbtn').forEach(b=>b.onclick=()=>openId(b,msgEl));
        td.querySelectorAll('.iddl').forEach(b=>b.onclick=()=>dlId(b,r,msgEl));
        td.querySelectorAll('.pbopen').forEach(b=>b.onclick=()=>openPassbook(b,msgEl));
        td.querySelectorAll('.pbdl').forEach(b=>b.onclick=()=>dlPassbook(b,r,msgEl));
        td.querySelector('.e-save').onclick=()=>save(r,td);
      }
      dt.classList.add('on'); tr.classList.add('open');
      tr.querySelector('.caret').textContent='收起 ▴';
    };

    const renderTable=()=>{
      $('cnt').textContent=view.length;
      const box=$('tblWrap');
      if(!view.length){ box.innerHTML='<div class="empty">沒有符合的報名表。</div>'; return; }
      box.innerHTML=`<div class="tbl-scroll"><table>
        <thead><tr><th>申請時間</th><th>名字</th><th>手機</th><th>選課</th><th>狀態</th><th>邀請人</th><th></th></tr></thead>
        <tbody>${view.map(r=>`<tr class="rw" data-id="${esc(r.id)}">
          <td style="white-space:nowrap;color:var(--ink-soft);">${esc(fmtDT(r.created_at))}</td>
          <td style="font-weight:500;color:var(--indigo);">${esc(r.name||'')}</td>
          <td style="white-space:nowrap;">${esc(r.mobile||'')}</td>
          <td>${r.course_choice?`<span class="chip course">${esc(r.course_choice)}</span>`:'<span style="color:#c9ccd8;">—</span>'}</td>
          <td class="st-cell">${badge(r.status)}</td>
          <td>${esc(r.referrer||'')}</td>
          <td class="caret">看明細 ▾</td>
        </tr>
        <tr class="dt" data-id="${esc(r.id)}"><td colspan="7"></td></tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('tr.rw').forEach(tr=>tr.onclick=()=>toggle(tr.getAttribute('data-id')));
    };

    const applyFilters=()=>{
      const q=$('fSearch').value.trim().toLowerCase();
      const st=$('fStatus').value;
      view=rows.filter(r=>{
        if(q && !((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q)) return false;
        if(st && (r.status||'new')!==st) return false;
        return true;
      });
      renderTable();
    };

    // ── 匯出目前篩選結果，欄位順序照 30 題 ──
    $('btnExport').onclick=async ()=>{
      const btn=$('btnExport'), msgEl=$('xlsxMsg'), old=btn.textContent;
      btn.disabled=true; msgEl.className='msg'; msgEl.textContent='';
      const map=DEMO?{}:await signMany(idPaths(view),msgEl,'產生連結中');
      const q=(v)=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; };
      const head=QS.map(qq=>qq.n+'. '+qq.q).concat(IDCOLS.map(c=>c.t));
      const lines=[head.map(q).join(',')].concat(view.map(r=>QS.map(qq=>{
        if(qq.bool) return r[qq.k]===true?'是':'否';
        const v=r[qq.k];
        if(qq.multi) return (v||[]).join(' / ');
        return v==null?'':String(v);
      }).concat(IDCOLS.map(c=>idCell(map,r,c))).map(q).join(',')));
      const csv='﻿'+lines.join('\r\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      a.download='強腦力-婦女再就業報名'+(COURSE?'-'+COURSE.name:'')+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
      msgEl.className='msg'; msgEl.textContent=''; btn.disabled=false; btn.textContent=old;
    };

    // ── 匯出 Excel：同一批篩選結果，30 題後面再接申請編號／申請時間／狀態／備註 ──
    const xlsxRows=(map)=>{
      const head=QS.map(qq=>qq.n+'. '+qq.q).concat(['申請編號','申請時間','狀態','備註']).concat(IDCOLS.map(c=>c.t));
      return [head].concat(view.map(r=>QS.map(qq=>{
        if(qq.bool) return r[qq.k]===true?'是':'否';
        const v=r[qq.k];
        if(qq.multi) return (v||[]).join('、');
        return v==null?'':String(v);
      }).concat([
        String(r.id==null?'':r.id),
        fmtTPE(r.created_at),
        String(r.status||'new'),
        r.note==null?'':String(r.note)
      ]).concat(IDCOLS.map(c=>idCell(map,r,c)))));
    };
    $('btnExportXlsx').onclick=async ()=>{
      const btn=$('btnExportXlsx'), msgEl=$('xlsxMsg');
      btn.disabled=true; btn.textContent='產生中…'; msgEl.className='msg'; msgEl.textContent='';
      try{
        const XLSX=await loadXLSX();
        const map=DEMO?{}:await signMany(idPaths(view),msgEl,'產生連結中');
        const aoa=xlsxRows(map);
        const n=aoa[0].length;
        saveSheet(XLSX,aoa,'報名資料','婦女再就業報名'+(COURSE?'_'+COURSE.name:'')+'_'+today8()+'.xlsx',[n-3,n-2,n-1]);
        msgEl.className='msg'; msgEl.textContent='';
      }catch(e){
        msgEl.className='msg show error';
        msgEl.textContent='Excel 元件載入失敗（'+(e.message||e)+'）。請改按「匯出 CSV」，Excel 一樣打得開。';
      }
      btn.disabled=false; btn.textContent='⬇ 匯出 Excel';
    };

    // ── 下載全部身分證：目前篩選結果，一人一個資料夾 ──
    $('btnZip').onclick=async ()=>{
      const btn=$('btnZip'), msgEl=$('xlsxMsg'), old=btn.textContent;
      if(!view.length){ msgEl.className='msg show error'; msgEl.textContent='目前篩選結果是 0 筆，沒有東西可以打包。'; return; }
      btn.disabled=true; msgEl.className='msg show'; msgEl.textContent='準備中…';
      try{
        const JSZip=await loadJSZip();
        const zip=new JSZip();
        const fails=[];
        let done=0, okCount=0;
        if(DEMO){
          zip.file('說明.txt','示範模式：這是假資料，沒有真的身分證檔案。\r\n正式登入後這顆按鈕會把目前篩選到的每個人的身分證正反面打包，一人一個資料夾（名字_手機）。\r\n目前篩選到 '+view.length+' 筆。');
        }else{
          const total=view.reduce((n,r)=>n+IDCOLS.filter(c=>r[c.k]).length,0);
          for(const r of view){
            const folder=safeName(r.name)+'_'+safeName(r.mobile);
            for(const c of IDCOLS){
              const p=r[c.k]; if(!p) continue;
              const label=c.k==='passbook_path'?'匯款帳簿封面':('身分證'+c.side);
              const fname=c.k==='passbook_path'?(safeName(r.name)+'_匯款帳簿封面'+extOf(p)):(label+extOf(p));
              btn.textContent='打包中 '+(done+1)+'/'+total+'…';
              msgEl.textContent='打包中 '+(done+1)+'/'+total+'…';
              try{
                const res=await fetch(await signOne(p,60));
                if(!res.ok) throw new Error('HTTP '+res.status);
                zip.folder(folder).file(fname,await res.blob());
                okCount++;
              }catch(e){ fails.push(safeName(r.name)+' 的'+label+'：'+(e.message||e)); }
              done++;
            }
          }
          if(fails.length) zip.file('抓不到的檔案.txt',fails.join('\r\n'));
        }
        /* 身分證已經是 JPEG，再壓一次只是白燒 CPU，直接 STORE */
        const blob=await zip.generateAsync({type:'blob',compression:'STORE'},m=>{
          btn.textContent='壓縮中 '+Math.round(m.percent)+'%';
          msgEl.textContent='壓縮中 '+Math.round(m.percent)+'%';
        });
        const fn='婦女再就業_身分證_'+(COURSE?COURSE.name:'全部')+'_'+today8()+'.zip';
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn;
        document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
        if(DEMO){ msgEl.className='msg show'; msgEl.textContent='已下載 '+fn+'（示範模式，裡面只有一份說明.txt）。'; }
        else if(fails.length){ msgEl.className='msg show error'; msgEl.textContent='已下載 '+fn+'，成功 '+okCount+' 張，這幾張抓不到（也寫在 ZIP 裡的「抓不到的檔案.txt」）：\n'+fails.join('\n'); }
        else { msgEl.className='msg show'; msgEl.textContent='已下載 '+fn+'，共 '+okCount+' 張、'+view.length+' 個人。'; }
      }catch(e){
        msgEl.className='msg show error';
        msgEl.textContent='打包失敗（'+(e.message||e)+'）。如果寫的是連不到 cdn.jsdelivr.net，請檢查網路後再試一次。';
      }
      btn.disabled=false; btn.textContent=old;
    };

    ['fSearch','fStatus'].forEach(id=>$(id).addEventListener('input',applyFilters));

    const load=async ()=>{
      $('tblWrap').innerHTML='<div class="state"><div class="spin"></div>載入報名表中…</div>';
      if(DEMO){ rows=DEMO_ROWS.filter(inCourse).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')); applyFilters(); return; }
      let qy=supabase.from('funv_applications').select('*');
      if(COURSE) qy=qy.ilike('course_choice','%'+COURSE.kw+'%');
      const { data, error } = await qy.order('created_at',{ascending:false});
      if(error){ $('tblWrap').innerHTML='<div class="empty" style="color:var(--err);">讀取失敗：'+esc(error.message)+'</div>'; return; }
      rows=data||[];
      applyFilters();
    };
    load();
  })();
</script>
