<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安全結帳 — 強腦力 SkyBraining</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#151731;--paper:#FAF9F5;--paper-2:#F2F0E8;--ink:#1B1D33;--ink-soft:#5b5f7a;
    --amber:#FFB020;--orange:#FF8A3D;--teal:#16B0A8;--teal-deep:#0d8a83;--err:#d64545;
    --hair:rgba(21,23,49,.1);--sans:"Noto Sans TC",sans-serif;--round:"Baloo 2","Noto Sans TC",sans-serif;
    --sh-sm:0 6px 20px rgba(21,23,49,.06);--sh-md:0 18px 44px rgba(21,23,49,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  nav{background:rgba(250,249,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(20px,5vw,40px);max-width:1060px;margin:0 auto;}
  .brand{font-family:var(--round);font-weight:800;font-size:20px;color:var(--indigo);}
  .wm-accent{background:linear-gradient(120deg,#FFB020,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav-right a{color:var(--ink-soft);font-size:14px;font-weight:500;}
  .wrap{max-width:640px;margin:0 auto;padding:30px clamp(18px,5vw,40px) 80px;}
  .steps{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 26px;font-family:var(--round);font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .steps b{color:var(--teal-deep);}
  .steps .arr{color:rgba(21,23,49,.25);}
  .card{background:#fff;border:1px solid var(--hair);border-radius:22px;box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:18px;}
  .ctop{padding:22px 24px;color:#fff;position:relative;overflow:hidden;}
  .ctop::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);}
  .ctop .tag{display:inline-block;font-family:var(--round);font-weight:700;font-size:12px;background:rgba(255,255,255,.22);padding:3px 11px;border-radius:20px;}
  .ctop h1{font-family:var(--round);font-weight:800;font-size:23px;margin-top:9px;position:relative;z-index:1;}
  .ctop .sub{font-size:13px;opacity:.92;position:relative;z-index:1;}
  .cbody{padding:20px 24px;}
  .prow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:14.5px;color:var(--ink-soft);}
  .prow.total{border-top:1.5px dashed var(--hair);margin-top:6px;padding-top:14px;color:var(--indigo);font-weight:700;}
  .prow.total .amt{font-family:var(--round);font-weight:800;font-size:28px;color:var(--indigo);}
  .h2{font-family:var(--round);font-weight:800;font-size:16.5px;color:var(--indigo);margin:22px 0 12px;}
  .pay-btn{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--hair);border-radius:18px;padding:16px 18px;cursor:pointer;text-align:left;font-family:var(--sans);transition:border-color .2s,transform .2s,box-shadow .2s;margin-bottom:12px;}
  .pay-btn:hover:not(:disabled){border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--sh-md);}
  .pay-btn:disabled{opacity:.55;cursor:not-allowed;}
  .pay-btn .ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;}
  .pay-btn .ic.tw{background:rgba(22,176,168,.13);}
  .pay-btn .ic.gl{background:rgba(124,108,240,.13);}
  .pay-btn b{display:block;font-family:var(--round);font-size:16px;color:var(--indigo);}
  .pay-btn small{font-size:12.5px;color:var(--ink-soft);}
  .pay-btn .soon{margin-left:auto;flex:none;font-family:var(--round);font-weight:700;font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);padding:4px 11px;border-radius:14px;}
  .pay-btn .go{margin-left:auto;flex:none;font-family:var(--round);font-weight:800;color:var(--teal-deep);}
  .safe{display:flex;gap:10px;align-items:flex-start;background:rgba(22,176,168,.08);border:1px solid rgba(22,176,168,.22);border-radius:14px;padding:13px 16px;font-size:12.5px;color:var(--teal-deep);line-height:1.7;margin-top:6px;}
  .legal{font-size:11.5px;color:var(--ink-soft);line-height:1.8;margin-top:16px;}
  .legal a{color:var(--teal-deep);}
  .msg{margin-top:14px;padding:12px 15px;border-radius:12px;font-size:13.5px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:rgba(214,69,69,.1);color:var(--err);border:1px solid rgba(214,69,69,.25);}
  .msg.info{background:rgba(255,176,32,.12);color:#8a5c00;border:1px solid rgba(255,176,32,.3);}
  .state{padding:80px 0;text-align:center;color:var(--ink-soft);}
  .spin{width:32px;height:32px;border:3px solid var(--hair);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .amber{background:linear-gradient(135deg,#FFB020,#FF8A3D);} .teal{background:linear-gradient(135deg,#16B0A8,#0d8a83);}
  .violet{background:linear-gradient(135deg,#7C6CF0,#4B37D8);} .indigo{background:linear-gradient(135deg,#22264f,#141330);}
  .rose{background:linear-gradient(135deg,#FF6B8B,#E23A63);} .gold{background:linear-gradient(135deg,#F5A623,#E0761B);}
  .grape{background:linear-gradient(135deg,#8E5BEE,#5B2AC6);} .free{background:linear-gradient(135deg,#7C6CF0,#4B37D8);}
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="brand" href="index.html">強<span class="wm-accent">腦</span>力</a>
    <div class="nav-right"><a href="member.html">我的課程</a></div>
  </div>
</nav>

<div class="wrap">
  <div class="steps"><b>① 確認訂單</b><span class="arr">→</span><span>② 安全付款</span><span class="arr">→</span><span>③ 立即上課</span></div>
  <div id="content"><div class="state"><div class="spin"></div>載入訂單中…</div></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL='https://gfuqizxzihgydzyqywun.supabase.co';
  const SUPABASE_ANON='sb_publishable_4OkL-CDoS542x8odCTWbtQ_DzKR7dMv';
  const supabase=createClient(SUPABASE_URL,SUPABASE_ANON);
  const $=(id)=>document.getElementById(id);
  const FN=SUPABASE_URL+'/functions/v1/pay-create';
  const qs=new URLSearchParams(location.search);
  const courseId=qs.get('course');
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  (async ()=>{
    if(!courseId){ $('content').innerHTML='<div class="state">缺少課程參數。<br><a href="courses.html" style="color:var(--teal-deep);">← 回精品課程</a></div>'; return; }
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ location.href='login.html?next='+encodeURIComponent(location.href); return; }

    const { data:course } = await supabase.from('courses').select('*').eq('id',courseId).maybeSingle();
    if(!course){ $('content').innerHTML='<div class="state">找不到這門課程。<br><a href="courses.html" style="color:var(--teal-deep);">← 回精品課程</a></div>'; return; }
    if(course.category==='career'){ location.href=course.intro_url||'courses.html#pro'; return; }
    if((course.price||0)===0){ location.href='watch.html?course='+encodeURIComponent(courseId); return; }

    // 已擁有 → 直接去上課
    const { data:owned } = await supabase.rpc('member_owns_course',{ p_course_id: courseId });
    if(owned===true){ location.href='watch.html?course='+encodeURIComponent(courseId); return; }

    // 金流開通狀態
    let cfg={stripe:false,payuni:false};
    try{ const r=await fetch(FN+'?action=config'); cfg=await r.json(); }catch(e){}

    const color=['amber','teal','violet','indigo','rose','gold','grape','free'].includes(course.accent)?course.accent:'amber';
    const priceTxt='NT$'+Number(course.price).toLocaleString();
    const ONSITE=['onsite-basic','onsite-advanced'];
    const isOnsite=ONSITE.includes(courseId), isBundle=courseId==='bundle-all';
    const safeTxt = isOnsite
      ? '付款在 <b>Stripe／統一集團</b> 的加密頁面完成，卡號不會經過本網站。付款成功即為<b>保留名額</b>，我們會在 1 個工作天內用 LINE 與你聯繫，確認最近梯次與上課地點'
      : isBundle
      ? '付款在 <b>Stripe／統一集團</b> 的加密頁面完成，卡號不會經過本網站。付款成功後<b>線上課立即開通</b>，實體梯次與一對一輔導由專人在 1 個工作天內用 LINE 與你約定'
      : '付款在 <b>Stripe／統一集團</b> 的加密頁面完成，卡號不會經過本網站。付款成功後系統<b>自動開通課程</b>，馬上就能上課';
    const legalTxt = isOnsite
      ? '本課程為高雄實體小班課，線上付款即為保留名額；若梯次無法配合可免費改期或全額退費。付款成功後自動開立電子發票寄至你的 email。'
      : isBundle
      ? '本方案含線上數位影音內容，屬「一經提供即完成之數位內容」，開通後不適用七日無條件退費；實體梯次與輔導若無法配合可免費改期。付款成功後自動開立電子發票寄至你的 email。'
      : '本課程為線上數位影音內容，屬「一經提供即完成之數位內容」，結帳即表示同意排除七天猶豫期。付款成功後自動開立電子發票寄至你的 email。';
    $('content').innerHTML=`
      <div class="card">
        <div class="ctop ${color}">
          <span class="tag">線上課程・買斷永久觀看</span>
          <h1>${esc(course.name)}</h1>
          <div class="sub">${esc(course.subtitle||'')}</div>
        </div>
        <div class="cbody">
          <div class="prow"><span>課程費用</span><span>${priceTxt}</span></div>
          <div class="prow"><span>觀看期限</span><span>永久・不限次數</span></div>
          <div class="prow total"><span>應付金額</span><span class="amt">${priceTxt}</span></div>

          <div class="h2">選擇付款方式</div>
          <button class="pay-btn" id="btnPayuni" ${cfg.payuni?'':'disabled'}>
            <span class="ic tw">💳</span>
            <span><b>統一金流 PAYUNi</b><small>信用卡・ATM 轉帳・超商代碼・行動支付</small></span>
            ${cfg.payuni?'<span class="go">→</span>':'<span class="soon">申請開通中</span>'}
          </button>
          <button class="pay-btn" id="btnStripe" ${cfg.stripe?'':'disabled'}>
            <span class="ic gl">🌍</span>
            <span><b>國際信用卡（Stripe）</b><small>Visa・Mastercard・AmEx・Apple Pay/Google Pay</small></span>
            ${cfg.stripe?'<span class="go">→</span>':'<span class="soon">即將開放</span>'}
          </button>

          <div class="safe">🔒 <span>${safeTxt}</span></div>
          <div class="msg" id="payMsg"></div>
          <div class="legal">${legalTxt}詳見 <a href="refund.html">退款政策</a>・<a href="terms.html">服務條款</a>。遇到問題？<a href="https://lin.ee/9EGO8IT" target="_blank" rel="noopener">加 LINE 由真人協助</a></div>
        </div>
      </div>`;

    if(qs.get('canceled')==='1'){ const m=$('payMsg'); m.className='msg show info'; m.textContent='已取消付款。想好了隨時可以再按一次，訂單不會重複扣款'; }

    const pay=async (provider,btn)=>{
      const m=$('payMsg'); m.className='msg'; btn.disabled=true;
      const old=btn.querySelector('b').textContent; btn.querySelector('b').textContent='建立安全連線中…';
      try{
        const r=await fetch(FN,{ method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token, 'apikey':SUPABASE_ANON },
          body:JSON.stringify({ course_id:courseId, provider }) });
        const j=await r.json();
        if(!j.ok) throw new Error(j.error||('錯誤 '+r.status));
        if(j.redirect){ location.href=j.redirect; return; }
        if(j.form){
          const f=document.createElement('form'); f.method='POST'; f.action=j.form.action;
          Object.entries(j.form.fields).forEach(([k,v])=>{ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=v; f.appendChild(i); });
          document.body.appendChild(f); f.submit(); return;
        }
        throw new Error('金流回應異常');
      }catch(e){
        btn.disabled=false; btn.querySelector('b').textContent=old;
        m.className='msg show error'; m.textContent='✗ '+e.message;
      }
    };
    if(cfg.payuni) $('btnPayuni').onclick=()=>pay('payuni',$('btnPayuni'));
    if(cfg.stripe) $('btnStripe').onclick=()=>pay('stripe',$('btnStripe'));
  })();
</script>
<div style="text-align:center;padding:26px 14px 30px;font-size:12.5px;color:#8b90a5;">© 2021 強腦力 SkyBraining LLC・skybraining.com・Sky強腦力media</div>
</body>
</html>
