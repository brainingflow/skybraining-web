軟弱上顯得完全。","explain":"對手誇自己的能力，保羅卻誇自己的軟弱。瓦器裡的寶貝和肉體中的刺，都在說明能力是出於神，不是出於人。","ref":"林後 4:7；12:9–10"},{"key":"叫人活的職分","point":"新約的服事帶來生命與榮光，比摩西的更大。","explain":"保羅拿摩西帶著帕子的臉和新約作對照，說字句是叫人死，精意是叫人活；服事新約的人是敞著臉看見主的榮光。","ref":"林後 3:1–18"},{"key":"勸人與神和好","point":"神藉著基督叫人與自己和好。","explain":"保羅說若有人在基督裡，他就是新造的人；神又把勸人和好的職分交給使徒，所以他們作基督的使者。","ref":"林後 5:17–21"},{"key":"樂意的捐輸","point":"捐獻要出於甘心，不是勉強。","explain":"8～9 章保羅為耶路撒冷的窮信徒籌款，舉馬其頓教會在極窮之中仍樂意捐助為例，並說捐得樂意的人是神所喜愛的。","ref":"林後 8～9"},{"key":"真使徒記號","point":"真使徒的記號是忍耐與受苦，不是誇口。","explain":"面對那些自認是「最大的使徒」的人，保羅不得已像說愚妄話一樣誇口，列出來的卻是被打、下監、船壞、危險，以及為眾教會掛心。","ref":"林後 10～13"}],"outline":[{"key":"安慰與改期","range":"1:1～2:13","point":"從患難中的安慰說起，解釋為什麼改變行程沒有去哥林多。"},{"key":"使徒的服事","range":"2:14～5:21","point":"新約職分的榮光、瓦器裡的寶貝、勸人與神和好。"},{"key":"敞開心門","range":"6:1～7:16","point":"請教會向他敞開心，並為提多帶來的悔改消息歡喜。"},{"key":"為聖徒捐款","range":"8～9 章","point":"為耶路撒冷的窮信徒籌款，勸信徒甘心樂意地捐。"},{"key":"辯護與警告","range":"10～13 章","point":"回應攻擊他的人，述說自己的苦難和軟弱，預告第三次去哥林多。"}],"stories":[{"key":"寫信緣由","title":"寫哥林多後書的故事","ref":"林後 2:1–13；7:5–16","summary":"寫完前書後，保羅不想再帶著憂愁去哥林多，先在多多流淚中寫了一封信，並派提多前往。他在特羅亞等不到提多、心裡不安，就往馬其頓去，終於在那裡遇見提多，得知教會已經憂傷悔改。於是他在馬其頓寫下這封信，前面表達釋懷與安慰，中間處理捐款，後面回應攻擊他的人。","people":["paul","titus","timothy"]},{"key":"瓦器寶貝","title":"瓦器裡的寶貝（4 章）","ref":"林後 4:1–18","summary":"保羅說他們傳的不是自己，是基督耶穌；這寶貝放在瓦器裡，是要顯明莫大的能力出於神。所以他們四面受敵卻不被困住，心裡作難卻不至失望，外體雖然毀壞，內心卻一天新似一天。","people":["paul"]},{"key":"苦難清單","title":"保羅的苦難清單（11 章）","ref":"林後 11:16–33","summary":"為了回應誇口的對手，保羅列出自己的經歷：被猶太人鞭打五次、每次四十減去一下，被棍打三次，被石頭打一次，遇著船壞三次，一晝一夜在深海裡。最後他提到在大馬士革，亞哩達王手下的提督把守大馬士革城要捉拿他，他是坐在筐子裡從城牆的窗戶被人縋下去才逃脫的。","people":["paul"],"note":"在城門守候的細節記在使徒行傳 9:24：「他們又晝夜在城門守候，要殺他」。"},{"key":"肉體中的刺","title":"肉體中的刺（12 章）","ref":"林後 12:1–10","summary":"保羅提到十四年前被提到第三層天上的經歷，但說他寧可誇自己的軟弱。為了怕他因啟示甚大而過於自高，有一根刺加在他肉體上；他三次求主叫這刺離開，主卻對他說「我的恩典夠你用的」。這根刺究竟是什麼，信中沒有說明。","people":["paul"]}],"people":["paul","timothy","titus","silas"],"verses":[{"ref":"林後 4:7","text":"我們有這寶貝放在瓦器裡，要顯明這莫大的能力是出於神，不是出於我們。"},{"ref":"林後 5:17","text":"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"},{"ref":"林後 12:9","text":"他對我說：「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。"}]}},{"t":"nt","id":"galatians","order":9,"name":"加拉太書","abbr":"加","chapters":6,"group":"保羅書信","data":{"id":"galatians","order":9,"name":"加拉太書","abbr":"加","chapters":6,"group":"保羅書信","oneLine":"保羅力辯：人稱義是因信基督，不靠守律法","background":{"author":"保羅","date":"約主後 48～57 年（依收信地區看法不同而定）","audience":"加拉太的眾教會","place":"不確定，可能在安提阿、以弗所或馬其頓","why":"保羅離開後，有人到加拉太教導外邦信徒必須受割禮、守摩西律法，還質疑保羅不是真使徒。保羅聽說信徒這麼快就轉去從別的福音，寫下這封語氣強烈的信。收信的是加拉太省南部還是北部的教會，學界有不同看法。"},"revelations":[{"key":"獨一福音","point":"福音只有一個，不能再加上別的條件。","explain":"保羅開頭沒有照慣例感謝，直接說若有人傳別的福音就應當被咒詛。他強調他傳的福音不是出於人，是從耶穌基督啟示來的。","ref":"加 1:6–12"},{"key":"因信稱義","point":"人稱義是因信耶穌基督，不是因行律法。","explain":"保羅說連他和磯法這些生來的猶太人，也知道人稱義不是因行律法，乃是因信耶穌基督；他也用亞伯拉罕信神就算為他的義作證。","ref":"加 2:15–16；3:6–9"},{"key":"律法的功用","point":"律法像訓蒙的師傅，把人帶到基督那裡。","explain":"保羅說律法是在應許之後四百三十年才有的，不能把應許廢掉；律法是訓蒙的師傅，信既然來到，就不在師傅的手下了。","ref":"加 3:15–25"},{"key":"在基督裡為一","point":"在基督裡不分種族、身分、性別。","explain":"保羅說信的人都是神的兒子，不再分猶太人、希臘人，自主的、為奴的，或男或女。這直接回應了外邦信徒要不要先成為猶太人的爭論。","ref":"加 3:26–29"},{"key":"真正的自由","point":"基督釋放人得自由，自由要用愛心服事。","explain":"保羅勸信徒站立得穩，不要再被奴僕的軛挾制；但也不可把自由當作放縱情慾的機會，總要用愛心互相服事。","ref":"加 5:1–15"},{"key":"順著聖靈","point":"順著聖靈而行，生命就結出聖靈的果子。","explain":"保羅把情慾的事和聖靈的果子並排列出來，說靠聖靈得生的人，也要靠聖靈行事。","ref":"加 5:16–26"}],"outline":[{"key":"開場責備","range":"1:1–10","point":"保羅驚訝信徒這麼快轉去從別的福音。"},{"key":"使徒自述","range":"1:11～2:21","point":"保羅說明自己的福音和使徒身分是從神來的，並在安提阿當面抵擋磯法。"},{"key":"信與律法","range":"3～4 章","point":"用亞伯拉罕、律法與應許、夏甲與自主婦人的比喻，說明因信稱義。"},{"key":"自由的生活","range":"5:1～6:10","point":"在自由裡用愛心服事，順著聖靈而行，互相擔當重擔。"},{"key":"親筆結語","range":"6:11–18","point":"保羅親手寫大字作結，重申要緊的是作新造的人。"}],"stories":[{"key":"寫信緣由","title":"寫加拉太書的故事","ref":"加 1:6–9；4:12–20","summary":"加拉太在小亞細亞中部（今土耳其），是羅馬的一個省；保羅說他頭一次在那裡傳福音，是因為身體有疾病，信徒卻把他當作神的使者接待。後來有人進來教導外邦信徒要受割禮、守律法，信徒動搖了，保羅寫信強力反駁。收信的是保羅第一次旅行走過的南部城市（彼西底的安提阿、以哥念、路司得、特庇），還是北部地區，學界有不同看法。","people":["paul"]},{"key":"蒙召經過","title":"從逼迫者到使徒","ref":"加 1:11～2:10","summary":"保羅說自己從前極力逼迫教會，後來神樂意將他兒子啟示在他心裡。他先往阿拉伯去，又回到大馬士革，過了三年才上耶路撒冷見磯法，住了十五天；過了十四年，他和巴拿巴帶著提多再上耶路撒冷，雅各、磯法、約翰向他們行右手相交之禮。","people":["paul","peter","james-brother","john","barnabas","titus"]},{"key":"當面抵擋","title":"在安提阿當面抵擋磯法","ref":"加 2:11–21","summary":"磯法在安提阿本來和外邦信徒一起吃飯，但從雅各那裡來的人一到，他因為怕奉割禮的人就退去，其餘的猶太信徒連巴拿巴也跟著裝假。保羅當著眾人的面抵擋他，說人稱義不是因行律法，乃是因信耶穌基督。","people":["paul","peter","barnabas","james-brother"]},{"key":"聖靈的果子","title":"情慾的事與聖靈的果子（5 章）","ref":"加 5:16–26","summary":"保羅說情慾和聖靈彼此相爭，列出姦淫、拜偶像、仇恨、嫉妒、醉酒等情慾的事。相對地，聖靈所結的果子是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。","people":["paul"]}],"people":["paul","peter","barnabas","james-brother","john","titus"],"verses":[{"ref":"加 2:20","text":"我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。"},{"ref":"加 5:22–23","text":"聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。"}]}},{"t":"nt","id":"ephesians","order":10,"name":"以弗所書","abbr":"弗","chapters":6,"group":"保羅書信","data":{"id":"ephesians","order":10,"name":"以弗所書","abbr":"弗","chapters":6,"group":"保羅書信","oneLine":"教會是基督的身體：在恩典裡合一，穿上全副軍裝","background":{"author":"傳統上認為是保羅在監中所寫，也有不同看法","date":"約主後 60～62 年（若為保羅在羅馬被囚時所寫）","audience":"以弗所的信徒；有些古抄本沒有「在以弗所」幾個字，可能也是給亞細亞各教會傳閱的信","place":"在監獄中；不確定，傳統上認為在羅馬","why":"以弗所是亞細亞省的大港城，有著名的亞底米神廟。百基拉、亞居拉和亞波羅都曾在這裡服事，保羅前後在這裡住了約三年（徒 18～20）。教會裡有猶太人也有外邦人；保羅被囚時託推基古送信（弗 6:21），說明神在基督裡的計畫，以及兩群人怎樣成為一個身體。"},"revelations":[{"key":"屬靈福氣","point":"神在基督裡已賜下天上各樣屬靈的福氣","explain":"第一章一開頭就列出：揀選、得兒子的名分、救贖、赦罪、受聖靈為印記。全書前半先講神已經做了什麼，後半才講信徒怎樣生活。","ref":"弗 1:3–14"},{"key":"本乎恩","point":"得救是本乎恩，也因著信，不是出於行為","explain":"保羅說人原本「死在過犯罪惡之中」，是神的恩典使人活過來。緊接著又說信徒是神的工作，為要叫人行善，恩典和行善接在一起。","ref":"弗 2:1–10"},{"key":"拆毀隔牆","point":"基督拆毀了猶太人與外邦人中間隔斷的牆","explain":"當時猶太人與外邦人界線分明。保羅說基督使兩下合而為一、成為一個新人，外邦人不再是外人，而是神家裡的人。","ref":"弗 2:11–22"},{"key":"教會是身體","point":"教會是基督的身體，基督是元首","explain":"這卷書反覆用身體比喻教會：神賜下使徒、先知、傳福音的、牧師和教師，為要建立基督的身體，讓眾肢體一同長大成熟。","ref":"弗 4:11–16"},{"key":"竭力合一","point":"要竭力保守聖靈所賜合而為一的心","explain":"從第四章起，全書轉向生活。保羅用一連串的「一」說明合一的根基：一個身體、一個聖靈、一個指望、一主、一信、一洗、一神。","ref":"弗 4:1–6"},{"key":"屬靈爭戰","point":"信徒的爭戰不是與屬血氣的人爭戰","explain":"全書最後保羅說，真正的爭戰對象是天空屬靈氣的惡魔，所以要穿戴神所賜的全副軍裝，才能站立得住。","ref":"弗 6:10–13"}],"outline":[{"key":"恩典的計畫","range":"1～2 章","point":"神在基督裡的揀選與救恩，猶太人與外邦人合而為一"},{"key":"奧秘與禱告","range":"3 章","point":"保羅說明福音的奧秘，並為信徒能明白基督的愛禱告"},{"key":"合一與恩賜","range":"4:1–16","point":"竭力保守合一，各樣恩賜建立基督的身體"},{"key":"新人的生活","range":"4:17～5:20","point":"脫去舊人、穿上新人，在光明中行事"},{"key":"家庭與主僕","range":"5:21～6:9","point":"夫妻、父母兒女、僕人主人彼此相待的教導"},{"key":"全副軍裝","range":"6:10–24","point":"穿戴神的軍裝，最後託推基古送信問安"}],"stories":[{"key":"獄中寫信","title":"寫這封信的故事","ref":"弗 6:19–22","summary":"保羅曾在以弗所傳道約三年，還經歷銀匠底米丟帶頭的騷動（徒 19）。後來他被囚，自稱是「帶鎖鍊的使者」，寫下這封信交給推基古帶去，向信徒說明神要使萬有在基督裡同歸於一。","people":["paul"]},{"key":"長闊高深","title":"保羅為信徒的禱告","ref":"弗 3:14–21","summary":"保羅屈膝向父禱告，求信徒能和眾聖徒一同明白基督的愛是何等長闊高深，並知道這愛是過於人所能測度的。這段禱告最後以頌讚收尾，結束全書的前半。","people":["paul","jesus"]},{"key":"六件軍裝","title":"神所賜的全副軍裝","ref":"弗 6:10–20","summary":"保羅用士兵的裝備做比喻：真理當作束腰的帶子，公義當作護心鏡，平安的福音當作鞋，信德當作藤牌，還有救恩的頭盔和聖靈的寶劍，就是神的道。最後他請信徒為他禱告，好放膽講明福音的奧秘。","people":["paul"]}],"people":["paul","jesus"],"verses":[{"ref":"弗 2:8–9","text":"你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。"},{"ref":"弗 4:3","text":"用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。"},{"ref":"弗 6:11","text":"要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。"}]}},{"t":"nt","id":"philippians","order":11,"name":"腓立比書","abbr":"腓","chapters":4,"group":"保羅書信","data":{"id":"philippians","order":11,"name":"腓立比書","abbr":"腓","chapters":4,"group":"保羅書信","oneLine":"在監獄裡寫的喜樂書：以基督的心為心","background":{"author":"保羅（與提摩太一同具名）","date":"約主後 60～62 年（若為保羅在羅馬被囚時所寫）","audience":"腓立比的眾聖徒，和諸位監督、諸位執事","place":"在監獄中；傳統上認為在羅馬，也有人認為在以弗所或該撒利亞","why":"腓立比是羅馬的駐防城，也是保羅在馬其頓建立的第一個教會：呂底亞信主、獄卒全家受洗都發生在這裡（徒 16）。這個教會多次供應保羅，這次派以巴弗提把饋送帶到監中；以巴弗提病得幾乎要死，痊癒後保羅打發他回去（一般認為這封信就是由他帶回），信中答謝、報平安，也勸教會同心。"},"revelations":[{"key":"患難中喜樂","point":"保羅在監中仍然喜樂，喜樂貫穿全書","explain":"保羅說他的捆鎖反而叫福音更興旺，連御營全軍都知道他是為基督被捆鎖。到第四章他再說：要靠主常常喜樂。","ref":"腓 1:12–18"},{"key":"活著是基督","point":"對保羅來說，活著就是基督，死了就有益處","explain":"保羅不知道自己會被釋放還是被處死，他說兩樣都好；但為了教會的益處，他相信自己還會留在世上。","ref":"腓 1:21–26"},{"key":"基督的心","point":"以基督耶穌的心為心：謙卑、虛己、順服","explain":"保羅勸信徒不要結黨、不要貪圖虛浮的榮耀，接著描述基督本有神的形像，卻取了奴僕的形像，順服以至於死在十字架上，後來神將他升為至高。","ref":"腓 2:3–11"},{"key":"得著基督","point":"保羅把從前引以為傲的都當作有損的","explain":"他列出自己的猶太出身和熱心，說這些比起認識基督都看作有損的；他忘記背後、努力面前，向著標竿直跑。","ref":"腓 3:4–14"},{"key":"不要憂慮","point":"凡事藉著禱告、祈求和感謝告訴神","explain":"保羅說這樣做，神所賜出人意外的平安，必在基督耶穌裡保守人的心懷意念。","ref":"腓 4:6–7"},{"key":"知足秘訣","point":"保羅學會無論在什麼景況都可以知足","explain":"他知道怎樣處卑賤、怎樣處豐富；「凡事都能做」這句話，原本講的就是這份知足。同時他也感謝教會的饋送。","ref":"腓 4:10–19"}],"outline":[{"key":"監中近況","range":"1:1–26","point":"感謝與禱告，說明捆鎖反而使福音興旺"},{"key":"同心合意","range":"1:27～2:30","point":"勸信徒同心、以基督的心為心，並推薦提摩太與以巴弗提"},{"key":"向標竿直跑","range":"3 章","point":"提防靠割禮誇口的人，保羅說自己竭力追求得著基督"},{"key":"喜樂與知足","range":"4 章","point":"勸人和睦、喜樂、不要憂慮，答謝腓立比人的饋送"}],"stories":[{"key":"監中謝函","title":"寫這封信的故事","ref":"腓 4:10–18","summary":"保羅當年在腓立比的監獄裡曾和西拉半夜唱詩，獄卒全家信主（徒 16）。多年後保羅又被囚，腓立比教會派以巴弗提送來饋送；保羅寫這封信答謝，說這是極美的香氣，是神所收納、所喜悅的祭物。","people":["paul","silas","timothy"]},{"key":"虛己之歌","title":"基督虛己的詩歌","ref":"腓 2:5–11","summary":"這段文字節奏整齊，有學者認為原本是初期教會的詩歌。它從基督降卑寫到死在十字架上，再寫到神將他升為至高，叫一切口都要承認耶穌基督為主。","people":["jesus"]},{"key":"以巴弗提","title":"以巴弗提幾乎至死","ref":"腓 2:25–30","summary":"以巴弗提是腓立比教會派來供給保羅需用的人，他為做基督的工夫病得幾乎要死，神憐恤他使他痊癒。保羅打發他回去，請教會要尊重這樣的人。","people":["paul"]}],"people":["paul","jesus","timothy"],"verses":[{"ref":"腓 2:5–8","text":"你們當以基督耶穌的心為心：他本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像，成為人的樣式；既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。"},{"ref":"腓 4:4","text":"你們要靠主常常喜樂。我再說，你們要喜樂。"},{"ref":"腓 4:13","text":"我靠著那加給我力量的，凡事都能做。"}]}},{"t":"nt","id":"colossians","order":12,"name":"歌羅西書","abbr":"西","chapters":4,"group":"保羅書信","data":{"id":"colossians","order":12,"name":"歌羅西書","abbr":"西","chapters":4,"group":"保羅書信","oneLine":"基督在萬有之上，在他裡面已經豐盛","background":{"author":"傳統上認為是保羅（與提摩太一同具名）在監中所寫，也有不同看法","date":"約主後 60～62 年","audience":"歌羅西的聖徒；保羅也請他們與老底嘉教會交換讀信","place":"在監獄中；不確定，傳統上認為在羅馬","why":"歌羅西是亞細亞省內陸的小城，附近有老底嘉和希拉坡里。這個教會不是保羅親自建立的，而是以巴弗傳福音建立的（西 1:7）。以巴弗把教會的愛心告訴保羅，當地也有人傳講混雜的教導：講究理學、守飲食節期、敬拜天使、禁慾的規條。保羅寫信回應，託推基古和阿尼西母送去。"},"revelations":[{"key":"萬有之上","point":"基督是萬有的首，一切都是藉他造的","explain":"保羅說愛子是那不能看見之神的像，萬有都是靠他造、為他造，也靠他而立；他也是教會全體之首。","ref":"西 1:15–20"},{"key":"豐盛在他","point":"神本性一切的豐盛都住在基督裡","explain":"保羅說信徒在基督裡面也得了豐盛，所以不必再從別的教導去找補充。","ref":"西 2:9–10"},{"key":"防備理學","point":"不要被虛空的妄言和人間的遺傳擄去","explain":"保羅提醒他們，那些照著世上小學的教導看起來有智慧，卻不是照著基督。","ref":"西 2:8"},{"key":"不靠規條","point":"人定的禁慾規條不能克制肉體的情慾","explain":"保羅說飲食、節期、月朔、安息日都是後事的影兒，形體卻是基督；「不可拿、不可嘗、不可摸」這類規條，在克制肉體的情慾上毫無功效。","ref":"西 2:16–23"},{"key":"思念上面","point":"既與基督一同復活，就要求在上面的事","explain":"第三章從教導轉到生活：心思放在上面的事，治死地上的肢體，脫去舊人、穿上新人。","ref":"西 3:1–10"},{"key":"愛心聯絡","point":"新人裡不分種族身分，愛心聯絡全德","explain":"保羅說在新人裡不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，基督是包括一切；在這一切之外，要存著愛心，愛心是聯絡全德的。","ref":"西 3:11–14"}],"outline":[{"key":"感恩與禱告","range":"1:1–14","point":"為信徒的信心和愛心感謝，求他們滿心知道神的旨意"},{"key":"基督超越","range":"1:15～2:3","point":"基督在萬有之上，保羅為教會勞苦"},{"key":"警告錯謬","range":"2:4–23","point":"不要被理學、規條和敬拜天使的教導迷惑"},{"key":"新人生活","range":"3:1～4:6","point":"思念上面的事，家庭與主僕的相待，恆切禱告"},{"key":"問安差遣","range":"4:7–18","point":"推基古與阿尼西母送信，眾同工問安"}],"stories":[{"key":"以巴弗報信","title":"寫這封信的故事","ref":"西 1:3–8","summary":"以巴弗在歌羅西傳福音建立了教會，後來到保羅身邊，把教會的愛心告訴保羅（西 1:8）；一般認為保羅也是從他得知當地有混雜的教導。保羅從沒有和他們見過面（西 2:1），仍寫信肯定他們的信心，也提醒他們不要被迷惑。","people":["paul","timothy"]},{"key":"基督頌","title":"愛子是神的像","ref":"西 1:15–20","summary":"這段以基督為中心：他在創造上居首位，在教會裡也居首位；又藉著他在十字架上所流的血成就了和平，叫萬有都與神和好。","people":["jesus"]},{"key":"送信與問安","title":"推基古、阿尼西母與眾同工","ref":"西 4:7–18","summary":"送信的是推基古和阿尼西母；阿尼西母「是你們那裡的人」，一般認為就是腓利門書裡的那位僕人。問安名單裡有馬可、路加等同工。保羅還要他們把信轉給老底嘉教會念，也念從老底嘉來的信。","people":["philemon-onesimus","mark","luke"]}],"people":["paul","jesus","timothy","philemon-onesimus","mark","luke"],"verses":[{"ref":"西 1:15","text":"愛子是那不能看見之神的像，是首生的，在一切被造的以先。"},{"ref":"西 3:2","text":"你們要思念上面的事，不要思念地上的事。"},{"ref":"西 3:23–24","text":"無論做甚麼，都要從心裡做，像是給主做的，不是給人做的，因你們知道從主那裡必得著基業為賞賜；你們所事奉的乃是主基督。"}]}},{"t":"nt","id":"1thessalonians","order":13,"name":"帖撒羅尼迦前書","abbr":"帖前","chapters":5,"group":"保羅書信","data":{"id":"1thessalonians","order":13,"name":"帖撒羅尼迦前書","abbr":"帖前","chapters":5,"group":"保羅書信","oneLine":"寫給新教會：在逼迫中站穩，盼望主再來","background":{"author":"保羅（與西拉、提摩太一同具名）","date":"約主後 50～51 年","audience":"帖撒羅尼迦的教會，多數是離棄偶像歸向神的外邦人","place":"一般認為在哥林多","why":"保羅和西拉在帖撒羅尼迦的會堂一連三個安息日講道，有人信了主，城裡卻起了騷動，弟兄們連夜把他們送走（徒 17:1–10）。保羅掛念這個剛成立的教會，從雅典派提摩太回去探望；提摩太帶回好消息，保羅就寫了這封信。它常被認為是新約最早寫成的書卷之一。"},"revelations":[{"key":"信望愛","point":"他們的信心、愛心、盼望成了各處的榜樣","explain":"保羅記念他們因信心所做的工夫、因愛心所受的勞苦、因盼望所存的忍耐；他們離棄偶像歸向神的事，傳遍了馬其頓和亞該亞。","ref":"帖前 1:2–10"},{"key":"站穩不動搖","point":"在患難中站立得穩，是保羅最大的安慰","explain":"保羅怕他們因逼迫而動搖，派提摩太去堅固他們；聽到他們站立得穩，保羅說：你們若靠主站立得穩，我們就活了。","ref":"帖前 3:1–10"},{"key":"聖潔生活","point":"神的旨意就是要信徒成為聖潔","explain":"在外邦城市的風氣裡，保羅特別提醒他們遠避淫行，各人要用聖潔、尊貴守著自己的身體。","ref":"帖前 4:1–8"},{"key":"不必憂傷","point":"為死去的信徒，不要像沒有指望的人憂傷","explain":"有信徒在主再來以前就死了，教會不知道他們會怎樣。保羅說在基督裡死了的人必先復活，活著的人也要一同被提與主相遇。","ref":"帖前 4:13–18"},{"key":"主日如賊","point":"主的日子來到，好像夜間的賊一樣","explain":"保羅不給日期，只說要警醒謹守，像白晝之子，把信和愛當作護心鏡，把得救的盼望當作頭盔。","ref":"帖前 5:1–11"},{"key":"凡事謝恩","point":"常常喜樂、不住禱告、凡事謝恩","explain":"信末有一連串簡短的勸勉，這三句最常被引用；保羅說這是神在基督耶穌裡向他們所定的旨意。","ref":"帖前 5:16–18"}],"outline":[{"key":"信心的榜樣","range":"1 章","point":"感謝他們離棄偶像歸向神，成了各處信徒的榜樣"},{"key":"保羅的回憶","range":"2～3 章","point":"回想在他們中間的為人，派提摩太探望並得到好消息"},{"key":"聖潔勤勞","range":"4:1–12","point":"勸他們聖潔、彼此相愛、安靜辦自己的事"},{"key":"主的再來","range":"4:13～5:11","point":"睡了的人必先復活，主的日子要警醒"},{"key":"最後勸勉","range":"5:12–28","point":"敬重領袖、常常喜樂，並囑咐把信念給眾弟兄聽"}],"stories":[{"key":"連夜離城","title":"寫這封信的故事","ref":"帖前 3:1–6","summary":"保羅在帖撒羅尼迦只待了很短的時間，就被弟兄們連夜送往庇哩亞（徒 17:10），後來又到了雅典（徒 17:15）。他放心不下，派提摩太回去探望；提摩太回來報告他們的信心和愛心，保羅寫信安慰他們，也回答主再來的問題。","people":["paul","silas","timothy"]},{"key":"主從天降","title":"主必親自從天降臨","ref":"帖前 4:13–18","summary":"保羅描寫主從天降臨，有呼叫的聲音、天使長的聲音和神的號吹響；在基督裡死了的人先復活，活著的人一同被提到雲裡與主相遇。他要信徒用這些話彼此勸慰。","people":["jesus"]}],"people":["paul","silas","timothy","jesus"],"verses":[{"ref":"帖前 4:16","text":"因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響；那在基督裡死了的人必先復活。"},{"ref":"帖前 5:16–18","text":"要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。"}]}},{"t":"nt","id":"2thessalonians","order":14,"name":"帖撒羅尼迦後書","abbr":"帖後","chapters":3,"group":"保羅書信","data":{"id":"2thessalonians","order":14,"name":"帖撒羅尼迦後書","abbr":"帖後","chapters":3,"group":"保羅書信","oneLine":"不要因主的日子驚慌，安靜做工、行善不喪志","background":{"author":"傳統上認為是保羅（與西拉、提摩太一同具名），也有不同看法","date":"約主後 51 年（若為保羅所寫，在前書之後不久）","audience":"帖撒羅尼迦的教會","place":"不確定，傳統上認為在哥林多","why":"前一封信之後，教會受的逼迫更重；又有人傳說主的日子現在已經到了，甚至可能有冒保羅名義的書信，使信徒驚慌。也有人乾脆不做工、專管閒事。保羅再寫一封信，安慰受苦的人，說明主的日子以前要先發生的事，並吩咐他們安靜做工。"},"revelations":[{"key":"神必公義","point":"神必按公義報應，安慰受患難的人","explain":"保羅誇讚他們在逼迫中仍有忍耐和信心，並說主耶穌從天上顯現的時候，神要公義地施行審判。","ref":"帖後 1:3–10"},{"key":"不要驚慌","point":"不要因「主的日子現在到了」的說法輕易動心","explain":"不論是靈、是言語、還是冒保羅名義的書信，保羅都要他們不要輕易動心，也不要驚慌。","ref":"帖後 2:1–2"},{"key":"先有離道","point":"主的日子以前，必有離道反教的事","explain":"保羅說那日以前，必有離道反教的事，並有那大罪人顯露出來，主耶穌要用口中的氣滅絕他；這些事保羅在他們那裡時已經講過。","ref":"帖後 2:3–12"},{"key":"站立得穩","point":"要堅守所領受的教訓","explain":"保羅要他們站立得穩，凡所領受的教訓，不論是口傳的、是書信上的，都要堅守。","ref":"帖後 2:13–17"},{"key":"做工吃飯","point":"若有人不肯做工，就不可吃飯","explain":"保羅提醒他們，他在那裡時晝夜做工，不白吃人的飯，就是要給他們作榜樣；他吩咐不做工、專管閒事的人安靜做工，吃自己的飯。","ref":"帖後 3:6–12"},{"key":"行善不喪志","point":"行善不可喪志，對不聽的人仍當作弟兄","explain":"對不聽勸的人，保羅說不要和他交往，叫他自覺羞愧，但不要以他為仇人，要勸他如弟兄。","ref":"帖後 3:13–15"}],"outline":[{"key":"患難中的安慰","range":"1 章","point":"稱讚他們在逼迫中的忍耐，說明神公義的審判"},{"key":"主日之前","range":"2 章","point":"澄清主的日子還沒有到，先有離道反教的事"},{"key":"請求代禱","range":"3:1–5","point":"請信徒為主的道快快傳開禱告，相信主必堅固他們"},{"key":"勤勞做工","range":"3:6–18","point":"吩咐遠離不做工的人，信末保羅親筆問安"}],"stories":[{"key":"再寫一信","title":"寫這封信的故事","ref":"帖後 2:1–2","summary":"前書寄出後，帖撒羅尼迦的信徒仍在逼迫中，又被「主的日子現在到了」的說法攪擾，有人連工作都放下了。保羅和西拉、提摩太再寫一封信，把事情說清楚。","people":["paul","silas","timothy"]},{"key":"親筆記號","title":"保羅的親筆問安","ref":"帖後 3:17","summary":"信末保羅說，他親筆問他們安，凡他的信都以此為記。當時書信多由別人代筆，作者在最後親筆寫幾句，作為真信的記號。","people":["paul"]}],"people":["paul","silas","timothy","jesus"],"verses":[{"ref":"帖後 3:10","text":"我們在你們那裡的時候，曾吩咐你們說，若有人不肯做工，就不可吃飯。"},{"ref":"帖後 3:13","text":"弟兄們，你們行善不可喪志。"}]}},{"t":"nt","id":"1timothy","order":15,"name":"提摩太前書","abbr":"提前","chapters":6,"group":"保羅書信","data":{"id":"1timothy","order":15,"name":"提摩太前書","abbr":"提前","chapters":6,"group":"保羅書信","oneLine":"給年輕同工的指引：在神的家中當怎樣行","background":{"author":"傳統上認為是保羅晚年所寫，也有不同看法","date":"約主後 62～64 年（若為保羅所寫）","audience":"保羅的「真兒子」提摩太，當時留在以弗所","place":"不確定，可能在馬其頓","why":"保羅往馬其頓去的時候，請提摩太留在以弗所，禁止有人傳異教、講荒渺無憑的話語和無窮的家譜（提前 1:3–4）。提摩太年紀輕，要面對錯誤的教導和教會裡各樣實際問題；保羅寫信，叫他知道在神的家中當怎樣行（提前 3:15）。"},"revelations":[{"key":"守住真道","point":"要禁止異教，守住純正的道理","explain":"保羅說命令的總歸是愛，這愛是從清潔的心、無虧的良心、無偽的信心生出來的；偏離這些的人就轉向虛浮的辯論。","ref":"提前 1:3–7"},{"key":"罪魁蒙恩","point":"保羅說自己是罪魁，卻蒙了憐憫","explain":"他從前是褻瀆神、逼迫人、侮慢人的，卻蒙了憐憫，成了後來信主之人的榜樣。","ref":"提前 1:12–17"},{"key":"為萬人禱告","point":"要為萬人和君王禱告","explain":"保羅說神願意萬人得救，神和人中間只有一位中保，就是降世為人的基督耶穌。","ref":"提前 2:1–7"},{"key":"神家秩序","point":"監督和執事要有好品格和好名聲","explain":"第三章列出監督與執事的條件，多半是品格與家庭的見證，例如有節制、不貪財、好好管理自己的家。","ref":"提前 3:1–15"},{"key":"作信徒榜樣","point":"不可叫人小看你年輕","explain":"保羅要提摩太在言語、行為、愛心、信心、清潔上作信徒的榜樣，並且殷勤宣讀、勸勉、教導。","ref":"提前 4:12–16"},{"key":"敬虔知足","point":"敬虔加上知足的心便是大利","explain":"保羅說人沒有帶什麼到世上，也不能帶什麼去；貪財是萬惡之根。他囑咐富足的人不要倚靠無定的錢財，要甘心施捨。","ref":"提前 6:6–19"},{"key":"打美好仗","point":"要為真道打那美好的仗","explain":"信末保羅要提摩太逃避貪財的事，追求公義、敬虔、信心、愛心、忍耐、溫柔，持定永生。","ref":"提前 6:11–16"}],"outline":[{"key":"防備異教","range":"1 章","point":"囑咐提摩太禁止異教，保羅見證自己蒙恩"},{"key":"禱告與聚會","range":"2 章","point":"為萬人禱告，以及聚會中男人與女人的規矩"},{"key":"監督執事","range":"3 章","point":"監督與執事的條件，敬虔的奧秘"},{"key":"敬虔操練","range":"4 章","point":"末後有人離棄真道，提摩太要操練敬虔、作榜樣"},{"key":"各類信徒","range":"5:1～6:2","point":"怎樣對待老年人、少年人、寡婦、長老與僕人"},{"key":"最後囑咐","range":"6:3–21","point":"貪財的危險，囑咐富足的人，保守所託付的"}],"stories":[{"key":"留守以弗所","title":"寫這封信的故事","ref":"提前 1:3–4","summary":"提摩太是保羅在路司得遇見的年輕門徒（徒 16:1–3），跟著保羅走過許多城。保羅往馬其頓去，把他留在以弗所處理教會裡的異教問題；保羅說盼望快到他那裡，若是耽延，這封信可以讓他知道該怎樣行。","people":["paul","timothy"]},{"key":"敬虔奧秘","title":"大哉，敬虔的奧秘","ref":"提前 3:16","summary":"這節像一首短詩，用六句話總結基督：在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡。","people":["jesus"]}],"people":["paul","timothy","jesus"],"verses":[{"ref":"提前 4:12","text":"不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。"},{"ref":"提前 6:6–7","text":"然而，敬虔加上知足的心便是大利了；因為我們沒有帶甚麼到世上來，也不能帶甚麼去。"},{"ref":"提前 6:10","text":"貪財是萬惡之根。有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。"}]}},{"t":"nt","id":"2timothy","order":16,"name":"提摩太後書","abbr":"提後","chapters":4,"group":"保羅書信","data":{"id":"2timothy","order":16,"name":"提摩太後書","abbr":"提後","chapters":4,"group":"保羅書信","oneLine":"保羅最後的囑咐：那美好的仗我已經打過了","background":{"author":"傳統上認為是保羅最後一封信，也有不同看法","date":"約主後 64～67 年（若為保羅所寫）","audience":"提摩太，保羅稱他是「親愛的兒子」","place":"羅馬的監獄中（提後 1:17）","why":"保羅再次在羅馬被囚，這次被捆綁像犯人一樣，他知道自己離世的時候到了（提後 4:6）。凡在亞細亞的人都離棄了他，有的同工也離開，只有路加在身邊。他寫信要提摩太忠心傳道、把真道交託給可靠的人，並請他趕在冬天以前來，把馬可一起帶來。"},"revelations":[{"key":"剛強的心","point":"神賜的不是膽怯的心，是剛強仁愛謹守的心","explain":"保羅提醒提摩太把神所給的恩賜再如火挑旺起來，也記得他外祖母羅以、母親友尼基傳下來的信心。","ref":"提後 1:5–7"},{"key":"不以為恥","point":"不要以給主作見證為恥，與福音同受苦難","explain":"保羅說自己為福音受苦也不以為恥，因為知道自己所信的是誰，也深信主能保全他所交付的。","ref":"提後 1:8–12"},{"key":"交託忠心人","point":"把所聽見的交託那忠心能教導別人的人","explain":"保羅傳給提摩太，提摩太再交給忠心的人，忠心的人再教導別人，一棒接一棒傳下去。","ref":"提後 2:1–2"},{"key":"精兵農夫","point":"像精兵、比武的人、農夫一樣忍受苦難","explain":"保羅用三個比喻：當兵的不被生活的事纏身，比武的要按規矩，勞力的農夫理當先得糧食。","ref":"提後 2:3–7"},{"key":"聖經默示","point":"聖經都是神所默示的，於教訓督責都有益","explain":"末世有艱難的日子，保羅要提摩太守住從小明白的聖經，叫屬神的人得以完全，預備行各樣的善事。","ref":"提後 3:14–17"},{"key":"務要傳道","point":"無論得時不得時，總要專心傳道","explain":"保羅說時候要到，人必厭煩純正的道理，隨從自己的情慾增添好些師傅；所以提摩太要凡事謹慎、忍受苦難、做傳道的工夫。","ref":"提後 4:1–5"},{"key":"跑盡當跑","point":"保羅說他的仗打過了，路跑盡了，道守住了","explain":"他說自己現在被澆奠，離世的時候到了；有公義的冠冕為他存留，也為凡愛慕主顯現的人存留。","ref":"提後 4:6–8"}],"outline":[{"key":"挑旺恩賜","range":"1 章","point":"記念提摩太家傳的信心，不以福音為恥"},{"key":"忍受苦難","range":"2 章","point":"像精兵一樣忍苦，作無愧的工人，遠避無益的辯論"},{"key":"末世艱難","range":"3 章","point":"末世人心的光景，守住所學習的聖經"},{"key":"最後囑咐","range":"4 章","point":"務要傳道，保羅自知離世在即，交代後事與問安"}],"stories":[{"key":"最後的信","title":"寫這封信的故事","ref":"提後 1:15–18","summary":"保羅這次在羅馬被囚，凡在亞細亞的人都離棄了他，只有阿尼色弗不以他的鎖鍊為恥，在羅馬殷勤地找到他。保羅知道自己快要離世，寫信給最親近的同工提摩太，交代最後的心願。","people":["paul","timothy"]},{"key":"三代信心","title":"外祖母羅以與母親友尼基","ref":"提後 1:5","summary":"保羅記得提摩太無偽的信心，這信心先在他外祖母羅以和母親友尼基心裡，後來也在他心裡；提摩太從小就明白聖經（提後 3:15）。","people":["timothy"]},{"key":"帶外衣來","title":"外衣、書和皮卷","ref":"提後 4:9–22","summary":"信末保羅請提摩太趕快來：底馬貪愛現今的世界離開了，提多往撻馬太去，只有路加在身邊。他要提摩太把馬可帶來，也把留在特羅亞加布那裡的外衣和書帶來，更要緊的是那些皮卷，並請他趕在冬天以前到；最後還問百基拉、亞居拉安。","people":["paul","timothy","luke","mark","titus","priscilla-aquila"]}],"people":["paul","timothy","luke","mark","titus","priscilla-aquila"],"verses":[{"ref":"提後 1:7","text":"因為神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。"},{"ref":"提後 3:16–17","text":"聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事。"},{"ref":"提後 4:7","text":"那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。"}]}},{"t":"nt","id":"titus","order":17,"name":"提多書","abbr":"多","chapters":3,"group":"保羅書信","data":{"id":"titus","order":17,"name":"提多書","abbr":"多","chapters":3,"group":"保羅書信","oneLine":"在克里特建立教會：設立長老，熱心行善","background":{"author":"傳統上認為是保羅所寫，也有不同看法","date":"約主後 63～65 年（若為保羅所寫）","audience":"提多，保羅稱他是「真兒子」","place":"不確定；保羅打算在尼哥坡里過冬（多 3:12）","why":"提多是希臘人，曾跟保羅上耶路撒冷（加 2:1–3），也替保羅處理過哥林多教會的事（林後 7～8）。保羅把他留在克里特島，要他把未辦完的事辦整齊，在各城設立長老。當地有許多人不服約束、說虛空話，奉割禮的更是這樣，保羅寫信給提多指引方向。"},"revelations":[{"key":"設立長老","point":"在各城設立品格無可指責的長老","explain":"長老要無可指責、好好管理自己的家，不任性、不暴躁、不貪無義之財，又要堅守所教真實的道理，能勸化人、駁倒爭辯的人。","ref":"多 1:5–9"},{"key":"純正道理","point":"所講的要與純正的道理相合","explain":"面對說虛空話、為貪不義之財而教導的人，提多要嚴嚴地責備，使他們在真道上純全無疵。","ref":"多 1:10～2:1"},{"key":"生活榜樣","point":"老年、少年、僕人各有合宜的生活","explain":"保羅針對不同年齡和身分給出具體勸勉，也要提多自己在凡事上顯出善行的榜樣，叫反對的人無話可說。","ref":"多 2:1–10"},{"key":"恩典教導","point":"神的恩典教導人過自守、公義、敬虔的生活","explain":"保羅把救恩和生活連在一起：恩典叫人除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日，等候基督顯現。","ref":"多 2:11–14"},{"key":"憐憫重生","point":"神救人不是因人的義，是照他的憐憫","explain":"保羅提醒他們自己從前也是無知、悖逆的；神藉著重生的洗和聖靈的更新救了人，叫人因他的恩得稱為義。","ref":"多 3:3–7"},{"key":"熱心行善","point":"行善是全書反覆出現的主題","explain":"保羅多次提到善工：要熱心為善、預備行各樣的善事、留心做正經事業，也要遠避無知的辯論和家譜。","ref":"多 3:1–14"}],"outline":[{"key":"建立教會","range":"1 章","point":"在各城設立長老，責備說虛空話的人"},{"key":"各人本分","range":"2 章","point":"老年人、少年人與僕人的生活，恩典教導人"},{"key":"行善與重生","range":"3:1–11","point":"順服掌權的、行善，神照憐憫救人"},{"key":"最後交代","range":"3:12–15","point":"請提多到尼哥坡里，給西納和亞波羅送行"}],"stories":[{"key":"留在克里特","title":"寫這封信的故事","ref":"多 1:5","summary":"保羅離開克里特時把提多留下，要他把未辦完的事辦整齊、在各城設立長老。新成立的教會還沒有領袖，又有人說虛空話擾亂，保羅就寫了這封短信給提多。","people":["paul","titus"]},{"key":"克里特俗語","title":"引用當地先知的話","ref":"多 1:12–13","summary":"保羅引用一位克里特本地「先知」的話，描述當時當地的壞名聲，並說這個見證是真的，所以提多要嚴嚴地責備那些說虛空話的人。","people":["titus"]},{"key":"送行同工","title":"西納和亞波羅","ref":"多 3:12–14","summary":"信末保羅請提多趕緊到尼哥坡里與他會合，並要他好好給律師西納和亞波羅送行，叫他們沒有缺乏。","people":["paul","titus","apollos"]}],"people":["paul","titus","apollos"],"verses":[{"ref":"多 2:11–13","text":"因為神救眾人的恩典已經顯明出來，教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日，等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現。"},{"ref":"多 3:5","text":"他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。"}]}},{"t":"nt","id":"philemon","order":18,"name":"腓利門書","abbr":"門","chapters":1,"group":"保羅書信","data":{"id":"philemon","order":18,"name":"腓利門書","abbr":"門","chapters":1,"group":"保羅書信","oneLine":"保羅為阿尼西母求情：不再是奴僕，是親愛的兄弟","background":{"author":"保羅（與提摩太一同具名）","date":"約主後 60～62 年","audience":"腓利門、亞腓亞、亞基布，和在腓利門家中的教會","place":"在監獄中；傳統上認為在羅馬，一般認為與歌羅西書同時寄出","why":"腓利門一般認為是歌羅西的信徒，家裡有教會聚會。他的僕人阿尼西母離開了主人，可能還虧欠了他，一般認為是逃走的。阿尼西母後來在被囚的保羅身邊信了主，保羅打發他回到腓利門那裡，寫下這封信替他求情（另見西 4:9）。"},"revelations":[{"key":"以愛求情","point":"保羅不用權柄吩咐，而是憑愛心請求","explain":"保羅說他本可以放膽吩咐腓利門做合宜的事，卻寧可憑著愛心求他，好讓這件善事出於甘心，不是出於勉強。","ref":"門 1:8–14"},{"key":"無益變有益","point":"阿尼西母從前沒有益處，如今與人都有益處","explain":"「阿尼西母」這個名字有「有益處」的意思，保羅在這裡用了雙關；他稱阿尼西母是「我在捆鎖中所生的兒子」。","ref":"門 1:10–11"},{"key":"高過奴僕","point":"回來的不再只是奴僕，是親愛的兄弟","explain":"保羅說他暫時離開，或許是要讓腓利門永遠得著他；在主裡，主人和僕人成了弟兄。","ref":"門 1:15–16"},{"key":"歸我帳上","point":"保羅願意替阿尼西母承擔虧欠","explain":"保羅說阿尼西母若虧負腓利門、欠了什麼，都歸在保羅的帳上，並親筆寫下「我必償還」。","ref":"門 1:17–19"}],"outline":[{"key":"感謝愛心","range":"1:1–7","point":"問安，感謝腓利門的信心和愛心使眾聖徒的心得了暢快"},{"key":"為僕求情","range":"1:8–16","point":"為阿尼西母求情，請腓利門接納他如同兄弟"},{"key":"親筆擔保","range":"1:17–22","point":"保羅願意償還，並請腓利門為他預備住處"},{"key":"同工問安","range":"1:23–25","point":"以巴弗、馬可、亞里達古、底馬、路加問安"}],"stories":[{"key":"獄中求情","title":"寫這封信的故事","ref":"門 1:8–22","summary":"阿尼西母離開主人腓利門，後來在被囚的保羅身邊信了主，成了保羅的幫手。保羅很想把他留下，但不願沒有腓利門的同意就這樣做（門 1:14），於是讓阿尼西母帶著這封信回去，求腓利門收納他，像收納保羅自己一樣。","people":["paul","philemon-onesimus"]}],"people":["paul","philemon-onesimus","timothy","mark","luke"],"verses":[{"ref":"門 1:11","text":"他從前與你沒有益處，但如今與你我都有益處。"},{"ref":"門 1:16","text":"不再是奴僕，乃是高過奴僕，是親愛的兄弟。在我實在是如此，何況在你呢！這也不拘是按肉體說，是按主說。"}]}},{"t":"nt","id":"hebrews","order":19,"name":"希伯來書","abbr":"來","chapters":13,"group":"普通書信","data":{"id":"hebrews","order":19,"name":"希伯來書","abbr":"來","chapters":13,"group":"普通書信","oneLine":"耶穌比天使、摩西和祭司都更美，信心不要後退","background":{"author":"作者不詳；傳統上曾認為是保羅，也有人提巴拿巴、亞波羅等，有不同看法","date":"約主後 60～70 年（多數認為在耶路撒冷聖殿被毀前），也有不同看法","audience":"熟悉舊約與聖殿獻祭的猶太背景信徒","place":"不確定；信末提到「從意大利來的人也問你們安」（來 13:24）","why":"收信的人信主後受過患難、財產被搶（來 10:32–34），一般認為有人想退回舊有的猶太敬拜方式。作者用舊約一路說明耶穌更美，勸他們堅持信心、不要後退。"},"revelations":[{"key":"基督更美","point":"耶穌比天使、摩西更美，是神最後的說話","explain":"全書一開頭就說神從前藉先知說話，末世藉著他兒子說話（來 1:1–2）。接著拿天使、摩西一一比較，說明兒子的地位在他們之上。","ref":"來 1～3"},{"key":"永遠大祭司","point":"耶穌是照麥基洗德等次的永遠大祭司","explain":"作者引詩篇 110 篇，說耶穌的祭司職分不是出自利未支派，而是照麥基洗德的等次。他長遠活著，能替人祈求。","ref":"來 4:14～7:28"},{"key":"更美之約","point":"神應許的新約取代了舊約","explain":"作者整段引用耶利米書的「新約」應許，說明地上的帳幕與供奉只是天上事的影像，新約建立在更美的應許上。","ref":"來 8:6–13"},{"key":"一次獻上","point":"耶穌只一次獻上自己，就完成了贖罪","explain":"舊約祭司年年獻祭，罪仍被記念；這卷書強調耶穌用自己的血一次進入聖所，不必再重複獻祭。","ref":"來 9:11～10:18"},{"key":"信心見證","point":"舊約眾人憑信心活著，成為信心的榜樣","explain":"11 章從亞伯、挪亞、亞伯拉罕一路講到摩西、喇合，每一位都是「因著信」行事。作者用他們說明信心是向著還沒看見的應許。","ref":"來 11"},{"key":"奔跑路程","point":"放下重擔，仰望耶穌，忍耐奔跑","explain":"緊接著 11 章，作者把這些人比作圍著的「雲彩」見證人，要讀者像賽跑一樣存心忍耐，眼睛看著耶穌。","ref":"來 12:1–3"},{"key":"不可後退","point":"已經聽見真道的人，不可退後離開","explain":"書中多次插入嚴肅警告（來 2:1–4；6:4–8；10:26–39），要讀者不要忽略救恩，也不要停止聚會。","ref":"來 10:19–39"}],"outline":[{"key":"子超越天使","range":"1～2 章","point":"神藉兒子說話，兒子比天使更尊貴，又成為人與我們一樣"},{"key":"勝過摩西","range":"3～4 章","point":"耶穌比摩西更尊榮；不要像曠野那一代因不信進不了安息"},{"key":"麥基洗德等次","range":"5～7 章","point":"耶穌是大祭司，照麥基洗德等次，比利未祭司更美"},{"key":"新約與真聖所","range":"8:1～10:18","point":"新約取代舊約，耶穌在天上的聖所一次獻上自己"},{"key":"堅持信心","range":"10:19～11:40","point":"勸人坦然親近神、不要後退，並列出舊約信心的人物"},{"key":"奔跑與管教","range":"12 章","point":"仰望耶穌奔跑；把苦難看成父親的管教"},{"key":"生活勸勉","range":"13 章","point":"彼此相愛、接待客旅、記念受苦的人，最後問安"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"來 10:32–39；13:22–25","summary":"收信的信徒信主初期曾被人辱罵、財產被搶，他們都忍受了；後來有人灰心、停止聚會（來 10:25），一般認為有人想回到舊的敬拜方式。作者自稱這是「勸勉的話」，寫信要他們別丟掉勇敢的心，信末還提到提摩太已經被釋放。","people":["timothy"]},{"key":"麥基洗德","title":"撒冷王麥基洗德","ref":"來 7:1–28","summary":"作者回到創世記，講亞伯拉罕打仗回來時，撒冷王麥基洗德出來為他祝福，亞伯拉罕把十分之一給他。作者用這段說明耶穌的祭司職分比利未祭司更大、而且永遠長存。","people":["jesus"]},{"key":"信心名人堂","title":"信心的人物","ref":"來 11:1–40","summary":"以「信就是所望之事的實底」開頭，作者一一列出亞伯、以諾、挪亞、亞伯拉罕、撒拉、以撒、雅各、約瑟、摩西、喇合等人，再提到基甸、巴拉、參孫、耶弗他、大衛、撒母耳和眾先知。他說這些人到死都還沒得著所應許的，卻仍然存著信心。","people":[]},{"key":"雲彩見證人","title":"如同雲彩圍著我們","ref":"來 12:1–3","summary":"作者把 11 章那些人比作圍在賽場邊的雲彩見證人，要讀者放下重擔、脫去纏累的罪，忍耐奔跑。他要讀者仰望耶穌：耶穌為了前面的喜樂，忍受了十字架。","people":["jesus"]}],"people":["jesus","timothy"],"verses":[{"ref":"來 11:1","text":"信就是所望之事的實底，是未見之事的確據。"},{"ref":"來 13:8","text":"耶穌基督昨日、今日、一直到永遠，是一樣的。"}]}},{"t":"nt","id":"james","order":20,"name":"雅各書","abbr":"雅","chapters":5,"group":"普通書信","data":{"id":"james","order":20,"name":"雅各書","abbr":"雅","chapters":5,"group":"普通書信","oneLine":"真信心會長出行動：聽道也要行道","background":{"author":"傳統上認為是主的兄弟雅各，耶路撒冷教會的領袖，也有不同看法","date":"約主後 45～62 年（傳統上說雅各約在 62 年殉道）","audience":"「散住十二個支派之人」，分散各地的猶太背景信徒（雅 1:1）","place":"不確定，傳統上認為在耶路撒冷","why":"收信的信徒正在各樣試煉中，教會裡有偏待富人、輕看窮人的事，也有人嘴上說有信心卻沒有行動。雅各用一連串簡短有力的勸勉，要他們讓信心落實在生活裡。"},"revelations":[{"key":"試煉忍耐","point":"試煉能生出忍耐，使人成熟","explain":"雅各一開頭就說遇見試煉要以為大喜樂，因為信心經過試驗就生忍耐。這是全書的起點。","ref":"雅 1:2–4"},{"key":"求智慧","point":"缺少智慧就向神求，但要憑信心求","explain":"雅各說神厚賜與眾人，但求的人不可疑惑，疑惑的人像海浪被風吹動。","ref":"雅 1:5–8"},{"key":"聽道行道","point":"只聽不做，是欺哄自己","explain":"雅各用照鏡子比喻：照完就忘了自己的樣子。真正蒙福的是照著去做的人。","ref":"雅 1:22–25"},{"key":"不可偏心","point":"不可按外貌待人，偏待富人輕看窮人","explain":"雅各舉戴金戒指的人和穿骯髒衣服的窮人進會堂為例，說偏待人就是犯罪。","ref":"雅 2:1–13"},{"key":"信心行為","point":"信心沒有行為是死的","explain":"這是全書最有名的主題。雅各說連鬼魔也信，真正的信心會透過行為表現出來。","ref":"雅 2:14–26"},{"key":"勒住舌頭","point":"舌頭雖小，能影響整個人","explain":"雅各用馬嚼環、船舵、小火點著樹林來比喻舌頭的力量，說同一張口不該又頌讚又咒詛。","ref":"雅 3:1–12"},{"key":"義人祈禱","point":"義人祈禱所發的力量是大有功效的","explain":"書信結尾講到病了要請長老禱告、彼此認罪代求，並舉以利亞禱告為例。","ref":"雅 5:13–18"}],"outline":[{"key":"試煉與聽道","range":"1 章","point":"在試煉中忍耐、求智慧，聽了道要去做"},{"key":"偏心與行為","range":"2 章","point":"不可偏待人；信心要有行為"},{"key":"舌頭與智慧","range":"3 章","point":"舌頭難以制伏；從上頭來的智慧是和平的"},{"key":"順服與謙卑","range":"4 章","point":"爭鬥出於私慾；要親近神、不可論斷、不可誇口明天"},{"key":"忍耐與禱告","range":"5 章","point":"警告苛待工人的富足人；忍耐等候主來，彼此代禱"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"雅 1:1；2:1–7","summary":"自稱「神和主耶穌基督僕人」的雅各，寫信給分散在各地的猶太背景信徒。當時他們面對試煉，聚會裡也出現看有錢人臉色、羞辱窮人的情形，雅各用很直接的口吻寫信要他們活出信心。","people":["james-brother"]},{"key":"亞伯拉罕喇合","title":"亞伯拉罕與喇合的行為","ref":"雅 2:14–26","summary":"雅各說：如果弟兄或姊妹沒有衣服穿、又缺了日用的飲食，只說「平平安安地去吧」卻不給他們身體所需用的，有什麼益處？他舉亞伯拉罕把以撒獻在壇上、妓女喇合接待使者為例，說明信心與行為並行。","people":[]},{"key":"舌頭如火","title":"舌頭就是火","ref":"雅 3:1–12","summary":"雅各說小小的嚼環能控制馬、小小的舵能轉動大船，舌頭也一樣雖小卻能說大話。他又說一點火能點著最大的樹林，舌頭就是火。","people":[]},{"key":"以利亞禱告","title":"以利亞的禱告","ref":"雅 5:16–18","summary":"雅各提醒讀者，以利亞和我們是一樣性情的人，他懇切禱告，三年零六個月不下雨；再禱告，天就降下雨來。","people":[]}],"people":["james-brother","jesus"],"verses":[{"ref":"雅 1:22","text":"只是你們要行道，不要單單聽道，自己欺哄自己。"},{"ref":"雅 2:26","text":"身體沒有靈魂是死的，信心沒有行為也是死的。"}]}},{"t":"nt","id":"1peter","order":21,"name":"彼得前書","abbr":"彼前","chapters":5,"group":"普通書信","data":{"id":"1peter","order":21,"name":"彼得前書","abbr":"彼前","chapters":5,"group":"普通書信","oneLine":"寫給在苦難中寄居的信徒：你們有活潑的盼望","background":{"author":"使徒彼得（彼前 1:1），由西拉協助轉交（彼前 5:12）；也有不同看法","date":"約主後 62～64 年","audience":"分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的信徒（今土耳其一帶）","place":"信中說在「巴比倫」（彼前 5:13），傳統上認為是指羅馬","why":"這些信徒因為信仰跟周圍的人不同，被毀謗、被排擠，像外地人一樣「寄居」在自己的城市裡。彼得寫信安慰他們：苦難是暫時的，要存盼望、行善，並效法基督受苦的榜樣。"},"revelations":[{"key":"活潑盼望","point":"耶穌復活，使信徒有活潑的盼望","explain":"彼得一開頭就頌讚神，說信徒因耶穌從死裡復活，重生得著存在天上、不能朽壞的基業。","ref":"彼前 1:3–9"},{"key":"寄居的人","point":"信徒在世上像客旅、寄居的","explain":"這卷書稱讀者是「寄居的」，提醒他們身分不在這個世界，要禁戒私慾、在人中間品行端正。","ref":"彼前 1:1；2:11–12"},{"key":"要聖潔","point":"神是聖潔的，蒙召的人也要聖潔","explain":"彼得引利未記的話，要讀者在一切所行的事上聖潔，用基督寶血贖回的身分活著。","ref":"彼前 1:13–21"},{"key":"君尊祭司","point":"信徒是活石，是有君尊的祭司","explain":"彼得用建殿的畫面，說耶穌是房角石，信徒是活石被建造成靈宮，是屬神的子民。","ref":"彼前 2:4–10"},{"key":"效法基督","point":"受苦時效法基督的榜樣","explain":"彼得說基督受苦給人留下榜樣：被罵不還口，受害不說威嚇的話。","ref":"彼前 2:21–25"},{"key":"為義受苦","point":"為行善受苦是有福的，不要驚奇","explain":"彼得說若為義受苦就是有福的，遇到火煉的試驗不要以為奇怪，要常作準備回答人心中盼望的緣由。","ref":"彼前 3:13～4:19"},{"key":"謙卑警醒","point":"要謙卑、把憂慮卸給神、警醒抵擋魔鬼","explain":"最後一章勸長老牧養群羊，眾人以謙卑束腰，並說魔鬼如同吼叫的獅子，要謹守警醒。","ref":"彼前 5:1–11"}],"outline":[{"key":"重生與身分","range":"1:1～2:10","point":"活潑的盼望、要聖潔、信徒是活石與君尊的祭司"},{"key":"在人中生活","range":"2:11～3:12","point":"寄居的人要順服制度、僕人與主人、妻子與丈夫各守本分"},{"key":"受苦的福","range":"3:13～4:19","point":"為行善受苦有福，基督也曾受苦；火煉的試驗不要驚奇"},{"key":"牧養與警醒","range":"5 章","point":"長老牧養群羊，眾人謙卑，警醒抵擋魔鬼，最後問安"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"彼前 1:1–2；4:12–16；5:12–13","summary":"彼得寫信給分散在小亞細亞各地、因信仰被毀謗的信徒，稱他們是「寄居的」。他託西拉轉交這封信，並替「在巴比倫」的教會和「我兒子馬可」問安。","people":["peter","silas","mark"]},{"key":"活石靈宮","title":"活石與房角石","ref":"彼前 2:4–10","summary":"彼得說耶穌是被人丟棄、卻被神揀選的活石，是寶貴的房角石。信徒也像活石，被建造成靈宮，是被揀選的族類、有君尊的祭司。","people":["jesus"]},{"key":"吼叫的獅子","title":"魔鬼如同吼叫的獅子","ref":"彼前 5:6–9","summary":"彼得要讀者自己謙卑，將一切憂慮卸給神。接著提醒魔鬼如同吼叫的獅子遍地遊行，要用堅固的信心抵擋，因為各地的弟兄也經歷同樣的苦難。","people":[]}],"people":["peter","jesus","silas","mark"],"verses":[{"ref":"彼前 2:9","text":"惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。"},{"ref":"彼前 5:7","text":"你們要將一切的憂慮卸給神，因為他顧念你們。"}]}},{"t":"nt","id":"2peter","order":22,"name":"彼得後書","abbr":"彼後","chapters":3,"group":"普通書信","data":{"id":"2peter","order":22,"name":"彼得後書","abbr":"彼後","chapters":3,"group":"普通書信","oneLine":"彼得臨別提醒：在真知識上長進，防備假師傅","background":{"author":"自稱使徒西門彼得（彼後 1:1），傳統上認為是彼得所寫，也有不同看法","date":"約主後 64～68 年（彼得殉道前），也有學者認為較晚","audience":"已收過第一封信的信徒（彼後 3:1）","place":"不確定，傳統上認為在羅馬","why":"彼得說自己知道很快就要「脫離這帳棚」（彼後 1:14），趁還在世時寫信提醒。當時教會中出現假師傅，也有人譏笑「主要降臨的應許在哪裡」，他要讀者記住所領受的真道。"},"revelations":[{"key":"信心加德行","point":"在信心上一步步加上美德，直到愛眾人","explain":"彼得列出一串階梯：信心、德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人，說有這幾樣就不會閒懶不結果子。","ref":"彼後 1:5–11"},{"key":"親眼見證","point":"使徒傳的不是編造的故事，是親眼見過的","explain":"彼得回憶在聖山上親耳聽見天上的聲音，以此說明他們所傳的耶穌是真實見證。","ref":"彼後 1:16–18"},{"key":"預言出於神","point":"經上的預言不是出於人意","explain":"彼得說預言是人被聖靈感動說出神的話，不可隨私意解說。","ref":"彼後 1:19–21"},{"key":"防備假師傅","point":"假師傅會私下引進異端，要分辨","explain":"第 2 章整章描寫假師傅的樣子：貪心、放縱、用捏造的言語取利，並舉舊約例子說明神必審判。","ref":"彼後 2"},{"key":"主必再來","point":"主的日子必定來到，不是耽延","explain":"面對譏誚的人，彼得說主看一日如千年，沒有應許的事遲延，是寬容人、願人悔改。","ref":"彼後 3:3–10"},{"key":"恩典中長進","point":"在主的恩典和知識上有長進","explain":"書信用這句勸勉作結，也提到保羅的信中有些難明白的，要小心不被曲解帶走。","ref":"彼後 3:14–18"}],"outline":[{"key":"長進的階梯","range":"1:1–15","point":"從信心一路加上各樣德行；彼得說自己快要離世"},{"key":"可信的見證","range":"1:16–21","point":"聖山上的見證與出於神的預言"},{"key":"假師傅","range":"2 章","point":"描寫假師傅的行為，舉天使、挪亞、所多瑪為鑑"},{"key":"主的日子","range":"3:1–13","point":"回應譏誚的人：主必再來，等候新天新地"},{"key":"結語勸勉","range":"3:14–18","point":"提到保羅書信，勸讀者防備、在恩典中長進"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"彼後 1:12–15；3:1–4","summary":"彼得說主耶穌已經指示他，很快就要脫離這帳棚，所以要趁還活著時提醒信徒。他說這是寫給他們的第二封信，因為有人開始譏笑主再來的應許。","people":["peter"]},{"key":"聖山聲音","title":"在聖山上聽見的聲音","ref":"彼後 1:16–18","summary":"彼得回憶自己和主同在聖山上時，親耳聽見從極大榮光中有聲音說：「這是我的愛子，我所喜悅的。」他用這段經歷說明使徒傳的是親眼見過的事。","people":["peter","jesus"]},{"key":"好譏誚的人","title":"主降臨的應許在哪裡","ref":"彼後 3:3–10","summary":"彼得說末世必有好譏誚的人問：「主要降臨的應許在哪裡呢？」他回答主看一日如千年，主的日子要像賊來到一樣。","people":[]}],"people":["peter","jesus","paul"],"verses":[{"ref":"彼後 3:8","text":"親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。"},{"ref":"彼後 3:9","text":"主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。"}]}},{"t":"nt","id":"1john","order":23,"name":"約翰一書","abbr":"約壹","chapters":5,"group":"普通書信","data":{"id":"1john","order":23,"name":"約翰一書","abbr":"約壹","chapters":5,"group":"普通書信","oneLine":"神是光、神是愛：住在神裡面的人彼此相愛","background":{"author":"傳統上認為是使徒約翰，也有不同看法","date":"約主後 85～95 年","audience":"約翰稱為「小子們」的一群教會信徒，傳統上說在亞細亞一帶","place":"不確定，傳統上說在以弗所","why":"有人從教會中出去（約壹 2:19），否認耶穌是基督、否認耶穌基督是成了肉身來的。約翰寫信要信徒分辨真假，並且確知自己有永生（約壹 5:13）。"},"revelations":[{"key":"親眼見過","point":"所傳的生命之道是聽見、看見、摸過的","explain":"書信一開頭就強調耶穌是真實來到人間的，作者親眼看過、親手摸過，這正回應了否認耶穌成了肉身的說法。","ref":"約壹 1:1–4"},{"key":"神是光","point":"神是光，與神相交就要行在光明中","explain":"約翰說若說與神相交卻仍在黑暗裡行，就是說謊；行在光明中的人彼此相交。","ref":"約壹 1:5–7"},{"key":"認罪得赦","point":"承認自己的罪，神必赦免","explain":"約翰說人若說自己無罪是自欺，若認罪，神是信實公義的，並有耶穌作中保。","ref":"約壹 1:8～2:2"},{"key":"不愛世界","point":"不要愛世界，世界正在過去","explain":"約翰把世上的事歸納為肉體的情慾、眼目的情慾、今生的驕傲，說這些都要過去，惟獨遵行神旨意的永遠長存。","ref":"約壹 2:15–17"},{"key":"彼此相愛","point":"彼此相愛，是從起初所聽見的命令","explain":"約翰用該隱作反例，說愛不在言語舌頭上，要在行為和誠實上。","ref":"約壹 3:11–18"},{"key":"神就是愛","point":"神就是愛，人愛是因為神先愛我們","explain":"4 章是全書高峰：神差兒子來作挽回祭顯明了愛，住在愛裡的就是住在神裡面。","ref":"約壹 4:7–21"},{"key":"確知永生","point":"信神兒子的人，可以知道自己有永生","explain":"約翰在結尾直接說出寫信目的：要叫信奉神兒子之名的人知道自己有永生。","ref":"約壹 5:11–13"}],"outline":[{"key":"生命之道","range":"1:1～2:2","point":"親眼見過的生命之道；神是光；認罪蒙赦免"},{"key":"遵守命令","range":"2:3–27","point":"遵守主的命令、不愛世界、提防敵基督"},{"key":"神的兒女","range":"2:28～3:24","point":"被稱為神的兒女，不再犯罪，彼此相愛"},{"key":"分辨與愛","range":"4:1–21","point":"試驗諸靈；神就是愛"},{"key":"信心與確據","range":"5 章","point":"信耶穌是神兒子的勝過世界，確知有永生"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"約壹 2:18–26；5:13","summary":"有一批人離開了教會，宣揚否認耶穌是基督的說法，約翰稱這些人為「敵基督」。留下來的信徒感到困惑，約翰稱他們「小子們」，寫信要他們分辨真假，並確知自己有永生。","people":["john"]},{"key":"試驗諸靈","title":"試驗那些靈","ref":"約壹 4:1–6","summary":"約翰說不可一切的靈都信，要試驗是不是出於神，因為世上有許多假先知。他給的判斷標準是：承認耶穌基督是成了肉身來的，就是出於神。","people":["jesus"]},{"key":"愛的篇章","title":"神就是愛","ref":"約壹 4:7–21","summary":"約翰說愛是從神來的，神差他獨生子到世間來，就是愛的顯明。他說人若說「我愛神」卻恨弟兄，就是說謊的。","people":["jesus"]}],"people":["john","jesus"],"verses":[{"ref":"約壹 1:9","text":"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。"},{"ref":"約壹 4:8","text":"沒有愛心的，就不認識神，因為神就是愛。"}]}},{"t":"nt","id":"2john","order":24,"name":"約翰二書","abbr":"約貳","chapters":1,"group":"普通書信","data":{"id":"2john","order":24,"name":"約翰二書","abbr":"約貳","chapters":1,"group":"普通書信","oneLine":"一封短信：在真理中彼此相愛，不接待迷惑人的","background":{"author":"自稱「作長老的」，傳統上認為是使徒約翰，也有不同看法","date":"約主後 85～95 年","audience":"「蒙揀選的太太和她的兒女」，可能指一位女士，也可能指一個教會，有不同看法","place":"不確定，傳統上說在以弗所","why":"當時有巡迴傳道的人到各家教會，其中有人不承認耶穌基督是成了肉身來的。長老寫這封短信，提醒收信人繼續彼此相愛，但不要接待傳錯誤教導的人。"},"revelations":[{"key":"真理與愛","point":"愛與真理要放在一起","explain":"短短開頭幾節，「真理」和「愛」反覆出現，長老說他是「誠心所愛」的，因為真理存在心裡。","ref":"約貳 1:1–3"},{"key":"遵行命令","point":"愛就是遵行神的命令","explain":"長老說這不是新命令，是從起初就有的：彼此相愛；而遵行他的命令就是愛。","ref":"約貳 1:4–6"},{"key":"常守教訓","point":"要持守基督的教訓，不要越過","explain":"長老說凡越過基督教訓的，就沒有神；常守這教訓的，就有父又有子。","ref":"約貳 1:7–9"},{"key":"不接待","point":"不接待傳錯誤教導的人","explain":"長老要收信人不要把不帶這教訓的人接到家裡，也不要問他的安，以免在惡行上有分。","ref":"約貳 1:10–11"}],"outline":[{"key":"問安","range":"1:1–3","point":"長老問候蒙揀選的太太和她的兒女"},{"key":"按真理而行","range":"1:4–6","point":"欣喜有人按真理而行，勸他們彼此相愛"},{"key":"防備迷惑人","range":"1:7–11","point":"警告迷惑人的、敵基督，不要接待他們"},{"key":"盼望見面","range":"1:12–13","point":"有許多話不願用紙墨寫，盼望當面談"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"約貳 1:1–13","summary":"長老見收信人的兒女中有人按真理而行，就寫信表達喜樂。當時有許多迷惑人的出到世上，不承認耶穌基督是成了肉身來的，所以他提醒收信人分辨，並說還有很多話想當面說。","people":["john"]},{"key":"迷惑人的","title":"不承認耶穌成了肉身的人","ref":"約貳 1:7–11","summary":"長老說世上有許多迷惑人的出來，不承認耶穌基督是成了肉身來的，這就是敵基督。他要收信人小心，不要失去所做的工。","people":["jesus"]}],"people":["john","jesus"],"verses":[{"ref":"約貳 1:6","text":"我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令。"}]}},{"t":"nt","id":"3john","order":25,"name":"約翰三書","abbr":"約參","chapters":1,"group":"普通書信","data":{"id":"3john","order":25,"name":"約翰三書","abbr":"約參","chapters":1,"group":"普通書信","oneLine":"長老寫給該猶：稱讚接待、點名丟特腓、推薦低米丟","background":{"author":"自稱「作長老的」，傳統上認為是使徒約翰，也有不同看法","date":"約主後 85～95 年","audience":"親愛的該猶（約參 1:1）","place":"不確定，傳統上說在以弗所","why":"當時有為主名出外傳道的弟兄，需要各地信徒接待與幫助。該猶熱心接待他們；教會裡的丟特腓卻好為首，不接待弟兄，還把接待的人趕出教會。長老寫信肯定該猶，也預告會處理這件事。"},"revelations":[{"key":"按真理行","point":"聽見兒女按真理而行，是長老最大的喜樂","explain":"長老聽弟兄們證明該猶按真理而行，說沒有比這個更大的喜樂。","ref":"約參 1:3–4"},{"key":"接待同工","point":"接待出外傳道的人，就是與他們同工","explain":"長老說這些弟兄為主的名出外，沒有向外邦人取什麼，接待他們，就是一同為真理做工。","ref":"約參 1:5–8"},{"key":"效法善","point":"不要效法惡，只要效法善","explain":"長老用丟特腓作負面例子，接著說行善的屬乎神，行惡的未曾見過神。","ref":"約參 1:9–11"},{"key":"美好見證","point":"好的見證來自眾人與真理","explain":"長老推薦低米丟，說他有眾人和真理給他作見證，長老自己也為他作見證。","ref":"約參 1:12"}],"outline":[{"key":"稱讚該猶","range":"1:1–4","point":"長老問安，祝福該猶凡事興盛，喜樂他按真理而行"},{"key":"接待弟兄","range":"1:5–8","point":"肯定該猶接待出外傳道的弟兄"},{"key":"丟特腓問題","range":"1:9–11","point":"丟特腓好為首，不接待弟兄，長老說來時要處理"},{"key":"推薦低米丟","range":"1:12–15","point":"低米丟有好見證；盼望當面談，彼此問安"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"約參 1:1–15","summary":"有出外傳道的弟兄回來，在教會面前證明該猶的愛心（約參 1:3、6）；長老也知道丟特腓拒絕接待弟兄的事。長老寫這封私人短信給該猶，肯定他、提醒他，並說很快要去當面談。","people":["john"]},{"key":"三個人","title":"該猶、丟特腓、低米丟","ref":"約參 1:1–12","summary":"這封信出現三個人：該猶熱心接待傳道的弟兄，長老稱讚他；丟特腓在教會中好為首，用惡言妄論長老，還把接待弟兄的人趕出教會；低米丟則有眾人給他作見證，長老推薦他。","people":[]}],"people":["john"],"verses":[{"ref":"約參 1:2","text":"親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。"},{"ref":"約參 1:4","text":"我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。"}]}},{"t":"nt","id":"jude","order":26,"name":"猶大書","abbr":"猶","chapters":1,"group":"普通書信","data":{"id":"jude","order":26,"name":"猶大書","abbr":"猶","chapters":1,"group":"普通書信","oneLine":"原本想寫救恩，卻不得不勸人為真道竭力爭辯","background":{"author":"自稱「雅各的弟兄猶大」（猶 1:1），傳統上認為是主的兄弟猶大，也有不同看法","date":"約主後 65～80 年，也有不同看法","audience":"「被召、在父神裡蒙愛、為耶穌基督保守的人」（猶 1:1）","place":"不確定","why":"猶大說他本來想寫信談大家共同的救恩，卻因為有人偷偷混進教會，把神的恩典變成放縱的機會，所以改寫這封信，勸信徒為從前一次交付聖徒的真道竭力爭辯。"},"revelations":[{"key":"竭力爭辯","point":"要為一次交付聖徒的真道竭力爭辯","explain":"這是全書的主旨：真道已經交付，不能被偷偷改掉，信徒要守住它。","ref":"猶 1:3–4"},{"key":"記取鑑戒","point":"歷史提醒：神必審判不信與放縱的","explain":"猶大用出埃及後不信的百姓、離開本位的天使、所多瑪蛾摩拉三個例子，說明神必審判。","ref":"猶 1:5–7"},{"key":"保守自己","point":"建造信心、禱告，保守自己在神的愛中","explain":"猶大要讀者在至聖的真道上造就自己，在聖靈裡禱告，等候主耶穌基督的憐憫。","ref":"猶 1:20–21"},{"key":"憐憫疑惑者","point":"有疑心的人要憐憫，有的要搶救","explain":"猶大說對有疑心的要憐憫，有的要從火中搶出來，但仍要小心自己不被沾染。","ref":"猶 1:22–23"}],"outline":[{"key":"寫信目的","range":"1:1–4","point":"問安，說明為何改寫這封信：有人偷著進來"},{"key":"三個鑑戒","range":"1:5–11","point":"舉舊約事例說明神的審判，並把這些人比作該隱、巴蘭、可拉"},{"key":"描寫與預言","range":"1:12–19","point":"用無雨的雲、無果的樹等畫面描寫他們，引以諾的預言"},{"key":"勸勉與頌讚","range":"1:20–25","point":"勸人保守自己、憐憫人，最後頌讚能保守人不失腳的神"}],"stories":[{"key":"寫信緣由","title":"寫這封信的故事","ref":"猶 1:1–4","summary":"猶大自稱是耶穌基督的僕人、雅各的弟兄。他原本想盡心寫信論共同的救恩，卻發現有人偷偷混進教會、否認主，只好改寫一封勸大家為真道爭辯的信。","people":["jude","james-brother"]},{"key":"以諾預言","title":"以諾的預言與米迦勒","ref":"猶 1:9；1:14–15","summary":"猶大提到天使長米迦勒為摩西的屍首與魔鬼爭辯時，不敢用毀謗的話，只說「主責備你吧」。他又引亞當的七世孫以諾的預言，說主帶著千萬聖者降臨審判。","people":[]}],"people":["jude","james-brother","jesus"],"verses":[{"ref":"猶 1:21","text":"保守自己常在神的愛中，仰望我們主耶穌基督的憐憫，直到永生。"}]}},{"t":"nt","id":"revelation","order":27,"name":"啟示錄","abbr":"啟","chapters":22,"group":"啟示文學","data":{"id":"revelation","order":27,"name":"啟示錄","abbr":"啟","chapters":22,"group":"啟示文學","oneLine":"約翰在拔摩島看見的異象：羔羊得勝，萬物更新","background":{"author":"作者自稱約翰（啟 1:1、1:9），傳統上認為是使徒約翰，也有不同看法","date":"約主後 95 年（羅馬皇帝多米田時期），也有人認為約 68 年","audience":"亞細亞的七個教會（啟 1:4、1:11）","place":"拔摩島（啟 1:9），愛琴海上的小島","why":"當時信徒在羅馬帝國下因信仰受壓力與逼迫，有人殉道，有教會受迫害，也有教會漸漸妥協。約翰說他為神的道和給耶穌作的見證，曾在拔摩島上，在那裡看見異象，奉命寫下來送給七個教會。"},"revelations":[{"key":"人子掌權","point":"復活的基督在教會中間掌權","explain":"開頭的異象裡，人子行在七個金燈臺中間，說他是首先的、末後的，又是那存活的。全書由這個畫面展開。","ref":"啟 1:12–20"},{"key":"聽聖靈的話","point":"每個教會都被稱讚、責備與勸勉","explain":"七封信各有不同：有的離棄起初的愛，有的受苦，有的不冷不熱。每封都有「聖靈向眾教會所說的話，凡有耳的，就應當聽」這句。","ref":"啟 2～3"},{"key":"羔羊配得","point":"只有被殺的羔羊配揭開書卷","explain":"在天上、地上、地底下都沒有誰能展開七印的書卷，直到那像是被殺過的羔羊出現，天上眾生就向他唱新歌。","ref":"啟 5"},{"key":"惡必受審","point":"這卷書描寫神最終審判一切的惡","explain":"從七印、七號到七碗，一連串審判的畫面，最後大巴比倫傾倒、獸與龍被扔在火湖裡。這些象徵的細節有不同看法。","ref":"啟 6～20"},{"key":"聖徒忍耐","point":"在逼迫中忍耐，持守信心","explain":"書中多次提到「聖徒的忍耐」，要受苦的讀者至死忠心，持守神的誡命和耶穌的真道。","ref":"啟 13:10；14:12"},{"key":"萬物更新","point":"最後有新天新地，不再有眼淚","explain":"全書結局是新天新地與新耶路撒冷，神與人同住，擦去一切的眼淚。","ref":"啟 21:1–7"},{"key":"主必快來","point":"書末三次說「我必快來」","explain":"最後一章重複「我必快來」的應許，約翰回應「主耶穌啊，我願你來」，全書以祝福作結。","ref":"啟 22:7–21"}],"outline":[{"key":"拔摩島","range":"1 章","point":"約翰在拔摩島看見人子，奉命寫信"},{"key":"七教會書信","range":"2～3 章","point":"寫給亞細亞七個教會的信"},{"key":"天上寶座","range":"4～5 章","point":"天上的寶座與敬拜；羔羊拿起七印書卷"},{"key":"印與號","range":"6～11 章","point":"揭開七印、吹響七號，一連串審判"},{"key":"龍與兩獸","range":"12～14 章","point":"婦人與龍、海中與地中上來的兩個獸、羔羊與跟隨者"},{"key":"七碗審判","range":"15～18 章","point":"倒下七碗，大巴比倫傾倒"},{"key":"白馬騎士","range":"19～20 章","point":"白馬騎士得勝、千年、白色大寶座的審判"},{"key":"新天新地","range":"21～22 章","point":"新耶路撒冷降下，生命河，「我必快來」"}],"stories":[{"key":"拔摩異象","title":"拔摩島上的異象","ref":"啟 1:9–20","summary":"約翰在拔摩島上，主日被聖靈感動，聽見身後有大聲音，轉身看見七個金燈臺中間有一位像人子的。他仆倒在腳前，那一位按手在他身上說「不要懼怕」，並吩咐他把所看見的寫下來。","people":["john","jesus"]},{"key":"七個教會","title":"給七個教會的信","ref":"啟 2～3","summary":"七封信分別寫給以弗所、士每拿、別迦摩、推雅推喇、撒狄、非拉鐵非、老底嘉。有的被稱讚忍耐受苦，有的被責備離棄起初的愛、不冷不熱，每封都應許給得勝的人賞賜。","people":["jesus"]},{"key":"寶座羔羊","title":"天上的寶座與羔羊","ref":"啟 4～5","summary":"約翰看見天上有寶座，四周有二十四位長老和四個活物晝夜敬拜。寶座上那位手中有七印封嚴的書卷，沒有誰配展開，直到猶大支派的獅子、也就是像是被殺過的羔羊上前拿起書卷。","people":["jesus"]},{"key":"七印七號","title":"揭開七印、吹響七號","ref":"啟 6:1～11:19","summary":"羔羊揭開七印，出現騎白、紅、黑、灰色馬的騎士和各種災難；第七印揭開後，七位天使吹響七號，又有一連串審判。中間插入受印的十四萬四千人、兩個見證人等畫面，這些象徵的意思有不同看法。","people":[]},{"key":"婦人與龍","title":"婦人、龍與兩個獸","ref":"啟 12～13","summary":"天上現出身披日頭的婦人生下男孩，大紅龍要吞吃他；米迦勒與龍在天上爭戰，龍被摔在地上。接著有獸從海中上來、另一獸從地中上來，逼人拜獸，書中說獸的數目是六百六十六，這些象徵的解釋有不同看法。","people":[]},{"key":"巴比倫傾倒","title":"七碗與大巴比倫傾倒","ref":"啟 15～18","summary":"七位天使把盛滿神大怒的七碗倒在地上。接著約翰看見騎在獸上的大淫婦，稱為大巴比倫，最後在一時之間傾倒，地上的君王和客商為她哀哭。","people":[]},{"key":"千年審判","title":"白馬、千年與白色大寶座","ref":"啟 19～20","summary":"天上先有羔羊婚筵的歡呼，接著天開了，騎白馬的稱為「誠信真實」，率天上的眾軍得勝。撒但被捆綁一千年，期滿後被釋放、迷惑列國，最後被扔在火湖裡；最後在白色大寶座前，死了的人都照所行的受審判。千年的意思有不同看法。","people":["jesus"]},{"key":"新耶路撒冷","title":"新天新地與新耶路撒冷","ref":"啟 21～22","summary":"約翰看見新天新地，聖城新耶路撒冷從天而降，神要與人同住，不再有死亡、悲哀、哭號、疼痛。城中有生命水的河，河兩邊有生命樹，書末有「主耶穌啊，我願你來」的回應。","people":["john","jesus"]}],"people":["john","jesus"],"verses":[{"ref":"啟 3:20","text":"看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去，我與他，他與我一同坐席。"},{"ref":"啟 21:4","text":"神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。"},{"ref":"啟 22:13","text":"我是阿拉法，我是俄梅戛；我是首先的，我是末後的；我是初，我是終。"}]}}],"people":[{"t":"ot","id":"adam-eve","era":"patriarch","full":"亞當與夏娃","name":"亞當與夏娃","note":"","data":{"id":"adam-eve","name":"亞當與夏娃","aka":"","role":"神最初造的一男一女","era":"patriarch","books":["genesis","1chronicles"],"life":[{"key":"塵土造人","event":"耶和華神用地上的塵土造人，將生氣吹在他鼻孔裡，他就成了有靈的活人。","ref":"創 2:7"},{"key":"安置伊甸","event":"神在東方的伊甸立了一個園子，把人安置在那裡修理看守，吩咐他不可吃分別善惡樹上的果子。","ref":"創 2:8–17"},{"key":"肋骨造女人","event":"亞當給一切牲畜、飛鳥、走獸起名，卻沒有遇見配偶幫助他；神使他沉睡，取下一條肋骨造成女人，領到他面前。","ref":"創 2:18–25"},{"key":"蛇的引誘","event":"蛇引誘女人吃禁果，她吃了又給丈夫，二人眼睛就明亮了，用無花果樹的葉子編作裙子。","ref":"創 3:1–7"},{"key":"躲藏推諉","event":"神呼喚那人，他們藏在園裡的樹木中；亞當說是女人給他的，女人說是蛇引誘她。","ref":"創 3:8–13"},{"key":"神的宣判","event":"神咒詛蛇，宣告女人生產多受苦楚，男人必汗流滿面才得糊口，直到歸於塵土。","ref":"創 3:14–19"},{"key":"夏娃得名","event":"亞當給妻子起名叫夏娃，因為她是眾生之母；神用皮子作衣服給他們穿。","ref":"創 3:20–21"},{"key":"逐出伊甸","event":"神打發他們出伊甸園，在園子東邊安設基路伯和發火焰的劍，把守生命樹的道路。","ref":"創 3:22–24"},{"key":"生子塞特","event":"他們生了該隱和亞伯；亞伯被殺後，夏娃又生了塞特。","ref":"創 4:1–2、25；5:3"}],"ending":"亞當共活了九百三十歲就死了（創 5:5）；聖經沒有記載夏娃的結局。新約在羅 5:12–19 與林前 15:22 用亞當和基督作對比。","takeaway":"人類的始祖，從樂園走到被逐出伊甸"}},{"t":"ot","id":"cain-abel","era":"patriarch","full":"該隱與亞伯","name":"該隱與亞伯","note":"","data":{"id":"cain-abel","name":"該隱與亞伯","aka":"","role":"亞當與夏娃的頭兩個兒子","era":"patriarch","books":["genesis"],"life":[{"key":"兄弟出生","event":"夏娃生了該隱，又生了亞伯；亞伯是牧羊的，該隱是種地的。","ref":"創 4:1–2"},{"key":"各獻供物","event":"該隱拿地裡的出產為供物獻給耶和華，亞伯也將他羊群中頭生的和羊的脂油獻上。","ref":"創 4:3–4"},{"key":"看中亞伯","event":"耶和華看中了亞伯和他的供物，看不中該隱和他的供物，該隱就大大發怒，變了臉色。","ref":"創 4:4–5"},{"key":"罪伏門前","event":"耶和華對該隱說，他若行得不好，罪就伏在門前，他卻要制伏它。","ref":"創 4:6–7"},{"key":"田間殺弟","event":"兄弟二人在田間的時候，該隱起來打他兄弟亞伯，把他殺了。","ref":"創 4:8"},{"key":"看守兄弟","event":"耶和華問亞伯在哪裡，該隱說「我不知道！我豈是看守我兄弟的嗎？」","ref":"創 4:9"},{"key":"流離飄蕩","event":"亞伯的血有聲音從地裡哀告，該隱必流離飄蕩在地上；耶和華給他立一個記號，免得人遇見他就殺他。","ref":"創 4:10–15"},{"key":"挪得建城","event":"該隱離開耶和華的面，住在伊甸東邊挪得之地，生了以諾，建造一座城，按兒子的名叫以諾。","ref":"創 4:16–17"}],"ending":"聖經沒有記載該隱的結局；夏娃後來生了塞特，說神另給她立了一個兒子代替亞伯（創 4:25）。新約在來 11:4 提到亞伯因信獻祭，約壹 3:12 提到不可像該隱。","takeaway":"第一次獻祭，也是第一宗兄弟相殘"}},{"t":"ot","id":"noah","era":"patriarch","full":"挪亞","name":"挪亞","note":"","data":{"id":"noah","name":"挪亞","aka":"","role":"造方舟度過洪水的義人","era":"patriarch","books":["genesis","1chronicles","isaiah","ezekiel"],"life":[{"key":"拉麥之子","event":"拉麥給兒子起名叫挪亞，說這個兒子必為他們的操作和手中的勞苦安慰他們。","ref":"創 5:28–29"},{"key":"蒙恩義人","event":"地上滿了強暴、全然敗壞，唯有挪亞在耶和華眼前蒙恩；他是個義人，與神同行。","ref":"創 6:5–12"},{"key":"吩咐造方舟","event":"神要用洪水毀滅凡有血肉的人，吩咐他用歌斐木造方舟，長三百肘、寬五十肘、高三十肘。","ref":"創 6:13–16"},{"key":"照樣去行","event":"神所吩咐的，挪亞都照樣行了。","ref":"創 6:22"},{"key":"全家進方舟","event":"六百歲那年，他和妻子、三個兒子閃、含、雅弗與兒婦進入方舟，活物一對一對進去，耶和華把他關在方舟裡。","ref":"創 7:1–16"},{"key":"洪水氾濫","event":"大淵的泉源都裂開，天上的窗戶也敞開，四十晝夜降大雨，水勢浩大在地上共一百五十天。","ref":"創 7:11–24"},{"key":"停亞拉臘山","event":"七月十七日，方舟停在亞拉臘山上。","ref":"創 8:1–5"},{"key":"放烏鴉鴿子","event":"他放出一隻烏鴉，又放出鴿子；第二次鴿子嘴裡叼著新擰下來的橄欖葉回來，第三次就不再回來了。","ref":"創 8:6–12"},{"key":"出方舟築壇","event":"地都乾了，他全家出了方舟，為耶和華築一座壇獻燔祭，耶和華聞那馨香之氣。","ref":"創 8:13–22"},{"key":"彩虹之約","event":"神與挪亞和他的後裔立約，不再用洪水毀壞地，把虹放在雲彩中作立約的記號。","ref":"創 9:8–17"},{"key":"醉酒咒迦南","event":"他作起農夫栽葡萄園，喝酒醉了；含看見父親赤身，閃和雅弗倒退著給父親蓋上，挪亞醒後咒詛迦南、為閃和雅弗祝福。","ref":"創 9:20–27"}],"ending":"洪水以後挪亞又活了三百五十年，共活了九百五十歲就死了（創 9:28–29）。新約在來 11:7 提到他因信預備方舟，彼後 2:5 稱他為傳義道的，太 24:37–39 耶穌提到挪亞的日子。","takeaway":"洪水中全家蒙保守，神與他立彩虹之約"}},{"t":"ot","id":"abraham","era":"patriarch","full":"亞伯拉罕","name":"亞伯拉罕","note":"","data":{"id":"abraham","name":"亞伯拉罕","aka":"亞伯蘭","role":"以色列人的始祖，蒙神呼召離鄉","era":"patriarch","books":["genesis","exodus","joshua","1chronicles","2chronicles","nehemiah","psalms","isaiah"],"life":[{"key":"吾珥出發","event":"父親他拉帶著他、姪兒羅得和妻子撒萊出了迦勒底的吾珥，要往迦南地去，走到哈蘭就住在那裡。","ref":"創 11:27–32"},{"key":"蒙召離鄉","event":"耶和華叫他離開本地、本族、父家，往他指示的地去，應許使他成為大國，地上的萬族都要因他得福；他七十五歲出哈蘭。","ref":"創 12:1–5"},{"key":"埃及稱妹","event":"遇饑荒下到埃及，怕人因撒萊美貌殺他，就說她是妹子；法老把撒萊取進宮，耶和華降大災，法老把她送回。","ref":"創 12:10–20"},{"key":"與羅得分地","event":"兩家牧人相爭，他讓羅得先選，羅得選了約旦河平原；他住在迦南地，後來搬到希伯崙幔利的橡樹那裡。","ref":"創 13:1–18"},{"key":"救回羅得","event":"四王擄走羅得，他率領家裡生養的精練壯丁三百一十八人追趕救回；撒冷王麥基洗德為他祝福，他把所得的拿出十分之一給他。","ref":"創 14:1–20"},{"key":"信就算為義","event":"神領他到外邊數天上的星，說他的後裔將要如此；「亞伯蘭信耶和華，耶和華就以此為他的義」，神又與他立約。","ref":"創 15:1–21"},{"key":"夏甲生子","event":"撒萊沒有生育，把使女夏甲給他為妾，他八十六歲時夏甲生了以實瑪利。","ref":"創 16:1–16"},{"key":"改名立割禮","event":"他九十九歲時，神把他改名叫亞伯拉罕，意思是多國的父，撒萊改名撒拉，並以割禮作立約的記號。","ref":"創 17:1–27"},{"key":"幔利接待","event":"他在帳棚門口接待三位客人，客人說明年這時候撒拉必生一個兒子。","ref":"創 18:1–15"},{"key":"為所多瑪求情","event":"他為所多瑪向耶和華求情，從五十個義人一路問到十個，耶和華說為這十個的緣故也不毀滅那城。","ref":"創 18:16–33"},{"key":"以撒出生","event":"他一百歲時撒拉生了以撒，第八日給他行了割禮。","ref":"創 21:1–7"},{"key":"打發夏甲","event":"撒拉要趕出夏甲和以實瑪利，神叫他聽撒拉的話，他就清早拿餅和一皮袋水給夏甲，打發她走。","ref":"創 21:8–14"},{"key":"獻以撒","event":"神試驗他，叫他在摩利亞地的山上把以撒獻為燔祭；他伸手拿刀時耶和華的使者攔住，他看見一隻公羊代替，給那地方起名叫耶和華以勒。","ref":"創 22:1–14"},{"key":"買麥比拉洞","event":"撒拉死在希伯崙，他用四百舍客勒銀子向赫人以弗崙買下麥比拉洞，安葬撒拉。","ref":"創 23:1–20"},{"key":"為子娶妻","event":"他差老僕人回本地本族為以撒娶妻，僕人帶回了利百加。","ref":"創 24:1–67"},{"key":"晚年再娶","event":"他又娶了基土拉，生了幾個兒子；他把一切所有的都給了以撒，把財物分給庶出的眾子，打發他們往東方去。","ref":"創 25:1–6"}],"ending":"他享壽一百七十五歲，以撒和以實瑪利把他葬在麥比拉洞（創 25:7–10）。代下 20:7、賽 41:8 稱他為神的朋友；新約在羅 4 與加 3 用他的信說明因信稱義，來 11:8–19 提到他的信心。","takeaway":"憑著神的應許離鄉，萬族因他得福"}},{"t":"ot","id":"sarah","era":"patriarch","full":"撒拉","name":"撒拉","note":"","data":{"id":"sarah","name":"撒拉","aka":"撒萊","role":"亞伯拉罕的妻子，以撒的母親","era":"patriarch","books":["genesis","isaiah"],"life":[{"key":"不能生育","event":"撒萊不生育，沒有孩子，隨丈夫從吾珥到哈蘭，再到迦南地。","ref":"創 11:29–31；12:5"},{"key":"兩度被帶走","event":"亞伯拉罕兩次說她是妹子，她先被埃及法老、後被基拉耳王亞比米勒取去，兩次都因神干預被送回。","ref":"創 12:10–20；20:1–18"},{"key":"給夏甲為妾","event":"她把使女夏甲給丈夫為妾，夏甲懷孕後小看她，她就苦待夏甲，夏甲便逃走了。","ref":"創 16:1–6"},{"key":"改名撒拉","event":"神把撒萊改名撒拉，應許她要作多國之母，必從她生一個兒子。","ref":"創 17:15–16"},{"key":"帳棚裡暗笑","event":"聽見客人說明年必生兒子，她因年紀老邁心裡暗笑；耶和華說「耶和華豈有難成的事嗎？」","ref":"創 18:9–15"},{"key":"九十生以撒","event":"她九十歲時生了以撒，說神使她喜笑，凡聽見的必與她一同喜笑。","ref":"創 17:17；21:1–7"},{"key":"趕出夏甲","event":"她看見以實瑪利戲笑，就要亞伯拉罕把使女和她的兒子趕出去。","ref":"創 21:9–10"}],"ending":"撒拉享壽一百二十七歲，死在迦南地的基列亞巴（就是希伯崙），葬在麥比拉洞（創 23:1–2、19）。新約在來 11:11 提到她因信得力懷孕，彼前 3:6 提到她順服亞伯拉罕。","takeaway":"年老蒙應許，九十歲生下以撒"}},{"t":"ot","id":"lot","era":"patriarch","full":"羅得","name":"羅得","note":"","data":{"id":"lot","name":"羅得","aka":"","role":"亞伯拉罕的姪兒","era":"patriarch","books":["genesis","deuteronomy","psalms"],"life":[{"key":"隨伯父出行","event":"他是哈蘭的兒子，父親早死，跟著祖父他拉、伯父亞伯蘭離開吾珥，後來同往迦南。","ref":"創 11:27–31；12:4–5"},{"key":"選約旦平原","event":"兩家牧人相爭，他看見約旦河的全平原都是滋潤的，就選了那地，漸漸挪移帳棚，直到所多瑪。","ref":"創 13:5–13"},{"key":"被擄獲救","event":"四王攻打所多瑪，把他和他的財物都擄去，亞伯蘭追趕把他救回。","ref":"創 14:11–16"},{"key":"城門款待","event":"兩位天使晚上到所多瑪，他正坐在城門口，起來迎接，切切地請他們到家裡住。","ref":"創 19:1–3"},{"key":"全城圍門","event":"城裡的人圍住房子要他交出客人，天使把他拉進屋，使門外的人眼都昏迷。","ref":"創 19:4–11"},{"key":"遲延被拉出","event":"女婿以為他說的是戲言；天亮時他還遲延，天使拉著他、妻子和兩個女兒的手，把他們領到城外。","ref":"創 19:12–16"},{"key":"逃往瑣珥","event":"他求准逃到小城瑣珥，耶和華將硫磺與火從天降與所多瑪和蛾摩拉。","ref":"創 19:17–25"},{"key":"妻變鹽柱","event":"他的妻子在後邊回頭一看，就變成了一根鹽柱。","ref":"創 19:26"},{"key":"住在山洞","event":"他和兩個女兒住在山洞裡，女兒使父親喝酒，後來生了摩押和便亞米，就是摩押人和亞捫人的始祖。","ref":"創 19:30–38"}],"ending":"聖經沒有記載羅得的結局。新約在路 17:28–32 耶穌提到羅得的日子，說「你們要回想羅得的妻子」；彼後 2:7 稱他為義人羅得。","takeaway":"選了富饒平原，最後從所多瑪逃出"}},{"t":"ot","id":"hagar-ishmael","era":"patriarch","full":"夏甲與以實瑪利","name":"夏甲與以實瑪利","note":"","data":{"id":"hagar-ishmael","name":"夏甲與以實瑪利","aka":"","role":"撒拉的使女與亞伯拉罕的長子","era":"patriarch","books":["genesis","1chronicles"],"life":[{"key":"埃及使女","event":"夏甲是撒萊的埃及使女，撒萊把她給亞伯蘭為妾。","ref":"創 16:1–3"},{"key":"懷孕逃走","event":"她懷孕後小看主母，撒萊苦待她，她就逃走了。","ref":"創 16:4–6"},{"key":"看顧人的神","event":"耶和華的使者在書珥路上的水泉旁遇見她，叫她回去，給孩子起名以實瑪利；她稱耶和華為「看顧人的神」。","ref":"創 16:7–14"},{"key":"以實瑪利出生","event":"亞伯蘭八十六歲時，夏甲生了以實瑪利。","ref":"創 16:15–16"},{"key":"受割禮蒙福","event":"神應許使以實瑪利昌盛，要生十二個族長，成為大國；他十三歲受了割禮。","ref":"創 17:20–25"},{"key":"被打發離開","event":"以撒斷奶後，撒拉看見以實瑪利戲笑，要趕他們走，亞伯拉罕給了餅和一皮袋水打發他們。","ref":"創 21:8–14"},{"key":"曠野得井","event":"在別是巴的曠野水用盡了，夏甲把孩子撇在小樹底下放聲大哭；神開了她的眼睛，她看見一口水井。","ref":"創 21:15–19"},{"key":"巴蘭弓箭手","event":"以實瑪利住在巴蘭的曠野，成了弓箭手，母親從埃及地給他娶了妻子。","ref":"創 21:20–21"},{"key":"同葬父親","event":"亞伯拉罕死後，以撒和以實瑪利把他葬在麥比拉洞。","ref":"創 25:9"}],"ending":"以實瑪利生了十二個兒子，作了十二族的族長，享壽一百三十七歲（創 25:12–17）；聖經沒有記載夏甲的結局。新約在加 4:21–31 用夏甲與撒拉比喻兩約。","takeaway":"被趕出的母子，在曠野遇見看顧人的神"}},{"t":"ot","id":"isaac","era":"patriarch","full":"以撒","name":"以撒","note":"","data":{"id":"isaac","name":"以撒","aka":"","role":"亞伯拉罕與撒拉的應許之子","era":"patriarch","books":["genesis","exodus","1chronicles","psalms","amos"],"life":[{"key":"應許之子","event":"亞伯拉罕一百歲、撒拉九十歲時生了他，起名以撒，第八日受割禮。","ref":"創 21:1–5"},{"key":"摩利亞山上","event":"父親帶他上山獻燔祭，他背著柴問羊羔在哪裡；被捆在壇上時使者攔住，以一隻公羊代替。","ref":"創 22:1–14"},{"key":"娶利百加","event":"他四十歲娶利百加為妻，傍晚在田間默想時看見駱駝來了；他母親死後，他因利百加得了安慰。","ref":"創 24:62–67；25:20"},{"key":"祈求得雙子","event":"利百加不生育，他為妻子祈求耶和華，六十歲時生了以掃和雅各。","ref":"創 25:21–26"},{"key":"基拉耳稱妹","event":"遇饑荒住在基拉耳，他也說妻子是妹子，被非利士王亞比米勒識破。","ref":"創 26:1–11"},{"key":"百倍收成","event":"他在那地耕種，那一年有百倍的收成；非利士人嫉妒塞住他的井，他一再挖井，後來在別是巴築壇。","ref":"創 26:12–25"},{"key":"被騙祝福","event":"他年老眼睛昏花，利百加和雅各假扮以掃，他把長子的祝福給了雅各。","ref":"創 27:1–40"},{"key":"送雅各出走","event":"他吩咐雅各不要娶迦南女子，打發他往巴旦亞蘭的舅舅拉班家去。","ref":"創 28:1–5"}],"ending":"以撒享壽一百八十歲，以掃和雅各把他埋葬（創 35:28–29），葬在麥比拉洞（創 49:31）。新約在來 11:20 提到他因信給雅各、以掃祝福，加 4:28 說信徒是憑著應許作兒女，如同以撒一樣。","takeaway":"應許之子，承接亞伯拉罕的約"}},{"t":"ot","id":"rebekah","era":"patriarch","full":"利百加","name":"利百加","note":"","data":{"id":"rebekah","name":"利百加","aka":"","role":"以撒的妻子，以掃與雅各的母親","era":"patriarch","books":["genesis"],"life":[{"key":"井邊打水","event":"亞伯拉罕的老僕人在拿鶴城外井旁禱告，利百加來打水，給他喝，也為駱駝打水。","ref":"創 24:10–21"},{"key":"願意同去","event":"家人問她肯不肯同這人去，她說「我去」。","ref":"創 24:57–58"},{"key":"嫁給以撒","event":"她見到以撒就用帕子蒙上臉，以撒娶她為妻，並且愛她。","ref":"創 24:62–67"},{"key":"雙子相爭","event":"以撒為她祈求，她懷了雙胞胎，孩子在腹中彼此相爭；耶和華說將來大的要服事小的。","ref":"創 25:21–23"},{"key":"偏愛雅各","event":"以撒愛以掃，利百加卻愛雅各。","ref":"創 25:27–28"},{"key":"基拉耳稱妹","event":"以撒在基拉耳說她是妹子，亞比米勒從窗戶看見以撒與她戲玩，才識破了。","ref":"創 26:6–11"},{"key":"策劃騙福","event":"她叫雅各取兩隻山羊羔做以撒愛吃的美味，給他穿上以掃的衣服，手和頸項包上山羊羔皮。","ref":"創 27:5–17"},{"key":"送子避禍","event":"聽說以掃要殺雅各，她叫雅各逃往哈蘭她哥哥拉班那裡，等哥哥的怒氣消了再回來。","ref":"創 27:41–46"}],"ending":"聖經沒有記載她的死；創 35:8 提到她的奶母底波拉死了，創 49:31 說她葬在麥比拉洞。新約在羅 9:10–12 提到她懷雙子時得的話「大的要服事小的」。","takeaway":"主動離鄉出嫁，也為雅各主導騙福"}},{"t":"ot","id":"jacob","era":"patriarch","full":"雅各","name":"雅各","note":"","data":{"id":"jacob","name":"雅各","aka":"以色列","role":"以撒的兒子，以色列十二支派之父","era":"patriarch","books":["genesis","exodus","1chronicles","psalms","isaiah","hosea","malachi"],"life":[{"key":"抓腳跟出生","event":"他和以掃是雙胞胎，出生時手抓住以掃的腳跟，所以起名雅各。","ref":"創 25:24–26"},{"key":"紅湯換名分","event":"以掃從田野回來累昏了，雅各用餅和紅豆湯換了他長子的名分。","ref":"創 25:29–34"},{"key":"假扮騙福","event":"他照母親的安排假扮以掃，騙得父親以撒的祝福。","ref":"創 27:1–29"},{"key":"逃往哈蘭","event":"以掃要殺他，他離開別是巴往哈蘭去。","ref":"創 27:41～28:10"},{"key":"伯特利天梯","event":"路上枕著石頭睡覺，夢見梯子立在地上、梯子的頭頂著天，神的使者上去下來，耶和華應許與他同在；他給那地方起名叫伯特利。","ref":"創 28:10–22"},{"key":"為拉結七年","event":"他在舅舅拉班家為娶拉結服事七年，因為深愛拉結，就看這七年如同幾天。","ref":"創 29:1–20"},{"key":"被換成利亞","event":"拉班在婚禮晚上把利亞送給他，他又為拉結多服事了七年。","ref":"創 29:21–30"},{"key":"生眾兒女","event":"利亞、拉結和使女辟拉、悉帕為他生了十一個兒子和女兒底拿。","ref":"創 29:31～30:24"},{"key":"有斑點的羊","event":"他和拉班約定以有點、有斑的羊為工價，羊群極其發大；後來帶著家眷財物離開，拉班追上後兩人在基列山立約。","ref":"創 30:25～31:55"},{"key":"雅博渡口摔跤","event":"回鄉前夜在雅博渡口，有一人與他摔跤直到黎明，摸了他的大腿窩，給他改名叫以色列。","ref":"創 32:22–32"},{"key":"與以掃和好","event":"他一連七次俯伏，以掃跑來迎接他，抱著他與他親嘴，兩人就哭了。","ref":"創 33:1–4"},{"key":"示劍之變","event":"女兒底拿在示劍受辱，西緬和利未殺了城中所有的男丁，雅各責備他們。","ref":"創 34:1–31"},{"key":"回伯特利","event":"他叫全家除掉外邦神，回伯特利築壇；拉結在往以法他的路上生便雅憫時死了。","ref":"創 35:1–20"},{"key":"以為約瑟死","event":"兒子們把沾血的彩衣帶回，他以為約瑟被惡獸吃了，為兒子悲哀了許多日子。","ref":"創 37:31–35"},{"key":"全家下埃及","event":"得知約瑟還活著，他帶全家共七十人下埃及，在歌珊與約瑟相見，又見了法老。","ref":"創 45:25～46:30；47:7–10"},{"key":"臨終祝福","event":"他交叉雙手為約瑟的兩個兒子以法蓮和瑪拿西祝福，又為十二個兒子一一祝福。","ref":"創 48:1–20；49:1–28"}],"ending":"他在埃及住了十七年，享壽一百四十七歲（創 47:28）；他吩咐兒子把他葬在麥比拉洞，就氣絕而死（創 49:29–33），約瑟將他送回迦南安葬（創 50:1–13）。新約在來 11:21 提到他因信給約瑟的兩個兒子祝福。","takeaway":"從抓腳跟的人改名以色列，生出十二支派"}},{"t":"ot","id":"esau","era":"patriarch","full":"以掃","name":"以掃","note":"","data":{"id":"esau","name":"以掃","aka":"以東","role":"以撒的長子，以東人的祖先","era":"patriarch","books":["genesis","deuteronomy","joshua","1chronicles","obadiah","malachi"],"life":[{"key":"渾身有毛","event":"他是雙胞胎中先出生的，身體發紅，渾身有毛如同皮衣，就起名叫以掃。","ref":"創 25:24–25"},{"key":"善於打獵","event":"他善於打獵，常在田野；以撒愛他，因為常吃他的野味。","ref":"創 25:27–28"},{"key":"輕看長子名分","event":"打獵回來累昏了，他用長子的名分換了雅各的紅豆湯，這就是他輕看了長子的名分。","ref":"創 25:29–34"},{"key":"娶赫人女子","event":"他四十歲娶了兩個赫人女子，她們常使以撒和利百加心裡愁煩。","ref":"創 26:34–35"},{"key":"失去祝福","event":"他打獵回來才知道祝福已給了雅各，就放聲痛哭，求父親也為他祝福。","ref":"創 27:30–40"},{"key":"想殺雅各","event":"他因這祝福怨恨雅各，心裡說等父親居喪的日子到了，就要殺雅各。","ref":"創 27:41"},{"key":"帶四百人迎","event":"二十年後雅各回來，他帶著四百人來迎接，跑去抱住雅各與他親嘴，兩人都哭了。","ref":"創 32:6；33:1–16"},{"key":"同葬父親","event":"以撒死後，以掃和雅各一同埋葬他。","ref":"創 35:29"},{"key":"住西珥山","event":"他帶著妻子兒女和財物離開雅各，住在西珥山；以掃就是以東。","ref":"創 36:6–8"}],"ending":"他的後代成為以東人（創 36:9、43），俄巴底亞書就是對以掃的後代以東說的預言。新約在來 12:16–17 說他因一點食物把長子的名分賣了，羅 9:13 引用瑪 1:2–3。","takeaway":"為一碗湯賣了名分，日後與弟弟和好"}},{"t":"ot","id":"leah-rachel","era":"patriarch","full":"利亞與拉結","name":"利亞與拉結","note":"","data":{"id":"leah-rachel","name":"利亞與拉結","aka":"","role":"雅各的兩位妻子，拉班的女兒","era":"patriarch","books":["genesis","ruth","jeremiah"],"life":[{"key":"井邊相遇","event":"雅各在哈蘭井旁遇見牧羊的拉結，為她把石頭轉離井口、飲舅舅的羊，又親了拉結，放聲而哭。","ref":"創 29:9–12"},{"key":"姊妹之別","event":"利亞的眼睛沒有神氣，拉結卻生得美貌俊秀，雅各愛拉結。","ref":"創 29:16–18"},{"key":"婚夜被換","event":"拉班把利亞送進去，雅各到早晨才發現，又為拉結服事了七年。","ref":"創 29:21–30"},{"key":"利亞生子","event":"耶和華見利亞失寵，使她生育，她生了流便、西緬、利未、猶大，生猶大時說「這回我要讚美耶和華」。","ref":"創 29:31–35"},{"key":"使女代生","event":"拉結不生育，就嫉妒姊姊，把使女辟拉給雅各，生了但和拿弗他利；利亞也把使女悉帕給雅各，生了迦得和亞設。","ref":"創 30:1–13"},{"key":"風茄之換","event":"拉結用風茄向利亞換雅各同寢，利亞又生了以薩迦、西布倫和女兒底拿。","ref":"創 30:14–21"},{"key":"拉結生約瑟","event":"神顧念拉結，她生了約瑟。","ref":"創 30:22–24"},{"key":"偷父神像","event":"隨雅各離開時，拉結偷了父親家中的神像，藏在駱駝的馱簍裡，坐在上面。","ref":"創 31:19、34–35"},{"key":"拉結難產","event":"在往以法他的路上，拉結生便雅憫時難產而死，雅各在她墳上立了一統碑。","ref":"創 35:16–20"}],"ending":"拉結葬在往以法他（就是伯利恆）的路旁（創 35:19–20），利亞葬在麥比拉洞（創 49:31）。得 4:11 的祝福提到建立以色列家的拉結、利亞二人；新約在太 2:18 引用耶 31:15「拉結哭她兒女」。","takeaway":"一對相爭的姊妹，共同建立以色列家"}},{"t":"ot","id":"joseph-ot","era":"patriarch","full":"約瑟（雅各的兒子）","name":"約瑟","note":"雅各的兒子","data":{"id":"joseph-ot","name":"約瑟","aka":"雅各的兒子","role":"雅各的兒子，後來作埃及宰相","era":"patriarch","books":["genesis","exodus","joshua","psalms"],"life":[{"key":"父親偏愛","event":"雅各愛約瑟過於眾子，給他做了一件彩衣，哥哥們就恨他。","ref":"創 37:3–4"},{"key":"兩個夢","event":"他夢見哥哥們的禾捆向他的禾捆下拜，又夢見日頭、月亮和十一個星向他下拜，哥哥們越發恨他。","ref":"創 37:5–11"},{"key":"被賣埃及","event":"十七歲時去看望哥哥，被剝了彩衣丟進坑裡，猶大提議把他賣給以實瑪利人，得了二十舍客勒銀子。","ref":"創 37:2、12–28"},{"key":"波提乏家","event":"他被賣給法老的護衛長波提乏，耶和華與他同在，主人派他管理家務和一切所有的。","ref":"創 39:1–6"},{"key":"拒絕誘惑","event":"主人的妻子天天勾引他，他不聽，把衣裳丟在她手裡逃走，反被誣告下在監裡。","ref":"創 39:7–20"},{"key":"獄中解夢","event":"他在監裡管理眾囚犯，為酒政和膳長解夢，三天後都應驗了，酒政卻忘了他。","ref":"創 39:21～40:23"},{"key":"法老之夢","event":"過了兩年，法老夢見七隻肥母牛、七隻瘦母牛，又夢見七個肥大的穗子和七個細弱的穗子，酒政才想起他。","ref":"創 41:1–14"},{"key":"七豐七荒","event":"他說解夢不在乎他，乃在乎神；夢的意思是七個豐年之後有七個荒年，建議選人積存糧食。","ref":"創 41:15–36"},{"key":"宰相治國","event":"三十歲時法老立他治理埃及全地，給他娶了亞西納為妻，生了瑪拿西和以法蓮。","ref":"創 41:37–52"},{"key":"哥哥來糴糧","event":"饑荒時哥哥們來埃及糴糧，向他下拜卻認不出他；他說他們是奸細，留下西緬作押。","ref":"創 42:1–24"},{"key":"便雅憫的杯","event":"哥哥們帶著便雅憫再來，他設筵款待，又把自己的銀杯藏在便雅憫的口袋裡試驗他們。","ref":"創 43:1～44:13"},{"key":"猶大代罪","event":"猶大求他讓自己留下作奴僕，代替便雅憫，免得父親悲痛而死。","ref":"創 44:14–34"},{"key":"相認痛哭","event":"他放聲大哭，對哥哥們說「我是約瑟」，又說差他到這裡來的不是他們，乃是神。","ref":"創 45:1–15"},{"key":"接父歌珊","event":"他套車到歌珊迎接父親，伏在父親的頸項上哭了許久，又安排全家住在歌珊。","ref":"創 46:28～47:12"},{"key":"惡意變善","event":"父親死後哥哥們怕他報仇，他說他們的意思是要害他，但神的意思原是好的，要保全許多人的性命。","ref":"創 50:15–21"}],"ending":"約瑟享壽一百一十歲，死前叫以色列人起誓將來把他的骸骨帶上去，人用香料薰了他，收殮在棺材裡，停在埃及（創 50:22–26）；出埃及時摩西帶著他的骸骨（出 13:19），後來葬在示劍（書 24:32）。新約在來 11:22 提到他臨終題起以色列族要出埃及，徒 7:9–16 司提反述說他的故事。","takeaway":"被賣為奴，神使他成了保全全家的人"}},{"t":"ot","id":"moses","era":"exodus","full":"摩西","name":"摩西","note":"","data":{"id":"moses","name":"摩西","aka":"","role":"領以色列人出埃及的領袖","era":"exodus","books":["exodus","leviticus","numbers","deuteronomy","joshua","psalms"],"life":[{"key":"蒲草箱","event":"生在利未家，法老下令把希伯來男嬰丟在河裡；母親藏了他三個月，放進蒲草箱擱在河邊，法老的女兒把他收養，給他起名叫摩西。","ref":"出 1:22～2:10"},{"key":"殺人逃亡","event":"長大後看見埃及人打希伯來人，就把埃及人打死，藏在沙土裡；事情傳開，他逃到米甸地。","ref":"出 2:11–15"},{"key":"米甸娶妻","event":"在米甸井旁幫祭司的女兒們飲羊，娶了西坡拉，生了革舜，替岳父牧羊多年。","ref":"出 2:16–22；3:1"},{"key":"荊棘火焰","event":"在何烈山看見荊棘被火燒著卻沒有燒毀；神呼叫他去領百姓出埃及，向他說「我是自有永有的」；他一再推辭，神就叫他哥哥亞倫替他說話。","ref":"出 3:1～4:17"},{"key":"見法老","event":"他和亞倫對法老說「容我的百姓去」，法老不但不准，反而加重以色列人做磚的苦工。","ref":"出 5:1–21"},{"key":"十災","event":"從河水變血到埃及長子被擊殺，耶和華藉摩西在埃及降下十樣災，那時摩西八十歲。","ref":"出 7～12；7:7"},{"key":"逾越節","event":"吩咐各家宰羊羔，把血塗在門框和門楣上；滅命的經過就越過這些房屋，當夜以色列人離開埃及。","ref":"出 12:1–42"},{"key":"過紅海","event":"埃及兵車追到海邊，摩西向海伸杖，海水分開，以色列人走乾地過去；埃及軍兵被回流的海水淹沒。","ref":"出 14"},{"key":"嗎哪磐石水","event":"在曠野百姓發怨言，耶和華從天降下嗎哪，又叫摩西擊打何烈的磐石流出水來。","ref":"出 16～17:7"},{"key":"西奈頒律","event":"在西奈山領受十條誡和律例，耶和華把兩塊用指頭寫的石版交給他。","ref":"出 19～20；31:18"},{"key":"金牛犢","event":"他在山上四十晝夜，百姓逼亞倫鑄金牛犢；他下山摔碎法版，後來為百姓代求，重新鑿了兩塊石版。","ref":"出 32～34"},{"key":"建造會幕","event":"出埃及第二年正月初一把會幕立起來，雲彩遮蓋會幕，耶和華的榮光充滿帳幕。","ref":"出 40:17–34"},{"key":"十二探子","event":"從巴蘭曠野打發十二個人窺探迦南；百姓聽了十個人的惡信就哭號，耶和華定他們要在曠野漂流四十年。","ref":"民 13～14"},{"key":"擊打磐石","event":"在米利巴百姓又因沒水爭鬧，他用杖擊打磐石兩下，水就流出；耶和華說他不信、不尊耶和華為聖，不得領百姓進迦南。","ref":"民 20:2–13"},{"key":"舉銅蛇","event":"百姓說怨言被火蛇咬，摩西照吩咐造一條銅蛇掛在桿子上，被咬的人一望就活了。","ref":"民 21:4–9"},{"key":"摩押重述","event":"在約旦河東的摩押地向百姓重述律法，並在眾人面前勉勵約書亞接續帶領。","ref":"申 1:1–5；31:1–8"}],"ending":"他上尼波山的毘斯迦山頂，看了耶和華應許的地，就死在摩押地，年一百二十歲，眼目沒有昏花，精神沒有衰敗；耶和華把他埋葬，到今日沒有人知道他的墳墓（申 34:1–7）。經上說以後以色列中再沒有興起先知像摩西的（申 34:10）。新約在登山變像時記他與以利亞向耶穌顯現（太 17:3），來 11:23–29 提到他的信心。","takeaway":"從被丟在河邊的嬰孩，到領全民出埃及、領受律法"}},{"t":"ot","id":"aaron","era":"exodus","full":"亞倫","name":"亞倫","note":"","data":{"id":"aaron","name":"亞倫","aka":"","role":"摩西的哥哥，以色列第一任大祭司","era":"exodus","books":["exodus","leviticus","numbers","deuteronomy"],"life":[{"key":"作摩西的口","event":"摩西推說自己拙口笨舌，耶和華叫亞倫替他對百姓說話；亞倫到曠野迎接摩西，一同向以色列長老傳話。","ref":"出 4:14–16、27–31"},{"key":"杖吞術士杖","event":"在法老面前丟下杖變成蛇，埃及術士的杖也變成蛇，亞倫的杖卻吞了他們的杖。","ref":"出 7:8–13"},{"key":"扶摩西手","event":"以色列與亞瑪力人爭戰，他和戶珥一左一右扶著摩西的手，直到日落，約書亞得勝。","ref":"出 17:8–13"},{"key":"鑄金牛犢","event":"摩西在山上久不下來，百姓要他作神像，他收了金環鑄成牛犢；摩西責問時，他推說是百姓逼的。","ref":"出 32:1–6、21–24"},{"key":"受膏承接聖職","event":"摩西照耶和華吩咐為他和他的兒子們穿聖衣、膏油，立為祭司；第八天他首次獻祭，火從耶和華面前出來燒盡祭物。","ref":"利 8～9"},{"key":"兩子遭火","event":"他的兒子拿答、亞比戶獻上耶和華沒有吩咐的凡火，有火從耶和華面前出來把他們燒滅，亞倫就默默不言。","ref":"利 10:1–3"},{"key":"毀謗摩西","event":"他和米利暗因摩西娶古實女子毀謗摩西，說耶和華豈不也藉他們說話。","ref":"民 12:1–9"},{"key":"杖發芽","event":"十二支派各拿一根杖放在法櫃前，第二天只有亞倫的杖發芽、開花、結了熟杏，證明耶和華揀選他的家作祭司。","ref":"民 17:1–10"}],"ending":"因米利巴的事不得進迦南；在何珥山上，摩西把他的聖衣脫下給他的兒子以利亞撒穿上，亞倫就死在山頂，全家為他哀哭三十天（民 20:23–29），年一百二十三歲（民 33:39）。新約來 5:4 以他作蒙神所召作大祭司的例子。","takeaway":"替摩西發言、立為大祭司，也有軟弱跌倒的時候"}},{"t":"ot","id":"miriam","era":"exodus","full":"米利暗","name":"米利暗","note":"","data":{"id":"miriam","name":"米利暗","aka":"","role":"摩西與亞倫的姊姊，女先知","era":"exodus","books":["exodus","numbers","deuteronomy","micah"],"life":[{"key":"看守弟弟","event":"摩西被放在河邊時，他的姊姊遠遠站著看他怎樣，又主動替法老的女兒找來孩子的母親當奶媽；經文沒有寫這位姊姊的名字，傳統上認為就是米利暗。","ref":"出 2:4–8"},{"key":"海邊擊鼓","event":"過紅海後，女先知米利暗手裡拿著鼓，婦女都跟著擊鼓跳舞，她應聲說「你們要歌頌耶和華，因他大大戰勝，將馬和騎馬的投在海中。」","ref":"出 15:20–21"},{"key":"毀謗摩西","event":"她和亞倫因摩西所娶的古實女子毀謗摩西，說耶和華不單藉摩西說話。","ref":"民 12:1–2"},{"key":"長大痲瘋","event":"耶和華在會幕門口責備他們；雲彩離開後，米利暗長了大痲瘋，像雪那樣白。","ref":"民 12:4–10"},{"key":"營外七天","event":"摩西為她向耶和華哀求，她被關在營外七天，百姓等她回來才起行。","ref":"民 12:13–15"}],"ending":"以色列人到了尋的曠野，住在加低斯，米利暗死在那裡，就葬在那裡（民 20:1）。後來申 24:9 提醒百姓記得她的事，彌 6:4 把摩西、亞倫和米利暗並列為耶和華差在百姓前面的人。","takeaway":"帶領婦女歌頌得救，也因毀謗受了管教"}},{"t":"ot","id":"pharaoh","era":"exodus","full":"法老（出埃及記）","name":"法老","note":"出埃及記","data":{"id":"pharaoh","name":"法老","aka":"出埃及記裡的埃及王，聖經沒有記名字","role":"不肯放以色列人走的埃及王","era":"exodus","books":["exodus","psalms"],"life":[{"key":"前王苦待","event":"先前有不認識約瑟的新王興起，派督工的轄制以色列人，又下令把希伯來男嬰丟在河裡；出 2:23 說那王死了，後來與摩西交涉的是繼位的法老。","ref":"出 1:8–22；2:23"},{"key":"不認耶和華","event":"摩西、亞倫請他容百姓去曠野守節，他回答說自己不認識耶和華，也不容以色列人去。","ref":"出 5:1–2"},{"key":"加重苦工","event":"他下令不再給百姓草，造磚的數目卻不減，以色列的官長因此挨打。","ref":"出 5:6–19"},{"key":"心硬反悔","event":"十災當中他幾次答應放人，災一停又反悔；經文說法老硬著心，也說耶和華使法老的心剛硬。","ref":"出 7～11；8:15；9:12"},{"key":"長子之災","event":"半夜埃及所有長子都被擊殺，從法老的長子到被擄囚在監裡之人的長子；他夜裡起來叫摩西、亞倫帶百姓走。","ref":"出 12:29–32"},{"key":"追趕兵車","event":"百姓走後他又後悔，帶著六百輛特選的車和埃及所有的車追到海邊。","ref":"出 14:5–9"},{"key":"全軍覆沒","event":"埃及人追進海中，海水回流淹沒車輛和馬兵，法老的全軍沒有剩下一個。","ref":"出 14:23–28"}],"ending":"出 14:28 與 15:4 說法老的車輛軍兵沉在海中，經文沒有明寫法老本人的下場；詩 136:15 說耶和華把法老和他的軍兵推翻在紅海裡。他是哪一位埃及王，聖經沒有寫，有不同看法。新約羅 9:17 引用了神對法老說的話（出 9:16）。","takeaway":"一再硬心不放人，最後軍兵沉入海中"}},{"t":"ot","id":"joshua","era":"exodus","full":"約書亞","name":"約書亞","note":"","data":{"id":"joshua","name":"約書亞","aka":"何西阿","role":"摩西的接班人，帶以色列人進迦南","era":"exodus","books":["exodus","numbers","deuteronomy","joshua","judges"],"life":[{"key":"戰亞瑪力","event":"摩西叫他選人出去與亞瑪力人爭戰，摩西在山頂舉手，約書亞用刀殺敗了亞瑪力王和他的百姓。","ref":"出 17:8–13"},{"key":"摩西幫手","event":"他是摩西的幫手，跟摩西上神的山；摩西回營後，他常不離開會幕。","ref":"出 24:13；33:11"},{"key":"窺探迦南","event":"他是十二探子之一，原名何西阿，摩西稱他為約書亞；回來後他和迦勒撕裂衣服，勸百姓不要背叛耶和華、不要怕那地的人。","ref":"民 13:8、16；14:6–9"},{"key":"按手接任","event":"耶和華叫摩西在以利亞撒和會眾面前為他按手；因摩西曾按手在他頭上，他被智慧的靈充滿，以色列人都聽從他。","ref":"民 27:18–23；申 34:9"},{"key":"剛強壯膽","event":"摩西死後耶和華對他說「我豈沒有吩咐你嗎？你當剛強壯膽！」，要他晝夜思想律法書。","ref":"書 1:1–9"},{"key":"過約旦河","event":"抬約櫃的祭司腳一入河水，上游的水就停住立起成壘，百姓走乾地過河，又從河中取十二塊石頭立為記念。","ref":"書 3～4"},{"key":"耶利哥城","event":"照耶和華吩咐，百姓繞城六天、第七天繞七次，祭司吹角、百姓呼喊，城牆就塌陷。","ref":"書 6"},{"key":"艾城成敗","event":"亞干私取當滅的物，以色列在艾城敗退；處理了亞干的事後，約書亞用伏兵攻取艾城。","ref":"書 7～8"},{"key":"基遍之約","event":"基遍人假裝從遠方來，以色列人沒有求問耶和華就與他們立約；後來五個亞摩利王攻打基遍，約書亞去救。","ref":"書 9～10:11"},{"key":"日月停住","event":"他在戰場上禱告，說日頭停在基遍、月亮停在亞雅崙谷，日頭就停留約有一日之久。","ref":"書 10:12–14"},{"key":"拈鬮分地","event":"攻取迦南許多王之後，他在示羅拈鬮，把地分給各支派為業。","ref":"書 11～19；18:10"},{"key":"示劍立約","event":"晚年在示劍召集眾支派，要百姓選擇事奉誰，並說「至於我和我家，我們必定事奉耶和華。」","ref":"書 24:1–28"}],"ending":"耶和華的僕人約書亞一百一十歲死了，葬在以法蓮山地他地業境內的亭拿西拉（書 24:29–30）；他在世和他以後的長老在世的日子，以色列人事奉耶和華（書 24:31）。新約來 4:8 提到他。","takeaway":"從摩西的幫手到帶百姓進迦南、分地立約的領袖"}},{"t":"ot","id":"caleb","era":"exodus","full":"迦勒","name":"迦勒","note":"","data":{"id":"caleb","name":"迦勒","aka":"","role":"十二探子之一，專一跟從耶和華","era":"exodus","books":["numbers","deuteronomy","joshua","judges"],"life":[{"key":"猶大探子","event":"他是耶孚尼的兒子，代表猶大支派去窺探迦南地。","ref":"民 13:6"},{"key":"安撫百姓","event":"探子回報那地的人強壯，迦勒在摩西面前安撫百姓，說我們立刻上去得那地，足能得勝。","ref":"民 13:30"},{"key":"撕衣勸阻","event":"百姓要另立首領回埃及，他和約書亞撕裂衣服，說耶和華若喜悅我們，必領我們進那地。","ref":"民 14:6–10"},{"key":"另有心志","event":"耶和華說「惟獨我的僕人迦勒，因他另有一個心志，專一跟從我」，應許他和後裔要得他所去過的地。","ref":"民 14:24"},{"key":"兩人存活","event":"出埃及時二十歲以上被數點的人都死在曠野，只剩下迦勒和約書亞。","ref":"民 26:64–65"},{"key":"求這山地","event":"八十五歲時他對約書亞說自己仍像當年一樣強壯，求把耶和華那日應許的山地給他，約書亞就把希伯崙給他為業。","ref":"書 14:6–14"},{"key":"趕出亞衲族","event":"他從希伯崙趕出亞衲族的三個族長，又許諾誰攻取底璧，就把女兒押撒嫁給誰；俄陀聶攻取了那城。","ref":"書 15:13–17"},{"key":"賜女水泉","event":"押撒向父親求水泉，迦勒就把上泉下泉都給了她。","ref":"書 15:18–19"}],"ending":"聖經沒有記載他怎麼死；士 1:20 說以色列人照摩西所說的把希伯崙給了迦勒。","takeaway":"專一跟從耶和華，八十五歲仍要那座山地"}},{"t":"ot","id":"rahab","era":"exodus","full":"喇合","name":"喇合","note":"","data":{"id":"rahab","name":"喇合","aka":"","role":"耶利哥城的妓女，藏了以色列探子","era":"exodus","books":["joshua"],"life":[{"key":"探子入城","event":"約書亞從什亭暗暗打發兩個探子去耶利哥，他們進了妓女喇合的家。","ref":"書 2:1"},{"key":"藏匿探子","event":"耶利哥王派人來要人，她把探子藏在房頂的麻稭中，對來人說他們已經出城走了。","ref":"書 2:2–7"},{"key":"說出所聞","event":"她告訴探子，城裡的人聽見耶和華使紅海乾了、以色列人怎樣待約旦河東的兩個亞摩利王，心都消化了。","ref":"書 2:8–11"},{"key":"朱紅線繩","event":"她求探子保全她一家，用繩子從窗戶把他們縋下城牆；雙方約定攻城時她要把朱紅線繩繫在窗戶上。","ref":"書 2:12–21"},{"key":"全家得救","event":"耶利哥城倒塌後，約書亞叫那兩個探子把喇合和她父母、弟兄並一切所有的領出來，她就住在以色列中。","ref":"書 6:22–25"}],"ending":"約書亞記說她住在以色列中直到今日（書 6:25），沒有記她的晚年。新約提到她：太 1:5 說撒門從喇合氏生波阿斯，來 11:31 與雅 2:25 提到她接待探子的事。","takeaway":"耶利哥城中藏探子的婦人，全家得保全"}},{"t":"ot","id":"balaam","era":"exodus","full":"巴蘭","name":"巴蘭","note":"","data":{"id":"balaam","name":"巴蘭","aka":"","role":"比珥的兒子，被請來咒詛以色列","era":"exodus","books":["numbers","deuteronomy","joshua","nehemiah","micah"],"life":[{"key":"巴勒來請","event":"摩押王巴勒懼怕以色列人，差長老帶著卜卦的禮金，去請比珥的兒子巴蘭來咒詛這百姓。","ref":"民 22:1–7"},{"key":"神不許去","event":"神對他說不可同去、不可咒詛；巴勒再派更尊貴的使臣，神准他去，但只能說神吩咐的話。","ref":"民 22:8–21"},{"key":"驢子開口","event":"路上耶和華的使者擋路，驢看見就三次躲開，巴蘭打驢；耶和華叫驢開口說話，巴蘭的眼睛才明亮，看見使者。","ref":"民 22:22–35"},{"key":"轉咒為福","event":"巴勒帶他到三處高地築壇獻祭，他三次開口卻都祝福以色列，巴勒向他發怒。","ref":"民 23～24:11"},{"key":"星出雅各","event":"臨走前他說預言：「有星要出於雅各」，並說到摩押等國的結局。","ref":"民 24:15–25"},{"key":"毘珥之計","event":"以色列人在什亭與摩押女子行淫、拜巴力毘珥；後來摩西說，這是照巴蘭的計謀叫以色列人得罪耶和華。","ref":"民 25:1–3；31:16"}],"ending":"以色列人攻打米甸時，用刀殺了比珥的兒子巴蘭（民 31:8；書 13:22）。後來申 23:4–5 與尼 13:2 說耶和華使他的咒詛變為祝福。新約彼後 2:15、猶 1:11、啟 2:14 都提到巴蘭的事。","takeaway":"受雇要咒詛以色列，開口卻成了祝福"}},{"t":"ot","id":"deborah-barak","era":"judges","full":"底波拉與巴拉","name":"底波拉與巴拉","note":"","data":{"id":"deborah-barak","name":"底波拉與巴拉","aka":"","role":"女士師與以色列將領","era":"judges","books":["judges"],"life":[{"key":"耶賓欺壓","event":"以色列人又行耶和華眼中看為惡的事，迦南王耶賓的將軍西西拉有鐵車九百輛，大大欺壓以色列人二十年。","ref":"士 4:1–3"},{"key":"棕樹下審判","event":"女先知底波拉是拉比多的妻，那時作以色列的士師，住在拉瑪和伯特利中間底波拉的棕樹下，百姓都上她那裡去聽判斷。","ref":"士 4:4–5"},{"key":"召巴拉出兵","event":"她召巴拉帶一萬人上他泊山；巴拉說你若同去我就去，她答應同去，但說榮耀要歸一個婦人。","ref":"士 4:6–10"},{"key":"基順河得勝","event":"巴拉從他泊山下來，耶和華使西西拉和他的車輛全軍潰亂，西西拉下車步行逃跑，全軍倒在刀下。","ref":"士 4:12–16"},{"key":"雅億殺將","event":"西西拉逃進基尼人希百之妻雅億的帳棚，趁他熟睡時，雅億用帳棚的橛子釘入他的鬢角。","ref":"士 4:17–22"},{"key":"底波拉之歌","event":"那日底波拉和巴拉作歌，記述這場勝仗，稱讚甘心犧牲的百姓，也稱讚雅億。","ref":"士 5"}],"ending":"這樣國中太平四十年（士 5:31）。聖經沒有記載兩人的結局。新約來 11:32 提到巴拉。","takeaway":"女士師與將軍同心出戰，擊敗迦南大軍"}},{"t":"ot","id":"gideon","era":"judges","full":"基甸","name":"基甸","note":"","data":{"id":"gideon","name":"基甸","aka":"耶路巴力","role":"帶三百人擊敗米甸的士師","era":"judges","books":["judges","1samuel"],"life":[{"key":"米甸欺壓","event":"以色列人行惡，耶和華把他們交在米甸人手裡七年，米甸人每到收成就來毀壞土產，百姓躲進山洞。","ref":"士 6:1–6"},{"key":"酒醡打麥","event":"他在酒醡那裡打麥子，免得被米甸人看見；耶和華的使者向他顯現說「大能的勇士啊，耶和華與你同在！」","ref":"士 6:11–24"},{"key":"拆巴力壇","event":"他夜間照吩咐拆毀他父親的巴力壇、砍下木偶，城裡的人要治死他，他父親約阿施替他說話，從此他又叫耶路巴力。","ref":"士 6:25–32"},{"key":"羊毛求證","event":"他兩次用一團羊毛求證：先是只有羊毛有露水、地上是乾的，再是羊毛乾、地上都有露水，神都照著行了。","ref":"士 6:36–40"},{"key":"揀選三百","event":"他召來三萬二千人，耶和華說人太多，先讓懼怕的回去，再在水邊試驗，只留下用手捧水舔的三百人。","ref":"士 7:1–8"},{"key":"角燈瓶夜襲","event":"三百人分三隊，手拿角和藏著火把的空瓶，夜裡吹角打破瓶子，喊著「耶和華和基甸的刀」，米甸營中自相擊殺。","ref":"士 7:16–22"},{"key":"不肯作王","event":"以色列人求他和子孫管理他們，他說我不管理你們，惟有耶和華管理你們。","ref":"士 8:22–23"},{"key":"以弗得網羅","event":"他用百姓獻上的金耳環造了一個以弗得，放在俄弗拉，以色列人在那裡拜它，成了基甸和他家的網羅。","ref":"士 8:24–27"}],"ending":"米甸被制伏，基甸在世的日子國中太平四十年；他年紀老邁而死，葬在亞比以謝族的俄弗拉，在他父親約阿施的墳墓裡；他死後以色列人又去拜巴力（士 8:28–33）。新約來 11:32 提到他。","takeaway":"膽小的農夫，用三百人和角燈瓶打敗米甸"}},{"t":"ot","id":"jephthah","era":"judges","full":"耶弗他","name":"耶弗他","note":"","data":{"id":"jephthah","name":"耶弗他","aka":"","role":"基列的勇士，擊敗亞捫的士師","era":"judges","books":["judges","1samuel"],"life":[{"key":"被兄弟趕","event":"基列人耶弗他是大能的勇士，是妓女的兒子；他的兄弟們把他趕出去，他就逃到陀伯地，有匪徒聚集跟隨他。","ref":"士 11:1–3"},{"key":"長老來請","event":"亞捫人攻打以色列，基列的長老到陀伯地請他回來作元帥，他要他們應許日後立他作首領。","ref":"士 11:4–11"},{"key":"遣使講理","event":"他差人去見亞捫王，述說以色列人當年怎樣得這地，亞捫王卻不聽。","ref":"士 11:12–28"},{"key":"出戰許願","event":"耶和華的靈降在他身上，他向耶和華許願，說若得勝回來，凡先從他家門出來迎接他的，必歸耶和華，獻為燔祭。","ref":"士 11:29–31"},{"key":"戰勝亞捫","event":"他攻打亞捫人，耶和華把他們交在他手中，亞捫人就被以色列人制伏了。","ref":"士 11:32–33"},{"key":"女兒出迎","event":"他回家時，他的獨生女拿著鼓跳舞出來迎接；女兒請求兩個月與同伴在山上哀哭，回來後父親照所許的願向她行了，此後以色列女子每年去為她哀哭四天。","ref":"士 11:34–40"},{"key":"示播列","event":"以法蓮人責怪他出戰沒有叫他們，雙方交戰；基列人把守約旦河渡口，叫人說「示播列」，說不出的就殺，那時以法蓮人死了四萬二千。","ref":"士 12:1–6"}],"ending":"耶弗他作以色列的士師六年，死後葬在基列的一座城裡（士 12:7）。撒上 12:11 撒母耳提到他，新約來 11:32 也提到他。","takeaway":"被趕出家門的勇士，得勝後付上許願的代價"}},{"t":"ot","id":"samson","era":"judges","full":"參孫","name":"參孫","note":"","data":{"id":"samson","name":"參孫","aka":"","role":"力大無窮的拿細耳人士師","era":"judges","books":["judges"],"life":[{"key":"天使預告","event":"瑪挪亞的妻子不生育，耶和華的使者向她顯現，說她要生兒子，這孩子一出胎就歸神作拿細耳人，不可用剃頭刀剃頭。","ref":"士 13:2–24"},{"key":"徒手撕獅","event":"他要娶亭拿的非利士女子，路上遇見少壯獅子，耶和華的靈大大感動他，他徒手把獅子撕裂。","ref":"士 14:1–6"},{"key":"筵席謎語","event":"婚宴上他出謎語給三十個陪伴，對方逼他的妻子套出謎底，他就到亞實基倫殺了三十人，拿衣裳給猜謎的人。","ref":"士 14:10–19"},{"key":"狐狸燒田","event":"岳父把他的妻子給了別人，他捉了三百隻狐狸，尾巴綁上火把，燒了非利士人的禾稼、橄欖園。","ref":"士 15:1–5"},{"key":"驢腮骨","event":"猶大人把他捆綁交給非利士人，繩子像火燒的麻一樣脫落，他用一塊未乾的驢腮骨擊殺了一千人。","ref":"士 15:9–17"},{"key":"扛走城門","event":"他到迦薩，非利士人埋伏要殺他，他半夜起來把城門、門框、門閂拆下，扛到希伯崙前的山頂上。","ref":"士 16:1–3"},{"key":"大利拉","event":"他喜愛梭烈谷的大利拉，非利士首領買通她探問他力氣的來源；她一再催逼，他終於說出頭髮的秘密，頭髮被剃，力氣就離開了他。","ref":"士 16:4–20"},{"key":"剜眼推磨","event":"非利士人剜了他的眼睛，帶到迦薩，用銅鍊拘索他，叫他在監裡推磨；他的頭髮又漸漸長起來。","ref":"士 16:21–22"},{"key":"推倒廟柱","event":"非利士人在大袞廟裡慶祝，叫他出來戲耍；他求耶和華再賜他一次力量，抱住托房的兩根柱子，房子倒塌，壓死首領和眾人。","ref":"士 16:23–30"}],"ending":"他死時所殺的人比活著所殺的還多；他的弟兄和父的全家把他抬上去，葬在瑣拉和以實陶中間他父親瑪挪亞的墳墓裡；參孫作以色列的士師二十年（士 16:30–31）。新約來 11:32 提到他。","takeaway":"力氣過人卻放縱私慾，臨終一搏擊敗非利士人"}},{"t":"ot","id":"ruth","era":"judges","full":"路得","name":"路得","note":"","data":{"id":"ruth","name":"路得","aka":"","role":"摩押女子，大衛的曾祖母","era":"judges","books":["ruth"],"life":[{"key":"摩押媳婦","event":"士師秉政時有饑荒，拿俄米一家移居摩押，路得嫁給拿俄米的兒子瑪倫；後來拿俄米的丈夫和兩個兒子都死了。","ref":"得 1:1–5；4:10"},{"key":"不肯離開","event":"拿俄米要回猶大，勸兩個媳婦回娘家，俄珥巴走了，路得卻捨不得她，說「你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。」","ref":"得 1:6–18"},{"key":"田間拾穗","event":"她們在收大麥的時候回到伯利恆，路得出去拾麥穗，恰巧到了以利米勒的親族波阿斯那塊田裡。","ref":"得 1:22～2:3"},{"key":"蒙波阿斯厚待","event":"波阿斯聽說她孝順婆婆，叫她只在他的田裡拾取，吩咐僕人故意抽出些穗子留給她。","ref":"得 2:8–17"},{"key":"禾場夜臥","event":"照婆婆的話，她夜裡到禾場，躺在波阿斯腳下，請他用衣襟遮蓋她，因為他是至近的親屬。","ref":"得 3:1–13"},{"key":"嫁波阿斯","event":"波阿斯在城門口辦妥贖產的事，娶了路得，她生了一個兒子，起名叫俄備得。","ref":"得 4:9–17"}],"ending":"俄備得是耶西的父，耶西是大衛的父（得 4:17）；鄰舍的婦人說這兒媳比七個兒子還好（得 4:15）。新約太 1:5 說波阿斯從路得氏生俄備得。","takeaway":"跟定婆婆來到伯利恆，成為大衛家譜裡的人"}},{"t":"ot","id":"naomi","era":"judges","full":"拿俄米","name":"拿俄米","note":"","data":{"id":"naomi","name":"拿俄米","aka":"瑪拉","role":"路得的婆婆，伯利恆婦人","era":"judges","books":["ruth"],"life":[{"key":"饑荒移居","event":"猶大伯利恆遭饑荒，她和丈夫以利米勒帶著兩個兒子瑪倫、基連往摩押地去寄居。","ref":"得 1:1–2"},{"key":"喪夫喪子","event":"丈夫死了，兩個兒子娶了摩押女子，住了約十年，兩個兒子也死了。","ref":"得 1:3–5"},{"key":"勸媳回家","event":"她聽說耶和華眷顧他的百姓賜糧食，就要回猶大，勸兩個媳婦各回娘家；俄珥巴與她親嘴而去，路得卻跟著她。","ref":"得 1:6–18"},{"key":"改名瑪拉","event":"回到伯利恆，全城都驚訝；她說不要再叫她拿俄米（甜），要叫她瑪拉（苦），因為全能者使她受了大苦。","ref":"得 1:19–21"},{"key":"指點路得","event":"她認出波阿斯是至近的親屬，教路得夜裡到禾場去見他，又叫她安坐等候事情的結局。","ref":"得 2:20；3:1–4、18"},{"key":"抱孫養育","event":"路得生了兒子，她把孩子抱在懷中作他的養母，鄰舍的婦人說拿俄米得了孩子，給他起名叫俄備得。","ref":"得 4:14–17"}],"ending":"聖經沒有記載她的結局；路得記以她抱孫、家譜延續到大衛作結（得 4:16–22）。","takeaway":"從空空回鄉的苦，到抱孫延續家族"}},{"t":"ot","id":"boaz","era":"judges","full":"波阿斯","name":"波阿斯","note":"","data":{"id":"boaz","name":"波阿斯","aka":"","role":"伯利恆的財主，路得的丈夫","era":"judges","books":["ruth","1chronicles"],"life":[{"key":"以利米勒親族","event":"他是以利米勒的親族，是個大財主，住在伯利恆。","ref":"得 2:1"},{"key":"問安收割人","event":"他從伯利恆來到田間，對收割的人說願耶和華與你們同在，他們也祝福他。","ref":"得 2:4"},{"key":"厚待路得","event":"他聽說路得怎樣待婆婆，叫她不要往別人田裡去，吃飯時給她烘了的穗子，又吩咐僕人故意抽出穗子留給她。","ref":"得 2:5–16"},{"key":"禾場許諾","event":"夜裡發現路得躺在他腳下，他稱讚她，答應盡親屬的本分，但說還有一個比他更近的親屬。","ref":"得 3:8–13"},{"key":"城門贖產","event":"他在城門口請來那位至近的親屬和十個長老，那人不肯贖產，脫鞋給他為證，波阿斯就買下以利米勒家的產業。","ref":"得 4:1–10"},{"key":"娶路得","event":"他娶了路得，耶和華使她懷孕生了兒子俄備得。","ref":"得 4:13–17"}],"ending":"聖經沒有記載他的結局。他的家譜是撒門生波阿斯，波阿斯生俄備得，俄備得生耶西，耶西生大衛（得 4:21–22；代上 2:11–12）。新約太 1:5 說撒門從喇合氏生波阿斯。","takeaway":"厚待外邦寡婦、盡親屬本分的伯利恆財主"}},{"t":"ot","id":"hannah","era":"judges","full":"哈拿","name":"哈拿","note":"","data":{"id":"hannah","name":"哈拿","aka":"","role":"撒母耳的母親","era":"judges","books":["1samuel"],"life":[{"key":"不能生育","event":"她是以法蓮山地以利加拿的妻子，沒有兒女；另一個妻子毘尼拿有兒女，常激動她，她就哭泣不吃飯。","ref":"撒上 1:1–8"},{"key":"殿中許願","event":"在示羅她心裡愁苦痛哭禱告，許願說若賜她一個兒子，必使他終身歸給耶和華，不用剃頭刀剃他的頭。","ref":"撒上 1:9–11"},{"key":"被誤醉酒","event":"她只動嘴唇不出聲，祭司以利以為她喝醉了；她說明自己是心裡愁苦，以利就祝福她，她從此面上不再帶愁容。","ref":"撒上 1:12–18"},{"key":"生撒母耳","event":"耶和華顧念她，她懷孕生了兒子，起名叫撒母耳，說這是從耶和華那裡求來的。","ref":"撒上 1:19–20"},{"key":"獻子歸主","event":"孩子斷奶後，她帶著祭物把他領到示羅耶和華的殿，交給以利，說把這孩子歸與耶和華。","ref":"撒上 1:24–28"},{"key":"哈拿之歌","event":"她禱告作歌，說耶和華使人貧窮也使人富足，使人卑微也使人高貴。","ref":"撒上 2:1–10"},{"key":"年年做外袍","event":"她每年和丈夫上來獻年祭的時候，給撒母耳做一件小外袍帶來。","ref":"撒上 2:19"},{"key":"再得兒女","event":"以利為她夫婦祝福，耶和華眷顧她，她又生了三個兒子兩個女兒。","ref":"撒上 2:20–21"}],"ending":"聖經沒有記載她的結局。","takeaway":"愁苦中禱告求子，又把兒子獻給耶和華"}},{"t":"ot","id":"eli","era":"judges","full":"以利","name":"以利","note":"","data":{"id":"eli","name":"以利","aka":"","role":"示羅的祭司，作士師四十年","era":"judges","books":["1samuel","1kings"],"life":[{"key":"示羅祭司","event":"他在示羅耶和華的殿作祭司，常坐在殿的門框旁邊的位上，他的兒子何弗尼、非尼哈也在那裡作祭司。","ref":"撒上 1:3、9"},{"key":"祝福哈拿","event":"他誤以為哈拿喝醉而責備她，聽她說明後，就祝福她所求的必蒙應允。","ref":"撒上 1:12–17"},{"key":"兒子作惡","event":"以利的兩個兒子是惡人，不認識耶和華，強取祭肉、藐視祭物；以利年老聽說了只是勸說，卻沒有禁止。","ref":"撒上 2:12–25；3:13"},{"key":"神人警告","event":"有神人來見以利，說他尊重兒子過於尊重耶和華，他的家必衰敗，兩個兒子要在一日之間死亡。","ref":"撒上 2:27–36"},{"key":"教撒母耳應","event":"耶和華夜裡三次呼喚撒母耳，以利明白是耶和華在呼喚，就教撒母耳回答請說，僕人敬聽。","ref":"撒上 3:1–10"},{"key":"聽完審判","event":"他要撒母耳把耶和華所說的全告訴他，聽完了說這是出於耶和華，願他憑自己的意旨而行。","ref":"撒上 3:15–18"},{"key":"約櫃被擄","event":"以色列人與非利士人爭戰，把約櫃抬到營中，結果大敗，約櫃被擄去，何弗尼、非尼哈都被殺。","ref":"撒上 4:1–11"}],"ending":"他聽見約櫃被擄，就從位上往後跌倒，在門旁折斷頸項而死，因為他年紀老邁、身體沉重；那時他九十八歲，作以色列的士師四十年（撒上 4:12–18）。後來所羅門革除亞比亞他的祭司職任，應驗了耶和華在示羅論以利家的話（王上 2:27）。","takeaway":"帶大撒母耳的祭司，卻沒有管教自己的兒子"}},{"t":"ot","id":"samuel","era":"judges","full":"撒母耳","name":"撒母耳","note":"","data":{"id":"samuel","name":"撒母耳","aka":"","role":"最後一位士師，也是先知","era":"judges","books":["1samuel","1chronicles","psalms","jeremiah"],"life":[{"key":"求來的孩子","event":"哈拿禱告求子而生，起名撒母耳，說他是從耶和華那裡求來的；斷奶後被送到示羅交給以利。","ref":"撒上 1:20–28"},{"key":"殿中事奉","event":"他還是孩子時，穿著細麻布的以弗得在耶和華面前事奉，漸漸長大，耶和華與人都喜愛他。","ref":"撒上 2:18、26"},{"key":"夜裡蒙召","event":"他睡在耶和華的殿裡，耶和華呼喚他，他照以利教的回答「請說，僕人敬聽！」，耶和華告訴他以利家要受的審判。","ref":"撒上 3:1–18"},{"key":"立為先知","event":"耶和華與他同在，他的話一句都沒有落空；從但到別是巴的以色列人都知道他被立為耶和華的先知。","ref":"撒上 3:19–21"},{"key":"米斯巴悔改","event":"他叫以色列人除掉外邦神，聚集在米斯巴禁食認罪；非利士人來攻，耶和華大發雷聲，非利士人被打敗。","ref":"撒上 7:3–11"},{"key":"以便以謝","event":"他立一塊石頭，給石頭起名叫以便以謝，說「到如今耶和華都幫助我們。」","ref":"撒上 7:12"},{"key":"巡行審判","event":"他平生作以色列的士師，每年巡行伯特利、吉甲、米斯巴，然後回到拉瑪的家。","ref":"撒上 7:15–17"},{"key":"百姓求王","event":"他年老時兒子不行他的道，長老們說「現在求你為我們立一個王治理我們，像列國一樣。」，他不喜悅，但耶和華叫他依從。","ref":"撒上 8:1–22"},{"key":"膏立掃羅","event":"耶和華指示他膏立便雅憫人掃羅，他拿瓶膏油倒在掃羅頭上，後來在米斯巴當眾抽籤立王。","ref":"撒上 9～10"},{"key":"告別演說","event":"他在百姓面前問自己可曾虧負誰，眾人都說沒有；他又說斷不停止為百姓禱告。","ref":"撒上 12:1–5、23"},{"key":"責備掃羅","event":"掃羅沒有照命令滅盡亞瑪力人，撒母耳對他說「聽命勝於獻祭；順從勝於公羊的脂油。」，宣告耶和華厭棄他作王。","ref":"撒上 15:1–35"},{"key":"膏立大衛","event":"耶和華差他到伯利恆耶西家，說「人是看外貌；耶和華是看內心」，他就膏立耶西最小的兒子大衛。","ref":"撒上 16:1–13"}],"ending":"撒母耳死了，以色列眾人聚集為他哀哭，把他葬在拉瑪他的墳墓裡（撒上 25:1）；之後撒上 28 記掃羅到隱多珥找交鬼的婦人求問撒母耳。耶 15:1 與詩 99:6 把他與摩西並提；新約徒 3:24、13:20 與來 11:32 都提到他。","takeaway":"從殿中蒙召的孩子，到膏立兩位君王的先知士師"}},{"t":"ot","id":"saul","era":"kingdom","full":"掃羅","name":"掃羅","note":"","data":{"id":"saul","name":"掃羅","aka":"基士的兒子","role":"以色列第一位王，便雅憫人","era":"kingdom","books":["1samuel","2samuel","1chronicles"],"life":[{"key":"尋驢遇先知","event":"便雅憫人基士的兒子掃羅，身材比眾民高過一頭，出門尋找父親走失的驢，遇見撒母耳。","ref":"撒上 9:1–20"},{"key":"受膏為君","event":"撒母耳拿瓶膏油倒在他頭上，膏他作耶和華產業的君。","ref":"撒上 10:1"},{"key":"米斯巴掣籤","event":"撒母耳在米斯巴召集百姓掣籤，掣出掃羅，他卻藏在器具中，被找出來後百姓呼喊願王萬歲。","ref":"撒上 10:17–24"},{"key":"救雅比基列","event":"亞捫人圍攻基列雅比，掃羅招聚百姓擊敗亞捫人，眾人在吉甲立他為王。","ref":"撒上 11"},{"key":"擅自獻祭","event":"在吉甲等不到撒母耳，自己獻上燔祭；撒母耳說他的王位必不長久。","ref":"撒上 13:8–14"},{"key":"違命亞瑪力","event":"奉命滅亞瑪力人，卻留下亞甲王和上好的牛羊；撒母耳說「聽命勝於獻祭；順從勝於公羊的脂油」，耶和華厭棄他作王。","ref":"撒上 15"},{"key":"惡魔攪擾","event":"耶和華的靈離開掃羅，有惡魔攪擾他，僕人找來會彈琴的大衛在他面前彈琴。","ref":"撒上 16:14–23"},{"key":"嫉妒大衛","event":"婦女唱「掃羅殺死千千，大衛殺死萬萬」，他從那日起就怒視大衛，兩次拿槍要刺他。","ref":"撒上 18:6–11"},{"key":"追殺大衛","event":"帶兵在曠野追趕大衛，大衛在洞裡只割下他的衣襟，後來又只拿走他的槍和水瓶，兩次不殺他。","ref":"撒上 24；26"},{"key":"殺挪伯祭司","event":"聽說祭司亞希米勒幫助大衛，就命多益殺了挪伯的祭司八十五人。","ref":"撒上 22:9–19"},{"key":"隱多珥交鬼","event":"非利士人大軍壓境，他求問耶和華得不著回答，就改裝去找隱多珥交鬼的婦人，要招撒母耳上來。","ref":"撒上 28:4–25"},{"key":"基利波山戰死","event":"在基利波山與非利士人交戰，三個兒子陣亡，他受了重傷，自己伏在刀上死了。","ref":"撒上 31:1–6"}],"ending":"撒上 31:4 記他自己伏在刀上而死；撒下 1:6–10 有一個亞瑪力人向大衛說是他把掃羅殺了。代上 10:13–14 說掃羅死是因為干犯耶和華、不遵守耶和華的命、又求問交鬼的婦人。大衛為他和約拿單作哀歌（撒下 1:17–27）。新約在徒 13:21 提到神將基士的兒子掃羅給以色列人作王。","takeaway":"有好的開始，卻因不聽命失去王位"}},{"t":"ot","id":"david","era":"kingdom","full":"大衛","name":"大衛","note":"","data":{"id":"david","name":"大衛","aka":"耶西的兒子","role":"以色列第二位王，寫下許多詩篇","era":"kingdom","books":["ruth","1samuel","2samuel","1kings","1chronicles","psalms"],"life":[{"key":"伯利恆牧羊","event":"伯利恆人耶西的小兒子，在野地放羊；路得記結尾的家譜記他是波阿斯與路得的曾孫。","ref":"撒上 16:11；得 4:17"},{"key":"少年受膏","event":"耶和華差撒母耳到耶西家，說「人是看外貌；耶和華是看內心」，撒母耳在兄弟中膏了大衛。","ref":"撒上 16:1–13"},{"key":"為王彈琴","event":"惡魔攪擾掃羅時，大衛被召進宮彈琴，掃羅就舒暢爽快。","ref":"撒上 16:14–23"},{"key":"擊殺歌利亞","event":"在以拉谷，他用機弦甩出一塊石子打中非利士巨人歌利亞的額，非利士人就逃跑。","ref":"撒上 17"},{"key":"逃避掃羅","event":"掃羅嫉妒要殺他，妻子米甲把他從窗戶縋下去，他從此逃亡，躲在亞杜蘭洞與曠野。","ref":"撒上 19:11–12；22:1–2"},{"key":"不殺受膏者","event":"在隱基底的洞裡只割下掃羅的外袍衣襟，說不敢伸手害耶和華的受膏者；後來又只拿走掃羅的槍和水瓶。","ref":"撒上 24；26"},{"key":"寄居洗革拉","event":"他帶六百人投靠迦特王亞吉，得了洗革拉為住處。","ref":"撒上 27:1–7"},{"key":"希伯崙作王","event":"掃羅死後，猶大人在希伯崙膏他作猶大家的王。","ref":"撒下 2:1–4"},{"key":"統一以色列","event":"以色列眾長老也來膏他作全以色列的王，他三十歲登基，作王四十年。","ref":"撒下 5:1–5"},{"key":"奪取錫安","event":"攻取耶布斯人的錫安保障，就是大衛的城，定都耶路撒冷。","ref":"撒下 5:6–9"},{"key":"迎約櫃跳舞","event":"把約櫃從俄別以東家抬上大衛城，他穿細麻布以弗得在耶和華面前極力跳舞，米甲心裡輕視他。","ref":"撒下 6:12–23"},{"key":"大衛之約","event":"他想為約櫃建殿，耶和華藉拿單說要為他建立家室，使他的國位堅定直到永遠。","ref":"撒下 7:1–17"},{"key":"拔示巴事件","event":"他與烏利亞的妻子拔示巴同房，又寫信叫約押把烏利亞派到陣勢極險之處戰死。","ref":"撒下 11"},{"key":"拿單責備","event":"拿單用富戶奪窮人羊羔的比喻對他說「你就是那人」，他承認得罪了耶和華；詩篇 51 篇的標題說這篇詩是拿單來見他以後作的。","ref":"撒下 12:1–13；詩 51 標題"},{"key":"押沙龍叛變","event":"兒子押沙龍在希伯崙稱王，大衛逃離耶路撒冷；押沙龍戰死後，他放聲哀哭。","ref":"撒下 15～18"},{"key":"立所羅門","event":"年紀老邁時亞多尼雅自立為王，大衛照著向拔示巴起的誓，命人膏所羅門作王。","ref":"王上 1"}],"ending":"大衛與他列祖同睡
