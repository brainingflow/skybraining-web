，葬在大衛城；他作以色列王四十年，在希伯崙七年、在耶路撒冷三十三年（王上 2:10–11）。新約馬太福音家譜開頭稱耶穌基督是大衛的子孫（太 1:1），徒 13:22 稱他是合神心意的人。","takeaway":"牧羊少年成為王，跌倒後認罪仍被記念"}},{"t":"ot","id":"jonathan","era":"kingdom","full":"約拿單","name":"約拿單","note":"","data":{"id":"jonathan","name":"約拿單","aka":"掃羅的兒子","role":"掃羅的長子，大衛的知心朋友","era":"kingdom","books":["1samuel","2samuel","1chronicles"],"life":[{"key":"密抹突襲","event":"他只帶著拿兵器的人爬上山崖，攻擊非利士人的防營，非利士營中大大戰兢。","ref":"撒上 14:1–15"},{"key":"誤嘗蜂蜜","event":"不知道父親起誓不准百姓在晚上以前吃東西，用杖蘸了蜂蜜吃；掃羅要殺他，百姓把他救下。","ref":"撒上 14:24–45"},{"key":"與大衛結盟","event":"大衛殺了歌利亞後，約拿單的心與大衛的心相連，脫下外袍、刀、弓、腰帶送給大衛，兩人結盟。","ref":"撒上 18:1–4"},{"key":"替友求情","event":"掃羅要殺大衛，他替大衛向父親說好話，掃羅一度起誓不殺大衛。","ref":"撒上 19:1–7"},{"key":"射箭暗號","event":"在初一的筵席上確認父親定意要殺大衛，掃羅甚至拿槍要刺他；第二天他在田野用射箭的話語暗示大衛逃走，兩人哭著分別。","ref":"撒上 20"},{"key":"樹林堅固","event":"大衛躲在西弗曠野，約拿單到樹林裡去見他，使他倚靠神得以堅固，兩人在耶和華面前立約。","ref":"撒上 23:15–18"},{"key":"基利波陣亡","event":"非利士人在基利波山追殺掃羅，約拿單和兩個兄弟一同陣亡。","ref":"撒上 31:2"},{"key":"弓歌哀悼","event":"大衛作哀歌，說「我兄約拿單哪，我為你悲傷」。","ref":"撒下 1:17–27"},{"key":"恩待其子","event":"大衛為約拿單的緣故，恩待他瘸腿的兒子米非波設，叫他常與王同席吃飯。","ref":"撒下 9"}],"ending":"在基利波山與父親一同陣亡（撒上 31:2）；後來大衛把掃羅和約拿單的骸骨葬在便雅憫的洗拉、基士的墳墓裡（撒下 21:12–14）。","takeaway":"身為王子，卻真心成全朋友作王"}},{"t":"ot","id":"bathsheba","era":"kingdom","full":"拔示巴","name":"拔示巴","note":"","data":{"id":"bathsheba","name":"拔示巴","aka":"代上 3:5 作拔書亞","role":"烏利亞的妻，後為所羅門之母","era":"kingdom","books":["2samuel","1kings","1chronicles","psalms"],"life":[{"key":"烏利亞之妻","event":"她是以連的女兒、赫人烏利亞的妻子；大衛在王宮平頂上看見她沐浴，打聽之後召她來同房。","ref":"撒下 11:2–4"},{"key":"懷孕告王","event":"她懷了孕，打發人告訴大衛；大衛設法讓烏利亞死在戰場上。","ref":"撒下 11:5–17"},{"key":"入宮為妻","event":"為丈夫哀哭的日子過了，大衛把她接到宮裡作妻子。","ref":"撒下 11:26–27"},{"key":"孩子夭折","event":"拿單責備大衛之後，她為大衛生的孩子得病，第七日死了。","ref":"撒下 12:15–18"},{"key":"生所羅門","event":"她又生了一個兒子，起名叫所羅門，耶和華也喜愛他，拿單給他起名叫耶底底亞。","ref":"撒下 12:24–25"},{"key":"進宮立王","event":"亞多尼雅自立為王時，她照拿單的提醒進去見大衛，提起王曾起誓立所羅門，大衛就命人膏所羅門。","ref":"王上 1:11–31"},{"key":"太后之座","event":"所羅門作王後，她為亞多尼雅求娶亞比煞；王為她設座在右邊，卻沒有答應這請求。","ref":"王上 2:13–25"}],"ending":"聖經沒有記載她的結局；最後一次出現是為亞多尼雅向所羅門求情（王上 2:19–22）。新約馬太福音家譜提到「烏利亞的妻子」生所羅門（太 1:6）。","takeaway":"從烏利亞之妻，成為新王的母親"}},{"t":"ot","id":"nathan","era":"kingdom","full":"拿單","name":"拿單","note":"","data":{"id":"nathan","name":"拿單","aka":"先知拿單","role":"大衛與所羅門時代的先知","era":"kingdom","books":["2samuel","1kings","1chronicles","2chronicles","psalms"],"life":[{"key":"建殿之問","event":"大衛說想為約櫃建殿，拿單先說可以照心意去行；當夜耶和華的話臨到他，要他轉告大衛不必建殿。","ref":"撒下 7:1–7"},{"key":"傳大衛之約","event":"他向大衛傳達耶和華的應許：大衛的後裔要為耶和華的名建殿，國位要堅定直到永遠。","ref":"撒下 7:8–17"},{"key":"羊羔比喻","event":"大衛犯了拔示巴和烏利亞的事，拿單講富戶奪窮人一隻小母羊羔的比喻，然後說「你就是那人」。","ref":"撒下 12:1–12"},{"key":"宣告赦免","event":"大衛認罪，拿單說耶和華已經除掉他的罪，他必不至於死，但所生的孩子必定要死。","ref":"撒下 12:13–14"},{"key":"起名耶底底亞","event":"所羅門出生後，耶和華差遣拿單給他起名叫耶底底亞。","ref":"撒下 12:25"},{"key":"擁立所羅門","event":"亞多尼雅自立為王，拿單和拔示巴先後進宮提醒大衛；大衛命撒督和拿單在基訓膏所羅門作王。","ref":"王上 1:11–40"},{"key":"記錄史事","event":"歷代志說大衛和所羅門的事記在先知拿單的書上，大衛也照拿單的命設立利未人在聖殿彈琴作樂。","ref":"代上 29:29；代下 9:29；代下 29:25"}],"ending":"聖經沒有記載他的結局。","takeaway":"敢對王說真話，也幫王找回正路"}},{"t":"ot","id":"absalom","era":"kingdom","full":"押沙龍","name":"押沙龍","note":"","data":{"id":"absalom","name":"押沙龍","aka":"大衛的兒子","role":"大衛的三子，起兵篡位","era":"kingdom","books":["2samuel","1kings","1chronicles","2chronicles","psalms"],"life":[{"key":"基述外孫","event":"他是大衛在希伯崙所生的第三個兒子，母親瑪迦是基述王達買的女兒。","ref":"撒下 3:3"},{"key":"為妹報仇","event":"同父異母的哥哥暗嫩玷辱了他的妹妹他瑪；兩年後他在剪羊毛的筵席上叫僕人殺了暗嫩。","ref":"撒下 13:1–29"},{"key":"逃往基述","event":"殺人後逃到基述，在那裡住了三年。","ref":"撒下 13:37–38"},{"key":"提哥亞婦人","event":"約押安排提哥亞的婦人向大衛說故事，大衛就准押沙龍回耶路撒冷，但兩年不見王的面。","ref":"撒下 14:1–28"},{"key":"燒田求見","event":"他叫僕人放火燒約押的大麥田，約押才替他去見王，大衛與他親嘴和好。","ref":"撒下 14:29–33"},{"key":"城門收人心","event":"他常早起站在城門的道旁，攔住要告狀的人，說王沒有派人聽你，這樣暗中得了以色列人的心。","ref":"撒下 15:1–6"},{"key":"希伯崙稱王","event":"他藉口到希伯崙還願，在那裡發動叛變，大衛的謀士亞希多弗也跟隨他，大衛逃離耶路撒冷。","ref":"撒下 15:7–16"},{"key":"戶篩之計","event":"他聽了戶篩的計謀，沒有照亞希多弗的計策立刻追趕大衛，大衛因此有時間渡過約旦河。","ref":"撒下 17:1–22"},{"key":"樹林喪命","event":"兩軍在以法蓮樹林交戰，他騎騾經過大橡樹下被密枝纏住懸在半空，約押用三杆短槍刺透他的心；大衛哭著說「我兒押沙龍啊」。","ref":"撒下 18:6–33"}],"ending":"被約押刺死，屍體丟在林中大坑裡，上面堆起一大堆石頭（撒下 18:14–17）；他生前曾在王谷立了一根石柱，稱為押沙龍柱（撒下 18:18）。","takeaway":"容貌出眾、會收人心，最後死在叛亂中"}},{"t":"ot","id":"solomon","era":"kingdom","full":"所羅門","name":"所羅門","note":"","data":{"id":"solomon","name":"所羅門","aka":"耶底底亞","role":"大衛之子，以智慧和建殿聞名","era":"kingdom","books":["2samuel","1kings","2kings","1chronicles","2chronicles","ezra","nehemiah","psalms","proverbs","ecclesiastes","song-of-songs","jeremiah"],"life":[{"key":"蒙愛出生","event":"大衛與拔示巴所生，耶和華喜愛他，拿單給他起名叫耶底底亞。","ref":"撒下 12:24–25"},{"key":"基訓受膏","event":"亞多尼雅自立為王時，大衛命撒督和拿單在基訓膏所羅門作王，約主前 970 年。","ref":"王上 1:32–40"},{"key":"鞏固王位","event":"登基後除掉亞多尼雅和約押，革去祭司亞比亞他的職分，國位就堅定了。","ref":"王上 2:13–46"},{"key":"基遍求智慧","event":"耶和華在夢中問他要什麼，他求智慧可以判斷百姓、辨別是非；神也把他沒有求的富足和尊榮賜給他。","ref":"王上 3:4–15"},{"key":"二婦爭子","event":"兩個婦人爭一個活孩子，他吩咐拿刀把孩子劈成兩半，從真母親的反應判出孩子是誰的。","ref":"王上 3:16–28"},{"key":"箴言詩歌","event":"神賜他極大的智慧聰明，他作箴言三千句，詩歌一千零五首，列國都有人來聽他的智慧。","ref":"王上 4:29–34"},{"key":"七年建殿","event":"出埃及後四百八十年、他作王第四年開始建耶和華的殿，用七年建成。","ref":"王上 6:1；6:37–38"},{"key":"獻殿禱告","event":"約櫃抬進至聖所，雲彩充滿殿；他在壇前舉手禱告。歷代志另記禱告完了有火從天上降下來。","ref":"王上 8；代下 7:1"},{"key":"示巴女王","event":"示巴女王帶著香料寶石來，用難解的話試問他，看見他的智慧和王宮後，說人告訴她的還不到一半。","ref":"王上 10:1–13"},{"key":"黃金富足","event":"他每年所得的金子有六百六十六他連得，財寶與智慧勝過天下的列王。","ref":"王上 10:14–29"},{"key":"心轉別神","event":"他寵愛許多外邦女子，有妃七百、嬪三百；年老時妃嬪誘惑他的心去隨從別神。","ref":"王上 11:1–8"},{"key":"國要分裂","event":"耶和華向他發怒，說要將國奪回賜給他的臣子，只留一個支派給他兒子；耶羅波安等敵人也興起。","ref":"王上 11:9–40"}],"ending":"所羅門在耶路撒冷作以色列眾人的王共四十年，與他列祖同睡，葬在他父親大衛的城裡，兒子羅波安接續作王（王上 11:42–43）。傳統上認為箴言、傳道書、雅歌與他有關，也有不同看法。新約中耶穌提到所羅門極榮華的時候所穿戴的還不如一朵野地的花（太 6:29），又提到南方的女王來聽他的智慧（太 12:42）。","takeaway":"求得智慧、建成聖殿，晚年卻心轉離神"}},{"t":"ot","id":"rehoboam-jeroboam","era":"divided","full":"羅波安與耶羅波安","name":"羅波安與耶羅波安","note":"","data":{"id":"rehoboam-jeroboam","name":"羅波安與耶羅波安","aka":"南國猶大與北國以色列的第一位王","role":"王國分裂後南北兩國的開國王","era":"divided","books":["1kings","2kings","1chronicles","2chronicles"],"life":[{"key":"耶羅波安受託","event":"以法蓮人尼八的兒子耶羅波安是大能的勇士，所羅門派他管理約瑟家的一切工程。","ref":"王上 11:26–28"},{"key":"新衣十二片","event":"示羅的先知亞希雅把身上的新衣撕成十二片，叫耶羅波安拿十片，說耶和華要將十個支派賜給他。","ref":"王上 11:29–39"},{"key":"逃往埃及","event":"所羅門想要殺他，他逃到埃及王示撒那裡，住到所羅門死了。","ref":"王上 11:40"},{"key":"示劍拒減負","event":"所羅門的兒子羅波安在示劍，百姓求他減輕勞役；他不聽老年人的主意，照少年人的話說要使他們負更重的軛。","ref":"王上 12:1–15"},{"key":"十支派分出","event":"以色列人說「我們與大衛有甚麼分兒呢」，立耶羅波安作以色列的王，只有猶大支派（和便雅憫）跟從羅波安，約主前 930 年。","ref":"王上 12:16–21"},{"key":"兩隻金牛犢","event":"耶羅波安怕百姓上耶路撒冷獻祭會歸回羅波安，就鑄造兩個金牛犢，安在伯特利和但，說「以色列人哪，你們上耶路撒冷去實在是難；這就是領你們出埃及地的神」。","ref":"王上 12:25–33"},{"key":"神人責壇","event":"有神人從猶大來，向伯特利的壇呼叫，預言大衛家要生一個兒子名叫約西亞；耶羅波安伸手要拿他，手就枯乾。","ref":"王上 13:1–6"},{"key":"示撒奪金盾","event":"羅波安第五年，埃及王示撒攻打耶路撒冷，奪去聖殿和王宮的寶物與金盾牌，羅波安改造銅盾牌代替。歷代志另記羅波安在先知示瑪雅責備後自卑。","ref":"王上 14:25–28；代下 12:1–12"},{"key":"兩國常爭戰","event":"羅波安與耶羅波安在世的日子常常爭戰；耶羅波安的罪成了列王紀評斷北國諸王的標準。","ref":"王上 14:30；15:30"}],"ending":"羅波安在耶路撒冷作王十七年，葬在大衛城（王上 14:21、31）；耶羅波安作王二十二年，與列祖同睡，兒子拿答接續作王（王上 14:20）。","takeaway":"一個不肯聽勸，一個另立敬拜，國從此分裂"}},{"t":"ot","id":"ahab-jezebel","era":"divided","full":"亞哈與耶洗別","name":"亞哈與耶洗別","note":"","data":{"id":"ahab-jezebel","name":"亞哈與耶洗別","aka":"北國以色列王與王后","role":"北國以色列王與西頓公主王后","era":"divided","books":["1kings","2kings","2chronicles","micah"],"life":[{"key":"娶西頓公主","event":"暗利的兒子亞哈在撒馬利亞作王，娶了西頓王謁巴力的女兒耶洗別為妻，去事奉敬拜巴力，在撒馬利亞為巴力建廟築壇。","ref":"王上 16:29–33"},{"key":"殺耶和華先知","event":"耶洗別剪除耶和華的先知，家宰俄巴底把一百個先知藏在洞裡，用餅和水供養他們。","ref":"王上 18:3–4"},{"key":"迦密山對決","event":"久旱之後，以利亞與巴力的先知在迦密山對決，火從天降；亞哈坐車回到耶斯列。","ref":"王上 18:17–46"},{"key":"恐嚇以利亞","event":"耶洗別聽說巴力的先知被殺，差人對以利亞起誓明日要取他的性命，以利亞就逃命。","ref":"王上 19:1–3"},{"key":"釋放便哈達","event":"亞哈兩次打敗亞蘭王便哈達，卻與他立約放他走，有先知責備他。","ref":"王上 20"},{"key":"拿伯葡萄園","event":"亞哈想要拿伯的葡萄園，拿伯不肯給；耶洗別以亞哈的名寫信，叫人誣告拿伯，用石頭把他打死，亞哈就去佔那園子。","ref":"王上 21:1–16"},{"key":"以利亞宣判","event":"以利亞對亞哈說狗在拿伯流血的地方也必舔他的血，狗在耶斯列的外郭必吃耶洗別的肉；亞哈聽了就撕裂衣服禁食。","ref":"王上 21:17–29"},{"key":"拉末中箭","event":"先知米該雅預言他會戰敗，他仍與猶大王約沙法攻打基列的拉末，改裝上陣，被人隨便開弓射中，死在車上。","ref":"王上 22:1–38"},{"key":"耶洗別墜樓","event":"耶戶進耶斯列時，耶洗別擦粉梳頭從窗戶往外看，太監把她從窗戶扔下去，後來只剩頭骨、腳和手掌。","ref":"王下 9:30–37"}],"ending":"亞哈在基列的拉末中箭而死，人在撒馬利亞的池旁洗車，狗來舔他的血（王上 22:34–38）；耶洗別被耶戶下令扔下窗外而死（王下 9:30–37）。新約啟 2:20 用「耶洗別」稱呼推雅推喇教會中自稱先知的婦人。","takeaway":"王拜巴力、王后害先知，最終都應驗了審判"}},{"t":"ot","id":"elijah","era":"divided","full":"以利亞","name":"以利亞","note":"","data":{"id":"elijah","name":"以利亞","aka":"提斯比人以利亞","role":"北國亞哈時代的先知","era":"divided","books":["1kings","2kings","2chronicles","malachi"],"life":[{"key":"宣告不雨","event":"基列寄居的提斯比人以利亞對亞哈說，這幾年他若不禱告，必不降露不下雨。","ref":"王上 17:1"},{"key":"烏鴉供養","event":"他照耶和華的話躲在基立溪旁，烏鴉早晚給他叼餅和肉來，他喝溪裡的水。","ref":"王上 17:2–7"},{"key":"撒勒法寡婦","event":"溪水乾了，他到西頓的撒勒法，寡婦用最後的麵和油先為他做餅，從此罈內的麵、瓶裡的油都不短缺。","ref":"王上 17:8–16"},{"key":"寡婦兒子復活","event":"寡婦的兒子病死了，他三次伏在孩子身上求告耶和華，孩子的靈魂就回到身體。","ref":"王上 17:17–24"},{"key":"迦密山對決","event":"他召巴力的先知四百五十人到迦密山，問百姓「你們心持兩意要到幾時呢」；他禱告後耶和華降下火來，燒盡燔祭和壇溝的水。","ref":"王上 18:17–40"},{"key":"小雲如手","event":"他在迦密山頂屈身禱告，僕人第七次看見一小片雲如人手那樣大，接著就下了大雨。","ref":"王上 18:41–46"},{"key":"羅騰樹下","event":"耶洗別揚言要殺他，他逃到曠野，在羅騰樹下求死；天使兩次叫醒他吃餅喝水。","ref":"王上 19:1–8"},{"key":"微小的聲音","event":"他到了何烈山，耶和華不在烈風、地震、火中，火後有微小的聲音對他說話，差他回去膏哈薛、耶戶和以利沙。","ref":"王上 19:9–18"},{"key":"外衣呼召","event":"他把自己的外衣搭在正在耕地的以利沙身上，以利沙就跟隨他服事他。","ref":"王上 19:19–21"},{"key":"責拿伯血案","event":"亞哈佔了拿伯的葡萄園，以利亞去見他，宣告亞哈和耶洗別要受的報應。","ref":"王上 21:17–24"},{"key":"火燒五十夫長","event":"亞哈謝王打發人去問以革倫的神巴力西卜，以利亞攔住使者責備，前兩批來拿他的五十夫長被天上降下的火燒滅。","ref":"王下 1"},{"key":"旋風升天","event":"他用外衣打約旦河，水左右分開；過河後有火車火馬將他和以利沙隔開，以利亞乘旋風升天去了。","ref":"王下 2:1–11"}],"ending":"他乘旋風升天，沒有記載死亡（王下 2:11）；歷代志另記他寫信給猶大王約蘭（代下 21:12–15）。瑪拉基書說耶和華大而可畏之日未到以前，必差遣先知以利亞（瑪 4:5）。新約中他在變像山上與摩西一同出現（太 17:3），耶穌說施洗約翰就是那應當來的以利亞（太 11:14），雅 5:17–18 也提到他禱告不下雨、再禱告就降雨。","takeaway":"在拜巴力的時代，獨自站出來為耶和華說話"}},{"t":"ot","id":"elisha","era":"divided","full":"以利沙","name":"以利沙","note":"","data":{"id":"elisha","name":"以利沙","aka":"沙法的兒子以利沙","role":"以利亞的接班先知","era":"divided","books":["1kings","2kings"],"life":[{"key":"撇牛跟隨","event":"他正趕著十二對牛耕地，以利亞把外衣搭在他身上，他宰了一對牛煮肉給百姓吃，就起身跟隨以利亞。","ref":"王上 19:19–21"},{"key":"加倍的靈","event":"以利亞升天前問他要什麼，他說「願感動你的靈加倍地感動我」，之後拾起以利亞的外衣打約旦河，水就分開。","ref":"王下 2:9–14"},{"key":"鹽治水源","event":"耶利哥的水惡劣，他把鹽倒在水源裡，那水就治好了。","ref":"王下 2:19–22"},{"key":"母熊撕童","event":"在往伯特利的路上，有童子出城戲笑他，他奉耶和華的名咒詛，就有兩隻母熊從林中出來撕裂了四十二個童子。","ref":"王下 2:23–25"},{"key":"寡婦的油","event":"一個先知門徒的寡婦欠債，他叫她借許多空器皿倒油，油倒滿所有器皿才止住，她賣油還債。","ref":"王下 4:1–7"},{"key":"書念婦人","event":"書念的富家婦人為他預備房間，他應許她生子；後來孩子死了，他伏在孩子身上，孩子打了七個噴嚏睜開眼睛。","ref":"王下 4:8–37"},{"key":"二十個餅","event":"有人送來二十個大麥餅，他叫僕人擺給一百人吃，眾人吃了還有剩下。","ref":"王下 4:42–44"},{"key":"乃縵得潔淨","event":"亞蘭元帥乃縵長大痲瘋，他叫乃縵在約旦河沐浴七回，乃縵的肉就復原。","ref":"王下 5:1–14"},{"key":"斧頭漂起","event":"先知門徒砍樹時借來的斧頭掉進約旦河，他把一根木頭拋進水裡，斧頭就漂上來。","ref":"王下 6:1–7"},{"key":"火車火馬","event":"亞蘭王派軍隊在多坍圍城，他禱告求耶和華開僕人的眼目，僕人就看見滿山有火車火馬圍繞以利沙。","ref":"王下 6:8–23"},{"key":"預言饑荒解除","event":"撒馬利亞被亞蘭圍困、城中大饑荒，他預言明日這時候糧價大跌，第二天果然應驗。","ref":"王下 6:24～7:20"},{"key":"臨終射箭","event":"他得了必死的病，叫以色列王約阿施開窗射箭、又擊地，王只擊了三次，他說只能三次打敗亞蘭人。","ref":"王下 13:14–19"}],"ending":"以利沙死了，人將他葬埋；後來有死人被拋進他的墳墓，一碰著以利沙的骸骨就復活站起來（王下 13:20–21）。新約中耶穌提到以利沙的時候，以色列中有許多長大痲瘋的，只有敘利亞國的乃縵得了潔淨（路 4:27）。","takeaway":"接過師父的外衣，用神蹟服事百姓與列國"}},{"t":"ot","id":"naaman","era":"divided","full":"乃縵","name":"乃縵","note":"","data":{"id":"naaman","name":"乃縵","aka":"亞蘭王的元帥","role":"患大痲瘋的亞蘭元帥","era":"divided","books":["2kings"],"life":[{"key":"大能元帥","event":"亞蘭王的元帥乃縵在主人面前為尊大，是大能的勇士，只是長了大痲瘋。","ref":"王下 5:1"},{"key":"小女子進言","event":"他家中有一個從以色列擄來的小女子，對主母說主人若去見撒馬利亞的先知，必能治好他的痲瘋。","ref":"王下 5:2–4"},{"key":"國書嚇壞王","event":"亞蘭王寫信給以色列王，請他治好乃縵；以色列王看了信就撕裂衣服，以為亞蘭王找機會攻擊他。","ref":"王下 5:5–7"},{"key":"發怒要走","event":"以利沙沒有出來，只打發人叫他在約旦河沐浴七回；乃縵發怒，說大馬士革的河難道不比以色列的水更好嗎。","ref":"王下 5:8–12"},{"key":"沐浴七回","event":"僕人勸他照著做，他就下約旦河沐浴七回，肉復原好像小孩子的肉。","ref":"王下 5:13–14"},{"key":"承認真神","event":"他回到以利沙面前，說如今知道除了以色列之外普天下沒有神，又求兩騾子馱的土，要回國只向耶和華獻祭。","ref":"王下 5:15–19"},{"key":"基哈西貪財","event":"以利沙的僕人基哈西追上他，假借主人名義要了銀子和衣裳；以利沙說乃縵的大痲瘋要沾染基哈西。","ref":"王下 5:20–27"}],"ending":"聖經沒有記載他後來的事。新約中耶穌提到以利沙時代只有敘利亞國的乃縵得了潔淨（路 4:27）。","takeaway":"放下身段照著做，外邦元帥得了潔淨"}},{"t":"ot","id":"jehu","era":"divided","full":"耶戶","name":"耶戶","note":"","data":{"id":"jehu","name":"耶戶","aka":"寧示的孫子","role":"推翻亞哈家的北國以色列王","era":"divided","books":["1kings","2kings","2chronicles","hosea"],"life":[{"key":"早有預定","event":"耶和華在何烈山吩咐以利亞，要膏寧示的孫子耶戶作以色列王。","ref":"王上 19:15–16"},{"key":"拉末受膏","event":"以利沙打發一個先知門徒到基列的拉末，在內室把膏油倒在耶戶頭上，吩咐他擊殺亞哈的全家。","ref":"王下 9:1–10"},{"key":"眾將擁立","event":"同營的將軍聽了，就拿衣服鋪在臺階上，吹角說「耶戶作王了」。","ref":"王下 9:11–13"},{"key":"趕車甚猛","event":"他坐車往耶斯列去，守望的人說「車趕得甚猛，像寧示的孫子耶戶的趕法」。","ref":"王下 9:16–20"},{"key":"射殺約蘭","event":"在拿伯的田間他開弓射死以色列王約蘭，把屍首拋在那塊田裡，應驗以利亞的話。","ref":"王下 9:21–26"},{"key":"追殺亞哈謝","event":"猶大王亞哈謝逃跑，耶戶派人追擊，亞哈謝受傷逃到米吉多就死了；歷代志的記法是亞哈謝藏在撒馬利亞被搜出殺了。","ref":"王下 9:27–28；代下 22:7–9"},{"key":"除滅亞哈家","event":"他寫信給撒馬利亞的首領，他們殺了亞哈的七十個兒子；耶戶又殺盡亞哈家在耶斯列剩下的人。","ref":"王下 10:1–17"},{"key":"剷除巴力","event":"他假稱要大大事奉巴力，召齊拜巴力的人在廟裡，派兵把他們全殺了，拆毀巴力的柱像和廟。","ref":"王下 10:18–28"},{"key":"仍拜金牛犢","event":"他卻沒有離開耶羅波安的罪，伯特利和但的金牛犢仍然留著；耶和華應許他的子孫坐以色列的國位直到四代。","ref":"王下 10:29–31"}],"ending":"耶戶在撒馬利亞作以色列王二十八年，與他列祖同睡，葬在撒馬利亞，兒子約哈斯接續作王（王下 10:34–36）。何西阿書說耶和華要追討耶戶家在耶斯列流血的罪（何 1:4）。","takeaway":"熱心剷除巴力，卻沒有離開金牛犢"}},{"t":"ot","id":"hezekiah","era":"divided","full":"希西家","name":"希西家","note":"","data":{"id":"hezekiah","name":"希西家","aka":"亞哈斯的兒子","role":"倚靠耶和華的南國猶大王","era":"divided","books":["2kings","1chronicles","2chronicles","proverbs","isaiah","jeremiah","hosea","micah"],"life":[{"key":"二十五歲登基","event":"亞哈斯的兒子希西家二十五歲登基，在耶路撒冷作王二十九年，行耶和華眼中看為正的事。","ref":"王下 18:1–3"},{"key":"打碎銅蛇","event":"他廢去邱壇、砍下木偶，又打碎摩西所造的銅蛇，因為百姓仍向它燒香；希西家稱它為銅塊。","ref":"王下 18:4"},{"key":"潔淨聖殿","event":"歷代志記他登基第一年正月開了聖殿的門，命利未人潔淨聖殿，又召集全以色列和猶大到耶路撒冷守逾越節。","ref":"代下 29～30"},{"key":"北國滅亡","event":"他在位第六年，亞述王攻取撒馬利亞，把以色列人擄到亞述，約主前 722 年。","ref":"王下 18:9–12"},{"key":"亞述兵臨城","event":"亞述王西拿基立攻取猶大的堅固城，他送上金銀求和；亞述王仍派拉伯沙基到耶路撒冷城外喊話恐嚇，約主前 701 年。","ref":"王下 18:13–37"},{"key":"展信禱告","event":"他接到亞述王的信，上耶和華的殿把信在耶和華面前展開禱告；以賽亞回覆說亞述王必不得進這城，當夜耶和華的使者在亞述營中殺了十八萬五千人，西拿基立拔營回尼尼微。","ref":"王下 19:14–36"},{"key":"病中加壽","event":"他病得要死，轉臉朝牆禱告痛哭；耶和華說「我聽見了你的禱告，看見了你的眼淚」，加他十五年壽數，並使日影後退十度為兆頭。","ref":"王下 20:1–11"},{"key":"炫寶受責","event":"巴比倫王的使者來探病，他把寶庫和軍器庫全給他們看；以賽亞預言這一切將來都要被擄到巴比倫。","ref":"王下 20:12–19"},{"key":"開挖水道","event":"他挖池、挖溝，引水入城；歷代志說他塞住基訓的上源，引水直下流在大衛城的西邊。","ref":"王下 20:20；代下 32:30"}],"ending":"希西家與他列祖同睡，兒子瑪拿西接續作王（王下 20:21）；代下 32:33 說他被葬在大衛子孫的墳地上坡。箴 25:1 提到有些箴言是猶大王希西家的人所謄錄的。新約馬太福音的家譜列有他的名字（太 1:9–10）。","takeaway":"危急時把難處攤在神面前，城得保全"}},{"t":"ot","id":"josiah","era":"divided","full":"約西亞","name":"約西亞","note":"","data":{"id":"josiah","name":"約西亞","aka":"亞們的兒子","role":"推動宗教改革的南國猶大王","era":"divided","books":["1kings","2kings","1chronicles","2chronicles","jeremiah","zephaniah"],"life":[{"key":"名字先被預言","event":"耶羅波安在位時，有神人在伯特利的壇前預言大衛家要生一個兒子名叫約西亞，要在這壇上燒人的骨頭。","ref":"王上 13:1–2"},{"key":"八歲登基","event":"亞們的兒子約西亞八歲登基，在耶路撒冷作王三十一年，約主前 640～609 年。","ref":"王下 22:1–2"},{"key":"少年尋求神","event":"歷代志記他作王第八年還年少就尋求大衛的神，第十二年開始潔淨猶大和耶路撒冷，除掉邱壇偶像。","ref":"代下 34:3–7"},{"key":"修殿得律法書","event":"作王第十八年修理聖殿，大祭司希勒家在殿裡找到律法書，書記沙番念給王聽，王就撕裂衣服。","ref":"王下 22:3–11"},{"key":"求問戶勒大","event":"他派人去問女先知戶勒大，她說災禍必臨到這地，但因王心裡敬畏、自卑，必在他死後才臨到。","ref":"王下 22:12–20"},{"key":"全民立約","event":"他召集眾長老和百姓上耶和華的殿，念約書給他們聽，在耶和華面前立約要遵行律法，眾民都服從這約。","ref":"王下 23:1–3"},{"key":"拆毀伯特利壇","event":"他除去殿中和全地的偶像，拆毀耶羅波安在伯特利所築的壇，把墳墓裡的骨頭燒在壇上，應驗神人的話。","ref":"王下 23:4–20"},{"key":"守逾越節","event":"他吩咐百姓照約書所寫的守逾越節，從士師時代以來都沒有守過這樣的逾越節。","ref":"王下 23:21–23"},{"key":"米吉多陣亡","event":"埃及王法老尼哥上到幼發拉底河，約西亞去抵擋他，在米吉多被殺；歷代志記他是被弓箭手射傷，回耶路撒冷後死了，耶利米為他作哀歌。","ref":"王下 23:29–30；代下 35:20–25"}],"ending":"在米吉多迎戰埃及王尼哥時死去，臣僕用車把屍首運回耶路撒冷葬在他自己的墳墓裡（王下 23:29–30）。列王紀說在他以前沒有王像他那樣盡心盡性盡力地歸向耶和華，在他以後也沒有興起一個王像他（王下 23:25）。新約馬太福音家譜列有他的名字（太 1:10–11）。","takeaway":"一本找回的律法書，帶出一場全國改革"}},{"t":"ot","id":"isaiah","era":"prophet","full":"以賽亞","name":"以賽亞","note":"","data":{"id":"isaiah","name":"以賽亞","aka":"","role":"猶大的先知，亞摩斯的兒子","era":"prophet","books":["2kings","2chronicles","isaiah"],"life":[{"key":"四王年間","event":"亞摩斯的兒子以賽亞，在烏西雅、約坦、亞哈斯、希西家作猶大王的時候得見異象，論到猶大和耶路撒冷。","ref":"賽 1:1"},{"key":"記錄王事","event":"歷代志說烏西雅其餘的事都是先知以賽亞所寫，希西家的事也記在先知以賽亞的默示書上。","ref":"代下 26:22；32:32"},{"key":"聖殿異象","event":"烏西雅王崩的那年，他看見主坐在高高的寶座上，撒拉弗彼此呼喊聖哉；撒拉弗用壇上的紅炭沾他的嘴，他就回應願意被差遣。","ref":"賽 6:1–8"},{"key":"勸亞哈斯","event":"亞蘭王和以色列王來攻耶路撒冷時，他帶兒子施亞雅述去見亞哈斯，勸王不要懼怕，又說必有童女懷孕生子，給他起名叫以馬內利；新約在太 1:23 引用這段話。","ref":"賽 7:1–14"},{"key":"兒子取名","event":"他與女先知生了兒子，奉命起名瑪黑珥沙拉勒哈施罷斯，預告大馬士革和撒馬利亞的財寶要被搬到亞述王面前。","ref":"賽 8:1–4"},{"key":"赤腳三年","event":"耶和華吩咐他露身赤腳行走三年，作為埃及和古實要被亞述王擄去的預兆。","ref":"賽 20:1–4"},{"key":"亞述圍城","event":"亞述王西拿基立派拉伯沙基來威嚇耶路撒冷，希西家差人去求他；他回話叫王不要懼怕，當夜耶和華的使者在亞述營中殺了十八萬五千人。","ref":"賽 36～37；王下 18～19"},{"key":"希西家病癒","event":"希西家病得要死，他先傳話叫王留遺命，後又回來說神要加王十五年的壽數，並以日影往後退十度為兆頭。","ref":"賽 38；王下 20:1–11"},{"key":"預言被擄","event":"巴比倫王的使者來訪，希西家把寶庫全給他們看，他說日後宮中一切都要被帶到巴比倫去。","ref":"賽 39；王下 20:12–19"}],"ending":"聖經沒有記載他的結局。傳統上說他在瑪拿西王的時候殉道。新約多次引用以賽亞書，例如耶穌在拿撒勒會堂念賽 61 章（路 4:17–21）、腓利向太監講解賽 53 章（徒 8:28–35）。","takeaway":"歷經四王，在亞述威脅中勸王倚靠神"}},{"t":"ot","id":"jeremiah","era":"prophet","full":"耶利米","name":"耶利米","note":"","data":{"id":"jeremiah","name":"耶利米","aka":"","role":"猶大亡國前後的先知","era":"prophet","books":["2chronicles","ezra","jeremiah","lamentations","daniel"],"life":[{"key":"年少蒙召","event":"他是便雅憫地亞拿突的祭司希勒家的兒子，約西亞王十三年耶和華的話臨到他；他推說自己年幼、不會說話，耶和華按手在他口上。","ref":"耶 1:1–9"},{"key":"杏枝與鍋","event":"神給他看杏樹枝和燒開的鍋兩個異象，說災禍要從北方發出。","ref":"耶 1:11–14"},{"key":"哀悼約西亞","event":"約西亞王在戰場上受傷而死，耶利米為他作哀歌。","ref":"代下 35:23–25"},{"key":"聖殿門口","event":"他站在耶和華殿的門口，警告百姓不要倚靠虛謊的話；祭司、先知和眾民抓住他說他該死，有首領和長老替他說話才得保全。","ref":"耶 7:1–15；26:1–24"},{"key":"窰匠瓦瓶","event":"他到窰匠家看人把壞了的器皿重做，又在長老面前打碎瓦瓶；祭司巴施戶珥打他，把他枷在殿的門那裡。","ref":"耶 18:1–6；19:1～20:2"},{"key":"七十年","event":"約雅敬第四年，他預言這地要荒涼，列國要服事巴比倫王七十年。","ref":"耶 25:1–11"},{"key":"書卷被燒","event":"他口述、巴錄寫在書卷上；約雅敬王聽了，用刀把書卷一段段割下扔在火中，耶利米又叫巴錄另寫一卷。","ref":"耶 36"},{"key":"寫信被擄者","event":"他寫信給被擄到巴比倫的人，要他們在那裡蓋房、栽種、為那城求平安，七十年滿了必再回來。","ref":"耶 29:1–10"},{"key":"頸上的軛","event":"西底家年間他頸上戴軛，表明要服事巴比倫王；先知哈拿尼雅把軛折斷，耶利米說他當年必死，他在那年七月就死了。","ref":"耶 27～28"},{"key":"下牢入坑","event":"圍城期間他被指控要投降迦勒底人，被打、下在牢獄；後來首領把他放進淤泥的坑裡，古實人以伯米勒求王把他拉上來。","ref":"耶 37:11～38:13"},{"key":"買地為記","event":"被押在護衛兵的院中時，他照耶和華的話買下堂兄哈拿篾在亞拿突的地，表明將來在這地還要買賣田地。","ref":"耶 32:1–15"},{"key":"城破之後","event":"城破後尼布甲尼撒吩咐善待他，他留在本地與省長基大利同住；基大利被殺後，眾人不聽他的勸，把他和巴錄帶到埃及。","ref":"耶 39:11～40:6；43:1–7"}],"ending":"聖經最後記他在埃及仍向猶大人說預言（耶 44），沒有記載他的結局；傳統上說他死在埃及。歷代志和以斯拉記說古列下詔是應驗耶和華藉耶利米口所說的話（代下 36:21–22；拉 1:1），但以理也從耶利米書得知七十年之數（但 9:2）。新約在來 8:8–12 引用他所說的新約。","takeaway":"被打、下牢、入坑，仍把神的話傳到亡國"}},{"t":"ot","id":"ezekiel","era":"prophet","full":"以西結","name":"以西結","note":"","data":{"id":"ezekiel","name":"以西結","aka":"","role":"被擄到巴比倫的祭司先知","era":"prophet","books":["ezekiel"],"life":[{"key":"河邊異象","event":"祭司布西的兒子以西結在迦巴魯河邊被擄的人中，約雅斤王被擄第五年，他看見四活物和寶座的異象。","ref":"結 1:1–3"},{"key":"吃下書卷","event":"神叫他吃下寫著哀號、歎息、悲痛的書卷，他吃了，口中覺得甜如蜜。","ref":"結 2:8～3:3"},{"key":"守望的人","event":"神立他作以色列家守望的人，要他傳話警戒惡人。","ref":"結 3:16–21"},{"key":"演出圍城","event":"他用磚畫出耶路撒冷被圍困的樣子，又向左側臥三百九十日、向右側臥四十日。","ref":"結 4:1–6"},{"key":"榮耀離殿","event":"他在異象中被帶到耶路撒冷，看見殿中的可憎之事，也看見耶和華的榮耀離開聖殿。","ref":"結 8～11"},{"key":"妻子去世","event":"他眼目所喜愛的妻子忽然死了，神吩咐他不可悲哀哭泣，作百姓的預兆。","ref":"結 24:15–24"},{"key":"城破消息","event":"被擄第十二年，有從耶路撒冷逃來的人告訴他：城已攻破。","ref":"結 33:21"},{"key":"枯骨復生","event":"他在異象中被帶到遍滿骸骨的平原，奉命向骸骨說預言，骨與骨互相聯絡、長肉、有了氣息，就活了。","ref":"結 37:1–14"},{"key":"新殿異象","event":"被擄第二十五年，他在異象中被帶到以色列地，看見新的聖殿，又看見有水從殿的門檻下流出。","ref":"結 40:1–4；47:1–12"}],"ending":"聖經沒有記載他的結局。","takeaway":"在被擄之地，用異象與行動傳神的話"}},{"t":"ot","id":"hosea","era":"prophet","full":"何西阿","name":"何西阿","note":"","data":{"id":"hosea","name":"何西阿","aka":"","role":"向北國以色列說話的先知","era":"prophet","books":["hosea"],"life":[{"key":"四王年間","event":"備利的兒子何西阿，在猶大王烏西雅、約坦、亞哈斯、希西家和以色列王約阿施的兒子耶羅波安年間說預言。","ref":"何 1:1"},{"key":"娶歌篾","event":"耶和華吩咐他娶淫婦為妻，他就娶了滴拉音的女兒歌篾。","ref":"何 1:2–3"},{"key":"兒女取名","event":"三個孩子照神的吩咐取名耶斯列、羅路哈瑪（不蒙憐憫）、羅阿米（非我民），預表以色列的處境。","ref":"何 1:4–9"},{"key":"再買回她","event":"神又叫他去愛一個有情人的淫婦，他用銀子十五舍客勒、大麥一賀梅珥半把她買回來。","ref":"何 3:1–3"},{"key":"責備背約","event":"他說這地上無誠實、無良善、無人認識神，責備以色列拜偶像、離棄耶和華。","ref":"何 4:1–2"},{"key":"呼喚歸回","event":"書末他呼喚以色列歸向耶和華，說耶和華必醫治他們背道的病。","ref":"何 14:1–4"}],"ending":"聖經沒有記載他的結局。新約在羅 9:25–26 引用何西阿書，說本來不是神子民的要稱為神的子民；太 2:15 也引用何 11:1。","takeaway":"用自己的婚姻演出神對以色列的愛"}},{"t":"ot","id":"amos","era":"prophet","full":"阿摩司","name":"阿摩司","note":"","data":{"id":"amos","name":"阿摩司","aka":"","role":"提哥亞的牧人，向北國說話","era":"prophet","books":["amos"],"life":[{"key":"提哥亞牧人","event":"他是提哥亞牧人中的一個，在猶大王烏西雅、以色列王耶羅波安年間，大地震前二年得默示。","ref":"摩 1:1"},{"key":"列國審判","event":"他從大馬士革、迦薩、泰爾、以東、亞捫、摩押一路說起，最後說到猶大和以色列的罪。","ref":"摩 1:3～2:16"},{"key":"賣義賣窮","event":"他責備以色列為銀子賣了義人、為一雙鞋賣了窮人。","ref":"摩 2:6–7"},{"key":"公平如水","event":"他說神不喜悅只有節期和獻祭，要公平如大水滾滾、公義如江河滔滔。","ref":"摩 5:21–24"},{"key":"五個異象","event":"他看見蝗蟲、火、準繩、一筐夏天的果子，以及主站在壇旁的異象。","ref":"摩 7:1～9:1"},{"key":"伯特利對質","event":"伯特利祭司亞瑪謝向耶羅波安控告他，叫他回猶大去；他說自己原不是先知，是牧人，又是修理桑樹的，是耶和華選召他。","ref":"摩 7:10–15"},{"key":"帳幕重建","event":"書末他說到神要建立大衛倒塌的帳幕，使被擄的子民歸回；新約在徒 15:16–17 引用這段。","ref":"摩 9:11–15"}],"ending":"聖經沒有記載他後來的事。","takeaway":"牧人出身，為窮人向以色列喊公義"}},{"t":"ot","id":"jonah","era":"prophet","full":"約拿","name":"約拿","note":"","data":{"id":"jonah","name":"約拿","aka":"亞米太的兒子","role":"被差往尼尼微的先知","era":"prophet","books":["2kings","jonah"],"life":[{"key":"預言疆界","event":"列王紀說迦特希弗人亞米太的兒子先知約拿，曾預言耶羅波安收回以色列的疆界。","ref":"王下 14:25"},{"key":"逃往他施","event":"耶和華吩咐他往尼尼微大城去，他卻下到約帕，坐船要逃往他施。","ref":"拿 1:1–3"},{"key":"海上風暴","event":"海中起了大風，水手抽籤抽中約拿；他叫他們把他拋在海裡，海就平靜了。","ref":"拿 1:4–15"},{"key":"魚腹禱告","event":"耶和華安排一條大魚吞了他，他在魚腹中三日三夜向神禱告，魚就把他吐在旱地上。","ref":"拿 1:17～2:10"},{"key":"全城悔改","event":"他進城宣告再等四十日尼尼微必傾覆，全城從王到百姓禁食披麻，神就不降這災。","ref":"拿 3"},{"key":"城外發怒","event":"神不降災，他大大不悅而發怒，出城在東邊搭棚，要看城的結局。","ref":"拿 4:1–5"},{"key":"蓖麻教訓","event":"神安排蓖麻為他遮蔭，又安排蟲子咬死蓖麻；神問他，你尚且愛惜這棵蓖麻，我豈能不愛惜這有十二萬多人的大城。","ref":"拿 4:6–11"}],"ending":"全書在神的問句中結束，沒有記載約拿的回應與結局。新約中耶穌以約拿在魚腹三日三夜比喻自己，又說尼尼微人聽了約拿所傳的就悔改（太 12:39–41）。","takeaway":"想逃避差遣，被神帶回尼尼微"}},{"t":"ot","id":"micah","era":"prophet","full":"彌迦","name":"彌迦","note":"","data":{"id":"micah","name":"彌迦","aka":"摩利沙人","role":"與以賽亞同時代的猶大先知","era":"prophet","books":["jeremiah","micah"],"life":[{"key":"摩利沙人","event":"摩利沙人彌迦在猶大王約坦、亞哈斯、希西家年間得默示，論到撒馬利亞和耶路撒冷。","ref":"彌 1:1"},{"key":"責備強佔","event":"他責備人貪圖田地就佔據、貪圖房屋便奪取，欺壓人和他的家產。","ref":"彌 2:1–2"},{"key":"錫安被耕","event":"他責備首領為賄賂審判、祭司為雇價施訓誨、先知為銀錢行占卜，說錫安必被耕種像一塊田。","ref":"彌 3:9–12"},{"key":"刀打成犁","event":"他說末後耶和華殿的山必堅立，列國要把刀打成犁頭，不再學習戰事。","ref":"彌 4:1–3"},{"key":"伯利恆","event":"他說伯利恆以法他雖在猶大諸城中為小，將來必有一位從那裡出來，在以色列中為神掌權；新約在太 2:5–6 引用這段。","ref":"彌 5:2"},{"key":"神要什麼","event":"他說耶和華向人所要的，就是行公義、好憐憫、存謙卑的心與神同行。","ref":"彌 6:8"},{"key":"長老引述","event":"後來耶利米受審時，有長老引述彌迦論錫安的預言，說希西家王聽了就敬畏耶和華。","ref":"耶 26:17–19"}],"ending":"聖經沒有記載他的結局。","takeaway":"替受欺壓的人說話，指向伯利恆"}},{"t":"ot","id":"haggai-zechariah","era":"prophet","full":"哈該與撒迦利亞","name":"哈該與撒迦利亞","note":"","data":{"id":"haggai-zechariah","name":"哈該與撒迦利亞","aka":"","role":"歸回後催促重建聖殿的先知","era":"prophet","books":["ezra","haggai","zechariah"],"life":[{"key":"工程停頓","event":"歸回的人立了殿的根基後，因敵人阻擋，建殿的工程停止，直到波斯王大利烏第二年。","ref":"拉 4:4–5、24"},{"key":"哈該催促","event":"大利烏王第二年，哈該傳話給省長所羅巴伯和大祭司約書亞，責問百姓自己住天花板的房屋，這殿仍然荒涼。","ref":"該 1:1–4"},{"key":"百姓動工","event":"所羅巴伯、約書亞和餘剩的百姓聽從哈該的話，就來為耶和華的殿作工。","ref":"該 1:12–15"},{"key":"後來的榮耀","event":"哈該說這殿後來的榮耀必大過先前的榮耀。","ref":"該 2:9"},{"key":"撒迦利亞蒙召","event":"同年八月，耶和華的話臨到易多的孫子、比利家的兒子撒迦利亞，呼喚百姓回轉歸向神。","ref":"亞 1:1–6"},{"key":"夜間異象","event":"撒迦利亞一夜之間看見騎馬的人、拿準繩的人、金燈臺和兩棵橄欖樹等一連串異象。","ref":"亞 1:7～6:8"},{"key":"不靠勢力","event":"撒迦利亞傳話給所羅巴伯，說成事不是倚靠勢力、不是倚靠才能，乃是倚靠神的靈。","ref":"亞 4:6–9"},{"key":"聖殿完工","event":"猶大的長老因哈該和撒迦利亞的預言，建造的工程就亨通，大利烏王第六年殿完工。","ref":"拉 5:1–2；6:14–15"}],"ending":"聖經沒有記載兩人的結局。撒迦利亞書說錫安的王謙謙和和地騎著驢駒來（亞 9:9），新約在太 21:4–5 引用這段。","takeaway":"兩位先知一前一後，催百姓把殿建成"}},{"t":"ot","id":"daniel","era":"exile","full":"但以理","name":"但以理","note":"","data":{"id":"daniel","name":"但以理","aka":"伯提沙撒","role":"被擄到巴比倫、在王朝中任官","era":"exile","books":["daniel"],"life":[{"key":"被擄改名","event":"約雅敬王第三年尼布甲尼撒圍困耶路撒冷，但以理和幾位猶大少年被帶到巴比倫，太監長給他起名叫伯提沙撒。","ref":"但 1:1–7"},{"key":"不吃王膳","event":"他立志不以王的膳和王飲的酒玷污自己，只吃素菜喝白水十天，面貌反倒比吃王膳的少年更加俊美。","ref":"但 1:8–16"},{"key":"解大像夢","event":"尼布甲尼撒要殺盡哲士，他求神後得知王的夢：金頭、銀胸、銅腹、鐵腿、半鐵半泥的腳，被非人手鑿出的石頭打碎；王就派他管理巴比倫全省。","ref":"但 2"},{"key":"大樹被砍","event":"他為尼布甲尼撒解大樹被砍下的夢，勸王施行公義、憐憫窮人；後來這夢應驗在王身上。","ref":"但 4"},{"key":"四獸異象","event":"伯沙撒元年，他夢見四個大獸從海中上來，又看見亙古常在者和一位像人子的駕著天雲而來。","ref":"但 7"},{"key":"綿羊山羊","event":"伯沙撒第三年，他看見公綿羊和公山羊的異象，天使加百列為他講解。","ref":"但 8"},{"key":"牆上文字","event":"伯沙撒王設筵，用從耶路撒冷聖殿掠來的器皿飲酒，牆上出現指頭寫字；但以理讀出彌尼，彌尼，提客勒，烏法珥新並講解，當夜伯沙撒被殺。","ref":"但 5"},{"key":"七十個七","event":"大利烏元年，他從耶利米書得知耶路撒冷荒涼七十年之數，就禁食認罪禱告；加百列來告訴他七十個七的事。","ref":"但 9"},{"key":"獅子坑","event":"眾官設計使王下禁令，三十日內只准向王祈求；他照常每日三次向耶路撒冷開窗禱告，被扔進獅子坑，神差使者封住獅子的口。","ref":"但 6"},{"key":"河邊異象","event":"波斯王古列第三年，他在底格里斯大河邊見異象，得知將來的事。","ref":"但 10:1～12:4"},{"key":"等候安歇","event":"書末天使對他說，你且去等候結局，因為你必安歇。","ref":"但 12:13"}],"ending":"書中說但以理一直在王朝中，到古列王的時候仍然亨通（但 1:21；6:28），聖經沒有記載他的死。新約中耶穌提到先知但以理所說的話（太 24:15）。傳統上認為但以理書寫於被擄時期，也有不同看法。","takeaway":"在外邦王朝中，從少年到老年守住信仰"}},{"t":"ot","id":"shadrach-meshach-abednego","era":"exile","full":"沙得拉、米煞、亞伯尼歌","name":"沙得拉、米煞、亞伯尼歌","note":"","data":{"id":"shadrach-meshach-abednego","name":"沙得拉、米煞、亞伯尼歌","aka":"哈拿尼雅、米沙利、亞撒利雅","role":"但以理的三位同伴","era":"exile","books":["daniel"],"life":[{"key":"被擄改名","event":"他們原名哈拿尼雅、米沙利、亞撒利雅，和但以理一同被帶到巴比倫，太監長給他們改名。","ref":"但 1:6–7"},{"key":"同吃素菜","event":"他們和但以理一同只吃素菜喝白水，王考問時，發現他們的智慧聰明比全國的術士更勝十倍。","ref":"但 1:11–20"},{"key":"同心祈求","event":"王要殺盡哲士時，但以理請他們一同祈求天上的神施憐憫，把夢指明。","ref":"但 2:17–18"},{"key":"管理省事","event":"但以理求王，王就派他們三人管理巴比倫省的事務。","ref":"但 2:49"},{"key":"不拜金像","event":"尼布甲尼撒立了金像，命眾人一聽見樂器的聲音就俯伏敬拜，他們三人不肯下拜。","ref":"但 3:1–12"},{"key":"即或不然","event":"他們對王說，神能救他們脫離火窯；即或不然，也不事奉王的神，不拜王所立的金像。","ref":"但 3:16–18"},{"key":"火窯第四人","event":"王把窯燒熱比尋常更加七倍，把他們捆起扔進去；王卻看見四個人在火中遊行，第四個的相貌好像神子。","ref":"但 3:19–25"},{"key":"毫髮無傷","event":"他們從火中出來，頭髮沒有燒焦，衣裳也沒有變色，並沒有火燎的氣味；王稱頌他們的神，又高升他們。","ref":"但 3:26–30"}],"ending":"聖經沒有記載他們後來的事。","takeaway":"寧可進火窯，也不拜王的金像"}},{"t":"ot","id":"nebuchadnezzar","era":"exile","full":"尼布甲尼撒","name":"尼布甲尼撒","note":"","data":{"id":"nebuchadnezzar","name":"尼布甲尼撒","aka":"","role":"巴比倫王，攻破耶路撒冷","era":"exile","books":["2kings","2chronicles","ezra","nehemiah","esther","jeremiah","ezekiel","daniel"],"life":[{"key":"初次擄人","event":"約雅敬王第三年他圍困耶路撒冷，把聖殿的一些器皿帶到示拿地，又帶走但以理等猶大少年。","ref":"但 1:1–4"},{"key":"約雅敬背叛","event":"約雅敬服事他三年，後來背叛了他。","ref":"王下 24:1"},{"key":"夢見大像","event":"他作夢見到一個大像，要殺盡不能說出夢的哲士；但以理講解後，他說但以理的神是萬神之神。","ref":"但 2"},{"key":"擄走約雅斤","event":"約雅斤作王時他圍城，擄走約雅斤王、首領、大能的勇士和匠人，又立西底家為王。","ref":"王下 24:10–17"},{"key":"金像火窯","event":"他立了金像命眾人下拜，把不拜的三人扔進火窯；看見他們毫髮無傷，就稱頌他們的神。","ref":"但 3"},{"key":"攻破聖城","event":"西底家背叛，他圍困耶路撒冷，城破後在利比拉剜了西底家的眼睛，護衛長尼布撒拉旦焚燒聖殿和城中的房屋。","ref":"王下 25:1–10"},{"key":"善待耶利米","event":"他吩咐護衛長尼布撒拉旦善待耶利米，不可害他。","ref":"耶 39:11–12"},{"key":"吃草如牛","event":"他誇口這大巴比倫是自己用大能大力建造的，就被趕出離開世人、吃草如牛，直到七期滿了；他舉目望天，聰明復歸，就讚美至高者。","ref":"但 4:28–37"}],"ending":"但以理書最後記他恢復國位、讚美天上的王（但 4:36–37），聖經沒有記載他的死。後來巴比倫王以未米羅達釋放了約雅斤（王下 25:27）。","takeaway":"攻破耶路撒冷的王，被降卑後讚美神"}},{"t":"ot","id":"cyrus","era":"exile","full":"古列","name":"古列","note":"","data":{"id":"cyrus","name":"古列","aka":"","role":"波斯王，下詔讓猶大人歸回","era":"exile","books":["2chronicles","ezra","isaiah","daniel"],"life":[{"key":"以賽亞提名","event":"以賽亞書稱古列為耶和華的牧人、受膏者，說他必成就神的喜悅，論到耶路撒冷必被建造。","ref":"賽 44:28～45:1"},{"key":"下詔歸回","event":"波斯王古列元年，耶和華激動他的心，他下詔通告全國，凡屬神的子民都可以上耶路撒冷重建耶和華的殿；經文說這是要應驗藉耶利米口所說的話。","ref":"代下 36:22–23；拉 1:1–4"},{"key":"歸還器皿","event":"他把尼布甲尼撒從耶路撒冷掠來的器皿交給猶大首領設巴薩，金銀器皿共五千四百件。","ref":"拉 1:7–11"},{"key":"但以理亨通","event":"但以理在古列王的時候仍然亨通，古列第三年還見了異象。","ref":"但 6:28；10:1"},{"key":"建殿受阻","event":"從古列年間直到大利烏登基，敵人賄買謀士，要敗壞重建聖殿的計畫。","ref":"拉 4:4–5"},{"key":"詔書尋回","event":"後來大利烏王下令查考，在瑪代省亞馬他城的宮內找到古列的詔書，工程得以繼續。","ref":"拉 6:1–12"}],"ending":"聖經沒有記載他的結局。以斯拉記與以賽亞書都把他下詔看作耶和華的作為（拉 1:1；賽 45:1–4）。","takeaway":"外邦王的一道詔書，打開歸回之路"}},{"t":"ot","id":"zerubbabel","era":"exile","full":"所羅巴伯","name":"所羅巴伯","note":"","data":{"id":"zerubbabel","name":"所羅巴伯","aka":"","role":"帶領歸回、重建聖殿的省長","era":"exile","books":["1chronicles","ezra","nehemiah","haggai","zechariah"],"life":[{"key":"大衛後裔","event":"歷代志的家譜把他列在大衛的後裔中；哈該書稱他為撒拉鐵的兒子、猶大省長。","ref":"代上 3:17–19；該 1:1"},{"key":"帶領歸回","event":"他和耶書亞帶領被擄的人從巴比倫回到耶路撒冷和猶大，各歸本城。","ref":"拉 2:1–2；尼 7:6–7"},{"key":"築壇獻祭","event":"到了七月，他和耶書亞築起以色列神的壇，照摩西律法所寫的獻燔祭。","ref":"拉 3:1–3"},{"key":"立殿根基","event":"歸回第二年二月動工，立殿根基時，許多見過舊殿的老年人大聲哭號，也有許多人大聲歡呼。","ref":"拉 3:8–13"},{"key":"拒絕協建","event":"敵人來說要和他們一同建造，他和耶書亞拒絕，敵人就使工程受阻。","ref":"拉 4:1–5"},{"key":"重新動工","event":"大利烏王第二年，先知哈該、撒迦利亞說預言，他和耶書亞就起來重新建造神的殿。","ref":"拉 5:1–2；該 1:12–14"},{"key":"立他為印","event":"哈該傳話給他，說到那日耶和華要以他為印，因為揀選了他。","ref":"該 2:23"},{"key":"倚靠神的靈","event":"撒迦利亞傳話給他，說所羅巴伯的手立了殿的根基，他的手也必完成這工。","ref":"亞 4:6–10"}],"ending":"聖經沒有記載他的結局；以斯拉記記聖殿在大利烏王第六年完工（拉 6:15），沒有再提到他。新約的家譜也列了他的名字（太 1:12–13；路 3:27）。","takeaway":"帶頭歸回，在阻撓中把聖殿重建起來"}},{"t":"ot","id":"ezra","era":"exile","full":"以斯拉","name":"以斯拉","note":"","data":{"id":"ezra","name":"以斯拉","aka":"","role":"精通摩西律法的祭司與文士","era":"exile","books":["ezra","nehemiah"],"life":[{"key":"敏捷文士","event":"他是大祭司亞倫的後裔，是敏捷的文士，精通耶和華所賜摩西的律法。","ref":"拉 7:1–6"},{"key":"定志考究","event":"他定志考究遵行耶和華的律法，又將律例典章教訓以色列人。","ref":"拉 7:10"},{"key":"王的諭旨","event":"波斯王亞達薛西第七年賜他諭旨，准他帶願意的人和金銀上耶路撒冷。","ref":"拉 7:7–26"},{"key":"河邊禁食","event":"他在亞哈瓦河邊宣告禁食，因為曾對王說神必保佑尋求他的人，就羞於向王求兵護送。","ref":"拉 8:21–23"},{"key":"平安抵達","event":"一路蒙神保護到了耶路撒冷，把金銀和器皿按數目、分量交在殿裡。","ref":"拉 8:31–34"},{"key":"為雜婚認罪","event":"聽說百姓與外邦人通婚，他撕裂衣服、拔頭髮和鬍鬚，在神殿前哭泣認罪禱告。","ref":"拉 9:1～10:1"},{"key":"立約休妻","event":"眾人在大雨中聚集，承認罪過，立約休離外邦的妻子。","ref":"拉 10:2–17"},{"key":"宣讀律法","event":"尼希米的時候，他站在木臺上從清早到晌午宣讀律法書，利未人講明意思，百姓聽了都哭。","ref":"尼 8:1–9"},{"key":"奉獻城牆","event":"城牆告成奉獻時，文士以斯拉走在一隊人的前面。","ref":"尼 12:27、36"}],"ending":"聖經沒有記載他的結局。","takeaway":"帶回律法，讓百姓重新聽懂神的話"}},{"t":"ot","id":"nehemiah","era":"exile","full":"尼希米","name":"尼希米","note":"","data":{"id":"nehemiah","name":"尼希米","aka":"","role":"波斯王的酒政，回鄉修城牆","era":"exile","books":["nehemiah"],"life":[{"key":"聽聞消息","event":"亞達薛西王二十年，他在書珊城（今伊朗境內）聽說耶路撒冷城牆拆毀、城門被火焚燒，就坐下哭泣，禁食禱告。","ref":"尼 1:1–4"},{"key":"王前開口","event":"他作王的酒政，在王面前面帶愁容；王問他要求什麼，他默禱天上的神，就求王差他回去建造那城。","ref":"尼 1:11～2:8"},{"key":"夜察城牆","event":"到耶路撒冷三天後，他夜間起來，察看拆毀的城牆和被燒的城門。","ref":"尼 2:11–16"},{"key":"分段修造","event":"祭司、各家各族分段修造城牆和城門，每段都記下是誰修的。","ref":"尼 3"},{"key":"一手作工","event":"參巴拉、多比雅等人譏笑又謀害，他使修造的人一手作工、一手拿兵器，日夜防守。","ref":"尼 4"},{"key":"免除債務","event":"窮人因借貸賣了兒女，他責備貴冑和官長，叫他們歸還田地；他自己也不要省長的俸祿。","ref":"尼 5"},{"key":"不肯下去","event":"敵人四次約他到阿挪平原相會，他回答說自己正辦理大工，不能下去。","ref":"尼 6:1–4"},{"key":"五十二天","event":"城牆在以祿月二十五日修完，共修了五十二天。","ref":"尼 6:15"},{"key":"再次整頓","event":"他回王那裡後又回到耶路撒冷，把多比雅趕出殿中的屋子，整頓守安息日和雜婚的事。","ref":"尼 13:4–28"}],"ending":"聖經沒有記載他的結局；尼希米記以他求神記念他、施恩與他的禱告作結（尼 13:31）。","takeaway":"從王宮回鄉，五十二天修好城牆"}},{"t":"ot","id":"esther","era":"exile","full":"以斯帖","name":"以斯帖","note":"","data":{"id":"esther","name":"以斯帖","aka":"哈大沙","role":"成為波斯王后的猶大孤女","era":"exile","books":["esther"],"life":[{"key":"王后被廢","event":"亞哈隨魯王在書珊城設筵，王后瓦實提不肯應召，王就廢了她的王后之位。","ref":"斯 1"},{"key":"孤女哈大沙","event":"以斯帖又名哈大沙，是末底改叔叔的女兒；她父母死了，末底改收她為自己的女兒。","ref":"斯 2:7"},{"key":"被選入宮","event":"她被帶入宮中，得了希該的恩待；她照末底改的囑咐，沒有說出自己的籍貫宗族。","ref":"斯 2:8–10"},{"key":"立為王后","event":"王愛她過於愛眾女，把王后的冠冕戴在她頭上，立她為王后代替瓦實提。","ref":"斯 2:16–17"},{"key":"轉告謀害","event":"末底改得知兩個太監要害王，告訴以斯帖，她奉末底改的名報告王。","ref":"斯 2:21–23"},{"key":"滅族詔書","event":"哈曼因末底改不向他跪拜，設計發旨，要在亞達月十三日滅絕所有猶大人。","ref":"斯 3"},{"key":"焉知不是","event":"末底改勸她去求王，說她得了王后的位分，焉知不是為現今的機會。","ref":"斯 4:13–14"},{"key":"冒死見王","event":"她請眾猶大人為她禁食三晝三夜，決定違例進去見王，若因此死也甘心。","ref":"斯 4:15–16"},{"key":"擺設筵席","event":"王向她伸出金杖，她請王和哈曼赴筵，又請他們隔天再來赴第二次筵席。","ref":"斯 5:1–8"},{"key":"揭發哈曼","event":"第二次筵席上，她求王救她和本族的性命，指出敵人就是哈曼；哈曼被掛在他為末底改預備的木架上。","ref":"斯 7"},{"key":"另寫諭旨","event":"她又俯伏在王腳前，求王廢除哈曼的計謀；王准以王的名另寫諭旨，讓猶大人在那日保護性命。","ref":"斯 8:3–11"},{"key":"堅定普珥日","event":"她和末底改寫信，堅定守普珥日的規例。","ref":"斯 9:29–32"}],"ending":"聖經沒有記載她後來的事；她與末底改堅定的普珥日，成為猶大人世世代代守的節期（斯 9:28–32）。","takeaway":"從孤女到王后，冒死為同胞求命"}},{"t":"ot","id":"mordecai","era":"exile","full":"末底改","name":"末底改","note":"","data":{"id":"mordecai","name":"末底改","aka":"","role":"以斯帖的堂兄，後作王的宰相","era":"exile","books":["esther"],"life":[{"key":"被擄後裔","event":"他是便雅憫人，祖先與猶大王耶哥尼雅一同從耶路撒冷被擄，他住在書珊城。","ref":"斯 2:5–6"},{"key":"收養以斯帖","event":"他收養叔叔的女兒哈大沙為女；她入宮後，他天天在女院前走來走去，打聽她的消息。","ref":"斯 2:7、11"},{"key":"救王一命","event":"他坐在朝門，得知兩個太監要害王，就告訴以斯帖，這事寫在王面前的歷史上。","ref":"斯 2:21–23"},{"key":"不肯跪拜","event":"他不向哈曼跪拜，哈曼惱怒，就要滅絕王國中所有的猶大人。","ref":"斯 3:2–6"},{"key":"披麻哀號","event":"他撕裂衣服、穿上麻衣、蒙灰痛哭，又託人傳話，勸以斯帖進去求王。","ref":"斯 4:1–14"},{"key":"王夜不寐","event":"王夜間睡不著，叫人念歷史，得知末底改救王卻未得賞賜；哈曼正要求王掛他，反被命令為他牽馬遊城、尊榮他。","ref":"斯 6:1–11"},{"key":"接掌戒指","event":"哈曼被掛後，王把從哈曼收回的戒指給了他，以斯帖派他管理哈曼的家。","ref":"斯 8:1–2"},{"key":"頒普珥日","event":"他寫信給各省的猶大人，定亞達月十四、十五兩日為普珥日。","ref":"斯 9:20–22"},{"key":"作王宰相","event":"他作亞哈隨魯王的宰相，在猶大人中為大，為本族的人求好處。","ref":"斯 10:3"}],"ending":"以斯帖記以他作宰相、向本族人說和平的話作結（斯 10:3），聖經沒有記載他的死。","takeaway":"不向哈曼下跪，從朝門走到宰相"}},{"t":"ot","id":"job","era":"wisdom","full":"約伯","name":"約伯","note":"","data":{"id":"job","name":"約伯","aka":"","role":"烏斯地敬畏神的人","era":"wisdom","books":["job","ezekiel"],"life":[{"key":"完全正直","event":"烏斯地有一個人名叫約伯，完全正直、敬畏神、遠離惡事，有七個兒子、三個女兒和許多牲畜。","ref":"伯 1:1–3"},{"key":"天上對話","event":"撒但在耶和華面前說約伯敬畏神不是無故的，耶和華就准撒但試探他。","ref":"伯 1:6–12"},{"key":"一日失去","event":"一天之內牲畜被擄被燒、兒女被倒塌的房屋壓死；約伯伏在地上下拜，說賞賜的是耶和華，收取的也是耶和華。","ref":"伯 1:13–22"},{"key":"滿身毒瘡","event":"撒但擊打他從腳掌到頭頂長毒瘡，他坐在爐灰中拿瓦片刮身體；妻子叫他棄掉神，他仍不以口犯罪。","ref":"伯 2:7–10"},{"key":"三友來訪","event":"以利法、比勒達、瑣法來安慰他，七天七夜同他坐在地上，一言不發。","ref":"伯 2:11–13"},{"key":"三輪辯論","event":"他咒詛自己的生日；三個朋友認為他受苦必是犯了罪，約伯堅持自己無辜，求與神辯明。","ref":"伯 3～31"},{"key":"以利戶發言","event":"年輕的以利戶向約伯和三個朋友發怒，論說神的公義。","ref":"伯 32～37"},{"key":"旋風回答","event":"耶和華從旋風中回答他，問他立大地根基時在哪裡；約伯承認自己說了不明白的事，在塵土和爐灰中懊悔。","ref":"伯 38:1～42:6"},{"key":"加倍賜福","event":"約伯為朋友祈禱，耶和華使他從苦境轉回，賜他比從前所有的加倍，又有七個兒子、三個女兒。","ref":"伯 42:7–15"}],"ending":"此後約伯又活了一百四十年，得見兒孫直到四代，年紀老邁、日子滿足而死（伯 42:16–17）。以西結書把他和挪亞、但以理並列為義人（結 14:14、20），新約雅 5:11 提到約伯的忍耐。傳統上對約伯記的年代有不同看法。","takeaway":"失去一切仍不棄掉神，在旋風中遇見神"}},{"t":"nt","id":"jesus","era":"gospel","full":"耶穌","name":"耶穌","note":"","data":{"id":"jesus","name":"耶穌","aka":"拿撒勒人耶穌、基督、人子","role":"新約的中心人物，被稱為基督","era":"gospel","books":["matthew","mark","luke","john","acts","1corinthians","revelation"],"life":[{"key":"伯利恆降生","event":"在大衛的城伯利恆出生，被放在馬槽裡，牧羊人聽天使報信趕來看他","ref":"路 2:1–20"},{"key":"逃往埃及","event":"希律要除滅他，約瑟連夜帶母子逃往埃及；希律死後回來，住在加利利的拿撒勒","ref":"太 2:13–23"},{"key":"聖殿問答","event":"十二歲隨父母上耶路撒冷過逾越節，留在殿裡坐在教師中間，又聽又問","ref":"路 2:41–52"},{"key":"約旦河受洗","event":"在約旦河受施洗約翰的洗，聖靈彷彿鴿子降下，天上有聲音說這是我的愛子","ref":"太 3:13–17"},{"key":"曠野受試探","event":"在曠野禁食四十晝夜，三次用經上的話勝過魔鬼的試探","ref":"太 4:1–11"},{"key":"呼召門徒","event":"在加利利開始傳道，海邊呼召彼得、安得烈、雅各、約翰跟從他","ref":"太 4:12–22"},{"key":"登山寶訓","event":"在山上教導門徒，講八福、主禱文、愛仇敵、不要憂慮","ref":"太 5～7"},{"key":"神蹟與比喻","event":"在迦拿變水為酒、用五餅二魚餵飽五千人，又用撒種等比喻教導群眾","ref":"約 2:1–11、太 13～14"},{"key":"彼得認基督","event":"在該撒利亞腓立比，彼得說「你是基督，是永生神的兒子」；耶穌開始預告受難與復活","ref":"太 16:13–21"},{"key":"登山變像","event":"帶彼得、雅各、約翰上高山，臉面明亮如日頭，摩西和以利亞向他們顯現","ref":"太 17:1–8"},{"key":"進城潔淨聖殿","event":"騎驢進耶路撒冷，群眾鋪衣服喊和散那；隨後進殿趕出做買賣的人","ref":"太 21:1–13"},{"key":"最後晚餐","event":"與十二門徒吃逾越節晚餐，擘餅祝謝、傳杯，說出有一個人要賣他","ref":"太 26:17–30"},{"key":"被捕受審","event":"在客西馬尼禱告後被猶大帶人捉拿，經大祭司該亞法和彼拉多審問，被判釘十字架","ref":"太 26:36～27:26"},{"key":"釘十字架","event":"在各各他被釘，從午正到申初遍地黑暗，斷氣後葬在亞利馬太人約瑟的新墳墓","ref":"太 27:33–60"},{"key":"復活顯現","event":"七日的頭一日墳墓空了，他向抹大拉的馬利亞和其他婦女、再向門徒顯現","ref":"太 28:1–10、約 20:11–29"},{"key":"大使命升天","event":"吩咐門徒去使萬民作門徒、奉父子聖靈的名施洗，之後在門徒眼前被接升天","ref":"太 28:16–20、徒 1:9–11"}],"ending":"使徒行傳記載他復活後四十天向門徒顯現，然後在橄欖山被接升天，天使說他還要怎樣去也要怎樣來（徒 1:3–11）。","takeaway":"從馬槽到十字架與復活，新約圍繞他展開"}},{"t":"nt","id":"mary","era":"gospel","full":"馬利亞（耶穌的母親）","name":"馬利亞","note":"耶穌的母親","data":{"id":"mary","name":"馬利亞","aka":"耶穌的母親","role":"耶穌的母親，拿撒勒的童女","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"天使報信","event":"天使加百列在拿撒勒對她說，她要從聖靈懷孕生子，起名叫耶穌","ref":"路 1:26–38"},{"key":"探望伊利沙伯","event":"往山地去，到猶大的一座城探望親戚伊利沙伯，唱出「我心尊主為大」的詩歌","ref":"路 1:39–56"},{"key":"約瑟娶她","event":"約瑟本想暗暗把她休了，夢中受天使指示後娶了她","ref":"太 1:18–25"},{"key":"伯利恆生子","event":"因報名上冊與約瑟到伯利恆，在那裡生下頭胎的兒子，放在馬槽裡","ref":"路 2:1–7"},{"key":"存在心裡","event":"牧羊人來說天使報的好信息，她把這一切的事存在心裡，反覆思想","ref":"路 2:8–19"},{"key":"聖殿獻嬰","event":"帶嬰孩到聖殿獻給主，西面對她說「你自己的心也要被刀刺透」","ref":"路 2:22–35"},{"key":"逃往埃及","event":"跟著約瑟帶孩子逃往埃及，後來回到拿撒勒","ref":"太 2:13–23"},{"key":"殿中尋子","event":"耶穌十二歲那年，她和約瑟找了三天，才在殿裡找到他","ref":"路 2:41–51"},{"key":"迦拿婚宴","event":"婚宴的酒用盡了，她告訴耶穌，又吩咐僕人「他告訴你們甚麼，你們就做甚麼」","ref":"約 2:1–11"},{"key":"家人來找","event":"和耶穌的弟兄站在外面找他，耶穌說遵行神旨意的人就是他的弟兄姊妹和母親","ref":"可 3:31–35"},{"key":"十字架旁","event":"站在十字架旁，耶穌把她託給他所愛的門徒，那門徒從此接她到自己家裡","ref":"約 19:25–27"},{"key":"樓房禱告","event":"耶穌升天後，和使徒、耶穌的弟兄們一起同心合意地恆切禱告","ref":"徒 1:14"}],"ending":"聖經最後提到她是在徒 1:14，之後的事聖經沒有記載；傳統上說她晚年住在以弗所，也有說法是在耶路撒冷。","takeaway":"從天使報信到十字架旁，一路陪伴耶穌的母親"}},{"t":"nt","id":"joseph","era":"gospel","full":"約瑟（馬利亞的丈夫）","name":"約瑟","note":"馬利亞的丈夫","data":{"id":"joseph","name":"約瑟","aka":"","role":"馬利亞的丈夫，大衛的後裔","era":"gospel","books":["matthew","luke","john"],"life":[{"key":"與馬利亞訂婚","event":"大衛家的人，在拿撒勒和童女馬利亞訂了婚","ref":"路 1:26–27"},{"key":"想暗暗休她","event":"知道馬利亞懷了孕，他是個義人，不願意明明地羞辱她，想要暗暗地把她休了","ref":"太 1:18–19"},{"key":"夢中娶妻","event":"天使在夢中說孩子是從聖靈來的，他醒來就娶了馬利亞，給孩子起名叫耶穌","ref":"太 1:20–25"},{"key":"伯利恆報名","event":"因該撒亞古士督的旨意，帶著馬利亞回大衛的城伯利恆報名上冊","ref":"路 2:1–7"},{"key":"逃往埃及","event":"天使在夢中警告希律要除滅孩子，他連夜帶母子逃往埃及","ref":"太 2:13–15"},{"key":"回拿撒勒","event":"希律死後在夢中受指示回以色列地，因亞基老作王，改住加利利的拿撒勒","ref":"太 2:19–23"},{"key":"殿中尋子","event":"耶穌十二歲那年，他和馬利亞找了三天，在殿裡找到耶穌","ref":"路 2:41–51"}],"ending":"聖經沒有記載他的死；耶穌開始傳道後他就不再出現，鄉里稱耶穌是「木匠的兒子」（太 13:55）。傳統上多認為他在耶穌出來傳道之前已經過世。","takeaway":"四次照夢中的指示行動，保護了馬利亞和孩子"}},{"t":"nt","id":"john-baptist","era":"gospel","full":"施洗約翰","name":"施洗約翰","note":"","data":{"id":"john-baptist","name":"施洗約翰","aka":"約翰","role":"為耶穌預備道路的先知","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"天使預告","event":"天使在聖殿裡向父親撒迦利亞預告他要出生，要叫許多以色列人回轉","ref":"路 1:5–17"},{"key":"出生命名","event":"出生後照天使的話取名約翰，父親撒迦利亞的口立刻開了","ref":"路 1:57–66"},{"key":"曠野長大","event":"孩子漸漸長大，心靈強健，住在曠野，直到向以色列人顯明的日子","ref":"路 1:80"},{"key":"曠野傳道","event":"穿駱駝毛的衣服、吃蝗蟲野蜜，在猶太的曠野傳悔改的道，在約旦河裡為人施洗","ref":"太 3:1–12","note":"這個細節記在路加福音 3:3：「他就來到約旦河一帶地方，宣講悔改的洗禮」。"},{"key":"為耶穌施洗","event":"耶穌來受洗，他先推辭說「我當受你的洗」，後來為耶穌施洗","ref":"太 3:13–17"},{"key":"神的羔羊","event":"看見耶穌走過，說「看哪，神的羔羊」，他的兩個門徒因此跟從了耶穌","ref":"約 1:29–37"},{"key":"責備希律","event":"指責希律安提帕娶了兄弟腓力的妻子希羅底，被下在監裡","ref":"太 14:3–4"},{"key":"獄中發問","event":"在監裡打發門徒去問耶穌「那將要來的是你嗎」","ref":"太 11:2–6"},{"key":"被斬首","event":"希律生日宴上希羅底的女兒跳舞，受母親指使求要他的頭，希律就差人斬了他","ref":"太 14:6–12"}],"ending":"在監裡被希律安提帕斬首，頭放在盤子上給了希羅底的女兒，他的門徒把屍首領去埋葬（太 14:6–12）。","takeaway":"在曠野呼喊悔改，為耶穌預備道路"}},{"t":"nt","id":"zechariah-elizabeth","era":"gospel","full":"撒迦利亞與伊利沙伯","name":"撒迦利亞與伊利沙伯","note":"","data":{"id":"zechariah-elizabeth","name":"撒迦利亞與伊利沙伯","aka":"","role":"施洗約翰的父母","era":"gospel","books":["luke"],"life":[{"key":"年老無子","event":"撒迦利亞是祭司，夫妻兩人都是義人，但伊利沙伯不生育，兩人年紀老邁","ref":"路 1:5–7"},{"key":"聖殿見天使","event":"撒迦利亞進殿燒香，天使加百列站在香壇右邊，預告他們要生一個兒子","ref":"路 1:8–17"},{"key":"不信變啞","event":"撒迦利亞問「我憑著甚麼可知道這事呢」，因不信而成了啞巴","ref":"路 1:18–23"},{"key":"隱藏五月","event":"伊利沙伯懷了孕，就隱藏了五個月","ref":"路 1:24–25"},{"key":"馬利亞來訪","event":"馬利亞來問安，胎兒在伊利沙伯腹裡跳動，她被聖靈充滿祝福馬利亞","ref":"路 1:39–45"},{"key":"寫名約翰","event":"孩子出生第八天，撒迦利亞要了寫字的板寫「他的名字是約翰」，口就開了","ref":"路 1:57–64"},{"key":"撒迦利亞頌","event":"撒迦利亞被聖靈充滿說預言，說這孩子要在主前面預備他的道路","ref":"路 1:67–79"}],"ending":"聖經沒有記載兩人後來的事。","takeaway":"年老得子，生下為耶穌預備道路的約翰"}},{"t":"nt","id":"herod-great","era":"gospel","full":"大希律","name":"大希律","note":"","data":{"id":"herod-great","name":"大希律","aka":"希律王","role":"羅馬扶植的猶太王","era":"gospel","books":["matthew","luke"],"life":[{"key":"博士來訪","event":"東方的博士來耶路撒冷打聽猶太人之王，他聽見就心裡不安","ref":"太 2:1–3"},{"key":"查問出生地","event":"召齊祭司長和民間的文士，查出基督當生在猶太的伯利恆","ref":"太 2:4–6"},{"key":"暗召博士","event":"暗暗召博士來問明星出現的時候，叫他們找到孩子就來報信","ref":"太 2:7–8"},{"key":"屠殺嬰孩","event":"發現被博士愚弄，大大發怒，差人殺盡伯利恆和四境兩歲以內的男孩","ref":"太 2:16–18"},{"key":"希律去世","event":"希律死了以後，主的使者在夢中叫約瑟帶孩子回以色列地","ref":"太 2:19–20"}],"ending":"聖經只寫他死了（太 2:19）；古代史家約瑟夫記載他約在主前 4 年病死，死後國土分給幾個兒子，亞基老得了猶太。","takeaway":"怕王位被奪，下令殺伯利恆的嬰孩"}},{"t":"nt","id":"herod-antipas","era":"gospel","full":"希律安提帕","name":"希律安提帕","note":"","data":{"id":"herod-antipas","name":"希律安提帕","aka":"分封的王希律","role":"加利利分封的王，大希律之子","era":"gospel","books":["matthew","mark","luke","acts"],"life":[{"key":"加利利分封王","event":"提庇留在位第十五年，他作加利利分封的王","ref":"路 3:1"},{"key":"囚禁約翰","event":"因約翰說他娶兄弟腓力的妻子希羅底是不合理的，就把約翰鎖在監裡","ref":"可 6:17–18"},{"key":"生日宴斬約翰","event":"生日宴上希羅底的女兒跳舞，他起誓答應她，結果差人斬了約翰","ref":"可 6:21–28"},{"key":"以為約翰復活","event":"聽見耶穌的名聲，說這是約翰從死裡復活了","ref":"可 6:14–16"},{"key":"想殺耶穌","event":"有法利賽人說希律想要殺耶穌，耶穌稱他「那個狐狸」","ref":"路 13:31–32"},{"key":"戲弄耶穌","event":"彼拉多把耶穌送來，他問了許多話，耶穌一言不答，他就和兵丁戲弄耶穌","ref":"路 23:6–11"},{"key":"與彼拉多和好","event":"彼此原有仇，從那一天就成了朋友","ref":"路 23:12"}],"ending":"聖經沒有記載他的結局；古代史家約瑟夫記載他約在主後 39 年被羅馬皇帝革職，流放到高盧。","takeaway":"斬了施洗約翰，又在耶穌受審時戲弄他"}},{"t":"nt","id":"peter","era":"gospel","full":"彼得","name":"彼得","note":"","data":{"id":"peter","name":"彼得","aka":"西門、磯法、西門巴約拿","role":"十二使徒名單頭一個，初代教會領袖","era":"gospel","books":["matthew","mark","luke","john","acts","1corinthians","galatians","1peter","2peter"],"life":[{"key":"得名磯法","event":"哥哥安得烈帶他去見耶穌，耶穌給他起名叫磯法（翻出來就是彼得）","ref":"約 1:40–42"},{"key":"得人如得魚","event":"在加利利海撒網打魚，耶穌說「來跟從我，我要叫你們得人如得魚」，他就撇下網跟從","ref":"太 4:18–20"},{"key":"海上行走","event":"在海面上走向耶穌，一看見風大就害怕下沉，喊「主啊，救我！」","ref":"太 14:28–31"},{"key":"認基督","event":"耶穌問門徒說他是誰，彼得說「你是基督，是永生神的兒子」","ref":"太 16:13–19"},{"key":"登山變像","event":"和雅各、約翰在山上看見耶穌變像，提議搭三座棚","ref":"太 17:1–8"},{"key":"被洗腳","event":"最後晚餐耶穌要為他洗腳，他先說「你永不可洗我的腳」，後來又求連手和頭也洗","ref":"約 13:6–10"},{"key":"三次不認主","event":"耶穌受審時，他在院子裡三次說不認得耶穌，雞叫了，他出去痛哭","ref":"太 26:69–75"},{"key":"奔向空墳","event":"聽抹大拉的馬利亞報信，和另一個門徒跑到墳墓，看見細麻布還放在那裡","ref":"約 20:2–10"},{"key":"三問你愛我","event":"耶穌復活後在提比哩亞海邊三次問他「你愛我嗎」，吩咐他「你餵養我的羊」","ref":"約 21:15–19"},{"key":"五旬節講道","event":"聖靈降臨後站起來講道，那一天，門徒約添了三千人","ref":"徒 2:14–41"},{"key":"美門口醫治","event":"和約翰在聖殿美門口奉耶穌的名叫生來瘸腿的人起來行走","ref":"徒 3:1–10"},{"key":"哥尼流家","event":"看見異象後到該撒利亞百夫長哥尼流家講道，外邦人也受了聖靈","ref":"徒 10"},{"key":"天使救出監","event":"希律亞基帕把他下在監裡，夜裡天使叫他起來，鎖鍊脫落，他走出監門","ref":"徒 12:1–17"},{"key":"耶路撒冷會議","event":"在使徒和長老的會議上發言，說神潔淨外邦人的心，不該把祖宗和我們所不能負的軛放在門徒的頸項上","ref":"徒 15:7–11","note":"「重擔」記在使徒行傳 15:28：「不將別的重擔放在你們身上」。"},{"key":"安提阿被責","event":"在安提阿原本與外邦信徒同吃，雅各那裡的人來了就退去，保羅當面抵擋他","ref":"加 2:11–14"},{"key":"寫兩封書信","event":"彼得前書與彼得後書開頭都署名使徒彼得；彼得後書的作者學界也有不同看法","ref":"彼前 1:1、彼後 1:1"}],"ending":"聖經沒有記載他怎麼死，只記耶穌預言他將來要被別人帶到不願意去的地方，用死榮耀神（約 21:18–19）。傳統上說他約在主後 64～68 年在羅馬殉道，並有倒釘十字架的說法。","takeaway":"衝動跌倒又被挽回，成為初代教會的領袖"}},{"t":"nt","id":"andrew","era":"gospel","full":"安得烈","name":"安得烈","note":"","data":{"id":"andrew","name":"安得烈","aka":"","role":"彼得的弟弟，最早跟從耶穌的門徒之一","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"從約翰轉向","event":"原是施洗約翰的門徒，聽約翰說「看哪，這是神的羔羊」，就跟從了耶穌","ref":"約 1:35–40"},{"key":"帶哥哥見主","event":"先找著哥哥西門，說「我們遇見彌賽亞了」，領他去見耶穌","ref":"約 1:41–42"},{"key":"海邊蒙召","event":"和西門在加利利海撒網，耶穌呼召他們得人如得魚，他們就跟從了","ref":"太 4:18–20"},{"key":"列為使徒","event":"被列在十二使徒之中","ref":"太 10:2"},{"key":"找到五餅二魚","event":"耶穌要餵飽五千人時，他說這裡有一個孩童帶著五個大麥餅、兩條魚","ref":"約 6:8–9"},{"key":"引希臘人","event":"有希臘人想見耶穌，腓力來告訴他，他和腓力一起去告訴耶穌","ref":"約 12:20–22"},{"key":"橄欖山發問","event":"和彼得、雅各、約翰在橄欖山上私下問耶穌聖殿被拆毀的事何時發生","ref":"可 13:3–4"},{"key":"樓房禱告","event":"耶穌升天後與其他使徒在樓房上同心禱告","ref":"徒 1:13–14"}],"ending":"聖經沒有記載他後來的事；傳統上說他在希臘一帶傳道並殉道，後來的傳說說他被釘在 X 形的十字架上。","takeaway":"常常把人帶到耶穌面前的人"}},{"t":"nt","id":"james-zebedee","era":"gospel","full":"雅各（西庇太的兒子）","name":"雅各","note":"西庇太的兒子","data":{"id":"james-zebedee","name":"雅各","aka":"西庇太的兒子雅各、半尼其（雷子）","role":"西庇太的兒子，與約翰是兄弟","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"補網時蒙召","event":"和兄弟約翰同父親西庇太在船上補網，耶穌一招呼，就撇下船和父親跟從","ref":"太 4:21–22"},{"key":"稱為雷子","event":"被列為十二使徒，耶穌給他和約翰起名叫半尼其，就是雷子的意思","ref":"可 3:17"},{"key":"睚魯女兒","event":"和彼得、約翰一同進屋，看見耶穌叫睚魯的女兒從死裡起來","ref":"可 5:37–42"},{"key":"登山變像","event":"和彼得、約翰在高山上看見耶穌變像","ref":"太 17:1–8"},{"key":"要火燒村","event":"撒馬利亞的村莊不接待耶穌，他和約翰問要不要吩咐火從天上降下來，被耶穌責備","ref":"路 9:51–56"},{"key":"求坐左右","event":"和約翰求耶穌在榮耀裡讓他們一個坐右邊、一個坐左邊","ref":"可 10:35–40"},{"key":"客西馬尼","event":"和彼得、約翰被耶穌帶到園子更深處一起警醒，卻睡著了","ref":"可 14:32–41"},{"key":"樓房禱告","event":"耶穌升天後與其他使徒在樓房上同心禱告","ref":"徒 1:13–14"},{"key":"被刀所殺","event":"希律王（亞基帕一世）苦害教會，用刀殺了約翰的哥哥雅各","ref":"徒 12:1–2"}],"ending":"被希律亞基帕用刀所殺（徒 12:1–2），是聖經記載中唯一寫明殉道經過的十二使徒。","takeaway":"耶穌身邊的三人之一，被希律用刀所殺"}},{"t":"nt","id":"john","era":"gospel","full":"約翰（使徒）","name":"約翰","note":"使徒","data":{"id":"john","name":"約翰","aka":"西庇太的兒子約翰、半尼其（雷子）；傳統上認為就是「耶穌所愛的那門徒」","role":"西庇太的兒子，十二使徒之一","era":"gospel","books":["matthew","mark","luke","john","acts","galatians","1john","2john","3john","revelation"],"life":[{"key":"補網蒙召","event":"和哥哥雅各同父親西庇太在船上補網，耶穌一招呼就跟從了","ref":"太 4:21–22"},{"key":"稱為雷子","event":"被列為十二使徒，和雅各一同被耶穌起名半尼其，就是雷子","ref":"可 3:17"},{"key":"登山變像","event":"和彼得、雅各在高山上看見耶穌變像","ref":"太 17:1–8"},{"key":"禁止人趕鬼","event":"看見有人奉耶穌的名趕鬼就禁止他，耶穌說不敵擋你們的就是幫助你們的","ref":"路 9:49–50"},{"key":"要火燒村","event":"撒馬利亞的村莊不接待耶穌，他和雅各想吩咐火從天上降下，被耶穌責備","ref":"路 9:51–56"},{"key":"預備逾越節","event":"耶穌差他和彼得進城預備逾越節的晚餐","ref":"路 22:8–13"},{"key":"十字架旁受託","event":"耶穌所愛的那門徒站在十字架旁，耶穌把母親託付給他","ref":"約 19:25–27"},{"key":"跑到空墳","event":"那門徒和彼得一同跑到墳墓，他先到，進去看見就信了","ref":"約 20:2–8"},{"key":"美門口作證","event":"和彼得在聖殿美門口醫好瘸腿的人，被帶到公會前，兩人放膽作見證","ref":"徒 3:1～4:20"},{"key":"撒馬利亞按手","event":"和彼得被差到撒馬利亞，為信主的人按手，他們就受了聖靈","ref":"徒 8:14–17"},{"key":"教會的柱石","event":"保羅說他和雅各、磯法是耶路撒冷教會被稱為柱石的人","ref":"加 2:9"},{"key":"寫福音書信","event":"傳統上認為約翰福音和約翰一、二、三書出自他手；書中自稱是親眼見證的人","ref":"約 21:24、約壹 1:1–4"},{"key":"拔摩島異象","event":"啟示錄作者約翰說，他為神的道和耶穌的見證曾在拔摩海島，在那裡看見異象；傳統上認為就是使徒約翰","ref":"啟 1:9–11"}],"ending":"聖經沒有記載他的死；約翰福音提到當時有「那門徒不死」的傳言，書中特別更正（約 21:22–23）。傳統上說他晚年住在以弗所，年老時去世。","takeaway":"從要火燒村的雷子，到寫下彼此相愛的書信"}},{"t":"nt","id":"matthew","era":"gospel","full":"馬太","name":"馬太","note":"","data":{"id":"matthew","name":"馬太","aka":"利未（亞勒腓的兒子），傳統上認為與馬太是同一人","role":"稅吏出身的使徒","era":"gospel","books":["matthew","mark","luke","acts"],"life":[{"key":"稅關蒙召","event":"坐在稅關上，耶穌說「你跟從我來」，他就起來跟從了耶穌","ref":"太 9:9"},{"key":"家中設宴","event":"在家裡為耶穌大擺筵席，許多稅吏和罪人同坐，法利賽人因此議論","ref":"路 5:27–32"},{"key":"列為使徒","event":"被列在十二使徒之中，馬太福音稱他為「稅吏馬太」","ref":"太 10:3"},{"key":"樓房禱告","event":"耶穌升天後與其他使徒在樓房上同心禱告","ref":"徒 1:13–14"},{"key":"福音書作者","event":"傳統上認為馬太福音是他寫的；福音書本身沒有署名作者","ref":"太 1:1"}],"ending":"聖經沒有記載他後來的事；傳統上說他到各地傳道，殉道地點有不同說法。","takeaway":"被人看不起的稅吏，起來跟從了耶穌"}},{"t":"nt","id":"thomas","era":"gospel","full":"多馬","name":"多馬","note":"","data":{"id":"thomas","name":"多馬","aka":"低土馬（雙生的意思）","role":"十二使徒之一，曾說非看見不信","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"列為使徒","event":"被列在十二使徒之中","ref":"太 10:3"},{"key":"同去同死","event":"耶穌要回猶太去拉撒路那裡，他對門徒說「我們也去和他同死吧」","ref":"約 11:16"},{"key":"問那條路","event":"他說「我們不知道你往哪裡去，怎麼知道那條路呢」，耶穌回答「我就是道路、真理、生命」","ref":"約 14:5–6"},{"key":"不見不信","event":"耶穌復活後向門徒顯現時他不在，說非看見釘痕、摸他的肋旁，總不信","ref":"約 20:24–25"},{"key":"我的主我的神","event":"八天後耶穌再顯現，叫他伸手摸，他說「我的主！我的神！」","ref":"約 20:26–29"},{"key":"海邊見主","event":"和彼得等人在提比哩亞海打魚，耶穌在岸上向他們顯現","ref":"約 21:1–14"},{"key":"樓房禱告","event":"耶穌升天後與其他使徒在樓房上同心禱告","ref":"徒 1:13–14"}],"ending":"聖經沒有記載他後來的事；傳統上說他到印度傳道，並在那裡殉道。","takeaway":"要親眼看見才信，看見後說出「我的主！我的神！」"}},{"t":"nt","id":"philip-apostle","era":"gospel","full":"腓力（使徒）","name":"腓力","note":"使徒","data":{"id":"philip-apostle","name":"腓力","aka":"使徒腓力（不是傳福音的腓利）","role":"伯賽大人，十二使徒之一","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"被呼召","event":"耶穌想要往加利利去時遇見他，說「來跟從我吧」；他是伯賽大人","ref":"約 1:43–44"},{"key":"你來看","event":"找著拿但業說遇見了拿撒勒人耶穌，拿但業懷疑，他說「你來看」","ref":"約 1:45–46"},{"key":"列為使徒","event":"被列在十二使徒之中","ref":"太 10:3"},{"key":"算餅錢","event":"耶穌問他從哪裡買餅給五千人吃，他說就是二十兩銀子的餅也不夠","ref":"約 6:5–7"},{"key":"引希臘人","event":"有希臘人來求見耶穌，他去告訴安得烈，兩人一起告訴耶穌","ref":"約 12:20–22"},{"key":"求看父","event":"他說「求主將父顯給我們看」，耶穌說人看見了他就是看見了父","ref":"約 14:8–9"},{"key":"樓房禱告","event":"耶穌升天後與其他使徒在樓房上同心禱告","ref":"徒 1:13–14"}],"ending":"聖經沒有記載他後來的事；傳統上說他在小亞細亞的希拉坡里一帶傳道並殉道。","takeaway":"一句「你來看」，把拿但業帶到耶穌面前"}},{"t":"nt","id":"judas","era":"gospel","full":"加略人猶大","name":"加略人猶大","note":"","data":{"id":"judas","name":"加略人猶大","aka":"加略人西門的兒子猶大（不是主的兄弟猶大）","role":"十二使徒之一，出賣耶穌的人","era":"gospel","books":["matthew","mark","luke","john","acts"],"life":[{"key":"列為使徒","event":"被列在十二使徒之中，馬太、馬可的名單都稱他是「賣耶穌的」","ref":"太 10:4"},{"key":"嫌香膏浪費","event":"馬利亞用香膏抹耶穌的腳，他說何不賣了賙濟窮人；約翰說他是賊，管著錢囊","ref":"約 12:3–6"},{"key":"三十塊錢","event":"去見祭司長，問給他多少錢，他們給了他三十塊錢，他就找機會出賣耶穌","ref":"太 26:14–16"},{"key":"晚餐被點出","event":"最後晚餐耶穌說有一個人要賣他，把蘸過的餅給了猶大，他受了餅立刻出去，那時是夜間","ref":"約 13:21–30"},{"key":"親嘴為號","event":"帶著拿刀棒的人到客西馬尼，上前親耶穌，作為捉拿的暗號","ref":"太 26:47–50"},{"key":"後悔還錢","event":"看見耶穌已被定罪就後悔，把錢丟在殿裡，出去吊死了","ref":"太 27:3–5"}],"ending":"馬太福音說他把錢丟在殿裡，出去吊死了，祭司長用那錢買了窯戶的一塊田（太 27:3–8）；使徒行傳說他身子仆倒、肚腹崩裂，那塊田叫作「血田」（徒 1:18–19）。使徒們後來抽籤選馬提亞補他的位（徒 1:26）。","takeaway":"用三十塊錢出賣耶穌，事後後悔"}},{"t":"nt","id":"mary-magdalene","era":"gospel","full":"抹大拉的馬利亞","name":"抹大拉的馬利亞","note":"","data":{"id":"mary-magdalene","name":"抹大拉的馬利亞","aka":"","role":"被耶穌趕出七個鬼、跟隨耶穌的婦女","era":"gospel","books":["matthew","mark","luke","john"],"life":[{"key":"七鬼被趕","event":"耶穌曾從她身上趕出七個鬼","ref":"路 8:2"},{"key":"跟隨供應","event":"和約亞拿、蘇撒拿等婦女跟隨耶穌，用自己的財物供給耶穌和門徒","ref":"路 8:1–3"},{"key":"十字架旁","event":"耶穌被釘時，她和幾位婦女站在十字架旁","ref":"約 19:25"},{"key":"看守安葬","event":"耶穌被安葬時，她看見安放耶穌的地方","ref":"可 15:47"},{"key":"清早到墳","event":"七日的頭一日天還黑，她來到墳墓，看見石頭挪開了，跑去告訴彼得","ref":"約 20:1–2"},{"key":"見復活主","event":"她站在墳外哭，耶穌叫她「馬利亞」，她認出來，叫「拉波尼」","ref":"約 20:11–16"},{"key":"報信門徒","event":"去告訴門徒「我已經看見了主」，並把耶穌的話告訴他們","ref":"約 20:17–18"}],"ending":"聖經沒有記載她後來的事。把她說成妓女或路加福音 7 章那位有罪的女人，是後來的傳統混淆，聖經本文沒有這樣寫。","takeaway":"聖經記載第一個見到復活耶穌的人"}},{"t":"nt","id":"martha-mary-lazarus","era":"gospel","full":"馬大、馬利亞與拉撒路","name":"馬大、馬利亞與拉撒路","note":"","data":{"id":"martha-mary-lazarus","name":"馬大、馬利亞與拉撒路","aka":"伯大尼的一家","role":"伯大尼的兩姊妹和她們的兄弟","era":"gospel","books":["luke","john"],"life":[{"key":"接待耶穌","event":"馬大接待耶穌，為伺候的事忙亂，馬利亞坐在耶穌腳前聽道","ref":"路 10:38–42"},{"key":"拉撒路病死","event":"姊妹差人告訴耶穌拉撒路病了，耶穌等了兩天才動身，到時拉撒路已經死了","ref":"約 11:1–17"},{"key":"復活在我","event":"馬大出來迎接，耶穌對她說「復活在我，生命也在我」","ref":"約 11:20–27"},{"key":"耶穌哭了","event":"馬利亞俯伏在耶穌腳前哭，耶穌心裡悲歎，也哭了","ref":"約 11:32–35"},{"key":"拉撒路出來","event":"拉撒路已經死了四天，耶穌大聲呼叫「拉撒路出來」，死人就出來了","ref":"約 11:38–44"},{"key":"引來殺機","event":"許多人因此信了耶穌，祭司長商議要殺耶穌，也要殺拉撒路","ref":"約 11:45–53、12:9–11"},{"key":"香膏抹腳","event":"逾越節前六日在伯大尼的筵席，馬大伺候、拉撒路同席，馬利亞用真哪噠香膏抹耶穌的腳","ref":"約 12:1–3"}],"ending":"聖經沒有記載三人後來的事。這位馬利亞不是抹大拉的馬利亞，也不是耶穌的母親。","takeaway":"耶穌所愛的一家，見證拉撒路從死裡出來"}},{"t":"nt","id":"nicodemus","era":"gospel","full":"尼哥底母","name":"尼哥底母","note":"","data":{"id":"nicodemus","name":"尼哥底母","aka":"","role":"法利賽人，猶太人的官","era":"gospel","books":["john"],"life":[{"key":"夜訪耶穌","event":"他是法利賽人、猶太人的官，夜裡來見耶穌","ref":"約 3:1–2"},{"key":"重生對話","event":"耶穌說人若不重生就不能見神的國，他問「人已經老了，如何能重生呢」","ref":"約 3:3–10"},{"key":"為耶穌說話","event":"差役沒有捉拿耶穌回來、法利賽人責備他們時，他說不先聽本人的口供、查明他所做的事，難道我們的律法還定他的罪嗎","ref":"約 7:45–52"},{"key":"帶香料安葬","event":"帶著沒藥和沉香約有一百斤，和亞利馬太的約瑟一同用細麻布裹好耶穌的身體","ref":"約 19:39–40"}],"ending":"聖經沒有記載他後來的事。","takeaway":"從夜裡來問道，到公開幫忙安葬耶穌"}},{"t":"nt","id":"zacchaeus","era":"gospel","full":"撒該","name":"撒該","note":"","data":{"id":"zacchaeus","name":"撒該","aka":"","role":"耶利哥的稅吏長","era":"gospel","books":["luke"],"life":[{"key":"稅吏長","event":"耶穌經過耶利哥，城裡有一個稅吏長叫撒該，是個財主","ref":"路 19:1–2"},{"key":"爬上桑樹","event":"他身量矮小，人多看不見耶穌，就跑到前頭爬上桑樹","ref":"路 19:3–4"},{"key":"耶穌住他家","event":"耶穌抬頭叫他快下來，說今天必住在他家，眾人私下議論","ref":"路 19:5–7"},{"key":"一半給窮人","event":"他說要把一半家產給窮人，若訛詐了誰就還他四倍","ref":"路 19:8"},{"key":"救恩到這家","event":"耶穌說今天救恩到了這家，人子來為要尋找拯救失喪的人","ref":"路 19:9–10"}],"ending":"聖經沒有記載他後來的事。","takeaway":"爬上桑樹看耶穌，見面後改變了用錢的方式"}},{"t":"nt","id":"pilate","era":"gospel","full":"彼拉多","name":"彼拉多","note":"","data":{"id":"pilate","name":"彼拉多","aka":"本丟彼拉多","role":"羅馬派駐猶太的巡撫","era":"gospel","books":["matthew","mark","luke","john","acts","1timothy"],"life":[{"key":"巡撫猶太","event":"提庇留在位第十五年，本丟彼拉多作猶太巡撫","ref":"路 3:1"},{"key":"加利利人的血","event":"有人告訴耶穌，彼拉多使加利利人的血攙雜在他們的祭物中","ref":"路 13:1"},{"key":"審問耶穌","event":"問耶穌「你是猶太人的王嗎」，又問「真理是甚麼呢」，出來說查不出他有甚麼罪","ref":"約 18:33–38"},{"key":"送去希律","event":"知道耶穌是加利利人，就把他送到希律那裡，希律又送回來","ref":"路 23:6–12"},{"key":"妻子託夢","event":"他坐堂時，夫人打發人來說「這義人的事，你一點不可管」","ref":"太 27:19"},{"key":"釋放巴拉巴","event":"照節期慣例要釋放一個囚犯，群眾要求釋放巴拉巴、釘耶穌","ref":"太 27:15–23"},{"key":"洗手","event":"見群眾要生亂，拿水洗手說「流這義人的血，罪不在我」","ref":"太 27:24–26"},{"key":"判釘十字架","event":"把耶穌交給人釘十字架，在十字架上寫牌子「猶太人的王，拿撒勒人耶穌」","ref":"約 19:16–22"},{"key":"准領屍體","event":"准亞利馬太的約瑟領去耶穌的身體，又准祭司長派兵看守墳墓","ref":"太 27:57–66"}],"ending":"聖經沒有記載他的結局；古代史家約瑟夫記載他約在主後 36 年被上司調回羅馬受審。","takeaway":"說查不出耶穌有罪，仍順從群眾判他釘十字架"}},{"t":"nt","id":"caiaphas","era":"gospel","full":"該亞法","name":"該亞法","note":"","data":{"id":"caiaphas","name":"該亞法","aka":"","role":"審判耶穌時的大祭司","era":"gospel","books":["matthew","luke","john","acts"],"life":[{"key":"當年大祭司","event":"亞那和該亞法作大祭司的時候，施洗約翰在曠野傳道","ref":"路 3:2"},{"key":"一人替死","event":"公會議論耶穌時，他說一個人替百姓死，免得通國滅亡，是你們的益處","ref":"約 11:47–53"},{"key":"商議捉拿","event":"祭司長和民間的長老聚集在他院裡，商議用詭計捉拿耶穌","ref":"太 26:3–5"},{"key":"夜審耶穌","event":"耶穌被帶到他那裡，他叫耶穌起誓說是不是基督，然後撕開衣服說他說了僭妄的話","ref":"太 26:57–66"},{"key":"交給彼拉多","event":"眾人把耶穌從該亞法那裡往衙門內解去，交給彼拉多","ref":"約 18:28"},{"key":"審問使徒","event":"和亞那等大祭司家族的人審問彼得和約翰，禁止他們奉耶穌的名講論","ref":"徒 4:5–18"}],"ending":"聖經沒有記載他的結局；古代史家約瑟夫記載他約在主後 36 年被羅馬官員撤換大祭司的職位。","takeaway":"主張「一個人替百姓死」，主導審判耶穌"}},{"t":"nt","id":"joseph-arimathea","era":"gospel","full":"亞利馬太的約瑟","name":"亞利馬太的約瑟","note":"","data":{"id":"joseph-arimathea","name":"亞利馬太的約瑟","aka":"","role":"亞利馬太人，富有的議士","era":"gospel","books":["matthew","mark","luke","john"],"life":[{"key":"暗中作門徒","event":"他是耶穌的門徒，只因怕猶太人，就暗暗地作門徒","ref":"約 19:38"},{"key":"沒有附從","event":"他是議士，為人善良公義，眾人所謀所為他並沒有附從","ref":"路 23:50–51"},{"key":"求領身體","event":"耶穌死後，他放膽進去見彼拉多，求耶穌的身體","ref":"可 15:43"},{"key":"安放新墳","event":"用乾淨的細麻布裹好，安放在自己鑿在磐石裡的新墳墓，把大石頭滾到墓門口","ref":"太 27:57–60"}],"ending":"聖經沒有記載他後來的事。","takeaway":"原本暗中作門徒，在耶穌死後放膽安葬他"}},{"t":"nt","id":"samaritan-woman","era":"gospel","full":"撒馬利亞婦人","name":"撒馬利亞婦人","note":"","data":{"id":"samaritan-woman","name":"撒馬利亞婦人","aka":"","role":"在雅各井旁與耶穌談話的撒馬利亞婦人","era":"gospel","books":["john"],"life":[{"key":"井旁要水","event":"約在午正，她到敘加的雅各井打水，坐在井旁的耶穌向她要水喝","ref":"約 4:5–9"},{"key":"談活水","event":"耶穌說人喝了他所賜的水就永遠不渴，她說「先生，請把這水賜給我」","ref":"約 4:10–15"},{"key":"說出往事","event":"耶穌說她已經有五個丈夫，現在有的並不是她的丈夫","ref":"約 4:16–19"},{"key":"談敬拜","event":"她問該在這山上還是在耶路撒冷禮拜，耶穌說要用心靈和誠實拜","ref":"約 4:20–26"},{"key":"回城報信","event":"她留下水罐進城說「你們來看」，許多撒馬利亞人出來見耶穌，也信了","ref":"約 4:28–42"}],"ending":"聖經沒有記載她的名字和後來的事。","takeaway":"一場井邊的對話，讓整座城的人來見耶穌"}},{"t":"nt","id":"paul","era":"church","full":"保羅","name":"保羅","note":"","data":{"id":"paul","name":"保羅","aka":"掃羅","role":"外邦人的使徒，寫下多卷書信","era":"church","books":["acts","romans","1corinthians","2corinthians","galatians","ephesians","philippians","colossians","1thessalonians","2thessalonians","1timothy","2timothy","titus","philemon","2peter"],"life":[{"key":"大數出生","event":"生在基利家的大數，在耶路撒冷迦瑪列門下受教，按著嚴緊的律法作法利賽人。","ref":"徒 22:3"},{"key":"逼迫教會","event":"司提反被石頭打死時，見證人把衣裳放在掃羅腳前，他也喜悅司提反被害；之後他進各人的家拉著男女下監，又向大祭司要文書，要往大馬士革捉拿信徒。","ref":"徒 7:58～8:3；9:1–2"},{"key":"路上遇光","event":"快到大馬士革時，忽然從天上發光四面照著他，他仆倒在地，聽見「掃羅！掃羅！你為甚麼逼迫我？」，三天不能看見。","ref":"徒 9:3–9"},{"key":"重見受洗","event":"亞拿尼亞為他按手，眼睛上好像有鱗立刻掉下來，他就起來受洗，隨即在會堂宣講耶穌是神的兒子。","ref":"徒 9:17–20"},{"key":"縋下城牆","event":"他往阿拉伯去，又回到大馬士革；猶太人商議要殺他，門徒在夜間用筐子把他從城牆上縋下去。","ref":"加 1:17；徒 9:23–25"},{"key":"巴拿巴引薦","event":"在耶路撒冷門徒都怕他，巴拿巴領他去見使徒；後來巴拿巴到大數找他，帶到安提阿教導人一整年。","ref":"徒 9:26–27；11:25–26"},{"key":"第一次旅行","event":"安提阿教會差派他和巴拿巴出去，經塞浦路斯、彼西底的安提阿、以哥念，在路司得被石頭打；學界一般估計約在主後 46～48 年。","ref":"徒 13～14"},{"key":"耶路撒冷會議","event":"為外邦信徒要不要受割禮上耶路撒冷，使徒和長老決定不把這重擔放在外邦人身上。","ref":"徒 15:1–29"},{"key":"第二次旅行","event":"夜間看見馬其頓人求他「請你過到馬其頓來幫助我們」，渡海到腓立比，在那裡和西拉被打下監，半夜禱告唱詩，地大震動，獄卒全家受洗。","ref":"徒 16:9–34"},{"key":"雅典哥林多","event":"在雅典亞略巴古講論「未識之神」，到哥林多和亞居拉、百基拉同住織帳棚，住了一年六個月。","ref":"徒 17:16～18:11"},{"key":"以弗所三年","event":"第三次旅行在以弗所傳道約三年，許多人把邪術書燒了，後來銀匠底米丟煽動全城暴動。","ref":"徒 19:1～20:1；20:31"},{"key":"聖殿被捕","event":"回到耶路撒冷，有人說他帶希臘人進聖殿，群眾要打死他，千夫長把他救下，用鐵鍊捆鎖。","ref":"徒 21:27–36"},{"key":"上訴該撒","event":"被押到該撒利亞，在腓力斯手下被關兩年；非斯都接任後，他說「我要上告於該撒」。","ref":"徒 24:27～25:12"},{"key":"船難馬耳他","event":"押往羅馬途中遇上大風，船在馬耳他擱淺破壞，二百七十六人全都上了岸，他被毒蛇咬卻沒有受害。","ref":"徒 27:1～28:10"},{"key":"羅馬軟禁","event":"到羅馬後准他自己租房子住，有兵看守，足足住了兩年，放膽傳講神國的道；傳統上認為幾封獄中書信寫於這段時間。","ref":"徒 28:16–31"},{"key":"最後囑咐","event":"在捆鎖中寫信給提摩太（傳統上認為是第二次在羅馬被囚），說「那美好的仗我已經打過了」，又請他把馬可帶來。","ref":"提後 4:6–11"}],"ending":"使徒行傳結束時，保羅仍在羅馬被囚、住了足足兩年（徒 28:30–31），聖經沒有記載他的結局；提後 4:6 他說自己離世的時候到了。傳統上說他約在主後 60 年代、尼祿在位時於羅馬殉道。","takeaway":"從逼迫教會的人，變成把福音傳到外邦的使徒"}},{"t":"nt","id":"barnabas","era":"church","full":"巴拿巴","name":"巴拿巴","note":"","data":{"id":"barnabas","name":"巴拿巴","aka":"約瑟，使徒稱他為巴拿巴（就是「勸慰子」）","role":"塞浦路斯的利未人，保羅的同工","era":"church","books":["acts","1corinthians","galatians","colossians"],"life":[{"key":"賣田捐獻","event":"他把自己的田地賣了，把價銀拿來放在使徒腳前。","ref":"徒 4:36–37"},{"key":"接納掃羅","event":"門徒都怕剛歸信的掃羅，巴拿巴接待他，帶他去見使徒，述說他在路上的經歷。","ref":"徒 9:26–27"},{"key":"派往安提阿","event":"耶路撒冷教會差他到安提阿，他看見神所賜的恩就歡喜，勸勉眾人。","ref":"徒 11:22–24"},{"key":"大數找掃羅","event":"他往大數去找掃羅，帶到安提阿，兩人一同教導許多人整整一年。","ref":"徒 11:25–26"},{"key":"送捐救濟","event":"和掃羅把安提阿門徒的捐項送到猶太的長老那裡。","ref":"徒 11:29–30"},{"key":"第一次旅行","event":"聖靈吩咐教會差他和掃羅出去，帶著馬可從塞浦路斯開始；在路司得，眾人把他當成神明丟斯。","ref":"徒 13～14"},{"key":"會議作證","event":"和保羅上耶路撒冷，述說神藉他們在外邦人中所行的神蹟奇事。","ref":"徒 15:2–12"},{"key":"隨夥退席","event":"在安提阿，彼得因怕奉割禮的人退去不和外邦人吃飯，巴拿巴也隨著這樣做，保羅當面指出。","ref":"加 2:11–13"},{"key":"為馬可分手","event":"他要帶馬可同去，保羅不肯，兩人起了爭論，彼此分開，他帶著馬可坐船往塞浦路斯。","ref":"徒 15:36–39"}],"ending":"徒 15 之後使徒行傳沒有再記他的行蹤，保羅在書信裡還提到他（林前 9:6；西 4:10）。傳統上說他在塞浦路斯殉道，聖經沒有記載。","takeaway":"樂於接納與鼓勵人，帶出保羅與馬可兩位同工"}},{"t":"nt","id":"stephen","era":"church","full":"司提反","name":"司提反","note":"","data":{"id":"stephen","name":"司提反","aka":"","role":"七位執事之一，第一位殉道者","era":"church","books":["acts"],"life":[{"key":"選為執事","event":"教會為管理飯食選出七個人，他是「大有信心、聖靈充滿的人」。","ref":"徒 6:3–5"},{"key":"行大奇事","event":"他滿得恩惠能力，在民間行了大奇事和神蹟。","ref":"徒 6:8"},{"key":"被人誣告","event":"會堂的人辯不過他，就買通人說他說謗讟摩西和神的話，把他捉到公會。","ref":"徒 6:9–14"},{"key":"臉如天使","event":"在公會裡坐著的人定睛看他，見他的面貌好像天使的面貌。","ref":"徒 6:15"},{"key":"公會講道","event":"他從亞伯拉罕講到摩西、大衛和所羅門，指責聽眾常時抗拒聖靈。","ref":"徒 7:2–53"},{"key":"望天異象","event":"他定睛望天，看見神的榮耀，又看見耶穌站在神的右邊。","ref":"徒 7:55–56"},{"key":"為敵禱告","event":"眾人用石頭打他時，他呼求「求主耶穌接收我的靈魂」，又跪下說「主啊，不要將這罪歸於他們」。","ref":"徒 7:59–60"},{"key":"門徒分散","event":"他死後教會大遭逼迫，門徒分散到猶太和撒馬利亞各處，走到哪裡就傳道到哪裡。","ref":"徒 8:1–4"}],"ending":"被眾人推到城外用石頭打死（徒 7:58–60），虔誠的人把他埋葬，為他大大的哀哭（徒 8:2）。","takeaway":"第一位殉道者，臨死仍為打他的人禱告"}},{"t":"nt","id":"philip-evangelist","era":"church","full":"腓利（傳福音的）","name":"腓利","note":"傳福音的","data":{"id":"philip-evangelist","name":"腓利","aka":"傳福音的腓利（不是使徒腓力）","role":"七位執事之一，傳福音的人","era":"church","books":["acts"],"life":[{"key":"選為執事","event":"教會選出管理飯食的七個人，腓利是其中之一。","ref":"徒 6:5"},{"key":"撒馬利亞","event":"門徒分散後，他下到撒馬利亞城宣講基督，許多人受洗，行邪術的西門也信了。","ref":"徒 8:5–13"},{"key":"迦薩路上","event":"天使叫他往從耶路撒冷下迦薩的路上去，遇見衣索匹亞女王甘大基的太監坐在車上念以賽亞書。","ref":"徒 8:26–28"},{"key":"太監受洗","event":"他從那段經文講耶穌，太監說「看哪，這裡有水」，兩人下到水裡，腓利給他施洗。","ref":"徒 8:35–38"},{"key":"亞鎖都傳道","event":"主的靈把他提了去，後來有人在亞鎖都遇見他，他走遍各城傳道，直到該撒利亞。","ref":"徒 8:39–40"},{"key":"接待保羅","event":"多年後保羅一行人到該撒利亞，住在他家；他有四個女兒，都是說預言的。","ref":"徒 21:8–9"}],"ending":"聖經沒有記載。","takeaway":"把福音從耶路撒冷帶到撒馬利亞與外邦人"}},{"t":"nt","id":"cornelius","era":"church","full":"哥尼流","name":"哥尼流","note":"","data":{"id":"cornelius","name":"哥尼流","aka":"","role":"該撒利亞的羅馬百夫長","era":"church","books":["acts"],"life":[{"key":"敬畏神","event":"他是意大利營的百夫長，和全家都敬畏神，多多賙濟百姓，常常禱告神。","ref":"徒 10:1–2"},{"key":"天使顯現","event":"約在申初，他在異象中看見天使，吩咐他打發人往約帕去請彼得來。","ref":"徒 10:3–8"},{"key":"迎接彼得","event":"彼得帶著弟兄來到該撒利亞，他已招聚親屬密友等候，一見彼得就俯伏拜他，彼得拉他起來。","ref":"徒 10:24–26"},{"key":"聖靈降下","event":"彼得還在說話，聖靈就降在一切聽道的人身上，他們說方言，稱讚神為大。","ref":"徒 10:44–46"},{"key":"全家受洗","event":"彼得吩咐他們奉耶穌基督的名受洗。","ref":"徒 10:47–48"},{"key":"會議引證","event":"後來在耶路撒冷會議上，彼得用這件事說明神也揀選外邦人、賜他們聖靈。","ref":"徒 15:7–9"}],"ending":"聖經沒有記載。","takeaway":"他信主受洗，標誌福音向外邦人敞開"}},{"t":"nt","id":"james-brother","era":"church","full":"雅各（主的兄弟）","name":"雅各","note":"主的兄弟","data":{"id":"james-brother","name":"雅各","aka":"主的兄弟雅各（不是西庇太的兒子雅各）","role":"耶穌的弟弟，耶路撒冷教會領袖","era":"church","books":["matthew","mark","john","acts","1corinthians","galatians","james","jude"],"life":[{"key":"耶穌的弟弟","event":"拿撒勒人說，耶穌的弟兄是雅各、約西、西門、猶大。","ref":"太 13:55"},{"key":"起初不信","event":"耶穌傳道時，連他的弟兄們也不信他。","ref":"約 7:5"},{"key":"復活顯現","event":"耶穌復活後，顯給雅各看。","ref":"林前 15:7"},{"key":"樓上禱告","event":"耶穌升天後，耶穌的弟兄們和使徒同心合意的恆切禱告。","ref":"徒 1:14"},{"key":"保羅拜訪","event":"保羅歸信後過了三年上耶路撒冷，除了彼得，只見了主的兄弟雅各。","ref":"加 1:18–19"},{"key":"會議定案","event":"耶路撒冷會議上他作總結：不可難為歸服神的外邦人，只要他們禁戒偶像的污穢、姦淫、勒死的牲畜和血。","ref":"徒 15:13–21"},{"key":"教會柱石","event":"保羅說雅各、磯法、約翰是被稱為教會柱石的，他們向保羅和巴拿巴行相交之禮。","ref":"加 2:9"},{"key":"接見保羅","event":"保羅最後一次到耶路撒冷，去見雅各，眾長老也都在那裡。","ref":"徒 21:18"},{"key":"寫雅各書","event":"傳統上認為雅各書是他寫的，寫給「散住十二個支派之人」，強調信心要有行為。","ref":"雅 1:1"}],"ending":"聖經沒有記載他的死。傳統上說，依古代史家約瑟夫的記載，他約在主後 62 年於耶路撒冷被大祭司下令用石頭打死。","takeaway":"從不信哥哥的弟弟，成為耶路撒冷教會領袖"}},{"t":"nt","id":"mark","era":"church","full":"馬可","name":"馬可","note":"","data":{"id":"mark","name":"馬可","aka":"稱呼馬可的約翰","role":"巴拿巴的表弟，保羅與彼得的同工","era":"church","books":["mark","acts","colossians","philemon","2timothy","1peter"],"life":[{"key":"母親的家","event":"彼得出監後，來到「那稱呼馬可的約翰」母親馬利亞的家，那裡有好些人聚集禱告。","ref":"徒 12:12"},{"key":"同回安提阿","event":"巴拿巴和掃羅送完捐項，帶著他一同回安提阿。","ref":"徒 12:25"},{"key":"中途離開","event":"第一次旅行他作他們的幫手，到了旁非利亞的別加，就離開他們回耶路撒冷去了。","ref":"徒 13:5–13"},{"key":"引起分開","event":"第二次旅行保羅不肯再帶他，與巴拿巴爭論後分開，巴拿巴帶他坐船往塞浦路斯。","ref":"徒 15:37–39"},{"key":"獄中同工","event":"保羅在監中寫信問安時提到他，稱他是「巴拿巴的表弟馬可」，也列為同工。","ref":"西 4:10；門 1:24"},{"key":"於我有益","event":"保羅晚年說，你來的時候要把馬可帶來，因為他在傳道的事上於我有益處。","ref":"提後 4:11"},{"key":"我兒子馬可","event":"彼得在信末問安時，稱他為「我兒子馬可」。","ref":"彼前 5:13"},{"key":"寫馬可福音","event":"傳統上認為馬可福音是他寫的，內容來自彼得的講述。","ref":"可 1:1"}],"ending":"聖經沒有記載。傳統上說他後來到埃及的亞力山大傳道，在那裡殉道。","takeaway":"中途離隊的年輕人，後來成為保羅口中有益的同工"}},{"t":"nt","id":"luke","era":"church","full":"路加","name":"路加","note":"","data":{"id":"luke","name":"路加","aka":"","role":"醫生，保羅的同工","era":"church","books":["luke","acts","colossians","philemon","2timothy"],"life":[{"key":"我們出現","event":"從特羅亞起，使徒行傳的敘述改用「我們」，傳統上認為作者路加這時加入保羅一行，同到腓立比。","ref":"徒 16:10–17"},{"key":"再度同行","event":"第三次旅行回程，「我們」又從腓立比同行，經特羅亞、米利都，上到耶路撒冷。","ref":"徒 20:5～21:18"},{"key":"同往羅馬","event":"保羅被押往羅馬，「我們」一同上船，經歷大風與船難，最後進了羅馬。","ref":"徒 27:1～28:16"},{"key":"親愛的醫生","event":"保羅在監中寫信，稱他為「所親愛的醫生路加」。","ref":"西 4:14"},{"key":"列名同工","event":"保羅寫給腓利門的信裡，把他列為與自己同工的人。","ref":"門 1:24"},{"key":"獨有路加","event":"保羅最後的信說，同伴各自離去，「獨有路加在我這裡」。","ref":"提後 4:11"},{"key":"寫兩卷書","event":"傳統上認為他寫了路加福音和使徒行傳，兩卷都寫給提阿非羅，按著次序記下耶穌與使徒的事。","ref":"路 1:1–4；徒 1:1"}],"ending":"聖經沒有記載。","takeaway":"一路同行的醫生，留下耶穌與使徒的兩卷記錄"}},{"t":"nt","id":"silas","era":"church","full":"西拉","name":"西拉","note":"","data":{"id":"silas","name":"西拉","aka":"","role":"耶路撒冷教會領袖，保羅的旅伴","era":"church","books":["acts","2corinthians","1thessalonians","2thessalonians","1peter"],"life":[{"key":"帶信安提阿","event":"耶路撒冷會議後，他和稱為巴撒巴的猶大帶著會議的信到安提阿，也作先知勸慰弟兄。","ref":"徒 15:22–32"},{"key":"揀選同行","event":"保羅和巴拿巴分開後，揀選了西拉出去，走遍敘利亞、基利家。","ref":"徒 15:40–41"},{"key":"腓立比監獄","event":"他和保羅在腓立比被打下監，半夜禱告唱詩，忽然地大震動，監門全開。","ref":"徒 16:22–26"},{"key":"夜送庇哩亞","event":"在帖撒羅尼迦傳道引起騷動，弟兄們連夜打發他和保羅往庇哩亞去。","ref":"徒 17:1–10"},{"key":"哥林多會合","event":"他和提摩太從馬其頓下來，在哥林多與保羅會合，一同傳道。","ref":"徒 18:5；林後 1:19"},{"key":"聯名寫信","event":"帖撒羅尼迦前後書的開頭，都是保羅、西拉、提摩太三人聯名。","ref":"帖前 1:1；帖後 1:1"},{"key":"為彼得帶信","event":"彼得說他託忠心的兄弟西拉，把這封信轉交給收信的人。","ref":"彼前 5:12"}],"ending":"聖經沒有記載。","takeaway":"在監中唱詩的同伴，連結保羅與彼得兩邊的事工"}},{"t":"nt","id":"timothy","era":"church","full":"提摩太","name":"提摩太","note":"","data":{"id":"timothy","name":"提摩太","aka":"","role":"保羅的屬靈兒子與同工","era":"church","books":["acts","romans","1corinthians","2corinthians","philippians","colossians","1thessalonians","2thessalonians","1timothy","2timothy","philemon","hebrews"],"life":[{"key":"路司得門徒","event":"住在路司得，母親是信主的猶太婦人，父親是希臘人，弟兄們都稱讚他。","ref":"徒 16:1–2"},{"key":"家傳信心","event":"保羅說他的無偽之信，先在他外祖母羅以和他母親友尼基的心裡。","ref":"提後 1:5"},{"key":"受割禮同行","event":"保羅因那地方的猶太人，給他行了割禮，帶他一同出去。","ref":"徒 16:3"},{"key":"堅固帖城","event":"保羅打發他回帖撒羅尼迦堅固信徒，他帶回他們信心和愛心的好消息。","ref":"帖前 3:1–6"},{"key":"派往哥林多","event":"保羅打發他到哥林多，提醒他們記念保羅在基督裡怎樣行事。","ref":"林前 4:17"},{"key":"與我同心","event":"保羅說「我沒有別人與我同心」，盼望打發他去腓立比。","ref":"腓 2:19–22"},{"key":"留守以弗所","event":"保羅勸他留在以弗所，囑咐那幾個人不可傳異教。","ref":"提前 1:3"},{"key":"趕緊前來","event":"保羅在捆鎖中寫信，要他「趕緊地到我這裡來」。","ref":"提後 4:9"},{"key":"獲得釋放","event":"希伯來書提到「我們的兄弟提摩太已經釋放了」。","ref":"來 13:23"}],"ending":"聖經沒有記載。傳統上說他後來在以弗所牧養教會，並在那裡殉道。","takeaway":"年輕時被保羅帶出來，接下牧養教會的託付"}},{"t":"nt","id":"titus","era":"church","full":"提多","name":"提多","note":"","data":{"id":"titus","name":"提多","aka":"","role":"希臘人出身的保羅同工","era":"church","books":["2corinthians","galatians","2timothy","titus"],"life":[{"key":"未受割禮","event":"保羅帶他上耶路撒冷，他雖是希臘人，並沒有被勉強受割禮。","ref":"加 2:1–3"},{"key":"派往哥林多","event":"保羅到特羅亞沒有遇見他，心裡不安，便辭別那裡的人往馬其頓去。","ref":"林後 2:12–13"},{"key":"帶回好消息","event":"他在馬其頓見到保羅，把哥林多人的想念、哀慟和熱心告訴保羅，保羅因此得了安慰。","ref":"林後 7:5–7"},{"key":"辦成捐款","event":"保羅勸他再往哥林多，把捐錢的事辦成。","ref":"林後 8:6–17"},{"key":"留克里特","event":"保羅留他在克里特，把未辦完的事辦好，在各城設立長老。","ref":"多 1:5"},{"key":"往撻馬太","event":"保羅晚年在信中提到，提多往撻馬太去了。","ref":"提後 4:10"}],"ending":"聖經沒有記載。傳統上說他後來留在克里特牧養教會。","takeaway":"未受割禮的希臘人，成為保羅信任的使者"}},{"t":"nt","id":"lydia","era":"church","full":"呂底亞","name":"呂底亞","note":"","data":{"id":"lydia","name":"呂底亞","aka":"","role":"推雅推喇城賣紫色布的婦人","era":"church","books":["acts"],"life":[{"key":"河邊禱告","event":"安息日在腓立比城外河邊禱告的地方，她聽保羅講道；她素來敬拜神。","ref":"徒 16:13–14"},{"key":"主開導心","event":"主開導她的心，叫她留心聽保羅所講的話。","ref":"徒 16:14"},{"key":"全家受洗","event":"她和她一家都受了洗。","ref":"徒 16:15"},{"key":"強留住家","event":"她請保羅一行人到她家裡住，強留他們住下。","ref":"徒 16:15"},{"key":"出監再聚","event":"保羅和西拉出監後，到她家裡見了弟兄們，勸慰他們，然後才離開。","ref":"徒 16:40"}],"ending":"聖經沒有記載。","takeaway":"在腓立比信主，家成為信徒聚集的地方"}},{"t":"nt","id":"priscilla-aquila","era":"church","full":"百基拉與亞居拉","name":"百基拉與亞居拉","note":"","data":{"id":"priscilla-aquila","name":"百基拉與亞居拉","aka":"","role":"織帳棚的夫妻，保羅的同工","era":"church","books":["acts","romans","1corinthians","2timothy"],"life":[{"key":"離開羅馬","event":"因革老丟命令猶太人都離開羅馬，亞居拉和妻子百基拉來到哥林多。","ref":"徒 18:2"},{"key":"同織帳棚","event":"保羅與他們同業，就和他們同住做工，他們都是製造帳棚的。","ref":"徒 18:3"},{"key":"同往以弗所","event":"保羅離開哥林多時他們同行，到了以弗所就留在那裡。","ref":"徒 18:18–19"},{"key":"教導亞波羅","event":"他們聽見亞波羅在會堂講道，就接他來，將神的道給他講解更加詳細。","ref":"徒 18:26"},{"key":"家中教會","event":"在以弗所時，他們家裡有教會，一同問哥林多人安。","ref":"林前 16:19"},{"key":"為保羅冒險","event":"保羅說他們為他的命將自己的頸項置之度外，外邦眾教會也感謝他們；那時他們家裡也有教會。","ref":"羅 16:3–5"},{"key":"最後問安","event":"保羅最後的信仍託提摩太問候他們。","ref":"提後 4:19"}],"ending":"聖經沒有記載。","takeaway":"一對夫妻用家和手藝支援保羅的事工"}},{"t":"nt","id":"apollos","era":"church","full":"亞波羅","name":"亞波羅","note":"","data":{"id":"apollos","name":"亞波羅","aka":"","role":"亞力山大出生、熟悉聖經的教師","era":"church","books":["acts","1corinthians","titus"],"life":[{"key":"以弗所講道","event":"他生在亞力山大，是有學問的人，最能講解聖經，在以弗所會堂放膽講論耶穌的事。","ref":"徒 18:24–26"},{"key":"約翰的洗禮","event":"他已經在主的道上受了教訓，只是單曉得約翰的洗禮。","ref":"徒 18:25"},{"key":"受夫妻教導","event":"百基拉、亞居拉聽見了，就接他來，將神的道給他講解更加詳細。","ref":"徒 18:26"},{"key":"往亞該亞","event":"弟兄們寫信請那裡的門徒接待他，他到了亞該亞，用聖經證明耶穌是基督，大大幫助信徒。","ref":"徒 18:27–28"},{"key":"哥林多分派","event":"哥林多教會有人說「我是屬保羅的」，也有人說「我是屬亞波羅的」。","ref":"林前 1:12"},{"key":"澆灌的人","event":"保羅說「我栽種了，亞波羅澆灌了，惟有神叫他生長」。","ref":"林前 3:6"},{"key":"暫不前往","event":"保羅再三勸他去哥林多，他這時決不願意去，說有了機會必去。","ref":"林前 16:12"},{"key":"提多送行","event":"保羅請提多趕緊給律師西納和亞波羅送行，叫他們沒有缺乏。","ref":"多 3:13"}],"ending":"聖經沒有記載。","takeaway":"口才出眾的教師，在哥林多接續保羅的工作"}},{"t":"nt","id":"philemon-onesimus","era":"church","full":"腓利門與阿尼西母","name":"腓利門與阿尼西母","note":"","data":{"id":"philemon-onesimus","name":"腓利門與阿尼西母","aka":"","role":"歌羅西的信徒與他的奴僕","era":"church","books":["philemon","colossians"],"life":[{"key":"家中教會","event":"腓利門家裡有教會，保羅稱他為「親愛的同工」。","ref":"門 1:1–2"},{"key":"愛心見證","event":"保羅聽說腓利門愛眾聖徒，使聖徒的心得了暢快。","ref":"門 1:5–7"},{"key":"奴僕離開","event":"阿尼西母從前對主人腓利門沒有益處，離開了他一陣子（一般認為是逃走）。","ref":"門 1:11–15"},{"key":"獄中歸信","event":"阿尼西母遇見被囚的保羅並信了主，保羅稱他是「我在捆鎖中所生的兒子」。","ref":"門 1:10"},{"key":"帶信回去","event":"保羅打發他回去，請腓利門收納他如同收納保羅，不再是奴僕，是親愛的兄弟。","ref":"門 1:12–17"},{"key":"代為償還","event":"保羅說他若虧負你，都歸在我的賬上，我必償還。","ref":"門 1:18–19"},{"key":"同往歌羅西","event":"阿尼西母和推基古一同帶信到歌羅西，保羅稱他是「親愛忠心的兄弟」。","ref":"西 4:7–9"}],"ending":"聖經沒有記載腓利門怎麼回應，也沒有記載兩人後來的事。","takeaway":"一封短信，請主人把回來的奴僕當弟兄接納"}},{"t":"nt","id":"herod-agrippa","era":"church","full":"希律亞基帕（一世與二世）","name":"希律亞基帕","note":"一世與二世","data":{"id":"herod-agrippa","name":"希律亞基帕","aka":"一世即徒 12 的希律王；二世即亞基帕王","role":"希律家兩代王：一世與二世","era":"church","books":["acts"],"life":[{"key":"一世殺雅各","event":"希律王（亞基帕一世）苦害教會，用刀殺了約翰的哥哥雅各。","ref":"徒 12:1–2"},{"key":"一世囚彼得","event":"他見猶太人喜歡，又捉拿彼得下監；夜裡天使把彼得領出監來。","ref":"徒 12:3–11"},{"key":"一世朝服演說","event":"他在該撒利亞穿上朝服對百姓講論，百姓喊著說「這是神的聲音，不是人的聲音」。","ref":"徒 12:21–22"},{"key":"一世被蟲咬","event":"因他不歸榮耀給神，主的使者立刻罰他，他被蟲所咬，氣就絕了。","ref":"徒 12:23"},{"key":"二世來訪","event":"多年後，亞基帕王（二世）和百尼基來到該撒利亞，問巡撫非斯都安。","ref":"徒 25:13"},{"key":"二世聽申訴","event":"非斯都把保羅的案子告訴他，他說也想親自聽，第二天便大張威勢來到公廳。","ref":"徒 25:22–23"},{"key":"二世幾乎信","event":"保羅向他申訴並講耶穌復活，他對保羅說「你想少微一勸，便叫我作基督徒啊」","ref":"徒 26:1–29"},{"key":"二世判可放","event":"他對非斯都說，這人若沒有上告於該撒，就可以釋放了。","ref":"徒 26:30–32"}],"ending":"一世被蟲咬死（徒 12:23），古代史家約瑟夫記載約在主後 44 年；二世之後的事聖經沒有記載。","takeaway":"同一家族兩代王，一個逼迫使徒，一個聽保羅申訴"}},{"t":"nt","id":"felix-festus","era":"church","full":"腓力斯與非斯都","name":"腓力斯與非斯都","note":"","data":{"id":"felix-festus","name":"腓力斯與非斯都","aka":"","role":"先後任巡撫，審理保羅的案子","era":"church","books":["acts"],"life":[{"key":"連夜送審","event":"千夫長怕保羅被暗殺，派兵連夜把他送到該撒利亞，交給巡撫腓力斯。","ref":"徒 23:23–33"},{"key":"腓力斯聽審","event":"大祭司帶著辯士帖土羅來控告保羅，保羅分訴後，腓力斯把案子擱下。","ref":"徒 24:1–22"},{"key":"聽道恐懼","event":"腓力斯和妻子土西拉聽保羅講論公義、節制和將來的審判，甚覺恐懼。","ref":"徒 24:24–25"},{"key":"指望銀錢","event":"腓力斯又指望保羅送他銀錢，所以屢次叫他來和他談論。","ref":"徒 24:26"},{"key":"留監兩年","event":"過了兩年，非斯都接任，腓力斯要討猶太人的喜歡，就留保羅在監裡。","ref":"徒 24:27"},{"key":"非斯都開庭","event":"非斯都上耶路撒冷，祭司長求他把保羅提到耶路撒冷，要在路上埋伏殺害；他要他們下該撒利亞去告，回到該撒利亞就開庭審問。","ref":"徒 25:1–8"},{"key":"准上告該撒","event":"非斯都問保羅肯不肯上耶路撒冷受審，保羅說我要上告於該撒，非斯都就准了。","ref":"徒 25:9–12"},{"key":"學問太大","event":"保羅申訴到耶穌復活，非斯都大聲說「保羅，你癲狂了吧。你的學問太大，反叫你癲狂了！」","ref":"徒 26:24"}],"ending":"聖經沒有記載兩人後來的事。","takeaway":"兩任巡撫審保羅，案子一路拖到上告該撒"}},{"t":"nt","id":"jude","era":"church","full":"猶大（主的兄弟）","name":"猶大","note":"主的兄弟","data":{"id":"jude","name":"猶大","aka":"雅各的弟兄猶大（不是加略人猶大）","role":"耶穌的弟弟，傳統上認為寫了猶大書","era":"church","books":["matthew","mark","john","acts","1corinthians","jude"],"life":[{"key":"耶穌的弟弟","event":"拿撒勒人說，耶穌的弟兄是雅各、約西、西門、猶大。","ref":"太 13:55"},{"key":"起初不信","event":"耶穌傳道時，他的弟兄們起初也不信他。","ref":"約 7:5"},{"key":"樓上禱告","event":"耶穌升天後，耶穌的弟兄們和使徒同心合意的恆切禱告。","ref":"徒 1:14"},{"key":"帶妻傳道","event":"保羅提到主的弟兄們帶著信主的妻子往來傳道。","ref":"林前 9:5"},{"key":"寫猶大書","event":"他自稱「耶穌基督的僕人，雅各的弟兄猶大」，寫信勸信徒為真道竭力爭辯。","ref":"猶 1:1–3"}],"ending":"聖經沒有記載。","takeaway":"從不信到自稱耶穌的僕人，留下猶大書"}},{"t":"nt","id":"ananias-damascus","era":"church","full":"大馬士革的亞拿尼亞","name":"大馬士革的亞拿尼亞","note":"","data":{"id":"ananias-damascus","name":"亞拿尼亞","aka":"大馬士革的亞拿尼亞（不是徒 5 章或大祭司亞拿尼亞）","role":"大馬士革的門徒，為掃羅按手","era":"church","bo ":"記約瑟是「一個財主」，安放在「自己的新墳墓裡」。","ref":"太 27:57、60"},{"book":"mark","text":"記他是「尊貴的議士」，彼拉多「詫異耶穌已經死了」。","ref":"可 15:43–44"},{"book":"luke","text":"記「眾人所謀所為，他並沒有附從」。","ref":"路 23:51"},{"book":"john","text":"記約瑟因怕猶太人，「就暗暗地作門徒」。","ref":"約 19:38"},{"book":"john","text":"記尼哥底母帶著「沒藥和沉香約有一百斤」前來。","ref":"約 19:39"}]},{"id":"empty-tomb","title":"七日的頭一日到墳墓","passages":[{"book":"matthew","ref":"太 28:1–10","story":"十架復活"},{"book":"mark","ref":"可 16:1–8","story":"空墳結尾"},{"book":"luke","ref":"路 24:1–12","story":null},{"book":"john","ref":"約 20:1–10","story":"園中相遇"}],"common":"四卷都記七日的頭一日清早，抹大拉的馬利亞到墳墓那裡，耶穌不在裡面。","diffs":[{"book":"matthew","text":"記同去的是「那個馬利亞」，主的使者滾開石頭「坐在上面」。","ref":"太 28:1–2"},{"book":"mark","text":"記撒羅米也同去，看見「一個少年人坐在右邊，穿著白袍」。","ref":"可 16:1、5"},{"book":"mark","text":"記她們「甚麼也不告訴人，因為她們害怕」。","ref":"可 16:8"},{"book":"luke","text":"記「有兩個人站在旁邊，衣服放光」。","ref":"路 24:4"},{"book":"luke","text":"記同去的有「約亞拿」；也記彼得跑到墳墓前看。","ref":"路 24:10、12"},{"book":"john","text":"記「天還黑的時候」就去，再跑去告訴西門彼得。","ref":"約 20:1–2"}]},{"id":"appear-women","title":"復活的耶穌遇見婦女","passages":[{"book":"matthew","ref":"太 28:8–10","story":"十架復活"},{"book":"mark","ref":"可 16:9–11","story":null},{"book":"john","ref":"約 20:11–18","story":"園中相遇"}],"common":"三卷都記復活的耶穌向抹大拉的馬利亞顯現。","diffs":[{"book":"matthew","text":"記遇見的是兩個婦女，她們「上前抱住他的腳拜他」。","ref":"太 28:1、9"},{"book":"mark","text":"記「耶穌從她身上曾趕出七個鬼」，門徒聽了「卻是不信」。","ref":"可 16:9、11"},{"book":"john","text":"記她起初「以為是看園的」，耶穌說「不要摸我」。","ref":"約 20:15、17"}]},{"id":"two-on-road","title":"向路上兩個門徒顯現","passages":[{"book":"mark","ref":"可 16:12–13","story":null},{"book":"luke","ref":"路 24:13–35","story":"以馬忤斯"}],"common":"兩卷都記耶穌向走在路上的兩個門徒顯現，他們回去告訴其餘的門徒。","diffs":[{"book":"mark","text":"只用兩節記，說耶穌「變了形像」，其餘的門徒「也是不信」。","ref":"可 16:12–13"},{"book":"luke","text":"記村子「名叫以馬忤斯」，其中一個「名叫革流巴」。","ref":"路 24:13、18"},{"book":"luke","text":"記他們回去時聽見「主果然復活，已經現給西門看了」。","ref":"路 24:33–34"}]},{"id":"appear-disciples","title":"向聚集的門徒顯現","passages":[{"book":"mark","ref":"可 16:14","story":null},{"book":"luke","ref":"路 24:36–49","story":null},{"book":"john","ref":"約 20:19–23","story":null}],"common":"三卷都記門徒聚在一處的時候，耶穌向他們顯現。","diffs":[{"book":"mark","text":"記是「十一個門徒坐席的時候」，耶穌責備他們不信。","ref":"可 16:14"},{"book":"luke","text":"記耶穌說「你們看我的手，我的腳」，又吃了「一片燒魚」。","ref":"路 24:39、42–43"},{"book":"john","text":"記「門都關了」，耶穌把手和肋旁指給他們看。","ref":"約 20:19–20"},{"book":"john","text":"記耶穌「向他們吹一口氣」，說「你們受聖靈」。","ref":"約 20:22"}]},{"id":"commission","title":"復活後差遣門徒","passages":[{"book":"matthew","ref":"太 28:16–20","story":"十架復活"},{"book":"mark","ref":"可 16:15–18","story":null},{"book":"luke","ref":"路 24:46–49","story":null},{"book":"john","ref":"約 20:21–23","story":null}],"common":"四卷都記復活的耶穌對門徒說話，把使命交給他們。","diffs":[{"book":"matthew","text":"記在加利利「耶穌約定的山上」，說「使萬民作我的門徒」。","ref":"太 28:16、19"},{"book":"matthew","text":"記「我就常與你們同在，直到世界的末了」。","ref":"太 28:20"},{"book":"mark","text":"記「你們往普天下去，傳福音給萬民聽」。","ref":"可 16:15"},{"book":"luke","text":"記從耶路撒冷起傳到萬邦，吩咐「你們要在城裡等候」。","ref":"路 24:47、49"},{"book":"john","text":"記「父怎樣差遣了我，我也照樣差遣你們」。","ref":"約 20:21"}]},{"id":"ascension","title":"耶穌被接升天","passages":[{"book":"mark","ref":"可 16:19–20","story":null},{"book":"luke","ref":"路 24:50–53","story":"伯大尼升天"}],"common":"兩卷都記耶穌和門徒說完話以後，被帶到天上去。","diffs":[{"book":"mark","text":"記他「坐在神的右邊」，門徒出去「到處宣傳福音」。","ref":"可 16:19–20"},{"book":"luke","text":"記地點在「伯大尼的對面」，是在舉手祝福的時候。","ref":"路 24:50–51"},{"book":"luke","text":"記門徒回耶路撒冷，「常在殿裡稱頌神」。","ref":"路 24:52–53"}]}]},{"id":"ot-history","name":"撒母耳記・列王紀與歷代志","events":[{"id":"saul-death","title":"掃羅之死","passages":[{"book":"1samuel","ref":"撒上 31:1–13","story":"基利波山"},{"book":"2samuel","ref":"撒下 1:1–16","story":"弓歌"},{"book":"1chronicles","ref":"代上 10:1–14","story":"基利波山"}],"common":"以色列人在基利波山敗給非利士人，掃羅和約拿單都死了。","diffs":[{"book":"1samuel","text":"記掃羅自己伏在刀上死了，拿兵器的人也伏刀而死。","ref":"撒上 31:4–5"},{"book":"1samuel","text":"記屍身釘在伯珊城牆上，基列雅比人取下用火燒了。","ref":"撒上 31:10–12"},{"book":"2samuel","text":"亞瑪力少年人說掃羅求他殺死自己，他就殺了掃羅。","ref":"撒下 1:8–10"},{"book":"1chronicles","text":"記非利士人將掃羅的首級釘在大袞廟中。","ref":"代上 10:10"},{"bo f":"代上 13:9"}]},{"id":"ark-to-city-of-david","title":"約櫃抬進大衛城","passages":[{"book":"2samuel","ref":"撒下 6:12–23","story":"約櫃進城"},{"book":"1chronicles","ref":"代上 15:1～16:43","story":"烏撒與約櫃"}],"common":"約櫃從俄別以東家抬進大衛城，米甲從窗戶看見大衛跳舞，心裡輕視他。","diffs":[{"book":"2samuel","text":"記抬約櫃的人走了六步，大衛就獻牛與肥羊為祭。","ref":"撒下 6:13"},{"book":"2samuel","text":"記米甲出來譏誚大衛，她直到死日沒有生養兒女。","ref":"撒下 6:20–23"},{"book":"1chronicles","text":"記大衛說「除了利未人之外，無人可抬神的約櫃」。","ref":"代上 15:2"},{"book":"1chronicles","text":"記派亞薩和他的弟兄在約櫃前稱謝歌頌。","ref":"代上 16:4–7"}]},{"id":"davidic-covenant","title":"神與大衛立約","passages":[{"book":"2samuel","ref":"撒下 7:1–29","story":"大衛之約"},{"book":"1chronicles","ref":"代上 17:1–27","story":"大衛之約"}],"common":"大衛想為約櫃建殿，神藉拿單應許他的後裔建殿，國位堅定直到永遠。","diffs":[{"book":"2samuel","text":"說「他若犯了罪，我必用人的杖責打他」。","ref":"撒下 7:14"},{"book":"2samuel","text":"說大衛的家和大衛的國必永遠堅立。","ref":"撒下 7:16"},{"book":"1chronicles","text":"沒有記犯罪要受責打的話。","ref":"代上 17:13"},{"book":"1chronicles","text":"說「我卻要將他永遠堅立在我家裡和我國裡」。","ref":"代上 17:14"}]},{"id":"david-victories","title":"大衛四圍得勝","passages":[{"book":"2samuel","ref":"撒下 8:1–18","story":null},{"book":"1chronicles","ref":"代上 18:1–17","story":null}],"common":"大衛治服非利士人和摩押，又打敗了瑣巴王。","diffs":[{"book":"2samuel","text":"記擒拿瑣巴王的「馬兵一千七百，步兵二萬」。","ref":"撒下 8:4"},{"book":"2samuel","text":"記大衛在鹽谷擊殺一萬八千人回來，就得了大名。","ref":"撒下 8:13"},{"book":"2samuel","text":"記瑣巴王是「哈大底謝」，往「大河」去要奪回國權。","ref":"撒下 8:3"},{"book":"1chronicles","text":"記奪了「戰車一千，馬兵七千，步兵二萬」。","ref":"代上 18:4"},{"book":"1chronicles","text":"記在鹽谷擊殺以東一萬八千人的是亞比篩。","ref":"代上 18:12"},{"book":"1chronicles","text":"記瑣巴王是「哈大利謝」，往「幼發拉底河」去。","ref":"代上 18:3"}]},{"id":"ammon-aram-war","title":"亞捫與亞蘭之戰","passages":[{"book":"2samuel","ref":"撒下 10:1–19","story":null},{"book":"1chronicles","ref":"代上 19:1–19","story":null}],"common":"哈嫩羞辱大衛的臣僕，亞捫人又招來亞蘭人，結果被約押和大衛打敗。","diffs":[{"book":"2samuel","text":"記亞捫人招募步兵二萬，又有瑪迦王的人與陀伯人。","ref":"撒下 10:6"},{"book":"2samuel","text":"記大衛殺了亞蘭「七百輛戰車的人，四萬馬兵」。","ref":"撒下 10:18"},{"book":"1chronicles","text":"記用一千他連得銀子雇了三萬二千輛戰車。","ref":"代上 19:6–7"},{"book":"1chronicles","text":"記大衛殺了亞蘭「七千輛戰車的人，四萬步兵」。","ref":"代上 19:18"}]},{"id":"rabbah-captured","title":"攻取拉巴","passages":[{"book":"2samuel","ref":"撒下 11:1；12:26–31","story":"拔示巴"},{"book":"1chronicles","ref":"代上 20:1–3","story":null}],"common":"約押圍攻亞捫的拉巴，大衛奪了亞捫王所戴的金冠冕。","diffs":[{"book":"2samuel","text":"在圍城期間記了大衛與拔示巴、烏利亞的事。","ref":"撒下 11:2–27"},{"book":"2samuel","text":"記約押請大衛親自來取城，免得用約押的名叫這城。","ref":"撒下 12:27–29"},{"book":"1chronicles","text":"沒有記拔示巴的事，只說「大衛仍住在耶路撒冷」。","ref":"代上 20:1"}]},{"id":"philistine-giants","title":"擊殺迦特偉人","passages":[{"book":"2samuel","ref":"撒下 21:15–22","story":null},{"book":"1chronicles","ref":"代上 20:4–8","story":null}],"common":"大衛的僕人擊殺迦特偉人的兒子，其中一人手腳都是六指。","diffs":[{"book":"2samuel","text":"記在歌伯，雅雷俄珥金的兒子伊勒哈難「殺了迦特人歌利亞」。","ref":"撒下 21:19"},{"book":"2samuel","text":"多記大衛疲乏險些被殺，結尾說「這四個人」。","ref":"撒下 21:15–17、22"},{"book":"1chronicles","text":"記睚珥的兒子伊勒哈難殺了「歌利亞的兄弟拉哈米」。","ref":"代上 20:5"},{"book":"1chronicles","text":"地點寫基色，結尾說「這三個人」。","ref":"代上 20:4、8"}]},{"id":"census","title":"數點百姓","passages":[{"book":"2samuel","ref":"撒下 24:1–25","story":"數點百姓"},{"book":"1chronicles","ref":"代上 21:1～22:1","story":"阿珥楠禾場"}],"common":"大衛數點百姓後認罪，瘟疫使以色列人死了七萬，他買禾場築壇獻祭。","diffs":[{"book":"2samuel","text":"說「耶和華又向以色列人發怒，就激動大衛」。","ref":"撒下 24:1"},{"book":"2samuel","text":"以色列八十萬、猶大五十萬；用五十舍客勒銀子買禾場與牛。","ref":"撒下 24:9、24"},{"book":"2samuel","text":"迦得讓大衛選的災，其中一樣是「七年的饑荒」。","ref":"撒下 24:13"},{"book":"1chronicles","text":"說「撒但起來攻擊以色列人，激動大衛」。","ref":"代上 21:1"},{"book":"1chronicles","text":"以色列一百一十萬、猶大四十七萬；用六百舍客勒金子買地。","ref":"代上 21:5、25"},{"book":"1chronicles","text":"迦得讓大衛選的災，其中一樣是「三年的饑荒」。","ref":"代上 21:12"}]},{"id":"solomon-succeeds","title":"所羅門接續作王","passages":[{"book":"1kings","ref":"王上 1:1～2:12","story":"膏立所羅門"},{"book":"1chronicles","ref":"代上 29:22–30","story":"樂意奉獻"}],"common":"所羅門被膏立接續大衛作王，大衛作王共四十年就死了。","diffs":[{"book":"1kings","text":"記亞多尼雅自立為王，拿單和拔示巴進去提醒大衛。","ref":"王上 1:5、11–13"},{"book":"1kings","text":"記祭司撒督在基訓用盛膏油的角膏所羅門。","ref":"王上 1:38–39"},{"book":"1chronicles","text":"說「再膏大衛的兒子所羅門作王，又膏撒督作祭司」。","ref":"代上 29:22"},{"book":"1chronicles","text":"沒有記亞多尼雅的事，說大衛王的眾子都順服所羅門。","ref":"代上 29:24"}]},{"id":"solomon-wisdom","title":"所羅門求智慧","passages":[{"book":"1kings","ref":"王上 3:1–15","story":"基遍求智慧"},{"book":"2chronicles","ref":"代下 1:1–13","story":null}],"common":"所羅門在基遍獻一千犧牲，神向他顯現，他求智慧，神連他沒求的也賜給他。","diffs":[{"book":"1kings","text":"記這是「夜間夢中」，所羅門醒了，「不料是個夢」。","ref":"王上 3:5、15"},{"book":"1kings","text":"記神說他若效法大衛遵行神的道，必使他長壽。","ref":"王上 3:14"},{"book":"2chronicles","text":"記基遍有摩西在曠野所造的會幕和比撒列造的銅壇。","ref":"代下 1:3–5"},{"book":"2chronicles","text":"記所羅門求「智慧聰明」，沒有提到夢。","ref":"代下 1:7–10"}]},{"id":"temple-preparation","title":"與希蘭備料","passages":[{"book":"1kings","ref":"王上 5:1–18","story":"建造聖殿"},{"book":"2chronicles","ref":"代下 2:1–18","story":"火從天降"}],"common":"所羅門向希蘭要黎巴嫩的香柏木建殿，並徵派工人。","diffs":[{"book":"1kings","text":"每年給希蘭麥子二萬歌珥、清油二十歌珥；督工三千三百。","ref":"王上 5:11、16"},{"book":"2chronicles","text":"給伐木的人小麥大麥各二萬歌珥、酒油各二萬罷特。","ref":"代下 2:10"},{"book":"2chronicles","text":"記督理工作的有三千六百人。","ref":"代下 2:18"}]},{"id":"temple-building","title":"建造聖殿","passages":[{"book":"1kings","ref":"王上 6:1～7:51","story":"建造聖殿"},{"book":"2chronicles","ref":"代下 3:1～5:1","story":"火從天降"}],"common":"所羅門作王第四年二月開工建殿，殿前立了兩根柱子，又鑄了銅海。","diffs":[{"book":"1kings","text":"記這是以色列人出埃及地後四百八十年。","ref":"王上 6:1"},{"book":"1kings","text":"記柱子每根高十八肘；銅海可容二千罷特。","ref":"王上 7:15、26"},{"book":"2chronicles","text":"記殿建在摩利亞山上，就是阿珥楠的禾場。","ref":"代下 3:1"},{"book":"2chronicles","text":"記柱子高三十五肘；銅海可容三千罷特。","ref":"代下 3:15；4:5"}]},{"id":"temple-dedication","title":"獻殿","passages":[{"book":"1kings","ref":"王上 8:1–66","story":"獻殿禱告"},{"book":"2chronicles","ref":"代下 5:2～7:10","story":"火從天降"}],"common":"約櫃抬進殿，雲充滿殿，所羅門禱告，用牛二萬二千、羊十二萬獻祭。","diffs":[{"book":"1kings","text":"記禱告完畢，所羅門站著大聲為全會眾祝福。","ref":"王上 8:54–55"},{"book":"1kings","text":"記守節「七日又七日，共十四日」，第八日遣散眾民。","ref":"王上 8:65–66"},{"book":"2chronicles","text":"記禱告完畢「就有火從天上降下來，燒盡燔祭和別的祭」。","ref":"代下 7:1"},{"book":"2chronicles","
