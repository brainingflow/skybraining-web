各按其時成為美好。","ref":"傳 3:1–11"},{"key":"享受所得","point":"吃喝、享受勞碌所得是神的恩賜","explain":"傳道者多次說，人在勞碌中享福、吃喝，看為神的恩賜。","ref":"傳 2:24；3:12–13；5:18–19"},{"key":"同伴","point":"兩個人比一個人好","explain":"一個人跌倒，另一個可以扶他；三股合成的繩子不容易折斷。","ref":"傳 4:9–12"},{"key":"記念造主","point":"趁著年輕記念造你的主","explain":"第 12 章用比喻描寫人的衰老，勸人在衰敗的日子來到之前記念造他的主。","ref":"傳 12:1–7"},{"key":"總意","point":"敬畏神，謹守他的誡命","explain":"全書的結語：這是人所當盡的本分，因為人所做的事神都必審問。","ref":"傳 12:13–14"}],"outline":[{"key":"序言虛空","range":"1:1–11","point":"虛空的虛空；日光之下並無新事"},{"key":"追求與失落","range":"1:12～2 章","point":"傳道者追求智慧、享樂、事業，都是捕風"},{"key":"定時","range":"3 章","point":"凡事都有定時；神造萬物各按其時成為美好"},{"key":"世間觀察","range":"4～6 章","point":"欺壓、嫉妒、孤單、錢財、許願，都看見虛空"},{"key":"智慧限度","range":"7～10 章","point":"比較智慧與愚昧，人猜不透神的作為"},{"key":"勸勉結語","range":"11～12 章","point":"撒種要殷勤、趁年輕記念造主，總意是敬畏神"}],"stories":[{"key":"虛空的虛空","title":"日光之下並無新事","ref":"傳 1:1–11","summary":"傳道者一開口就說「虛空的虛空，凡事都是虛空」。日頭出來又落下，風轉來轉去，江河都往海裡流，海卻不滿；已有的事後必再有，日光之下並無新事。","people":["solomon"]},{"key":"大事業","title":"傳道者的大事業","ref":"傳 2:1–11","summary":"傳道者試著用喜樂與酒來尋求快樂，又建造房屋、栽種葡萄園、挖水池、買僕婢、積蓄金銀，比在他以前耶路撒冷眾人都更昌盛。他察看手所經營的一切，發現都是虛空、都是捕風。","people":["solomon"]},{"key":"定時之歌","title":"凡事都有定期","ref":"傳 3:1–8","summary":"這段列出十四組相對的事：生有時、死有時，栽種有時、拔出有時，哭有時、笑有時，靜默有時、言語有時，愛有時、恨有時，爭戰有時、和好有時。","people":[]},{"key":"三股繩","title":"三股合成的繩子","ref":"傳 4:9–12","summary":"兩個人總比一個人好：一個跌倒，另一個能扶他；兩人同睡就暖和；有人攻勝孤身一人，若有二人便能敵擋他，三股合成的繩子不容易折斷。","people":[]},{"key":"衰老之歌","title":"趁著年幼記念造主","ref":"傳 12:1–8","summary":"傳道者勸人在年輕時記念造他的主，接著用一連串比喻描寫衰老：日頭與月亮變為黑暗、看守房屋的發顫、推磨的稀少，最後塵土仍歸於地，靈仍歸於賜靈的神。","people":[]}],"people":["solomon"],"verses":[{"ref":"傳 1:2","text":"傳道者說：虛空的虛空，虛空的虛空，凡事都是虛空。"},{"ref":"傳 3:1","text":"凡事都有定期，天下萬務都有定時。"},{"ref":"傳 12:13","text":"這些事都已聽見了，總意就是：敬畏神，謹守他的誡命，這是人所當盡的本分。"}]}},{"t":"ot","id":"song-of-songs","order":22,"name":"雅歌","abbr":"歌","chapters":8,"group":"詩歌智慧書","data":{"id":"song-of-songs","order":22,"name":"雅歌","abbr":"歌","chapters":8,"group":"詩歌智慧書","oneLine":"一首男女相愛的情歌：良人與佳偶彼此傾慕","background":{"author":"書名寫「所羅門的歌，是歌中的雅歌」（歌 1:1），傳統上認為是所羅門所作，也有不同看法","date":"傳統上認為約主前 10 世紀所羅門時代，也有不同看法","audience":"書中沒有寫明對象；新婦多次對「耶路撒冷的眾女子」說話","place":"不確定；詩中提到耶路撒冷、黎巴嫩、基列山、隱基底等地","why":"雅歌是一組詩歌，由新婦（書拉密女）、良人與耶路撒冷眾女子輪流說話，描寫兩人彼此吸引、分離尋找、重逢與婚禮。歷來對這卷書有不同讀法，本頁只講書裡寫了什麼。"},"revelations":[{"key":"彼此傾慕","point":"良人與佳偶互相讚美","explain":"全書大部分是兩人用花園、葡萄園、羚羊、鴿子等意象，描寫對方的美與自己的愛慕。","ref":"歌 1:15～2:3；4:1–7"},{"key":"等他情願","point":"不要驚動愛情，等他自己情願","explain":"新婦三次囑咐耶路撒冷的眾女子，不要驚動、不要叫醒所親愛的，等他自己情願。這句重複出現，像全書的副歌。","ref":"歌 2:7；3:5；8:4"},{"key":"尋找良人","point":"分離時的渴想與尋找","explain":"新婦兩次在夜裡尋找良人，在城中街市上詢問守望的人，表達分離的焦急。","ref":"歌 3:1–4；5:2–8"},{"key":"互相歸屬","point":"我屬我的良人，我的良人也屬我","explain":"類似的話在 2:16 也出現過（「良人屬我，我也屬他」），表達兩人彼此歸屬的關係。","ref":"歌 2:16；6:3"},{"key":"愛如死堅強","point":"愛情眾水不能息滅","explain":"全書的高潮：愛情如死之堅強，眾水不能息滅，大水也不能淹沒，財寶也換不來。","ref":"歌 8:6–7"}],"outline":[{"key":"初戀渴慕","range":"1:1～2:7","point":"新婦渴慕良人，兩人互相讚美"},{"key":"春天邀請","range":"2:8～3:5","point":"良人邀新婦同去，新婦夜裡尋找良人"},{"key":"所羅門的轎","range":"3:6～5:1","point":"所羅門的轎從曠野上來，良人讚美新婦，兩人在園中相會"},{"key":"夜間尋找","range":"5:2～6:3","point":"良人來敲門又離去，新婦出去尋找並描述良人"},{"key":"讚美書拉密","range":"6:4～8:4","point":"良人再次讚美新婦，稱她為書拉密女"},{"key":"愛的結語","range":"8:5–14","point":"愛情如死之堅強，眾水不能息滅"}],"stories":[{"key":"冬天已往","title":"起來，與我同去","ref":"歌 2:8–13","summary":"良人像羚羊、像小鹿越過山嶺而來，在窗外呼喚新婦：冬天已往，雨水止住過去了，地上百花開放，斑鳩的聲音聽見了，我的佳偶，起來，與我同去。","people":[]},{"key":"小狐狸","title":"擒拿小狐狸","ref":"歌 2:15","summary":"新婦說要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸，因為葡萄正在開花。這句話放在兩人彼此歸屬的宣告之前。","people":[]},{"key":"轎從曠野","title":"所羅門的轎","ref":"歌 3:6–11","summary":"有一頂轎從曠野上來，是所羅門的轎，有以色列中六十個勇士護衛，轎是用黎巴嫩木頭做的。新婦請錫安的眾女子出去觀看戴著冠冕的所羅門王，就是在他婚筵的日子。","people":["solomon"]},{"key":"夜裡尋找","title":"良人敲門又離去","ref":"歌 5:2～6:3","summary":"良人夜裡來敲門，新婦遲疑了一下才起來開門，良人卻已轉身走了。她出去尋找，被城中巡邏看守的人擊打；耶路撒冷的眾女子問她的良人有什麼強過別人，她就逐一描述良人的樣子。","people":[]},{"key":"愛的印記","title":"愛情如死之堅強","ref":"歌 8:6–7","summary":"新婦說：求你將我放在你心上如印記，帶在你臂上如戳記，因為愛情如死之堅強。愛情眾水不能息滅，若有人拿家中所有的財寶要換愛情，就全被藐視。","people":[]}],"people":["solomon"],"verses":[{"ref":"歌 8:6","text":"求你將我放在你心上如印記，帶在你臂上如戳記。因為愛情如死之堅強，嫉恨如陰間之殘忍；所發的電光是火焰的電光，是耶和華的烈焰。"},{"ref":"歌 6:3","text":"我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。"},{"ref":"歌 8:7","text":"愛情，眾水不能息滅，大水也不能淹沒。若有人拿家中所有的財寶要換愛情，就全被藐視。"}]}},{"t":"ot","id":"isaiah","order":23,"name":"以賽亞書","abbr":"賽","chapters":66,"group":"大先知書","data":{"id":"isaiah","order":23,"name":"以賽亞書","abbr":"賽","chapters":66,"group":"大先知書","oneLine":"以賽亞警告審判，也宣告安慰、救贖與新天新地","background":{"author":"以賽亞（亞摩斯的兒子）；傳統上認為全書出自他，也有不同看法","date":"約主前 740～700 年（以賽亞說預言的年代）","audience":"猶大與耶路撒冷的百姓，另有對列國的默示","place":"耶路撒冷","why":"以賽亞在烏西雅、約坦、亞哈斯、希西家四王年間說預言（賽 1:1）。當時亞述強大，北國以色列約主前 722 年被亞述滅亡，猶大也一再面臨亞蘭與以色列聯軍、亞述王西拿基立的威脅。先知勸王和百姓倚靠耶和華，不要倚靠列國。"},"revelations":[{"key":"以色列的聖者","point":"神是聖潔的，稱為「以色列的聖者」。","explain":"這個稱呼在全書反覆出現。以賽亞蒙召時聽見撒拉弗呼喊「聖哉！聖哉！聖哉！」，全書的審判與安慰都從神的聖潔出發。","ref":"賽 6:1–7"},{"key":"審判與回轉","point":"百姓背離神必受審判，神也呼喚他們回轉。","explain":"第 1 章控訴猶大雖守節期、獻祭，手卻滿了殺人的血；神說他們的罪雖像硃紅，必變成雪白。","ref":"賽 1:2–20"},{"key":"倚靠耶和華","point":"危急時要倚靠神，不要倚靠埃及或列國。","explain":"先知勸亞哈斯不要懼怕亞蘭和以色列，又責備下埃及求幫助的人；希西家在亞述圍城時禱告，城得保全。","ref":"賽 7:1–9；30:1–3；37:14–36"},{"key":"應許的君王","point":"神應許一位出自大衛家的君王。","explain":"書中說有一嬰孩為我們而生，稱為和平的君；又說從耶西的本必發一條。新約在太 1:23 引用賽 7:14 的以馬內利。","ref":"賽 7:14；9:6–7；11:1–10"},{"key":"安慰百姓","point":"審判之後，神要安慰被擄的人並領他們歸回。","explain":"40 章以「你們要安慰，安慰我的百姓」開始，宣告神要領百姓從巴比倫歸回，甚至點名古列是神所用的人。","ref":"賽 40～48"},{"key":"受苦的僕人","point":"耶和華的僕人為眾人的罪受苦。","explain":"52～53 章描寫一位僕人被藐視、受鞭傷，為百姓的過犯受害，並說神的義僕必使多人得稱為義。","ref":"賽 52:13～53:12"},{"key":"新天新地","point":"最後神要創造新天新地。","explain":"65～66 章說以前的事不再被記念，神要造耶路撒冷為人所喜，豺狼必與羊羔同食。","ref":"賽 65:17～66:24"}],"outline":[{"key":"審判與應許","range":"1～12 章","point":"責備猶大的罪，穿插以賽亞蒙召、以馬內利與大衛後裔的應許。"},{"key":"列國的默示","range":"13～23 章","point":"對巴比倫、摩押、大馬士革、埃及、泰爾等國的宣告。"},{"key":"全地受審","range":"24～27 章","point":"全地受審判，最後神要吞滅死亡、擦去各人臉上的眼淚。"},{"key":"禍哉信息","range":"28～35 章","point":"一連串「禍哉」責備倚靠埃及的人；34～35 章對照審判與曠野開花。"},{"key":"希西家年間","range":"36～39 章","point":"亞述圍城、希西家得醫治、巴比倫使者來訪的歷史段落。"},{"key":"安慰與歸回","range":"40～48 章","point":"安慰被擄的人，宣告神是獨一的創造主，古列要使百姓歸回。"},{"key":"僕人與錫安","range":"49～57 章","point":"耶和華的僕人受苦、錫安得復興，邀請乾渴的人就近水來。"},{"key":"末後的榮耀","range":"58～66 章","point":"真正的禁食、錫安的榮耀、「主耶和華的靈在我身上」（耶穌在路 4:17–21 念這段），最後是新天新地。"}],"stories":[{"key":"蒙召異象","title":"以賽亞蒙召","ref":"賽 6:1–13","summary":"烏西雅王崩的那年，以賽亞看見主坐在高高的寶座上，撒拉弗彼此呼喊「聖哉」。他說自己是嘴唇不潔的人，撒拉弗用壇上的紅炭沾他的口；他聽見主問「我可以差遣誰呢」，就回答「我在這裡，請差遣我」。新約在太 13:14–15 引用這章 9～10 節。","people":["isaiah"]},{"key":"以馬內利","title":"童女懷孕的兆頭","ref":"賽 7:1–17","summary":"亞蘭王利汛和以色列王比加聯手攻打耶路撒冷，亞哈斯王和百姓的心都跳動。以賽亞帶著兒子去見王，要他不要懼怕，並說主要給一個兆頭：必有童女懷孕生子，給他起名叫以馬內利。新約在太 1:23 引用這一節。","people":["isaiah"]},{"key":"和平的君","title":"有一嬰孩為我們而生","ref":"賽 9:1–7","summary":"先知說在黑暗中行走的百姓看見了大光（新約在太 4:14–16 引用這段，指加利利）。接著說有一嬰孩為我們而生，政權擔在他的肩頭上，他要坐在大衛的寶座上，國度無窮。","people":["isaiah"]},{"key":"耶西的根","title":"從耶西的本發的枝","ref":"賽 11:1–10","summary":"從耶西的本必發一條，耶和華的靈要住在他身上，他按公義審判貧窮人。那時豺狼必與綿羊羔同居，豹子與山羊羔同臥，小孩子要牽引牠們。","people":["isaiah"]},{"key":"亞述圍城","title":"西拿基立圍攻耶路撒冷","ref":"賽 36～37","summary":"亞述王西拿基立攻取猶大的堅固城，派拉伯沙基到耶路撒冷城外嘲笑耶和華。希西家把亞述王的信在耶和華面前展開禱告，以賽亞傳話說亞述王必不得進城；耶和華的使者在亞述營中殺了十八萬五千人，西拿基立就回尼尼微去了。（同見王下 18～19）","people":["isaiah","hezekiah"]},{"key":"日影後退","title":"希西家病得醫治","ref":"賽 38","summary":"希西家病得要死，以賽亞告訴他當留遺命。希西家轉臉朝牆禱告、痛哭，神就加他十五年壽數，又使亞哈斯日晷上的日影往後退了十度作為兆頭。希西家病好後寫了一篇詩。（同見王下 20:1–11）","people":["isaiah","hezekiah"]},{"key":"巴比倫使者","title":"希西家給使者看寶庫","ref":"賽 39","summary":"巴比倫王米羅達巴拉但派使者帶書信和禮物來，希西家把寶庫、軍器庫和一切財寶都給他們看。以賽亞說日子必到，宮裡的一切都要被擄到巴比倫，他的子孫也要在巴比倫王宮裡當太監。（同見王下 20:12–19）","people":["isaiah","hezekiah"]},{"key":"曠野的聲音","title":"你們要安慰我的百姓","ref":"賽 40:1–31","summary":"神吩咐安慰耶路撒冷，說她爭戰的日子已滿。有人聲喊著說「在曠野預備耶和華的路」（新約在太 3:3 用這節指施洗約翰）。這章接著說人如草、神的話必永遠立定，等候耶和華的必重新得力。","people":["isaiah"]},{"key":"古列受膏","title":"神點名古列","ref":"賽 44:24～45:7","summary":"神論古列說「他是我的牧人」，必成就神所喜悅的，下令建造耶路撒冷、立穩聖殿的根基。45 章稱古列為耶和華所膏的，說神要攙扶他的右手，使列國降伏在他面前。","people":["cyrus"]},{"key":"被藐視的人","title":"他為我們的過犯受害","ref":"賽 52:13～53:12","summary":"這段描寫一位僕人無佳形美容，被藐視、被人厭棄，多受痛苦。他像羊羔被牽到宰殺之地，卻不開口；耶和華使眾人的罪孽都歸在他身上。新約在徒 8:32–35 記載腓利從這段經文向太監傳講耶穌。","people":["isaiah"]}],"people":["isaiah","hezekiah","cyrus"],"verses":[{"ref":"賽 6:8","text":"我又聽見主的聲音說：「我可以差遣誰呢？誰肯為我們去呢？」我說：「我在這裡，請差遣我！」"},{"ref":"賽 9:6","text":"因有一嬰孩為我們而生；有一子賜給我們。政權必擔在他的肩頭上；他名稱為「奇妙策士、全能的神、永在的父、和平的君」。"},{"ref":"賽 40:31","text":"但那等候耶和華的必重新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。"},{"ref":"賽 53:5","text":"哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。"}]}},{"t":"ot","id":"jeremiah","order":24,"name":"耶利米書","abbr":"耶","chapters":52,"group":"大先知書","data":{"id":"jeremiah","order":24,"name":"耶利米書","abbr":"耶","chapters":52,"group":"大先知書","oneLine":"耶利米在猶大亡國前後勸百姓回轉，並應許新約","background":{"author":"耶利米（祭司希勒家的兒子），部分由文士巴錄寫下","date":"約主前 627 年蒙召，傳道到耶路撒冷陷落（約主前 586 年）以後","audience":"猶大與耶路撒冷的君王和百姓，也寫信給被擄到巴比倫的人","place":"耶路撒冷；城陷後被帶到埃及","why":"耶利米在約西亞王十三年蒙召，經歷約雅敬到西底家等王（耶 1:2–3）。當時亞述衰落、巴比倫興起，猶大在大國之間搖擺。耶利米說巴比倫是神審判的工具，勸人歸降，被看作動搖民心，多次被打、被關。約主前 586 年耶路撒冷被巴比倫攻破，聖殿被焚。"},"revelations":[{"key":"背約的百姓","point":"猶大離棄神，像妻子背棄丈夫。","explain":"先知說百姓離棄活水的泉源，為自己鑿出破裂不能存水的池子，又用不貞的妻子比喻拜偶像。","ref":"耶 2:13；3:1–10"},{"key":"心裡回轉","point":"神要的是心裡回轉，不是倚靠外表的宗教。","explain":"耶利米在聖殿門口說，不要倚靠「這些是耶和華的殿」這虛謊的話，要改正行為；又說人心比萬物都詭詐。","ref":"耶 7:1–15；17:9"},{"key":"神的主權","point":"神掌管列國，像窯匠掌管手中的泥。","explain":"窯匠把做壞的器皿重新做；神說他待以色列家也能這樣，一國若回頭離開惡，他就不降所說的災。","ref":"耶 18:1–10"},{"key":"七十年","point":"列國要服事巴比倫王七十年。","explain":"先知說這地要荒涼，滿了七十年以後神要眷顧百姓、使他們歸回。但以理後來讀到這段（但 9:2）。","ref":"耶 25:11–12；29:10"},{"key":"另立新約","point":"神要另立新約，把律法寫在人心上。","explain":"31 章說日子將到，神要與以色列家和猶大家另立新約，不像領他們祖宗出埃及時所立的約。新約在來 8:8–12 引用這段。","ref":"耶 31:31–34"},{"key":"流淚的先知","point":"耶利米為百姓的苦難哀哭，也向神訴苦。","explain":"他說但願自己的眼為淚的泉源，好為百姓晝夜哭泣；又說神的話在他心裡像燒著的火。傳統上稱他為「流淚的先知」。","ref":"耶 9:1；20:7–18"},{"key":"列國受審","point":"神也審判埃及、巴比倫等列國。","explain":"46～51 章是對列國的預言，最後連用來審判猶大的巴比倫也要傾倒。","ref":"耶 46～51"}],"outline":[{"key":"少年蒙召","range":"1 章","point":"耶利米在約西亞年間蒙召，看見杏樹枝與燒開的鍋。"},{"key":"呼喚回轉","range":"2～20 章","point":"責備猶大拜偶像，聖殿講道，窯匠與瓦瓶的比喻，被上枷。"},{"key":"列王與假先知","range":"21～29 章","point":"對末後幾任王與假先知的話，七十年的預言，給被擄者的信。"},{"key":"安慰之書","range":"30～33 章","point":"應許歸回與新約，被圍時買地作記號。"},{"key":"圍城前後","range":"34～45 章","point":"燒書卷、坑中被救、城破、基大利被殺、被帶到埃及。"},{"key":"列國預言","range":"46～51 章","point":"對埃及、非利士、摩押、亞捫、以東、大馬士革、巴比倫等國的預言。"},{"key":"城陷補記","range":"52 章","point":"記述耶路撒冷陷落，以及約雅斤王後來在巴比倫被釋放。"}],"stories":[{"key":"杏樹枝","title":"耶利米蒙召","ref":"耶 1:4–19","summary":"神說在他未出母胎就分別他為聖，派他作列國的先知。耶利米說「我是年幼的」，神伸手按他的口，把話放在他口中，又給他看杏樹枝和從北而傾的燒開的鍋，表示神要留意保守他的話得以成就、災禍要從北方發出。","people":["jeremiah"]},{"key":"聖殿講道","title":"站在殿門口講道","ref":"耶 7:1–15；26:1–24","summary":"神叫耶利米站在耶和華殿的門口，說百姓偷盜、殺人、隨從別神，卻倚靠聖殿，神要使這殿如示羅。26 章記載約雅敬登基時他講這類信息，祭司和先知要治死他，亞希甘保護他。","people":["jeremiah"]},{"key":"窯匠的家","title":"窯匠的泥與打碎的瓦瓶","ref":"耶 18:1～19:15","summary":"神叫耶利米到窯匠家，看他把做壞了的器皿另做別的器皿。後來又叫他買一個瓦瓶，到欣嫩子谷當著長老打碎，表示神要照樣打碎這民和這城。","people":["jeremiah"]},{"key":"上枷","title":"巴施戶珥把他上枷","ref":"耶 20:1–18","summary":"祭司巴施戶珥聽見耶利米的預言，就打他，把他枷在耶和華殿的門內。第二天放他出來，耶利米說耶和華不再叫他巴施戶珥，要叫他瑪歌珥米撒畢（四圍驚嚇）。這章後半是耶利米向神的苦訴。","people":["jeremiah"]},{"key":"木軛鐵軛","title":"頸項上的軛","ref":"耶 27～28","summary":"耶利米照神吩咐做繩索與軛放在頸項上，勸猶大與列國服事巴比倫王。假先知哈拿尼雅說兩年內必折斷巴比倫王的軛，並把耶利米頸上的軛折斷；神說木軛換成鐵軛，耶利米說哈拿尼雅今年必死，他當年七月就死了。","people":["jeremiah","nebuchadnezzar"]},{"key":"被擄的信","title":"寫給巴比倫被擄者的信","ref":"耶 29:1–14","summary":"耶利米寫信給被擄到巴比倫的人：要蓋房子、栽種、娶妻生子，為那城求平安，因為那城得平安，他們也隨著得平安。他說滿了七十年，神要使他們歸回。","people":["jeremiah"]},{"key":"圍城買地","title":"圍城中買下亞拿突的地","ref":"耶 32:1–15","summary":"西底家第十年，巴比倫軍隊圍城，耶利米被囚在護衛兵的院內。神叫他買叔叔的兒子哈拿篾在亞拿突的地，他平了十七舍客勒銀子，把契約交給巴錄放在瓦器裡，表示將來這地必有人再買房屋、田地和葡萄園。","people":["jeremiah"]},{"key":"燒書卷","title":"王用刀割破書卷","ref":"耶 36:1–32","summary":"約雅敬第四年，耶利米口傳，巴錄把神的話寫在書卷上，在殿中念給百姓聽。書卷被念給王聽時，王坐在火盆前，每念三四篇就用文士的刀割破，扔在火中。神叫耶利米另取書卷再寫，又添了許多相彷彿的話。","people":["jeremiah"]},{"key":"淤泥中被救","title":"被丟進淤泥的牢獄","ref":"耶 38:1–13","summary":"首領說耶利米使兵丁的手發軟，把他用繩子縋下王的兒子瑪基雅的牢獄，裡面沒有水，只有淤泥，耶利米陷在淤泥中。王宮裡的古實人太監以伯米勒向王求情，帶人用破舊的衣服和繩子把他拉上來。","people":["jeremiah"]},{"key":"城破之後","title":"耶路撒冷陷落與下埃及","ref":"耶 39～43","summary":"西底家十一年城被攻破，王逃到耶利哥平原被追上，眼睛被剜，用銅鍊鎖著帶到巴比倫。巴比倫王立基大利作省長，卻被以實瑪利殺害；剩下的人怕巴比倫報復，不聽耶利米勸阻，把他和巴錄帶到埃及的答比匿。","people":["jeremiah","nebuchadnezzar"]}],"people":["jeremiah","josiah","nebuchadnezzar"],"verses":[{"ref":"耶 1:5","text":"我未將你造在腹中，我已曉得你；你未出母胎，我已分別你為聖；我已派你作列國的先知。"},{"ref":"耶 29:11","text":"耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。"},{"ref":"耶 33:3","text":"你求告我，我就應允你，並將你所不知道、又大又難的事指示你。"}]}},{"t":"ot","id":"lamentations","order":25,"name":"耶利米哀歌","abbr":"哀","chapters":5,"group":"大先知書","data":{"id":"lamentations","order":25,"name":"耶利米哀歌","abbr":"哀","chapters":5,"group":"大先知書","oneLine":"為耶路撒冷陷落而寫的五首哀歌","background":{"author":"作者沒有署名；傳統上認為是耶利米，也有不同看法","date":"約主前 586 年耶路撒冷陷落後不久","audience":"經歷亡國的猶大百姓","place":"不確定，可能在耶路撒冷一帶","why":"巴比倫攻破耶路撒冷，聖殿被焚，百姓被殺或被擄，圍城中饑荒慘重。詩人把這場災難寫成五首哀歌，承認這是百姓犯罪的結果，也在痛苦中向神呼求。前四首按希伯來文字母的順序排列。"},"revelations":[{"key":"城的哀哭","point":"耶路撒冷從尊貴落到荒涼。","explain":"第一首說先前滿有人民的城，現在獨坐如寡婦，在一切所親愛的中間沒有一個安慰她的。","ref":"哀 1:1–2"},{"key":"罪的後果","point":"詩人承認這災難是因百姓的罪。","explain":"錫安說「耶和華是公義的」，承認自己違背了神的命令；詩人也說先知所見的是虛假的異象，沒有顯露百姓的罪孽。","ref":"哀 1:18；2:14"},{"key":"慈愛不斷絕","point":"在最深的苦難中仍盼望神的慈愛。","explain":"第三首在全書正中間，從個人的痛苦轉到「他的憐憫不致斷絕。每早晨，這都是新的」。","ref":"哀 3:19–24"},{"key":"靜默等候","point":"人應當仰望神，靜默等候他的救恩。","explain":"詩人說靜默等候耶和華的救恩原是好的，因為主必不永遠丟棄人，他雖使人憂愁，還要照他諸般的慈愛發憐憫。","ref":"哀 3:25–33"},{"key":"求你復新","point":"最後向神求復興。","explain":"第五首是眾百姓的禱告，結尾求神使他們回轉，復新他們的日子像古時一樣。","ref":"哀 5:19–22"}],"outline":[{"key":"城如寡婦","range":"1 章","point":"錫安獨坐哀哭，沒有人安慰。"},{"key":"主的烈怒","range":"2 章","point":"描寫神發怒，城牆、聖殿、君王、祭司都被毀。"},{"key":"苦中盼望","range":"3 章","point":"一個受苦的人訴說痛苦，再轉向神的慈愛與誠實。"},{"key":"圍城慘狀","range":"4 章","point":"圍城中的饑荒，以及先知與祭司的罪。"},{"key":"百姓禱告","range":"5 章","point":"求神記念百姓的羞辱，使他們回轉。"}],"stories":[{"key":"寡婦之城","title":"獨坐的城","ref":"哀 1:1–22","summary":"第一首把耶路撒冷比作寡婦，夜間痛哭、淚流滿腮，從前的朋友都成了仇敵。後半錫安自己開口，問一切過路的人可曾見過像她這樣的痛苦。","people":[]},{"key":"早晨新的","title":"每早晨都是新的","ref":"哀 3:1–33","summary":"第三首開頭說「我是因耶和華忿怒的杖，遭遇困苦的人」，描寫被圍困、被拋棄的痛苦。到 21 節轉折：他想起這事，心裡就有指望，因為神的憐憫不致斷絕，每早晨都是新的。","people":[]},{"key":"黃金失光","title":"圍城中的饑荒","ref":"哀 4:1–22","summary":"第四首說黃金何其失光，錫安寶貴的眾子好比精金，現在竟算為窯匠手所作的瓦瓶；圍城時孩童求餅，無人擘給他們。詩人說這都因先知的罪孽和祭司的罪惡。","people":[]},{"key":"最後的禱告","title":"求你使我們回轉","ref":"哀 5:1–22","summary":"第五首不再按字母排列，是百姓一同禱告：求神記念他們的羞辱，他們的產業歸與外邦人，冠冕從頭上落下。結尾求神使他們回轉，復新他們的日子。","people":[]}],"people":["jeremiah"],"verses":[{"ref":"哀 3:22–23","text":"我們不致消滅，是出於耶和華諸般的慈愛；是因他的憐憫不致斷絕。每早晨，這都是新的；你的誠實極其廣大！"},{"ref":"哀 5:21","text":"耶和華啊，求你使我們向你回轉，我們便得回轉。求你復新我們的日子，像古時一樣。"}]}},{"t":"ot","id":"ezekiel","order":26,"name":"以西結書","abbr":"結","chapters":48,"group":"大先知書","data":{"id":"ezekiel","order":26,"name":"以西結書","abbr":"結","chapters":48,"group":"大先知書","oneLine":"被擄的祭司以西結看見神的榮耀，宣告審判與復興","background":{"author":"以西結（祭司布西的兒子），書中多用第一人稱敘述","date":"約主前 593～571 年（書中記年的範圍）","audience":"被擄到巴比倫的猶太人，也有對耶路撒冷與列國的話","place":"巴比倫的迦巴魯河邊（今伊拉克境內）","why":"約主前 597 年，以西結與約雅斤王同一批被擄到巴比倫（結 1:2–3）。被擄的人以為耶路撒冷不會倒，以西結卻預告城和聖殿必遭毀滅；約主前 586 年城陷的消息傳來後（結 33:21），他的信息轉向安慰與復興。"},"revelations":[{"key":"神的榮耀","point":"神的榮耀在被擄之地也向人顯現。","explain":"以西結在巴比倫看見活物、輪子與寶座上的榮耀；後來看見榮耀離開耶路撒冷的聖殿，最後又回到新的聖殿。","ref":"結 1；10；43:1–5"},{"key":"守望的人","point":"先知像守望者，要警告百姓。","explain":"神立以西結作以色列家守望的人：惡人不聽警告，要死在罪中；守望的若不警告，神要向他追討那人喪命的罪。","ref":"結 3:16–21；33:1–9"},{"key":"各人擔罪","point":"各人為自己的罪負責。","explain":"神說兒子不擔當父親的罪孽，各人照自己所行的受審判；惡人若回頭離開所犯的罪，就必存活。","ref":"結 18"},{"key":"知道耶和華","point":"審判與拯救都是要人知道神是耶和華。","explain":"「你們就知道我是耶和華」這句話在書中反覆出現，不論對以色列或列國，審判與復興都指向這個目的。","ref":"結 6:7；36:23"},{"key":"新心新靈","point":"神要給百姓新心，使他們遵行他的律例。","explain":"36 章說神要除掉石心、賜給肉心，把他的靈放在他們裡面；37 章用枯骨復生描寫民族的復興。","ref":"結 36:22～37:14"},{"key":"新殿與活水","point":"最後的異象是新聖殿與殿中流出的河。","explain":"40～48 章詳細描寫聖殿的尺寸、敬拜與土地分配，最後說這城的名字要稱為「耶和華的所在」。這些細節的意思有不同看法。","ref":"結 40～48"}],"outline":[{"key":"先知蒙召","range":"1～3 章","point":"迦巴魯河邊的異象，吃書卷，被立為守望的人。"},{"key":"審判耶路撒冷","range":"4～24 章","point":"演出圍城、榮耀離殿、各人擔罪，城陷前的一連串警告。"},{"key":"列國受審","range":"25～32 章","point":"對亞捫、摩押、以東、非利士、泰爾、西頓、埃及的預言。"},{"key":"城陷消息","range":"33 章","point":"守望者再次受命，逃出來的人報告城已攻破。"},{"key":"復興應許","range":"34～37 章","point":"好牧人、新心新靈、枯骨復生、兩根杖合而為一。"},{"key":"歌革之戰","range":"38～39 章","point":"瑪各地的歌革率眾來攻，被神擊敗；這段的意思有不同看法。"},{"key":"新的聖殿","range":"40～48 章","point":"新聖殿的異象，榮耀回來，殿中流出的河，土地的分配。"}],"stories":[{"key":"迦巴魯河","title":"輪中套輪的異象","ref":"結 1:1–28","summary":"以西結在迦巴魯河邊看見狂風從北方颳來，有四個活物，各有四個臉、四個翅膀，旁邊有輪中套輪；活物頭上有寶座，寶座上有彷彿人的形狀。他明白這是耶和華的榮耀，就俯伏在地。","people":["ezekiel"]},{"key":"吃書卷","title":"書卷在口中甜如蜜","ref":"結 2:8～3:15","summary":"神遞給他一卷書，內外都寫著哀號、歎息、悲痛的話，叫他吃下去；他吃了，口中覺得甜如蜜。神差他去對悖逆的以色列家說話，不論他們聽不聽。","people":["ezekiel"]},{"key":"演出圍城","title":"用磚與鬚髮演出預言","ref":"結 4～5","summary":"神叫以西結在磚上畫耶路撒冷，演出圍城的樣子，又按日數向左側臥、向右側臥，擔當百姓的罪孽。他用利刀剃下鬚髮分成三份，一份燒、一份用刀砍、一份撒在風中，表示城中百姓的結局。","people":["ezekiel"]},{"key":"榮耀離殿","title":"聖殿裡的可憎之事","ref":"結 8～11","summary":"以西結在異象中被帶到耶路撒冷，看見殿裡有偶像，婦女為搭模斯哭泣，約二十五個人背向耶和華的殿、面向東方拜日頭。接著他看見耶和華的榮耀離開殿的門檻，最後停在城東的山上。","people":["ezekiel"]},{"key":"酸葡萄俗語","title":"父親吃了酸葡萄","ref":"結 18:1–32","summary":"神問百姓為何用「父親吃了酸葡萄，兒子的牙酸倒了」這俗語，意思是兒子替父親受罰。神舉義人、惡兒子、義孫子三代為例，說各人照自己所行的受審判，並說他不喜悅人死亡，要人回頭而存活。","people":["ezekiel"]},{"key":"妻子離世","title":"不可為妻子哀哭","ref":"結 24:15–27","summary":"神告訴以西結，要將他眼目所喜愛的忽然取去，他卻不可悲哀哭泣。當晚他的妻子就死了，他照吩咐不哀哭；百姓問他這是什麼意思，他說神的聖所被褻瀆、他們的兒女倒在刀下時，他們也要這樣。","people":["ezekiel"]},{"key":"好牧人","title":"神親自牧養他的羊","ref":"結 34:1–31","summary":"神責備以色列的牧人只顧自己，不餵養群羊，羊就分散。神說他要親自尋找、牧養他的羊，並立一個牧人照管他們，就是「我的僕人大衛」。","people":["ezekiel"]},{"key":"枯骨復生","title":"平原上的骸骨","ref":"結 37:1–14","summary":"神把以西結帶到遍滿骸骨的平原，問他這些骸骨能復活嗎。他照吩咐向骸骨說預言，骨與骨聯絡、長出筋肉，氣息進入，就活了，成為極大的軍隊。神說這些骸骨就是以色列全家，他要開他們的墳墓，領他們回本地。","people":["ezekiel"]},{"key":"兩根杖","title":"兩根木杖合而為一","ref":"結 37:15–28","summary":"神叫以西結拿兩根木杖，一根寫猶大，一根寫約瑟（以法蓮），在手中聯為一根，表示南北兩國要合為一國，歸一個王治理。","people":["ezekiel"]},{"key":"殿中流水","title":"從殿裡流出的河","ref":"結 47:1–12","summary":"以西結看見水從殿的門檻下往東流，每量一千肘，水就從踝子骨深到膝、到腰，最後成了不能蹚過的河。河水所到之處百物都生活，河兩岸的樹每月結新果子，葉子可以治病。","people":["ezekiel"]}],"people":["ezekiel","nebuchadnezzar"],"verses":[{"ref":"結 36:26","text":"我也要賜給你們一個新心，將新靈放在你們裡面，又從你們的肉體中除掉石心，賜給你們肉心。"},{"ref":"結 37:3","text":"他對我說：「人子啊，這些骸骨能復活嗎？」我說：「主耶和華啊，你是知道的。」"},{"ref":"結 33:11","text":"你對他們說，主耶和華說：我指著我的永生起誓，我斷不喜悅惡人死亡，惟喜悅惡人轉離所行的道而活。以色列家啊，你們轉回，轉回吧！離開惡道，何必死亡呢？"}]}},{"t":"ot","id":"daniel","order":27,"name":"但以理書","abbr":"但","chapters":12,"group":"大先知書","data":{"id":"daniel","order":27,"name":"但以理書","abbr":"但","chapters":12,"group":"大先知書","oneLine":"但以理在外邦宮廷忠於神，並看見列國興衰的異象","background":{"author":"傳統上認為是但以理，也有不同看法","date":"書中事件約主前 605～536 年；成書年代傳統上認為約在主前六世紀，也有不同看法","audience":"被擄與活在外邦統治下的猶太人","place":"巴比倫（書中場景在巴比倫與波斯的宮廷）","why":"約雅敬在位第三年，巴比倫王尼布甲尼撒圍困耶路撒冷，把一些王室與貴族的少年帶到巴比倫受教育，但以理是其中之一（但 1:1–6）。他經歷巴比倫幾任王，直到波斯王古列年間。全書前半（1～6 章）是宮廷中的故事，後半（7～12 章）是異象；2:4～7:28 原文用亞蘭文寫成。"},"revelations":[{"key":"神掌權","point":"至高者在人的國中掌權。","explain":"尼布甲尼撒被趕出、與野獸同居，直到他知道「至高者在人的國中掌權」；全書反覆說明是神廢王、立王。","ref":"但 2:21；4:25"},{"key":"異鄉忠心","point":"身在外邦，仍持守對神的忠心。","explain":"但以理和三個朋友在巴比倫受教育、做官，卻在飲食、拜像、禱告這些事上不妥協。","ref":"但 1；3；6"},{"key":"神必拯救","point":"神能救人脫離火窯與獅子的口。","explain":"三個朋友說神能救他們，「即或不然」也不拜金像；但以理在獅子坑中說神差遣使者封住了獅子的口。","ref":"但 3:17–18；6:22"},{"key":"列國興衰","point":"異象描寫一連串國度的興起與衰落。","explain":"第 2 章的大像與第 7 章的四獸都描寫相繼的國度；8 章天使點名瑪代、波斯和希臘。其餘具體所指有不同看法。","ref":"但 2；7；8:20–21"},{"key":"永遠的國","point":"最後神要立一個永不敗壞的國。","explain":"大像被非人手鑿出的石頭打碎，石頭變成大山充滿天下；7 章說有一位像人子的駕著天雲而來，得了永遠的權柄。","ref":"但 2:44；7:13–14"},{"key":"認罪禱告","point":"但以理為百姓認罪，求神憐憫。","explain":"他從耶利米的書上明白荒涼要滿七十年，就禁食、披麻蒙灰，承認百姓的罪，求神為自己的名垂聽。","ref":"但 9:1–19"},{"key":"復醒的盼望","point":"書末說死了的人要復醒，智慧人要發光。","explain":"12 章說睡在塵埃中的必有多人復醒，有得永生的，有受羞辱永遠被憎惡的；最後神告訴但以理，到了末期他必起來享受他的福分。","ref":"但 12:1–13"}],"outline":[{"key":"被擄受教","range":"1 章","point":"但以理與三個朋友被擄到巴比倫，不吃王的膳。"},{"key":"王的夢境","range":"2～4 章","point":"尼布甲尼撒的兩個夢，以及金像與火窯。"},{"key":"宮中考驗","range":"5～6 章","point":"伯沙撒的筵席與牆上的字，大利烏年間的獅子坑。"},{"key":"四國異象","range":"7～8 章","point":"四獸、亙古常在者與人子，公綿羊與公山羊。"},{"key":"禱告與七十","range":"9 章","point":"但以理認罪禱告，加百列說明七十個七。"},{"key":"末後的事","range":"10～12 章","point":"底格里斯河邊的異象，南方王與北方王，書末的盼望。"}],"stories":[{"key":"素菜白水","title":"不吃王的膳","ref":"但 1:1–21","summary":"但以理、哈拿尼雅、米沙利、亞撒利雅被帶到巴比倫，太監長給他們改名為伯提沙撒、沙得拉、米煞、亞伯尼歌。但以理立志不以王的膳和酒玷污自己，求委辦試驗十天只給素菜和白水；十天後他們比用王膳的少年更加俊美肥胖，王考問時發現他們勝過通國的術士十倍。","people":["daniel","shadrach-meshach-abednego","nebuchadnezzar"]},{"key":"大像之夢","title":"尼布甲尼撒夢見大像","ref":"但 2:1–49","summary":"王做夢心裡煩亂，要術士說出夢和講解，說不出就要被殺。但以理和朋友求神，神在夜間異象中把夢顯明。王夢見的大像頭是精金、胸膛膀臂是銀、肚腹和腰是銅、腿是鐵、腳是半鐵半泥，一塊非人手鑿出的石頭打碎了大像；但以理說王就是那金頭。","people":["daniel","nebuchadnezzar"]},{"key":"烈火的窯","title":"三人在火窯中","ref":"但 3:1–30","summary":"尼布甲尼撒在杜拉平原立了金像，下令聽見樂器聲就要俯伏敬拜。沙得拉、米煞、亞伯尼歌不拜，王把窯燒得比尋常更熱七倍，把他們捆起扔進去。王卻看見四個人在火中遊行，第四個的相貌好像神子；三人出來，連頭髮也沒有燒焦。","people":["shadrach-meshach-abednego","nebuchadnezzar"]},{"key":"吃草如牛","title":"尼布甲尼撒被趕出","ref":"但 4:1–37","summary":"王夢見一棵極高的大樹被砍下，只留樹墩。但以理勸王施行公義、憐憫窮人。十二個月後王在宮中誇口，就被趕出離開世人，吃草如牛，過了七期；後來他的聰明復歸於他，就讚美、尊敬至高的神。","people":["daniel","nebuchadnezzar"]},{"key":"牆上寫字","title":"伯沙撒的筵席","ref":"但 5:1–31","summary":"伯沙撒王大擺筵席，用他父尼布甲尼撒從耶路撒冷殿中所掠的金銀器皿飲酒，忽然有人的指頭在牆上寫字。但以理講解「彌尼，彌尼，提客勒，烏法珥新」：神數算了他國的年日，他被稱在天平裡顯出虧欠，國要歸與瑪代人和波斯人。當夜伯沙撒被殺，瑪代人大利烏取了國。","people":["daniel"]},{"key":"獅子坑","title":"但以理在獅子坑中","ref":"但 6:1–28","summary":"大利烏立但以理為三位總長之一，其他官員找不到他的錯，就讓王下禁令：三十日內只准向王求。但以理照常一日三次，在開向耶路撒冷的窗前雙膝跪下禱告，被扔進獅子坑。第二天早晨王來看，但以理說神差遣使者封住了獅子的口；王就把控告他的人扔進坑中。","people":["daniel"]},{"key":"四獸異象","title":"四獸與人子","ref":"但 7:1–28","summary":"伯沙撒元年，但以理夢見四個大獸從海中上來：像獅子而有鷹的翅膀、像熊、像豹而有四個頭、第四獸極其可怕而有十角。接著他看見亙古常在者坐在寶座上，又有一位像人子的駕著天雲而來，得了權柄、榮耀、國度。書中說四獸是四王，具體所指有不同看法。","people":["daniel"]},{"key":"綿羊山羊","title":"公綿羊與公山羊","ref":"但 8:1–27","summary":"但以理在異象中看見一隻有兩角的公綿羊，被一隻兩眼當中有一非常角的公山羊撞倒；山羊的大角折斷，又長出四個角。天使加百列說明公綿羊是瑪代和波斯王，公山羊是希臘王。","people":["daniel"]},{"key":"七十個七","title":"但以理的禱告與七十個七","ref":"但 9:1–27","summary":"大利烏元年，但以理從耶利米的書上明白耶路撒冷荒涼要滿七十年，就禁食禱告，為自己和百姓認罪。禱告時加百列來告訴他：為他本國之民和聖城，已經定了七十個七。這段年數的算法有不同看法。","people":["daniel"]},{"key":"底格里斯河","title":"末後的異象","ref":"但 10～12","summary":"古列第三年，但以理在底格里斯大河邊看見一位身穿細麻衣的人，說他被波斯國的魔君攔阻二十一日，有米迦勒來幫助。11 章講南方王與北方王的爭戰，書中提到「那行毀壞可憎的」，新約在太 24:15 說這是先知但以理所說的。12 章吩咐但以理封閉這書，直到末時。","people":["daniel","cyrus"]}],"people":["daniel","shadrach-meshach-abednego","nebuchadnezzar","cyrus"],"verses":[{"ref":"但 3:17–18","text":"即便如此，我們所事奉的神能將我們從烈火的窯中救出來。王啊，他也必救我們脫離你的手；即或不然，王啊，你當知道我們決不事奉你的神，也不敬拜你所立的金像。"},{"ref":"但 12:3","text":"智慧人必發光，如同天上的光；那使多人歸義的，必發光如星，直到永永遠遠。"}]}},{"t":"ot","id":"hosea","order":28,"name":"何西阿書","abbr":"何","chapters":14,"group":"小先知書","data":{"id":"hosea","order":28,"name":"何西阿書","abbr":"何","chapters":14,"group":"小先知書","oneLine":"先知娶不忠的妻子，演出神對以色列不放手的愛","background":{"author":"備利的兒子何西阿（何 1:1）","date":"約主前 750～715 年前後","audience":"北國以色列（書中常稱「以法蓮」），也提到南國猶大","place":"北國以色列","why":"何西阿在耶羅波安作以色列王、烏西雅到希西家作猶大王的時候說話（何 1:1）。北國表面富足，卻拜巴力、倚靠列國，國勢一路走下坡，約主前 722 年撒馬利亞被亞述攻陷。何西阿用自己的婚姻，把以色列離棄神的事演給百姓看。"},"revelations":[{"key":"婚姻比喻","point":"以色列離棄神，好像妻子對丈夫不忠","explain":"神吩咐何西阿娶淫婦為妻，用這段婚姻比喻以色列離棄耶和華、偏向別神；後來又叫他把妻子贖回來。","ref":"何 1～3"},{"key":"不認識神","point":"百姓的問題是不認識神","explain":"先知說這地上無誠實、無良善、無人認識神，又說「我的民因無知識而滅亡」。","ref":"何 4:1–6"},{"key":"良善勝祭祀","point":"神喜愛良善與認識神，勝過祭物","explain":"百姓的良善像早晨的雲霧，很快就散了。神說他喜愛良善，不喜愛祭祀；耶穌在太 9:13、12:7 兩次引用這句話。","ref":"何 6:4–6"},{"key":"父親的愛","point":"神像父親一樣愛以色列，捨不得棄絕","explain":"神說以色列年幼時就從埃及召出他的兒子，又說「我怎能捨棄你」。新約在太 2:15 引用「從埃及召出我的兒子來」。","ref":"何 11:1–9"},{"key":"歸回醫治","point":"回轉歸向耶和華，必得醫治","explain":"全書以呼召歸回作結：百姓要帶著認罪的話歸向耶和華，神應許醫治他們背道的病，甘心愛他們。","ref":"何 14:1–9"}],"outline":[{"key":"先知婚姻","range":"1～3 章","point":"何西阿娶歌篾、生三個孩子，後來再把妻子贖回"},{"key":"控告百姓","range":"4～7 章","point":"神與這地的居民爭辯：祭司失職、拜偶像、倚靠列國"},{"key":"種風收風","range":"8～10 章","point":"百姓立王、造牛犢，必收割審判的後果"},{"key":"父愛不捨","range":"11 章","point":"神回想從埃及領出以色列，說他的憐愛大大發動"},{"key":"雅各與審判","range":"12～13 章","point":"用雅各的往事對照以法蓮的驕傲，宣告審判"},{"key":"呼召歸回","range":"14 章","point":"勸以色列歸向耶和華，應許醫治與復興"}],"stories":[{"key":"先知背景","title":"何西阿在什麼時候、對誰說話","ref":"何 1:1","summary":"何西阿在耶羅波安作以色列王的晚期開始說話，一直到猶大王希西家的時代。他對北國以色列說話，當時國家先富足後動盪，最後亡於亞述。","people":["hosea"]},{"key":"娶妻歌篾","title":"何西阿娶歌篾與三個孩子","ref":"何 1:2–9","summary":"耶和華叫何西阿娶淫婦為妻，他就娶了滴拉音的女兒歌篾。三個孩子的名字都是信息：耶斯列、羅路哈瑪（不蒙憐憫）、羅阿米（非我民）。","people":["hosea"]},{"key":"贖回妻子","title":"再去愛那淫婦","ref":"何 3:1–5","summary":"耶和華又叫何西阿去愛一個淫婦，好像耶和華仍愛偏向別神的以色列人。何西阿用銀子十五舍客勒、大麥一賀梅珥半把她買回，要她多日獨居，比喻以色列將來必歸回尋求耶和華。","people":["hosea"]}],"people":["hosea"],"verses":[{"ref":"何 6:1","text":"來吧，我們歸向耶和華！他撕裂我們，也必醫治；他打傷我們，也必纏裹。"},{"ref":"何 6:6","text":"我喜愛良善，不喜愛祭祀；喜愛認識神，勝於燔祭。"},{"ref":"何 11:1","text":"以色列年幼的時候，我愛他，就從埃及召出我的兒子來。"}]}},{"t":"ot","id":"joel","order":29,"name":"約珥書","abbr":"珥","chapters":3,"group":"小先知書","data":{"id":"joel","order":29,"name":"約珥書","abbr":"珥","chapters":3,"group":"小先知書","oneLine":"一場蝗災引出耶和華的日子與聖靈澆灌的應許","background":{"author":"毘土珥的兒子約珥（珥 1:1）","date":"年代不確定；傳統上認為較早，也有不同看法，有人認為在被擄歸回之後","audience":"猶大與耶路撒冷的百姓、祭司和長老","place":"猶大，可能在耶路撒冷","why":"書卷沒有寫明是哪位王的時代。當時猶大遭遇嚴重的蝗災和乾旱，田地荒廢、聖殿缺少素祭和奠祭。約珥把這場災難當作警告，呼召百姓禁食悔改，並說到更大的「耶和華的日子」。"},"revelations":[{"key":"蝗災警告","point":"蝗災是要百姓醒悟的警告","explain":"約珥描寫剪蟲、蝗蟲、蝻子、螞蚱一波接一波吃盡土產，要老年人把這件事傳給後代。","ref":"珥 1:2–12"},{"key":"耶和華的日子","point":"耶和華的日子臨近，又大又可畏","explain":"這是全書的主題詞。先知用吹角、黑暗、大軍來描寫那日，說誰能當得起呢。","ref":"珥 2:1–11"},{"key":"撕裂心腸","point":"要撕裂心腸，不撕裂衣服","explain":"先知說神有恩典、有憐憫、不輕易發怒，呼召百姓一心歸向他，並召集全民嚴肅會禁食。","ref":"珥 2:12–17"},{"key":"補還年歲","point":"神應許補還蝗蟲所吃的年歲","explain":"百姓回轉後，神應許降秋雨春雨，禾場滿了麥子，蝗蟲那些年所吃的都要補還。","ref":"珥 2:18–27"},{"key":"澆灌聖靈","point":"神要將他的靈澆灌凡有血氣的","explain":"兒女要說預言、老年人做異夢、少年人見異象。新約在徒 2:16–21 由彼得引用這段，羅 10:13 作「凡求告主名的就必得救」。","ref":"珥 2:28–32"}],"outline":[{"key":"蝗災荒涼","range":"1 章","point":"蝗災與乾旱臨到，呼召祭司和百姓哀哭禁食"},{"key":"那日大軍","range":"2:1–11","point":"吹角警告：耶和華的日子像大軍臨到"},{"key":"回轉禁食","range":"2:12–17","point":"要一心歸向耶和華，召集嚴肅會"},{"key":"復興應許","range":"2:18–32","point":"地要復原，神的靈要澆灌凡有血氣的"},{"key":"審判列國","range":"3 章","point":"列國在約沙法谷、斷定谷受審，錫安得蒙保守"}],"stories":[{"key":"先知背景","title":"約珥在什麼時候、對誰說話","ref":"珥 1:1–3","summary":"約珥只介紹自己是毘土珥的兒子，沒有寫出王的年代，所以年代有不同看法。他向猶大的長老和居民說話，從眼前的蝗災講起。","people":[]},{"key":"四波蝗災","title":"蝗蟲吃盡土產","ref":"珥 1:4–20","summary":"剪蟲剩下的蝗蟲來吃，蝗蟲剩下的蝻子來吃，蝻子剩下的螞蚱來吃。葡萄樹枯乾、田荒涼，連聖殿的素祭和奠祭都斷絕了，先知呼召祭司束腰哀哭。","people":[]},{"key":"斷定谷","title":"許多許多的人在斷定谷","ref":"珥 3:9–17","summary":"神要列國預備打仗，把犁頭打成刀劍、鐮刀打成戈矛，聚到斷定谷受審。耶和華要從錫安吼叫，卻作他百姓的避難所。","people":[]}],"people":[],"verses":[{"ref":"珥 2:13","text":"你們要撕裂心腸，不撕裂衣服。歸向耶和華─你們的神；因為他有恩典，有憐憫，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災。"},{"ref":"珥 2:28","text":"以後，我要將我的靈澆灌凡有血氣的。你們的兒女要說預言；你們的老年人要做異夢，少年人要見異象。"}]}},{"t":"ot","id":"amos","order":30,"name":"阿摩司書","abbr":"摩","chapters":9,"group":"小先知書","data":{"id":"amos","order":30,"name":"阿摩司書","abbr":"摩","chapters":9,"group":"小先知書","oneLine":"牧人先知呼喊：要使公平如大水滾滾","background":{"author":"提哥亞牧人中的阿摩司（摩 1:1）","date":"約主前 760～750 年前後（「大地震前二年」，摩 1:1）","audience":"北國以色列，尤其是撒馬利亞與伯特利富裕的人","place":"阿摩司是猶大提哥亞人，到北國以色列的伯特利一帶說話","why":"當時是猶大王烏西雅、以色列王耶羅波安的時代，北國經濟繁榮，富人住象牙宮、喝酒享樂，卻欺壓窮人、在法庭收賄。阿摩司說自己原不是先知，是牧人和修理桑樹的，被耶和華選召去北國宣告審判。"},"revelations":[{"key":"三番四次","point":"列國與選民的罪，神都要追討","explain":"阿摩司先宣告大馬士革、迦薩、泰爾、以東、亞捫、摩押的罪，再轉到猶大，最後落在以色列身上。","ref":"摩 1～2"},{"key":"選民責任","point":"被神揀選，責任更重","explain":"神說在地上萬族中只認識以色列，因此必追討他們的一切罪孽；先知又說獅子吼叫，誰能不說預言。","ref":"摩 3:1–8"},{"key":"尋求存活","point":"要尋求神，不要只往聖地去","explain":"神說要尋求他就必存活，不要往伯特利、吉甲、別是巴去；要惡惡好善，在城門口秉公行義。","ref":"摩 5:4–15"},{"key":"公平公義","point":"神不喜悅缺少公義的敬拜","explain":"神說他厭惡他們的節期，不聽他們的歌聲琴聲，惟願公平如大水滾滾，使公義如江河滔滔。","ref":"摩 5:21–24"},{"key":"聽道饑荒","point":"最可怕的饑荒是聽不到神的話","explain":"先知說日子將到，人飢餓不是因無餅，乾渴不是因無水，乃因不聽耶和華的話。","ref":"摩 8:11–12"},{"key":"重建帳幕","point":"審判之後，神要重建大衛倒塌的帳幕","explain":"全書以復興應許作結：被擄的要歸回，重修城邑、栽種葡萄園。新約在徒 15:16–17 由雅各引用這段。","ref":"摩 9:11–15"}],"outline":[{"key":"審判列國","range":"1～2 章","point":"從列國一路講到猶大和以色列的罪"},{"key":"控告北國","range":"3～6 章","point":"責備撒馬利亞的富人、虛有其表的敬拜與安逸"},{"key":"五個異象","range":"7:1～9:10","point":"蝗蟲、火、準繩、夏天的果子、主站在壇旁"},{"key":"復興應許","range":"9:11–15","point":"重建大衛的帳幕，百姓歸回安居"}],"stories":[{"key":"先知背景","title":"阿摩司在什麼時候、對誰說話","ref":"摩 1:1；7:14–15","summary":"阿摩司在耶羅波安作以色列王時、大地震前二年得默示。他是南國猶大提哥亞的牧人，卻被耶和華差到北國以色列說話。","people":["amos"]},{"key":"巴珊母牛","title":"住撒馬利亞山的巴珊母牛","ref":"摩 4:1–3；6:1–7","summary":"阿摩司把撒馬利亞欺負貧寒、壓碎窮乏的富家婦女比作巴珊的母牛，又責備那些躺在象牙床上、用大碗喝酒，卻不為約瑟的苦難擔憂的人。","people":["amos"]},{"key":"準繩異象","title":"準繩與夏天的果子","ref":"摩 7:1～8:3","summary":"神先給阿摩司看蝗蟲和火的異象，他代求，神就後悔。接著神手拿準繩站在牆上，又給他看一筐夏天的果子，說以色列的結局到了。","people":["amos"]},{"key":"亞瑪謝","title":"伯特利祭司亞瑪謝趕先知走","ref":"摩 7:10–17","summary":"伯特利的祭司亞瑪謝向耶羅波安王告狀，又要阿摩司回猶大去餬口，不要在王的聖所說預言。阿摩司回答：我原不是先知，是耶和華選召我。","people":["amos"]}],"people":["amos"],"verses":[{"ref":"摩 5:24","text":"惟願公平如大水滾滾，使公義如江河滔滔。"},{"ref":"摩 8:11","text":"主耶和華說：日子將到，我必命饑荒降在地上。人飢餓非因無餅，乾渴非因無水，乃因不聽耶和華的話。"}]}},{"t":"ot","id":"obadiah","order":31,"name":"俄巴底亞書","abbr":"俄","chapters":1,"group":"小先知書","data":{"id":"obadiah","order":31,"name":"俄巴底亞書","abbr":"俄","chapters":1,"group":"小先知書","oneLine":"以東在兄弟遭難時旁觀，必被拉下","background":{"author":"俄巴底亞（俄 1:1），生平不詳","date":"傳統上認為在耶路撒冷遭難之後不久（約主前 586 年後），也有不同看法","audience":"論以東的默示，也安慰猶大","place":"不確定","why":"以東是以掃的後代，以色列是雅各的後代，兩國是兄弟之邦。耶路撒冷被外邦人攻破時，以東不但站在一旁，還幸災樂禍、搶奪財物、截殺逃難的人。俄巴底亞宣告以東必受審判，錫安必復興。"},"revelations":[{"key":"狂傲必倒","point":"倚仗高處的驕傲，必被拉下","explain":"以東住在山穴高處，心裡說誰能將我拉下地去；神說你雖如大鷹在星宿之間搭窩，我也必把你拉下來。","ref":"俄 1:1–9"},{"key":"兄弟之罪","point":"兄弟遭難時旁觀、歡樂、搶奪，也是罪","explain":"先知連說幾個「你不當」：不當瞪眼看著、不當歡樂、不當搶財物、不當堵住逃難的人。","ref":"俄 1:10–14"},{"key":"照樣報應","point":"你怎樣行，也必照樣向你行","explain":"耶和華降罰的日子臨近萬國，以東的報應必歸到自己頭上。","ref":"俄 1:15–16"},{"key":"國歸耶和華","point":"錫安必有逃脫的人，國度歸耶和華","explain":"全書以復興作結：雅各家必得原有的產業，拯救者上到錫安山審判以掃山。","ref":"俄 1:17–21"}],"outline":[{"key":"以東狂傲","range":"1:1–9","point":"以東自恃高處與智慧，必被拉下、被盟友出賣"},{"key":"袖手旁觀","range":"1:10–14","point":"責備以東在耶路撒冷遭難時的所作所為"},{"key":"降罰之日","range":"1:15–16","point":"耶和華的日子臨近萬國，各人照所行的受報"},{"key":"錫安復興","range":"1:17–21","point":"雅各家得回產業，國度歸耶和華"}],"stories":[{"key":"先知背景","title":"俄巴底亞在什麼時候、對誰說話","ref":"俄 1:1；1:11–14","summary":"書中描寫外邦人進入耶路撒冷城門、為城拈鬮，以東卻像同夥一樣站在旁邊，所以傳統上多認為寫在耶路撒冷遭難之後。這卷書是對以東說的，也是說給受苦的猶大聽的。","people":[]},{"key":"雅各以掃","title":"兄弟之邦的恩怨","ref":"俄 1:10–12；1:18","summary":"先知稱以色列是以東的「兄弟雅各」，把兩國的關係帶回到創世記雅各與以掃這對雙胞胎兄弟。雅各家要像火，以掃家要像碎秸。","people":["jacob","esau"]}],"people":["jacob","esau"],"verses":[{"ref":"俄 1:15","text":"耶和華降罰的日子臨近萬國。你怎樣行，他也必照樣向你行；你的報應必歸到你頭上。"}]}},{"t":"ot","id":"jonah","order":32,"name":"約拿書","abbr":"拿","chapters":4,"group":"小先知書","data":{"id":"jonah","order":32,"name":"約拿書","abbr":"拿","chapters":4,"group":"小先知書","oneLine":"逃跑的先知、悔改的大城，和神的愛惜","background":{"author":"書中沒有寫作者；傳統上認為與約拿本人有關，也有不同看法","date":"故事背景約主前 8 世紀（耶羅波安作以色列王時）；成書年代有不同看法","audience":"以色列百姓","place":"故事發生在約帕、海上與尼尼微（今伊拉克北部）","why":"亞米太的兒子約拿是耶羅波安作以色列王時的先知（王下 14:25）。尼尼微是亞述的大城，亞述後來成了以色列的大敵。神差約拿去向尼尼微宣告審判，他卻往反方向逃。這卷書幾乎全是故事，結尾停在神問約拿的一句話。"},"revelations":[{"key":"逃不開神","point":"人逃避神的差遣，神仍追著他","explain":"約拿往他施逃，神使海上起大風，又安排大魚吞了他，把他帶回原本的路上。","ref":"拿 1:1～2:10"},{"key":"救恩出於神","point":"救恩出於耶和華","explain":"約拿在魚腹中禱告，回想自己被拋進深海，最後說「救恩出於耶和華」。","ref":"拿 2:1–9"},{"key":"大城悔改","point":"連最大的仇城悔改，神也後悔不降災","explain":"尼尼微從最大的到至小的都披麻禁食，神察看他們離開惡道，就不把所說的災禍降與他們。","ref":"拿 3:5–10"},{"key":"神的愛惜","point":"神愛惜不能分辨左右手的人","explain":"約拿為一棵蓖麻發怒，神反問他：這尼尼微大城有十二萬多人和許多牲畜，我豈能不愛惜呢？","ref":"拿 4:1–11"},{"key":"約拿神蹟","point":"耶穌用約拿當作神蹟的記號","explain":"耶穌在太 12:39–41 說，約拿三日三夜在大魚肚腹中，人子也要三日三夜在地裡頭；尼尼微人聽了約拿所傳的就悔改了。","ref":"拿 1:17"}],"outline":[{"key":"逃往他施","range":"1 章","point":"約拿逃避差遣，遇大風被拋進海裡"},{"key":"魚腹禱告","range":"2 章","point":"約拿在大魚腹中三日三夜禱告，被吐在旱地上"},{"key":"尼尼微悔改","range":"3 章","point":"約拿二次奉差，尼尼微全城披麻悔改"},{"key":"蓖麻與蟲","range":"4 章","point":"約拿發怒，神用蓖麻教導他愛惜"}],"stories":[{"key":"先知背景","title":"約拿在什麼時候、對誰說話","ref":"拿 1:1–2；王下 14:25","summary":"約拿是北國以色列的先知，活在耶羅波安作王的時代，曾預言以色列收回疆界。神這次卻差他去外邦的尼尼微大城，向那裡的居民呼喊，因為他們的惡達到神面前。","people":["jonah"]},{"key":"海上大風","title":"逃往他施與海上大風","ref":"拿 1:3–16","summary":"約拿下到約帕，搭船往他施去躲避耶和華。海上狂風大作，水手掣籤掣出約拿，他承認是自己的緣故，請他們把他拋進海裡；海就平靜了，水手大大敬畏耶和華。","people":["jonah"]},{"key":"大魚吞人","title":"大魚腹中三日三夜","ref":"拿 1:17～2:10","summary":"耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜，向神禱告感恩，說他所許的願必償還。耶和華吩咐魚，魚就把約拿吐在旱地上。","people":["jonah"]},{"key":"四十日","title":"再等四十日，尼尼微必傾覆","ref":"拿 3:1–10","summary":"耶和華的話二次臨到約拿，他進城走了一日，宣告再等四十日尼尼微必傾覆。尼尼微王下了寶座、披上麻布坐在灰中，下令人和牲畜都禁食；神見他們離開惡道，就不降災。","people":["jonah"]},{"key":"蓖麻枯乾","title":"約拿與蓖麻","ref":"拿 4:1–11","summary":"約拿大大不悅，說他早知道神有恩典有憐憫，所以才逃。他在城東搭棚觀看，神安排蓖麻替他遮陰，又安排蟲子咬死蓖麻、東風烈日曝曬他。神問他：你愛惜這蓖麻，我豈能不愛惜尼尼微大城？","people":["jonah"]}],"people":["jonah"],"verses":[{"ref":"拿 2:9","text":"但我必用感謝的聲音獻祭與你。我所許的願，我必償還。救恩出於耶和華。"},{"ref":"拿 4:11","text":"何況這尼尼微大城，其中不能分辨左手右手的有十二萬多人，並有許多牲畜，我豈能不愛惜呢？"}]}},{"t":"ot","id":"micah","order":33,"name":"彌迦書","abbr":"彌","chapters":7,"group":"小先知書","data":{"id":"micah","order":33,"name":"彌迦書","abbr":"彌","chapters":7,"group":"小先知書","oneLine":"神所要的只是行公義、好憐憫、與神同行","background":{"author":"摩利沙人彌迦（彌 1:1）","date":"約主前 735～700 年前後（約坦、亞哈斯、希西家在位時）","audience":"撒馬利亞和耶路撒冷，也就是北國以色列與南國猶大","place":"猶大；摩利沙是猶大低地的小城","why":"彌迦和以賽亞大約同時。當時亞述強盛，北國撒馬利亞走向滅亡，南國的首領、祭司和先知卻貪財枉法、欺壓百姓。彌迦宣告審判，也說到末後的日子與從伯利恆出來的掌權者。耶 26:18–19 記載，後來猶大的長老還引用彌迦的話，提到希西家王因此敬畏耶和華。"},"revelations":[{"key":"首領之罪","point":"首領、祭司、先知貪財，城必荒廢","explain":"彌迦說他們為賄賂審判、為雇價施訓誨、為銀錢行占卜，錫安必被耕種像一塊田。","ref":"彌 3:1–12"},{"key":"刀打成犁頭","point":"末後的日子，萬民要學神的道","explain":"耶和華殿的山必高舉，萬民流歸，他們要將刀打成犁頭，不再學習戰事。同樣的話也見於賽 2:2–4。","ref":"彌 4:1–5"},{"key":"伯利恆","point":"掌權的要從小小的伯利恆出來","explain":"彌迦說伯利恆以法他在猶大諸城中為小，將來必有一位從那裡出來作掌權的。新約在太 2:5–6 記載祭司長和文士引用這節。","ref":"彌 5:2–5"},{"key":"行公義","point":"神要的是行公義、好憐憫、存謙卑","explain":"百姓問該獻什麼才能討神喜悅，千千的公羊或長子嗎？先知回答：只要行公義、好憐憫，存謙卑的心與神同行。","ref":"彌 6:6–8"},{"key":"赦罪之神","point":"有何神像你，赦免罪孽","explain":"全書以讚美作結：神不永遠懷怒、喜愛施恩，要將百姓的一切罪投於深海。","ref":"彌 7:18–20"}],"outline":[{"key":"審判兩京","range":"1～2 章","point":"撒馬利亞與耶路撒冷的罪，貪圖田地房屋的人必受報"},{"key":"責備首領","range":"3 章","point":"首領、祭司、假先知敗壞，錫安必被耕種"},{"key":"末後盼望","range":"4～5 章","point":"萬民流歸錫安，掌權者從伯利恆出來"},{"key":"神的爭辯","range":"6 章","point":"神與百姓爭辯，指示何為善"},{"key":"哀嘆仰望","range":"7 章","point":"先知哀嘆社會敗壞，仍仰望施恩赦罪的神"}],"stories":[{"key":"先知背景","title":"彌迦在什麼時候、對誰說話","ref":"彌 1:1；耶 26:18–19","summary":"彌迦是猶大低地摩利沙的人，在約坦、亞哈斯、希西家作猶大王時，論撒馬利亞和耶路撒冷說話。後來耶利米受審時，長老們引用彌迦說的「錫安必被耕種像一塊田」，說希西家王聽了就敬畏耶和華。","people":["micah","hezekiah"]},{"key":"伯利恆預言","title":"伯利恆以法他啊","ref":"彌 5:2–5；太 2:1–6","summary":"彌迦預言一位掌權者要從伯利恆出來，他的根源從亙古就有，要牧養百姓、作他們的平安。新約記載東方博士來尋找猶太人之王時，祭司長和文士就引這段回答希律王。","people":["micah"]},{"key":"神的控訴","title":"耶和華與百姓爭辯","ref":"彌 6:1–8","summary":"神請山嶺作見證，問他的百姓：我向你做了什麼，使你厭煩？他提醒他們出埃及、摩西亞倫米利暗、巴勒與巴蘭的事，最後指示他們何為善。","people":["micah","moses","aaron","miriam","balaam"]}],"people":["micah","hezekiah"],"verses":[{"ref":"彌 5:2","text":"伯利恆的以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古，從太初就有。"},{"ref":"彌 6:8","text":"世人哪，耶和華已指示你何為善。他向你所要的是甚麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。"}]}},{"t":"ot","id":"nahum","order":34,"name":"那鴻書","abbr":"鴻","chapters":3,"group":"小先知書","data":{"id":"nahum","order":34,"name":"那鴻書","abbr":"鴻","chapters":3,"group":"小先知書","oneLine":"壓迫列國的尼尼微必傾覆，猶大得安慰","background":{"author":"伊勒歌斯人那鴻（鴻 1:1），生平不詳","date":"約主前 663～612 年之間","audience":"論尼尼微的默示，也安慰受亞述欺壓的猶大","place":"不確定","why":"亞述長期欺壓列國，北國以色列就是亡於亞述。書中提到挪亞們（埃及大城）已經陷落（鴻 3:8–10），尼尼微的傾覆卻還在將來，所以一般認為寫在這兩件事之間。約拿書裡尼尼微曾經悔改，到了那鴻的時代，先知宣告這城的結局。"},"revelations":[{"key":"忌邪施報","point":"耶和華不輕易發怒，卻萬不以有罪的為無罪","explain":"那鴻一開頭描寫耶和華的威嚴：他乘旋風暴風而來，山嶺震動，誰能在他忿恨之下站立得住。","ref":"鴻 1:2–6"},{"key":"患難保障","point":"耶和華本為善，在患難的日子為人的保障","explain":"在嚴厲的審判之間，先知說神認得那些投靠他的人。","ref":"鴻 1:7–8"},{"key":"報好信","point":"傳平安的腳登山，猶大可以守節","explain":"神應許折斷壓在猶大身上的軛，那惡人不再從他們中間經過。","ref":"鴻 1:12–15"},{"key":"流血之城","point":"強暴詭詐的城，必受自己行為的報應","explain":"先知稱尼尼微為「流人血的城」，說凡聽見她消息的都要拍掌。","ref":"鴻 3:1–19"}],"outline":[{"key":"神的威嚴","range":"1:1–8","point":"耶和華施報的大能與對投靠者的保護"},{"key":"折斷重軛","range":"1:9–15","point":"宣告尼尼微的結局，應許猶大脫離亞述的軛"},{"key":"城被攻破","range":"2 章","point":"攻城的戰車、開了的河閘、被擄掠的大城"},{"key":"禍哉此城","range":"3 章","point":"流人血的城必荒涼，傷痕無法醫治"}],"stories":[{"key":"先知背景","title":"那鴻在什麼時候、對誰說話","ref":"鴻 1:1；3:8–10","summary":"那鴻是伊勒歌斯人，他的默示是論亞述的首都尼尼微。他提到埃及的挪亞們雖有江河環繞仍被攻破，用這件事警告尼尼微也逃不掉。","people":[]},{"key":"攻陷尼尼微","title":"大城被攻破的景象","ref":"鴻 2:1–13","summary":"那鴻用畫面寫攻城：紅色的盾牌、閃亮的戰車、街上急行的車輛，河閘開了，宮殿沖沒，金銀被搶。從前像獅子撕裂獵物的亞述，如今獅子洞在哪裡呢？","people":[]}],"people":[],"verses":[{"ref":"鴻 1:7","text":"耶和華本為善，在患難的日子為人的保障，並且認得那些投靠他的人。"}]}},{"t":"ot","id":"habakkuk","order":35,"name":"哈巴谷書","abbr":"哈","chapters":3,"group":"小先知書","data":{"id":"habakkuk","order":35,"name":"哈巴谷書","abbr":"哈","chapters":3,"group":"小先知書","oneLine":"先知向神發問，最後學會「雖然…然而」的信靠","background":{"author":"先知哈巴谷（哈 1:1），生平不詳","date":"約主前 7 世紀末（迦勒底人興起的時候）","audience":"猶大百姓；全書大多是先知與神之間的對話","place":"猶大","why":"當時猶大國內強暴不義、律法放鬆，迦勒底人（巴比倫）正在興起。哈巴谷不是直接對百姓宣講，而是向神提問：為什麼惡人不受罰？為什麼要用更惡的迦勒底人來管教猶大？這卷書記下神的回答和先知最後的禱告。"},"revelations":[{"key":"要到幾時","point":"先知可以把疑問直接帶到神面前","explain":"哈巴谷問：我呼求你，你不應允，要到幾時呢？你為何看著奸惡而不理？","ref":"哈 1:2–4"},{"key":"迦勒底興起","point":"神說他要興起迦勒底人","explain":"神回答說他要做一件人告訴你們也不信的事，就是興起殘忍暴躁的迦勒底人。新約在徒 13:41 由保羅引用「你們總是不信」這段。","ref":"哈 1:5–11"},{"key":"義人因信","point":"惟義人因信得生","explain":"神叫先知把默示明明寫在版上，雖然遲延還要等候。新約在羅 1:17、加 3:11、來 10:38 都引用 2:4 這句話。","ref":"哈 2:1–4"},{"key":"五個禍哉","point":"強取、貪利、流血、使人醉、拜偶像，必受報","explain":"神對迦勒底人連說五個「禍哉」，說明壓迫人的終必被審判；認識耶和華榮耀的知識要充滿遍地。","ref":"哈 2:6–20"},{"key":"雖然然而","point":"即使一無所有，仍因神喜樂","explain":"先知在禱告最後說：雖然無花果樹不發旺、圈中絕了羊，然而我要因耶和華歡欣。","ref":"哈 3:17–19"}],"outline":[{"key":"第一問答","range":"1:1–11","point":"先知問惡人為何不受罰，神說要興起迦勒底人"},{"key":"第二問","range":"1:12～2:1","point":"先知再問：為何用更惡的人吞滅比自己公義的"},{"key":"神的回答","range":"2:2–20","point":"要等候默示，義人因信得生，迦勒底人必受五禍"},{"key":"禱告詩","range":"3 章","point":"先知回想神的作為，以信靠的詩歌作結"}],"stories":[{"key":"先知背景","title":"哈巴谷在什麼時候、對誰說話","ref":"哈 1:1–6","summary":"哈巴谷看見猶大的強暴與不公，又看見迦勒底人勢力日漸強大。他把自己的困惑一題一題問神，這卷書就是這場對話的紀錄。","people":[]},{"key":"守望樓","title":"站在守望所等候回答","ref":"哈 2:1–4","summary":"哈巴谷說他要站在守望所、立在望樓上，看耶和華要對他說什麼。神叫他把默示寫在版上，使讀的人容易讀，並說這默示有一定的日期，雖然遲延，還要等候。","people":[]},{"key":"流離歌","title":"先知哈巴谷的禱告","ref":"哈 3:1–19","summary":"這是一首「調用流離歌」的禱告詩。先知求神在發怒的時候以憐憫為念，回想神從提幔、巴蘭山而來的威榮，最後說主耶和華是他的力量，使他穩行在高處。","people":[]}],"people":[],"verses":[{"ref":"哈 2:4","text":"迦勒底人自高自大，心不正直；惟義人因信得生。"},{"ref":"哈 3:17–18","text":"雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛；然而，我要因耶和華歡欣，因救我的神喜樂。"}]}},{"t":"ot","id":"zephaniah","order":36,"name":"西番雅書","abbr":"番","chapters":3,"group":"小先知書","data":{"id":"zephaniah","order":36,"name":"西番雅書","abbr":"番","chapters":3,"group":"小先知書","oneLine":"耶和華的大日臨近，之後神要在百姓中歡呼","background":{"author":"古示的兒子西番雅，家譜追到希西家（番 1:1）","date":"約主前 640～609 年之間（約西亞作猶大王時）","audience":"猶大與耶路撒冷，也論到周圍列國","place":"猶大，可能在耶路撒冷","why":"約西亞作王之前，猶大經過瑪拿西、亞們長期拜偶像。西番雅責備百姓拜巴力、在房頂上拜天上的萬象、又指著瑪勒堪起誓（番 1:4–5），這些正是列王紀記載約西亞改革時要除掉的事（王下 23:4–14）。"},"revelations":[{"key":"耶和華大日","point":"耶和華的大日臨近，是忿怒的日子","explain":"先知說那日是急難困苦、黑暗幽冥的日子，金銀也不能救人。","ref":"番 1:14–18"},{"key":"尋求謙卑","point":"要尋求耶和華、尋求公義謙卑","explain":"先知勸世上遵守耶和華典章的謙卑人，在那日來到以前尋求他，或者可以隱藏起來。","ref":"番 2:1–3"},{"key":"列國受審","point":"審判不只臨到猶大，也臨到列國","explain":"先知一一論到非利士、摩押、亞捫、古實和亞述，連尼尼微都要荒涼。","ref":"番 2:4–15"},{"key":"清潔言語","point":"神要使萬民用清潔的言語求告他","explain":"審判之後，神要留下困苦貧寒的餘民，他們不行罪孽、不說謊言。","ref":"番 3:9–13"},{"key":"因你歡呼","point":"神在你中間，必因你歡欣喜樂","explain":"全書最後一轉，先知呼喚錫安歌唱，說耶和華在他們中間，必默然愛他們，且因他們喜樂而歡呼。","ref":"番 3:14–20"}],"outline":[{"key":"審判猶大","range":"1 章","point":"責備拜偶像與不尋求神的人，耶和華的大日臨近"},{"key":"勸人尋求","range":"2:1–3","point":"在那日以前尋求耶和華、尋求公義謙卑"},{"key":"審判列國","range":"2:4–15","point":"論非利士、摩押、亞捫、古實、亞述"},{"key":"責備京城","range":"3:1–8","point":"耶路撒冷的首領、先知、祭司都不聽從"},{"key":"餘民復興","range":"3:9–20","point":"神要聚集被擄的人，在他們中間歡呼"}],"stories":[{"key":"先知背景","title":"西番雅在什麼時候、對誰說話","ref":"番 1:1–6；王下 22～23","summary":"西番雅在約西亞作猶大王的時候說話，家譜追溯四代到希西家。他責備的拜巴力、拜天上萬象，可對照列王紀記載約西亞後來的改革。","people":["josiah"]},{"key":"那日風聲","title":"耶和華的大日臨近","ref":"番 1:14–18","summary":"先知說耶和華的大日臨近而且甚快，那日勇士也要痛哭，人要行走如同瞎子；他們的金銀在那日不能救他們。","people":[]},{"key":"錫安歌唱","title":"神必因你喜樂而歡呼","ref":"番 3:14–20","summary":"先知呼喚錫安的民歌唱、以色列歡呼，因為耶和華已除去他們的刑罰。神應許聚集被擄的人，使他們在地上的萬民中有名聲、得稱讚。","people":[]}],"people":["josiah"],"verses":[{"ref":"番 3:17","text":"耶和華─你的神是施行拯救、大有能力的主。他在你中間必因你歡欣喜樂，默然愛你，且因你喜樂而歡呼。"}]}},{"t":"ot","id":"haggai","order":37,"name":"哈該書","abbr":"該","chapters":2,"group":"小先知書","data":{"id":"haggai","order":37,"name":"哈該書","abbr":"該","chapters":2,"group":"小先知書","oneLine":"歸回的百姓先顧自己的房屋，先知催他們重建聖殿","background":{"author":"先知哈該（該 1:1）","date":"約主前 520 年（大利烏王第二年，該 1:1）","audience":"猶大省長所羅巴伯、大祭司約書亞和剩下的百姓","place":"耶路撒冷","why":"被擄的猶太人奉古列的詔書歸回後，開始重建聖殿，卻因敵人攔阻而停工（拉 4:24）。多年過去，百姓說建殿的時候尚未來到，自己卻住天花板的房屋。哈該和撒迦利亞起來說話，百姓就重新動工（拉 5:1–2），聖殿在大利烏王第六年完工（拉 6:14–15）。"},"revelations":[{"key":"省察行為","point":"你們要省察自己的行為","explain":"哈該指出百姓撒的種多、收的卻少，賺的錢像裝在破漏的囊中，因為神的殿荒涼，各人卻顧自己的房屋。","ref":"該 1:2–11"},{"key":"與你同在","point":"神說：我與你們同在","explain":"百姓聽從之後，哈該傳神的話說「我與你們同在」，並激動省長、大祭司和百姓的心去作工。","ref":"該 1:12–15；2:4–5"},{"key":"後來榮耀","point":"這殿後來的榮耀必大過先前的榮耀","explain":"見過舊殿的老人覺得新殿如同無有，神卻說他要震動天地萬國，使這殿滿了榮耀。新約在來 12:26 引用「再一次」震動天地的應許。","ref":"該 2:3–9"},{"key":"揀選為印","point":"神揀選所羅巴伯，要以他為印","explain":"最後一篇信息單獨對所羅巴伯說：神要傾覆列國的寶座，到那日以他為印。","ref":"該 2:20–23"}],"outline":[{"key":"第一篇","range":"1:1–11","point":"六月初一：殿仍荒涼，要省察自己的行為"},{"key":"百姓動工","range":"1:12–15","point":"六月二十四日：領袖和百姓聽從，開始作工"},{"key":"第二篇","range":"2:1–9","point":"七月二十一日：要剛強作工，後來的榮耀更大"},{"key":"第三篇","range":"2:10–19","point":"九月二十四日：用潔淨的比喻提醒，從今日起賜福"},{"key":"第四篇","range":"2:20–23","point":"同一日：對所羅巴伯的應許"}],"stories":[{"key":"先知背景","title":"哈該在什麼時候、對誰說話","ref":"該 1:1；拉 4:24～5:2","summary":"大利烏王第二年六月初一，耶和華的話藉哈該臨到省長所羅巴伯和大祭司約書亞。當時重建聖殿的工程已停了一段時間，哈該的四篇信息都標了日期，前後不到四個月。","people":["haggai-zechariah","zerubbabel"]},{"key":"重新動工","title":"百姓聽從，重新建殿","ref":"該 1:12–15","summary":"所羅巴伯、大祭司約書亞和剩下的百姓都聽從耶和華的話，在神面前存敬畏的心。耶和華激動他們的心，他們就在六月二十四日來為神的殿作工。","people":["zerubbabel"]},{"key":"殿的榮耀","title":"見過舊殿的人怎麼看新殿","ref":"該 2:1–9","summary":"哈該問：你們中間有誰見過這殿從前的榮耀呢？現在看來豈不如無有嗎？神卻要他們剛強作工，說銀子金子都是他的，這殿後來的榮耀必大過先前的榮耀。","people":["zerubbabel"]}],"people":["haggai-zechariah","zerubbabel"],"verses":[{"ref":"該 1:5","text":"現在萬軍之耶和華如此說：你們要省察自己的行為。"},{"ref":"該 2:9","text":"這殿後來的榮耀必大過先前的榮耀；在這地方我必賜平安。這是萬軍之耶和華說的。"}]}},{"t":"ot","id":"zechariah","order":38,"name":"撒迦利亞書","abbr":"亞","chapters":14,"group":"小先知書","data":{"id":"zechariah","order":38,"name":"撒迦利亞書","abbr":"亞","chapters":14,"group":"小先知書","oneLine":"八個夜間異象鼓勵建殿，並說到謙和騎驢的王","background":{"author":"易多的孫子、比利家的兒子撒迦利亞（亞 1:1）；9～14 章的成書有不同看法","date":"約主前 520～518 年起（大利烏王第二年至第四年，亞 1:1；7:1）","audience":"被擄歸回、在耶路撒冷重建聖殿的百姓與領袖","place":"耶路撒冷","why":"撒迦利亞與哈該同時，一起催促百姓重建聖殿（拉 5:1；6:14）。哈該講得直接，撒迦利亞多用異象：前半卷鼓勵省長所羅巴伯和大祭司約書亞，後半卷兩篇「默示」說到將來的王、牧人和「那日」。"},"revelations":[{"key":"轉向我","point":"你們要轉向我，我就轉向你們","explain":"撒迦利亞一開頭提醒百姓，不要效法列祖不聽先知的話。","ref":"亞 1:1–6"},{"key":"倚靠我的靈","point":"不是倚靠勢力才能，乃是倚靠神的靈","explain":"在金燈臺的異象中，神對所羅巴伯說，建殿不是靠勢力、不是靠才能，乃是倚靠我的靈方能成事。","ref":"亞 4:1–7"},{"key":"莫藐視小事","point":"誰藐視這日的事為小呢","explain":"所羅巴伯的手立了殿的根基，也必完成；看見他手拿線鉈，神就歡喜。","ref":"亞 4:8–10"},{"key":"謙和的王","point":"你的王謙謙和和地騎著驢來","explain":"先知呼喚錫安歡呼，說公義、施行拯救的王騎著驢駒來到。新約在太 21:5、約 12:15 記載耶穌騎驢進耶路撒冷時引用這節。","ref":"亞 9:9–10"},{"key":"仰望被扎者","point":"他們必仰望那被扎的，並為他悲哀","explain":"神要將施恩叫人懇求的靈澆灌大衛家。新約在約 19:37 引用「他們要仰望自己所扎的人」。","ref":"亞 12:10–14"},{"key":"擊打牧人","point":"擊打牧人，羊就分散","explain":"新約在太 26:31、可 14:27 記載耶穌被捉拿前引用這句。","ref":"亞 13:7–9"},{"key":"耶和華作王","point":"那日耶和華必作全地的王","explain":"全書以「那日」作結：耶和華的腳站在橄欖山上，他的名獨一無二。","ref":"亞 14:1–21"}],"outline":[{"key":"呼召回轉","range":"1:1–6","point":"要轉向神，不要像列祖不聽"},{"key":"八個異象","range":"1:7～6:8","point":"一夜之間看見八個異象，說到神眷顧耶路撒冷"},{"key":"加冕約書亞","range":"6:9–15","point":"為大祭司約書亞戴冠冕，說到名稱為苗裔的要建殿"},{"key":"禁食之問","range":"7～8 章","point":"從禁食的問題講到誠實、公平，禁食變為節期"},{"key":"第一默示","range":"9～11 章","point":"謙和的王、先知牧養群羊與三十塊錢的工價"},{"key":"第二默示","range":"12～14 章","point":"那日：耶路撒冷蒙保守，耶和華作全地的王"}],"stories":[{"key":"先知背景","title":"撒迦利亞在什麼時候、對誰說話","ref":"亞 1:1；拉 5:1–2","summary":"大利烏王第二年八月，就是哈該開始說話後兩個月，耶和華的話臨到撒迦利亞。他向歸回建殿的百姓說話，鼓勵省長所羅巴伯和大祭司約書亞把殿建成。","people":["haggai-zechariah","zerubbabel"]},{"key":"夜間異象","title":"一夜看見的八個異象","ref":"亞 1:7～6:8","summary":"撒迦利亞在夜間依次看見：番石榴樹中騎紅馬的人、四角與四個匠人、手拿準繩量耶路撒冷的人、大祭司約書亞、金燈臺與兩棵橄欖樹、飛行的書卷、量器中的婦人、從兩座銅山出來的四輛車。每個異象都有天使向他解說。","people":[]},{"key":"換上華衣","title":"大祭司約書亞脫去污穢的衣服","ref":"亞 3:1–10","summary":"撒迦利亞看見大祭司約書亞穿著污穢的衣服站在耶和華的使者面前，撒但站在右邊與他作對。耶和華責備撒但，說這不是從火中抽出來的一根柴嗎？使者叫人脫去約書亞的污穢衣服，給他穿上華美的衣服、戴上潔淨的冠冕。","people":[]},{"key":"禁食變節期","title":"還要在五月哭泣齋戒嗎","ref":"亞 7:1～8:23","summary":"伯特利人派人來問：被擄以來每年五月哭泣齋戒，現在還要這樣嗎？神反問這七十年的禁食豈是為他，又說要按至理判斷、以慈愛憐憫待人。最後應許老人坐在街上、孩童在街上玩耍，禁食的日子要變成歡喜快樂的節期。","people":[]}],"people":["haggai-zechariah","zerubbabel"],"verses":[{"ref":"亞 4:6","text":"他對我說：這是耶和華指示所羅巴伯的。萬軍之耶和華說：不是倚靠勢力，不是倚靠才能，乃是倚靠我的靈方能成事。"},{"ref":"亞 9:9","text":"錫安的民哪，應當大大喜樂；耶路撒冷的民哪，應當歡呼。看哪，你的王來到你這裡！他是公義的，並且施行拯救，謙謙和和地騎著驢，就是騎著驢的駒子。"}]}},{"t":"ot","id":"malachi","order":39,"name":"瑪拉基書","abbr":"瑪","chapters":4,"group":"小先知書","data":{"id":"malachi","order":39,"name":"瑪拉基書","abbr":"瑪","chapters":4,"group":"小先知書","oneLine":"舊約最後一卷：神說「我曾愛你們」，百姓卻問「在何事上」","background":{"author":"瑪拉基（瑪 1:1），名字有「我的使者」的意思","date":"約主前 5 世紀中葉；傳統上認為與尼希米的時代相近，也有不同看法","audience":"歸回後的以色列百姓與祭司","place":"耶路撒冷一帶","why":"聖殿已經重建，獻祭也恢復了，但百姓的熱心冷淡下來：祭司把瞎眼瘸腿的牲畜獻上，百姓不納十分之一，有人以詭詐待幼年所娶的妻。瑪拉基用一問一答的方式，把百姓心裡的話「你們卻說…」一句句攤開來回應。"},"revelations":[{"key":"我曾愛你們","point":"神先說：我曾愛你們","explain":"百姓反問在何事上愛我們，神用雅各與以掃作答。新約在羅 9:13 引用「雅各是我所愛的；以掃是我所惡的」。","ref":"瑪 1:2–5"},{"key":"獻上好的","point":"把殘缺的獻給神，就是藐視神的名","explain":"神說你們把瞎眼的、瘸腿的獻上，獻給省長，他豈喜悅你呢？","ref":"瑪 1:6–14"},{"key":"謹守婚約","point":"不可以詭詐待幼年所娶的妻","explain":"神說他在你和你幼年所娶的妻中間作見證，休妻的事和以強暴待妻的人都是他所恨惡的。","ref":"瑪 2:13–16"},{"key":"差遣使者","point":"神要差遣使者在前面預備道路","explain":"新約在太 11:10、可 1:2 把這節用在施洗約翰身上。","ref":"瑪 3:1–6"},{"key":"十分之一","point":"要將十分之一送入倉庫，以此試試神","explain":"神說百姓在十分之一和供物上奪取神之物，要他們轉向他，看他是否敞開天上的窗戶。","ref":"瑪 3:7–12"},{"key":"以利亞再來","point":"大日以前，神要差遣以利亞","explain":"舊約最後的話：以利亞要使父親的心轉向兒女。新約在路 1:17 說施洗約翰有以利亞的心志能力，太 11:14 記載耶穌說他就是那應當來的以利亞。","ref":"瑪 4:4–6"}],"outline":[{"key":"神愛雅各","range":"1:1–5","point":"神說我曾愛你們，以雅各和以掃為證"},{"key":"責備祭司","range":"1:6～2:9","point":"祭司獻上有殘疾的祭物，偏離立約的本分"},{"key":"背約休妻","range":"2:10–16","point":"以詭詐待弟兄和幼年所娶的妻"},{"key":"立約使者","range":"2:17～3:6","point":"神要差遣使者，煉淨利未人"},{"key":"奪取供物","range":"3:7–12","point":"轉向神，將十分之一送入倉庫"},{"key":"記念冊","range":"3:13～4:6","point":"敬畏神的人被記念，大日以前以利亞要來"}],"stories":[{"key":"先知背景","title":"瑪拉基在什麼時候、對誰說話","ref":"瑪 1:1；1:6–8","summary":"瑪拉基對歸回後的以色列說話，那時有省長管理，聖殿已有祭壇和獻祭。書中責備的獻殘缺祭物、不納十分之一、與外邦女子通婚等問題，傳統上認為和尼希米書的情形相近。","people":[]},{"key":"你們卻說","title":"一問一答的對話","ref":"瑪 1:2；1:6；2:17；3:7–8；3:13","summary":"全書反覆出現同一個格式：神說一句話，百姓回一句「我們在何事上…呢？」——在何事上愛我們、藐視你的名、奪取你的供物、用話頂撞你。神再一一回答。","people":[]},{"key":"彼此談論","title":"敬畏耶和華的人彼此談論","ref":"瑪 3:13～4:3","summary":"有人說事奉神是徒然的，狂傲的人反而有福。那時敬畏耶和華的人彼此談論，耶和華側耳而聽，有記念冊在他面前，記錄敬畏他的人；神說到了他所定的日子，他們必特特歸他。","people":[]},{"key":"差遣以利亞","title":"舊約最後的應許","ref":"瑪 4:4–6","summary":"瑪拉基最後要百姓記念摩西在何烈山所吩咐的律法，並說在耶和華大而可畏之日未到以前，神必差遣先知以利亞。這是舊約正典照和合本順序的最後一段話。","people":["moses","elijah"]}],"people":["jacob","esau","moses","elijah"],"verses":[{"ref":"瑪 3:10","text":"萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。"},{"ref":"瑪 4:2","text":"但向你們敬畏我名的人必有公義的日頭出現，其光線有醫治之能。你們必出來跳躍如圈裡的肥犢。"},{"ref":"瑪 4:5–6","text":"看哪，耶和華大而可畏之日未到以前，我必差遣先知以利亞到你們那裡去。他必使父親的心轉向兒女，兒女的心轉向父親，免得我來咒詛遍地。"}]}},{"t":"nt","id":"matthew","order":1,"name":"馬太福音","abbr":"太","chapters":28,"group":"福音書","data":{"id":"matthew","order":1,"name":"馬太福音","abbr":"太","chapters":28,"group":"福音書","oneLine":"寫給熟悉舊約的人：耶穌就是應許中的君王","background":{"author":"傳統上認為是稅吏出身的使徒馬太，也有不同看法","date":"約主後 60～85 年，學界看法不一","audience":"熟悉舊約與猶太傳統的信徒（以猶太基督徒為主）","place":"不確定，可能在敘利亞的安提阿","why":"第一世紀的猶太信徒夾在會堂與日漸增多的外邦信徒之間，需要說明耶穌怎樣應驗舊約、天國是什麼、跟從他的人該怎樣生活。許多學者認為這卷書寫成的時間在耶路撒冷聖殿被毀（約主後 70 年）前後。"},"revelations":[{"key":"應驗舊約","point":"耶穌應驗了舊約先知的話","explain":"馬太一再寫「這是要應驗主藉先知所說的話」，把耶穌的出生、事工到受難都接回舊約，讓熟悉舊約的讀者看見前後是同一個故事。","ref":"太 1:22–23"},{"key":"大衛子孫","point":"耶穌是亞伯拉罕與大衛的後裔、應許的王","explain":"全書第一句就是家譜，從亞伯拉罕排到大衛再到耶穌；博士來找「猶太人之王」，進耶路撒冷時群眾喊「大衛的子孫」。","ref":"太 1:1–17"},{"key":"天國近了","point":"「天國」是這卷書的主題","explain":"馬太多用「天國」一詞（其他福音書多寫「神的國」），許多比喻用「天國好像…」開頭，講天國的樣子和誰能進天國。","ref":"太 4:17"},{"key":"五段講論","point":"耶穌的教導整理成五大段講論","explain":"登山寶訓（5～7 章）、差派門徒（10 章）、天國比喻（13 章）、群體生活（18 章）、末日講論（24～25 章），每段結尾都有類似「耶穌說完了這些話」的句子。","ref":"太 7:28；26:1"},{"key":"成全律法","point":"耶穌來是要成全律法，不是廢掉","explain":"登山寶訓裡一連串「你們聽見有話說…只是我告訴你們」，把律法從外在行為帶到內心動機，和法利賽人重外表的守法形成對比。","ref":"太 5:17–48"},{"key":"福音萬民","point":"從以色列出發，最後差門徒到萬民","explain":"開頭有外邦博士來拜，中間有百夫長與迦南婦人的信心，結尾是「使萬民作我的門徒」的大使命。","ref":"太 28:18–20"},{"key":"以馬內利","point":"從「神與我們同在」開始，到「常與你們同在」結束","explain":"1:23 說耶穌的名要稱為以馬內利，意思是「神與我們同在」；全書最後一句是「我就常與你們同在，直到世界的末了」，首尾呼應。","ref":"太 1:23；28:20"}],"outline":[{"key":"降生預備","range":"1～4 章","point":"家譜、降生、博士來拜、逃往埃及，施洗約翰預備道路，耶穌受洗、受試探，開始在加利利傳道。"},{"key":"山上教導","range":"5～7 章","point":"登山寶訓：八福、鹽和光、主禱文、不要憂慮，最後以蓋在磐石上的房子收尾。"},{"key":"神蹟差派","range":"8～10 章","point":"耶穌醫病、趕鬼、平靜風浪，呼召馬太，接著揀選並差派十二使徒。"},{"key":"比喻衝突","range":"11～13 章","point":"反對的聲音增加，安息日之爭升高，耶穌改用比喻講天國。"},{"key":"認出基督","range":"14～18 章","point":"五餅二魚、海面行走、彼得認耶穌是基督，耶穌開始預言受難，並教導門徒彼此饒恕。"},{"key":"往耶路撒冷","range":"19～25 章","point":"往耶路撒冷的路上教導，騎驢進城、潔淨聖殿，與宗教領袖辯論，在橄欖山講末日與警醒。"},{"key":"受難復活","range":"26～28 章","point":"最後晚餐、被捕受審、釘十字架、埋葬，第三天復活，在加利利山上差派門徒。"}],"stories":[{"key":"博士來拜","title":"東方博士來拜與逃往埃及","ref":"太 2:1–23","summary":"有幾個博士從東方看見星，到伯利恆俯伏拜小孩子，獻上黃金、乳香、沒藥。大希律想除掉這孩子，約瑟在夢中被指示帶母子逃往埃及，希律死後才回來，住在拿撒勒。","people":["jesus","joseph","herod-great"]},{"key":"耶穌受洗","title":"耶穌在約旦河受洗","ref":"太 3:13–17","summary":"耶穌到約旦河請約翰施洗，約翰原本推辭。耶穌受洗後，天開了，神的靈彷彿鴿子降下，天上有聲音說「這是我的愛子，我所喜悅的」。","people":["jesus","john-baptist"]},{"key":"曠野試探","title":"曠野受試探","ref":"太 4:1–11","summary":"耶穌禁食四十晝夜後，魔鬼三次試探他：叫石頭變餅、從殿頂跳下、拜魔鬼就得萬國。耶穌三次都引舊約經文回答，魔鬼就離開了。","people":["jesus"]},{"key":"呼召漁夫","title":"呼召四個漁夫","ref":"太 4:18–22","summary":"耶穌在加利利海邊對打魚的彼得和安得烈說「來跟從我，我要叫你們得人如得魚一樣」。接著呼召雅各、約翰兩兄弟，彼得、安得烈立刻捨了網，雅各、約翰立刻捨了船、別了父親，都跟從了耶穌。","people":["jesus","peter","andrew","james-zebedee","john"]},{"key":"登山寶訓","title":"登山寶訓","ref":"太 5～7","summary":"耶穌在山上教導門徒：八福、作鹽作光、愛仇敵、主禱文、不要為明天憂慮。最後用兩個人蓋房子作結：聽了又去行的，像把房子蓋在磐石上。","people":["jesus"]},{"key":"呼召馬太","title":"稅吏馬太跟從耶穌","ref":"太 9:9–13","summary":"耶穌看見馬太坐在稅關上，說「你跟從我來」，他就起來跟從。耶穌在屋裡坐席，有好些稅吏和罪人來同席，對質疑的法利賽人說「我來本不是召義人，乃是召罪人」。","people":["jesus","matthew"],"note":"馬可福音 2:15 寫的是「耶穌在利未家裡坐席」，路加福音 5:29 寫的是「利未在自己家裡為耶穌大擺筵席」。"},{"key":"撒種比喻","title":"撒種的比喻","ref":"太 13:1–23","summary":"撒種的人撒下種子，落在路旁、石頭地、荊棘裡和好土裡，結果各不相同。耶穌解釋：種子是天國的道，四種土是四種聽道的人。","people":["jesus"]},{"key":"五餅二魚","title":"五餅二魚餵飽五千人","ref":"太 14:13–21","summary":"天晚了，群眾在野地裡沒有吃的，門徒只找到五個餅、兩條魚。耶穌望著天祝福，擘開餅遞給門徒，門徒再遞給眾人，都吃飽了，還收拾了十二籃子零碎；吃的人除了婦女孩子約有五千。","people":["jesus"]},{"key":"海面行走","title":"耶穌和彼得在海面上走","ref":"太 14:22–33","summary":"夜裡門徒的船被風浪搖撼，耶穌在海面上走過來。彼得也下船走向耶穌，但一看見風大就害怕下沉，耶穌伸手拉住他，說「你這小信的人哪，為甚麼疑惑呢？」","people":["jesus","peter"]},{"key":"迦南婦人","title":"迦南婦人的信心","ref":"太 15:21–28","summary":"一個外邦的迦南婦人一再求耶穌醫治被鬼附的女兒。耶穌起初沒有答應，她說「狗也吃牠主人桌子上掉下來的碎渣兒」，耶穌稱讚她的信心大，她的女兒當時就好了。","people":["jesus"]},{"key":"彼得認信","title":"彼得認耶穌是基督","ref":"太 16:13–20","summary":"在該撒利亞腓立比，耶穌問門徒「你們說我是誰？」彼得回答「你是基督，是永生神的兒子」。耶穌說要把教會建造在這磐石上，從此開始預言自己要受難。","people":["jesus","peter"]},{"key":"登山變像","title":"登山變像","ref":"太 17:1–8","summary":"耶穌帶彼得、雅各、約翰上高山，在他們面前變了形像，臉面明亮如日頭，摩西和以利亞也顯現。雲彩中有聲音說「這是我的愛子，我所喜悅的。你們要聽他！」","people":["jesus","peter","james-zebedee","john"]},{"key":"饒恕比喻","title":"饒恕七十個七次","ref":"太 18:21–35","summary":"彼得問饒恕弟兄到七次可以嗎，耶穌說要到七十個七次。接著講比喻：被主人免了一千萬銀子的僕人，卻掐住欠他十兩銀子的同伴，結果被主人追究。只有馬太記載。","people":["jesus","peter"]},{"key":"葡萄園工人","title":"葡萄園工人的比喻","ref":"太 20:1–16","summary":"園主一天幾次出去僱工人，最後一批只做了一小時，發工錢時每人都拿一錢銀子。先來的人不服，園主說我照約定給你，也願意給後來的一樣；結論是「那在後的，將要在前」。只有馬太記載。","people":["jesus"]},{"key":"騎驢進城","title":"騎驢進耶路撒冷與潔淨聖殿","ref":"太 21:1–17","summary":"耶穌騎驢進耶路撒冷，眾人把衣服和樹枝鋪在路上，喊「和散那歸於大衛的子孫」。他進聖殿推倒兌換銀錢的桌子，說「我的殿必稱為禱告的殿」。","people":["jesus"]},{"key":"十童女才幹","title":"十童女與按才幹受託的比喻","ref":"太 25:1–30","summary":"十個童女等新郎，聰明的帶足了油，愚拙的沒有，新郎來時門就關了。接著主人把五千、二千、一千銀子交給三個僕人，前兩個去做生意，第三個把銀子埋起來。兩個比喻都在講要警醒、忠心預備。","people":["jesus"]},{"key":"綿羊山羊","title":"綿羊和山羊","ref":"太 25:31–46","summary":"人子在榮耀裡把萬民分開，像牧人分別綿羊和山羊。分辨的標準是有沒有給飢餓的吃、給作客的住、探望生病坐監的：「這些事你們既做在我這弟兄中一個最小的身上，就是做在我身上了」。只有馬太記載。","people":["jesus"]},{"key":"最後晚餐","title":"最後的晚餐","ref":"太 26:17–30","summary":"逾越節晚上，耶穌和十二門徒吃飯，說他們中間有一個人要出賣他。他拿起餅說「這是我的身體」，拿起杯說這是立約的血，為多人流出來，使罪得赦。","people":["jesus","judas"]},{"key":"被捕受審","title":"客西馬尼、被捕與受審","ref":"太 26:36～27:26","summary":"耶穌在客西馬尼憂傷禱告，猶大用親嘴作暗號帶人來抓他；大祭司該亞法審問時，彼得在院子裡三次不認主。猶大後悔，把三十塊錢丟在殿裡去吊死；彼拉多的妻子因夢勸他，彼拉多仍順從眾人，拿水洗手後把耶穌交出去釘十字架。","people":["jesus","judas","caiaphas","peter","pilate"]},{"key":"十架復活","title":"釘十字架、復活與大使命","ref":"太 27:27～28:20","summary":"耶穌被釘十字架，斷氣時聖殿的幔子從上到下裂為兩半，地也震動；亞利馬太的約瑟把他安葬，祭司長和法利賽人帶著看守的兵封石把守墳墓。七日的頭一日清早，天使告訴抹大拉的馬利亞和另一個馬利亞，耶穌已經復活了，耶穌在加利利山上差派門徒去使萬民作他的門徒。","people":["jesus","joseph-arimathea","mary-magdalene"]}],"people":["jesus","joseph","herod-great","john-baptist","peter","matthew","judas","caiaphas","pilate","mary-magdalene"],"verses":[{"ref":"太 5:3","text":"虛心的人有福了！因為天國是他們的。"},{"ref":"太 11:28","text":"凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。"},{"ref":"太 28:20","text":"凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。"}]}},{"t":"nt","id":"mark","order":2,"name":"馬可福音","abbr":"可","chapters":16,"group":"福音書","data":{"id":"mark","order":2,"name":"馬可福音","abbr":"可","chapters":16,"group":"福音書","oneLine":"最短、最快的福音書：來服事人的受苦彌賽亞","background":{"author":"傳統上認為是約翰馬可，根據彼得的講述寫成，也有不同看法","date":"約主後 55～70 年，多數學者認為是最早寫成的福音書","audience":"不熟悉猶太習俗的外邦信徒，傳統上認為是羅馬的教會","place":"不確定，傳統上說在羅馬","why":"當時羅馬的信徒面對尼祿時代的逼迫（約主後 64 年起），需要知道跟從一位被釘死的彌賽亞是什麼意思。馬可用簡短有力的敘事，從受洗一路寫到十字架，還替外邦讀者解釋猶太人洗手的規矩和亞蘭語。"},"revelations":[{"key":"立刻行動","point":"節奏最快，事情一件接一件發生","explain":"馬可是四福音中最短的一卷，教導少、行動多，常用「立刻」「隨即」把場景快速往前推，讀起來像現場報導。","ref":"可 1:10–43"},{"key":"神的兒子","point":"開頭和十字架下都宣告耶穌是神的兒子","explain":"第一句是「神的兒子，耶穌基督福音的起頭」；耶穌斷氣時，對面站著的羅馬百夫長說「這人真是神的兒子！」首尾呼應。","ref":"可 1:1；15:39"},{"key":"僕人捨命","point":"耶穌來是服事人，並且捨命","explain":"10:45 被視為全書的鑰節：人子來不是要受人的服事，乃是要服事人，並且捨命作多人的贖價；後半卷一路走向十字架。","ref":"可 10:45"},{"key":"三次預言","point":"耶穌三次預言受難，門徒三次聽不懂","explain":"耶穌三次說人子要受苦、被殺、三天後復活，門徒卻爭論誰為大、求坐在左右，帶出跟從他就要捨己、背起十字架的教導。","ref":"可 8:31；9:31；10:33–34"},{"key":"彌賽亞祕密","point":"耶穌常囑咐人不要張揚他的身分","explain":"被醫好的人、被趕出的鬼、甚至門徒，常被吩咐不要告訴人；學者稱為「彌賽亞的祕密」，耶穌是誰要到十字架和復活才看得明白。","ref":"可 1:44；8:30"},{"key":"門徒軟弱","point":"門徒的不明白與失敗寫得很直白","explain":"馬可不美化門徒：他們心裡愚頑、害怕、在耶穌被捕時全部逃走，彼得三次不認主，連一個少年人赤身逃走都記下來。","ref":"可 6:52；14:50–52"}],"outline":[{"key":"預備開場","range":"1:1–13","point":"施洗約翰在曠野預備道路，耶穌受洗、在曠野受試探，只用十三節就交代完。"},{"key":"加利利事工","range":"1:14～8:26","point":"耶穌在加利利傳「神的國近了」，呼召門徒、醫病趕鬼、講比喻、平靜風浪、五餅二魚，各方反應不一。"},{"key":"轉捩認信","range":"8:27～10:52","point":"彼得認耶穌是基督，耶穌三次預言受難，一路往耶路撒冷，教導門徒怎樣做眾人的僕人。"},{"key":"城中衝突","range":"11～13 章","point":"騎驢進城、潔淨聖殿、咒詛無花果樹，與宗教領袖辯論，在橄欖山講聖殿被毀與末日。"},{"key":"受難一週","range":"14～15 章","point":"伯大尼受膏、最後晚餐、客西馬尼被捕、公會與彼拉多審問、釘十字架、安葬。"},{"key":"空墳消息","range":"16 章","point":"婦女發現墳墓空了，少年人告訴她們耶穌已經復活；最早的古抄本在 16:8 結束。"}],"stories":[{"key":"拆屋頂","title":"四個人拆屋頂縋下癱子","ref":"可 2:1–12","summary":"房子擠滿了人進不去，四個人就把耶穌所在的房頂拆開，把癱子連褥子縋下來。耶穌先說「你的罪赦了」，再叫他拿褥子回家。（同見太 9:1–8）","people":["jesus"]},{"key":"種子長大","title":"種子自己長大的比喻","ref":"可 4:26–29","summary":"人把種子撒在地上，黑夜睡覺、白日起來，種子就發芽漸長，他卻不知道怎麼會這樣；先發苗、後長穗、再結成飽滿的子粒。只有馬可記載，用來比喻神的國。","people":["jesus"]},{"key":"船尾睡覺","title":"平靜風浪","ref":"可 4:35–41","summary":"馬可多寫了細節：耶穌在船尾枕著枕頭睡覺，門徒叫醒他，問他是不是不顧他們喪命；耶穌斥責風、對海說「住了吧！靜了吧！」（同見太 8:23–27）","people":["jesus"]},{"key":"名叫群","title":"格拉森被鬼附的人","ref":"可 5:1–20","summary":"馬可只寫一個被鬼附的人，他住在墳塋裡，沒有人能捆住他；鬼自稱「群」，被趕進約有二千頭的豬群。這人好了以後，在低加坡里傳揚耶穌為他做的事。（同見太 8:28–34）","people":["jesus"]},{"key":"大利大古米","title":"睚魯的女兒與血漏的婦人","ref":"可 5:21–43","summary":"在去睚魯家的路上，患血漏十二年的婦人摸耶穌的衣裳就好了。到了家，耶穌拉著十二歲女孩的手說「大利大，古米」，就是「閨女，我吩咐你起來」，她立刻起來行走。（同見太 9:18–26）","people":["jesus","peter","james-zebedee","john"]},{"key":"約翰被斬","title":"施洗約翰被殺","ref":"可 6:14–29","summary":"希律安提帕因約翰責備他娶兄弟的妻子希羅底，就把約翰下在監裡。希律生日宴上，希羅底的女兒跳舞討他歡喜，在母親指使下求約翰的頭，希律就派人斬了約翰。（同見太 14:1–12）","people":["herod-antipas","john-baptist"]},{"key":"以法大","title":"耳聾舌結的人","ref":"可 7:31–37","summary":"在低加坡里，有人帶來一個耳聾舌結的人。耶穌領他離開眾人，用指頭探他的耳朵、吐唾沫抹他的舌頭，望天說「以法大」，就是「開了吧」，他的耳朵就開了、舌結也解了。只有馬可記載。","people":["jesus"]},{"key":"伯賽大瞎子","title":"分兩次看清楚的瞎子","ref":"可 8:22–26","summary":"耶穌在伯賽大拉著瞎子的手領他到村外，吐唾沫在他眼睛上、按手。他第一次說看見人好像樹木在行走，耶穌再按手，他才看得清楚。只有馬可記載。","people":["jesus"]},{"key":"看著就愛","title":"富有的人求永生","ref":"可 10:17–31","summary":"有人跑來跪著問怎樣承受永生，馬可特別記下「耶穌看著他，就愛他」，叫他變賣所有的分給窮人再來跟從。他因為產業很多，就憂憂愁愁地走了。（同見太 19:16–30）","people":["jesus","peter"],"note":"馬太福音 19:20 稱他「少年人」，路加福音 18:18 稱他「一個官」。"},{"key":"巴底買","title":"瞎子巴底買","ref":"可 10:46–52","summary":"馬可記下了瞎子的名字：耶利哥路邊討飯的巴底買。他大聲喊「大衛的子孫耶穌啊！可憐我吧」，聽見耶穌叫他，就丟下衣服、跳起來，立刻看見了，在路上跟隨耶穌。（同見太 20:29–34）","people":["jesus"]},{"key":"寡婦小錢","title":"窮寡婦的兩個小錢","ref":"可 12:41–44","summary":"耶穌看眾人往聖殿的銀庫裡投錢，許多財主投了好些。一個窮寡婦投了兩個小錢，耶穌說她比眾人投的更多，因為她把自己一切養生的都投上了。","people":["jesus"]},{"key":"赤身逃走","title":"赤身逃走的少年人","ref":"可 14:51–52","summary":"耶穌被捕、門徒都逃走時，有一個少年人赤身披著一塊麻布跟隨耶穌，被人抓住，就丟了麻布赤身逃走。只有馬可記下這個小插曲。","people":["jesus"]},{"key":"古利奈人西門","title":"替耶穌背十字架的西門","ref":"可 15:21","summary":"士兵勉強一個從鄉下來的古利奈人西門替耶穌背十字架。馬可特別註明他是「亞力山大和魯孚的父親」，似乎讀者認識這兩個人。（同見太 27:32）","people":["jesus"]},{"key":"空墳結尾","title":"空墳墓與婦女的驚嚇","ref":"可 16:1–8","summary":"抹大拉的馬利亞等婦女帶香膏去墳墓，看見一個穿白袍的少年人說「他已經復活了」，要她們去告訴門徒「和彼得」。她們發抖驚奇、逃跑了；最早的古抄本在這裡結束，9～20 節在一些古抄本中沒有。（同見太 28:1–10）","people":["mary-magdalene","jesus","peter"]}],"people":["jesus","john-baptist","peter","james-zebedee","john","herod-antipas","judas","pilate","mary-magdalene"],"verses":[{"ref":"可 10:45","text":"因為人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價。"},{"ref":"可 8:36","text":"人就是賺得全世界，賠上自己的生命，有甚麼益處呢？"}]}},{"t":"nt","id":"luke","order":3,"name":"路加福音","abbr":"路","chapters":24,"group":"福音書","data":{"id":"luke","order":3,"name":"路加福音","abbr":"路","chapters":24,"group":"福音書","oneLine":"醫生路加按次序寫：救主臨到窮人與外邦人","background":{"author":"傳統上認為是保羅的同工、醫生路加，他也寫了使徒行傳","date":"約主後 60～85 年，學界看法不一","audience":"提阿非羅大人，以及廣大的外邦讀者","place":"不確定","why":"路加不是目擊者，他說自己從頭詳細考察，參考了「從起初親眼看見」的人傳下來的，按著次序寫給提阿非羅，讓他確知所學的道。這是兩卷書的上集，下集是使徒行傳，從耶路撒冷一路寫到羅馬。"},"revelations":[{"key":"詳細考察","point":"這是一份按次序、經過考察的記錄","explain":"序言說他從頭詳細考察、按著次序寫；書中把事件放進羅馬皇帝與巡撫的年代，例如該撒亞古士督報名上冊、提庇留在位第十五年。","ref":"路 1:1–4；2:1；3:1"},{"key":"萬人救主","point":"救恩是給萬民的，不只給以色列","explain":"家譜一路追溯到亞當（馬太只到亞伯拉罕）；西面說耶穌是「照亮外邦人的光」；好撒馬利亞人、回來道謝的撒馬利亞人都只在路加。","ref":"路 2:32；3:23–38"},{"key":"尋找失喪","point":"耶穌特別去找被看不起的人","explain":"窮人、稅吏、罪人、病人在路加裡特別多：迷羊、失錢、浪子三個比喻，撒該的故事，結論是「人子來，為要尋找、拯救失喪的人」。","ref":"路 15；19:10"},{"key":"婦女身影","point":"婦女在這卷書裡占很重要的位置","explain":"降生故事從馬利亞和伊利沙伯的角度寫；有一群婦女用自己的財物供給耶穌和門徒；馬大與馬利亞、拿因城的寡婦也都在這卷。","ref":"路 1:26–56；8:1–3"},{"key":"禱告聖靈","point":"耶穌在每個關鍵時刻都在禱告","explain":"受洗時、揀選十二使徒前整夜、登山變像時、十字架上，路加都寫耶穌在禱告；這卷也常提到聖靈，替使徒行傳鋪路。","ref":"路 3:21–22；6:12–13；9:28–29；23:46"},{"key":"定意前行","point":"近十章的旅程一路走向耶路撒冷","explain":"從 9:51 耶穌「定意向耶路撒冷去」開始，許多只有路加記的比喻和故事都放在這段長旅程裡。","ref":"路 9:51～19:27"},{"key":"獨有比喻","point":"許多知名比喻只有路加記載","explain":"好撒馬利亞人、浪子回頭、無知的財主、財主與拉撒路、不義的管家、法利賽人和稅吏禱告，都只見於路加。","ref":"路 10～18"}],"outline":[{"key":"降生童年","range":"1～2 章","point":"天使兩次報信，約翰與耶穌出生，牧羊人來看，聖殿裡的西面與亞拿，十二歲的耶穌在聖殿。"},{"key":"出來預備","range":"3:1～4:13","point":"施洗約翰傳悔改的洗禮，耶穌受洗，家譜追溯到亞當，在曠野受試探。"},{"key":"加利利傳道","range":"4:14～9:50","point":"在拿撒勒會堂宣告使命，呼召門徒、平原上的講論、醫病趕鬼、差派十二使徒、登山變像。"},{"key":"往耶路撒冷","range":"9:51～19:27","point":"一路往耶路撒冷，沿途教導與比喻：好撒馬利亞人、浪子回頭、撒該。"},{"key":"城中教導","range":"19:28～21:38","point":"騎驢進城、為耶路撒冷哀哭、潔淨聖殿，在殿裡辯論，預言聖殿被毀。"},{"key":"受難復活","range":"22～24 章","point":"最後晚餐、被捕受審（彼拉多把耶穌送到希律那裡），釘十字架、復活、以馬忤斯路上、升天。"}],"stories":[{"key":"兩次報信","title":"天使加百列兩次報信","ref":"路 1:5–38","summary":"天使向在聖殿供職的祭司撒迦利亞說，他年老的妻子伊利沙伯要生兒子約翰，他不信就成了啞巴。六個月後，天使向童女馬利亞報信，馬利亞說「我是主的使女，情願照你的話成就在我身上」。","people":["zechariah-elizabeth","mary"]},{"key":"探訪尊主頌","title":"馬利亞探訪伊利沙伯","ref":"路 1:39–56","summary":"馬利亞去探望伊利沙伯，伊利沙伯腹裡的胎兒就跳動，她被聖靈充滿祝福馬利亞。馬利亞唱出讚美詩「我心尊主為大」，歌頌神叫卑賤的升高。","people":["mary","zechariah-elizabeth"]},{"key":"馬槽牧羊人","title":"生在馬槽，牧羊人來看","ref":"路 2:1–20","summary":"該撒亞古士督下旨報名上冊，約瑟帶著馬利亞從拿撒勒上伯利恆；因為客店裡沒有地方，嬰孩被放在馬槽裡。天使向夜間看守羊群的牧羊人報好消息，牧羊人急忙去看，回去一路讚美神。","people":["jesus","mary","joseph"]},{"key":"西面亞拿","title":"聖殿裡的西面與亞拿","ref":"路 2:22–38","summary":"約瑟和馬利亞帶嬰孩到聖殿行潔淨禮。素常盼望以色列安慰者來到的西面把孩子抱在懷裡，說自己可以安然去世，因為眼睛已經看見了救恩；女先知亞拿也為這孩子稱謝神。","people":["jesus","mary","joseph"]},{"key":"聖殿少年","title":"十二歲的耶穌在聖殿","ref":"路 2:41–52","summary":"耶穌十二歲時和父母上耶路撒冷過逾越節，回程父母才發現他不見了。過了三天，在聖殿裡找到他坐在教師中間，一面聽一面問；他說「豈不知我應當以我父的事為念嗎？」只有路加記載耶穌少年時期的事。","people":["jesus","mary","joseph"]},{"key":"會堂宣告","title":"在拿撒勒會堂被拒","ref":"路 4:16–30","summary":"耶穌在家鄉會堂讀以賽亞書「主的靈在我身上…叫我傳福音給貧窮的人」，說「今天這經應驗在你們耳中了」。鄉親起初稱讚，後來大怒，要把他推下山崖，他卻從他們中間走過去了。（同見太 13:53–58）","people":["jesus"]},{"key":"大網打魚","title":"整夜打不到魚之後","ref":"路 5:1–11","summary":"彼得整夜打魚一無所獲，照耶穌的話把網撒在深水處，網多到幾乎裂開，兩條船都裝滿了。彼得俯伏說「主啊，離開我，我是個罪人」，耶穌說從今以後你要得人了。（同見太 4:18–22）","people":["jesus","peter","james-zebedee","john"]},{"key":"拿因寡婦","title":"拿因城寡婦的兒子","ref":"路 7:11–17","summary":"耶穌在拿因城門口遇見出殯的隊伍，死的是寡婦的獨生子。耶穌看見她就憐憫她，摸著槓說「少年人，我吩咐你，起來」，死人就坐起來說話。只有路加記載。","people":["jesus"]},{"key":"眼淚洗腳","title":"用眼淚濕耶穌腳的女人","ref":"路 7:36–50","summary":"在法利賽人西門家吃飯時，城裡一個有罪的女人用眼淚濕了耶穌的腳、用頭髮擦乾、抹上香膏。西門心裡看不起她，耶穌用兩個欠債的人被免債作比喻，說她許多的罪都赦免了，因為她的愛多。只有路加記載。","people":["jesus"]},{"key":"好撒馬利亞人","title":"好撒馬利亞人","ref":"路 10:25–37","summary":"律法師問「誰是我的鄰舍呢？」耶穌講一個人從耶路撒冷下耶利哥被強盜打傷，祭司和利未人都從旁邊過去，一個撒馬利亞人卻停下來包紮、帶到店裡照顧。耶穌問誰是他的鄰舍，說「你去照樣行吧」。","people":["jesus"]},{"key":"馬大馬利亞","title":"馬大與馬利亞","ref":"路 10:38–42","summary":"耶穌到馬大家，姊姊馬大忙著伺候，妹妹馬利亞坐在耶穌腳前聽道。馬大抱怨妹妹不幫忙，耶穌說「馬大！馬大！你為許多的事思慮煩擾，但是不可少的只有一件」，馬利亞已經選擇那上好的福分。","people":["jesus","martha-mary-lazarus"]},{"key":"無知財主","title":"無知的財主","ref":"路 12:13–21","summary":"有人請耶穌叫他兄長分家業，耶穌講比喻：一個財主田產豐收，打算拆了倉房蓋更大的，從此安安逸逸享福。神卻對他說「無知的人哪，今夜必要你的靈魂」，你預備的要歸誰呢？","people":["jesus"]},{"key":"浪子回頭","title":"迷羊、失錢與浪子","ref":"路 15","summary":"法利賽人和文士私下議論耶穌接待罪人，耶穌連講三個失而復得的比喻。最後一個是小兒子分了家業揮霍一空，淪落到放豬，回家時父親遠遠看見就跑去抱住他；只有在外面生氣的大哥不肯進去。","people":["jesus"]},{"key":"財主拉撒路","title":"財主與拉撒路","ref":"路 16:19–31","summary":"一個財主天天奢華宴樂，門口躺著渾身生瘡、討飯的拉撒路。兩人死後處境顛倒，財主在陰間受苦，求亞伯拉罕差人去警告他的兄弟，回答是「他們有摩西和先知的話可以聽從」。這個拉撒路和伯大尼的拉撒路是不同人。","people":["jesus"]},{"key":"十個痲瘋","title":"十個痲瘋病人","ref":"路 17:11–19","summary":"在撒馬利亞和加利利交界，十個痲瘋病人求耶穌憐憫，耶穌叫他們去給祭司察看，路上就潔淨了。只有一個撒馬利亞人回來俯伏感謝，耶穌問「那九個在哪裡呢？」","people":["jesus"]},{"key":"稅吏禱告","title":"法利賽人和稅吏禱告","ref":"路 18:9–14","summary":"兩個人上聖殿禱告。法利賽人細數自己禁食、捐獻，稅吏遠遠站著，搥著胸說「神啊，開恩可憐我這個罪人」；耶穌說這稅吏回家比那人倒算為義了。只有路加記載。","people":["jesus"]},{"key":"撒該爬樹","title":"稅吏長撒該","ref":"路 19:1–10","summary":"耶利哥的稅吏長撒該很有錢，身量矮小，跑到前頭爬上桑樹要看耶穌。耶穌叫他「快下來！今天我必住在你家裡」，撒該當場說要把一半家產給窮人，訛詐過誰就還他四倍。","people":["zacchaeus","jesus"]},{"key":"十架犯人","title":"十字架上的兩個犯人","ref":"路 23:32–43","summary":"耶穌和兩個犯人同釘十字架。一個譏笑他，另一個責備同伴，對耶穌說「你得國降臨的時候，求你記念我」，耶穌回答「今日你要同我在樂園裡了」。只有路加記下這段對話。","people":["jesus"]},{"key":"以馬忤斯","title":"以馬忤斯路上","ref":"路 24:13–35","summary":"復活那天，兩個門徒（其中一個叫革流巴）走往以馬忤斯，耶穌同行並講解聖經，他們卻認不出來。到了吃飯時，耶穌擘開餅，他們的眼睛明亮了，當夜就趕回耶路撒冷報信。","people":["jesus"]},{"key":"伯大尼升天","title":"在伯大尼升天","ref":"路 24:50–53","summary":"耶穌領門徒到伯大尼附近，舉手給他們祝福，正祝福的時候就被帶到天上去了。門徒大大歡喜回到耶路撒冷，常在殿裡稱頌神；全書從聖殿開始，也在聖殿結束。","people":["jesus"]}],"people":["jesus","mary","joseph","zechariah-elizabeth","john-baptist","peter","martha-mary-lazarus","zacchaeus","herod-antipas","pilate"],"verses":[{"ref":"路 2:11","text":"因今天在大衛的城裡，為你們生了救主，就是主基督。"},{"ref":"路 19:10","text":"人子來，為要尋找、拯救失喪的人。"}]}},{"t":"nt","id":"john","order":4,"name":"約翰福音","abbr":"約","chapters":21,"group":"福音書","data":{"id":"john","order":4,"name":"約翰福音","abbr":"約","chapters":21,"group":"福音書","oneLine":"要叫你們信：道成肉身的神的兒子","background":{"author":"傳統上認為是使徒約翰，書中自稱「耶穌所愛的那門徒」，也有不同看法","date":"約主後 90 年前後，多數學者認為是四福音中最晚寫成的","audience":"信徒與想認識耶穌的人，兼顧猶太與外邦讀者","place":"不確定，傳統上說在以弗所","why":"到第一世紀末，許多目擊者已經離世，信徒與會堂之間的關係也越來越緊張。約翰不重述前三卷已有的大量內容，而是挑選幾個神蹟和長篇對話來說明耶穌是誰，寫作目的直接寫在 20:31。"},"revelations":[{"key":"道成肉身","point":"耶穌就是太初就有、成了肉身的道","explain":"約翰不從家譜或馬槽講起，而是從「太初有道」開始，把耶穌放在創造之前；「道成了肉身，住在我們中間」是全書的基調。","ref":"約 1:1–18"},{"key":"七個神蹟","point":"神蹟是指向耶穌身分的記號","explain":"約翰把神蹟稱為「神蹟」（記號），學者常整理出七個：從迦拿水變酒到拉撒路復活，每一個後面常接著對話或講論說明意義。","ref":"約 2:11；20:30–31"},{"key":"七個我是","point":"耶穌七次用「我是…」說明自己","explain":"生命的糧、世界的光、羊的門、好牧人、復活和生命、道路真理生命、真葡萄樹；「還沒有亞伯拉罕就有了我」也呼應舊約神向摩西自稱的名。","ref":"約 6:35；8:12；8:58；10:7；10:11；11:25；14:6；15:1"},{"key":"長篇對話","point":"用一對一的長談帶出信仰","explain":"尼哥底母、撒馬利亞婦人、生來瞎眼的人，以及 13～17 章的臨別講論，讓讀者看見不同的人怎樣一步步認識耶穌。","ref":"約 3～4；9；13～17"},{"key":"信而得生","point":"全書的目的：叫人信，並且得生命","explain":"約翰直接寫出寫作目的；「信」這個動詞在書中出現將近一百次，「生命」「永生」也一再出現。","ref":"約 20:31"},{"key":"光與黑暗","point":"光與黑暗的對比貫穿全書","explain":"開頭說「光照在黑暗裡，黑暗卻不接受光」；尼哥底母夜裡來見耶穌，猶大出去時「那時候是夜間了」，都在呼應這個對比。","ref":"約 1:5；8:12；13:30"},{"key":"時候到了","point":"耶穌的「時候」一路走向十字架","explain":"前半卷常說「我的時候還沒有到」，到 12 章耶穌說「人子得榮耀的時候到了」；約翰把十字架看成耶穌得榮耀的時刻。","ref":"約 2:4；12:23；17:1"}],"outline":[{"key":"太初序言","range":"1:1–18","point":"從太初有道講起：道就是神，萬物藉著他造的，道成了肉身住在人間。"},{"key":"神蹟之書","range":"1:19～12:50","point":"施洗約翰作見證，最早的門徒跟從；耶穌多次上耶路撒冷過節，潔淨聖殿放在一開始，行神蹟、長篇對話，信與不信的人逐漸分開。"},{"key":"臨別講論","range":"13～17 章","point":"最後晚餐時洗門徒的腳，賜下「彼此相愛」的新命令，講道路真理生命、葡萄樹，最後為門徒禱告。"},{"key":"受難得榮","range":"18～19 章","point":"在汲淪溪那邊的園子被捕，彼得不認主，彼拉多問「真理是甚麼呢？」，耶穌在十字架上說「成了」，由亞利馬太的約瑟和尼哥底母安葬。"},{"key":"復活顯現","range":"20 章","point":"抹大拉的馬利亞在墳墓外遇見復活的耶穌，耶穌向門徒和多馬顯現，結尾寫明寫書的目的。"},{"key":"海邊尾聲","range":"21 章","point":"提比哩亞海邊的大魚神蹟，耶穌三次問彼得「你愛我嗎」，交代彼得和那門徒的將來。"}],"stories":[{"key":"最早門徒","title":"最早跟從的門徒","ref":"約 1:35–51","summary":"施洗約翰指著耶穌說「看哪，這是神的羔羊」，安得烈就跟從耶穌，又帶哥哥西門來，耶穌給他起名叫磯法。腓力找來拿但業，拿但業懷疑拿撒勒能出什麼好的，腓力說「你來看」。","people":["jesus","john-baptist","andrew","peter","philip-apostle"]},{"key":"迦拿婚筵","title":"迦拿婚筵水變酒","ref":"約 2:1–11","summary":"加利利的迦拿有人娶親，酒用盡了，耶穌的母親告訴他。耶穌叫僕人把六口石缸倒滿水，舀出來已經變成好酒，管筵席的說好酒竟留到如今；這是耶穌所行的頭一件神蹟。","people":["jesus","mary"]},{"key":"潔淨聖殿","title":"用繩子作鞭子潔淨聖殿","ref":"約 2:13–22","summary":"逾越節時耶穌在聖殿用繩子作鞭子，趕出牛羊，推翻兌換銀錢的桌子，說「你們拆毀這殿，我三日內要再建立起來」，他是以身體為殿。約翰把這件事放在傳道初期，前三卷放在最後一週。（同見太 21:12–13）","people":["jesus"]},{"key":"夜訪重生","title":"尼哥底母夜訪","ref":"約 3:1–21","summary":"法利賽人、猶太人的官尼哥底母夜裡來見耶穌。耶穌說「人若不重生，就不能見神的國」，又用摩西在曠野舉蛇作比方，接著就是「神愛世人」這段話。","people":["nicodemus","jesus"]},{"key":"井邊活水","title":"井邊的撒馬利亞婦人","ref":"約 4:1–42","summary":"約在正午，耶穌在雅各井旁向一個撒馬利亞婦人要水喝，當時猶太人和撒馬利亞人沒有來往。耶穌跟她談「活水」，說出她過去有五個丈夫的事；她放下水罐進城說「莫非這就是基督嗎？」眾人就出城往耶穌那裡去。","people":["samaritan-woman","jesus"]},{"key":"大臣兒子","title":"大臣的兒子得醫治","ref":"約 4:46–54","summary":"迦百農一個大臣的兒子病得快死了，他到迦拿求耶穌下去。耶穌說「回去吧，你的兒子活了」，他回家路上僕人來報兒子好了，正是耶穌說話的那個時候；這是耶穌在加利利行的第二件神蹟。","people":["jesus"]},{"key":"畢士大池","title":"畢士大池邊的病人","ref":"約 5:1–18","summary":"耶路撒冷羊門旁的畢士大池邊，躺著一個病了三十八年的人。耶穌對他說「起來，拿你的褥子走吧」，他就痊癒了；因為他在安息日治病，又稱神為他的父，猶太人越發想要殺他。","people":["jesus"]},{"key":"生命的糧","title":"五餅二魚與生命的糧","ref":"約 6:1–71","summary":"約翰記下細節：腓力算錢不夠，安得烈找到一個帶著五個大麥餅、兩條魚的孩童。吃飽的群眾追著耶穌，耶穌說「我就是生命的糧」，許多門徒因此退去，彼得說「你有永生之道，我們還歸從誰呢？」（同見太 14:13–21）","people":["jesus","philip-apostle","andrew","peter"]},{"key":"被拿婦人","title":"行淫時被拿的婦人","ref":"約 7:53～8:11","summary":"文士和法利賽人帶來一個行淫時被拿的婦人，要試探耶穌。耶穌彎腰在地上畫字，說「你們中間誰是沒有罪的，誰就可以先拿石頭打她」，眾人從老到少一個一個出去了；耶穌說「我也不定你的罪」。有些古抄本沒有這一段。","people":["jesus"]},{"key":"生來瞎眼","title":"生來瞎眼的人","ref":"約 9","summary":"門徒問這人生來瞎眼是誰犯了罪，耶穌說是要在他身上顯出神的作為。耶穌用泥抹他的眼，叫他去西羅亞池洗，他就看見了；法利賽人一再盤問，他說「從前我是眼瞎的，如今能看見了」，結果被他們趕了出去。","people":["jesus"],"note":"這個細節記在約翰福音 9:22：「要把他趕出會堂」。"},{"key":"好牧人","title":"我是好牧人","ref":"約 10:1–18","summary":"耶穌說羊認得牧人的聲音，雇工看見狼來就逃走，「我是好牧人；好牧人為羊捨命」。他還說有另外的羊不屬這圈，也要合成一群。","people":["jesus"]},{"key":"拉撒路復活","title":"拉撒路從死裡復活","ref":"約 11:1–53","summary":"伯大尼的拉撒路病死，埋葬已經四天。耶穌對馬大說「復活在我，生命也在我」，在往墳墓的路上哭了，到了墳前大聲呼叫「拉撒路出來！」死人就出來了；大祭司該亞法從此和公會商議要殺耶穌。","people":["martha-mary-lazarus","jesus","caiaphas"]},{"key":"真哪噠香膏","title":"馬利亞用香膏抹耶穌的腳","ref":"約 12:1–8","summary":"在伯大尼的筵席上，拉撒路的姊妹馬利亞拿一斤極貴的真哪噠香膏抹耶穌的腳，又用頭髮去擦。猶大說為什麼不賣三十兩銀子賙濟窮人，約翰註明他是個賊。（同見太 26:6–13）","people":["martha-mary-lazarus","judas","jesus"]},{"key":"洗門徒腳","title":"耶穌洗門徒的腳","ref":"約 13:1–17","summary":"晚餐時耶穌起來束上手巾，倒水洗門徒的腳。彼得先說「你永不可洗我的腳」，後來又要連手和頭也洗；耶穌說我是你們的主、你們的夫子，尚且洗你們的腳，你們也當彼此洗腳。只有約翰記載。","people":["jesus","peter"]},{"key":"道路真理","title":"我就是道路、真理、生命","ref":"約 14:1–14","summary":"耶穌說要去為門徒預備地方，多馬問「我們不知道你往哪裡去，怎麼知道那條路呢？」耶穌回答「我就是道路、真理、生命」。腓力求他把父顯出來，耶穌說「人看見了我，就是看見了父」。","people":["jesus","thomas","philip-apostle"]},{"key":"交託母親","title":"十字架下交託母親","ref":"約 19:25–30","summary":"耶穌的母親和幾個婦女站在十字架旁邊。耶穌對母親說「看，你的兒子」，對他所愛的那門徒（傳統上認為是約翰）說「看，你的母親」，那門徒就接她到自己家裡；耶穌最後說「成了」，便低下頭交付靈魂。","people":["jesus","mary","john"]},{"key":"園中相遇","title":"抹大拉的馬利亞遇見復活的耶穌","ref":"約 20:1–18","summary":"七日的頭一日清早，抹大拉的馬利亞發現墳墓空了，彼得和另一個門徒跑來查看。馬利亞在墳墓外哭，以為站在旁邊的是看園的，直到耶穌叫她「馬利亞」，她才認出來說「拉波尼」（夫子）。","people":["mary-magdalene","peter","john","jesus"]},{"key":"多馬見主","title":"多馬要看見釘痕才信","ref":"約 20:24–29","summary":"耶穌顯現時多馬不在場，他說非看見釘痕、親手探入，總不信。八日後耶穌再顯現，叫多馬伸手來摸，多馬說「我的主！我的神！」耶穌說「那沒有看見就信的有福了」。","people":["thomas","jesus"]},{"key":"海邊三問","title":"提比哩亞海邊三問彼得","ref":"約 21:1–19","summary":"彼得等七個門徒整夜打不到魚，照岸上那人的話在船右邊撒網，拉上一百五十三條大魚，網卻沒有破。早飯後耶穌三次問彼得「你愛我嗎？」三次託付他餵養、牧養他的羊，並預言他將來怎樣死。","people":["peter","john","thomas","jesus"]}],"people":["jesus","john-baptist","john","peter","thomas","nicodemus","samaritan-woman","martha-mary-lazarus","mary-magdalene","pilate"],"verses":[{"ref":"約 1:14","text":"道成了肉身，住在我們中間，充充滿滿地有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。"},{"ref":"約 3:16","text":"神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。"},{"ref":"約 20:31","text":"但記這些事要叫你們信耶穌是基督，是神的兒子，並且叫你們信了他，就可以因他的名得生命。"}]}},{"t":"nt","id":"acts","order":5,"name":"使徒行傳","abbr":"徒","chapters":28,"group":"歷史書","data":{"id":"acts","order":5,"name":"使徒行傳","abbr":"徒","chapters":28,"group":"歷史書","oneLine":"聖靈降臨後，福音從耶路撒冷一路傳到羅馬","background":{"author":"傳統上認為是路加醫生所寫，他也是路加福音的作者","date":"約主後 62～85 年（學界看法不一）","audience":"提阿非羅，也寫給更廣的讀者","place":"不確定，可能在羅馬","why":"這卷書是路加福音的續集，開頭就接著寫給提阿非羅的「前書」。路加記錄耶穌升天後，門徒如何把福音從耶路撒冷傳到外邦，全書停在保羅在羅馬自己租的房子裡傳道兩年。"},"revelations":[{"key":"聖靈的能力","point":"教會的擴展是從聖靈降臨開始的。","explain":"耶穌升天前應許門徒「必得著能力」，五旬節聖靈降臨後，原本聚在樓房裡同心禱告的門徒開始公開傳講。全書多次寫到被聖靈充滿、受聖靈差遣。","ref":"徒 1:8；2:1–4","note":"「門都關了」記在約翰福音 20:19。"},{"key":"見證到地極","point":"福音照著 1:8 的路線，從耶路撒冷傳到羅馬。","explain":"「耶路撒冷、猶太全地，和撒馬利亞，直到地極」就是全書的目錄。故事從耶路撒冷的一間樓房開始，結束在帝國首都羅馬。","ref":"徒 1:8；28:30–31"},{"key":"外邦得救","point":"外邦人不必先成為猶太人，也被神接納。","explain":"從衣索匹亞的太監、哥尼流一家，到耶路撒冷會議，這卷書一步步記錄教會如何確認外邦信徒不必受割禮也能得救。","ref":"徒 10～11；15:1–29"},{"key":"逼迫中擴展","point":"逼迫反而把福音推向更遠的地方。","explain":"司提反殉道後信徒四散，福音因此傳到撒馬利亞和安提阿。保羅屢次被打、下監、受審，最後也因上告該撒而被送到羅馬。","ref":"徒 8:1–4；11:19–21"},{"key":"耶穌的名","point":"使徒傳講的核心是死而復活的耶穌。","explain":"彼得、司提反、保羅的講道都回到同一點：被釘十字架的耶穌，神已經叫他復活。使徒醫病也是「奉耶穌的名」。","ref":"徒 2:22–36；3:6；4:10–12"},{"key":"同心合意","point":"初期信徒彼此分享、一同禱告擘餅。","explain":"信徒恆心遵守使徒的教訓、彼此交接、擘餅、祈禱，凡物公用。遇到寡婦供給不均的問題，就選出七個人分工處理。","ref":"徒 2:42–47；6:1–7"}],"outline":[{"key":"升天等候","range":"1 章","point":"耶穌升天，門徒在耶路撒冷同心禱告，等候聖靈。"},{"key":"耶路撒冷見證","range":"2～7 章","point":"聖靈降臨，教會在耶路撒冷快速增長，也遭公會逼迫，以司提反殉道作結。"},{"key":"猶太撒馬利亞","range":"8～12 章","point":"信徒分散，福音傳到撒馬利亞；掃羅歸主；彼得把福音傳給外邦人哥尼流。"},{"key":"走向外邦","range":"13:1～15:35","point":"保羅與巴拿巴第一次出外傳道，耶路撒冷會議決定外邦信徒不必受割禮。"},{"key":"第二次旅行","range":"15:36～18:22","point":"保羅帶著西拉、提摩太進入馬其頓與希臘，走過腓立比、帖撒羅尼迦、雅典、哥林多。"},{"key":"第三次旅行","range":"18:23～21:16","point":"保羅在以弗所長住傳道，再經馬其頓、希臘回到耶路撒冷。"},{"key":"受審申辯","range":"21:17～26:32","point":"保羅在聖殿被捕，在公會、巡撫和亞基帕王面前申辯，最後上告該撒。"},{"key":"航向羅馬","range":"27～28 章","point":"海上遇到船難，最後到了羅馬，在租來的房子裡傳道兩年。"}],"stories":[{"key":"升天與補選","title":"耶穌升天與補選馬提亞","ref":"徒 1:1–26","summary":"耶穌受害之後，四十天之久向使徒顯現，吩咐他們留在耶路撒冷等候聖靈，然後在他們眼前被取上升。門徒同心合意禱告，用抽籤補選馬提亞，接替猶大的職分。","people":["jesus","peter"]},{"key":"五旬節","title":"五旬節聖靈降臨","ref":"徒 2:1–41","summary":"五旬節門徒聚在一處，忽然有響聲從天上下來，又有舌頭如火焰顯現、分開落在各人頭上，他們就說起別國的話來。彼得站起來講道，那一天門徒約添了三千人。","people":["peter"]},{"key":"美門口瘸子","title":"美門口的瘸子","ref":"徒 3:1～4:22","summary":"彼得、約翰在聖殿的美門口遇見一個生來瘸腿的人，彼得說金銀他沒有，只把他所有的給他，奉耶穌基督的名叫他起來行走，那人就跳起來。兩人因此被公會拘押審問，被恐嚇不准再奉耶穌的名講論後才獲釋。","people":["peter","john"]},{"key":"亞拿尼亞夫婦","title":"亞拿尼亞與撒非喇","ref":"徒 5:1–11","summary":"亞拿尼亞和妻子撒非喇賣了田產，私下留下幾分價銀，卻假裝全數交給使徒。彼得指出他們不是欺哄人，是欺哄神，兩人先後倒地斷氣，全教會都十分懼怕。","people":["peter"]},{"key":"司提反殉道","title":"司提反殉道","ref":"徒 6:8～8:3","summary":"司提反是被選出來管理飯食的七人之一，滿有信心和聖靈。他在公會面前述說以色列的歷史，指責眾人常時抗拒聖靈，就被拉到城外用石頭打死，臨死前求主不要將這罪歸於他們。少年人掃羅在場看守眾人的衣裳，也喜悅他被害。","people":["stephen","paul"]},{"key":"腓利與太監","title":"腓利與衣索匹亞的太監","ref":"徒 8:4–40","summary":"信徒因逼迫分散，腓利到撒馬利亞城傳道，許多人信了。後來主的使者叫他往迦薩的路上去，他遇見衣索匹亞女王甘大基的太監坐在車上讀以賽亞書，就從這段經文講耶穌，並在路旁有水的地方為他施洗。","people":["philip-evangelist"]},{"key":"大馬士革路上","title":"掃羅在大馬士革路上","ref":"徒 9:1–31","summary":"掃羅帶著大祭司的文書要去大馬士革捉拿信徒，路上忽然有光從天上四面照著他，他聽見有聲音說「掃羅！掃羅！你為甚麼逼迫我？」他三天看不見，主差亞拿尼亞為他按手，他就能看見並受洗，隨即在會堂宣傳耶穌是神的兒子。","people":["paul","ananias-damascus","barnabas"]},{"key":"彼得與哥尼流","title":"彼得與哥尼流","ref":"徒 10:1～11:18","summary":"該撒利亞的百夫長哥尼流是虔誠的外邦人，他在異象中被吩咐去約帕請彼得；同時彼得也看見天上降下一塊大布、裡面有各樣走獸的異象。彼得到哥尼流家講道時，聖靈降在一切聽道的外邦人身上，他們就受了洗。","people":["peter","cornelius"]},{"key":"彼得出監","title":"彼得被天使救出監","ref":"徒 12:1–24","summary":"希律王用刀殺了約翰的哥哥雅各，又把彼得下在監裡。夜裡主的使者叫醒彼得，鐵鍊從他手上脫落，城門自己開了，他到約翰馬可的母親馬利亞家，使女羅大聽出他的聲音，歡喜得忘了開門。後來希律在該撒利亞，百姓喊他的聲音是神的聲音，他不歸榮耀給神，主的使者立刻罰他，他被蟲所咬，氣就絕了。","people":["peter","james-zebedee","herod-agrippa","mark"]},{"key":"第一次旅行","title":"保羅第一次出外傳道","ref":"徒 13～14","summary":"安提阿教會禁食禱告後，差派巴拿巴和掃羅（又名保羅）出去，約翰馬可隨行，但他在別加就離開回耶路撒冷。他們走過塞浦路斯、彼西底的安提阿、以哥念、路司得、特庇；在路司得先被眾人當成神明，後來保羅又被石頭打、拖到城外，眾人以為他死了，他卻起來走進城去，第二天往特庇去。","people":["paul","barnabas","mark"]},{"key":"耶路撒冷會議","title":"耶路撒冷會議","ref":"徒 15:1–35","summary":"有人從猶太下來教導外邦信徒「你們若不按摩西的規條受割禮，不能得救」，引起大爭論。使徒和長老在耶路撒冷聚集商議，彼得作見證，雅各作結論：不可難為歸服神的外邦人，只寫信叫他們禁戒偶像的污穢、姦淫、勒死的牲畜和血，並派猶大和西拉同保羅、巴拿巴送信到安提阿。","people":["peter","james-brother","paul","barnabas","silas"]},{"key":"馬其頓呼聲","title":"馬其頓的呼聲與呂底亞","ref":"徒 15:36～16:15","summary":"保羅和巴拿巴為了要不要再帶馬可同行起了爭論，就彼此分開，保羅改帶西拉，在路司得又帶上提摩太。保羅夜裡在特羅亞看見異象，有一個馬其頓人求他過來幫助；他們到了腓立比，推雅推喇城賣紫色布疋的呂底亞聽道信主，和她一家都受了洗。","people":["paul","barnabas","mark","silas","timothy","lydia"]},{"key":"腓立比監獄","title":"腓立比監獄的地震","ref":"徒 16:16–40","summary":"保羅從一個被巫鬼附著的使女身上趕出鬼，她的主人失了財路，把保羅和西拉告到官府，兩人被棍打後下在監裡。半夜他們禱告唱詩，忽然地大震動、監門全開；獄卒以為囚犯逃走要自殺，保羅大聲喊住他，獄卒和全家就信主受洗。","people":["paul","silas"]},{"key":"亞略巴古","title":"保羅在雅典亞略巴古講道","ref":"徒 17:16–34","summary":"保羅在雅典看見滿城都是偶像，心裡著急。他站在亞略巴古當中，從一座寫著「未識之神」的壇講起，講到創造天地的神與死人復活；有人譏誚，也有幾個人信從了，其中有亞略巴古的官丟尼修。","people":["paul"]},{"key":"以弗所騷動","title":"以弗所的騷動","ref":"徒 19:1–41","summary":"保羅在以弗所傳道兩年多，許多行邪術的人把書拿來當眾燒掉。銀匠底米丟靠製造亞底米神的銀龕賺錢，擔心生意受損，就煽動同業，全城的人湧進戲園，喊了約兩小時「大哉！以弗所人的亞底米啊」，最後由城裡的書記把眾人安撫散去。","people":["paul"]},{"key":"猶推古墜樓","title":"猶推古從窗台掉下","ref":"徒 20:7–12","summary":"在特羅亞七日的第一日，門徒聚會擘餅，保羅講論直到半夜。坐在窗台上的少年人猶推古睡著了，從三層樓上掉下去，扶起來已經死了；保羅下去伏在他身上，說他的靈魂還在身上，有人把那童子活活地領來，大家得的安慰不小。","people":["paul"]},{"key":"耶路撒冷被捕","title":"保羅在耶路撒冷被捕","ref":"徒 21:17～23:35","summary":"保羅不顧眾人勸阻回到耶路撒冷，在聖殿被亞細亞來的猶太人指控帶外邦人進殿，群眾要殺他，羅馬千夫長出兵把他拘捕。保羅在營樓的臺階上向群眾講述自己歸主的經過，又因羅馬公民的身分免受鞭打；得知四十多人起誓要殺他後，千夫長連夜派兵把他送到該撒利亞的巡撫腓力斯那裡。","people":["paul","james-brother","felix-festus"]},{"key":"申訴上告","title":"在腓力斯、非斯都、亞基帕面前申訴","ref":"徒 24～26","summary":"保羅在該撒利亞被押了兩年，先後在巡撫腓力斯和非斯都面前申訴；非斯都想把他送回耶路撒冷受審，保羅就上告於該撒。亞基帕王聽完他的見證，說「你想少微一勸，便叫我作基督徒啊」，並認為他若沒有上告於該撒，就可以釋放了。","people":["paul","felix-festus","herod-agrippa"]},{"key":"船難馬耳他","title":"海上船難與馬耳他島","ref":"徒 27:1～28:10","summary":"保羅以囚犯身分由百夫長猶流押解坐船往羅馬，途中遇到名叫友拉革羅的狂風，多日不見太陽和星辰。保羅勸眾人放心吃飯，說船上的人一個也不會喪命；船擱淺破壞，全船二百七十六人都上了岸，到了馬耳他島。保羅在島上被毒蛇咬了卻沒事，又醫好了島長部百流的父親。","people":["paul"]},{"key":"抵達羅馬","title":"保羅到了羅馬","ref":"徒 28:11–31","summary":"過了三個月他們再坐船，終於到了羅馬，弟兄們遠到亞比烏市和三館來迎接保羅。保羅被准許和一個看守他的兵另住，他請來猶太人的首領講論神的國；之後他在自己所租的房子住了足足兩年，放膽傳講，並沒有人禁止，全書就停在這裡。","people":["paul"]}],"people":["peter","john","stephen","philip-evangelist","paul","ananias-damascus","barnabas","cornelius","james-brother","silas"],"verses":[{"ref":"徒 1:8","text":"但聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒馬利亞，直到地極，作我的見證。"},{"ref":"徒 4:12","text":"除他以外，別無拯救；因為在天下人間，沒有賜下別的名，我們可以靠著得救。"}]}},{"t":"nt","id":"romans","order":6,"name":"羅馬書","abbr":"羅","chapters":16,"group":"保羅書信","data":{"id":"romans","order":6,"name":"羅馬書","abbr":"羅","chapters":16,"group":"保羅書信","oneLine":"保羅寫給羅馬教會，完整說明他所傳的福音","background":{"author":"保羅（由德丟代筆寫下）","date":"約主後 56～57 年","audience":"羅馬城裡的信徒，有猶太人也有外邦人","place":"可能在哥林多（第三次旅行途中）","why":"保羅還沒去過羅馬，正準備把馬其頓和亞該亞信徒的捐款送到耶路撒冷，之後要經過羅馬往西班牙去。他先寫這封信介紹自己所傳的福音，也談到羅馬教會裡猶太與外邦信徒怎麼彼此接納。"},"revelations":[{"key":"福音的大能","point":"福音是神的大能，要救一切相信的人。","explain":"保羅一開頭就說他不以福音為恥，因為福音對猶太人和希臘人都一樣。全書就是在展開這一句。","ref":"羅 1:16–17"},{"key":"世人都犯罪","point":"不論猶太人或外邦人，都在罪之下。","explain":"1～3 章先講外邦人，再講有律法的猶太人，結論是「世人都犯了罪，虧缺了神的榮耀」，沒有人能靠自己站得住。","ref":"羅 1:18～3:23"},{"key":"因信稱義","point":"人得稱為義是因著信，不是靠行律法。","explain":"保羅說神藉著基督耶穌的救贖，白白地稱人為義。他用亞伯拉罕在受割禮以前就因信被算為義，來說明這件事。","ref":"羅 3:21～4:25"},{"key":"聖靈裡的生命","point":"在基督裡的人不再被定罪，靠聖靈過新生活。","explain":"6～8 章談信徒向罪死、在基督裡活。第 8 章從不定罪講到聖靈的幫助，結尾說沒有任何事能叫人與神的愛隔絕。","ref":"羅 6～8"},{"key":"以色列的盼望","point":"神沒有丟棄以色列，救恩包含猶太人和外邦人。","explain":"9～11 章保羅為同胞憂愁，用橄欖樹接枝的比喻說明外邦人被接上，也說神的恩賜和選召是沒有後悔的。","ref":"羅 9～11"},{"key":"獻上活祭","point":"明白恩典之後，生活的回應是把自己獻給神。","explain":"12 章起轉入實際生活：心意更新、彼此相愛、順服掌權的；在飲食和守日的事上，強的和軟弱的要彼此接納。","ref":"羅 12～15"}],"outline":[{"key":"問安與主題","range":"1:1–17","point":"保羅自我介紹，說明想去羅馬，並點出全書主題：福音是神的大能。"},{"key":"全人有罪","range":"1:18～3:20","point":"外邦人和猶太人都犯了罪，律法只叫人知罪。"},{"key":"稱義之道","range":"3:21～5:21","point":"神藉著基督使人因信稱義，亞伯拉罕是例證，亞當與基督作對照。"},{"key":"新的生命","range":"6～8 章","point":"信徒向罪死、向神活，靠聖靈勝過肉體，沒有甚麼能叫人與神的愛隔絕。"},{"key":"神與以色列","range":"9～11 章","point":"討論以色列人為何多數不信，以及神對以色列的計畫。"},{"key":"生活實踐","range":"12:1～15:13","point":"獻上活祭、彼此相愛、順服掌權的、強弱彼此接納。"},{"key":"行程與問安","range":"15:14～16:27","point":"說明往耶路撒冷、羅馬、西班牙的計畫，並問候羅馬的許多同工。"}],"stories":[{"key":"寫信緣由","title":"寫羅馬書的故事","ref":"羅 15:22–33","summary":"羅馬是帝國的首都，那裡的教會不是保羅建立的，裡面有猶太和外邦信徒；保羅多次想去都被攔阻。他寫信時大約在哥林多，正要把馬其頓和亞該亞信徒捐給耶路撒冷窮信徒的錢送去，計畫之後經過羅馬再往西班牙，所以先寫這封信完整說明他傳的福音。信由德丟代筆，信末推薦堅革哩教會的女執事非比，並問候百基拉、亞居拉等許多人。","people":["paul","priscilla-aquila","timothy"]},{"key":"亞伯拉罕","title":"亞伯拉罕因信稱義","ref":"羅 4:1–25","summary":"保羅用以色列人的祖先亞伯拉罕當例子：經上說亞伯拉罕信神，這就算為他的義，而且是在他受割禮以前。所以亞伯拉罕不只是受割禮之人的父，也是一切相信之人的父。","people":["paul"]},{"key":"愛不能隔絕","title":"在基督裡不定罪（羅馬書 8 章）","ref":"羅 8:1–39","summary":"第 8 章從「在基督耶穌裡的就不定罪了」開始，講聖靈幫助人的軟弱，受造之物也都切望等候神的眾子顯出來。結尾保羅列出死、生、天使、掌權的、有能的、現在的事、將來的事、高處的、低處的，說這一切都不能叫人與神的愛隔絕。","people":["paul"]},{"key":"心意更新","title":"獻上活祭與彼此相愛（羅馬書 12 章）","ref":"羅 12:1–21","summary":"保羅勸信徒把身體獻上當作活祭，不要效法這個世界，只要心意更新而變化。他用一個身體有許多肢體來比喻教會裡不同的恩賜，接著列出具體的愛：與喜樂的人同樂，與哀哭的人同哭，不要以惡報惡，反要以善勝惡。","people":["paul"]}],"people":["paul","priscilla-aquila","timothy"],"verses":[{"ref":"羅 1:16","text":"我不以福音為恥；這福音本是神的大能，要救一切相信的，先是猶太人，後是希臘人。"},{"ref":"羅 8:28","text":"我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。"},{"ref":"羅 12:2","text":"不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。"}]}},{"t":"nt","id":"1corinthians","order":7,"name":"哥林多前書","abbr":"林前","chapters":16,"group":"保羅書信","data":{"id":"1corinthians","order":7,"name":"哥林多前書","abbr":"林前","chapters":16,"group":"保羅書信","oneLine":"保羅寫信處理哥林多教會的分黨與各種問題","background":{"author":"保羅（與所提尼一同具名）","date":"約主後 53～55 年","audience":"哥林多的教會","place":"以弗所","why":"保羅第二次旅行時在哥林多住了一年半，建立了教會。幾年後他在以弗所聽革來氏家裡的人說教會分黨，教會也寫信來問婚姻、祭偶像之物等問題，他就寫這封信逐一回答。"},"revelations":[{"key":"十字架的道","point":"被釘十字架的基督，是神的能力和智慧。","explain":"哥林多人看重口才和智慧，保羅說十字架的道理在滅亡的人看是愚拙，在得救的人卻是神的大能。他刻意不用高言大智傳道。","ref":"林前 1:18～2:5"},{"key":"不要分黨","point":"教會屬於基督，不屬於哪一位領袖。","explain":"有人說「我是屬保羅的」「我是屬亞波羅的」「我是屬磯法的」。保羅說栽種的、澆灌的都算不得甚麼，只在那叫他生長的神。","ref":"林前 1:10–17；3:1–9"},{"key":"身子是聖殿","point":"身體屬於神，要用來榮耀神。","explain":"教會裡出現淫亂的事，保羅提醒信徒身子是聖靈的殿，是重價買來的，所以要在身子上榮耀神。","ref":"林前 6:12–20"},{"key":"為人讓步","point":"自由要用來造就人，不絆倒軟弱的人。","explain":"談到祭偶像之物，保羅說知識叫人自高自大，惟有愛心能造就人；他寧可不吃肉，也不叫弟兄跌倒。","ref":"林前 8～10"},{"key":"愛最大","point":"一切恩賜若沒有愛，就算不得甚麼。","explain":"保羅把 13 章放在談恩賜的 12 章和 14 章中間：說方言、作先知、捨己都比不上愛。信、望、愛三樣常存，其中最大的是愛。","ref":"林前 12～14"},{"key":"復活的盼望","point":"基督若沒有復活，信仰就是枉然。","explain":"有人說沒有死人復活，保羅列出復活的基督向磯法、十二使徒、五百多弟兄、雅各、眾使徒和他自己顯現，並說將來死人要復活成為不朽壞的。","ref":"林前 15"}],"outline":[{"key":"教會分黨","range":"1～4 章","point":"信徒各自擁護不同領袖，保羅用十字架的道理和同工的比喻回應。"},{"key":"淫亂與訴訟","range":"5～6 章","point":"處理教會裡的淫亂和弟兄告到外人面前的事。"},{"key":"婚姻問答","range":"7 章","point":"回答教會來信問的婚姻、守獨身和離婚問題。"},{"key":"祭偶像之物","range":"8～10 章","point":"能不能吃祭過偶像的食物；保羅以自己放下權利為例。"},{"key":"聚會與恩賜","range":"11～14 章","point":"談聚會的次序、主的晚餐、屬靈恩賜，以及愛的篇章。"},{"key":"論復活","range":"15 章","point":"基督已經復活，信徒將來也要復活。"},{"key":"捐款問安","range":"16 章","point":"為耶路撒冷聖徒收捐款，說明行程並問安。"}],"stories":[{"key":"寫信緣由","title":"寫哥林多前書的故事","ref":"林前 1:10–12；16:5–9","summary":"哥林多位在希臘南部的地峽上，兩邊都有港口，是羅馬的殖民城、亞該亞省的大城，商旅往來頻繁，廟宇很多。保羅第二次旅行時在這裡住了一年半，和織帳棚的亞居拉、百基拉同住同工，建立了教會（見徒 18）。幾年後他在以弗所聽說教會分黨、有淫亂和訴訟的事，教會又寫信來問問題，他就寫了這封信，並計畫在以弗所住到五旬節，再經馬其頓去看他們。","people":["paul","priscilla-aquila","apollos"]},{"key":"身體與肢體","title":"一個身體，許多肢體（12 章）","ref":"林前 12:12–31","summary":"保羅說各人的恩賜不同，卻是同一位聖靈所賜。他用身體作比喻：身子不是一個肢體，乃是許多肢體，眼不能對手說「我用不著你」，人以為軟弱的肢體更是不可少的；一個肢體受苦，所有的肢體就一同受苦。","people":["paul"]},{"key":"愛的篇章","title":"愛的篇章（13 章）","ref":"林前 13:1–13","summary":"保羅說，就算能說萬人的方言、有全備的信叫我能夠移山，卻沒有愛，就算不得甚麼。接著他描寫愛是恆久忍耐、又有恩慈，不嫉妒、不自誇，凡事包容、凡事相信、凡事盼望、凡事忍耐，愛是永不止息。最後說信、望、愛三樣常存，其中最大的是愛。","people":["paul"]},{"key":"復活的身體","title":"基督復活與將來的復活（15 章）","ref":"林前 15:1–58","summary":"保羅先重述他所領受的福音：基督照聖經所說為我們的罪死了，而且埋葬了，又照聖經所說第三天復活了，並向許多人顯現。他說基督若沒有復活，所傳的便是枉然；接著用種子落地的比喻說明復活的身體，最後宣告死被得勝吞滅。","people":["paul","peter","jesus"]}],"people":["paul","apollos","peter","priscilla-aquila","timothy"],"verses":[{"ref":"林前 1:18","text":"因為十字架的道理，在那滅亡的人為愚拙；在我們得救的人，卻為神的大能。"},{"ref":"林前 13:4–7","text":"愛是恆久忍耐，又有恩慈；愛是不嫉妒；愛是不自誇，不張狂，不做害羞的事，不求自己的益處，不輕易發怒，不計算人的惡，不喜歡不義，只喜歡真理；凡事包容，凡事相信，凡事盼望，凡事忍耐。"},{"ref":"林前 13:13","text":"如今常存的有信，有望，有愛這三樣，其中最大的是愛。"}]}},{"t":"nt","id":"2corinthians","order":8,"name":"哥林多後書","abbr":"林後","chapters":13,"group":"保羅書信","data":{"id":"2corinthians","order":8,"name":"哥林多後書","abbr":"林後","chapters":13,"group":"保羅書信","oneLine":"保羅在受苦與被質疑中，說明真正的服事","background":{"author":"保羅（與提摩太一同具名）","date":"約主後 55～56 年","audience":"哥林多的教會和亞該亞各地的聖徒","place":"馬其頓","why":"寫完前書之後，保羅和哥林多教會的關係一度緊張，他曾含著眼淚寫了一封信。後來提多在馬其頓帶來教會悔改的好消息，保羅寫這封信表達安慰，同時回應質疑他使徒身分的人，並預備為耶路撒冷收捐款。"},"revelations":[{"key":"患難中安慰","point":"神在患難中安慰人，好叫人能去安慰別人。","explain":"保羅一開頭就說他在亞細亞遭遇的苦難重到連活命的指望都絕了；他從中經歷神的安慰，也把這安慰帶給同受苦難的人。","ref":"林後 1:3–11"},{"key":"軟弱顯能力","point":"神的能力在人的
