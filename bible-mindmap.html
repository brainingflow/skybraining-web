–23","story":null},{"book":"isaiah","ref":"賽 36:1～37:38","story":"亞述圍城"}],"common":"西拿基立派人恐嚇耶路撒冷，耶和華的使者擊殺亞述軍，他回國後被兒子殺了。","diffs":[{"book":"2kings","text":"記希西家認罪，交出銀子三百他連得、金子三十他連得。","ref":"王下 18:14–16"},{"book":"2kings","text":"記使者在亞述營中殺了十八萬五千人。","ref":"王下 19:35"},{"book":"2chronicles","text":"記希西家塞住城外的泉源、修築城牆，與以賽亞一同禱告。","ref":"代下 32:3–5、20"},{"book":"2chronicles","text":"說使者滅了大能的勇士和官長、將帥，沒有記人數。","ref":"代下 32:21"},{"book":"isaiah","text":"記殺了十八萬五千人，沒有記希西家交出金銀的事。","ref":"賽 36:1–2；37:36"}]},{"id":"hezekiah-illness","title":"希西家病得醫治","passages":[{"book":"2kings","ref":"王下 20:1–11","story":"日影後退"},{"book":"2chronicles","ref":"代下 32:24–26","story":null},{"book":"isaiah","ref":"賽 38:1–22","story":"日影後退"}],"common":"希西家病得要死，他禱告，耶和華應允他，並賜他一個兆頭。","diffs":[{"book":"2kings","text":"記希西家自己選日影往後退十度，並用無花果餅貼瘡。","ref":"王下 20:7–11"},{"book":"2chronicles","text":"只用一句記病和兆頭，又說他心裡驕傲，後來自卑。","ref":"代下 32:24–26"},{"book":"isaiah","text":"收了希西家痊癒後所作的詩。","ref":"賽 38:9–20"},{"book":"isaiah","text":"無花果餅的事記在這章末了。","ref":"賽 38:21"}]},{"id":"babylonian-envoys","title":"巴比倫使者來訪","passages":[{"book":"2kings","ref":"王下 20:12–19","story":"日影後退"},{"book":"2chronicles","ref":"代下 32:31","story":null},{"book":"isaiah","ref":"賽 39:1–8","story":"巴比倫使者"}],"common":"巴比倫王的使者來見希西家。","diffs":[{"book":"2kings","text":"記希西家把寶庫都給使者看，以賽亞預言都要被擄到巴比倫。","ref":"王下 20:13、17"},{"book":"2chronicles","text":"說使者來「訪問國中所現的奇事」，「神離開他，要試驗他」。","ref":"代下 32:31"},{"book":"isaiah","text":"說「希西家喜歡見使者」，就把寶庫都給他們看。","ref":"賽 39:2"}]},{"id":"manasseh","title":"瑪拿西作王","passages":[{"book":"2kings","ref":"王下 21:1–18","story":"瑪拿西"},{"book":"2chronicles","ref":"代下 33:1–20","story":"瑪拿西悔改"}],"common":"瑪拿西十二歲登基，作王五十五年，行耶和華眼中看為惡的事。","diffs":[{"book":"2kings","text":"記他流許多無辜人的血，沒有記他被擄或悔改。","ref":"王下 21:16"},{"book":"2kings","text":"記他母親名叫協西巴，他葬在烏撒的園內。","ref":"王下 21:1、18"},{"book":"2chronicles","text":"記他被鉤住、用銅鍊鎖著帶到巴比倫，在急難中自卑禱告。","ref":"代下 33:11–13"},{"book":"2chronicles","text":"記他歸回後除掉外邦神像，重修耶和華的祭壇。","ref":"代下 33:15–16"}]},{"id":"josiah-refor <script>(function CLIENT() {
  'use strict';
  var errBox = document.getElementById('nt-err');
  window.addEventListener('error', function (e) { if (errBox) errBox.textContent += 'ERR ' + e.message + '\n'; });
  const D = JSON.parse(document.getElementById('nt-data').textContent);
  const PALETTE = ['#E53935', '#F57C00', '#2E9D45', '#1E7FD8', '#8E3FB5', '#00897B', '#D81B60'];
  const FONT = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BOOK = {}; D.books.forEach(b => { BOOK[b.id] = b; });
  const PERSON = {}; D.people.forEach(p => { PERSON[p.id] = p; });
  const TS = D.testaments.filter(t => t.ready);
  const TEST = {}; D.testaments.forEach(t => { TEST[t.id] = t; });
  const multi = TS.length > 1;
  const SITE = '聖經心智圖｜強腦力 SkyBraining';
  const HOME_TITLE = document.title;
  const pname = id => PERSON[id] ? ((PERSON[id].data && PERSON[id].data.name) || PERSON[id].name) : id;
  const wide = () => window.matchMedia('(min-width: 1100px)').matches;
  const app = $('#app');
  let NOSCROLL = false;   // 測試截圖用：#…?noscroll=1 不自動捲動

  // ---------- 量字寬 ----------
  const mctx = document.createElement('canvas').getContext('2d');
  const wcache = {};
  function tw(s, size, weight) {
    const k = size + '|' + weight + '|' + s;
    if (wcache[k] == null) { mctx.font = (weight || 400) + ' ' + size + 'px ' + FONT; wcache[k] = mctx.measureText(String(s)).width; }
    return wcache[k];
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 由粗到細的曲線（取自 mindmap.cjs 的作法）
  function taper(p0, p1, p2, p3, w0, w1) {
    const N = 28, L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, mt = 1 - t;
      const x = mt * mt * mt * p0[0] + 3 * mt * mt * t * p1[0] + 3 * mt * t * t * p2[0] + t * t * t * p3[0];
      const y = mt * mt * mt * p0[1] + 3 * mt * mt * t * p1[1] + 3 * mt * t * t * p2[1] + t * t * t * p3[1];
      const dx = 3 * mt * mt * (p1[0] - p0[0]) + 6 * mt * t * (p2[0] - p1[0]) + 3 * t * t * (p3[0] - p2[0]);
      const dy = 3 * mt * mt * (p1[1] - p0[1]) + 6 * mt * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1]);
      const len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
      const w = (w0 + (w1 - w0) * t) / 2;
      L.push([x + nx * w, y + ny * w]); R.push([x - nx * w, y - ny * w]);
    }
    return 'M' + L.concat(R.reverse()).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
  }
  const line = (a, b, w0, w1) => taper(a, [a[0] + (b[0] - a[0]) / 3, a[1]], [a[0] + 2 * (b[0] - a[0]) / 3, b[1]], b, w0, w1);

  // ---------- 心智圖排版 ----------
  // model: { center, cap, trunkFont, trunks:[{label, k?(點了直接看內容), children:[{label,k,dim}]}] }
  function prep(model, st) {
    const cap = model.cap || 6;
    return model.trunks.map((t, i) => {
      const kids = t.children || [];
      const mode = st.open[i] || 'default';
      let vis;
      if (mode === 'closed') vis = [];
      else if (kids.length <= cap + 1) vis = kids.slice();
      else if (mode === 'all') vis = kids.concat([{ label: '收起', k: 'S:' + i, more: 1 }]);
      else vis = kids.slice(0, cap).concat([{ label: '＋' + (kids.length - cap), k: 'M:' + i, more: 1, mark: kids.slice(cap).some(c => c.mark) }]);
      return { t, i, kids: vis, hidden: mode === 'closed' ? kids.length : 0, color: PALETTE[i % PALETTE.length], rows: Math.max(1, vis.length) };
    });
  }
  function newOut() { return { paths: [], texts: [], hits: [], sels: [], dots: [], minX: Infinity, maxX: -Infinity }; }
  function ext(o, a, b) { o.minX = Math.min(o.minX, a, b); o.maxX = Math.max(o.maxX, a, b); }

  // 畫一條主幹（底線＋字）與它的分支；連到中心的線由呼叫端畫
  function trunkAndKids(o, T, dir, sx, ny, yTop, F, rowH, st, kidGapMax) {
    const pad = F.pad;
    const lw0 = tw(T.t.label, F.t, 800);
    const badge = T.hidden ? '＋' + T.hidden : '';
    const bw = badge ? tw(badge, F.k, 700) + 6 : 0;
    const lw = lw0 + bw + 2 * pad;
    const ex = sx + dir * lw;
    const uw = F.tw1;
    o.paths.push({ d: line([sx, ny], [ex, ny], uw, uw * 0.65), c: T.color });
    const tx = Math.min(sx, ex) + pad, ty = ny - uw / 2 - 4;
    const tk = T.t.k || ('T:' + T.i);
    if (st.sel && st.sel === T.t.k) o.sels.push({ x: tx - 5, y: ty - F.t - 1, w: lw0 + 10, h: F.t + 9, c: T.color });
    o.texts.push({ x: tx, y: ty, s: F.t, w: 800, c: T.color, t: T.t.label });
    if (badge) o.texts.push({ x: tx + lw0 + 6, y: ty, s: F.k, w: 700, c: T.color, t: badge });
    o.hits.push({ x: Math.min(sx, ex) - 4, y: ny - F.t - 12, w: lw + 8, h: F.t + 20, k: tk });
    ext(o, sx, ex);
    if (!T.kids.length) return;
    let maxOff = 0;
    const kys = T.kids.map((c, j) => { const ky = yTop + (j + 1) * rowH - F.rowBase; maxOff = Math.max(maxOff, Math.abs(ky - ny)); return ky; });
    const g1 = clamp(maxOff * 0.3, F.kidGapMin, kidGapMax);
    T.kids.forEach((c, j) => {
      const ky = kys[j];
      const ksx = ex + dir * g1;
      const wgt = c.more ? 700 : 600;
      const kw0 = tw(c.label, F.k, wgt);
      const dot = F.dots && c.mark;
      const kw = kw0 + 2 * pad + (dot ? 10 : 0);

  // 現行譯名後面加小字「（舊譯…）」：每個 annotator 內同一詞只註一次；引號「」『』內不註，改註在引號收尾後；整個複合詞（撒馬利亞婦人、約旦河…）後面才接

  function pageNames() {
    app.innerHTML = '<header class="phead"><h1>新舊譯名對照</h1><p class="lead">這裡用的是信望愛站和合本的現行譯名；右欄是你可能比較熟的舊譯名。</p></header>' +
      '<table class="names"><thead><tr><th scope="col">現行譯名</th><th scope="col">舊譯名</th></tr></thead><tbody>' + NM.map(n => '<tr><td>' + esc(n[0]) + '</td><td>' + esc(n[1]) + '</td></tr>').join('') + '</tbody></table>';
  }

  // 頁內搜尋共用：每列 data-s，分組數字跟著變，無結果給提示
  function listFilter(input, rowSel, groupSel, none, unit) {
    const run = () => {
      const q = input.value.trim().toLowerCase();
      let total = 0;
      document.querySelectorAll(groupSel).forEach(g => {
        let n = 0;
        g.querySelectorAll(rowSel).forEach(r => { const vis = !q || r.dataset.s.indexOf(q) >= 0; r.hidden = !vis; if (vis) n++; });
        g.hidden = !n; $('.cnt', g).textContent = n + ' ' + unit; total += n;
      });
      none.hidden = !!total;
      none.textContent = total ? '' : '找不到「' + input.value.trim() + '」，換個關鍵詞試試';
    };
    input.addEventListener('input', run);
    run();
  }

  function pageCompare() {
    app.innerHTML = '<header class="phead"><h1>對照經文</h1><p class="lead">有些事不只一卷有記，也有幾段記載很相近。這裡把 ' + CMP.length + ' 件的各卷出處並排，你點一件，就能一次看出各卷寫法哪裡不同。</p>' + CMP_NOTE + '</header>' +
      '<input id="cq" class="pq" type="search" placeholder="打事件名、書卷名或章節" autocomplete="off" aria-label="搜尋對照經文">' +
      '<p class="muted cnone" hidden></p>' +
      (D.compare || []).map(sec => '<section class="cgroup"><h2 class="sec">' + esc(sec.name) + ' <span class="cnt"></span></h2><ol class="clist">' + sec.events.map(e => {
        const key = withOld([e.title].concat(e.passages.map(p => BOOK[p.book].name + ' ' + BOOK[p.book].abbr + ' ' + p.ref)).join(' ')).toLowerCase();
        return '<li class="crow" data-s="' + esc(key) + '"><button type="button" class="crowb" aria-expanded="false" data-ev="' + esc(e.id) + '"><b>' + esc(e.title) + '</b><span class="crefs">' + e.passages.map(p => esc(p.ref)).join('｜') + '</span></button><div class="cmpbox" hidden></div></li>';
      }).join('') + '</ol></section>').join('');
    listFilter($('#cq'), '.crow', '.cgroup', $('.cnone', app), '件');
  }

  const KINDS = [['城市', ['city']], ['地區與古國', ['region', 'kingdom']], ['山', ['mountain']], ['河海島', ['river', 'sea', 'island']], ['其他', null]];
  function pagePlaces(params) {
    const known = [].concat.apply([], KINDS.map(k => k[1] || []));
    const row = p => '<tr class="plrow" id="pl-' + esc(p.id) + '" data-s="' + esc([p.name, p.old, p.today, p.where].join(' ').toLowerCase()) + '">' +
      '<th scope="row"><b>' + placeName(p) + '</b></th><td class="plt">' + esc(p.today) + '</td><td class="plw">' + esc(p.where) + '</td>' +
      '<td class="plc">' + (p.certainty === '確定' ? '<span class="cert ok">確定</span>' : certTag(p)) + '</td>' +
      '<td class="plm"><a href="' + esc(mapUrl(p)) + '" target="_blank" rel="noopener" title="在 Google 地圖開新分頁">在地圖上打開</a></td></tr>';
    app.innerHTML = '<header class="phead"><h1>地名一覽</h1><p class="lead">聖經裡常出現的 ' + PL.length + ' 個地名，今天在哪裡？你點「在地圖上打開」，就能直接看到位置。</p><p class="cnote">位置依公開資料整理；標「傳統上認為」的沒有定論。</p></header>' +
      '<input id="plq" class="pq" type="search" placeholder="打地名、舊譯名或今天的地名" autocomplete="off" aria-label="搜尋地名">' +
      '<p class="muted plnone" hidden></p>' +
      KINDS.map(k => {
        const ps = PL.filter(p => k[1] ? k[1].indexOf(p.kind) >= 0 : known.indexOf(p.kind) < 0);
        if (!ps.length) return '';
        return '<section class="plgroup"><h2 class="sec">' + esc(k[0]) + ' <span class="cnt"></span></h2><table class="pltab"><thead><tr><th scope="col">地名</th><th scope="col">今天在哪</th><th scope="col">位置</th><th scope="col">確定程度</th><th scope="col">地圖</th></tr></thead><tbody>' + ps.map(row).join('') + '</tbody></table></section>';
      }).join('');
    listFilter($('#plq'), '.plrow', '.plgroup', $('.plnone', app), '處');
    const want = params.get('p');
    const tgt = want && document.getElementById('pl-' + want);
    if (tgt) setTimeout(() => { tgt.scrollIntoView({ block: 'center' }); flash(tgt); }, 0);
    else window.scrollTo(0, 0);
  }

  // ---------- 導覽、書卷抽屜、搜尋 ----------
  $('#drawer').innerHTML = TS.map(t => t.groups.map(g => '<div class="dg"><div class="dgt">' + esc((multi ? t.name + '｜' : '') + g) + '</div>' + booksOf(t).filter(b => b.group === g).map(b => '<a href="#book/' + b.id + '">' + esc(b.name) + '</a>').join('') + '</div>').join('')).join('');
  $('#books-btn').onclick = e => { e.stopPropagation(); const d = $('#drawer'); d.hidden = !d.hidden; $('#books-btn').setAttribute('aria-expanded', String(!d.hidden)); };
  document.addEventListener('click', e => {
    if (!e.target.closest('#drawer') && !e.target.closest('#books-btn')) $('#drawer').hidden = true;
    if (!e.target.closest('.search')) $('#results').hidden = true;
  });
  const IDX = [];
  D.books.forEach(b => {
    IDX.push({ t: b.name, s: '書卷｜' + b.abbr, h: '#book/' + b.id, x: withOld(b.name + b.abbr + b.id + (b.data ? Object.keys(BG_LABEL).map(f => b.data.background[f]).join(' ') : '')) });
    if (!b.data) return;
    b.data.revelations.forEach((r, i) => IDX.push({ t: r.key, s: b.name + '｜重要啟示', h: '#book/' + b.id + '?sel=rev-' + i, x: withOld(r.key + r.point + r.explain + (r.note || '')) }));
    b.data.outline.forEach((r, i) => IDX.push({ t: r.key, s: b.name + '｜故事流程', h: '#book/' + b.id + '?sel=out-' + i, x: withOld(r.key + r.point + (r.note || '')) }));
    b.data.stories.forEach((r, i) => IDX.push({ t: r.title || r.key, s: b.name + '｜知名故事', h: '#book/' + b.id + '?sel=sto-' + i, x: withOld(r.key + r.title + r.summary + (r.note || '')) }));
  });
  D.people.forEach(p => {
    IDX.push({ t: pname(p.id), s: '人物' + (p.data && p.data.aka ? '｜' + p.data.aka : ''), h: '#person/' + p.id, x: withOld(p.full + (p.data ? p.data.name + (p.data.aka || '') + p.data.role + p.data.ending : '')) });
    if (p.data) p.data.life.forEach((l, i) => IDX.push({ t: l.key, s: pname(p.id) + '｜生平', h: '#person/' + p.id + '?sel=life-' + i, x: withOld(l.key + l.event + (l.note || '')) }));
  });
  const q = $('#q'), res = $('#results');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    if (!v) { res.hidden = true; return; }
    const score = it => it.t === v ? 0 : (it.t.indexOf(v) === 0 ? 1 : (it.t.indexOf(v) >= 0 ? 2 : 3));
    const hit = IDX.filter(it => it.x.toLowerCase().indexOf(v) >= 0).map((it, i) => [score(it), i, it]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(a => a[2]).slice(0, 40);
    res.innerHTML = hit.length ? hit.map(it => '<a href="' + esc(it.h) + '"><b>' + esc(it.t) + '</b><span>' + esc(it.s) + '</span></a>').join('') : '<div class="none">找不到「' + esc(q.value) + '」，換個關鍵詞試試</div>';
    res.hidden = false;
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('a', res); if (a) { location.hash = a.getAttribute('href'); res.hidden = true; q.blur(); } } });
  res.addEventListener('click', e => { if (e.target.closest('a')) { res.hidden = true; q.value = ''; } });

  // ---------- 路由 ----------
  let LASTP = '';
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  const hero = $('#hero'), HERO_HTML = hero ? hero.innerHTML : '';
  function showHero(on) {
    if (!hero) return;
    if (on && !hero.innerHTML) hero.innerHTML = HERO_HTML;
    if (!on) hero.innerHTML = '';
    hero.hidden = !on;
  }
  function route() {
    MAPS.length = 0;
    closePlace();
    if (LASTP === 'people') PST.y = window.scrollY;
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const qi = h.indexOf('?');
    const path = qi >= 0 ? h.slice(0, qi) : h;
    const params = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : '');
    const parts = path.split('/');
    NOSCROLL = !!params.get('noscroll');
    document.querySelectorAll('.topnav [data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (parts[0] || 'home')));
    showHero(['book', 'people', 'person', 'names', 'compare', 'places'].indexOf(parts[0]) < 0);
    if (parts[0] === 'book') pageBook(parts[1], params);
    else if (parts[0] === 'people') pagePeople();
    else if (parts[0] === 'person') pagePerson(parts[1], params);
    else if (parts[0] === 'names') pageNames();
    else if (parts[0] === 'compare') pageCompare();
    else if (parts[0] === 'places') pagePlaces(params);
    else pageHome();
    if (parts[0] === 'people' && LASTP === 'person' && PST.y != null) window.scrollTo(0, PST.y);
    else if (!params.get('sel') && !params.get('p')) window.scrollTo(0, 0);
    LASTP = parts[0] || 'home';
    $('#drawer').hidden = true;
    const t = parts[0] === 'book' && BOOK[parts[1]] ? BOOK[parts[1]].name : parts[0] === 'person' && PERSON[parts[1]] ? pname(parts[1]) : parts[0] === 'people' ? '人物' : parts[0] === 'names' ? '新舊譯名對照' : parts[0] === 'compare' ? '對照經文' : parts[0] === 'places' ? '地名一覽' : '';
    document.title = t ? t + '｜' + SITE : HOME_TITLE;
  }
  window.addEventListener('hashchange', route);
  route();
})();</script>
</body>
</html>
