<script id="nt-data" type="application/json">{"testaments":[{"id":"ot","name":"舊約","count":39,"people":64,"ready":true,"groups":["律法書","歷史書","詩歌智慧書","大先知書","小先知書"],"eras":[{"id":"patriarch","short":"族長時代","label":"族長時代"},{"id":"exodus","short":"出埃及與進迦南","label":"出埃及與進迦南"},{"id":"judges","short":"士師時代","label":"士師時代"},{"id":"kingdom","short":"統一王國","label":"統一王國"},{"id":"divided","short":"分裂王國","label":"分裂王國"},{"id":"prophet","short":"寫書的先知","label":"寫書的先知"},{"id":"exile","short":"被擄與歸回","label":"被擄與歸回"},{"id":"wisdom","short":"智慧書","label":"智慧書"}]},{"id":"nt","name":"新約","count":27,"people":42,"ready":true,"groups":["福音書","歷史書","保羅書信","普通書信","啟示文學"],"eras":[{"id":"gospel","short":"福音書時代","label":"福音書時代"},{"id":"church","short":"教會時代","label":"教會時代（使徒行傳與書信）"}]}],"books":[{"t":"ot","id":"genesis","order":1,"name":"創世記","abbr":"創","chapters":50,"group":"律法書","data":{"id":"genesis","order":1,"name":"創世記","abbr":"創","chapters":50,"group":"律法書","oneLine":"從神創造天地，寫到以色列一家住進埃及","background":{"author":"傳統上認為是摩西所寫，也有不同看法","date":"傳統上認為成書於摩西時代（約主前 15～13 世紀），也有不同看法","audience":"出埃及後在曠野的以色列人，也寫給後代","place":"不確定，傳統上認為在曠野","why":"這卷書交代世界、人類和以色列民族從哪裡來。前 11 章寫創造、墮落、洪水與列國分散；12 章起聚焦一個家族，從亞伯拉罕蒙召，經過以撒、雅各，一直寫到約瑟把全家接到埃及。傳統上推算族長時代約在主前 2000 年前後，也有不同看法。"},"revelations":[{"key":"神創造萬有","point":"天地萬物都出於神的創造，而且起初都甚好。","explain":"全書第一句就是「起初，神創造天地」。第 1 章用六日的次序寫神說有就有，第七日安息，每段都以「神看著是好的」作結。","ref":"創 1:1～2:3"},{"key":"神的形像","point":"人是照著神的形像造的，受託管理全地。","explain":"神照著自己的形像造男造女，賜福給他們，叫他們生養眾多、治理這地。這是人在萬物中的特殊位置。","ref":"創 1:26–28"},{"key":"罪的擴散","point":"人違背神之後，罪一路擴散到全地。","explain":"從亞當夏娃吃禁果、該隱殺弟，到洪水前「終日所思想的盡都是惡」，再到巴別塔，3～11 章寫罪怎樣從一個人擴散到整個人類。","ref":"創 3～11"},{"key":"揀選與應許","point":"神揀選亞伯拉罕，要藉他使萬族得福。","explain":"神應許亞伯蘭：使他成為大國、賜他迦南地、地上萬族要因他得福。後面的以撒、雅各、約瑟，都是這個應許一代一代傳下去的故事。","ref":"創 12:1–3"},{"key":"信算為義","point":"亞伯蘭信耶和華，耶和華就以此為他的義。","explain":"神帶亞伯蘭到外面數天上的星，說他的後裔也要這樣多，他就信了。新約在羅 4:3、加 3:6 引用這一節。","ref":"創 15:5–6"},{"key":"立約的神","point":"神主動和人立約，並親自守約。","explain":"神與挪亞立彩虹之約，與亞伯拉罕劈開牲畜立約，又以割禮作立約的記號。全書一再寫到神記念他的約。","ref":"創 9:8–17；15；17"},{"key":"神掌管歷史","point":"人的惡意擋不住神的計畫。","explain":"約瑟被哥哥們賣到埃及，最後卻在饑荒中保全了全家。他對哥哥們說：你們的意思是要害我，但神的意思原是好的。","ref":"創 45:5–8；50:20"}],"outline":[{"key":"創造世界","range":"1～2 章","point":"神六日創造天地，第七日安息；耶和華神造人，安置在伊甸園。"},{"key":"墮落與洪水","range":"3～9 章","point":"人吃了禁果被趕出伊甸，罪惡增多，神用洪水審判，只保全挪亞一家。"},{"key":"列國分散","range":"10～11 章","point":"挪亞的後代分散成列國，巴別塔之後口音被變亂，最後帶到亞伯蘭的家族。"},{"key":"亞伯拉罕","range":"12:1～25:18","point":"亞伯拉罕蒙召進迦南，神與他立約，晚年得兒子以撒，並在摩利亞山經歷考驗。"},{"key":"以撒與雅各","range":"25:19～36 章","point":"以撒的雙生子以掃與雅各相爭，雅各逃到哈蘭成家，回來後改名以色列。"},{"key":"約瑟的故事","range":"37～50 章","point":"約瑟被賣到埃及，從奴隸、囚犯成為宰相，饑荒中把全家接到埃及。"}],"stories":[{"key":"六日創造","title":"神創造天地","ref":"創 1:1～2:3","summary":"起初神創造天地，神說要有光，就有了光。六日之中，神造了光、天空、陸地與植物、日月星辰、魚和鳥、走獸與人，第七日安息，並賜福給第七日，定為聖日。","people":["adam-eve"]},{"key":"伊甸園","title":"伊甸園與吃禁果","ref":"創 2:4～3:24","summary":"耶和華神用地上的塵土造人，把他安置在伊甸園，吩咐他不可吃分別善惡樹上的果子，又用他的肋骨造了女人。蛇引誘女人，她和丈夫都吃了，眼睛就明亮，知道自己赤身露體。神把他們趕出伊甸園，在園子東邊安設基路伯和四面轉動發火焰的劍，把守生命樹的道路。","people":["adam-eve"]},{"key":"該隱殺弟","title":"該隱與亞伯","ref":"創 4:1–16","summary":"亞當和夏娃的兒子該隱種地、亞伯牧羊，兩人各自向耶和華獻上供物，耶和華看中了亞伯和他的供物，卻看不中該隱的。該隱大大發怒，在田間殺了弟弟；神問他亞伯在哪裡，他回答「我豈是看守我兄弟的嗎？」從此該隱在地上流離飄蕩。新約在來 11:4 提到亞伯因著信獻祭。","people":["cain-abel","adam-eve"]},{"key":"挪亞方舟","title":"挪亞方舟與大洪水","ref":"創 6:9～9:17","summary":"地上滿了強暴，神吩咐義人挪亞造一隻長三百肘、寬五十肘、高三十肘的方舟，帶著家人和各樣活物進去。大雨降在地上四十晝夜，洪水淹沒全地，後來方舟停在亞拉臘山上，挪亞放出的鴿子叼回一片新擰下來的橄欖葉子。出方舟後，神與挪亞立約，以天上的虹作記號，不再用洪水毀滅全地。","people":["noah"]},{"key":"巴別塔","title":"巴別塔","ref":"創 11:1–9","summary":"那時天下人的口音言語都是一樣，他們在示拿地商量建一座城和一座塔，塔頂通天，要傳揚自己的名，免得分散在全地上。耶和華變亂他們的口音，使他們言語彼此不通，他們就停工分散到全地，那城因此名叫巴別。","people":[]},{"key":"亞伯蘭蒙召","title":"亞伯蘭離開本地","ref":"創 11:27～12:9","summary":"亞伯蘭的父親他拉帶著家人從迦勒底的吾珥出來，住在哈蘭。耶和華呼召亞伯蘭離開本地、本族、父家，往他所要指示的地去，並應許要使他成為大國、萬族因他得福。亞伯蘭七十五歲時帶著妻子撒萊和姪兒羅得到了迦南地，在那裡為耶和華築壇。","people":["abraham","sarah","lot"]},{"key":"數星立約","title":"神與亞伯蘭立約","ref":"創 15；17","summary":"亞伯蘭沒有兒子，神帶他到外面數天上的星，說他的後裔也要這樣多，亞伯蘭就信了；神又吩咐他劈開牲畜，與他立約，說他的後裔要在別人的地寄居四百年，後來必帶著許多財物出來。亞伯蘭九十九歲時，神改他的名叫亞伯拉罕、改撒萊的名叫撒拉，並以割禮作立約的證據。","people":["abraham","sarah"]},{"key":"夏甲與以撒","title":"夏甲、以實瑪利與以撒出生","ref":"創 16；21:1–21","summary":"撒萊不生育，把使女夏甲給亞伯蘭為妾，夏甲懷孕後小看主母，被苦待而逃走，耶和華的使者在曠野的水泉旁遇見她，她後來生了以實瑪利。亞伯拉罕一百歲時，撒拉照著神的應許生了以撒。以撒斷奶後，撒拉要亞伯拉罕把夏甲母子趕出去，他們在曠野水喝盡了，神使夏甲看見一口水井，並應許以實瑪利也要成為大國。","people":["hagar-ishmael","abraham","sarah","isaac"]},{"key":"所多瑪","title":"所多瑪與羅得的妻子","ref":"創 18～19","summary":"三位客人在幔利橡樹那裡拜訪亞伯拉罕，應許撒拉明年要生兒子，撒拉在帳棚門口暗笑。耶和華要審判所多瑪與蛾摩拉，亞伯拉罕從五十個義人一路求到十個。兩位天使催羅得一家逃出城，耶和華將硫磺與火降下，羅得的妻子在後邊回頭一看，就變成了一根鹽柱。新約在路 17:32 提到「你們要回想羅得的妻子」。","people":["abraham","sarah","lot"]},{"key":"獻以撒","title":"亞伯拉罕獻以撒","ref":"創 22:1–19","summary":"神試驗亞伯拉罕，叫他把獨生的兒子以撒帶到摩利亞地獻為燔祭。路上以撒問燔祭的羊羔在哪裡，亞伯拉罕說神必自己預備。他正要下刀時，耶和華的使者從天上呼叫阻止，他看見一隻公羊兩角扣在稠密的小樹中，就拿來代替兒子獻上，給那地方起名叫「耶和華以勒」。新約在來 11:17–19 提到這件事。","people":["abraham","isaac"]},{"key":"井邊娶妻","title":"為以撒娶利百加","ref":"創 24","summary":"撒拉死後，亞伯拉罕差老僕人回到美索不達米亞的本族，為以撒娶妻。僕人在城外井旁禱告，求神讓那位肯給他和駱駝打水的女子就是神所預定的人，話還沒說完，利百加就出來打水。利百加的哥哥拉班和家人同意，利百加也說「我去」，以撒就娶她為妻。","people":["isaac","rebekah"]},{"key":"紅豆湯","title":"以掃賣長子的名分","ref":"創 25:19–34","summary":"利百加懷了雙胞胎，兩個孩子在腹中彼此相爭，神說將來大的要服事小的。以掃善於打獵，雅各為人安靜，常住在帳棚裡。有一天以掃從田野回來累昏了，用長子的名分換了雅各的餅和紅豆湯，經上說他輕看了長子的名分。新約在來 12:16 提到以掃這件事。","people":["esau","jacob","isaac","rebekah"]},{"key":"騙取祝福","title":"雅各騙取父親的祝福","ref":"創 27","summary":"以撒年老眼睛昏花，要在死前祝福以掃。利百加叫雅各穿上以掃的衣服、用山羊羔皮包手和頸項，假扮以掃進去。以撒摸了他說：「聲音是雅各的聲音，手卻是以掃的手」，還是為雅各祝福了；以掃知道後放聲痛哭，心裡想要殺雅各，利百加就叫雅各逃到哈蘭她哥哥拉班那裡。","people":["jacob","esau","isaac","rebekah"]},{"key":"伯特利天梯","title":"伯特利的夢","ref":"創 28:10–22","summary":"雅各逃往哈蘭，在路上枕著石頭睡覺，夢見一個梯子立在地上，梯子的頭頂著天，神的使者在梯子上上去下來，耶和華站在梯子以上，把應許給亞伯拉罕的話重新應許給他。雅各醒來，把石頭立作柱子，給那地方起名叫伯特利，並向神許願。","people":["jacob"]},{"key":"雅各娶妻","title":"雅各娶利亞與拉結","ref":"創 29:1～30:24","summary":"雅各愛拉班的小女兒拉結，願意為她服事七年，他因為深愛拉結，就看這七年如同幾天。成親那晚拉班卻把大女兒利亞給了他，雅各又為拉結再服事七年。利亞先生了流便、西緬、利未、猶大等兒子，拉結多年不生育，後來才生了約瑟。","people":["jacob","leah-rachel"]},{"key":"雅博摔跤","title":"雅各摔跤與兄弟和好","ref":"創 32～33","summary":"雅各帶著家人和牲畜回鄉，聽說以掃帶著四百人來迎接，心裡非常懼怕。那一夜在雅博渡口，有一個人來和他摔跤直到黎明，摸了他的大腿窩，並給他改名叫以色列；雅各給那地方起名叫毘努伊勒，說他面對面見了神，性命仍得保全。第二天以掃跑來迎接他，抱著他與他親嘴，兩人和好。","people":["jacob","esau"]},{"key":"約瑟被賣","title":"約瑟被哥哥們賣掉","ref":"創 37","summary":"雅各偏愛十七歲的約瑟，給他做了一件彩衣，約瑟又說出自己作的夢：哥哥們的禾捆向他下拜、日月和十一個星向他下拜，哥哥們就更恨他。哥哥們在多坍把他丟進坑裡，後來聽猶大的提議，用二十舍客勒銀子把他賣給往埃及去的商人。他們把彩衣染上公山羊的血拿回去，雅各以為兒子被野獸吃了，悲哀了許多日子。","people":["joseph-ot","jacob"]},{"key":"解夢宰相","title":"約瑟從監獄到宰相","ref":"創 39～41","summary":"約瑟被賣給法老的護衛長波提乏，耶和華與他同在，他管理全家；主人的妻子誣告他，他就被下在監裡。在監裡他為酒政和膳長解夢，後來法老夢見七隻肥母牛被七隻瘦母牛吃掉，約瑟解說將有七個豐年、七個荒年，建議預先積糧。法老立三十歲的約瑟治理埃及全地。","people":["joseph-ot"]},{"key":"兄弟相認","title":"約瑟與哥哥們相認","ref":"創 42～45","summary":"饑荒臨到迦南，雅各的兒子們下埃及糴糧，約瑟認出他們，他們卻不認得他。約瑟留下西緬作押，要他們帶小弟便雅憫來，又把銀杯藏在便雅憫的口袋裡；猶大求情，願意代替便雅憫留下為奴。約瑟再也忍不住，放聲大哭說「我是約瑟」，並說是神差他先來，為要保全生命。","people":["joseph-ot","jacob"]},{"key":"全家下埃及","title":"雅各下埃及與臨終祝福","ref":"創 46～50","summary":"雅各帶著全家七十人下埃及，住在歌珊地，見法老時說自己寄居在世的年日是一百三十歲。他臨終前祝福約瑟的兩個兒子以法蓮和瑪拿西，又為十二個兒子一一祝福，死後葬在迦南的麥比拉洞。雅各死後哥哥們害怕約瑟報復，約瑟安慰他們；他一百一十歲死在埃及，囑咐將來要把他的骸骨帶回應許之地。","people":["jacob","joseph-ot"]}],"people":["adam-eve","noah","abraham","sarah","lot","isaac","rebekah","jacob","esau","joseph-ot"],"verses":[{"ref":"創 1:1","text":"起初，神創造天地。"},{"ref":"創 15:6","text":"亞伯蘭信耶和華，耶和華就以此為他的義。"},{"ref":"創 50:20","text":"從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景。"}]}},{"t":"ot","id":"exodus","order":2,"name":"出埃及記","abbr":"出","chapters":40,"group":"律法書","data":{"id":"exodus","order":2,"name":"出埃及記","abbr":"出","chapters":40,"group":"律法書","oneLine":"神把以色列人從埃及救出來，在西奈山與他們立約","background":{"author":"傳統上認為是摩西所寫，也有不同看法","date":"傳統上認為成書於摩西時代，也有不同看法；出埃及的年代有約主前 15 世紀與約主前 13 世紀兩種主要看法","audience":"剛出埃及、在曠野的以色列人，也寫給後代","place":"不確定，傳統上認為在西奈曠野","why":"雅各一家下埃及後人數大增，埃及新王不認識約瑟，就逼他們做苦工。這卷書寫神興起摩西、用十災使法老放人、帶百姓過紅海，在西奈山頒布十誡並立約，最後百姓照神指示建成會幕。"},"revelations":[{"key":"神聽見哀聲","point":"神聽見受苦之人的哀聲，並記念他的約。","explain":"以色列人在埃及做苦工歎息哀求，神聽見了，就記念他與亞伯拉罕、以撒、雅各所立的約。全書的拯救從這裡開始。","ref":"出 2:23–25；3:7–10"},{"key":"自有永有","point":"神向摩西啟示他的名：我是自有永有的。","explain":"摩西問神叫什麼名，神說「我是自有永有的」，又說他是亞伯拉罕、以撒、雅各的神。新約在太 22:32 引用出 3:6 這句話。","ref":"出 3:13–15；6:2–8"},{"key":"救贖出埃及","point":"神用大能把以色列人從為奴之地救出來。","explain":"十災顯明耶和華勝過埃及的神祇，逾越節的羊羔血保護了以色列的長子，紅海分開讓百姓走乾地。這是舊約一再回顧的拯救大事。","ref":"出 12～14"},{"key":"立約子民","point":"被救的百姓要成為屬神的子民。","explain":"神在西奈山說，若他們遵守他的約，就要在萬民中作屬他的子民，歸他作祭司的國度、聖潔的國民。","ref":"出 19:4–6"},{"key":"十條誡命","point":"神頒布十誡，作為立約生活的核心。","explain":"十誡以「我是耶和華─你的神，曾將你從埃及地為奴之家領出來」開頭，先講拯救，再講誡命；前幾條講人與神，後幾條講人與人。","ref":"出 20:1–17"},{"key":"神住在中間","point":"神吩咐建會幕，要住在百姓中間。","explain":"後半卷大篇幅寫會幕的樣式與建造。金牛犢事件後，摩西求神同去；全書最後寫雲彩遮蓋會幕，耶和華的榮光充滿了帳幕。","ref":"出 25:8；33:14–16；40:34–38"}],"outline":[{"key":"為奴受苦","range":"1～2 章","point":"以色列人在埃及被逼做苦工，摩西出生、被法老的女兒收養，後來逃到米甸。"},{"key":"蒙召與十災","range":"3～11 章","point":"神在燒著的荊棘中呼召摩西，摩西與亞倫見法老，神降下十災。"},{"key":"逾越過海","range":"12:1～15:21","point":"守逾越節，以色列人出埃及，過紅海，摩西和米利暗唱歌讚美。"},{"key":"曠野路上","range":"15:22～18 章","point":"苦水變甜、天降嗎哪、磐石出水、擊敗亞瑪力，葉忒羅建議分層治理。"},{"key":"西奈立約","range":"19～24 章","point":"神在西奈山降臨，頒布十誡和典章，摩西以血立約。"},{"key":"會幕藍圖","range":"25～31 章","point":"神指示會幕、約櫃、祭司衣服和獻祭的樣式。"},{"key":"金牛犢事件","range":"32～34 章","point":"百姓拜金牛犢，摩西摔碎石版並代求，神重新立約。"},{"key":"會幕建成","range":"35～40 章","point":"百姓甘心獻禮物，照樣式建成會幕，耶和華的榮光充滿帳幕。"}],"stories":[{"key":"苦工與收生婆","title":"以色列人在埃及受苦","ref":"出 1","summary":"有不認識約瑟的新王興起，怕以色列人太多，就派督工轄制他們，叫他們做蓋造積貨城的苦工。法老吩咐希伯來的收生婆施弗拉和普阿殺死男嬰，她們因為敬畏神沒有照做；法老又吩咐把生下來的男孩都丟在河裡。","people":["pharaoh"]},{"key":"蒲草箱","title":"摩西出生","ref":"出 2:1–10","summary":"一個利未女子生了男孩，藏了三個月藏不住，就把他放在抹上石漆和石油的蒲草箱裡，擱在河邊的蘆荻中，孩子的姐姐遠遠站著看。法老的女兒來洗澡，看見孩子就憐憫他，請了孩子的親生母親來奶他，孩子長大後成了法老女兒的兒子，取名摩西，意思是「我把他從水裡拉出來」。","people":["moses","miriam"]},{"key":"逃往米甸","title":"摩西逃往米甸","ref":"出 2:11–25","summary":"摩西長大後看見一個埃及人打希伯來人，就把埃及人打死，埋在沙土裡。事情被人知道，法老要殺他，摩西就逃到米甸，在井旁幫米甸祭司的女兒們打水，後來娶了祭司的女兒西坡拉。在這期間埃及王死了，以色列人仍在苦工中歎息，神聽見了他們的哀聲。","people":["moses"]},{"key":"燃燒荊棘","title":"燒不毀的荊棘","ref":"出 3～4","summary":"摩西在何烈山牧羊，看見荊棘被火燒著卻沒有燒毀。神從荊棘裡呼叫他，吩咐他把腳上的鞋脫下來，差他去領以色列人出埃及，並說出「我是自有永有的」。摩西一再推辭，神給他杖變蛇等神蹟，又讓他的哥哥亞倫替他說話。","people":["moses","aaron"]},{"key":"十災","title":"十災與法老的剛硬","ref":"出 5～11","summary":"摩西和亞倫要法老容百姓去曠野事奉神，法老反而加重苦工。神先後降下血災、青蛙、虱子、蒼蠅、畜疫、瘡、冰雹、蝗蟲、黑暗九災，法老幾次答應又反悔，經上一再說法老的心剛硬。最後神宣告要擊殺埃及地一切的長子。","people":["moses","aaron","pharaoh"]},{"key":"逾越節","title":"第一個逾越節","ref":"出 12:1–42","summary":"神吩咐以色列人在正月十四日黃昏宰一歲無殘疾的羊羔，把血塗在門框和門楣上，夜裡吃羊羔、無酵餅和苦菜。那夜耶和華擊殺埃及一切頭生的，見了血就越過以色列人的房屋。法老催他們離開，步行的男人約有六十萬，經上說以色列人住在埃及共四百三十年。","people":["moses","aaron","pharaoh"]},{"key":"過紅海","title":"過紅海","ref":"出 13:17～15:21","summary":"耶和華日間用雲柱、夜間用火柱領路。法老後悔放人，帶車兵追到海邊，摩西向海伸杖，耶和華用大東風使海水分開，以色列人走乾地，水在他們左右作了牆垣；埃及軍兵追進海中，水一回流就淹沒了他們。摩西和以色列人唱歌讚美，女先知米利暗手裡拿鼓，帶著婦女跳舞應和。","people":["moses","miriam","pharaoh"]},{"key":"嗎哪鵪鶉","title":"苦水變甜與天降嗎哪","ref":"出 15:22～16:36","summary":"百姓在瑪拉喝不得苦水，摩西照耶和華的指示把一棵樹丟進水裡，水就變甜了。到了汛的曠野，百姓抱怨沒有吃的，神晚上降下鵪鶉，早晨地上有像芫荽子的白色小東西，叫作嗎哪；每人照食量收取，第六天收雙倍，第七天守安息。以色列人吃嗎哪共四十年，直到進入迦南的邊界。","people":["moses","aaron"]},{"key":"磐石出水","title":"磐石出水與擊敗亞瑪力","ref":"出 17","summary":"在利非訂百姓沒有水喝，和摩西爭鬧，摩西照神吩咐用杖擊打何烈的磐石，水就流出來，那地方叫作瑪撒、米利巴。亞瑪力人來攻擊，約書亞領兵出戰，摩西在山頂舉手，他舉手以色列就得勝，手一垂下亞瑪力就得勝，亞倫與戶珥扶著他的手直到日落，約書亞就打敗了亞瑪力。","people":["moses","aaron","joshua"]},{"key":"葉忒羅建議","title":"葉忒羅教摩西分層管理","ref":"出 18","summary":"摩西的岳父葉忒羅帶著西坡拉和兩個外孫來見摩西，聽到神所行的事就讚美耶和華。他看見摩西從早到晚獨自為百姓審理案件，勸他揀選有才能、敬畏神的人作千夫長、百夫長、五十夫長、十夫長，小事由他們審判，難斷的才呈給摩西。","people":["moses"]},{"key":"西奈十誡","title":"西奈山頒布十誡","ref":"出 19～20","summary":"出埃及滿三個月，以色列人來到西奈曠野，在山下安營。第三天早晨山上有雷轟、閃電、密雲和很大的角聲，全山大大震動，耶和華降臨在山頂。神親自說出十條誡命，百姓害怕，遠遠站著，求摩西替他們聽神說話。","people":["moses"]},{"key":"立約之血","title":"以血立約","ref":"出 21～24","summary":"神把有關奴僕、傷害、財物、公義與節期的典章交給摩西。摩西把耶和華的話寫成約書念給百姓聽，百姓說耶和華所吩咐的都必遵行，摩西就把祭牲的血灑在百姓身上，說這是立約的血。之後摩西上山，在山上四十晝夜。","people":["moses","aaron","joshua"]},{"key":"會幕樣式","title":"會幕的樣式","ref":"出 25～31","summary":"神要以色列人照他指示的樣式造聖所，好讓他住在他們中間。內容包括約櫃與施恩座、陳設餅的桌子、金燈臺、帳幕、祭壇，以及亞倫和他兒子作祭司的聖衣與承接聖職的禮。神也揀選比撒列和亞何利亞伯負責製作，並把兩塊法版交給摩西。","people":["moses","aaron"]},{"key":"金牛犢","title":"金牛犢與摩西代求","ref":"出 32～34","summary":"百姓見摩西遲遲不下山，要亞倫造神像，亞倫收了金環鑄成一隻牛犢，百姓向它獻祭、坐下吃喝、起來玩耍。摩西下山把兩塊法版摔碎在山下，那一天百姓中被殺的約有三千人。摩西為百姓代求，神應許與他們同去，並吩咐摩西再鑿兩塊石版；摩西下山時臉上發光，自己卻不知道。新約在林後 3:7 提到摩西臉上的榮光。","people":["moses","aaron"]},{"key":"帳幕立起","title":"會幕建成與榮光充滿","ref":"出 35～40","summary":"摩西向百姓募集建造會幕的禮物，百姓甘心樂意地送來，多到有餘，摩西只好傳令停止。工匠照神所吩咐的樣式完成一切，第二年正月初一摩西立起帳幕。雲彩遮蓋會幕，耶和華的榮光充滿了帳幕，此後雲彩從帳幕收上去，百姓就起行。","people":["moses","aaron"]}],"people":["moses","aaron","miriam","pharaoh","joshua"],"verses":[{"ref":"出 3:14","text":"神對摩西說：「我是自有永有的」；又說：「你要對以色列人這樣說：『那自有的打發我到你們這裡來。』」"},{"ref":"出 14:14","text":"耶和華必為你們爭戰；你們只管靜默，不要作聲。"},{"ref":"出 20:2–3","text":"我是耶和華─你的神，曾將你從埃及地為奴之家領出來。除了我以外，你不可有別的神。"}]}},{"t":"ot","id":"leviticus","order":3,"name":"利未記","abbr":"利","chapters":27,"group":"律法書","data":{"id":"leviticus","order":3,"name":"利未記","abbr":"利","chapters":27,"group":"律法書","oneLine":"神在西奈山教百姓怎樣獻祭、潔淨、過聖潔的生活","background":{"author":"傳統上認為是摩西所寫，也有不同看法","date":"傳統上認為成書於摩西時代，也有不同看法","audience":"以色列百姓，特別是利未支派的祭司","place":"西奈山下（書末說這些是耶和華在西奈山吩咐摩西的命令）","why":"出埃及記最後會幕建成了，接下來的問題是：聖潔的神住在百姓中間，百姓要怎樣親近他？這卷書記錄神在會幕裡對摩西說的話，從會幕立起到民數記開始點人數，時間大約一個月。書名來自負責祭祀的利未支派。"},"revelations":[{"key":"要聖潔","point":"神是聖潔的，他的百姓也要聖潔。","explain":"「你們要聖潔，因為我耶和華─你們的神是聖潔的」在書中反覆出現，是全書的主軸。新約在彼前 1:16 引用這句話。","ref":"利 11:44–45；19:2"},{"key":"血能贖罪","point":"獻祭是神設立讓人與他和好的方法。","explain":"前 7 章詳列五種祭。書中說活物的生命在血中，神把血賜在壇上為人贖罪。","ref":"利 1～7；17:11"},{"key":"祭司中保","point":"祭司站在神與百姓中間，代百姓獻祭。","explain":"亞倫和他的兒子承接聖職，負責獻祭、分辨聖俗、教導百姓。拿答、亞比戶獻凡火被燒滅，顯出事奉神不可隨意。","ref":"利 8～10"},{"key":"潔淨分別","point":"日常生活中也要分辨潔淨與不潔淨。","explain":"食物、生產、皮膚病、身體的漏症都有潔淨的條例，讓百姓在生活每個細節裡記得自己是分別出來歸神的。","ref":"利 11～15"},{"key":"愛人如己","point":"聖潔也表現在對待人的方式上。","explain":"第 19 章把敬畏神和照顧窮人、誠實交易、不報仇放在一起，並說「要愛人如己」。新約在太 22:39 記耶穌引用這句。","ref":"利 19:9–18"},{"key":"安息與禧年","point":"時間也歸神，土地與人都要得休息與釋放。","explain":"每週守安息日，每年守節期，每七年讓地休耕，每五十年守禧年，賣掉的產業要歸回原主。","ref":"利 23；25"}],"outline":[{"key":"獻祭條例","range":"1～7 章","point":"燔祭、素祭、平安祭、贖罪祭、贖愆祭的獻法與祭司的分。"},{"key":"祭司就職","range":"8～10 章","point":"亞倫和兒子承接聖職，開始獻祭；拿答、亞比戶獻凡火而死。"},{"key":"潔淨條例","range":"11～15 章","point":"可吃與不可吃的動物、產婦、大痲瘋與漏症的潔淨規定。"},{"key":"贖罪大日","range":"16 章","point":"大祭司一年一次進入至聖所，為全會眾贖罪。"},{"key":"聖潔生活","range":"17～22 章","point":"血的規定、家庭與性的界線、愛人如己，以及祭司的聖潔。"},{"key":"節期禧年","range":"23～25 章","point":"全年的節期、聖所的燈與餅、安息年與禧年。"},{"key":"祝福與許願","range":"26～27 章","point":"遵行與違背的後果，以及許願與奉獻之物的規定。"}],"stories":[{"key":"五種祭","title":"五種祭","ref":"利 1～7","summary":"燔祭是全燒在壇上的祭，素祭用細麵和油，平安祭由獻祭的人與祭司分享，贖罪祭和贖愆祭則是為誤犯的罪與虧欠贖罪。每一種祭都規定了用什麼祭牲、怎樣宰殺、血怎樣處理、哪一份歸祭司。","people":["moses","aaron"]},{"key":"承接聖職","title":"亞倫承接聖職","ref":"利 8～9","summary":"摩西照神的吩咐，在會眾面前用水洗亞倫和他的兒子，給他們穿上聖衣、用膏油膏他們，承接聖職的禮共七天。第八天亞倫第一次為自己和百姓獻祭，有火從耶和華面前出來，燒盡壇上的燔祭和脂油，眾民看見就歡呼，俯伏在地。","people":["moses","aaron"]},{"key":"凡火","title":"拿答與亞比戶獻凡火","ref":"利 10:1–7","summary":"亞倫的兒子拿答和亞比戶各拿香爐，在耶和華面前獻上他沒有吩咐的凡火，就有火從耶和華面前出來，把他們燒滅了。摩西說這就是耶和華所說「我在親近我的人中要顯為聖」，亞倫就默默不言。","people":["moses","aaron"]},{"key":"潔與不潔","title":"潔淨與不潔淨的條例","ref":"利 11～15","summary":"走獸要分蹄、倒嚼才可以吃，水中的要有翅有鱗。婦人生產後要等滿日子再獻祭得潔淨。患大痲瘋的人要給祭司察看，被隔離在營外，痊癒後再經祭司的禮得潔淨；衣服、房屋發霉也有察看的規定。","people":["aaron"]},{"key":"贖罪日","title":"贖罪日與兩隻公山羊","ref":"利 16","summary":"每年七月初十，大祭司穿上細麻布的聖衣，帶著血進入至聖所，在施恩座前為自己、家人和全會眾贖罪。他要拿兩隻公山羊拈鬮，一隻歸耶和華作贖罪祭，另一隻歸與阿撒瀉勒，大祭司按手在牠頭上承認百姓的罪，再把牠送到曠野去。新約在來 9:7 提到大祭司一年一次進入至聖所。","people":["aaron","moses"]},{"key":"聖潔法則","title":"你們要聖潔","ref":"利 19","summary":"這一章把各種誡命放在一起：要孝敬父母、守安息日、收割時要留下田角和遺落的穗子給窮人和寄居的、不可偷盜欺騙、不可在聾子面前咒罵、不可在瞎子面前放絆腳石、審判不可偏袒。中間說「不可報仇，也不可埋怨你本國的子民，卻要愛人如己」。","people":["moses"]},{"key":"七個節期","title":"耶和華的節期","ref":"利 23","summary":"除了每週的安息日，全年還有正月的逾越節和無酵節、獻初熟莊稼的一捆、七個安息日後獻新素祭、七月初一吹角為記念、七月初十的贖罪日，以及七月十五起的住棚節。住棚節時百姓要住在棚裡七天，好讓後代知道神領他們出埃及時曾使他們住在棚裡。","people":["moses"]},{"key":"禧年","title":"安息年與禧年","ref":"利 25","summary":"百姓進了迦南後，每到第七年要讓地守安息，不耕種也不修理葡萄園。滿了七個安息年，第五十年要大發角聲宣告禧年，賣掉的地業要歸回原主，因窮困賣身的弟兄也要得自由，因為神說地是他的，百姓在他面前是客旅、是寄居的。","people":["moses"]},{"key":"祝福與警告","title":"遵行與違背的後果","ref":"利 26","summary":"神應許百姓若遵行他的律例，就按時降雨、地出土產、國中太平，他要在他們中間行走，作他們的神。若違背，就有疾病、敵人與荒涼臨到，甚至被分散到列國；但他們若承認罪孽，神仍要記念與雅各、以撒、亞伯拉罕所立的約。","people":["moses"]}],"people":["moses","aaron"],"verses":[{"ref":"利 17:11","text":"因為活物的生命是在血中。我把這血賜給你們，可以在壇上為你們的生命贖罪；因血裡有生命，所以能贖罪。"},{"ref":"利 19:18","text":"不可報仇，也不可埋怨你本國的子民，卻要愛人如己。我是耶和華。"}]}},{"t":"ot","id":"numbers","order":4,"name":"民數記","abbr":"民","chapters":36,"group":"律法書","data":{"id":"numbers","order":4,"name":"民數記","abbr":"民","chapters":36,"group":"律法書","oneLine":"以色列人因不信在曠野漂流四十年，新一代來到應許之地門口","background":{"author":"傳統上認為是摩西所寫，也有不同看法","date":"傳統上認為成書於摩西時代，也有不同看法","audience":"即將進入迦南的新一代以色列人，也寫給後代","place":"不確定，傳統上認為書末寫於摩押平原","why":"書名來自書中兩次數點人數。故事從出埃及第二年在西奈山下開始，百姓起行往迦南，卻在加低斯因不信而被罰在曠野漂流；老一代死在曠野後，新一代來到約旦河東的摩押平原，準備進入應許之地。"},"revelations":[{"key":"神在營中","point":"神住在營的中央，親自帶領百姓的行程。","explain":"會幕安在營的中間，各支派四面安營。雲彩停住就安營，雲彩收上去就起行，百姓遵耶和華的吩咐行止。","ref":"民 2；9:15–23"},{"key":"不信的代價","point":"不信使一代人錯過了應許之地。","explain":"十個探子報惡信，全會眾哭號要回埃及，神宣告二十歲以外向他發怨言的都要倒在曠野，按窺探的日數一日頂一年，漂流四十年。","ref":"民 14:20–35"},{"key":"抱怨與叛逆","point":"曠野中最大的試探是抱怨與悖逆。","explain":"從抱怨食物、米利暗和亞倫毀謗摩西，到可拉一黨挑戰祭司的職分，書中一再記錄百姓與領袖的悖逆和後果。新約在林前 10:6–11 提到這些事是鑑戒。","ref":"民 11～12；16～17"},{"key":"神必不說謊","point":"神的應許不因人的詛咒而改變。","explain":"摩押王雇巴蘭詛咒以色列，巴蘭卻只能說神要他說的話，四次都成了祝福，並說神非人，必不致說謊。","ref":"民 23:19–20"},{"key":"新的一代","point":"神的應許跨過失敗的一代，臨到下一代。","explain":"第二次數點時，除了迦勒和約書亞，第一次數點的人都已死了。摩西為百姓立約書亞為接班人，並為分地作準備。","ref":"民 26:63–65；27:15–23"}],"outline":[{"key":"西奈預備","range":"1:1～10:10","point":"數點能打仗的男丁、排定安營次序、潔淨營地，並記錄祭司的祝福。"},{"key":"起行抱怨","range":"10:11～12 章","point":"雲彩收上去，百姓離開西奈；途中抱怨食物，米利暗和亞倫毀謗摩西。"},{"key":"加低斯失敗","range":"13～14 章","point":"十二個探子窺探迦南，百姓不信，被罰在曠野漂流四十年。"},{"key":"曠野年間","range":"15～19 章","point":"可拉一黨叛亂被罰，亞倫的杖發芽，確立祭司與利未人的職分。"},{"key":"前往摩押","range":"20～25 章","point":"米利暗、亞倫去世，銅蛇事件，擊敗亞摩利王，巴蘭祝福以色列。"},{"key":"新一代預備","range":"26～36 章","point":"第二次數點，約書亞接續摩西，訂定分地、獻祭與逃城的規定。"}],"stories":[{"key":"第一次數點","title":"西奈山下數點人數","ref":"民 1～2","summary":"出埃及第二年二月初一，神吩咐摩西和亞倫數點以色列中二十歲以外、能出去打仗的男丁，總數是六十萬零三千五百五十名，利未人另外不算在其中。十二個支派按東南西北四面安營，會幕在營的中央。","people":["moses","aaron"]},{"key":"雲柱起行","title":"雲彩引導起行","ref":"民 9:15～10:36","summary":"立起帳幕的那天，有雲彩遮蓋帳幕，夜間看像火；雲彩停住百姓就安營，雲彩收上去就起行。第二年二月二十日雲彩收上去，以色列人照著次序離開西奈曠野。約櫃起行時摩西就說：「耶和華啊，求你興起！」","people":["moses"]},{"key":"鵪鶉七十老","title":"抱怨食物與七十位長老","ref":"民 11","summary":"百姓厭煩嗎哪，哭著想念埃及的魚、黃瓜、西瓜、韭菜、蔥、蒜，摩西覺得管理百姓的擔子太重。神吩咐他招聚七十位長老，把降在摩西身上的靈分賜給他們；又颳風把鵪鶉颳來，百姓貪吃，神就用災殃擊殺他們，那地方叫基博羅哈他瓦。","people":["moses","joshua"]},{"key":"毀謗摩西","title":"米利暗和亞倫毀謗摩西","ref":"民 12","summary":"米利暗和亞倫因摩西娶了古實女子而毀謗他，說耶和華不也藉著他們說話嗎？經上說摩西為人極其謙和，勝過世上的眾人。神親自為摩西說話，說他與摩西面對面說話；雲彩離開後米利暗長了大痲瘋，摩西為她哀求，她被關在營外七天才回來。","people":["miriam","aaron","moses"]},{"key":"十二探子","title":"十二個探子","ref":"民 13～14","summary":"摩西從每支派派一個首領去窺探迦南地，四十天後回來，帶著一掛要兩個人用槓抬的葡萄，說那地果然是流奶與蜜之地，但城邑堅固、居民高大。十個探子報惡信，全會眾哭號要另立首領回埃及，只有約書亞和迦勒說耶和華若喜悅我們，必領我們進那地。神宣告二十歲以外發怨言的都要死在曠野，百姓要漂流四十年。","people":["joshua","caleb","moses","aaron"]},{"key":"可拉叛黨","title":"可拉叛黨與亞倫的杖","ref":"民 16～17","summary":"利未人可拉聯合大坍、亞比蘭和二百五十個首領，攻擊摩西和亞倫自居高位。地開了口把可拉的人和大坍、亞比蘭的家吞下去，又有火出來燒滅了那二百五十個獻香的人。之後神叫十二個支派各交一根杖放在法櫃前，第二天只有亞倫的杖發了芽、開了花、結了熟杏。","people":["moses","aaron"]},{"key":"米利巴水","title":"米利巴水與摩西的過犯","ref":"民 20","summary":"米利暗死在加低斯。會眾沒有水喝，和摩西爭鬧，神吩咐摩西拿杖、在百姓眼前吩咐磐石出水，摩西卻舉手用杖擊打磐石兩下，水就流出來。神說摩西和亞倫不信他、沒有在百姓眼前尊他為聖，所以不得領會眾進入應許之地；同一章亞倫死在何珥山上。","people":["moses","aaron","miriam"]},{"key":"火蛇銅蛇","title":"曠野的銅蛇","ref":"民 21:4–9","summary":"百姓因路難行而心中煩躁，埋怨神和摩西，耶和華使火蛇進入百姓中間，咬死了許多人。百姓認罪，摩西為他們禱告，神吩咐他造一條火蛇掛在杆子上；摩西造了銅蛇，被蛇咬的人一望這銅蛇就活了。新約在約 3:14 提到摩西在曠野舉蛇。","people":["moses"]},{"key":"巴蘭與驢","title":"巴蘭的驢與四次祝福","ref":"民 22～24","summary":"摩押王巴勒怕以色列人，請術士巴蘭來詛咒他們。巴蘭騎驢上路，耶和華的使者拿刀擋在路上，驢看見了三次躲避，被巴蘭打了三次，耶和華叫驢開口說話，巴蘭才看見使者。巴勒三次帶巴蘭到高處要他詛咒，巴蘭卻照神的話祝福以色列，最後一次還說有星要出於雅各。新約在彼後 2:15–16 提到巴蘭與驢。","people":["balaam","moses"]},{"key":"第二次數點","title":"新一代數點與約書亞接續","ref":"民 26～27","summary":"瘟疫過後，神吩咐在摩押平原再數點人數，總數是六十萬一千七百三十名；經上說這些人中，除了迦勒和約書亞，沒有一個是第一次在西奈曠野被數過的。西羅非哈的五個女兒為父家請求產業，神准許女兒承受產業。摩西求神立人帶領會眾，神吩咐他按手在約書亞頭上，把尊榮給他。","people":["moses","joshua","caleb"]}],"people":["moses","aaron","miriam","joshua","caleb","balaam"],"verses":[{"ref":"民 6:24–26","text":"願耶和華賜福給你，保護你。願耶和華使他的臉光照你，賜恩給你。願耶和華向你仰臉，賜你平安。"},{"ref":"民 23:19","text":"神非人，必不致說謊，也非人子，必不致後悔。他說話豈不照著行呢？他發言豈不要成就呢？"}]}},{"t":"ot","id":"deuteronomy","order":5,"name":"申命記","abbr":"申","chapters":34,"group":"律法書","data":{"id":"deuteronomy","order":5,"name":"申命記","abbr":"申","chapters":34,"group":"律法書","oneLine":"摩西臨終前在摩押平原，向新一代重述神的律法","background":{"author":"傳統上認為是摩西所寫，記摩西之死的末章傳統上說是後人補記，也有不同看法","date":"書中說摩西在出埃及第四十年十一月初一開始講論；成書年代傳統上認為在摩西時代，也有不同看法","audience":"即將過約旦河、進入迦南的新一代以色列人","place":"約旦河東的摩押平原","why":"第一代出埃及的人已死在曠野，摩西自己也不能過約旦河。他在離世前向新一代回顧四十年的歷程，重申十誡和律例，要他們進了迦南仍然愛神、守約。書名「申命」就是重申命令的意思。"},"revelations":[{"key":"獨一的神","point":"耶和華是獨一的主，要盡心盡性盡力愛他。","explain":"「以色列啊，你要聽！」這段傳統上成為以色列人每天誦念的經文。新約在太 22:37–38 記耶穌稱這是誡命中的第一。","ref":"申 6:4–5"},{"key":"不可忘記","point":"富足時最危險的是忘記神。","explain":"摩西一再提醒百姓要記念曠野的四十年，神用嗎哪養活他們，使他們知道人活著不是單靠食物；進了美地吃飽之後，不可心高氣傲、忘記耶和華。新約在太 4:4 記耶穌引用 8:3。","ref":"申 8"},{"key":"揀選出於愛","point":"神揀選以色列，不是因為他們人數多或比別人好。","explain":"摩西說耶和華專愛他們、揀選他們，是因為他愛他們，又因要守他向列祖所起的誓；他們本是硬著頸項的百姓。","ref":"申 7:6–8；9:4–6"},{"key":"傳給下一代","point":"信仰要在家裡一代一代教下去。","explain":"神的話要記在心上，殷勤教訓兒女，無論坐在家裡、行在路上、躺下、起來都要談論，並繫在手上、寫在門框上。","ref":"申 6:6–9"},{"key":"選擇生命","point":"守約或背約，生命與死亡擺在百姓面前。","explain":"27～30 章列出祝福與咒詛，摩西最後說他把生死禍福陳明在百姓面前，要他們揀選生命，愛耶和華、聽從他的話。","ref":"申 30:15–20"},{"key":"像摩西的先知","point":"神應許將來要興起一位像摩西的先知。","explain":"摩西說耶和華要從百姓中間興起一位先知像他，百姓要聽從。新約在徒 3:22 引用這段話。","ref":"申 18:15–19"}],"outline":[{"key":"回顧曠野","range":"1～4 章","point":"摩西的第一篇講論：從何烈山到摩押平原的歷程，勸百姓遵守律法。"},{"key":"愛神守約","range":"5～11 章","point":"重述十誡，示瑪與不可忘記神，回顧金牛犢事件。"},{"key":"律例典章","range":"12～26 章","point":"敬拜的地方、潔淨的食物、節期、君王與先知、審判與日常生活的律法。"},{"key":"祝福咒詛","range":"27～30 章","point":"基利心山與以巴路山的儀式、守約與背約的後果、摩押地的約。"},{"key":"交棒與離世","range":"31～34 章","point":"約書亞接任，摩西之歌與祝福，摩西在尼波山上去世。"}],"stories":[{"key":"摩押講論","title":"摩西在摩押平原回顧","ref":"申 1～3","summary":"出埃及第四十年十一月初一，摩西在約旦河東的摩押地向以色列人講論。他從何烈山起行、設立官長講起，回顧加低斯的探子事件、在曠野繞行、擊敗希實本王西宏和巴珊王噩。他也說自己曾求神讓他過去看那美地，神沒有應允，只叫他上毘斯迦山頂觀看。","people":["moses","joshua","caleb"]},{"key":"重申十誡","title":"重述十條誡命","ref":"申 5","summary":"摩西提醒新一代，神在何烈山不只是與他們的列祖立約，也是與今天活著的他們立約，接著重述十誡。這裡的安息日誡命多了一個理由：要記念自己在埃及作過奴僕，是神用大能的手領他們出來。","people":["moses"]},{"key":"示瑪","title":"以色列啊，你要聽","ref":"申 6","summary":"摩西說耶和華我們神是獨一的主，要盡心、盡性、盡力愛他。這些話要記在心上，殷勤教訓兒女，繫在手上為記號、戴在額上為經文、寫在門框和城門上。將來兒子問這些律例是什麼意思，就要告訴他們神怎樣把他們從埃及領出來。","people":["moses"]},{"key":"曠野四十年","title":"不可忘記耶和華","ref":"申 8～9","summary":"摩西說這四十年神苦煉百姓、任他們飢餓，又賜嗎哪給他們吃，他們的衣服沒有穿破、腳也沒有腫。他警告百姓進了美地、住好房子、牛羊金銀增多之後，不可說是自己的力量得了貨財。他也提醒他們得地不是因為自己的義，並回顧金牛犢事件和自己四十晝夜俯伏在神面前代求。","people":["moses","aaron"]},{"key":"進迦南律例","title":"進迦南後的生活律例","ref":"申 12～26","summary":"百姓進了迦南要毀掉迦南人的祭壇，到耶和華所選擇立他名的地方獻祭。這段也規定十分之一、豁免年、三大節期、設立審判官與君王的條例，並應許神要興起一位像摩西的先知；還有逃城、戰爭、婚姻、照顧寄居的、孤兒和寡婦等規定，最後是獻初熟土產時的認信。","people":["moses"]},{"key":"兩座山","title":"基利心山與以巴路山","ref":"申 27～28","summary":"摩西吩咐百姓過約旦河後，在以巴路山立起石頭、寫上律法，六個支派站在基利心山上為百姓祝福，六個支派站在以巴路山上宣告咒詛。28 章列出遵行的祝福與違背的咒詛，咒詛的部分甚至寫到被分散到萬民中。","people":["moses"]},{"key":"生死禍福","title":"揀選生命","ref":"申 29～30","summary":"摩西在摩押地與百姓立約，說即使將來被分散到列國，只要回轉歸向耶和華，神也要招聚他們回來。他說這誡命不是難行的、也不是離他們遠的，乃是在他們口中、在他們心裡；最後呼天喚地作見證，要他們揀選生命。","people":["moses"]},{"key":"約書亞接任","title":"約書亞接任與摩西之歌","ref":"申 31～33","summary":"摩西說他已經一百二十歲，不能再出入，就在以色列眾人眼前勉勵約書亞剛強壯膽，因為耶和華必不撇下他。摩西把律法寫好交給祭司，吩咐每七年在住棚節念給百姓聽。他又教百姓唱一首歌，述說神的信實與百姓的悖逆，最後為以色列各支派祝福。","people":["moses","joshua"]},{"key":"尼波山","title":"摩西之死","ref":"申 34","summary":"摩西從摩押平原登上尼波山的毘斯迦山頂，耶和華把應許給亞伯拉罕、以撒、雅各的全地指給他看，說他可以看見，卻不得過去。摩西死在摩押地，年一百二十歲，眼目沒有昏花，只是沒有人知道他的墳墓。約書亞被智慧的靈充滿，百姓就聽從他；經上說以後以色列中再沒有興起先知像摩西的。","people":["moses","joshua"]}],"people":["moses","joshua","caleb","aaron"],"verses":[{"ref":"申 6:4–5","text":"以色列啊，你要聽！耶和華─我們神是獨一的主。你要盡心、盡性、盡力愛耶和華─你的神。"},{"ref":"申 8:3","text":"他苦煉你，任你飢餓，將你和你列祖所不認識的嗎哪賜給你吃，使你知道，人活著不是單靠食物，乃是靠耶和華口裡所出的一切話。"},{"ref":"申 31:6","text":"你們當剛強壯膽，不要害怕，也不要畏懼他們，因為耶和華─你的神和你同去。他必不撇下你，也不丟棄你。"}]}},{"t":"ot","id":"joshua","order":6,"name":"約書亞記","abbr":"書","chapters":24,"group":"歷史書","data":{"id":"joshua","order":6,"name":"約書亞記","abbr":"書","chapters":24,"group":"歷史書","oneLine":"約書亞帶以色列人過約旦河，進入並分配迦南地","background":{"author":"傳統上認為是約書亞所寫，書末記他死後的事由他人補上，也有不同看法","date":"約主前 1400 年前後（傳統上的看法），也有不同看法","audience":"進入迦南的以色列人與他們的後代","place":"不確定，可能在迦南地","why":"摩西死在約旦河東的摩押平原，以色列人在曠野漂流四十年後，由約書亞接續帶領。這卷書記錄他們過河、攻取迦南、按支派分地，最後在示劍重新與耶和華立約。"},"revelations":[{"key":"應許成就","point":"神向列祖應許的迦南地，在這卷書裡交到以色列人手中。","explain":"從神對亞伯蘭說「我要把這地賜給你的後裔」（創 12:7）開始，到這裡一一應驗。書末總結說，耶和華應許的話一句也沒有落空。","ref":"書 1:2–6；21:43–45"},{"key":"剛強壯膽","point":"新領袖的力量來自神的同在與遵守律法。","explain":"神一再對約書亞說「剛強壯膽」，並吩咐他晝夜思想律法書。約書亞接棒時，焦點放在神與他同在，像與摩西同在一樣。","ref":"書 1:5–9","note":"約書亞記 1:6、1:9 寫的是「你當剛強壯膽」，1:7 寫的是「只要剛強，大大壯膽」。"},{"key":"爭戰在神","point":"勝敗取決於神，不在兵力與城牆。","explain":"耶利哥城牆是在祭司吹角、百姓呼喊後塌陷的；基遍之戰有冰雹從天降下。書中反覆說是耶和華把敵人交在他們手裡。","ref":"書 6；10:11–14"},{"key":"聖潔與順服","point":"一個人的私藏，會讓全營吃敗仗。","explain":"亞干私取當滅的物，以色列人就在小小的艾城敗退；處理之後才攻下艾城。這卷書把順服放在勝利之前。","ref":"書 7～8"},{"key":"按支派分地","point":"土地照支派拈鬮分配，各有產業。","explain":"書的後半用很長篇幅列出各支派的地界與城邑，也設立逃城、給利未人城邑，讓每一家都有落腳之處。","ref":"書 13～21"},{"key":"選擇事奉","point":"每一代都要自己決定事奉誰。","explain":"約書亞年老時在示劍召聚眾人，要他們在列祖的神、亞摩利人的神與耶和華之間選擇，並和百姓立約。","ref":"書 24:14–25"}],"outline":[{"key":"受命預備","range":"1～2 章","point":"神吩咐約書亞剛強壯膽；兩個探子到耶利哥，喇合把他們藏起來。"},{"key":"渡河紮營","range":"3～5 章","point":"約旦河水立起成壘，百姓走乾地過河，在吉甲立石、行割禮、守逾越節。"},{"key":"攻取迦南","range":"6～12 章","point":"先取耶利哥與艾城，再打敗南方五王與北方諸王，書末列出被擊敗的三十一個王。"},{"key":"分配土地","range":"13～21 章","point":"河東、河西各支派拈鬮分地，設立逃城與利未人的城邑。"},{"key":"臨別立約","range":"22～24 章","point":"河東支派回家築壇，約書亞臨別勸勉，在示劍與百姓立約後去世。"}],"stories":[{"key":"接棒受命","title":"約書亞接續摩西","ref":"書 1:1–18","summary":"摩西死後，耶和華吩咐約書亞起來帶百姓過約旦河，應許必不撇下他，並要他晝夜思想律法書。約書亞傳令百姓預備三天的糧食，河東的流便、迦得和瑪拿西半支派也答應先帶兵過河幫助弟兄。","people":["joshua","moses"]},{"key":"喇合藏探子","title":"喇合與兩個探子","ref":"書 2:1–24","summary":"約書亞從什亭打發兩個探子去窺探耶利哥，他們住在妓女喇合家。喇合把探子藏在房頂的麻稭中，告訴他們城裡的人聽見耶和華的作為都心驚膽戰，並請他們發誓保全她一家；探子要她把朱紅線繩繫在窗戶上作記號。新約在來 11:31 和雅 2:25 提到她。","people":["rahab","joshua"]},{"key":"過約旦河","title":"約旦河水立起成壘","ref":"書 3:1～4:24","summary":"那時正是收割的日子，約旦河水漲過兩岸；抬約櫃的祭司腳一入水，上游的水就立起成壘，百姓從乾地上走過去。他們從河中取了十二塊石頭，立在吉甲作紀念，好讓日後子孫問起時可以告訴他們。","people":["joshua"]},{"key":"吉甲割禮","title":"吉甲行割禮與守逾越節","ref":"書 5:1–15","summary":"在曠野出生的男丁沒有受過割禮，約書亞在吉甲為他們行割禮，接著守逾越節，吃了那地的出產後嗎哪就停止了。約書亞在耶利哥附近遇見一位手拿拔出來的刀的人，自稱是耶和華軍隊的元帥，叫他把腳上的鞋脫下來。","people":["joshua"]},{"key":"耶利哥城","title":"耶利哥城牆塌陷","ref":"書 6:1–27","summary":"耶和華吩咐軍兵每天圍繞耶利哥城一次，連續六天，祭司抬著約櫃吹角；第七日繞城七次，祭司吹角、百姓大聲呼喊，城牆就塌陷了。城中的人和物都照吩咐毀滅，只有喇合和她家的人得以存活。新約在來 11:30 提到這件事。","people":["joshua","rahab"]},{"key":"亞干犯罪","title":"亞干私取當滅的物","ref":"書 7:1–26","summary":"以色列人去攻小小的艾城卻敗退，約書亞撕裂衣服俯伏在約櫃前。耶和華指出有人取了當滅的物，掣籤查出是亞干，他承認拿了一件示拿衣服、二百舍客勒銀子和一條五十舍客勒重的金子；他和他所有的在亞割谷被石頭打死。","people":["joshua"]},{"key":"攻取艾城","title":"伏兵攻取艾城","ref":"書 8:1–35","summary":"約書亞在城後設下伏兵，大軍假裝敗逃把艾城的人引出來，伏兵趁機進城放火，艾城就被攻取。之後約書亞在以巴路山為耶和華築壇，在眾人面前宣讀律法上的祝福與咒詛。","people":["joshua"]},{"key":"基遍人詭計","title":"基遍人假裝遠方來使","ref":"書 9:1–27","summary":"基遍人穿上舊衣舊鞋、帶著長了霉的乾餅，假裝從遠方來，要和以色列人立約。首領們沒有求問耶和華就與他們立約，三天後才知道他們就住在附近；因為已經起誓，就不殺他們，讓他們作劈柴挑水的人。","people":["joshua"]},{"key":"日頭停留","title":"日頭在基遍停留","ref":"書 10:1–43","summary":"耶路撒冷王聯合另外四個亞摩利王，五王一同攻打基遍，約書亞連夜從吉甲上去救援。耶和華從天上降大冰雹，被冰雹打死的比被刀殺的還多；約書亞禱告說「日頭啊，你要停在基遍」，日頭就在天當中停住約有一日之久。之後他攻取了南方各城。","people":["joshua"]},{"key":"北方諸王","title":"米倫水邊大戰","ref":"書 11:1–23","summary":"夏瑣王耶賓召集北方諸王，人數多如海邊的沙，在米倫水邊安營。約書亞突然襲擊打敗他們，照耶和華的吩咐砍斷馬的蹄筋、用火焚燒車輛，又焚燒了夏瑣。書中總結說約書亞奪了那全地，國中太平，沒有爭戰了。","people":["joshua"]},{"key":"迦勒求山地","title":"八十五歲的迦勒","ref":"書 14:6–15","summary":"迦勒是當年十二個探子之一，和約書亞一同回報好消息。他對約書亞說，自己八十五歲了，還和摩西打發他窺探那天一樣強壯，求把有亞衲族人的山地給他；約書亞就把希伯崙給他為業。","people":["caleb","joshua"]},{"key":"示羅分地","title":"在示羅拈鬮分地","ref":"書 18:1～19:51","summary":"以色列全會眾在示羅設立會幕，還有七個支派沒有分到地。約書亞派人走遍那地、畫成七分寫在冊子上，然後在耶和華面前拈鬮分給各支派；最後以色列人也把亭拿西拉分給約書亞為業。","people":["joshua"]},{"key":"設立逃城","title":"六座逃城","ref":"書 20:1–9","summary":"耶和華吩咐設立逃城，讓無心誤殺人的可以逃到那裡，免得被報血仇的人殺死，等候會眾審判。約旦河東西兩岸共分定六座城，包括基低斯、示劍、希伯崙。","people":["joshua"]},{"key":"河邊證壇","title":"河東支派築壇","ref":"書 22:1–34","summary":"流便、迦得和瑪拿西半支派回到河東，在約旦河邊築了一座大壇，西岸的以色列人以為他們背叛耶和華，聚集要攻打。祭司非尼哈和首領去查問，才知道這壇是要給後代作見證，證明河東的人也屬耶和華，壇就起名叫「證壇」。","people":[]},{"key":"示劍立約","title":"約書亞在示劍立約","ref":"書 24:1–33","summary":"約書亞召聚以色列眾支派到示劍，從亞伯拉罕說到進入迦南，要百姓選擇事奉誰，並說至於他和他家必定事奉耶和華。百姓回答也要事奉耶和華，約書亞就在那裡與他們立約。約書亞一百一十歲死了，從埃及帶來的約瑟骸骨也葬在示劍。","people":["joshua","joseph-ot"]}],"people":["joshua","rahab","caleb","moses","joseph-ot"],"verses":[{"ref":"書 1:9","text":"我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華─你的神必與你同在。"},{"ref":"書 24:15","text":"若是你們以事奉耶和華為不好，今日就可以選擇所要事奉的：是你們列祖在大河那邊所事奉的神呢？是你們所住這地的亞摩利人的神呢？至於我和我家，我們必定事奉耶和華。"}]}},{"t":"ot","id":"judges","order":7,"name":"士師記","abbr":"士","chapters":21,"group":"歷史書","data":{"id":"judges","order":7,"name":"士師記","abbr":"士","chapters":21,"group":"歷史書","oneLine":"以色列人一再離棄神、受欺壓、呼求，神興起士師拯救","background":{"author":"傳統上認為是撒母耳所寫，也有不同看法","date":"成書不確定；書中多次說「那時以色列中沒有王」，可能寫於王國初期","audience":"以色列人","place":"不確定，可能在以色列地","why":"約書亞和同時代的人死後，以色列各支派沒有把迦南人完全趕出，開始事奉巴力和亞斯他錄。從進迦南到撒母耳之前，沒有王、也沒有統一的領袖，各支派在外敵欺壓中靠神興起的士師一次次得救。"},"revelations":[{"key":"循環下沉","point":"犯罪、受欺壓、呼求、得拯救，一再重演。","explain":"書的開頭就說明這個循環：百姓行惡，神把他們交在敵人手中，他們哀求，神興起士師拯救；士師一死，他們又轉去行惡，而且比列祖更甚。","ref":"士 2:11–19"},{"key":"沒有完全順服","point":"沒有趕出的迦南人，成了以色列的網羅。","explain":"第 1 章一連串記錄各支派沒有趕出當地的居民，耶和華的使者說這些人要作他們肋下的荊棘，他們的神要作他們的網羅。","ref":"士 1:27～2:3"},{"key":"神用軟弱人","point":"神興起的拯救者常出人意料。","explain":"左手便利的以笏、一位女先知底波拉、在酒醡裡打麥子的基甸、妓女的兒子耶弗他，神都使用他們。新約在來 11:32 提到基甸、巴拉、參孫、耶弗他。","ref":"士 3:15；4:4；6:11；11:1"},{"key":"各人任意而行","point":"沒有王的時代，人人照自己看為對的去做。","explain":"書的最後五章記錄米迦的神像、但支派遷移、基比亞的惡事與便雅憫支派幾乎滅絕，兩次說「那時以色列中沒有王，各人任意而行」。","ref":"士 17:6；21:25"},{"key":"神的憐憫","point":"百姓一再背叛，神仍然一再拯救。","explain":"書中說百姓因受欺壓擾害哀聲歎氣，耶和華就後悔，為他們興起士師；百姓除掉外邦神時，耶和華因他們的苦難心中擔憂。這卷書呈現的是百姓的不忠和神持續的拯救。","ref":"士 2:18；10:16"}],"outline":[{"key":"沒有趕盡","range":"1:1～3:6","point":"各支派沒有把迦南人趕出，約書亞死後，新一代不認識耶和華，進入犯罪的循環。"},{"key":"早期士師","range":"3:7～5:31","point":"俄陀聶、以笏、珊迦、底波拉與巴拉相繼拯救以色列。"},{"key":"基甸家族","range":"6～9 章","point":"基甸用三百人打敗米甸人；他的兒子亞比米勒殺弟兄自立為王，最後被殺。"},{"key":"耶弗他等","range":"10～12 章","point":"幾位小士師之間，耶弗他打敗亞捫人，卻因許願失去獨生女兒。"},{"key":"參孫","range":"13～16 章","point":"拿細耳人參孫獨力對抗非利士人，最後在大袞廟與敵人同死。"},{"key":"沒有王時","range":"17～21 章","point":"米迦的神像、但支派遷移、基比亞的惡事與便雅憫之戰，顯出全國的混亂。"}],"stories":[{"key":"未盡逐出","title":"各支派沒有趕出迦南人","ref":"士 1:1～2:23","summary":"約書亞死後，猶大等支派繼續爭戰，但許多支派沒有趕出當地的居民，只叫他們服苦。耶和華的使者從吉甲上到波金責備百姓，百姓放聲而哭；新的一代不知道耶和華的作為，開始事奉巴力。","people":[]},{"key":"俄陀聶","title":"第一位士師俄陀聶","ref":"士 3:7–11","summary":"以色列人行惡，被美索不達米亞王古珊利薩田欺壓八年。他們呼求耶和華，耶和華興起迦勒的兄弟基納斯的兒子俄陀聶，耶和華的靈降在他身上，他打敗了古珊利薩田，國中太平四十年。","people":["caleb"]},{"key":"左手以笏","title":"以笏刺殺摩押王","ref":"士 3:12–30","summary":"摩押王伊磯倫欺壓以色列十八年。左手便利的便雅憫人以笏帶貢物去見王，說有機密的事要奏告，在王的涼樓上伸左手從右腿拔出劍來刺入王的肚腹，然後吹角召集以色列人擊敗摩押人。","people":[]},{"key":"底波拉之戰","title":"底波拉、巴拉與雅億","ref":"士 4:1～5:31","summary":"迦南王耶賓有鐵車九百輛，欺壓以色列二十年。女先知底波拉當時作士師，召巴拉從他泊山下去攻擊元帥西西拉，耶和華使西西拉的車與全軍潰亂；西西拉逃到希百的妻子雅億帳棚裡，雅億用帳棚的橛子把他釘死。第 5 章是底波拉和巴拉的得勝之歌。","people":["deborah-barak"]},{"key":"基甸受召","title":"酒醡裡的基甸","ref":"士 6:1–40","summary":"米甸人年年來毀壞莊稼，基甸在酒醡那裡打麥子，免得被米甸人看見。耶和華的使者向他顯現，稱他「大能的勇士」；他拆毀父親的巴力壇，又兩次用羊毛向神求證據，一次羊毛有露水而地是乾的，一次羊毛是乾的而地有露水。","people":["gideon"]},{"key":"三百勇士","title":"基甸三百人勝米甸","ref":"士 7:1～8:21","summary":"基甸召集了三萬二千人，耶和華說人太多，先讓懼怕的回去，再把用手捧水餂的三百人留下。三百人分三隊，手拿角和藏著火把的空瓶，半夜在米甸營外打破瓶子、吹角呼喊「耶和華和基甸的刀」，米甸全營自相殘殺而逃。","people":["gideon"]},{"key":"基甸以弗得","title":"基甸拒絕作王","ref":"士 8:22–35","summary":"以色列人請基甸和他的子孫管理他們，基甸說他不管理，也不叫兒子管理，惟有耶和華管理。但他用眾人奉獻的金耳環造了一個以弗得，放在俄弗拉，以色列人都去拜它，這就成了基甸和他全家的網羅。","people":["gideon"]},{"key":"亞比米勒","title":"亞比米勒自立為王","ref":"士 9:1–57","summary":"基甸的兒子亞比米勒在示劍人支持下，把他七十個弟兄殺在一塊磐石上，只有小兒子約坦躲藏起來。約坦站在山頂講了「樹木要膏一樹為王」的比喻警告示劍人；三年後亞比米勒和示劍人反目，在攻打提備斯時被一個婦人拋下的上磨石打破腦骨。","people":["gideon"]},{"key":"耶弗他許願","title":"耶弗他與他的女兒","ref":"士 10:6～11:40","summary":"耶弗他是基列人，因為是妓女的兒子被弟兄趕出，後來基列長老請他回來帶兵對抗亞捫人。他向耶和華許願，若得勝回來，就把第一個從家門出來迎接他的獻為燔祭；結果出來迎接的是他的獨生女兒。女兒求兩個月去為終身為處女哀哭，回來後父親照所許的願向她行了。","people":["jephthah"]},{"key":"示播列","title":"示播列與西播列","ref":"士 12:1–7","summary":"以法蓮人怪耶弗他打亞捫人沒有叫他們同去，雙方爭戰。基列人把守約旦河的渡口，叫逃過來的人說「示播列」，以法蓮人咬不真字音說成「西播列」，就被拿住殺了，那時被殺的有四萬二千人。","people":["jephthah"]},{"key":"參孫出生","title":"瑪挪亞得子","ref":"士 13:1–25","summary":"以色列人被非利士人欺壓四十年。耶和華的使者向但族人瑪挪亞不生育的妻子顯現，說她必生一個兒子，不可用剃頭刀剃他的頭，因為他一出胎就歸神作拿細耳人；孩子生下來取名參孫，耶和華的靈開始感動他。","people":["samson"]},{"key":"獅子與謎語","title":"參孫與非利士人結仇","ref":"士 14:1～15:20","summary":"參孫要娶亭拿的非利士女子，路上徒手撕裂一隻少壯獅子，後來在獅子的屍身裡發現蜂蜜，就用這事出謎語。之後雙方結仇，他捉了三百隻狐狸、尾巴綁上火把燒了非利士人的禾稼，又用一塊未乾的驢腮骨擊殺一千人。","people":["samson"]},{"key":"參孫大利拉","title":"參孫與大利拉","ref":"士 16:1–31","summary":"參孫喜愛梭烈谷的婦人大利拉，非利士首領用銀子收買她，要她探出參孫的力氣從哪裡來。她一再催逼，參孫說出頭髮從未剃過，頭髮被剃後力氣就離開他，被剜眼、在監裡推磨。非利士人在大袞廟慶祝時叫他出來戲耍，他求神再賜一次力量，抱住柱子使房子倒塌，死時所殺的人比活著所殺的還多。","people":["samson"]},{"key":"米迦與但族","title":"米迦的神像與但支派","ref":"士 17:1～18:31","summary":"以法蓮山地的米迦造了神像和以弗得，雇一個利未少年人作他家的祭司。但支派要找地居住，經過時帶走了神像和這個祭司，攻取拉億改名叫但，在那裡設立雕刻的像。書中說那時以色列中沒有王，各人任意而行。","people":[]},{"key":"基比亞惡事","title":"基比亞的惡事與便雅憫之戰","ref":"士 19:1～21:25","summary":"一個利未人帶著他的妾在便雅憫的基比亞過夜，城中匪徒圍住房子，那妾被凌辱致死。利未人把屍體切成十二塊送到以色列四境，各支派聚集攻打便雅憫，便雅憫人幾乎被滅盡；後來眾人為了讓這支派存留，讓剩下的人在示羅女子跳舞時各搶一個為妻。全書以「各人任意而行」結束。","people":[]}],"people":["deborah-barak","gideon","jephthah","samson","caleb"],"verses":[{"ref":"士 2:16","text":"耶和華興起士師，士師就拯救他們脫離搶奪他們人的手。"},{"ref":"士 21:25","text":"那時，以色列中沒有王，各人任意而行。"}]}},{"t":"ot","id":"ruth","order":8,"name":"路得記","abbr":"得","chapters":4,"group":"歷史書","data":{"id":"ruth","order":8,"name":"路得記","abbr":"得","chapters":4,"group":"歷史書","oneLine":"摩押女子路得跟隨婆婆回伯利恆，成為大衛的曾祖母","background":{"author":"不詳，傳統上認為是撒母耳所寫，也有不同看法","date":"不確定；書末家譜寫到大衛，應在大衛時代或以後","audience":"以色列人","place":"不確定","why":"故事發生在士師秉政的時候，和士師記的混亂同一個時代。一個伯利恆家庭因饑荒到摩押避難，男人都死在那裡，留下三個寡婦；這卷書記錄外邦女子路得如何進入以色列，並接上大衛的家譜。"},"revelations":[{"key":"忠誠的愛","point":"路得對婆婆的忠誠，是全書的核心。","explain":"路得本可以回娘家，卻選擇跟隨拿俄米，說「你的國就是我的國，你的神就是我的神」。波阿斯也稱讚她待婆婆的一切。","ref":"得 1:16–17；2:11"},{"key":"外邦人蒙接納","point":"摩押女子被接納進以色列。","explain":"路得是摩押人，卻投靠耶和華以色列神的翅膀下，最後成為以色列人的一分子，還名列大衛的家譜。新約在太 1:5 把她列在耶穌的家譜裡。","ref":"得 2:12；4:13–17"},{"key":"至近親屬","point":"親屬有責任贖回產業、延續家名。","explain":"照以色列的習俗，至近的親屬可以贖回族人的田地、娶寡婦為死者留名。波阿斯照這規矩在城門口公開辦理，娶了路得。","ref":"得 3:9–13；4:1–10"},{"key":"從空到滿","point":"拿俄米從「空空地回來」到抱著孫子。","explain":"拿俄米回到伯利恆時說要叫她「瑪拉」，因為全能者使她受了大苦；書末鄰舍的婦人說「拿俄米得孩子了」。","ref":"得 1:20–21；4:14–17"},{"key":"平凡中的帶領","point":"神的作為藏在日常裡。","explain":"書中沒有神蹟，只有饑荒、回鄉、恰巧到波阿斯的田裡拾穗、在城門口辦事，故事卻一路走向大衛的出生。","ref":"得 2:3；4:17"}],"outline":[{"key":"摩押喪夫","range":"1:1–5","point":"以利米勒一家因饑荒到摩押，他和兩個兒子都死了，留下拿俄米、路得、俄珥巴。"},{"key":"回伯利恆","range":"1:6–22","point":"拿俄米決定回鄉，俄珥巴回娘家，路得堅持跟隨，兩人在收大麥時回到伯利恆。"},{"key":"拾穗蒙恩","range":"2 章","point":"路得到波阿斯的田裡拾麥穗，波阿斯厚待她。"},{"key":"夜見波阿斯","range":"3 章","point":"拿俄米教路得夜裡到禾場，請波阿斯盡至近親屬的本分。"},{"key":"贖產娶親","range":"4 章","point":"波阿斯在城門口贖產、娶路得，生下俄備得，接上大衛的家譜。"}],"stories":[{"key":"避荒摩押","title":"以利米勒一家到摩押","ref":"得 1:1–5","summary":"士師秉政的時候國中遭遇饑荒，伯利恆人以利米勒帶著妻子拿俄米和兩個兒子瑪倫、基連到摩押地寄居。以利米勒死了，兩個兒子娶了摩押女子俄珥巴和路得，約十年後兩個兒子也死了。","people":["naomi","ruth"]},{"key":"路得跟隨","title":"路得不肯離開婆婆","ref":"得 1:6–22","summary":"拿俄米聽說耶和華眷顧自己的百姓，就要回猶大，勸兩個媳婦回娘家。俄珥巴與婆婆親嘴告別，路得卻捨不得，說不要催她回去，婆婆往哪裡去她也往哪裡去；兩人在動手割大麥的時候回到伯利恆，拿俄米說不要再叫她拿俄米，要叫她瑪拉。","people":["ruth","naomi"]},{"key":"田間拾穗","title":"路得在波阿斯的田裡","ref":"得 2:1–23","summary":"路得到田間拾取麥穗，恰巧到了以利米勒的親族、大財主波阿斯的田裡。波阿斯聽說她待婆婆的事，叫她只在他田裡拾取，又吩咐僕人故意從捆裡抽出些來留給她；拿俄米得知後，說這人是他們至近的親屬。","people":["ruth","boaz","naomi"]},{"key":"禾場夜求","title":"路得在禾場","ref":"得 3:1–18","summary":"拿俄米教路得沐浴抹膏，夜裡到波阿斯簸大麥的禾場，等他睡下後掀開他腳上的被躺臥。波阿斯半夜醒來，路得請他用衣襟遮蓋她，因為他是至近的親屬；波阿斯答應，但說還有一個比他更近的親屬，要先問那人。","people":["ruth","boaz","naomi"]},{"key":"城門贖產","title":"波阿斯在城門口贖產","ref":"得 4:1–12","summary":"波阿斯在城門口請那位更近的親屬和十位長老坐下，說明拿俄米要賣以利米勒的地。那人本來願意贖，聽說要同時娶路得、為死人留名，就怕損害自己的產業而放棄，脫鞋給波阿斯為證；波阿斯就在眾人面前買下產業，娶路得為妻。","people":["boaz","ruth","naomi"]},{"key":"俄備得出生","title":"大衛的祖先","ref":"得 4:13–22","summary":"路得生了一個兒子，鄰舍的婦人說「拿俄米得孩子了」，給孩子起名叫俄備得。俄備得是耶西的父親，耶西是大衛的父親，書末列出從法勒斯到大衛的家譜。新約在太 1:5 記載波阿斯從路得氏生俄備得。","people":["ruth","boaz","naomi","david"]}],"people":["ruth","naomi","boaz","david"],"verses":[{"ref":"得 1:16","text":"路得說：不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。"},{"ref":"得 2:12","text":"願耶和華照你所行的賞賜你。你來投靠耶和華─以色列神的翅膀下，願你滿得他的賞賜。"}]}},{"t":"ot","id":"1samuel","order":9,"name":"撒母耳記上","abbr":"撒上","chapters":31,"group":"歷史書","data":{"id":"1samuel","order":9,"name":"撒母耳記上","abbr":"撒上","chapters":31,"group":"歷史書","oneLine":"從撒母耳出生到掃羅作王、大衛興起，以色列走進王國時代","background":{"author":"作者不詳；傳統上依代上 29:29 認為取材自撒母耳、拿單、迦得的記錄","date":"不確定；所記的事約在主前 11 世紀，成書在這之後","audience":"以色列人","place":"不確定，可能在以色列地","why":"士師時代末期，祭司以利的家敗壞，非利士人強大，連約櫃都被擄去。百姓要求像列國一樣立王，這卷書記錄最後一位士師撒母耳、第一位王掃羅，以及神揀選的大衛如何一步步取代掃羅。"},"revelations":[{"key":"過渡到王國","point":"以色列從士師時代進入王國時代。","explain":"撒母耳是最後一位士師，也是膏立前兩位王的先知。百姓要求立王，神吩咐撒母耳依從，但也說明他們是厭棄神作他們的王。","ref":"撒上 8:4–22"},{"key":"聽命勝獻祭","point":"神看重的是順服，不是表面的獻祭。","explain":"掃羅兩次沒有照神的吩咐行，一次擅自獻祭，一次留下亞瑪力王和上好的牛羊。撒母耳說聽命勝於獻祭，掃羅因此被神厭棄。","ref":"撒上 13:8–14；15:22–23"},{"key":"看內心","point":"神揀選人，不像人看外貌。","explain":"掃羅身材高大，大衛卻是耶西家最小、正在放羊的兒子。撒母耳膏大衛時，神說人是看外貌，耶和華是看內心。新約在徒 13:22 提到神說大衛是合他心意的人。","ref":"撒上 16:7；13:14"},{"key":"勝敗在神","point":"爭戰的勝敗全在乎耶和華。","explain":"大衛迎戰歌利亞時說，他來攻擊對方是靠萬軍之耶和華的名，要使眾人知道耶和華使人得勝不是用刀用槍。","ref":"撒上 17:45–47"},{"key":"尊重受膏者","point":"大衛兩次有機會殺掃羅，都不肯下手。","explain":"掃羅追殺大衛多年，大衛在隱基底的洞裡和西弗的營中都放過他，說不敢伸手害耶和華的受膏者，把報應交給神。","ref":"撒上 24:6；26:9–11"},{"key":"尊重我的","point":"尊重神的，神必看重他。","explain":"以利的兒子藐視獻給耶和華的祭物，神預言以利家必衰敗；哈拿謙卑禱告，生下撒母耳。這卷書一開始就對照兩個家庭。","ref":"撒上 2:12–17；2:30"}],"outline":[{"key":"撒母耳興起","range":"1～3 章","point":"哈拿求子生下撒母耳，以利的兒子敗壞，撒母耳在示羅蒙召。"},{"key":"約櫃風波","range":"4～7 章","point":"約櫃被非利士人擄去又送回，撒母耳在米斯巴帶領百姓悔改得勝。"},{"key":"掃羅作王","range":"8～12 章","point":"百姓求王，掃羅受膏並被立為王，撒母耳發表告別演說。"},{"key":"掃羅被厭棄","range":"13～15 章","point":"掃羅擅自獻祭、沒有滅盡亞瑪力人，被神厭棄。"},{"key":"大衛興起","range":"16～20 章","point":"大衛受膏、打敗歌利亞，掃羅嫉妒要殺他，約拿單與大衛結盟。"},{"key":"大衛逃亡","range":"21～30 章","point":"大衛帶著跟隨他的人四處躲避，兩次不殺掃羅，最後投靠非利士地。"},{"key":"掃羅之死","range":"31 章","point":"以色列人在基利波山大敗，掃羅和約拿單等三個兒子都死了。"}],"stories":[{"key":"哈拿求子","title":"哈拿禱告生撒母耳","ref":"撒上 1:1～2:11","summary":"以利加拿有兩個妻子，毘尼拿有兒女，哈拿沒有，常被毘尼拿作對激動。哈拿在示羅的殿裡心裡愁苦痛哭禱告，許願若得兒子就把他歸給耶和華；祭司以利以為她喝醉了。她後來生了撒母耳，斷奶後就帶他到示羅交給以利，並向耶和華唱了一首禱告的詩歌。","people":["hannah","eli","samuel"]},{"key":"撒母耳蒙召","title":"僕人敬聽","ref":"撒上 2:12～3:21","summary":"以利的兩個兒子何弗尼、非尼哈是惡人，藐視獻給耶和華的祭物，以利勸了卻沒有用。那時耶和華的言語稀少，少年撒母耳夜裡三次聽見呼喚，以為是以利叫他；以利明白是耶和華在呼喚，教他回答「請說，僕人敬聽」。神向撒母耳說了要審判以利家的事，以色列眾人都知道撒母耳被立為先知。","people":["samuel","eli"]},{"key":"約櫃被擄","title":"約櫃落入非利士人手中","ref":"撒上 4:1～6:21","summary":"以色列人和非利士人在亞弗打仗，把約櫃抬到營中，結果大敗，約櫃被擄，何弗尼、非尼哈都死了；九十八歲的以利聽到約櫃被擄，從位上往後跌倒，折斷頸項而死。非利士人把約櫃放在大袞廟裡，大袞像倒在約櫃前，他們又受瘟疫之苦，最後用兩頭母牛拉的新車把約櫃送回伯示麥。","people":["eli"]},{"key":"以便以謝","title":"米斯巴的得勝","ref":"撒上 7:1–17","summary":"約櫃放在基列耶琳二十年，撒母耳要以色列人除掉外邦的神，聚集在米斯巴禁食認罪。非利士人來攻擊時，耶和華大發雷聲，非利士人潰亂被擊敗；撒母耳立了一塊石頭，起名叫以便以謝，說到如今耶和華都幫助我們。","people":["samuel"]},{"key":"百姓求王","title":"要像列國一樣立王","ref":"撒上 8:1–22","summary":"撒母耳年紀老邁，他的兒子作士師卻貪圖財利、收受賄賂。長老們聚集要求立一個王治理他們，像列國一樣；撒母耳不喜悅，耶和華卻說他們不是厭棄撒母耳，乃是厭棄神作他們的王，吩咐撒母耳警告百姓王會怎樣管轄他們，然後依從他們。","people":["samuel"]},{"key":"掃羅受膏","title":"尋驢的掃羅成了王","ref":"撒上 9:1～11:15","summary":"便雅憫人掃羅又健壯又俊美，比眾民高過一頭，他出去尋找父親走失的驢，遇見撒母耳，撒母耳用膏油膏他。後來撒母耳在米斯巴召集百姓掣籤，掣出掃羅，他卻藏在器具中。不久亞捫人拿轄圍攻基列雅比，掃羅召集眾人救了雅比，百姓就在吉甲立他為王。","people":["saul","samuel"]},{"key":"擅自獻祭","title":"掃羅在吉甲獻祭","ref":"撒上 13:1～14:46","summary":"非利士人聚集大軍，以色列百姓驚慌散去。掃羅照撒母耳所定的日期等了七天，撒母耳還沒來，他就自己獻上燔祭；撒母耳一到便責備他，說他的王位必不長久，耶和華已經尋著一個合他心意的人。接著約拿單和拿兵器的人兩人突擊非利士人的防營，帶來一場大勝。","people":["saul","samuel","jonathan"]},{"key":"亞瑪力之戰","title":"聽命勝於獻祭","ref":"撒上 15:1–35","summary":"耶和華吩咐掃羅擊打亞瑪力人，把他們所有的盡行毀滅。掃羅卻留下亞甲王和上好的牛羊，說是要獻給耶和華。撒母耳說聽命勝於獻祭，因為掃羅厭棄耶和華的命令，耶和華也厭棄他作王；書中說耶和華後悔立掃羅為王，撒母耳直到死再沒有見掃羅。","people":["saul","samuel"]},{"key":"大衛受膏","title":"耶西家最小的兒子","ref":"撒上 16:1–23","summary":"耶和華差撒母耳到伯利恆耶西家去膏一個王。撒母耳看見高大的以利押，以為就是他，神說不要看外貌；耶西七個兒子都經過了，最後從羊群中叫回最小的大衛，撒母耳就用膏油膏他。之後掃羅被惡魔擾亂，臣僕找來善於彈琴的大衛，大衛彈琴，掃羅就舒暢。","people":["david","samuel","saul"]},{"key":"大衛歌利亞","title":"大衛打敗歌利亞","ref":"撒上 17:1–58","summary":"非利士人和以色列人在以拉谷對陣，迦特人歌利亞身高六肘零一虎口，連續四十天出來罵陣，以色列人都很害怕。少年大衛送飯給哥哥，聽見罵陣就自願出戰，不穿掃羅的盔甲，只拿杖、機弦和溪中挑選的五塊光滑石子；他用機弦甩石打進歌利亞的額，再用歌利亞的刀割下他的頭，非利士人就逃跑了。","people":["david","saul"]},{"key":"掃羅嫉妒","title":"掃羅殺死千千，大衛殺死萬萬","ref":"撒上 18:1～19:24","summary":"約拿單的心與大衛深相契合，愛大衛如同愛自己的性命，把外袍和刀弓都給了他。婦女們唱著「掃羅殺死千千，大衛殺死萬萬」，掃羅從此怒視大衛，兩次用槍刺他，又只要一百個非利士人的陽皮作聘禮，想使大衛死在非利士人手裡；掃羅的女兒米甲嫁給大衛後，用家中的神像假裝大衛躺在床上，幫他從窗戶逃走。","people":["david","saul","jonathan"]},{"key":"約拿單結盟","title":"約拿單射箭報信","ref":"撒上 20:1–42","summary":"大衛問約拿單自己到底犯了什麼罪，約拿單答應試探父親的心意，兩人約好用射箭作暗號。掃羅在月朔的筵席上發怒，甚至拿槍要刺約拿單；約拿單到田野射箭，告訴大衛快快逃走，兩人哭著分別，指著耶和華的名起誓彼此後裔永遠和好。","people":["jonathan","david","saul"]},{"key":"不殺掃羅","title":"洞中割衣襟與營中取槍","ref":"撒上 24:1–22；26:1–25","summary":"掃羅帶三千精兵在隱基底追捕大衛，進了大衛藏身的洞裡，大衛只悄悄割下他外袍的衣襟，說不敢伸手害耶和華的受膏者。後來在西弗的曠野，大衛夜裡進掃羅的營，拿走他頭旁的槍和水瓶也沒有殺他。掃羅兩次都承認自己錯了，卻沒有停止追趕。","people":["david","saul"]},{"key":"拿八亞比該","title":"亞比該攔阻大衛","ref":"撒上 25:1–44","summary":"撒母耳死了，以色列眾人為他哀哭。大衛派人向富戶拿八求些食物，拿八辱罵來人，大衛就帶四百人要去報復。拿八的妻子亞比該聰明俊美，趕緊帶著餅、酒、羊去迎接大衛，攔阻他流人的血；十天後拿八被耶和華擊打而死，大衛就娶了亞比該。","people":["david","samuel"]},{"key":"隱多珥婦人","title":"掃羅求問交鬼的婦人","ref":"撒上 28:3–25","summary":"非利士人聚集攻打以色列，掃羅求問耶和華，耶和華卻不藉夢、烏陵或先知回答他。掃羅改裝夜裡去隱多珥找一個交鬼的婦人，要她招上撒母耳來；書中記撒母耳對他說耶和華已經離開他，明日掃羅和他的眾子必與撒母耳在一處，掃羅聽了就全身仆倒在地。","people":["saul","samuel"]},{"key":"基利波山","title":"掃羅與約拿單之死","ref":"撒上 31:1–13","summary":"以色列人在基利波山被非利士人打敗，約拿單和掃羅另外兩個兒子都被殺。掃羅受了重傷，叫拿兵器的人把他刺死，那人不敢，掃羅就自己伏在刀上死了。非利士人把他的屍身釘在伯珊城牆上，基列雅比的勇士連夜把屍身取下，燒了以後把骸骨葬在雅比。","people":["saul","jonathan"]}],"people":["hannah","eli","samuel","saul","jonathan","david"],"verses":[{"ref":"撒上 15:22","text":"撒母耳說：耶和華喜悅燔祭和平安祭，豈如喜悅人聽從他的話呢？聽命勝於獻祭；順從勝於公羊的脂油。"},{"ref":"撒上 16:7","text":"耶和華卻對撒母耳說：「不要看他的外貌和他身材高大，我不揀選他。因為，耶和華不像人看人：人是看外貌；耶和華是看內心。」"},{"ref":"撒上 17:47","text":"又使這眾人知道耶和華使人得勝，不是用刀用槍，因為爭戰的勝敗全在乎耶和華。他必將你們交在我們手裡。"}]}},{"t":"ot","id":"2samuel","order":10,"name":"撒母耳記下","abbr":"撒下","chapters":24,"group":"歷史書","data":{"id":"2samuel","order":10,"name":"撒母耳記下","abbr":"撒下","chapters":24,"group":"歷史書","oneLine":"大衛作王四十年：國家興盛、神與他立約，也經歷犯罪與家變","background":{"author":"作者不詳；傳統上依代上 29:29 認為取材自撒母耳、拿單、迦得的記錄","date":"不確定；大衛作王約在主前 1000 年前後，成書在這之後","audience":"以色列人","place":"不確定，可能在以色列地","why":"掃羅死後，以色列分成兩邊：猶大擁立大衛，其餘支派跟隨掃羅的兒子伊施波設。這卷書記錄大衛如何統一全國、定都耶路撒冷、得到神的應許，以及他與拔示巴的事之後，家中接連發生的悲劇。"},"revelations":[{"key":"永遠國位","point":"神應許大衛的國位必堅定直到永遠。","explain":"大衛想為約櫃建殿，神藉拿單說不是大衛建殿，而是神要為大衛建立家，他的後裔要坐國位。新約在來 1:5 引用「我要作他的父，他要作我的子」。","ref":"撒下 7:1–17"},{"key":"統一與定都","point":"大衛從猶大王成為全以色列的王。","explain":"大衛先在希伯崙作猶大王七年半，再被以色列眾支派膏立，攻取錫安的保障，定都耶路撒冷，又把約櫃運進城。","ref":"撒下 2:1–4；5:1–10；6:12–19"},{"key":"罪的後果","point":"大衛犯罪蒙赦免，後果卻延續在家中。","explain":"大衛取了拔示巴、設計殺死烏利亞，拿單當面指出「你就是那人」。大衛認罪，神赦免他，但拿單說刀劍必永不離開他的家，接著暗嫩、押沙龍的事相繼發生。","ref":"撒下 12:7–14"},{"key":"真心認罪","point":"大衛被指出罪後，立刻承認。","explain":"大衛對拿單說「我得罪耶和華了」，沒有推卸。數點百姓後他也自責，說是自己犯了罪，求神的手攻擊他和他的父家。","ref":"撒下 12:13；24:10–17"},{"key":"恩待與信實","point":"大衛守住與約拿單的約。","explain":"大衛找到約拿單瘸腿的兒子米非波設，把掃羅的田地都還給他，讓他常與王同席吃飯。","ref":"撒下 9:1–13"},{"key":"神是磐石","point":"大衛晚年回顧一生，稱頌神是他的磐石。","explain":"第 22 章是大衛脫離仇敵與掃羅之手時的詩歌，和詩篇第 18 篇內容相近，把一生的得勝歸給耶和華。","ref":"撒下 22:1–51"}],"outline":[{"key":"希伯崙作王","range":"1～4 章","point":"大衛為掃羅和約拿單作哀歌，在希伯崙作猶大王，和掃羅家爭戰。"},{"key":"統一王國","range":"5～10 章","point":"大衛作全以色列的王，定都耶路撒冷、迎約櫃、得神立約、四方得勝。"},{"key":"犯罪與家變","range":"11～14 章","point":"大衛與拔示巴犯罪，拿單責備；暗嫩、他瑪的事後，押沙龍殺暗嫩出逃。"},{"key":"押沙龍之亂","range":"15～20 章","point":"押沙龍篡位，大衛出逃，押沙龍戰死，大衛回京後又平定示巴之亂。"},{"key":"附錄","range":"21～24 章","point":"基遍人的事、勇士名單、大衛的詩歌與遺言、數點百姓與亞勞拿的禾場。"}],"stories":[{"key":"弓歌","title":"大衛為掃羅與約拿單哀哭","ref":"撒下 1:1–27","summary":"一個亞瑪力少年人從營中跑來，報告掃羅和約拿單已經死了，還自稱是他殺了掃羅，帶來掃羅的冠冕和鐲子。大衛和跟隨他的人撕裂衣服哀哭，大衛以那人殺了耶和華的受膏者為由把他處死，又作了一首哀歌，名叫弓歌，說「大英雄何竟死亡」。","people":["david","saul","jonathan"]},{"key":"兩家相爭","title":"大衛家與掃羅家","ref":"撒下 2:1～4:12","summary":"猶大人在希伯崙膏大衛作猶大家的王，掃羅的元帥押尼珥則立掃羅的兒子伊施波設作以色列的王，兩家爭戰很久。押尼珥殺了約押的兄弟亞撒黑，後來押尼珥要歸順大衛，約押在城門的甕洞刺死他報仇；伊施波設也被手下殺害，大衛為押尼珥哀哭，並處死殺伊施波設的人。","people":["david"]},{"key":"定都耶京","title":"攻取錫安的保障","ref":"撒下 5:1–25","summary":"以色列眾支派到希伯崙膏大衛作全以色列的王，大衛登基時三十歲，在位四十年。他攻取耶布斯人的錫安保障，稱為大衛的城，泰爾王希蘭還為他建造宮殿；非利士人兩次來攻，大衛求問耶和華後都打敗了他們。","people":["david"]},{"key":"約櫃進城","title":"大衛在約櫃前跳舞","ref":"撒下 6:1–23","summary":"大衛用新車把約櫃從巴拉猶大運上來，牛失前蹄，烏撒伸手扶住約櫃，神就擊殺他，大衛害怕，把約櫃暫放在俄別以東家三個月。後來大衛再去把約櫃抬進大衛的城，穿著細麻布的以弗得在耶和華面前極力跳舞；米甲從窗戶看見，心裡輕視他。","people":["david"]},{"key":"大衛之約","title":"神應許為大衛建立家","ref":"撒下 7:1–29","summary":"大衛住在香柏木的宮中，想到約櫃還在幔子裡，要為神建殿。神藉先知拿單說，不是大衛為神建殿，而是神要為大衛建立家，他的後裔要建殿，國位必堅定直到永遠。大衛進去坐在耶和華面前禱告感謝。","people":["david","nathan"]},{"key":"米非波設","title":"恩待約拿單的兒子","ref":"撒下 9:1–13","summary":"大衛問掃羅家還有沒有剩下的人，他要因約拿單的緣故向他施恩。掃羅的僕人洗巴說約拿單有一個兩腿瘸的兒子米非波設；大衛把掃羅的一切田地都還給他，叫他常與王同席吃飯，像王的兒子一樣。","people":["david","jonathan"]},{"key":"拔示巴","title":"大衛與拔示巴","ref":"撒下 11:1–27","summary":"列王出戰的時候，大衛留在耶路撒冷，在王宮平頂上看見一個婦人沐浴，就是赫人烏利亞的妻子拔示巴，大衛召她來與她同房，她就懷孕了。大衛先叫烏利亞回家，他不肯；大衛就寫信給約押，把烏利亞派到陣勢極險之處，讓他陣亡，然後娶了拔示巴。書中說大衛所行的這事，耶和華甚不喜悅。","people":["david","bathsheba"]},{"key":"你就是那人","title":"拿單的比喻","ref":"撒下 12:1–25","summary":"拿單對大衛講一個比喻：富戶有許多牛羊，卻取了窮人僅有的一隻小母羊羔待客。大衛大怒，說這人該死，拿單說「你就是那人」。大衛說「我得罪耶和華了」，拿單說耶和華已經除掉他的罪，但這孩子必定要死；孩子死後，拔示巴又生了所羅門，耶和華藉拿單賜他名叫耶底底亞。","people":["nathan","david","bathsheba","solomon"]},{"key":"暗嫩他瑪","title":"押沙龍為妹妹報仇","ref":"撒下 13:1–39","summary":"大衛的長子暗嫩戀慕同父異母的妹妹他瑪，裝病把她騙進屋裡玷辱了她，之後又恨惡她把她趕出去。大衛聽見甚發怒，卻沒有處置；他瑪的同母哥哥押沙龍等了兩年，在剪羊毛的筵席上叫僕人殺了暗嫩，然後逃到基述住了三年。","people":["absalom","david"]},{"key":"押沙龍叛變","title":"大衛逃出耶路撒冷","ref":"撒下 14:1～17:29","summary":"約押設法讓押沙龍回到耶路撒冷，押沙龍天天在城門口攔住求王判斷的人，暗中得了以色列人的心，後來在希伯崙自立為王。大衛帶著臣僕逃出耶路撒冷，蒙頭赤腳哭著上橄欖山，路上還被掃羅族人示每咒罵；押沙龍的謀士亞希多弗獻計要追殺大衛，大衛的朋友戶篩卻用另一個計策打亂了它。","people":["absalom","david"]},{"key":"押沙龍之死","title":"我兒押沙龍","ref":"撒下 18:1～19:8","summary":"兩軍在以法蓮樹林交戰，大衛吩咐將領要寬待押沙龍。押沙龍騎著騾子從大橡樹密枝底下經過，頭髮被樹枝繞住懸掛起來，約押拿三杆短槍刺透他的心。大衛聽到消息，上城門樓哀哭說「我兒押沙龍啊！我兒，我兒押沙龍啊」，約押勸他出去安慰眾軍。","people":["absalom","david"]},{"key":"回京平亂","title":"大衛回京與示巴之亂","ref":"撒下 19:9～20:26","summary":"大衛回耶路撒冷，曾咒罵他的示每前來求饒，大衛起誓不殺他；米非波設也出來迎接。猶大人和以色列人為了誰與王更親而爭吵，便雅憫人示巴趁機吹角叛變，約押追到亞伯伯瑪迦城，城中一個聰明婦人勸眾人把示巴的首級從城牆上丟給約押，亂事就平息了。","people":["david"]},{"key":"基遍人","title":"三年饑荒與基遍人","ref":"撒下 21:1–14","summary":"大衛年間一連三年饑荒，大衛求問耶和華，耶和華說是因掃羅殺死基遍人。大衛問基遍人要怎樣贖這罪，把掃羅的七個子孫交給他們；掃羅的妃嬪利斯巴在磐石上守護屍體，大衛得知後，把掃羅和約拿單的骸骨也一同葬在便雅憫地。","people":["david","saul","jonathan"]},{"key":"大衛的詩歌","title":"大衛的詩歌與遺言","ref":"撒下 22:1～23:7","summary":"大衛在耶和華救他脫離一切仇敵和掃羅之手的日子，作詩稱頌耶和華是他的巖石、山寨、救主，和詩篇第 18 篇內容相近。接著是大衛末了的話，說以公義治理人的，必像日出的晨光。第 23 章後半列出大衛的勇士。","people":["david"]},{"key":"數點百姓","title":"數點百姓與亞勞拿的禾場","ref":"撒下 24:1–25","summary":"大衛吩咐約押數點以色列和猶大的百姓，數完後心中自責，承認自己犯了大罪。先知迦得讓他在三樣災中選一樣，大衛選了落在耶和華手裡，瘟疫臨到，民間死了七萬人。大衛照迦得的吩咐，用五十舍客勒銀子買了耶布斯人亞勞拿的禾場和牛，在那裡築壇獻祭，瘟疫就止住了。","people":["david"]}],"people":["david","nathan","bathsheba","absalom","solomon","jonathan","saul"],"verses":[{"ref":"撒下 7:16","text":"你的家和你的國必在我面前永遠堅立。你的國位也必堅定，直到永遠。"},{"ref":"撒下 12:13","text":"大衛對拿單說：「我得罪耶和華了！」拿單說：耶和華已經除掉你的罪，你必不至於死。"}]}},{"t":"ot","id":"1kings","order":11,"name":"列王紀上","abbr":"王上","chapters":22,"group":"歷史書","data":{"id":"1kings","order":11,"name":"列王紀上","abbr":"王上","chapters":22,"group":"歷史書","oneLine":"所羅門的盛世，到王國分裂與以利亞的對決","background":{"author":"作者不詳；猶太傳統認為是耶利米所寫，也有不同看法","date":"約主前 560 年以後成書（列王紀下結尾記到被擄第三十七年）","audience":"被擄到巴比倫的以色列人","place":"不確定，可能在巴比倫或猶大地","why":"列王紀上下原本是一卷書，從大衛晚年寫到猶大被擄。上卷記所羅門的智慧與建殿、他晚年離開耶和華，接著王國分裂成北國以色列與南國猶大，後半以先知以利亞對抗亞哈王為主軸，說明國家興衰和君王是否專一事奉耶和華有關。"},"revelations":[{"key":"智慧從神來","point":"所羅門的智慧是向耶和華求來的。","explain":"所羅門在基遍不求壽、不求富，只求能判斷百姓、辨別是非，耶和華就賜他智慧，也加給他富足和尊榮。兩婦爭子的審判讓全國看見這份智慧。","ref":"王上 3:5–28"},{"key":"聖殿與同在","point":"聖殿建成，耶和華的榮光充滿殿。","explain":"所羅門照大衛的心願建殿，約櫃抬進至聖所時雲彩充滿殿。他在獻殿禱告中也承認，天和天上的天尚且不足神居住。","ref":"王上 6～8"},{"key":"偏離帶來分裂","point":"所羅門晚年隨從別神，王國因此被撕裂。","explain":"他娶了許多外邦妃嬪，年老時心被誘惑去隨從別神。耶和華說要把國奪回，只留一個支派給他的兒子，羅波安時就應驗了。","ref":"王上 11:1–13；12"},{"key":"惟獨耶和華","point":"迦密山上證明只有耶和華是神。","explain":"亞哈和耶洗別在北國推行巴力崇拜，以利亞在迦密山上與巴力的先知對決，火從天降，眾民俯伏說「耶和華是神」。","ref":"王上 18:20–40"},{"key":"先知的聲音","point":"神藉先知向君王說話，指出他們的罪。","explain":"拿單、亞希雅、以利亞、米該雅等先知在王面前傳話。君王聽或不聽，常常決定了自己和國家的結局。","ref":"王上 11:29–39；21～22"},{"key":"以大衛為標準","point":"每位王都拿來和大衛比較。","explain":"書中評論君王，常說他「效法他祖大衛」或「不像他祖大衛」。北國諸王則常被說「行耶羅波安所行的」，就是拜他所立的金牛犢。","ref":"王上 15:3–5；15:11；15:34"}],"outline":[{"key":"所羅門繼位","range":"1～2 章","point":"大衛年老，亞多尼雅自立為王；大衛立所羅門接續王位，臨終囑咐他遵行耶和華的道。"},{"key":"智慧與建殿","range":"3～10 章","point":"所羅門求得智慧，建造聖殿與王宮，獻殿禱告，名聲傳到示巴。"},{"key":"所羅門晚年","range":"11 章","point":"妃嬪誘他隨從別神，耶和華興起敵人，並預告國要分裂。"},{"key":"王國分裂","range":"12～16 章","point":"羅波安失去十個支派，耶羅波安在北國另立金牛犢；南北兩國諸王相繼。"},{"key":"以利亞與亞哈","range":"17～22 章","point":"以利亞宣告旱災、在迦密山對決巴力先知、逃到何烈山；亞哈奪拿伯葡萄園，最後戰死。"}],"stories":[{"key":"膏立所羅門","title":"所羅門被膏立為王","ref":"王上 1～2","summary":"大衛年老時，兒子亞多尼雅自立為王並大擺筵席。先知拿單和拔示巴進去提醒大衛先前的應許，大衛就命祭司撒督和拿單在基訓膏所羅門作王，百姓吹角歡呼。","people":["david","solomon","nathan","bathsheba"]},{"key":"基遍求智慧","title":"所羅門在基遍求智慧","ref":"王上 3:1–15","summary":"所羅門到基遍獻一千犧牲作燔祭，夜間耶和華在夢中問他要什麼。他求一顆能判斷百姓、辨別是非的心，耶和華喜悅，不但賜他智慧，也賜他沒有求的富足和尊榮。","people":["solomon"]},{"key":"兩婦爭子","title":"兩個婦人爭一個孩子","ref":"王上 3:16–28","summary":"兩個同住的婦人各生一子，其中一個孩子夜裡死了，兩人都說活的孩子是自己的。所羅門叫人拿刀來把孩子劈成兩半，真正的母親寧可把孩子給對方也要他活著，王就判孩子歸她，全以色列都敬畏王。","people":["solomon"]},{"key":"建造聖殿","title":"所羅門建造聖殿","ref":"王上 5～7","summary":"所羅門與泰爾王希蘭立約，用黎巴嫩的香柏木和石頭建殿。經上說這是以色列人出埃及後四百八十年、所羅門作王第四年動工，建了七年才完成；他自己的宮殿則建了十三年。","people":["solomon"]},{"key":"獻殿禱告","title":"約櫃進殿與獻殿禱告","ref":"王上 8:1–66","summary":"祭司把約櫃抬進至聖所，雲彩充滿耶和華的殿，祭司不能站立供職。所羅門站在壇前舉手禱告，求神在百姓犯罪悔改、向這殿禱告時，從天上垂聽赦免，連外邦人來禱告也一樣。","people":["solomon"]},{"key":"示巴女王","title":"示巴女王來訪","ref":"王上 10:1–13","summary":"示巴女王聽見所羅門的名聲，帶著香料、寶石和金子來，用難解的話試問他，所羅門都答上了。她看見王宮的一切，說她所聽見的還不到一半，並稱頌耶和華。","people":["solomon"]},{"key":"晚年轉向","title":"所羅門晚年轉離耶和華","ref":"王上 11:1–43","summary":"所羅門有妃七百、嬪三百，許多是外邦女子；他年老時，妃嬪誘惑他的心去隨從別神。耶和華說要把國從他兒子手中奪回，只留一個支派；先知亞希雅撕外衣成十二片，給耶羅波安十片。","people":["solomon","rehoboam-jeroboam"]},{"key":"示劍分裂","title":"羅波安與王國分裂","ref":"王上 12:1–24","summary":"所羅門死後，百姓在示劍求羅波安減輕重擔。他不聽老年人的勸告，照少年人的話說「我的小拇指頭比我父親的腰還粗」，於是十個支派擁立耶羅波安，只有猶大和便雅憫跟從羅波安。","people":["rehoboam-jeroboam"]},{"key":"但與伯特利","title":"耶羅波安的金牛犢","ref":"王上 12:25～13:34","summary":"耶羅波安怕百姓上耶路撒冷獻祭後心歸回猶大，就鑄了兩個金牛犢，一個放在伯特利、一個放在但，又自立節期和祭司。有神人從猶大來到伯特利的壇前宣告審判，這件事成了北國諸王一再被提到的罪。","people":["rehoboam-jeroboam"]},{"key":"烏鴉與寡婦","title":"以利亞、烏鴉與撒勒法的寡婦","ref":"王上 17:1–24","summary":"以利亞向亞哈宣告，這幾年必不降露、不下雨。他先躲在基立溪旁，有烏鴉早晚叼餅和肉給他；後來到西頓的撒勒法，寡婦的罈內麵和瓶裡油在饑荒中都沒有用盡，她的兒子死了，以利亞求告耶和華，孩子又活了。","people":["elijah"]},{"key":"迦密山對決","title":"迦密山上的對決","ref":"王上 18:1–46","summary":"旱災第三年，以利亞召集百姓和巴力的先知四百五十人到迦密山，問眾民心持兩意要到幾時。巴力的先知從早求到晚都沒有回應；以利亞修好祭壇、澆上水禱告，耶和華降下火來，燒盡燔祭、木柴、石頭、塵土和溝裡的水，之後大雨降下。","people":["elijah","ahab-jezebel"]},{"key":"何烈山","title":"以利亞在何烈山聽見微小的聲音","ref":"王上 19:1–18","summary":"耶洗別揚言要殺以利亞，他逃到曠野的羅騰樹下求死，天使兩次叫他起來吃喝。他走四十晝夜到何烈山，風、地震、火之後有微小的聲音，耶和華吩咐他膏哈薛、耶戶和以利沙，並說還留下七千人未曾向巴力屈膝。","people":["elijah","ahab-jezebel","jehu","elisha"]},{"key":"呼召以利沙","title":"以利亞呼召以利沙","ref":"王上 19:19–21","summary":"以利亞找到正在耕地的以利沙，把自己的外衣搭在他身上。以利沙宰了牛、用套牛的器具煮肉分給百姓，就起身跟隨以利亞服事他。","people":["elijah","elisha"]},{"key":"拿伯葡萄園","title":"拿伯的葡萄園","ref":"王上 21:1–29","summary":"亞哈想要耶斯列人拿伯的葡萄園，拿伯不肯把祖宗的產業給人。耶洗別用亞哈的名寫信，叫人作假見證，用石頭打死拿伯；以利亞去見亞哈宣告審判，亞哈聽了就撕裂衣服禁食，耶和華說禍要延到他兒子的時候。","people":["ahab-jezebel","elijah"]},{"key":"亞哈戰死","title":"米該雅的預言與亞哈之死","ref":"王上 22:1–40","summary":"亞哈和猶大王約沙法要合攻基列的拉末，四百個先知都說必勝，只有米該雅預言以色列人要散在山上如沒有牧人的羊。亞哈改裝上陣，有一人隨便開弓，正射入他甲縫，他死後在撒馬利亞的池旁洗車，狗來舔他的血。","people":["ahab-jezebel"]}],"people":["david","bathsheba","nathan","solomon","rehoboam-jeroboam","ahab-jezebel","elijah","elisha"],"verses":[{"ref":"王上 3:9","text":"所以求你賜我智慧，可以判斷你的民，能辨別是非。不然，誰能判斷這眾多的民呢？"},{"ref":"王上 18:21","text":"以利亞前來對眾民說：「你們心持兩意要到幾時呢？若耶和華是神，就當順從耶和華；若巴力是神，就當順從巴力。」眾民一言不答。"},{"ref":"王上 19:12","text":"地震後有火，耶和華也不在火中；火後有微小的聲音。"}]}},{"t":"ot","id":"2kings","order":12,"name":"列王紀下","abbr":"王下","chapters":25,"group":"歷史書","data":{"id":"2kings","order":12,"name":"列王紀下","abbr":"王下","chapters":25,"group":"歷史書","oneLine":"從以利沙的神蹟，一路走到南北兩國都被擄","background":{"author":"作者不詳；猶太傳統認為是耶利米所寫，也有不同看法","date":"約主前 560 年以後成書","audience":"被擄到巴比倫的以色列人","place":"不確定，可能在巴比倫或猶大地","why":"接續列王紀上，從以利亞升天、以利沙接續服事寫起。北國以色列在約主前 722 年被亞述滅亡，南國猶大經過希西家、約西亞的改革，仍在約主前 586 年被巴比倫攻破，聖殿被焚。書的結尾停在被擄的約雅斤王被提出監，留下一線盼望。"},"revelations":[{"key":"加倍的感動","point":"以利亞的事工由以利沙接續下去。","explain":"以利亞升天前，以利沙求感動他的靈加倍；他拾起以利亞的外衣打水，水就分開。以利沙在饑荒與戰爭中行了許多神蹟，常常是為了窮人和外邦人。","ref":"王下 2:1–15"},{"key":"神看顧小人物","point":"寡婦、無名的少女、長大痲瘋的人都被記下。","explain":"寡婦的油、書念婦人的兒子、為乃縵指路的以色列小女子、在城外發現敵營空了的四個長大痲瘋的人，這些人在書裡都有關鍵的角色。","ref":"王下 4～7"},{"key":"北國被擄","point":"北國以色列因拜偶像被亞述擄去。","explain":"第 17 章停下敘事，說明以色列人被擄是因為他們離棄耶和華、拜偶像、不聽先知的警告。","ref":"王下 17:6–23"},{"key":"倚靠神得救","point":"希西家面對亞述大軍，向耶和華禱告。","explain":"亞述王西拿基立圍攻猶大，希西家把恐嚇信展開在耶和華面前禱告，以賽亞傳來回應，當夜耶和華的使者擊殺亞述營中十八萬五千人。","ref":"王下 18～19"},{"key":"律法帶來改革","point":"約西亞因律法書而全面改革。","explain":"修殿時發現律法書，約西亞聽了就撕裂衣服，與百姓立約，除去全國的偶像，守了士師時代以來從未有過的逾越節。","ref":"王下 22～23"},{"key":"審判中的盼望","point":"耶路撒冷陷落，但書末留下一絲盼望。","explain":"聖殿被焚、百姓被擄，應驗了先知們的警告。最後一段記約雅斤在被擄第三十七年被提出監、常在巴比倫王面前吃飯，大衛的後裔仍存留。","ref":"王下 25:27–30"}],"outline":[{"key":"以利沙接棒","range":"1～8 章","point":"以利亞升天，以利沙接續服事，行了許多神蹟。"},{"key":"耶戶興起","range":"9～10 章","point":"耶戶被膏為北國的王，剪除亞哈家與巴力崇拜。"},{"key":"兩國諸王","range":"11～16 章","point":"南北兩國諸王相繼，約阿施修殿，亞述勢力逐漸逼近。"},{"key":"北國滅亡","range":"17 章","point":"亞述攻取撒馬利亞，擄走以色列人，並說明被擄的原因。"},{"key":"希西家改革","range":"18～20 章","point":"希西家倚靠耶和華抵擋亞述，病中得醫治，卻把寶庫給巴比倫使者看。"},{"key":"末期改革","range":"21～23 章","point":"瑪拿西大行惡事；約西亞發現律法書，全面改革。"},{"key":"南國被擄","range":"24～25 章","point":"巴比倫王尼布甲尼撒攻破耶路撒冷，焚燒聖殿，猶大人被擄。"}],"stories":[{"key":"以利亞升天","title":"以利亞乘旋風升天","ref":"王下 2:1–14","summary":"以利亞和以利沙一同過約旦河，以利沙求感動以利亞的靈加倍地感動他。兩人正走著說話，忽有火車火馬將二人隔開，以利亞乘旋風升天；以利沙拾起他的外衣打水，水左右分開。","people":["elijah","elisha"]},{"key":"寡婦的油","title":"寡婦的一瓶油","ref":"王下 4:1–7","summary":"一位先知門徒的妻子向以利沙哀求，因為債主要來取她兩個兒子作奴僕。以利沙叫她向鄰舍借許多空器皿，把家裡僅有的一瓶油倒進去，油一直倒滿所有器皿才止住，她賣油還債，其餘的夠全家度日。","people":["elisha"]},{"key":"書念婦人","title":"書念婦人的兒子","ref":"王下 4:8–37","summary":"書念有位婦人為以利沙預備一間小樓，以利沙應許她來年必抱一個兒子，後來果然應驗。孩子長大後頭痛而死，婦人騎驢去迦密山找以利沙，以利沙伏在孩子身上禱告，孩子打了七個噴嚏就睜開眼睛。","people":["elisha"]},{"key":"乃縵得潔淨","title":"亞蘭元帥乃縵得潔淨","ref":"王下 5:1–27","summary":"亞蘭元帥乃縵長了大痲瘋，家中一個從以色列擄來的小女子說撒馬利亞的先知能治好他。以利沙只叫人告訴他到約旦河沐浴七回，乃縵先是發怒，後來聽僕人勸去做，肉就復原像小孩子一樣；以利沙的僕人基哈西私下向他索取財物，結果染上了大痲瘋。","people":["naaman","elisha"]},{"key":"火車火馬","title":"多坍城外的火車火馬","ref":"王下 6:8–23","summary":"亞蘭王發現他的計謀總被以利沙告訴以色列王，就派大軍包圍多坍城。以利沙的僕人害怕，以利沙說與我們同在的比與他們同在的更多，並求耶和華開他的眼，他就看見滿山有火車火馬；敵軍眼目昏迷，被領進撒馬利亞，以色列王照以利沙的話款待他們後放回。","people":["elisha"]},{"key":"四個痲瘋人","title":"撒馬利亞的饑荒與四個長大痲瘋的人","ref":"王下 6:24～7:20","summary":"亞蘭王便哈達圍困撒馬利亞，城裡大大饑荒，一個驢頭值銀八十舍客勒。以利沙預言明日此時一細亞細麵只賣銀一舍客勒；當夜四個長大痲瘋的人走進亞蘭營，發現敵軍已經逃空，消息傳回城裡，正如以利沙所說，不信的那位軍長在城門口被眾人踐踏而死。","people":["elisha"]},{"key":"耶戶革命","title":"耶戶剪除亞哈家","ref":"王下 9～10","summary":"以利沙差一個先知門徒去膏耶戶作以色列王，耶戶隨即駕車射死約蘭王。耶洗別在耶斯列從窗戶被扔下，應驗了以利亞的話；耶戶又剪除亞哈全家、拆毀巴力廟，但他自己仍沒有離開耶羅波安的金牛犢。","people":["jehu","ahab-jezebel","elisha"]},{"key":"藏起約阿施","title":"約示巴藏起小王子約阿施","ref":"王下 11～12","summary":"亞哈謝死後，他的母親亞他利雅剿滅王室、自己掌權。亞哈謝的妹子約示巴把王子約阿施偷出來，藏在耶和華殿裡六年；第七年祭司耶何耶大立他作王，約阿施後來設櫃收銀子修理聖殿。","people":[]},{"key":"撒馬利亞陷落","title":"北國以色列被擄","ref":"王下 17:1–41","summary":"何細亞作王第九年，亞述王攻取撒馬利亞，把以色列人擄到亞述。第 17 章說明原因：他們離棄耶和華、拜偶像、不聽先知的警告；亞述王又從巴比倫等地遷人來住在撒馬利亞的城邑。","people":[]},{"key":"亞述圍城","title":"希西家與亞述王西拿基立","ref":"王下 18:13～19:37","summary":"希西家第十四年，亞述王西拿基立攻取猶大的堅固城，派拉伯沙基在城外用猶大話恐嚇百姓。希西家撕裂衣服進殿，又把亞述的信展開在耶和華面前禱告，以賽亞傳話說亞述王必不得進城；當夜耶和華的使者擊殺亞述營中十八萬五千人，西拿基立回尼尼微後被自己的兒子所殺。","people":["hezekiah","isaiah"]},{"key":"日影後退","title":"希西家病得醫治","ref":"王下 20:1–21","summary":"希西家病得要死，以賽亞告訴他要留遺命，他轉臉朝牆痛哭禱告。耶和華應許加他十五年壽數，並使日晷上的日影往後退了十度作為記號；後來巴比倫使者來訪，希西家把寶庫都給他們看，以賽亞預言這一切將來要被帶到巴比倫。","people":["hezekiah","isaiah"]},{"key":"瑪拿西","title":"瑪拿西大行惡事","ref":"王下 21:1–18","summary":"瑪拿西十二歲登基，在耶路撒冷作王五十五年。他重建父親拆毀的邱壇、為巴力築壇、使兒子經火，又流許多無辜人的血；耶和華藉先知說要降禍耶路撒冷，好像人擦盤子一樣。","people":[]},{"key":"發現律法書","title":"約西亞發現律法書","ref":"王下 22:1～23:30","summary":"約西亞八歲登基，在位第十八年修殿時，大祭司希勒家在殿裡發現律法書，書記沙番念給王聽，王就撕裂衣服。他求問女先知戶勒大，然後招聚百姓立約，除去全國的偶像和邱壇，連伯特利的壇也拆毀，又守逾越節；後來他在米吉多迎戰埃及王法老尼哥而死。","people":["josiah"]},{"key":"耶路撒冷陷落","title":"耶路撒冷陷落與被擄","ref":"王下 24～25","summary":"巴比倫王尼布甲尼撒先擄走約雅斤王和許多首領、工匠，立西底家作王。西底家背叛巴比倫，城被圍困後攻破，他的眼睛被剜，用銅鍊鎖著帶到巴比倫；護衛長尼布撒拉旦焚燒聖殿和王宮，拆毀城牆。書末記約雅斤被擄後三十七年，巴比倫王以未米羅達提他出監，使他常在王面前吃飯。","people":["nebuchadnezzar"]}],"people":["elijah","elisha","naaman","jehu","ahab-jezebel","hezekiah","isaiah","josiah","nebuchadnezzar"],"verses":[{"ref":"王下 2:11","text":"他們正走著說話，忽有火車火馬將二人隔開，以利亞就乘旋風升天去了。"},{"ref":"王下 6:16","text":"神人說：「不要懼怕！與我們同在的比與他們同在的更多。」"}]}},{"t":"ot","id":"1chronicles","order":13,"name":"歷代志上","abbr":"代上","chapters":29,"group":"歷史書","data":{"id":"1chronicles","order":13,"name":"歷代志上","abbr":"代上","chapters":29,"group":"歷史書","oneLine":"從亞當的家譜寫到大衛，重心放在約櫃與預備建殿","background":{"author":"作者不詳；猶太傳統認為是以斯拉所寫，也有不同看法","date":"約主前 450～400 年（學界看法不一）","audience":"從巴比倫歸回、重建家園的猶太人","place":"不確定，可能在耶路撒冷","why":"歷代志上下原本是一卷書，寫在被擄歸回之後。它重述撒母耳記、列王紀的歷史，但只跟著大衛的王朝與耶路撒冷的聖殿走，特別詳細記錄利未人、祭司與歌唱的班次，讓歸回的百姓確認自己的根源與敬拜的傳承。"},"revelations":[{"key":"家譜的根源","point":"九章家譜把歸回的百姓接回神的大歷史。","explain":"家譜從亞當寫起，經過亞伯拉罕、雅各的十二個兒子，重點放在猶大、大衛家和利未支派，最後記到被擄歸回住在耶路撒冷的人。","ref":"代上 1～9"},{"key":"求問耶和華","point":"君王的興衰，在於是否尋求耶和華。","explain":"掃羅之死在這卷書只用一章交代，並明說他死是因為干犯耶和華、求問交鬼的婦人，沒有求問耶和華。","ref":"代上 10:13–14"},{"key":"敬拜為中心","point":"大衛把約櫃迎進耶路撒冷，並設立歌頌的班次。","explain":"書中用很長的篇幅寫約櫃進城、利未人抬櫃、亞薩等人奏樂稱謝，大衛被描寫成安排敬拜的王。","ref":"代上 13～16"},{"key":"永遠的國位","point":"神應許為大衛建立家室，國位堅定到永遠。","explain":"大衛想為神建殿，神藉拿單說要由大衛的兒子建殿，並且要為大衛建立家室，這是全書盼望的核心。","ref":"代上 17:1–27"},{"key":"建殿的託付","point":"大衛不能建殿，就為所羅門預備一切。","explain":"神說大衛流了多人的血，不可為他的名建殿；大衛就預備材料、交出聖殿的樣式、編排祭司利未人的班次，帶領百姓樂意奉獻。","ref":"代上 22～29"}],"outline":[{"key":"家譜","range":"1～9 章","point":"從亞當到以色列十二支派，再到被擄歸回住在耶路撒冷的人。"},{"key":"掃羅之死","range":"10 章","point":"掃羅與兒子死在基利波山，國歸大衛。"},{"key":"大衛立為王","range":"11～12 章","point":"全以色列在希伯崙膏大衛作王，攻取錫安保障，眾勇士歸附。"},{"key":"約櫃進城","range":"13～16 章","point":"第一次搬運約櫃失敗，第二次由利未人抬進耶路撒冷，大衛設立稱謝的班次。"},{"key":"應許與征戰","range":"17～21 章","point":"神與大衛立約；大衛四面得勝；數點百姓招來瘟疫，在阿珥楠的禾場築壇。"},{"key":"交棒所羅門","range":"22～29 章","point":"大衛預備建殿材料、編排班次，把聖殿樣式交給所羅門，百姓樂意奉獻，大衛去世。"}],"stories":[{"key":"雅比斯禱告","title":"雅比斯的禱告","ref":"代上 4:9–10","summary":"在一長串家譜中間，突然記了一個人：雅比斯比他眾弟兄更尊貴，他母親給他起名叫雅比斯，意思是「我生他甚是痛苦」。他求告以色列的神賜福給他、擴張他的境界、保佑他不遭患難，神就應允了他所求的。","people":[]},{"key":"基利波山","title":"掃羅之死","ref":"代上 10:1–14","summary":"非利士人在基利波山追殺以色列人，掃羅的三個兒子都死了，掃羅伏在自己的刀上而死。歷代志特別加上評語：掃羅死是因為干犯耶和華、沒有遵守耶和華的命令，又求問交鬼的婦人，所以耶和華把國歸給大衛。（同見撒上 31）","people":["saul","jonathan","david"]},{"key":"烏撒與約櫃","title":"約櫃進耶路撒冷","ref":"代上 13；15～16","summary":"大衛第一次用新車運約櫃，到了基頓的禾場牛失前蹄，烏撒伸手扶住約櫃，就被擊殺。三個月後大衛說，除了利未人之外無人可抬神的約櫃，於是照摩西的吩咐由利未人用槓抬進城；大衛又派亞薩和他的弟兄在約櫃前稱謝，歌唱一首感恩的詩。（同見撒下 6）","people":["david"]},{"key":"大衛之約","title":"神與大衛立約","ref":"代上 17:1–27","summary":"大衛住在香柏木的宮中，想為約櫃建殿。神藉先知拿單說，大衛不必建殿，神要從他的後裔中興起一位，由他建殿，神也要堅定他的國位直到永遠；大衛進去坐在耶和華面前感恩禱告。（同見撒下 7）","people":["david","nathan"]},{"key":"阿珥楠禾場","title":"數點百姓與阿珥楠的禾場","ref":"代上 21:1～22:1","summary":"歷代志說撒但起來攻擊以色列，激動大衛數點百姓，約押勸阻不成。耶和華降瘟疫，天使站在耶布斯人阿珥楠的禾場那裡，大衛用六百舍客勒金子買下禾場築壇獻祭，耶和華降火在壇上；大衛說這就是耶和華神的殿的地方。（同見撒下 24）","people":["david"]},{"key":"預備建殿","title":"大衛為建殿預備一切","ref":"代上 22～26","summary":"大衛說他的兒子所羅門還年幼嫩弱，就預先大大預備金銀、銅鐵、木石和匠人。他囑咐所羅門要剛強壯膽建造聖殿，又把利未人、祭司、歌唱的、守門的分成班次，這些安排在別的書卷都沒有這麼詳細。","people":["david","solomon"]},{"key":"樂意奉獻","title":"百姓樂意奉獻與大衛的稱頌","ref":"代上 28～29","summary":"大衛在眾首領面前把聖殿的樣式交給所羅門，並帶頭獻上自己積蓄的金銀。百姓的首領也都樂意奉獻，大衛在會眾面前稱頌耶和華說，尊大、能力、榮耀都是你的；之後所羅門再次被膏立作王，大衛年紀老邁，日子滿足而死。","people":["david","solomon"]}],"people":["saul","jonathan","david","nathan","solomon"],"verses":[{"ref":"代上 4:10","text":"雅比斯求告以色列的神說：「甚願你賜福與我，擴張我的境界，常與我同在，保佑我不遭患難，不受艱苦。」神就應允他所求的。"},{"ref":"代上 29:11","text":"耶和華啊，尊大、能力、榮耀、強勝、威嚴都是你的；凡天上地下的都是你的；國度也是你的，並且你為至高，為萬有之首。"}]}},{"t":"ot","id":"2chronicles","order":14,"name":"歷代志下","abbr":"代下","chapters":36,"group":"歷史書","data":{"id":"2chronicles","order":14,"name":"歷代志下","abbr":"代下","chapters":36,"group":"歷史書","oneLine":"從所羅門建殿到被擄，再到古列下詔歸回","background":{"author":"作者不詳；猶太傳統認為是以斯拉所寫，也有不同看法","date":"約主前 450～400 年（學界看法不一）","audience":"從巴比倫歸回、重建家園的猶太人","place":"不確定，可能在耶路撒冷","why":"接續歷代志上，從所羅門建殿寫起。王國分裂後只跟著南國猶大的王走，北國只在和猶大有關時才提。書中常看君王有沒有尋求耶和華、潔淨聖殿，最後以波斯王古列下詔准許百姓回去建殿作結，對歸回的人是一個新的開始。"},"revelations":[{"key":"聖殿的中心","point":"聖殿是全書的核心，君王常以修殿或棄殿來評價。","explain":"所羅門建殿、獻殿時火從天降；之後希西家潔淨聖殿、約西亞修殿，都是書中的重點。","ref":"代下 2～7；29；34"},{"key":"自卑禱告","point":"神應許百姓自卑禱告、轉離惡行就垂聽。","explain":"獻殿後耶和華夜間向所羅門顯現，說百姓若自卑、禱告、尋求他的面，他必從天上垂聽，赦免他們的罪，醫治他們的地。","ref":"代下 7:12–14"},{"key":"尋求就尋見","point":"尋求耶和華的王興盛，離棄的就衰敗。","explain":"先知亞撒利雅對亞撒說，你們若尋求他，就必尋見；你們若離棄他，他必離棄你們。這句話幾乎貫穿每一位王的故事。","ref":"代下 15:1–7"},{"key":"倚靠不倚靠","point":"倚靠耶和華得勝，倚靠人就被責備。","explain":"亞撒先倚靠耶和華打敗古實大軍，後來卻與亞蘭王結盟，被先見哈拿尼責備說，耶和華的眼目遍察全地，要顯大能幫助向他心存誠實的人。","ref":"代下 14:9–15；16:7–9"},{"key":"悔改得復興","point":"連最惡的王悔改，神也垂聽。","explain":"瑪拿西被擄到巴比倫後在急難中大大自卑，神應允他歸回耶路撒冷，這段是歷代志獨有的記載。","ref":"代下 33:10–13"},{"key":"審判後的開始","point":"被擄七十年後，古列下詔讓百姓回去建殿。","explain":"書末說這應驗了耶利米的話，地享受安息七十年；接著古列元年下詔，全書以古列詔書裡的「凡作他子民的，可以上去」作結。","ref":"代下 36:20–23"}],"outline":[{"key":"所羅門","range":"1～9 章","point":"所羅門求智慧、建殿獻殿，國中富足，示巴女王來訪。"},{"key":"分裂與羅波安","range":"10～12 章","point":"十個支派離開，祭司利未人歸向猶大；羅波安後來離棄律法，被埃及王示撒攻打。"},{"key":"猶大諸王","range":"13～28 章","point":"亞撒、約沙法、約阿施、烏西雅等王，尋求神時興盛，離棄時衰敗。"},{"key":"希西家","range":"29～32 章","point":"潔淨聖殿、守逾越節，倚靠耶和華抵擋亞述。"},{"key":"悔改與修殿","range":"33～35 章","point":"瑪拿西作惡後悔改；約西亞修殿、發現律法書、守盛大的逾越節。"},{"key":"被擄與詔書","range":"36 章","point":"巴比倫焚燒聖殿，百姓被擄；古列下詔准許歸回建殿。"}],"stories":[{"key":"火從天降","title":"所羅門建殿與獻殿","ref":"代下 2～7","summary":"歷代志特別記明，聖殿建在耶路撒冷的摩利亞山上，就是耶布斯人阿珥楠的禾場。獻殿時吹號歌唱的同聲讚美，雲彩充滿殿；所羅門禱告完畢，火從天上降下來燒盡燔祭，耶和華的榮光充滿殿，這一幕是列王紀沒有寫的。（同見王上 8）","people":["solomon"]},{"key":"羅波安","title":"王國分裂與羅波安","ref":"代下 10～12","summary":"十個支派背叛羅波安以後，歷代志記北國各地的祭司和利未人都歸到猶大，使猶大強盛三年。羅波安國位堅立後卻離棄耶和華的律法，埃及王示撒來攻，他和首領自卑，耶和華就不滅絕他們。（同見王上 12；14）","people":["rehoboam-jeroboam"]},{"key":"亞撒","title":"亞撒的信靠與晚年","ref":"代下 14～16","summary":"古實王謝拉率領一百萬大軍來攻，亞撒呼求耶和華，就打敗了他們，並在先知亞撒利雅鼓勵下除去偶像。晚年他卻用聖殿的金銀去請亞蘭王幫忙，被先見哈拿尼責備，他還把先見囚在監裡；後來腳上有病，病的時候沒有求耶和華，只求醫生。","people":[]},{"key":"歌唱在前","title":"約沙法與歌唱的軍隊","ref":"代下 17；20","summary":"約沙法派首領、祭司和利未人帶著律法書到猶大各城教訓百姓。摩押人、亞捫人大軍來攻，他宣告禁食，在聖殿禱告說「我們也不知道怎樣行，我們的眼目單仰望你」；利未人雅哈悉說這戰爭不在乎你們，乃在乎神，第二天約沙法派歌唱的人走在軍前讚美，敵人就自相擊殺。","people":[]},{"key":"烏西雅","title":"烏西雅心高氣傲","ref":"代下 26:1–23","summary":"烏西雅十六歲登基，尋求神的時候神使他亨通，國力強盛、名聲遠揚。他強盛以後心高氣傲，進聖殿要在香壇上燒香，祭司亞撒利雅帶人阻擋，他發怒時額上忽然發出大痲瘋，從此住在別的宮裡直到死。（同見王下 15:1–7，那裡稱他亞撒利雅）","people":[]},{"key":"希西家逾越節","title":"希西家潔淨聖殿與守逾越節","ref":"代下 29～31","summary":"希西家登基元年正月就打開殿門修理，叫祭司利未人潔淨聖殿、恢復獻祭。他派驛卒走遍以法蓮和瑪拿西，邀請北國剩下的人來耶路撒冷守逾越節，有人戲笑，也有人自卑前來；因為時間來不及，就在二月守節，守完七日又多守了七日，這是列王紀沒有詳寫的。","people":["hezekiah"]},{"key":"瑪拿西悔改","title":"瑪拿西被擄後悔改","ref":"代下 33:1–20","summary":"瑪拿西大行惡事，不聽耶和華的警告。亞述王的將帥用鉤子鉤住他，用銅鍊鎖著帶到巴比倫，他在急難中懇求耶和華、大大自卑，神應允他回到耶路撒冷，瑪拿西這才知道惟獨耶和華是神，回去後除掉外邦神像。這段只有歷代志記載。（同見王下 21）","people":[]},{"key":"古列詔書","title":"聖殿被焚與古列的詔書","ref":"代下 36:11–23","summary":"西底家不在耶利米面前自卑，百姓也嘲笑神的使者，最後迦勒底人焚燒聖殿、拆毀城牆，餘民被擄到巴比倫。書中說這應驗了耶和華藉耶利米所說的話，地享受安息七十年；波斯王古列元年下詔，准許神的百姓上耶路撒冷建殿。","people":["nebuchadnezzar","jeremiah","cyrus"]}],"people":["solomon","rehoboam-jeroboam","hezekiah","josiah","jeremiah","nebuchadnezzar","cyrus"],"verses":[{"ref":"代下 7:14","text":"這稱為我名下的子民，若是自卑、禱告，尋求我的面，轉離他們的惡行，我必從天上垂聽，赦免他們的罪，醫治他們的地。"}]}},{"t":"ot","id":"ezra","order":15,"name":"以斯拉記","abbr":"拉","chapters":10,"group":"歷史書","data":{"id":"ezra","order":15,"name":"以斯拉記","abbr":"拉","chapters":10,"group":"歷史書","oneLine":"被擄的百姓歸回，重建聖殿，也重建對律法的遵行","background":{"author":"傳統上認為是以斯拉所寫，也有不同看法","date":"約主前 440～400 年（學界看法不一）","audience":"從巴比倫歸回的猶太人","place":"不確定，可能在耶路撒冷","why":"巴比倫被波斯取代後，波斯王古列在元年下詔准許猶太人回耶路撒冷建殿。本書前半記所羅巴伯帶第一批人歸回、在攔阻中重建聖殿；後半記約六十年後，文士以斯拉在亞達薛西王時帶第二批人回來，教導律法、處理與外邦人通婚的問題。"},"revelations":[{"key":"神感動君王","point":"耶和華激動波斯王古列，讓百姓歸回。","explain":"書一開頭就說這是為要應驗藉耶利米口所說的話。後來大利烏、亞達薛西兩位波斯王也都支持建殿與以斯拉的歸回。","ref":"拉 1:1–4；6:22"},{"key":"重建聖殿","point":"歸回的第一件事是築壇、重建聖殿。","explain":"他們先築壇獻祭，第二年立聖殿根基；工程雖被攔阻停頓，最後在大利烏王第六年完工。","ref":"拉 3～6"},{"key":"先知的鼓勵","point":"工程停頓時，先知哈該和撒迦利亞起來勸勉。","explain":"先知說勸勉的話，所羅巴伯和耶書亞就重新動工，建殿終於完成。","ref":"拉 5:1–2；6:14"},{"key":"定志考究律法","point":"以斯拉先遵行律法，再教導百姓。","explain":"以斯拉是敏捷的文士，他定志考究遵行耶和華的律法，又把律例典章教訓以色列人。","ref":"拉 7:6–10"},{"key":"認罪與更新","point":"面對百姓的罪，以斯拉先認罪禱告。","explain":"聽見百姓與外邦人通婚，他撕裂衣服、禁食禱告，承認是「我們」的罪；百姓也一同立約改正。","ref":"拉 9～10"}],"outline":[{"key":"第一批歸回","range":"1～2 章","point":"古列下詔，所羅巴伯等人帶領會眾和聖殿器皿回到耶路撒冷。"},{"key":"築壇立根基","range":"3 章","point":"七月築壇獻祭，第二年立好聖殿根基，哭聲與歡呼聲混在一起。"},{"key":"攔阻與完工","range":"4～6 章","point":"敵人寫信控告，工程停頓；先知勸勉後復工，大利烏王時聖殿完成。"},{"key":"以斯拉歸回","range":"7～8 章","point":"亞達薛西王第七年，以斯拉帶第二批人歸回。"},{"key":"處理通婚","range":"9～10 章","point":"以斯拉為百姓與外邦人通婚認罪，百姓立約改正。"}],"stories":[{"key":"古列下詔","title":"古列下詔與第一批歸回","ref":"拉 1～2","summary":"波斯王古列元年下詔，准許神的百姓上耶路撒冷重建聖殿，並把尼布甲尼撒從聖殿掠去的器皿交出來。所羅巴伯、耶書亞等人帶領會眾歸回，經上記會眾共有四萬二千三百六十名。","people":["cyrus","zerubbabel"]},{"key":"哭聲與歡呼","title":"立聖殿的根基","ref":"拉 3:1–13","summary":"歸回後的七月，百姓聚集在耶路撒冷築壇獻祭，第二年二月開始建殿。根基立好時祭司吹號、利未人敲鈸讚美，許多見過舊殿的老年人大聲哭號，也有許多人大聲歡呼，聲音遠遠都聽得見。","people":["zerubbabel"]},{"key":"工程停頓","title":"攔阻、停工到聖殿完成","ref":"拉 4～6","summary":"當地的敵人要一同建造被拒絕，就使百姓手發軟，又寫信控告，工程停到大利烏王第二年。先知哈該和撒迦利亞起來勸勉，所羅巴伯和耶書亞重新動工；大利烏查到古列當年的詔書，下令支持，聖殿在大利烏王第六年亞達月初三完成，百姓歡歡喜喜地獻殿、守逾越節。","people":["zerubbabel","haggai-zechariah"]},{"key":"河邊禁食","title":"以斯拉歸回與亞哈瓦河邊的禁食","ref":"拉 7～8","summary":"亞達薛西王第七年，文士以斯拉帶著王的諭旨和獻給聖殿的金銀，帶第二批人歸回。他先前對王說過神的手必幫助尋求他的人，所以羞於向王求步兵馬兵保護，就在亞哈瓦河邊宣告禁食求平坦的道路，神應允了，他們平安抵達耶路撒冷。","people":["ezra"]},{"key":"通婚認罪","title":"以斯拉為通婚之事認罪","ref":"拉 9～10","summary":"首領告訴以斯拉，許多百姓、甚至祭司和利未人娶了外邦女子。以斯拉撕裂衣服、拔了頭髮鬍鬚，驚懼憂悶而坐，晚上跪下禱告認罪；百姓在大雨中聚集，立約照律法改正，書末列出這些人的名字。","people":["ezra"]}],"people":["cyrus","zerubbabel","haggai-zechariah","ezra"],"verses":[{"ref":"拉 7:10","text":"以斯拉定志考究遵行耶和華的律法，又將律例典章教訓以色列人。"}]}},{"t":"ot","id":"nehemiah","order":16,"name":"尼希米記","abbr":"尼","chapters":13,"group":"歷史書","data":{"id":"nehemiah","order":16,"name":"尼希米記","abbr":"尼","chapters":13,"group":"歷史書","oneLine":"尼希米帶領百姓五十二天修好耶路撒冷城牆","background":{"author":"傳統上認為是尼希米所寫（猶太傳統把以斯拉記和尼希米記算作一卷），也有不同看法","date":"約主前 430～400 年（學界看法不一）","audience":"歸回耶路撒冷的猶太人","place":"不確定，可能在耶路撒冷","why":"聖殿重建後，耶路撒冷的城牆仍然拆毀、城門被火焚燒，百姓大受凌辱。在波斯王亞達薛西身邊作酒政的尼希米，得到王的允准回去修城，並和以斯拉一起帶領百姓讀律法、認罪立約，處理信仰與社會的問題。"},"revelations":[{"key":"禱告後行動","point":"尼希米先禁食禱告，再向王開口。","explain":"他聽見城牆的消息，哭泣禁食好幾日；在王面前回答之前，他先默禱天上的神，然後提出具體的請求。","ref":"尼 1:4～2:8"},{"key":"同心建造","point":"各家各戶分段修城，五十二天完工。","explain":"第 3 章列出一段一段的修造者，有祭司、工匠、商人，也有首領的女兒，城牆在以祿月二十五日修完。","ref":"尼 3；6:15"},{"key":"面對反對","point":"外有譏誚恐嚇，內有不公，尼希米一一面對。","explain":"參巴拉、多比雅譏笑、恐嚇、設計陷害；百姓中又有富人放債取利。尼希米一面禱告、一面派人守望，也責備富人歸還田產。","ref":"尼 4～6"},{"key":"律法的喜樂","point":"以斯拉宣讀律法，百姓先哭後喜。","explain":"百姓聽明白律法都哭了，尼希米和以斯拉卻說今日是聖日，不要憂愁，因靠耶和華而得的喜樂是你們的力量。","ref":"尼 8:1–12"},{"key":"持續改革","point":"城牆修好之後，信仰的問題還要繼續處理。","explain":"尼希米第二次回到耶路撒冷，發現有人在殿裡給多比雅預備屋子、利未人的份沒有給、安息日做買賣、與外邦人通婚，他都一一整頓。","ref":"尼 13"}],"outline":[{"key":"聽見消息","range":"1～2 章","point":"尼希米為耶路撒冷禱告，蒙王允准回去，夜間察看城牆。"},{"key":"分段修城","range":"3～4 章","point":"百姓分段修造城牆，一手做工一手拿兵器，抵擋敵人的攔阻。"},{"key":"內憂外患","range":"5～6 章","point":"處理富人剝削窮人；拒絕敵人的陷害，城牆五十二天完工。"},{"key":"讀律法立約","range":"7～10 章","point":"登記歸回的名冊，以斯拉宣讀律法，百姓守住棚節、認罪立約。"},{"key":"獻城與改革","range":"11～13 章","point":"安排百姓住進耶路撒冷，獻城牆；尼希米第二次回來整頓聖殿與安息日。"}],"stories":[{"key":"酒政的請求","title":"尼希米在王面前的請求","ref":"尼 1～2","summary":"亞達薛西王二十年，尼希米在書珊城聽說耶路撒冷城牆拆毀、城門被焚，就坐下哭泣、禁食禱告。他是作王酒政的，王看他面帶愁容問他要求什麼，他先默禱天上的神，然後請求回去修城，王就給他文書和木料；他到耶路撒冷後，夜間騎著牲口察看城牆。","people":["nehemiah"]},{"key":"一手拿兵器","title":"在譏誚與恐嚇中修城","ref":"尼 3～4","summary":"和倫人參巴拉、亞捫人多比雅等人譏笑說，他們所修造的石牆，就是狐狸上去也必跐倒。百姓分段修城，敵人揚言要來攻擊，尼希米就派人帶刀槍弓箭守望，做工的人一手做工、一手拿兵器，尼希米說我們的神必為我們爭戰。","people":["nehemiah"]},{"key":"不要俸祿","title":"尼希米處理富人放債","ref":"尼 5:1–19","summary":"修城期間有百姓哀求，說為了納稅和糧食，要把田地、葡萄園典當，甚至讓兒女作奴僕。尼希米責備放債取利的貴冑和官長，要他們歸還田產、停止取利；他自己作省長十二年，沒有吃省長的俸祿。","people":["nehemiah"]},{"key":"五十二天","title":"城牆五十二天完工","ref":"尼 6:1–19","summary":"敵人四次約尼希米到阿挪平原見面，想要害他，他回覆說他正辦理大工，不能下去；又有人捏造謠言、雇人勸他躲進殿裡，他都不肯。城牆在以祿月二十五日修完，共五十二天，四圍的外邦人就覺得這工作是神成就的。","people":["nehemiah"]},{"key":"水門前讀經","title":"以斯拉在水門前宣讀律法","ref":"尼 8:1–18","summary":"七月初一，眾民聚集在水門前的寬闊處，以斯拉站在木臺上，從清早到晌午宣讀律法書，利未人在旁講明意思。百姓聽見律法都哭了，尼希米和以斯拉說今日是聖日，不要憂愁；他們又照律法搭棚，守了七天的住棚節，大大喜樂。","people":["ezra","nehemiah"]},{"key":"認罪立約","title":"百姓禁食認罪並立約","ref":"尼 9～10","summary":"七月二十四日，百姓禁食、穿麻衣、頭蒙灰塵，站著承認自己和列祖的罪。利未人帶領一段長禱告，從創造天地、呼召亞伯拉罕、出埃及一路說到被擄；最後首領、利未人、祭司在約上簽名，答應遵行律法、不與外邦人通婚、守安息日、供應聖殿。","people":["nehemiah"]},{"key":"第二次整頓","title":"尼希米的最後改革","ref":"尼 13:1–31","summary":"尼希米回到亞達薛西王那裡一段時間後再回耶路撒冷，發現祭司以利亞實在殿院裡為多比雅預備屋子，就把多比雅的家具都拋出去。他也恢復利未人的份、在安息日關上城門禁止買賣，並責備與外邦人通婚的人，舉所羅門為例；書最後一句是求神記念他施恩與他。","people":["nehemiah"]}],"people":["nehemiah","ezra"],"verses":[{"ref":"尼 6:3","text":"於是我差遣人去見他們，說：「我現在辦理大工，不能下去。焉能停工下去見你們呢？」"},{"ref":"尼 8:10","text":"又對他們說：「你們去吃肥美的，喝甘甜的，有不能預備的就分給他，因為今日是我們主的聖日。你們不要憂愁，因靠耶和華而得的喜樂是你們的力量。」"}]}},{"t":"ot","id":"esther","order":17,"name":"以斯帖記","abbr":"斯","chapters":10,"group":"歷史書","data":{"id":"esther","order":17,"name":"以斯帖記","abbr":"斯","chapters":10,"group":"歷史書","oneLine":"以斯帖冒死見王，救了波斯境內的猶大人","background":{"author":"作者不詳","date":"約主前 400 年前後（不確定）","audience":"散居各地的猶大人","place":"不確定，故事發生在波斯的書珊城（今伊朗境內）","why":"故事發生在波斯王亞哈隨魯的時代（傳統上認為就是波斯王薛西一世，也有不同看法），當時許多猶大人沒有回耶路撒冷，散居在波斯一百二十七省。本書記錄猶大人如何從滅族的危機中被救，也說明普珥節的由來。"},"revelations":[{"key":"隱藏的安排","point":"全書沒有直接提到神的名字，事情卻一步步翻轉。","explain":"以斯帖被選為王后、末底改救王的事被記在歷史上、王在關鍵的夜裡睡不著，這些看似巧合的事串在一起，讓猶大人得救。","ref":"斯 2:17–23；6:1–3"},{"key":"為現今的機會","point":"以斯帖的位分，正是為了這個時刻。","explain":"末底改對以斯帖說，焉知你得了王后的位分不是為現今的機會呢？這是全書的轉捩點。","ref":"斯 4:13–14"},{"key":"冒死的勇氣","point":"以斯帖先禁食，再違例進去見王。","explain":"不蒙召進內院見王的必被治死，以斯帖請眾人為她禁食三晝三夜，說「我若死就死吧」。","ref":"斯 4:11–16"},{"key":"結局的逆轉","point":"惡人預備的，反而落在自己頭上。","explain":"哈曼為末底改立的木架，最後掛的是哈曼自己；原本要被滅的猶大人，在同一天得以自衛得勝。","ref":"斯 7:10；9:1"},{"key":"記念的節期","point":"普珥節世世代代記念這次的拯救。","explain":"「普珥」就是掣籤，因為哈曼曾掣籤定下滅猶大人的日子，猶大人便守亞達月十四、十五日為普珥節，彼此饋送禮物、賙濟窮人。","ref":"斯 9:20–32"}],"outline":[{"key":"立后","range":"1～2 章","point":"王后瓦實提被廢，以斯帖被立為王后；末底改揭發謀害王的陰謀。"},{"key":"滅族危機","range":"3～4 章","point":"哈曼因末底改不跪拜而定下滅猶大人的日子，以斯帖決定冒死見王。"},{"key":"兩次筵席","range":"5～7 章","point":"以斯帖設筵；王夜裡睡不著，末底改得尊榮；哈曼被揭發後被掛在木架上。"},{"key":"翻轉得勝","range":"8～10 章","point":"王另下諭旨讓猶大人自衛，猶大人得勝，設立普珥節，末底改作宰相。"}],"stories":[{"key":"瓦實提被廢","title":"王后瓦實提被廢與以斯帖立后","ref":"斯 1～2","summary":"亞哈隨魯王在書珊城擺設筵席，召王后瓦實提出來，她不肯來，王就廢了她的王后之位。各省選召美貌的處女進宮，末底改撫養的堂妹以斯帖（又名哈大沙）也被選入，她照末底改的吩咐沒有說出自己的籍貫宗族，王愛她過於眾女，立她為王后。","people":["esther","mordecai"]},{"key":"記在歷史上","title":"末底改揭發陰謀","ref":"斯 2:21–23","summary":"末底改坐在朝門的時候，得知守門的兩個太監辟探和提列想要謀害王。他告訴以斯帖，以斯帖奉末底改的名報告王，兩人被掛在木頭上，這件事在王面前寫在歷史上，當時末底改卻沒有得到任何賞賜。","people":["mordecai","esther"]},{"key":"哈曼掣普珥","title":"哈曼的滅族詭計","ref":"斯 3:1–15","summary":"亞甲族的哈曼被王抬舉，朝門的臣僕都跪拜他，只有末底改不跪不拜。哈曼知道末底改是猶大人，就想滅絕全國的猶大人，在他面前掣普珥（就是掣籤）定在十二月亞達月，又說要捐一萬他連得銀子入王庫；王把戒指交給他，諭旨傳遍各省。","people":["mordecai"]},{"key":"若死就死","title":"以斯帖決定冒死見王","ref":"斯 4:1～5:8","summary":"末底改穿麻衣蒙灰，請以斯帖進去為本族求情。以斯帖說不蒙召進內院見王的必被治死，除非王向他伸出金杖；末底改回答，此時你若閉口不言，猶大人必從別處得解脫，焉知你得了王后的位分不是為現今的機會呢。以斯帖請書珊城的猶大人為她禁食三晝三夜，第三天她進去，王向她伸出金杖，她就請王和哈曼赴筵。","people":["esther","mordecai"]},{"key":"王睡不著","title":"那夜王睡不著覺","ref":"斯 5:9～6:14","summary":"哈曼看見末底改仍不起來、不動身，就照妻子和朋友的主意立了一個五丈高的木架，打算第二天請王把末底改掛上。那一夜王睡不著覺，叫人念歷史給他聽，發現末底改救過王卻未得賞賜；哈曼正好進來，王問該怎樣待王所喜悅尊榮的人，哈曼以為是指自己，結果奉命為末底改穿上朝服、牽馬遊街。","people":["mordecai"]},{"key":"木架反掛","title":"哈曼被掛在木架上","ref":"斯 7:1–10","summary":"第二次筵席上，以斯帖向王說出自己和本族被賣、將要被滅，指認仇敵就是這惡人哈曼。王大怒走進御園，回來看見哈曼伏在以斯帖的榻上求命；有太監說哈曼家裡有一個五丈高的木架，王就吩咐把哈曼掛在他為末底改所預備的木架上。","people":["esther","mordecai"]},{"key":"普珥節","title":"猶大人得勝與普珥節","ref":"斯 8～10","summary":"王的諭旨蓋了印不能廢除，王就准末底改另寫諭旨，許各省的猶大人在那一天聚集自衛。十二月十三日，原本仇敵想要轄制猶大人，事卻反轉，猶大人轄制了恨他們的人；之後猶大人定每年亞達月十四、十五日為普珥節，末底改作了亞哈隨魯王的宰相。","people":["mordecai","esther"]}],"people":["esther","mordecai"],"verses":[{"ref":"斯 4:14","text":"此時你若閉口不言，猶大人必從別處得解脫，蒙拯救；你和你父家必致滅亡。焉知你得了王后的位分不是為現今的機會嗎？"},{"ref":"斯 4:16","text":"你當去招聚書珊城所有的猶大人，為我禁食三晝三夜，不吃不喝；我和我的宮女也要這樣禁食。然後我違例進去見王，我若死就死吧！"}]}},{"t":"ot","id":"job","order":18,"name":"約伯記","abbr":"伯","chapters":42,"group":"詩歌智慧書","data":{"id":"job","order":18,"name":"約伯記","abbr":"伯","chapters":42,"group":"詩歌智慧書","oneLine":"義人為什麼受苦？約伯在苦難中與神對話","background":{"author":"作者不詳，傳統上有不同說法，也有不同看法","date":"成書年代不確定；傳統上認為故事背景接近族長時代，也有不同看法","audience":"書中沒有寫明對象，是寫給以色列信仰群體的智慧文學","place":"不確定；故事發生在「烏斯地」（伯 1:1）","why":"古代普遍認為受苦必定是因為犯罪。這卷書用一位「完全正直，敬畏神」的人遭遇大災難的故事，加上大段詩體對話，探問義人為什麼受苦、人能不能明白神的作為。"},"revelations":[{"key":"義人受苦","point":"受苦不一定是因為犯罪","explain":"三個朋友堅持約伯一定犯了罪才受罰，約伯堅稱自己清白。書末耶和華說朋友們的議論不如約伯說的是。","ref":"伯 42:7–8"},{"key":"天上場景","point":"人看不見的地方，另有一場天上的對話","explain":"書一開頭讓讀者先知道耶和華與撒但的對話，約伯自己卻始終不知道。這讓整卷書的辯論有了另一層角度。","ref":"伯 1:6–12"},{"key":"持守純正","point":"失去一切仍不以口犯罪","explain":"約伯一天之內失去兒女與家產，又長了毒瘡，仍說賞賜收取都是耶和華，不以口犯罪。","ref":"伯 1:20–22；2:10"},{"key":"誠實吶喊","point":"約伯把痛苦、怨言直接說給神聽","explain":"約伯咒詛自己的生日，質問神為什麼這樣待他，渴望與神對質。書中保留了這些激烈的話，沒有刪去。","ref":"伯 3；23:1–7"},{"key":"智慧何處尋","point":"真智慧是敬畏主、遠離惡","explain":"第 28 章像一首插曲：人能開礦找寶石，卻找不到智慧；結論是敬畏主就是智慧。","ref":"伯 28"},{"key":"神的主權","point":"耶和華沒有解釋原因，而是讓約伯看見創造","explain":"耶和華從旋風中一連串發問：立大地根基時你在哪裡？約伯因此承認自己說了不明白的事。","ref":"伯 38:1～42:6"},{"key":"親眼見神","point":"從風聞到親眼看見","explain":"約伯最後說從前風聞有你，現在親眼看見你。耶和華使他從苦境轉回，賜福比先前更多。新約在雅 5:11 提到約伯的忍耐。","ref":"伯 42:5–17"}],"outline":[{"key":"序幕試煉","range":"1～2 章","point":"約伯敬畏神；撒但兩次試探，他失去家產、兒女與健康"},{"key":"約伯哀歎","range":"3 章","point":"約伯開口咒詛自己的生日"},{"key":"三友辯論","range":"4～27 章","point":"以利法、比勒達、瑣法三輪輪流發言，約伯一一回應"},{"key":"智慧之歌","range":"28 章","point":"人找不到智慧，敬畏主就是智慧"},{"key":"最後申訴","range":"29～31 章","point":"約伯回想從前的尊榮，訴說現在的苦，宣告自己清白"},{"key":"以利戶發言","range":"32～37 章","point":"年輕的以利戶責備約伯，也責備三個朋友"},{"key":"旋風中說話","range":"38:1～42:6","point":"耶和華從旋風中回答約伯，約伯謙卑認錯"},{"key":"結局復興","range":"42:7–17","point":"朋友們獻祭，約伯為他們禱告；耶和華賜福約伯加倍"}],"stories":[{"key":"兩次試煉","title":"撒但的兩次試探","ref":"伯 1～2","summary":"烏斯地的約伯有七個兒子、三個女兒和許多牲畜。撒但說約伯敬畏神是有緣故的，耶和華允許試探：一天之內牲畜被擄、兒女被壓死，接著約伯從腳掌到頭頂長滿毒瘡。他的妻子要他棄掉神，約伯仍不以口犯罪。","people":["job"]},{"key":"朋友來訪","title":"三個朋友七天七夜無言","ref":"伯 2:11–13","summary":"提幔人以利法、書亞人比勒達、拿瑪人瑣法聽說約伯的災禍，約好來安慰他。他們遠遠看見幾乎認不出約伯，就放聲大哭，陪他坐在地上七天七夜，因為他極其痛苦，一個人也不向他說句話。","people":["job"]},{"key":"三輪辯論","title":"約伯與朋友的辯論","ref":"伯 4～27","summary":"朋友們輪流說：神是公義的，受苦必是因為犯罪，只要認罪悔改就會蒙福。約伯越辯越激動，堅持自己沒有犯該受這苦的罪，並且說「我知道我的救贖主活著」，盼望能親自見神。","people":["job"]},{"key":"以利戶","title":"年輕人以利戶的發言","ref":"伯 32～37","summary":"布西人巴拉迦的兒子以利戶一直等長輩說完才開口。他向約伯發怒，因為約伯自以為義；也向三個朋友發怒，因為他們定約伯有罪卻答不出話來。他說神藉著苦難教導人。","people":["job"]},{"key":"旋風回答","title":"耶和華從旋風中說話","ref":"伯 38～41","summary":"耶和華沒有直接解釋約伯受苦的原因，而是從旋風中問他：立大地根基時你在哪裡？接著講到海、晨光、雪雹、野獸、河馬與鱷魚。約伯承認自己卑賤，用手摀口。","people":["job"]},{"key":"加倍賜福","title":"約伯的結局","ref":"伯 42:7–17","summary":"耶和華責備三個朋友說話不如約伯說的是，要他們獻燔祭，並請約伯為他們禱告。約伯禱告後，耶和華使他從苦境轉回，後來有一萬四千羊、六千駱駝、一千對牛、一千母驢，又有七個兒子、三個女兒，此後又活了一百四十年。","people":["job"]}],"people":["job"],"verses":[{"ref":"伯 1:21","text":"說：「我赤身出於母胎，也必赤身歸回；賞賜的是耶和華，收取的也是耶和華。耶和華的名是應當稱頌的。」"},{"ref":"伯 19:25","text":"我知道我的救贖主活著，末了必站立在地上。"},{"ref":"伯 42:5","text":"我從前風聞有你，現在親眼看見你。"}]}},{"t":"ot","id":"psalms","order":19,"name":"詩篇","abbr":"詩","chapters":150,"group":"詩歌智慧書","data":{"id":"psalms","order":19,"name":"詩篇","abbr":"詩","chapters":150,"group":"詩歌智慧書","oneLine":"以色列的詩歌集：讚美、哀求、感謝都向神說","background":{"author":"標題寫「大衛的詩」最多，另有亞薩、可拉後裔、所羅門、摩西等；各篇作者傳統上照標題認定，也有不同看法","date":"約主前 15 世紀到被擄歸回之後，跨越很長時間；傳統上認為詩 90 出於摩西，也有不同看法","audience":"以色列人在聖殿敬拜、節期上行與個人禱告時使用","place":"多數在以色列地；也有寫於被擄期間的，例如詩 137 說「我們曾在巴比倫的河邊坐下」","why":"這是以色列人歷代敬拜與禱告的詩歌，後來編成五卷，每卷結尾都有一段稱頌的話。內容從個人的痛苦、認罪，到全民的讚美與歷史回顧都有。"},"revelations":[{"key":"兩條道路","point":"喜愛律法的人有福，惡人必滅亡","explain":"第 1 篇作為全書開頭，對比義人像溪水旁的樹、惡人像糠被風吹散。","ref":"詩 1"},{"key":"誠實禱告","point":"痛苦、憤怒、懼怕都可以向神說","explain":"詩篇有大量哀歌，詩人直接問「要到幾時呢」「為甚麼離棄我」，常常在禱告中轉向信靠與讚美。","ref":"詩 13；22"},{"key":"牧者看顧","point":"耶和華像牧人一樣帶領保護","explain":"第 23 篇用牧人、青草地、可安歇的水邊、死蔭的幽谷描寫神的看顧，是最為人熟知的一篇。","ref":"詩 23"},{"key":"認罪蒙赦","point":"人犯了罪可以回到神面前","explain":"第 51 篇標題說是大衛與拔示巴的事後，先知拿單來見他時所作；大衛求神造清潔的心。","ref":"詩 51"},{"key":"神的話語","point":"神的話是腳前的燈、路上的光","explain":"第 119 篇是最長的一篇，共 176 節，照希伯來字母分成 22 段，每段 8 節，句句講神的話語。","ref":"詩 119"},{"key":"人生短暫","point":"求神教我們數算自己的日子","explain":"第 90 篇標題是「神人摩西的祈禱」，對比神從亙古到永遠，人的一生像草、像一聲歎息。","ref":"詩 90"},{"key":"凡有氣息","point":"全書以讚美收尾","explain":"最後五篇都以「你們要讚美耶和華」開頭與結尾（原文就是哈利路亞），第 150 篇呼籲凡有氣息的都要讚美耶和華。","ref":"詩 146～150"}],"outline":[{"key":"第一卷","range":"1～41 篇","point":"多數標題是大衛的詩，以 41:13「阿們！阿們！」結束"},{"key":"第二卷","range":"42～72 篇","point":"可拉後裔與大衛的詩，以 72:20「耶西的兒子─大衛的祈禱完畢」結束"},{"key":"第三卷","range":"73～89 篇","point":"多為亞薩與可拉後裔的詩，面對國家危難的哀歌較多"},{"key":"第四卷","range":"90～106 篇","point":"以摩西的祈禱開頭，多首宣告「耶和華作王」的詩"},{"key":"第五卷","range":"107～150 篇","point":"有上行之詩（120～134）、長篇的第 119 篇，以一連串哈利路亞詩結束"}],"stories":[{"key":"有福的人","title":"第 1 篇：兩條道路","ref":"詩 1","summary":"不從惡人的計謀、晝夜思想耶和華律法的人，像栽在溪水旁的樹，按時候結果子；惡人卻像糠被風吹散。這篇是全書的序言。","people":[]},{"key":"人算什麼","title":"第 8 篇：人算什麼","ref":"詩 8","summary":"大衛觀看天上的月亮星宿，驚歎人算什麼，神竟顧念他，又派人管理牛羊、飛鳥與海裡的魚。新約在來 2:6–8 引用這篇。","people":["david"]},{"key":"諸天述說","title":"第 19 篇：諸天述說神的榮耀","ref":"詩 19","summary":"前半講諸天、穹蒼、太陽無聲地述說神的榮耀；後半轉向耶和華的律法全備，比金子可羨慕、比蜜甘甜。","people":["david"]},{"key":"為何離棄","title":"第 22 篇：為甚麼離棄我","ref":"詩 22","summary":"詩人從「我的神，我的神！為甚麼離棄我」的呼喊開始，描寫被人嗤笑、衣服被拈鬮分去，最後轉為在會中讚美。新約在太 27:46 記載耶穌在十字架上說出這句話。","people":["david"]},{"key":"耶和華牧者","title":"第 23 篇：耶和華是我的牧者","ref":"詩 23","summary":"大衛把耶和華比作牧人：使我躺臥在青草地上，領我在可安歇的水邊；行過死蔭的幽谷也不怕；最後說要住在耶和華的殿中直到永遠。","people":["david"]},{"key":"避難所","title":"第 46 篇：神是我們的避難所","ref":"詩 46","summary":"標題是可拉後裔的詩歌。詩人說即使地改變、山搖動、海翻騰，也不害怕，因為神是隨時的幫助；並說「你們要休息，要知道我是神」。","people":[]},{"key":"清潔的心","title":"第 51 篇：大衛的認罪詩","ref":"詩 51","summary":"標題說這是大衛與拔示巴同室以後，先知拿單來見他時所作。大衛承認自己的罪，求神塗抹過犯、造清潔的心，並說神所要的祭是憂傷的靈。","people":["david","bathsheba","nathan"]},{"key":"數算日子","title":"第 90 篇：摩西的祈禱","ref":"詩 90","summary":"標題是「神人摩西的祈禱」。詩人說在神看來千年如已過的昨日，人的年日卻像早晨發芽、晚上枯乾的草，所以求神指教人數算自己的日子。","people":["moses"]},{"key":"稱頌耶和華","title":"第 103 篇：我的心哪要稱頌","ref":"詩 103","summary":"大衛對自己的心說：要稱頌耶和華，不可忘記他的一切恩惠。詩中說神赦免罪孽、醫治疾病，憐恤敬畏他的人像父親憐恤兒女。","people":["david"]},{"key":"最長的詩","title":"第 119 篇：你的話是我腳前的燈","ref":"詩 119","summary":"全書最長的一篇，照希伯來 22 個字母分段，每段 8 節。幾乎每一節都提到律法、法度、訓詞、典章等，講神的話帶來的引導與安慰。","people":[]},{"key":"上行之詩","title":"第 121 篇：我要向山舉目","ref":"詩 121","summary":"這是「上行之詩」之一，與 120～134 篇同屬一組，傳統上認為是以色列人上耶路撒冷守節時所唱。詩人說幫助從造天地的耶和華而來，保護他的必不打盹。","people":[]},{"key":"被神鑒察","title":"第 139 篇：你鑒察我、認識我","ref":"詩 139","summary":"標題是大衛的詩。詩人說神知道他的坐下起來、他往哪裡去都躲不開神的同在，連他在母腹中被造也在神眼中；最後求神鑒察他的心。","people":["david"]}],"people":["david","moses","solomon","bathsheba","nathan"],"verses":[{"ref":"詩 23:1","text":"耶和華是我的牧者，我必不致缺乏。"},{"ref":"詩 46:1","text":"神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。"},{"ref":"詩 90:12","text":"求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。"},{"ref":"詩 119:105","text":"你的話是我腳前的燈，是我路上的光。"}]}},{"t":"ot","id":"proverbs","order":20,"name":"箴言","abbr":"箴","chapters":31,"group":"詩歌智慧書","data":{"id":"proverbs","order":20,"name":"箴言","abbr":"箴","chapters":31,"group":"詩歌智慧書","oneLine":"敬畏耶和華是知識的開端：過日子的智慧短句","background":{"author":"多數是所羅門的箴言（箴 1:1；10:1），另收「智慧人的言語」、亞古珥與利慕伊勒王的言語","date":"約主前 10 世紀所羅門時代起；第 25～29 章是約主前 700 年前後希西家王的人所謄錄（箴 25:1）","audience":"開頭幾章以「我兒」稱呼，寫給年輕人；也是給所有想學智慧的人","place":"耶路撒冷（以色列王宮）","why":"列王紀說所羅門作箴言三千句（王上 4:32）。這卷書把關於說話、工作、金錢、家庭、交友、待人的智慧整理成短句，目的是「使人曉得智慧和訓誨」（箴 1:2）。"},"revelations":[{"key":"敬畏開端","point":"敬畏耶和華是知識的開端","explain":"這句話在 1:7 開頭、9:10 再說一次，是全書的主軸：智慧從與神的關係開始。","ref":"箴 1:7；9:10"},{"key":"專心仰賴","point":"不倚靠自己的聰明，凡事認定神","explain":"父親勸兒子專心仰賴耶和華，在一切所行的事上認定他，神必指引道路。","ref":"箴 3:5–6"},{"key":"兩條道路","point":"智慧與愚昧是兩條不同結局的路","explain":"書中常把智慧人與愚昧人、義人與惡人、殷勤人與懶惰人對照，說明各自的結果。","ref":"箴 4:10–19"},{"key":"慎言","point":"生死在舌頭的權下","explain":"箴言很多句子談說話：回答柔和使怒消退，多言多語難免有過，話說得合宜如金蘋果在銀網子裡。","ref":"箴 10:19；15:1；18:21；25:11"},{"key":"勤勞","point":"懶惰人要向螞蟻學智慧","explain":"螞蟻沒有元帥官長，卻在夏天預備食物；懶惰人貪睡，貧窮就像強盜來到。","ref":"箴 6:6–11"},{"key":"教養孩童","point":"從小教導當行的道","explain":"書中多次談父母的訓誨與管教，22:6 說教養孩童走當行的道，到老也不偏離。","ref":"箴 22:6"},{"key":"驕傲敗壞","point":"驕傲在敗壞以先","explain":"箴言多次警告驕傲與自以為聰明，提醒人要謙卑受教。","ref":"箴 16:18"}],"outline":[{"key":"父親訓誨","range":"1～9 章","point":"「我兒」的長篇勸勉，智慧被描寫成在街上呼喊的女子"},{"key":"所羅門箴言","range":"10:1～22:16","point":"所羅門的箴言，多為兩行對比的短句"},{"key":"智慧人言語","range":"22:17～24 章","point":"「智慧人的言語」，較長的勸戒"},{"key":"希西家謄錄","range":"25～29 章","point":"希西家王的人所謄錄的所羅門箴言"},{"key":"亞古珥言語","range":"30 章","point":"雅基的兒子亞古珥的言語，常用數字列舉"},{"key":"利慕伊勒王","range":"31 章","point":"利慕伊勒王母親的教訓，以及才德的婦人"}],"stories":[{"key":"智慧呼喊","title":"智慧在街市上呼喊","ref":"箴 1:20–33","summary":"智慧被描寫成一位女子，在街市、城門口大聲呼喊，問愚昧人要到幾時呢？她說聽從的必安然居住，輕看的到遭災時才求告，就找不著了。","people":[]},{"key":"察看螞蟻","title":"懶惰人去看螞蟻","ref":"箴 6:6–11","summary":"作者要懶惰人去察看螞蟻：沒有元帥、官長、君王，卻在夏天預備食物、收割時聚斂糧食。再睡片時、打盹片時，貧窮就像強盜來到。","people":[]},{"key":"智慧在創造","title":"智慧在創造之先","ref":"箴 8:22–31","summary":"智慧自述：在耶和華造化的起頭、未有大地以先就被立；神立高天、定海的界限時，智慧在旁作工師，天天喜悅。","people":[]},{"key":"兩個宴席","title":"智慧與愚昧的兩個邀請","ref":"箴 9","summary":"智慧建造房屋、鑿成七根柱子、擺設筵席，邀請愚蒙人來吃；另一邊愚昧的婦人也坐在高處呼叫，說偷來的水是甜的，但她的客人在陰間的深處。","people":[]},{"key":"才德婦人","title":"才德的婦人","ref":"箴 31:10–31","summary":"全書最後一段，在希伯來文中照字母順序排列。描寫一位婦人買田、種葡萄園、照顧家人、伸手幫助困苦人，她的丈夫在城門口被人認識；結尾說惟敬畏耶和華的婦女必得稱讚。","people":[]}],"people":["solomon","hezekiah"],"verses":[{"ref":"箴 1:7","text":"敬畏耶和華是知識的開端；愚妄人藐視智慧和訓誨。"},{"ref":"箴 3:5–6","text":"你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定他，他必指引你的路。"},{"ref":"箴 16:18","text":"驕傲在敗壞以先；狂心在跌倒之前。"},{"ref":"箴 22:6","text":"教養孩童，使他走當行的道，就是到老他也不偏離。"}]}},{"t":"ot","id":"ecclesiastes","order":21,"name":"傳道書","abbr":"傳","chapters":12,"group":"詩歌智慧書","data":{"id":"ecclesiastes","order":21,"name":"傳道書","abbr":"傳","chapters":12,"group":"詩歌智慧書","oneLine":"日光之下凡事虛空，所以要敬畏神","background":{"author":"書中作者自稱「在耶路撒冷作王、大衛的兒子、傳道者」（傳 1:1），傳統上認為是所羅門，也有不同看法","date":"傳統上認為約主前 10 世紀所羅門晚年，也有不同看法","audience":"書中沒有寫明對象，第 11～12 章對年輕人說話","place":"不確定，傳統上認為在耶路撒冷","why":"傳道者用自己的人生做實驗：追求智慧、享樂、事業、財富，結果發現在「日光之下」一切都像捕風。全書在這種反省中，最後落在「敬畏神，謹守他的誡命」。"},"revelations":[{"key":"虛空","point":"日光之下凡事都是虛空","explain":"「虛空的虛空」是全書的開頭與結尾（傳 1:2；12:8），指人在世上的勞碌像捕風一樣抓不住。","ref":"傳 1:2–11"},{"key":"人生實驗","point":"智慧、享樂、事業都不能滿足","explain":"傳道者說他建房屋、栽葡萄園、積金銀、得歌唱的男女，凡眼所求的都沒有留下不給，回頭一看都是虛空。","ref":"傳 2:1–11"},{"key":"凡事定時","point":"天下萬務都有定時","explain":"生有時、死有時，哭有時、笑有時，是全書最有名的一段；並說神造萬物
